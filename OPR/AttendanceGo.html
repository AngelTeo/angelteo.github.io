<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1,user-scalable=no">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<title>OPR-AttendanceGo v22</title>
<style>
:root{
  --layer:#8B6C2A;
  --d-srk:#C45C5C;--d-gak:#E8A04E;--d-atc:#7AB05A;--d-srt:#8B6CAE;
  --sur:#ffffff;--sur2:#f7f6f2;--bdr:#e0ddd6;
  --txt:#1a1a1a;--mut:#888888;--hint:#bbbbbb;
  --ok:#0F6E56;--warn:#854F0B;--danger:#A32D2D;--info:#236FAD;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:var(--sur2);color:var(--txt);font-size:13px;line-height:1.4}

/* NAV */
.nav{background:var(--layer);border-bottom:.5px solid rgba(0,0,0,.2);
  display:flex;align-items:center;padding:0 16px;position:sticky;top:0;z-index:50;overflow-x:auto;gap:0}
.nav-home{background:none;border:none;color:rgba(255,255,255,.6);font-size:15px;cursor:pointer;padding:11px 10px 11px 0;flex-shrink:0}
.nav-home:hover{color:#fff}
.nav-logo{font-size:13px;font-weight:600;padding:12px 14px 12px 0;border-right:.5px solid rgba(255,255,255,.2);margin-right:4px;white-space:nowrap;flex-shrink:0;color:#fff}
.ver{background:#F9CB42;color:var(--layer);border-radius:4px;padding:1px 6px;font-size:10px;font-weight:700;margin-left:4px;vertical-align:middle}
.ntab{padding:11px 14px;font-size:11px;color:rgba(255,255,255,.7);cursor:pointer;border:none;background:transparent;border-bottom:2.5px solid transparent;transition:all .15s;white-space:nowrap;flex-shrink:0;font-family:inherit}
.ntab:hover{color:#fff}
.ntab.on{color:#fff;border-bottom-color:#fff;font-weight:600}
.nav-r{margin-left:auto;display:flex;gap:5px;align-items:center;padding-left:10px;flex-shrink:0}
.btn-nav{padding:5px 12px;border-radius:6px;border:.5px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font-size:11px;font-weight:500;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-nav:hover{opacity:.85}
.saved{font-size:10px;color:rgba(255,255,255,.5);white-space:nowrap}

/* PAGES */
.page{display:none;padding:16px;max-width:1200px;margin:0 auto}
.page.on{display:block}

/* CARDS */
.card{background:var(--sur);border:.5px solid var(--bdr);border-radius:10px;padding:16px;margin-bottom:10px}

/* DEPT TABS */
.dept-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.dept-tab{padding:8px 16px;border-radius:8px;border:1.5px solid var(--bdr);background:var(--sur);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.dept-tab.on{color:#fff;border-color:transparent}
.dept-tab[data-dept="SRK"].on{background:var(--d-srk)}
.dept-tab[data-dept="GAK"].on{background:var(--d-gak)}
.dept-tab[data-dept="ATC"].on{background:var(--d-atc)}
.dept-tab[data-dept="SRT"].on{background:var(--d-srt)}

/* CLASS CARD */
.class-card{background:var(--sur);border:.5px solid var(--bdr);border-radius:10px;margin-bottom:8px;overflow:hidden}
.class-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.class-hdr:active{background:var(--sur2)}
.class-name{font-size:13px;font-weight:600}
.class-stat{font-size:11px;color:var(--mut)}
.class-body{display:none;border-top:.5px solid var(--bdr)}
.class-body.open{display:block}

/* STUDENT ROW */
.stu-row{display:flex;align-items:center;padding:10px 14px;border-bottom:.5px solid var(--bdr);gap:10px}
.stu-row:last-child{border-bottom:none}
.stu-name{flex:1;min-width:84px;font-size:12px;overflow-wrap:anywhere}
.stu-num{font-size:10px;color:var(--mut);width:24px;text-align:center;flex-shrink:0}
.stu-cn{font-size:10px;color:var(--mut)}
.fu-tag{display:inline-block;white-space:nowrap;font-size:9px;font-weight:700;color:#8A5A00;background:#FFF0C2;border:.5px solid #F2D178;border-radius:9px;padding:1px 7px;margin-left:6px;vertical-align:middle;cursor:pointer;flex-shrink:0}
.fu-tag.fu-ok{color:#1E6B4F;background:#E1F5EE;border-color:#9FE1CB}
.fu-ov{position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.fu-box{background:var(--sur);color:var(--txt);max-width:480px;width:100%;max-height:88vh;overflow:auto;border-radius:12px;padding:18px 20px;font-size:13px;line-height:1.5}
.fu-item{border:.5px solid var(--bdr);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.fu-item.fu-done{background:#E1F5EE;border-color:#9FE1CB}
.fu-item.fu-issue{background:#FFF8E1;border-color:#F9CB42}
.fu-item.fu-old{border-left:3px solid #C4622D}
.fu-btn{padding:5px 14px;border-radius:7px;border:1px solid var(--bdr);background:var(--sur);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.fu-btn.on-done{background:#2D6A4F;color:#fff;border-color:transparent}
.fu-btn.on-issue{background:#C4622D;color:#fff;border-color:transparent}
.stu-paused{display:inline-block;font-size:9px;color:#5A6270;background:#E8EAEE;border-radius:9px;padding:1px 7px;margin-left:6px;vertical-align:middle;flex-shrink:0}

/* STATUS TOGGLE */
.status-btn{display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.05;padding:4px 6px;border-radius:6px;font-weight:600;border:1.5px solid var(--bdr);background:var(--sur);cursor:pointer;font-family:inherit;min-width:30px;transition:all .1s;-webkit-tap-highlight-color:transparent}
.status-btn .sb-ic{font-size:12px}
.status-btn .sb-tx{font-size:8px;font-weight:500;opacity:.8}
.sb-wrap{display:flex;gap:4px;flex-shrink:0}
.status-btn.s-present{background:#E1F5EE;color:var(--ok);border-color:#9FE1CB}
.status-btn.s-absent{background:#FCEBEB;color:var(--danger);border-color:#F09595}
.status-btn.s-late{background:#FFF8E1;color:var(--warn);border-color:#F9CB42}
.status-btn.s-early_leave{background:#FFF0E6;color:#C4622D;border-color:#F0B896}
.status-btn.s-mc{background:#EEF2F7;color:var(--info);border-color:#AABDD4}

/* MARK ALL BAR */
.mark-all-bar{display:flex;gap:6px;padding:10px 14px;background:var(--sur2);align-items:center}
.mark-all-bar span{font-size:10px;color:var(--mut);margin-right:auto}

/* STATS GRID */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat-box{background:var(--sur);border:.5px solid var(--bdr);border-radius:8px;padding:12px 10px;text-align:center}
.stat-num{font-size:22px;font-weight:700}
.stat-label{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}

/* DEPT SUMMARY */
.dept-sum{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:.5px solid var(--bdr)}
.dept-sum:last-child{border-bottom:none}
.dept-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dept-info{flex:1}
.dept-info-name{font-size:12px;font-weight:600}
.dept-info-stat{font-size:10px;color:var(--mut)}
.pct-bar{width:80px;height:6px;background:var(--sur2);border-radius:3px;overflow:hidden;flex-shrink:0}
.pct-fill{height:100%;border-radius:3px;background:var(--ok);transition:width .3s}

/* DATE PICKER */
.date-input{padding:8px 12px;border:1px solid var(--bdr);border-radius:8px;font-size:13px;font-family:inherit}

/* AUTH */
#auth-screen{display:flex;justify-content:center;align-items:center;min-height:100vh;background:var(--sur2)}
#auth-box{background:var(--sur);border:1px solid var(--bdr);border-radius:12px;padding:32px 28px;width:340px;max-width:90vw;text-align:center}
#auth-box h2{font-size:18px;font-weight:600;margin-bottom:4px;color:var(--layer)}
#auth-box p{font-size:12px;color:var(--mut);margin-bottom:20px}
#auth-box input{width:100%;padding:10px 12px;border:1px solid var(--bdr);border-radius:8px;font-size:13px;margin-bottom:10px;font-family:inherit}
#auth-box button{width:100%;padding:10px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;margin-bottom:6px}
.btn-login{background:var(--layer);color:#fff}
.btn-magic{background:var(--sur2);color:var(--mut);border:1px solid var(--bdr)!important}
#auth-err{color:var(--danger);font-size:11px;min-height:16px;margin-bottom:8px}
#loading-screen{display:none;justify-content:center;align-items:center;min-height:60vh;font-size:13px;color:var(--mut)}
#app{display:none}

/* HOLIDAY BANNER */
.holiday-banner{background:#FFF8E1;border:1px solid #F9CB42;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--warn);font-weight:500}

/* HISTORY TABLE */
.hist-row{display:flex;align-items:center;padding:8px 14px;border-bottom:.5px solid var(--bdr);font-size:12px}
.hist-row:last-child{border-bottom:none}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--txt);color:#fff;
  padding:9px 18px;border-radius:8px;font-size:12px;font-weight:500;opacity:0;
  transition:opacity .25s,transform .25s;pointer-events:none;z-index:9999;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* MANAGE */
.mg-title{font-size:11px;font-weight:600;color:var(--mut);letter-spacing:.05em;text-transform:uppercase;margin-bottom:12px}
.mg-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:.5px solid var(--bdr);font-size:12px}
.mg-row:last-child{border-bottom:none}
.mg-row .k{color:var(--mut)}
.mg-row .v{font-weight:600}
.mg-code{font-size:11px;background:var(--sur2);padding:2px 6px;border-radius:3px;font-family:monospace}
.btn-pri{padding:8px 16px;border-radius:8px;border:none;background:var(--layer);color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}

@media(max-width:480px){.stat-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<div id="auth-screen">
  <div id="auth-box">
    <h2>AttendanceGo</h2>
    <p>Daily Attendance · Login</p>
    <div id="auth-err"></div>
    <input type="email" id="auth-email" placeholder="Email">
    <input type="password" id="auth-pass" placeholder="Password">
    <button class="btn-login" onclick="doLogin()">Sign In</button>
    <div style="display:flex;align-items:center;gap:12px;margin:4px 0"><div style="flex:1;height:1px;background:var(--bdr)"></div><span style="font-size:12px;color:var(--mut)">or</span><div style="flex:1;height:1px;background:var(--bdr)"></div></div>
    <button class="btn-magic" onclick="doMagicLink()">Send Magic Link</button>
  </div>
</div>

<div id="loading-screen">Loading data…</div>

<!-- NO ACCESS -->
<div id="no-access" style="display:none;min-height:100vh;background:var(--bg);justify-content:center;align-items:center">
  <div style="text-align:center;padding:40px">
    <div style="font-size:48px;margin-bottom:12px">🔒</div>
    <div style="font-size:18px;font-weight:600;color:var(--layer);margin-bottom:8px">No Access</div>
    <div style="font-size:12px;color:var(--mut)">You do not have permission to view this system.</div>
    <button onclick="location.href='/index.html'" style="margin-top:20px;padding:8px 20px;border-radius:8px;border:none;background:var(--layer);color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">← Back to Home</button>
  </div>
</div>

<div id="app">
  <div class="nav">
    <button class="nav-home" onclick="location.href='/index.html'">←</button>
    <div class="nav-logo">OPR-AttendanceGo <span class="ver">v22</span></div>
    <button class="ntab on" onclick="goPage('dashboard')">Dashboard</button>
    <button class="ntab" onclick="goPage('mark')">Mark</button>
    <button class="ntab" onclick="goPage('monthly')">Monthly</button>

  <div id="rule-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none;justify-content:center;align-items:center">
    <div style="background:#fff;border-radius:12px;padding:24px;width:320px;max-width:90vw">
      <div style="font-size:14px;font-weight:700;margin-bottom:4px" id="rm-title">Add Rule</div>
      <div style="font-size:11px;color:var(--mut);margin-bottom:16px" id="rm-subtitle"></div>
      <div style="margin-bottom:10px">
        <label style="font-size:11px;font-weight:600;display:block;margin-bottom:4px">Type</label>
        <select id="rm-type" style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--bdr);font-size:13px;font-family:inherit">
          <option value="absent">Absent</option><option value="early_leave">Early Leave</option><option value="late">Late</option>
        </select>
      </div>
      <div style="margin-bottom:10px">
        <label style="font-size:11px;font-weight:600;display:block;margin-bottom:4px">Start Date</label>
        <input type="date" id="rm-start" style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--bdr);font-size:13px;font-family:inherit">

        <input type="date" id="rm-end" style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--bdr);font-size:13px;font-family:inherit">
      </div>
      <div style="margin-bottom:10px">
        <label style="font-size:11px;font-weight:600;display:block;margin-bottom:4px">Reason (optional)</label>
        <input type="text" id="rm-reason" placeholder="e.g. tuition class" style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--bdr);font-size:13px;font-family:inherit">

      <div style="display:flex;gap:8px;margin-top:16px">

        <button onclick="submitRuleModal()" style="flex:1;padding:10px;border-radius:8px;border:none;background:var(--layer);color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">Add</button>
      </div>
    </div>
  </div>
  <!-- End rule modal -->
  <div id="end-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;justify-content:center;align-items:center">

      <div style="margin-bottom:10px">
        <label style="font-size:11px;font-weight:600;display:block;margin-bottom:4px">End Date</label>
        <input type="date" id="em-end" style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--bdr);font-size:13px;font-family:inherit">
      </div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button onclick="closeEndModal()" style="flex:1;padding:10px;border-radius:8px;border:1px solid var(--bdr);background:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">Cancel</button>
        <button onclick="submitEndModal()" style="flex:1;padding:10px;border-radius:8px;border:none;background:var(--warn);color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">End Rule</button>
        <button onclick="submitDeleteModal()" style="padding:10px;border-radius:8px;border:none;background:#A32D2D;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">Delete</button>
      </div>
    </div>
  </div>
  <div class="page" id="page-atcweek"><div id="atcweek-content"></div></div>
  <!-- v19 · 补课 / 换时段 modal -->

    <div style="background:#fff;border-radius:12px;padding:20px;width:400px;max-width:92vw;max-height:90vh;overflow:auto">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><div style="font-size:14px;font-weight:700" id="sw-title">Add visitor</div><button onclick="swClose()" style="border:none;background:none;font-size:18px;cursor:pointer;color:var(--mut)">✕</button></div>
      <div style="font-size:11px;color:var(--mut);margin-bottom:12px" id="sw-sub"></div>

      <div style="display:flex;gap:8px;margin-top:16px">
        <button onclick="swClose()" style="flex:1;min-height:44px;border-radius:8px;border:1px solid var(--bdr);background:var(--sur);font-size:13px;cursor:pointer;font-family:inherit">Cancel</button>
        <button id="sw-save" onclick="swSave()" style="flex:1;min-height:44px;border-radius:8px;border:none;background:var(--layer);color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">Save</button>
      </div>
    </div>
  </div>
  <div class="page" id="page-manage"><div id="manage-content"></div></div>

<script>
const SUPABASE_URL='https://qnpvqsvvsgsantekgfbz.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFucHZxc3Z2c2dzYW50ZWtnZmJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNzg4MzIsImV4cCI6MjA5MTc1NDgzMn0.8rfv0BQpWNNSD8yrhHNwCOkcG9q5_uMD7B7z_Y324a0';
const _sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const APP_VERSION=22;   /* v22 · ATC Week 列全班每个时段的状况 ＋ 每周都上不到的 Lesson 清单（Owner 10-06）。v21 候选已作废，跳号 */
/* v20 · ATC Week 与 Monthly 小字改英文（行政不读中文，Owner 10-05） */
const DEPTS=['SRK','GAK','ATC','SRT'];
const DEPT_COLORS={SRK:'var(--d-srk)',GAK:'var(--d-gak)',ATC:'var(--d-atc)',SRT:'var(--d-srt)'};
const STATUSES=['present','absent','late','early_leave','mc'];
const STATUS_LABELS={present:'✓',absent:'✕',late:'⏰',early_leave:'🚪',mc:'🤒'};
const STATUS_TX={present:'Present',absent:'Absent',late:'Late',early_leave:'Early',mc:'MC'};
const DAY_MAP={0:'SUN',1:'MON',2:'TUE',3:'WED',4:'THU',5:'FRI',6:'SAT'};

// ── State ──
let allStudents=[];     // from hub_students
let allMemberships=[];  // from hub_student_memberships
let allCalendar=[];     // from calendar_events
let todayRecords=[];    // from attendance table
let markerNames={};     // email → display_name lookup
let allRules=[];        // from attendance_rules
let currentSession=0;   // 0=single(SRK/GAK/SRT), 1=ATC功课班, 2=ATC上课班
let markClass='';       // selected class on Mark page
let markCategory='';   // selected category (SR/IN/JR/BB/A etc)
let currentDept='SRK';
let selectedDate=todayStr();
let userEmail='';

function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDate(ds){ return new Date(ds+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'}); }
function fmtTime(){ return new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }

// ── Auth ──
async function doLogin(){
  const email=document.getElementById('auth-email').value.trim();
  const pass=document.getElementById('auth-pass').value;
  document.getElementById('auth-err').textContent='';
  if(!email||!pass){document.getElementById('auth-err').textContent='Enter email and password';return;}
  const{error}=await _sb.auth.signInWithPassword({email,password:pass});
  if(error){document.getElementById('auth-err').textContent=error.message;return;}
  userEmail=email;
  initApp();
}
async function doMagicLink(){
  const email=document.getElementById('auth-email').value.trim();

      _sb.from('calendar_events').select('type,name,start_date,end_date,depts')

}

// ── Holiday check: returns matching holiday or null ──
// public_holiday / school_holiday / special_holiday / festival = no school
// extra_class = override, school ON even during holiday
const NO_SCHOOL_TYPES=['public_holiday','school_holiday','special_holiday','festival'];
function getHoliday(dateStr,dept){
  return allCalendar.find(ev=>{
    if(!NO_SCHOOL_TYPES.includes(ev.type)) return false;
    if(dateStr<ev.start_date) return false;
    if(ev.end_date&&dateStr>ev.end_date) return false;
    if(!ev.end_date&&dateStr!==ev.start_date) return false;
    // depts null = all; depts array = only listed
    if(ev.depts&&ev.depts.length>0&&!ev.depts.includes(dept)) return false;
    return true;
  })||null;
}
function hasExtraClass(dateStr,dept){
  return allCalendar.find(ev=>{
    if(ev.type!=='extra_class') return false;
    if(dateStr<ev.start_date) return false;
    if(ev.end_date&&dateStr>ev.end_date) return false;
    if(!ev.end_date&&dateStr!==ev.start_date) return false;
    if(ev.depts&&ev.depts.length>0&&!ev.depts.includes(dept)) return false;
    return true;
  })||null;
}
function getHolidayAllDepts(dateStr){
  return allCalendar.find(ev=>{
    if(!NO_SCHOOL_TYPES.includes(ev.type)) return false;
    if(dateStr<ev.start_date) return false;
    if(ev.end_date&&dateStr>ev.end_date) return false;
    if(!ev.end_date&&dateStr!==ev.start_date) return false;
    if(!ev.depts||ev.depts.length===0) return true;
    return false;
  })||null;
}

// ── Transfer helpers ──
// Find all memberships for a student that overlap a date range
function getOverlappingMems(studentId,dept,monthStart,monthEnd){
  return allMemberships.filter(m=>
    m.student_id===studentId&&m.dept===dept&&
    m.start_date<=monthEnd&&
    (m.end_date==null||m.end_date>=monthStart)
  );
}
// Find the new class after a transfer (same student, same dept, start_date near end_date)
function getTransferTarget(studentId,dept,endDate){
  return allMemberships.find(m=>
    m.student_id===studentId&&m.dept===dept&&
    m.start_date===endDate&&m.end_date==null
  )||null;
}

// ── Get students for a dept+class_code ──
function getClassStudents(dept,classCode){
  const mems=allMemberships.filter(m=>m.dept===dept&&m.class_code===classCode&&m.start_date<=selectedDate&&(m.end_date==null||m.end_date>=selectedDate));
  /* v10 · 同一个学生在同一班若有多笔生效班籍(资料错误)，只取一笔。
     不去重的後果：名册画出两列，但两列共用同一个
     attendance unique key (date,student_id,dept,session) ——
     点其中一列，另一列跟着变，而且班级人数会多算。
     取舍规则：座号小的优先(无座号排最後)，同座号取较早的 start_date。 */
  const _pick={};
  mems.forEach(function(m){
    const p=_pick[m.student_id];
    if(!p){ _pick[m.student_id]=m; return; }
    const a=(m.num==null?999:m.num), b=(p.num==null?999:p.num);
    if(a<b || (a===b && (m.start_date||'')<(p.start_date||''))) _pick[m.student_id]=m;
  });
  return Object.keys(_pick).map(function(k){ return _pick[k]; }).map(m=>{
    const stu=allStudents.find(s=>s.id===m.student_id);
    if(!stu) return null;
    /* v16 · 这一班、这一天是不是请假中（学生页课程那一行的 Pause 起讫日） */
    return{...stu,num:m.num,dept,class_code:classCode,_paused:memPausedOn(m,selectedDate),_pauseFrom:m.pause_from||null,_pauseTo:m.pause_to||null};
  }).filter(Boolean).sort((a,b)=>(a.num??999)-(b.num??999));
}

/* ═══ v12 · 请假（Paused）学生 ═══════════════════════════════════
   Owner 09-23 裁定第 5 项：名册照常列出、名字旁标「请假中」、不计缺席、
   月报与出席率不进分子分母、老师真要标照样标得下去。

   ⚠ 一个资料上的限制（不是 bug，是现在只能这样）：
   hub_students.status 只说「现在是不是请假」，没有请假的起讫日，
   所以「请假期间」只能用「现在是请假 ＋ 那一格没人点」来近似。
   要真正按期间排除，得先有带日期的请假栏位 —— 那是 SSOT 的事，未做。 */
/* v16 · 学生页 v35 起，请假记在「课程那一行」，有开始日（必填）和回来日（可空）。
   现在按日期判断：那一班、那一天在请假期间才算请假。回来日那天起就恢复正常。 */
/* v16 · 固定例外三种：迟到 / 早退 / 缺席（ATC 资料表 10-05 导入有「迟到」） */
function ruleLabel(t){ return t==='early_leave'?'EARLY':(t==='late'?'LATE':'ABS'); }
/* v18 · 点名纪录算哪一班：
   纪录的唯一键是 日期 + 学生 + 部门 + 节次（不含班级），Mark 画面也是这样找。
   可是纪录上写的 class_code 是「按下去那一班」。老师在旧班名单按 All ✓，纪录就写旧班，
   Monthly / Tracker 只找本班 class_code → 空白（10-03 SRT LV5 Celeste、Hng You Kai）。
   规则：纪录上那一班在那天还有效 → 照写的；否则 → 算那天学生实际在上的那一班（只有一班时）。 */
function attClassOf(r){
  /* v19 · 补课 / 换时段：在来访那班点的，算回原本那一班 */
  const sw=allSwaps.find(w=>w.student_id===r.student_id&&w.dept===r.dept&&w.to_date===r.date&&w.to_class===r.class_code);
  if(sw) return sw.from_class;
  const ms=allMemberships.filter(m=>m.student_id===r.student_id&&m.dept===r.dept);
  if(ms.some(m=>m.class_code===r.class_code&&m.start_date<=r.date&&(m.end_date==null||m.end_date>=r.date))) return r.class_code;
  const live=ms.filter(m=>m.start_date<=r.date&&(m.end_date==null||m.end_date>r.date)&&!String(m.class_code||'').includes('RSVP'));
  return live.length===1?live[0].class_code:r.class_code;
}
function memPausedOn(m,d){ return !!(m&&m.pause_from&&m.pause_from<=d&&(!m.pause_to||m.pause_to>d)); }
function isPausedStu(s){
  if(!s) return false;
  if('_paused' in s) return !!s._paused;   /* 点名名册：看这一班、这一天 */
  /* 首页总数：这个学生那天在上的班全部请假中，才不算进分母 */
  const live=allMemberships.filter(m=>m.student_id===s.id&&m.start_date<=selectedDate&&(m.end_date==null||m.end_date>selectedDate)&&!String(m.class_code||'').includes('RSVP'));
  if(live.length) return live.every(m=>memPausedOn(m,selectedDate));
  return String(s.status||'').toLowerCase()==='paused';
}
function pauseText(s){
  if(s&&s._pauseTo) return 'back on '+s._pauseTo;
  if(s&&'_paused' in s&&s._paused) return 'return date not set';
  return String((s&&s.status_note)||'').trim();
}
function _escHtml(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
/* 灰底小标签：「请假中 · 几时回来」。说明取自 status_note（学生页写的） */
function pausedTag(s){
  if(!isPausedStu(s)) return '';
  const note=pauseText(s);   /* v16 */
  /* 标签本身保持短 —— 手机上一行放不下长备注（375px 会把整列撑出画面）。
     完整备注放 tooltip，点名列另外用下面那行小字显示。 */
  return '<span class="stu-paused" title="'+_escHtml(note||'On leave (paused)')+'">On leave</span>';
}
/* 「几时回来」独立一行小字，照这个档既有的缺席备注做法 */
function pausedNote(s){
  if(!isPausedStu(s)) return '';
  const note=pauseText(s);   /* v16 */
  return note ? '<div style="font-size:9px;color:var(--mut);margin-top:2px">On leave · '+_escHtml(note)+'</div>' : '';
}
/* 该不该算进「还没点名」的分母：请假的不算 —— 除非今天真的已经有人帮他点了。
   （第 5 项第 3 点：不自动算 absent、Dashboard 未点名不要把他算进去；
     第 5 点：请假期间突然来了，照常点得下去，点了就算。） */
function countsForMarking(s,dept,session){
  return !isPausedStu(s) || getStatus(s.id,dept,session)!=='unmarked';
}
function expectedCount(list,dept,session){
  return list.filter(s=>countsForMarking(s,dept,session)).length;
}

/* ═══════════════════════════════════════════════════════════════
   v14 · 返校 Follow-Up（第一期：只做 SRK）
   规则：这一轮，这个孩子做过了没有？没做过 ＋ 今天他来了 → 亮灯。
   不是看他哪天缺席 —— 周一做过的人，周四回来不用再做。
   ═══════════════════════════════════════════════════════════════ */
let allFuTasks = [];     // followup_task（设定）
let fuRecords  = [];      // followup_record（本周 ＋ 未结的待办）
let fuBusy     = false;

/* ── 这一周的上课日清单（周一起算，排除周末与假期） ── */
function fuWeekMonday(dateStr){
  const d = new Date(dateStr + 'T12:00:00');
  const dow = d.getDay();                 // 0=Sun
  const back = (dow === 0) ? 6 : dow - 1; // 回到周一
  d.setDate(d.getDate() - back);
  return d.toISOString().slice(0, 10);
}
function fuIsSchoolDay(dateStr, dept){
  const dow = new Date(dateStr + 'T12:00:00').getDay();
  if ((dow === 0 || dow === 6) && dept !== 'SRT') return false;
  const hol = getHoliday(dateStr, dept);
  if (hol && !hasExtraClass(dateStr, dept)) return false;
  return true;
}
function fuSchoolDaysOfWeek(dateStr, dept){
  const mon = fuWeekMonday(dateStr), out = [];
  for (let i = 0; i < 7; i++){
    const d = new Date(mon + 'T12:00:00'); d.setDate(d.getDate() + i);
    const ds = d.toISOString().slice(0, 10);
    if (fuIsSchoolDay(ds, dept)) out.push(ds);
  }
  return out;
}
/* ISO 週數 —— cycle_key 用它当「哪一周」 */
function fuIsoWeek(dateStr){
  const d = new Date(dateStr + 'T12:00:00');
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dn = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - dn);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  const wk = Math.ceil(((t - y0) / 86400000 + 1) / 7);
  return t.getUTCFullYear() + 'W' + String(wk).padStart(2, '0');
}
function fuCycleKey(dept, dateStr, nth, session){
  return dept + '-' + fuIsoWeek(dateStr) + '-D' + nth + (session ? '-S' + session : '');
}

/* ── 今天该做哪几项（含补做） ──
   任务的到期日 = 这周第 nth 个上课日。到期日 <= 今天 且今天是上课日 → 该做。
   到期日已过而还没做 → 今天补做（Owner 裁定 1：整周没来的回来那天全补）。
   那周上课日不够（长假）→ 全部挤在最后一个上课日（Owner 裁定 2：顺延到同一天）。 */
function fuDueTasks(dept, dateStr, session){
  if (!fuIsSchoolDay(dateStr, dept)) return [];
  const days = fuSchoolDaysOfWeek(dateStr, dept);
  const idx  = days.indexOf(dateStr);
  if (idx < 0) return [];
  const out = [];
  allFuTasks.forEach(t => {
    if (t.dept !== dept || !t.is_active) return;
    if ((t.session ?? 0) !== (session ?? 0)) return;
    /* 第一期只做 weekly_nth_day。after_absence 是 SRT 的路，排在第三期，
       而且「MC 算不算缺席」Owner 还没裁示 —— 没定之前不猜，直接跳过。 */
    if (t.trigger_type !== 'weekly_nth_day') return;
    let due = days[(t.nth_day || 1) - 1];
    if (!due) due = days[days.length - 1];   // 长假顺延
    if (!due || due > dateStr) return;        // 还没到期
    out.push(Object.assign({}, t, { due_date: due, cycle_key: fuCycleKey(dept, dateStr, t.nth_day || 1, t.session || 0) }));
  });
  return out.sort((a, b) => (a.nth_day - b.nth_day) || (a.sort_order - b.sort_order));
}

function fuRecOf(stuId, classCode, cycleKey, taskId){
  return fuRecords.find(r => r.student_id === stuId && r.class_code === classCode
    && r.cycle_key === cycleKey && r.task_id === taskId);
}
/* 未结的待办：以前按了「有问题」还没人结掉的，隔天继续亮 */
function fuOpenIssues(stuId, classCode, exceptCycle){
  return fuRecords.filter(r => r.student_id === stuId && r.class_code === classCode
    && r.result === 'issue' && !r.resolved_at && r.cycle_key !== exceptCycle);
}
/* 这个学生今天还差几项（含旧待办） */
function fuPending(stu, dept, classCode, dateStr, session){
  const due = fuDueTasks(dept, dateStr, session);
  let n = 0;
  due.forEach(t => { if (!fuRecOf(stu.id, classCode, t.cycle_key, t.task_id ?? t.id)) n++; });
  const cyc = due.length ? due[0].cycle_key : '';
  n += fuOpenIssues(stu.id, classCode, cyc).length;
  return n;
}
/* 这一班的 Follow-Up 全做完了没 —— 班级那个 ✓ 要看它（Owner 裁定：不做完点名不算完成） */
function fuClassDone(students, dept, classCode, dateStr, session){
  if (!fuDueTasks(dept, dateStr, session).length) return true;
  return students.every(s => !countsForMarking(s, dept, session) || fuPending(s, dept, classCode, dateStr, session) === 0);
}

/* ── 载入 ── */
async function fuLoadTasks(){
  try{
    const { data, error } = await _sb.from('followup_task').select('*').eq('is_active', true);
    if (error) throw error;
    allFuTasks = data || [];
  }catch(e){ console.warn('[Follow-Up] 读不到设定表：', e.message); allFuTasks = []; }
}
async function fuLoadRecords(dateStr){
  /* 分两次查，不用 .or() ——
     or() 里塞 like ＋ and() 的字串语法很容易写错而且不会报错，
     只会安静地回传错东西。两个单条件查询各自明确，合并去重就好。 */
  try{
    const wk = fuIsoWeek(dateStr);
    const [thisWeek, openIssues] = await Promise.all([
      _sb.from('followup_record').select('*').like('cycle_key', '%' + wk + '%'),
      _sb.from('followup_record').select('*').eq('result', 'issue').is('resolved_at', null)
    ]);
    if (thisWeek.error) throw thisWeek.error;
    if (openIssues.error) throw openIssues.error;
    const seen = new Set(), merged = [];
    [].concat(thisWeek.data || [], openIssues.data || []).forEach(r => {
      if (seen.has(r.id)) return; seen.add(r.id); merged.push(r);
    });
    fuRecords = merged;
  }catch(e){ console.warn('[Follow-Up] 读不到纪录：', e.message); fuRecords = []; }
}

/* ── 写入 ── */
async function fuMark(stu, dept, classCode, session, task, result, note){
  if (fuBusy) return false;
  fuBusy = true;
  try{
    const row = {
      student_id: stu.id, dept: dept, class_code: classCode, session: session ?? 0,
      task_id: task.task_id ?? task.id, cycle_key: task.cycle_key,
      due_date: task.due_date, done_date: selectedDate,
      result: result, note: note || null,
      marked_by: userEmail || null, marked_at: new Date().toISOString()
    };
    const { data, error } = await _sb.from('followup_record')
      .upsert(row, { onConflict: 'student_id,class_code,cycle_key,task_id' }).select();
    if (error) throw error;
    const saved = (data && data[0]) ? data[0] : row;
    const i = fuRecords.findIndex(r => r.student_id === row.student_id && r.class_code === row.class_code
      && r.cycle_key === row.cycle_key && r.task_id === row.task_id);
    if (i >= 0) fuRecords[i] = saved; else fuRecords.push(saved);
    return true;
  }catch(e){
    console.error('[Follow-Up] 存不进云端：', e.message);
    if (typeof toast === 'function') toast('❌ NOT SAVED — ' + (e.message || 'unknown'), 12000);
    return false;
  }finally{ fuBusy = false; }
}
/* 结掉旧待办 —— 任何老师都能结，但记是谁结的（Owner 裁定 4） */
async function fuResolve(rec){
  if (fuBusy) return false;
  fuBusy = true;
  try{
    const { error } = await _sb.from('followup_record')
      .update({ resolved_by: userEmail || null, resolved_at: new Date().toISOString() })
      .eq('id', rec.id);
    if (error) throw error;
    rec.resolved_at = new Date().toISOString(); rec.resolved_by = userEmail || null;
    return true;
  }catch(e){
    console.error('[Follow-Up] 结不掉：', e.message);
    if (typeof toast === 'function') toast('❌ NOT SAVED — ' + (e.message || 'unknown'), 12000);
    return false;
  }finally{ fuBusy = false; }
}

/* ── 老师看到的清单 ── */
function fuOpen(stuId, classCode){
  const students = getClassStudents(currentDept, classCode);
  const stu = students.find(x => x.id === stuId);
  if (!stu) return;
  const dept = currentDept, sess = currentSession, date = selectedDate;
  const due = fuDueTasks(dept, date, sess);
  const cyc = due.length ? due[0].cycle_key : '';
  const olds = fuOpenIssues(stuId, classCode, cyc);

  const ov = document.createElement('div'); ov.className = 'fu-ov'; ov.id = 'fu-ov';
  function paint(){
    let h = '<div class="fu-box"><div style="font-weight:700;font-size:15px;margin-bottom:2px">' + _escHtml(stu.name) + '</div>'
      + '<div style="font-size:11px;color:var(--mut);margin-bottom:14px">Follow-Up &middot; ' + _escHtml(classCode) + '</div>';
    due.forEach(t => {
      const tid = t.task_id ?? t.id;
      const r = fuRecOf(stuId, classCode, t.cycle_key, tid);
      const st = r ? r.result : '';
      h += '<div class="fu-item ' + (st === 'done' ? 'fu-done' : st === 'issue' ? 'fu-issue' : '') + '">'
        + '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'
        + '<span style="flex:1;font-weight:600;min-width:120px">' + _escHtml(t.item_label) + '</span>'
        + '<button class="fu-btn ' + (st === 'done' ? 'on-done' : '') + '" data-a="done" data-t="' + tid + '">Done</button>'
        + '<button class="fu-btn ' + (st === 'issue' ? 'on-issue' : '') + '" data-a="issue" data-t="' + tid + '">Issue</button>'
        + '</div>'
        + (st === 'issue' ? '<input class="fu-note" data-t="' + tid + '" type="text" placeholder="What is the problem? (optional)" value="' + _escHtml((r && r.note) || '') + '" style="width:100%;margin-top:8px;padding:6px 8px;border:.5px solid var(--bdr);border-radius:6px;font-size:12px;font-family:inherit">' : '')
        + '</div>';
    });
    olds.forEach(r => {
      const t = allFuTasks.find(x => x.id === r.task_id);
      h += '<div class="fu-item fu-old">'
        + '<div style="font-size:10px;color:#C4622D;font-weight:700;margin-bottom:4px">From ' + _escHtml(r.due_date) + '</div>'
        + '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'
        + '<span style="flex:1;font-weight:600;min-width:120px">' + _escHtml(t ? t.item_label : r.task_id) + '</span>'
        + '<button class="fu-btn" data-a="resolve" data-r="' + r.id + '">Resolved</button></div>'
        + (r.note ? '<div style="font-size:11px;color:var(--mut);margin-top:6px">' + _escHtml(r.note) + '</div>' : '')
        + '</div>';
    });
    if (!due.length && !olds.length) h += '<div style="color:var(--mut);padding:10px 0">Nothing to follow up today.</div>';
    h += '<div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="fu-btn" id="fu-close">Close</button></div></div>';
    ov.innerHTML = h;
  }
  paint();
  ov.addEventListener('click', async ev => {
    const b = ev.target.closest('button'); if (!b) return;
    if (b.id === 'fu-close'){ ov.remove(); renderMark(); return; }
    const act = b.getAttribute('data-a');
    if (act === 'resolve'){
      const rec = fuRecords.find(x => String(x.id) === b.getAttribute('data-r'));
      if (rec && await fuResolve(rec)){ const i = olds.indexOf(rec); if (i >= 0) olds.splice(i, 1); paint(); }
      return;
    }
    const tid = b.getAttribute('data-t');
    const t = due.find(x => (x.task_id ?? x.id) === tid); if (!t) return;
    const noteEl = ov.querySelector('.fu-note[data-t="' + tid + '"]');
    await fuMark(stu, dept, classCode, sess, t, act, noteEl ? noteEl.value.trim() : '');
    paint();
  });
  /* 备注：打字就存，不必按任何按钮（§00A3 规则一） */
  let noteT = null;
  ov.addEventListener('input', ev => {
    const el = ev.target.closest('.fu-note'); if (!el) return;
    clearTimeout(noteT);
    noteT = setTimeout(async () => {
      const tid = el.getAttribute('data-t');
      const t = due.find(x => (x.task_id ?? x.id) === tid); if (!t) return;
      await fuMark(stu, dept, classCode, sess, t, 'issue', el.value.trim());
    }, 800);

  document.body.appendChild(ov);
}
function fuTag(stu, classCode){
  const nPend = fuPending(stu, currentDept, classCode, selectedDate, currentSession);
  const due = fuDueTasks(currentDept, selectedDate, currentSession);
  if (!due.length && !fuOpenIssues(stu.id, classCode, '').length) return '';
  if (nPend === 0) return '<span class="fu-tag fu-ok" onclick="event.stopPropagation();fuOpen(\'' + stu.id + '\',\'' + classCode + '\')">Follow-Up \u2713</span>';
  return '<span class="fu-tag" onclick="event.stopPropagation();fuOpen(\'' + stu.id + '\',\'' + classCode + '\')">Follow-Up (' + nPend + ')</span>';

// ── Get attendance status for a student ──
function getStatus(studentId,dept,session){
  const s=session??currentSession;
  const rec=todayRecords.find(r=>r.student_id===studentId&&r.dept===dept&&(r.session??0)===s);
  return rec?rec.status:'unmarked';
}

// ── Get attendance rule for a student on a given day/session ──
function getRule(studentId,dept,dayOfWeek,session,dateStr){
  const s=session??currentSession;
  const d=dateStr||selectedDate;
  return allRules.find(r=>r.student_id===studentId&&r.dept===dept&&r.day_of_week===dayOfWeek&&(r.session===0||r.session===s)&&r.is_active&&r.start_date<=d&&(!r.end_date||r.end_date>=d))||null;
}

// ── SRT: check if class has session today ──
function isSRTToday(classCode){
  // class_code like SRT_LV10_SAT_AM (D40 new format) or legacy SRT-LV10.SAT.AM
  const parts=classCode.replace(/^SRT[-_]/,'').split(/[._]/);
  // Day is the part matching MON/TUE/WED/THU/FRI/SAT/SUN
  const DAYS=['MON','TUE','WED','THU','FRI','SAT','SUN'];
  const dayPart=parts.find(p=>DAYS.includes(p));
  if(!dayPart) return false;
  const today=DAY_MAP[new Date(selectedDate+'T12:00:00').getDay()];
  return dayPart===today;
}

// ── Get unique classes for dept from memberships ──
function getDeptClasses(dept,filterToday=true){
  const codes=[...new Set(allMemberships.filter(m=>m.dept===dept&&m.start_date<=selectedDate&&(m.end_date==null||m.end_date>=selectedDate)).map(m=>m.class_code))];
  let sorted=codes.sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  if(dept==='SRT'&&filterToday) sorted=sorted.filter(c=>isSRTToday(c));
  sorted=sorted.filter(c=>!c.includes('RSVP'));
  return sorted;
}

// ── Navigation ──
// Category extraction: SRK_SR_1→SR, GAK-GAK_BB_1→BB, ATC_A1→A, SRT_LV1_SAT_AM→LV1
function extractCat(code){
  const p=code.split('_');
  if(p.length>=3) return p[1];
  if(p.length===2) return p[1].replace(/\d+$/,'');
  return '';
}
function shortClassName(code){
  const parts=code.split('_');
  return parts.length>=4?parts.slice(2).join('_'):parts.pop();
}

function goPage(p){
  document.querySelectorAll('.page').forEach(el=>el.classList.remove('on'));
  document.querySelectorAll('.ntab').forEach(el=>el.classList.remove('on'));
  document.getElementById('page-'+p).classList.add('on');
  const map={dashboard:0,mark:1,monthly:2,tracker:3,rules:4,atcweek:5,manage:6};   /* v17 · 加 ATC Week */

}

let allTimetable=[];

function awEsc(s){ return String(s==null?'':s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }

/* 学生每周固定上不到的 Lesson（Mon–Fri，不看上面的 Day 筛选） */

/* ═══ v19 · SRT 补课 / 临时换时段（Owner 10-05 定稿）═══════════════════
   Replacement（补课）：X 日没来自己的班，Y 日去别班 / 别的时段补。原本 X 日照样缺席，标「已补」。
   Temp（临时换时段）：那一天改上别的时段。原本那班当天显示「换到…」，不能点、不算缺席。
   来访学生在去的那班名单最下面，照样点名，但不进那班出席率（attClassOf 算回原本那班）。

let allSwaps=[];

function swMadeUp(stuId,cls,date){ return allSwaps.find(w=>w.status==='active'&&w.kind==='replacement'&&w.student_id===stuId&&w.from_class===cls&&w.from_date===date)||null; }

function swMarkFor(stuId,cls,date,status){
  const into=allSwaps.find(w=>w.status==='active'&&w.student_id===stuId&&w.from_class===cls&&w.to_date===date);

  if(error){ console.error(error); toast('✕ Save failed'); return; }
  allSwaps.push({status:'active',created_by:userEmail,...row,...((data&&data[0])||{})});
  swClose(); toast('✓ Saved');
  if(document.getElementById('page-mark').classList.contains('on')) renderMark();

}
async function swCancel(id){
  const w=allSwaps.find(x=>x.id===id); if(!w) return;
  if(!confirm('Cancel this arrangement? (A mark already saved stays.)')) return;
  const{error}=await _sb.from('attendance_swap').update({status:'cancelled'}).eq('id',id);
  if(error){ console.error(error); toast('✕ Cancel failed'); return; }
  allSwaps=allSwaps.filter(x=>x.id!==id); toast('✓ Cancelled'); swRenderAdmin();
}

  // 3 stat boxes (Absent / Late / MC) with dept breakdown
  h+=`<div class="stat-grid" style="grid-template-columns:repeat(4,1fr)">`;
  const statCfg=[
    {key:'absent',label:'ABSENT',color:'var(--danger)',icon:'✕'},
    {key:'late',label:'LATE',color:'var(--warn)',icon:'⏰'},
    {key:'early_leave',label:'EARLY',color:'#C4622D',icon:'🚪'},
    {key:'mc',label:'MC',color:'var(--info)',icon:'🤒'}

  statCfg.forEach(cfg=>{

  const arr=todayRecords.filter(r=>r.status===status);

  let h=`<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">

// Contact parents: 2+ consecutive absent without reason
async function loadContactParents(){
  const el=document.getElementById('contact-parents');
  if(!el) return;
  // Get yesterday's date (skip weekends simply)
  const today=new Date(selectedDate+'T12:00:00');
  const prev=new Date(today);
  prev.setDate(prev.getDate()-1);
  // Skip Sunday→Friday, Saturday→Friday
  if(prev.getDay()===0) prev.setDate(prev.getDate()-2);
  if(prev.getDay()===6) prev.setDate(prev.getDate()-1);
  const prevDate=prev.getFullYear()+'-'+String(prev.getMonth()+1).padStart(2,'0')+'-'+String(prev.getDate()).padStart(2,'0');

  const{data:prevRecs}=await _sb.from('attendance').select('student_id,student_name,dept,class_code,note').eq('date',prevDate).eq('status','absent');
  const prevAbsent=prevRecs||[];

  // Today's absent without reason
  const todayAbsent=todayRecords.filter(r=>r.status==='absent'&&!r.note);

  // Find students absent BOTH days without reason
  const needContact=[];
  todayAbsent.forEach(t=>{
    const prev=prevAbsent.find(p=>p.student_id===t.student_id&&p.dept===t.dept&&!p.note);
    if(prev) needContact.push(t);
  });

  if(!needContact.length){
    el.innerHTML='<div style="font-size:11px;color:var(--ok);padding:4px 0">✓ No students need contacting</div>';
    return;
  }
  let h='';
  needContact.forEach(r=>{
    h+=`<div style="display:flex;align-items:center;padding:6px 0;border-bottom:.5px solid var(--bdr);font-size:12px">
      <div class="dept-dot" style="background:${DEPT_COLORS[r.dept]};margin-right:8px"></div>
      <div style="flex:1;font-weight:500">${r.student_name}</div>
      <div style="font-size:10px;color:var(--mut)">${r.dept} · ${r.class_code}</div>
    </div>`;
  });
  el.innerHTML=h;
}

    if(extra){

    }else{
      h+=`<div class="holiday-banner">🏖 <strong>${currentDept}</strong> holiday — <strong>${markHoliday.name}</strong>. No attendance needed.</div>`;
      el.innerHTML=h;return;
    }
  }

  // Class list

  // ATC session tabs
  if(currentDept==='ATC'){
    if(currentSession===0) currentSession=1; // default to S1
    h+=`<div style="display:flex;gap:6px;margin-bottom:14px">
      <button class="dept-tab${currentSession===1?' on':''}" style="${currentSession===1?'background:var(--d-atc);color:#fff;border-color:transparent':''}" onclick="switchSession(1)">S1: Homework 1:30-3:30</button>
      <button class="dept-tab${currentSession===2?' on':''}" style="${currentSession===2?'background:var(--d-atc);color:#fff;border-color:transparent':''}" onclick="switchSession(2)">S2: Lesson 3:30-5:30</button>
    </div>`;
  }else{
    currentSession=0;
  }

  const _dayOfWeek=new Date(selectedDate+'T12:00:00').getDay();

  // Classes for current dept
  const classes=getDeptClasses(currentDept);  if(!classes.length){
    h+=`<div class="card" style="text-align:center;color:var(--mut);padding:24px">`;
    h+=currentDept==='SRT'?'No SRT classes scheduled today':'No classes in this department';
    h+=`</div>`;
  }else{
    // Use global extractCat
    const cats=[...new Set(classes.map(c=>extractCat(c)))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
    if(!markCategory||!cats.includes(markCategory)) markCategory=cats[0]||'';
    const filteredClasses=classes.filter(c=>extractCat(c)===markCategory);
    if(!markClass||!filteredClasses.includes(markClass)) markClass=filteredClasses[0]||'';

    // Row 2: Category buttons
    h+=`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">`;
    cats.forEach(cat=>{
      const isOn=cat===markCategory;
      h+=`<button style="padding:5px 14px;border-radius:8px;border:1px solid ${isOn?'transparent':'var(--bdr)'};background:${isOn?'var(--mut)':'var(--sur)'};color:${isOn?'#fff':'var(--txt)'};font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;text-transform:uppercase" onclick="switchMarkCat('${cat}')">${cat}</button>`;
    });
    h+=`</div>`;

    // Row 3: Class buttons within category
    h+=`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">`;
    filteredClasses.forEach(code=>{
      const sts=getClassStudents(currentDept,code).filter(s=>!swAwayOn(s.id,code,selectedDate));   /* v19 */
      const mc=sts.filter(s=>getStatus(s.id,currentDept,currentSession)!=='unmarked').length;
      const _exp=expectedCount(sts,currentDept,currentSession);   /* v12 · 请假的不算，否则这班永远点不完 */
      /* v14 · Follow-Up 没做完，这班点名不算完成（Owner 27-09 裁定） */

      const isOn=code===markClass;
      const shortName=shortClassName(code);
      h+=`<button style="padding:6px 12px;border-radius:8px;border:1px solid ${isOn?'transparent':'var(--bdr)'};background:${isOn?'var(--txt)':'var(--sur)'};color:${isOn?'#fff':'var(--txt)'};font-size:12px;font-weight:600;cursor:pointer;font-family:inherit" onclick="switchMarkClass('${code}')">${shortName} <span style="font-size:10px;opacity:.7">${done?'\u2713':mc+'/'+_exp}</span></button>`;
    });
    h+=`</div>`;

    // Show selected class only
    const code=markClass;
    const students=getClassStudents(currentDept,code);
    const homeStu=students.filter(s=>!swAwayOn(s.id,code,selectedDate));   /* v19 · 今天换去别的时段的，不算这一班 */
    const markedCount=homeStu.filter(s=>getStatus(s.id,currentDept,currentSession)!=='unmarked').length;
    const expectCount=expectedCount(homeStu,currentDept,currentSession);   /* v12 · 请假的不算进分母 */
    const fuOk=fuClassDone(students,currentDept,code,selectedDate,currentSession);   /* v14 */
    const allMarked=markedCount===expectCount&&expectCount>0&&fuOk;
    h+=`<div class="card" style="padding:0">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--bdr)">

        <div class="mark-all-bar"><span>Quick:</span>
          <button class="status-btn s-present" onclick="markAll('${currentDept}','${code}','present')">All \u2713</button>
        </div>`;
    students.forEach(s=>{
      const st=getStatus(s.id,currentDept,currentSession);
      const active=st==='unmarked'?'':st;
      const rec=todayRecords.find(r=>r.student_id===s.id&&r.dept===currentDept&&(r.session??0)===currentSession);
      const note=rec?.note||'';
      const rule=getRule(s.id,currentDept,_dayOfWeek,currentSession);
      const ruleStyle=rule&&active===''?'background:rgba(0,0,0,.04);opacity:.6':'';
      const ruleTag=rule&&active===''?`<span style="font-size:9px;color:var(--mut);margin-left:6px" title="${rule.reason||''}">${ruleLabel(rule.rule_type)}${rule.reason?' \u00b7 '+rule.reason:''}</span>`:'';
      const mem=allMemberships.find(m=>m.student_id===s.id&&m.dept===currentDept&&m.class_code===code);
      const isTransferDay=mem&&mem.end_date===selectedDate;
      const away=swAwayOn(s.id,code,selectedDate);            /* v19 */
      const madeUp=swMadeUp(s.id,code,selectedDate);          /* v19 */
      const transferTo=isTransferDay?getTransferTarget(s.id,currentDept,mem.end_date):null;
      const transferTag=isTransferDay?'<span style="font-size:9px;color:#7870CC;margin-left:6px">\u2192 '+(transferTo?transferTo.class_code:'Moved')+'</span>':'';
      const lateMatch=(note||'').match(/Late:\s*(\d{1,2}:\d{2})/);
      /* v15 · 迟到时间只在「现在是 Late」时显示，放在按钮下面那行小字 —— 按钮宽度固定，名字不会被挤成一字一行 */
      const lateTx=(active==='late'&&lateMatch)?lateMatch[1]:'';
      const LABELS_ROW={present:'\u2713',absent:'\u2715',late:'\u23f0',early_leave:'\ud83d\udeaa',mc:'\ud83e\udd12'};
      const showNote=note&&(active==='absent'||active==='early_leave')&&!isTransferDay;
      h+=`<div class="stu-row" style="${ruleStyle}${(isTransferDay||away)?'opacity:.5':''}">
        <div class="stu-num">${s.num??''}</div>
        <div class="stu-name">${s.name}${s.name_cn?' <span class="stu-cn">'+s.name_cn+'</span>':''}${pausedTag(s)}${fuTag(s,code)}${ruleTag}${transferTag}${showNote?'<div style="font-size:9px;color:var(--danger);margin-top:2px">'+note+'</div>':''}${madeUp?'<div style="font-size:9px;color:#7870CC;margin-top:2px">Made up → '+_escHtml(madeUp.to_date+' '+swCls(madeUp.to_class))+'</div>':''}${pausedNote(s)}</div>
        ${away

          ?'<div style="font-size:10px;color:#7870CC;font-weight:600;white-space:nowrap">Class changed</div>'
          :`<div class="sb-wrap">${STATUSES.map(status=>
            `<button class="status-btn${active===status?' s-'+status:''}" onclick="markStudent('${s.id}','${s.name}','${currentDept}','${code}','${status}')"><span class="sb-ic">${LABELS_ROW[status]}</span><span class="sb-tx">${status==='late'&&lateTx?lateTx:STATUS_TX[status]}</span></button>`
          ).join('')}</div>`}
      </div>`;
    });
    if(currentDept==='SRT') h+=swVisitorsHtml(code);   /* v19 · 来访：补课 / 临时换时段 */
    h+=`</div></div>`;
  }
  el.innerHTML=h;

async function markStudent(studentId,studentName,dept,classCode,status){
  let note='';
  const _dow=new Date(selectedDate+'T12:00:00').getDay();
  const rule=getRule(studentId,dept,_dow,currentSession,selectedDate);
  if(status==='present'&&rule){
    const reason=prompt(studentName+' is expected '+rule.rule_type.replace('_',' ')+'.\n\nReason for attending:','');
    if(reason===null) return;
    note=reason?'Override: '+reason:'Override: no reason given';
  }
  if(status==='late'){
    const now=new Date();
    const timeStr=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
    const input=prompt('Late time:',timeStr);
    if(input===null) return; // cancelled
    note='Late: '+input;
  }
  if(status==='absent'){
    const reason=prompt('Reason for absence (activity / tuition — you can leave this blank):','');
    if(reason===null) return;
    if(reason) note=reason;
  }
  if(status==='early_leave'){
    const reason=prompt('Left early — what time and why? (e.g. 3:30 piano — you can leave this blank):','');
    if(reason===null) return;
    note=reason?'Early: '+reason:'Early leave';
  }
  const scrollY=window.scrollY;
  const openIds=[...document.querySelectorAll('.class-body.open')].map(el=>el.id);
  const existing=todayRecords.findIndex(r=>r.student_id===studentId&&r.dept===dept&&(r.session??0)===currentSession);
  if(existing>=0){ todayRecords[existing].status=status; todayRecords[existing].note=note; }
  else todayRecords.push({date:selectedDate,student_id:studentId,student_name:studentName,dept,class_code:classCode,status,note,marked_by:userEmail,session:currentSession});
  renderMark();
  openIds.forEach(id=>{const el=document.getElementById(id);if(el)el.classList.add('open');});
  window.scrollTo(0,scrollY);
  /* v15 · 点了「有来」（Present / Late / Early）而这孩子还有 Follow-Up 没做 → 直接弹出清单，老师不用另外找那颗黄标 */
  if((status==='present'||status==='late'||status==='early_leave') && !document.getElementById('fu-ov')
     && fuPending({id:studentId},dept,classCode,selectedDate,currentSession)>0){ fuOpen(studentId,classCode); }
  try{
    const{error}=await _sb.from('attendance').upsert({
      date:selectedDate,student_id:studentId,student_name:studentName,
      dept,class_code:classCode,status,note,marked_by:userEmail,
      session:currentSession,
      updated_at:new Date().toISOString()
    },{onConflict:'date,student_id,dept,session'});
    if(error){ console.error('Save failed:',error); toast('✕ Save failed'); }
    else { document.getElementById('last-saved').textContent='Saved '+fmtTime(); toast('✓ Saved'); }
  }catch(e){console.error('Save error:',e);toast('✕ Save error');}
}

async function markAll(dept,classCode,status){
  const scrollY=window.scrollY;
  const openIds=[...document.querySelectorAll('.class-body.open')].map(el=>el.id);
  const students=getClassStudents(dept,classCode).filter(s=>!swAwayOn(s.id,classCode,selectedDate));   /* v19 · 换走的不点，免得盖掉他在来访班的纪录 */
  for(const s of students){
    const existing=todayRecords.findIndex(r=>r.student_id===s.id&&r.dept===dept&&(r.session??0)===currentSession);
    if(existing>=0) todayRecords[existing].status=status;
    else todayRecords.push({date:selectedDate,student_id:s.id,student_name:s.name,dept,class_code:classCode,status,marked_by:userEmail,session:currentSession});
  }
  renderMark();
  openIds.forEach(id=>{const el=document.getElementById(id);if(el)el.classList.add('open');});
  window.scrollTo(0,scrollY);
  // Batch save
  const rows=students.map(s=>({
    date:selectedDate,student_id:s.id,student_name:s.name,
    dept,class_code:classCode,status,marked_by:userEmail,
    session:currentSession,
    updated_at:new Date().toISOString()
  }));
  try{
    const{error}=await _sb.from('attendance').upsert(rows,{onConflict:'date,student_id,dept,session'});
    if(error){ console.error('Batch save failed:',error); toast('✕ Save failed'); }
    else { document.getElementById('last-saved').textContent='Saved '+fmtTime(); toast('✓ All marked'); }
  }catch(e){console.error('Batch error:',e);toast('✕ Save error');}
}

// MONTHLY VIEW
// ═══════════════════════════════════════
let monthlyDept='SRK';
let monthlyCat='';
let monthlyClass='';
let monthlyMonth=todayStr().slice(0,7); // YYYY-MM
let monthlySession=0;   // 0=single(SRK/GAK/SRT), 1=ATC功课班, 2=ATC上课班 — D-A35

async function renderMonthly(){
  const el=document.getElementById('monthly-content');
  const classes=getDeptClasses(monthlyDept,false);
  const cats=[...new Set(classes.map(c=>extractCat(c)))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  if(!monthlyCat||!cats.includes(monthlyCat)) monthlyCat=cats[0]||'';
  const filteredClasses=classes.filter(c=>extractCat(c)===monthlyCat);
  if(!monthlyClass||!filteredClasses.includes(monthlyClass)) monthlyClass=filteredClasses[0]||'';

  // Dept tabs
  let h=`<div class="dept-tabs" style="margin-bottom:10px">`;
  DEPTS.forEach(d=>{h+=`<button class="dept-tab${d===monthlyDept?' on':''}" data-dept="${d}" onclick="monthlyDept='${d}';monthlyCat='';monthlyClass='';monthlySession=(('${d}')==='ATC'?1:0);renderMonthly()">${d}</button>`;});
  h+=`</div>`;
  // Category tabs
  h+=`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">`;
  cats.forEach(cat=>{
    const isOn=cat===monthlyCat;
    h+=`<button style="padding:5px 14px;border-radius:8px;border:1px solid ${isOn?'transparent':'var(--bdr)'};background:${isOn?'var(--mut)':'var(--sur)'};color:${isOn?'#fff':'var(--txt)'};font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;text-transform:uppercase" onclick="monthlyCat='${cat}';monthlyClass='';renderMonthly()">${cat}</button>`;
  });
  h+=`</div>`;
  // Class tabs + month picker + print
  h+=`<div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:14px">`;
  filteredClasses.forEach(code=>{
    const isOn=code===monthlyClass;
    const sn=shortClassName(code);
    h+=`<button style="padding:5px 12px;border-radius:8px;border:1px solid ${isOn?'transparent':'var(--bdr)'};background:${isOn?'var(--txt)':'var(--sur)'};color:${isOn?'#fff':'var(--txt)'};font-size:12px;font-weight:600;cursor:pointer;font-family:inherit" onclick="monthlyClass='${code}';renderMonthly()">${sn}</button>`;
  });
  h+=`<input type="month" class="date-input" value="${monthlyMonth}" onchange="monthlyMonth=this.value;renderMonthly()" style="margin-left:auto">`;
  h+=`<button onclick="printMonthly()" style="padding:8px 14px;border-radius:8px;border:none;background:var(--layer);color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">🖨 Print</button>`;
  h+=`</div>`;

  // ATC session tabs — mirrors Mark page pattern (D-A35)
  if(monthlyDept==='ATC'){
    if(monthlySession===0) monthlySession=1;
    h+=`<div style="display:flex;gap:6px;margin-bottom:14px">
      <button class="dept-tab${monthlySession===1?' on':''}" style="${monthlySession===1?'background:var(--d-atc);color:#fff;border-color:transparent':''}" onclick="monthlySession=1;renderMonthly()">S1: Homework</button>
      <button class="dept-tab${monthlySession===2?' on':''}" style="${monthlySession===2?'background:var(--d-atc);color:#fff;border-color:transparent':''}" onclick="monthlySession=2;renderMonthly()">S2: Lesson</button>
    </div>`;
  }else{ monthlySession=0; }

  if(!monthlyClass){
    h+=`<div class="card" style="text-align:center;color:var(--mut);padding:24px">Select a class</div>`;
    el.innerHTML=h;return;
  }

  // Get students — time overlap: visible if membership overlaps this month
  const [yr,mo]=monthlyMonth.split('-').map(Number);
  const daysInMonth=new Date(yr,mo,0).getDate();
  const dayNames=['SU','MO','TU','WE','TH','FR','SA'];
  const monthStart=monthlyMonth+'-01';
  const monthEnd=monthlyMonth+'-'+String(daysInMonth).padStart(2,'0');
  const activeMems=allMemberships.filter(m=>
    m.dept===monthlyDept&&m.class_code===monthlyClass&&
    m.start_date<=monthEnd&&
    (m.end_date==null||m.end_date>=monthStart)
  );
  // Deduplicate students and get their membership info for this class
  const stuMap=new Map();
  activeMems.forEach(m=>{
    const stu=allStudents.find(s=>s.id===m.student_id);
    if(stu&&!stuMap.has(stu.id)) stuMap.set(stu.id,{...stu,mem:m});
  });
  const students=[...stuMap.values()].sort((a,b)=>(a.mem.num??999)-(b.mem.num??999));

  // Fetch month records
  const startDate=monthlyMonth+'-01';
  const endDate=monthlyMonth+'-'+String(daysInMonth).padStart(2,'0');
  const{data:monthRecs}=await _sb.from('attendance').select('*')
    .gte('date',startDate).lte('date',endDate)
    .eq('dept',monthlyDept)   /* v18 · 不再只抓本班 class_code，下面用 attClassOf 判断 */
    .order('date').order('session');
  // D-A35: ATC 一天两条 (session 1/2)。不按 session 过滤 = recMap 后条覆盖前条,
  // Rate 分母翻倍, 显示哪一节不可预测。一刀切好 recMap/Rate/Marked by 三处。
  const recs=(monthRecs||[]).filter(r=>(r.session??0)===monthlySession&&attClassOf(r)===monthlyClass);

  // Build lookup: recMap[studentId][day] = {status, note, marked_by}
  const recMap={};
  recs.forEach(r=>{
    const day=parseInt(r.date.split('-')[2]);
    (recMap[r.student_id]=recMap[r.student_id]||{})[day]={status:r.status,note:r.note||'',marked_by:r.marked_by||'',other:r.class_code!==monthlyClass?r.class_code:''};   /* v18 · other = 在别班名单点的 */
  });

  const ICON={present:'✓',absent:'✕',late:'⏰',early_leave:'🚪',mc:'🤒'};
  const BG={present:'#E1F5EE',absent:'#FCEBEB',late:'#FFF8E1',early_leave:'#FFF0E6',mc:'#EEF2F7'};
  function lateTime(note){ const m=(note||'').match(/Late:\s*(\d{1,2}:\d{2})/); return m?m[1]:''; }

  h+=`<div id="monthly-grid" style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:11px;background:var(--sur);border-radius:10px;overflow:hidden">
    <thead><tr style="background:var(--sur2)">
      <th style="padding:8px;text-align:left;min-width:140px;position:sticky;left:0;background:var(--sur2);z-index:1">Student (${students.length})</th>`;
  for(let d=1;d<=daysInMonth;d++){
    const dow=new Date(yr,mo-1,d).getDay();
    const isWknd=dow===0||dow===6;
    h+=`<th style="padding:4px 2px;text-align:center;min-width:28px;font-size:9px;${isWknd?'color:var(--danger);':''}"><div>${d}</div><div style="font-size:8px">${dayNames[dow]}</div></th>`;
  }
  h+=`</tr></thead><tbody>`;

  // Student rows
  students.forEach(s=>{
    const mem=s.mem;
    const transferred=mem.end_date!=null;
    const transferTarget=transferred?getTransferTarget(s.id,monthlyDept,mem.end_date):null;
    const pzMonth=mem.pause_from&&mem.pause_from<=monthEnd&&(!mem.pause_to||mem.pause_to>monthStart);   /* v16 */
    const nameLabel=s.name+(pzMonth?'<span class="stu-paused" title="Paused from '+_escHtml(mem.pause_from)+(mem.pause_to?' · back on '+_escHtml(mem.pause_to):'')+'">On leave</span>':'')+(transferred?' <span style="font-size:9px;color:var(--hint)">↗ '+( transferTarget?transferTarget.class_code:'Moved')+'</span>':'');
    h+=`<tr><td style="padding:6px 8px;border-bottom:.5px solid var(--bdr);white-space:nowrap;position:sticky;left:0;background:var(--sur);z-index:1;font-size:11px">${nameLabel}</td>`;
    for(let d=1;d<=daysInMonth;d++){
      const dayStr=monthlyMonth+'-'+String(d).padStart(2,'0');
      const hol=getHoliday(dayStr,monthlyDept);
      // Check if this day is outside membership range
      const beforeStart=dayStr<mem.start_date;
      const afterEnd=transferred&&dayStr>mem.end_date;
      if(hol){
        const r=(recMap[s.id]||{})[d];
        const extra=hasExtraClass(dayStr,monthlyDept);
        if(extra&&r){
          const icon=r.status==='late'&&lateTime(r.note)?lateTime(r.note):ICON[r.status];
          h+=`<td style="padding:2px;text-align:center;border-bottom:.5px solid var(--bdr);background:${BG[r.status]||''};font-size:10px" title="${hol.name} (${extra.name})">${icon}</td>`;
        }else{
          h+=`<td style="padding:2px;text-align:center;border-bottom:.5px solid var(--bdr);background:#FFF8E1;color:var(--warn);font-size:9px;font-weight:600" title="${hol.name}">H</td>`;
        }
      }else if(transferred&&dayStr===mem.end_date){
        // Transfer day: show attendance record + transfer marker below
        const r=(recMap[s.id]||{})[d];
        const targetName=transferTarget?transferTarget.class_code.replace(/^[A-Z]+_/,''):'Moved';
        const attIcon=r?(r.status==='late'&&lateTime(r.note)?lateTime(r.note):ICON[r.status]):'·';
        const attBg=r?BG[r.status]||'':'';
        h+=`<td style="padding:1px;text-align:center;border-bottom:.5px solid var(--bdr);background:${attBg};line-height:1.1" title="Class change → ${transferTarget?transferTarget.class_code:'—'}">
          <div style="font-size:10px">${attIcon}</div>
          <div style="font-size:6px;color:#7870CC;font-weight:700">→${targetName}</div>
        </td>`;
      }else if(beforeStart||afterEnd){
        h+=`<td style="padding:2px;text-align:center;border-bottom:.5px solid var(--bdr);background:#f5f5f5;color:var(--hint);font-size:9px">–</td>`;
      }else{
        const r=(recMap[s.id]||{})[d];
        if(!r&&memPausedOn(mem,dayStr)){   /* v16 · 请假期间没点 → 灰色 L，不算缺席 */
          h+=`<td style="padding:2px;text-align:center;border-bottom:.5px solid var(--bdr);background:#f0eee8;color:var(--mut);font-size:9px" title="On leave">L</td>`;
        }else if(!r&&swAwayOn(s.id,monthlyClass,dayStr)){   /* v19 · 换到别的日子上，这天没纪录 */
          const aw=swAwayOn(s.id,monthlyClass,dayStr);
          h+=`<td style="padding:2px;text-align:center;border-bottom:.5px solid var(--bdr);background:#F3F1FB;color:#7870CC;font-size:9px;font-weight:600" title="${_escHtml('Temp slot → '+aw.to_date+' '+swCls(aw.to_class))}">Temp</td>`;
        }else if(r){
          const display=r.status==='late'&&lateTime(r.note)?lateTime(r.note):ICON[r.status]||'·';
          const _sw=swMarkFor(s.id,monthlyClass,dayStr,r.status);   /* v19 · 补 / 换 / 已补 */
          if(_sw){ r.other=r.other||''; }
          const oth=(r.other?' · marked in '+r.other:'')+(_sw?' · '+_sw.t:'');   /* v18 / v19 */
          h+=`<td style="padding:2px;text-align:center;border-bottom:.5px solid var(--bdr);background:${BG[r.status]||''};font-size:${r.status==='late'?'8px':'11px'};${(r.other||_sw)?'box-shadow:inset 0 -2px 0 #7870CC':''};line-height:1.05" title="${_escHtml((r.note||r.status)+oth)}">${display}${_sw?'<div style="font-size:7px;color:#7870CC;font-weight:700">'+_sw.k+'</div>':''}</td>`;
        }else{
          h+=`<td style="padding:2px;text-align:center;border-bottom:.5px solid var(--bdr);color:var(--hint)">·</td>`;
        }
      }
    }
    h+=`</tr>`;
  });

  // Rate row
  h+=`<tr style="background:var(--sur2);font-weight:600"><td style="padding:6px 8px;position:sticky;left:0;background:var(--sur2);z-index:1;font-size:10px">Rate</td>`;
  for(let d=1;d<=daysInMonth;d++){
    const dayStr=monthlyMonth+'-'+String(d).padStart(2,'0');
    const hol=getHoliday(dayStr,monthlyDept);
    if(hol){
      const dayRecs=recs.filter(r=>parseInt(r.date.split('-')[2])===d);
      const extra=hasExtraClass(dayStr,monthlyDept);
      if(extra&&dayRecs.length){
        const present=dayRecs.filter(r=>r.status==='present'||r.status==='late'||r.status==='early_leave').length;
        const pct=Math.round(present/dayRecs.length*100);
        h+=`<td style="padding:2px;text-align:center;font-size:9px;color:${pct>=90?'var(--ok)':pct>=70?'var(--warn)':'var(--danger)'};background:#FFF8E1" title="${hol.name} (${extra.name})">${pct}%</td>`;
      }else{
        h+=`<td style="padding:2px;text-align:center;font-size:9px;color:var(--warn);background:#FFF8E1" title="${hol.name}">H</td>`;
      }
    }else{
      const dayRecs=recs.filter(r=>parseInt(r.date.split('-')[2])===d);
      if(dayRecs.length){
        const present=dayRecs.filter(r=>r.status==='present'||r.status==='late'||r.status==='early_leave').length;
        const pct=Math.round(present/dayRecs.length*100);
        h+=`<td style="padding:2px;text-align:center;font-size:9px;color:${pct>=90?'var(--ok)':pct>=70?'var(--warn)':'var(--danger)'}">${pct}%</td>`;
      }else{
        h+=`<td style="padding:2px;text-align:center;font-size:9px;color:var(--hint)">–</td>`;
      }
    }
  }
  h+=`</tr>`;

  // Marked by row
  h+=`<tr style="background:var(--sur2)"><td style="padding:6px 8px;position:sticky;left:0;background:var(--sur2);z-index:1;font-size:10px;color:var(--mut)">Marked by</td>`;
  for(let d=1;d<=daysInMonth;d++){
    const dayRecs=recs.filter(r=>parseInt(r.date.split('-')[2])===d);
    const markers=[...new Set(dayRecs.map(r=>r.marked_by).filter(Boolean))];
    const short=markers.map(e=>markerNames[e]||e.split('@')[0].slice(0,3).toUpperCase()).join(',');
    h+=`<td style="padding:2px;text-align:center;font-size:7px;color:var(--mut)" title="${markers.join(', ')}">${short||'–'}</td>`;
  }
  h+=`</tr>`;

  h+=`</tbody></table></div>`;

  el.innerHTML=h;
}

      <button onclick="printTracker()" style="padding:6px 12px;border-radius:6px;border:none;background:var(--layer);color:#fff;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit">🖨 Print</button>

  </div>

let trackerStudents=[{id:'',name:''},{id:'',name:''},{id:'',name:''}];
let trackerFrom=(()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01';})();
let trackerTo=todayStr();
let searchTimeout;
let searchIdx=0;

function searchStudentMulti(query,idx){
  searchIdx=idx;
  clearTimeout(searchTimeout);
  const el=document.getElementById('stu-dd-'+idx);
  if(!el) return;
  if(query.length<2){el.style.display='none';return;}
  searchTimeout=setTimeout(()=>{
    const q=query.toLowerCase();
    const matches=allStudents.filter(s=>s.name.toLowerCase().includes(q)||(s.name_cn||'').includes(q)).slice(0,5);
    if(!matches.length){el.innerHTML='<div style="padding:8px;font-size:11px;color:var(--mut)">No match</div>';el.style.display='block';return;}
    let h='';
    matches.forEach(s=>{
      h+=`<div style="padding:6px 8px;border-bottom:.5px solid var(--bdr);cursor:pointer;font-size:12px" onclick="selectTrackerStudent('${s.id}','${s.name}',${idx})">${s.name}${s.name_cn?' <span style="color:var(--mut)">'+s.name_cn+'</span>':''}</div>`;
    });
    el.innerHTML=h;
    el.style.display='block';
  },300);
}

function selectTrackerStudent(id,name,idx){
  trackerStudents[idx]={id,name};
  document.querySelectorAll('.stu-input')[idx].value=name;
  document.getElementById('stu-dd-'+idx).style.display='none';
  loadTrackerMatrix();
}

async function loadTrackerMatrix(){
  trackerFrom=document.getElementById('tk-from')?.value||trackerFrom;
  trackerTo=document.getElementById('tk-to')?.value||trackerTo;
  const el=document.getElementById('tracker-matrix');
  if(!el) return;
  const active=trackerStudents.filter(s=>s.id);
  if(!active.length){el.innerHTML='';return;}

  // Build date columns
  const from=new Date(trackerFrom+'T12:00:00');
  const to=new Date(trackerTo+'T12:00:00');
  const days=[];
  const dayNames=['SU','MO','TU','WE','TH','FR','SA'];
  for(let d=new Date(from);d<=to;d.setDate(d.getDate()+1)){
    days.push({date:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),
      day:d.getDate(),dow:d.getDay(),label:dayNames[d.getDay()]});
  }
  if(days.length>31) days.length=31;

  // Fetch all records for selected students in range
  const ids=active.map(s=>s.id);
  const{data}=await _sb.from('attendance').select('*').in('student_id',ids).gte('date',trackerFrom).lte('date',trackerTo);
  const recs=data||[];

  const ICON={present:'✓',absent:'✕',late:'⏰',early_leave:'🚪',mc:'🤒'};
  const BG={present:'#E1F5EE',absent:'#FCEBEB',late:'#FFF8E1',early_leave:'#FFF0E6',mc:'#EEF2F7'};
  function lateTime(note){const m=(note||'').match(/Late:\s*(\d{1,2}:\d{2})/);return m?m[1]:'';}

  // Stats
  const total=recs.length;
  const present=recs.filter(r=>r.status==='present').length;
  const late=recs.filter(r=>r.status==='late').length;
  const absent=recs.filter(r=>r.status==='absent').length;
  const mc=recs.filter(r=>r.status==='mc').length;
  const rate=total?Math.round((present+late)/total*100):0;

  let h=`<div class="card">
    <div style="display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap;font-size:12px">
      <span>Records: <strong>${total}</strong></span>
      <span style="color:${rate>=90?'var(--ok)':rate>=70?'var(--warn)':'var(--danger)'}">Rate: <strong>${rate}%</strong></span>
      <span style="color:var(--ok)">✓${present}</span><span style="color:var(--danger)">✕${absent}</span>
      <span style="color:var(--warn)">⏰${late}</span><span style="color:var(--info)">🤒${mc}</span>
    </div>
    <div id="tracker-grid" style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:11px">
      <thead><tr style="background:var(--sur2)">
        <th style="padding:6px 8px;text-align:left;min-width:140px;position:sticky;left:0;background:var(--sur2);z-index:1">Student / Class</th>`;
  days.forEach(d=>{
    const isWknd=d.dow===0||d.dow===6;
    h+=`<th style="padding:3px 2px;text-align:center;min-width:28px;font-size:9px;${isWknd?'color:var(--danger);':''}"><div>${d.day}</div><div style="font-size:8px">${d.label}</div></th>`;
  });
  h+=`</tr></thead><tbody>`;

  // Rows for each student × each membership
  active.forEach(stu=>{
    const mems=allMemberships.filter(m=>m.student_id===stu.id).sort((a,b)=>a.start_date>b.start_date?1:-1);
    const stuRecs=recs.filter(r=>r.student_id===stu.id);

    // Show transfer summary if multiple memberships in same dept
    const transfers=mems.filter(m=>m.end_date!=null);
    if(transfers.length>0){
      let transferHtml='';
      transfers.forEach(t=>{
        const target=getTransferTarget(stu.id,t.dept,t.end_date);
        if(target){
          transferHtml+=`<span style="font-size:10px;color:#7870CC;margin-right:10px">🔄 ${t.end_date}: <span style="color:${DEPT_COLORS[t.dept]}">${t.dept}</span> ${t.class_code} → ${target.class_code}</span>`;
        }
      });
      if(transferHtml){
        h+=`<tr><td colspan="${days.length+1}" style="padding:4px 8px;border-bottom:.5px solid var(--bdr);background:#F9F5FF">${transferHtml}</td></tr>`;
      }
    }

    mems.forEach((mem,mi)=>{
      const recByDate={};
      stuRecs.filter(r=>r.dept===mem.dept&&attClassOf(r)===mem.class_code).forEach(r=>{recByDate[r.date]=r;});   /* v18 */
      const ended=mem.end_date!=null;
      h+=`<tr><td style="padding:5px 8px;border-bottom:.5px solid var(--bdr);position:sticky;left:0;background:var(--sur);z-index:1;font-size:10px;white-space:nowrap">
        ${mi===0?'<strong>'+stu.name+'</strong><br>':''}
        <span style="color:${DEPT_COLORS[mem.dept]}">${mem.dept}</span> ${mem.class_code}${ended?' <span style="font-size:8px;color:var(--hint)">(~'+mem.end_date+')</span>':''}
      </td>`;
      days.forEach(d=>{
        const r=recByDate[d.date];
        if(r){
          const display=r.status==='late'&&lateTime(r.note)?lateTime(r.note):ICON[r.status];
          h+=`<td style="padding:2px;text-align:center;border-bottom:.5px solid var(--bdr);background:${BG[r.status]||''};font-size:${r.status==='late'?'8px':'11px'}" title="${r.note||r.status}">${display}</td>`;
        }else{
          h+=`<td style="padding:2px;text-align:center;border-bottom:.5px solid var(--bdr);color:var(--hint)">·</td>`;
        }
      });
      h+=`</tr>`;
    });
    // Separator between students
    if(active.indexOf(stu)<active.length-1){
      h+=`<tr><td colspan="${days.length+1}" style="height:4px;background:var(--sur2)"></td></tr>`;
    }
  });

  h+=`</tbody></table></div></div>`;
  el.innerHTML=h;
}

function toast(msg,ms){
  const el=document.getElementById('toast');
  if(!el) return;
  el.textContent=msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t=setTimeout(()=>el.classList.remove('show'),ms||2000);
}

          + '<button class="fu-btn" style="font-size:11px;padding:3px 10px" onclick="fuAdminRemove(\'' + t.id + '\')">Remove</button>'
          + '</div>';
      });
    }
    h += '<button class="fu-btn" style="font-size:11px;padding:3px 10px;margin-top:6px" onclick="fuAdminAdd(\'' + d + '\')">+ Add item</button></div>';
  });
  el.innerHTML = h;
}
async function fuAdminAdd(dept){
  const label = prompt('New checklist item for ' + dept + ' (e.g. Hygiene Checking):', '');
  if (!label || !label.trim()) return;
  const nth = prompt('Do it on which school day of the week? Type 1 or 2:', '1');
  if (nth !== '1' && nth !== '2') { toast('Cancelled — please type 1 or 2'); return; }
  const id = 'fut_' + dept.toLowerCase() + '_' + Date.now().toString(36);
  const sib = allFuTasks.filter(t => t.dept === dept && t.nth_day === parseInt(nth));
  try{
    const { error } = await _sb.from('followup_task').insert({
      id: id, dept: dept, trigger_type: 'weekly_nth_day', nth_day: parseInt(nth), session: 0,
      item_label: label.trim(), sort_order: sib.length + 1, is_active: true, updated_by: userEmail || null });
    if (error) throw error;
    await fuLoadTasks(); fuRenderAdmin(); toast('\u2713 Added');
  }catch(e){ toast('\u274c NOT SAVED — ' + (e.message || 'unknown'), 12000); }
}
async function fuAdminRename(id){
  const t = allFuTasks.find(x => x.id === id); if (!t) return;
  const label = prompt('Rename this item:', t.item_label);
  if (!label || !label.trim() || label.trim() === t.item_label) return;
  try{
    const { error } = await _sb.from('followup_task')
      .update({ item_label: label.trim(), updated_at: new Date().toISOString(), updated_by: userEmail || null }).eq('id', id);
    if (error) throw error;
    await fuLoadTasks(); fuRenderAdmin(); toast('\u2713 Renamed');
  }catch(e){ toast('\u274c NOT SAVED — ' + (e.message || 'unknown'), 12000); }
}
async function fuAdminRemove(id){
  const t = allFuTasks.find(x => x.id === id); if (!t) return;
  if (!confirm('Remove "' + t.item_label + '" from the ' + t.dept + ' checklist?\n\nPast records are kept.')) return;
  try{
    /* 停用不删 —— 旧纪录要留著 */
    const { error } = await _sb.from('followup_task')
      .update({ is_active: false, updated_at: new Date().toISOString(), updated_by: userEmail || null }).eq('id', id);
    if (error) throw error;
    await fuLoadTasks(); fuRenderAdmin(); toast('\u2713 Removed');
  }catch(e){ toast('\u274c NOT SAVED — ' + (e.message || 'unknown'), 12000); }
}

    }
  }

  el.innerHTML=h;
}

function rulesAddCell(studentId,studentName,dept,classCode,day,session){
  const dayNames=['','Mon','Tue','Wed','Thu','Fri'];
  _rmPending={studentId,studentName,dept,classCode,day,session};
  document.getElementById('rm-subtitle').textContent=studentName+' · '+dayNames[day]+' · '+(session===1?'S1 Homework':session===2?'S2 Lesson':'All');
  document.getElementById('rm-type').value='absent';
  document.getElementById('rm-start').value=todayStr();
  document.getElementById('rm-end').value='';
  document.getElementById('rm-reason').value='';
  document.getElementById('rule-modal').style.display='flex';
}

function closeRuleModal(){document.getElementById('rule-modal').style.display='none';_rmPending=null;_editId=null;document.getElementById('rm-title').textContent='Add Rule';}

async function submitRuleModal(){
  const ruleType=document.getElementById('rm-type').value;
  const startDate=document.getElementById('rm-start').value;
  const endDate=document.getElementById('rm-end').value||null;
  const reason=document.getElementById('rm-reason').value.trim();
  if(!startDate){toast('Start date required');return;}

  if(_editId){
    // Edit mode
    const{error}=await _sb.from('attendance_rules').update({
      rule_type:ruleType,start_date:startDate,end_date:endDate,reason:reason||null
    }).eq('id',_editId);
    if(error){toast('✕ Failed: '+error.message);return;}
    const r=allRules.find(x=>x.id===_editId);
    if(r){r.rule_type=ruleType;r.start_date=startDate;r.end_date=endDate;r.reason=reason||null;}
    _editId=null;
    closeRuleModal();
    renderRulesPage();
    toast('✓ Rule updated');
    return;
  }

  // Add mode
  if(!_rmPending) return;
  const{studentId,dept,classCode,day,session}=_rmPending;
  const{data,error}=await _sb.from('attendance_rules').insert({
    student_id:studentId,dept,class_code:classCode,
    day_of_week:day,session,rule_type:ruleType,
    reason:reason||null,start_date:startDate,end_date:endDate,
    created_by:userEmail
  }).select();
  if(error){toast('✕ Failed: '+error.message);return;}
  allRules.push(data[0]);
  closeRuleModal();
  renderRulesPage();
  toast('✓ Rule added');
}

// ── Rules management (Manage page) ──
const DAY_NAMES=['','Mon','Tue','Wed','Thu','Fri'];
const SESSION_NAMES={0:'All',1:'S1',2:'S2'};

function renderRulesList(){
  const el=document.getElementById('rules-list');
  if(!el) return;
  if(!allRules.length){el.innerHTML='<div style="font-size:11px;color:var(--hint);padding:8px 0">No rules set.</div>';return;}
  let h='<table style="width:100%;font-size:11px;border-collapse:collapse">';
  h+='<tr style="color:var(--mut);border-bottom:1px solid var(--bdr)"><th style="text-align:left;padding:4px">Student</th><th>Dept</th><th>Class</th><th>Day</th><th>Session</th><th>Type</th><th>Reason</th><th></th></tr>';
  allRules.forEach(r=>{
    const stu=allStudents.find(s=>s.id===r.student_id);
    h+=`<tr style="border-bottom:1px solid var(--bdr)">
      <td style="padding:4px">${stu?stu.name:r.student_id.slice(0,8)}</td>
      <td style="text-align:center">${r.dept}</td>
      <td style="text-align:center">${r.class_code}</td>
      <td style="text-align:center">${DAY_NAMES[r.day_of_week]||r.day_of_week}</td>
      <td style="text-align:center">${SESSION_NAMES[r.session]??r.session}</td>
      <td style="text-align:center">${r.rule_type==='early_leave'?'Early':'Absent'}</td>
      <td style="padding:4px">${r.reason||'—'}</td>
      <td><button onclick="deleteRule('${r.id}')" style="background:#A32D2D;color:#fff;border:none;border-radius:4px;padding:2px 8px;font-size:10px;cursor:pointer">✕</button></td>
    </tr>`;
  });
  h+='</table>';
  el.innerHTML=h;
}

async function exportCSV(){
  toast('Preparing export…',4000);
  try{
    const{data,error}=await _sb.from('attendance').select('date,dept,class_code,student_name,status,note,marked_by').order('date',{ascending:true});
    if(error){toast('✕ Export failed');return;}
    const rows=data||[];
    if(!rows.length){toast('No records to export');return;}
    const cols=['date','dept','class_code','student_name','status','note','marked_by'];
    const esc=v=>{const s=(v??'').toString();return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
    const lines=[cols.join(',')];
    rows.forEach(r=>lines.push(cols.map(c=>esc(r[c])).join(',')));
    const csv='\uFEFF'+lines.join('\r\n'); // UTF-8 BOM
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
    const now=new Date();
    const stamp=now.getFullYear()+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0')
      +'_'+String(now.getHours()).padStart(2,'0')+String(now.getMinutes()).padStart(2,'0');
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='OPR-AttendanceGo_'+stamp+'.csv';
    a.click();URL.revokeObjectURL(a.href);
    toast('✓ Exported '+rows.length+' records');
  }catch(e){console.error('Export error:',e);toast('✕ Export error');}
}

// ── Export JSON (Template standard) ──
async function exportData(){
  toast('Preparing export…',4000);
  try{
    const{data,error}=await _sb.from('attendance').select('*').order('date',{ascending:true});
    if(error){toast('✕ Export failed: '+error.message);return;}
    const rows=data||[];
    if(!rows.length){toast('No records to export');return;}
    const pkg={system:'OPR-AttendanceGo',version:APP_VERSION,exported:new Date().toISOString(),count:rows.length,records:rows};
    const blob=new Blob([JSON.stringify(pkg,null,2)],{type:'application/json'});
    const now=new Date();
    const stamp=now.getFullYear()+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0')
      +'_'+String(now.getHours()).padStart(2,'0')+String(now.getMinutes()).padStart(2,'0');
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='OPR-AttendanceGo_'+stamp+'.json';
    a.click();URL.revokeObjectURL(a.href);
    toast('✓ Exported '+rows.length+' records');
  }catch(e){console.error('Export error:',e);toast('✕ Export error');}
}

// ── Import JSON (Template standard) ──
async function importData(e){
  const file=e.target.files[0];
  if(!file){return;}
  try{
    const text=await file.text();
    const pkg=JSON.parse(text);
    if(!pkg.records||!Array.isArray(pkg.records)){toast('✕ Invalid file: no records array');e.target.value='';return;}
    if(!confirm('Import '+pkg.records.length+' records?\n\nThis will ADD records. Duplicates (same date+student+dept+class) will be skipped.')){e.target.value='';return;}
    toast('Importing…',6000);
    let added=0,skipped=0;
    for(const r of pkg.records){
      const{error}=await _sb.from('attendance').upsert({
        date:r.date,dept:r.dept,class_code:r.class_code,
        student_id:r.student_id,student_name:r.student_name,
        status:r.status,note:r.note||null,marked_by:r.marked_by||userEmail
      },{onConflict:'date,student_id,dept,session'});
      if(error){skipped++;}else{added++;}
    }
    await loadTodayRecords();renderPage();
    toast('✓ Import done: '+added+' added, '+skipped+' skipped');
  }catch(err){console.error('Import error:',err);toast('✕ Import failed: '+err.message);}
  e.target.value='';
}

    if(el.style.display==='block'){el.style.display='none';closed=true;}
  });
  if(closed) return;
});
