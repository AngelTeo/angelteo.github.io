  DEPTS.forEach(d => {
    const ts = allFuTasks.filter(t => t.dept === d).sort((a, b) => (a.nth_day - b.nth_day) || (a.sort_order - b.sort_order));
    h += '<div style="margin-bottom:12px"><div style="font-size:11px;font-weight:700;color:' + (DEPT_COLORS[d] || 'var(--txt)') + ';margin-bottom:5px">' + d + '</div>';
    if (!ts.length){
      h += '<div style="font-size:11px;color:var(--hint);padding:4px 0">No checklist yet.</div>';
    } else {
      ts.forEach(t => {
        h += '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:.5px solid var(--bdr);flex-wrap:wrap">'
          + '<span style="font-size:10px;background:var(--sur2);border-radius:4px;padding:1px 7px;white-space:nowrap">'
          + (t.trigger_type === 'weekly_nth_day' ? ('School day ' + t.nth_day + ' of the week') : 'After absence') + '</span>'
          + '<span style="flex:1;font-size:12px;min-width:120px">' + _escHtml(t.item_label) + '</span>'
          + '<button class="fu-btn" style="font-size:11px;padding:3px 10px" onclick="fuAdminRename(\'' + t.id + '\')">Rename</button>'
          + '<button class="fu-btn" style="font-size:11px;padding:3px 10px" onclick="fuAdminRemove(\'' + t.id + '\')">Remove</button>'
          + '</div>';
      });
    }
    h += '<button class="fu-btn" style="font-size:11px;padding:3px 10px;margin-top:6px" onclick="fuAdminAdd(\'' + d + '\')">+ Add item</button></div>';
  });
  el.innerHTML = h;
}
async function fuAdminAdd(dept){
  const label = prompt('New checklist item for ' + dept + ' (e.g. Hygiene Checking):', '');
  if (!label || !label.trim()) return;
  const nth = prompt('Do it on which school day of the week? Type 1 or 2:', '1');
  if (nth !== '1' && nth !== '2') { toast('Cancelled — please type 1 or 2'); return; }
  const id = 'fut_' + dept.toLowerCase() + '_' + Date.now().toString(36);
  const sib = allFuTasks.filter(t => t.dept === dept && t.nth_day === parseInt(nth));
  try{
    const { error } = await _sb.from('followup_task').insert({
      id: id, dept: dept, trigger_type: 'weekly_nth_day', nth_day: parseInt(nth), session: 0,
      item_label: label.trim(), sort_order: sib.length + 1, is_active: true, updated_by: userEmail || null });
    if (error) throw error;
    await fuLoadTasks(); fuRenderAdmin(); toast('\u2713 Added');
  }catch(e){ toast('\u274c NOT SAVED — ' + (e.message || 'unknown'), 12000); }
}
async function fuAdminRename(id){
  const t = allFuTasks.find(x => x.id === id); if (!t) return;
  const label = prompt('Rename this item:', t.item_label);
  if (!label || !label.trim() || label.trim() === t.item_label) return;
  try{
    const { error } = await _sb.from('followup_task')
      .update({ item_label: label.trim(), updated_at: new Date().toISOString(), updated_by: userEmail || null }).eq('id', id);
    if (error) throw error;
    await fuLoadTasks(); fuRenderAdmin(); toast('\u2713 Renamed');
  }catch(e){ toast('\u274c NOT SAVED — ' + (e.message || 'unknown'), 12000); }
}
async function fuAdminRemove(id){
  const t = allFuTasks.find(x => x.id === id); if (!t) return;
  if (!confirm('Remove "' + t.item_label + '" from the ' + t.dept + ' checklist?\n\nPast records are kept.')) return;
  try{
    /* 停用不删 —— 旧纪录要留著 */
    const { error } = await _sb.from('followup_task')
      .update({ is_active: false, updated_at: new Date().toISOString(), updated_by: userEmail || null }).eq('id', id);
    if (error) throw error;
    await fuLoadTasks(); fuRenderAdmin(); toast('\u2713 Removed');
  }catch(e){ toast('\u274c NOT SAVED — ' + (e.message || 'unknown'), 12000); }
}

let rulesDept='ATC';
let rulesCat='';
let rulesClass='';
let rulesOpenStudent=null;

function renderRulesPage(){
  const el=document.getElementById('rules-content');
  let h=`<div style="font-size:16px;font-weight:700;margin-bottom:14px">Attendance Exceptions</div>`;

  h+=`<div class="dept-tabs" style="margin-bottom:10px">`;

  const cats=[...new Set(allClasses.map(c=>extractCat(c)))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  if(!rulesCat||!cats.includes(rulesCat)) rulesCat=cats[0]||'';

  // Category tabs
  h+=`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">`;
  cats.forEach(cat=>{
    const isOn=cat===rulesCat;
    h+=`<button style="padding:5px 14px;border-radius:8px;border:1px solid ${isOn?'transparent':'var(--bdr)'};background:${isOn?'var(--mut)':'var(--sur)'};color:${isOn?'#fff':'var(--txt)'};font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;text-transform:uppercase" onclick="rulesCat='${cat}';rulesClass='';rulesOpenStudent=null;renderRulesPage()">${cat}</button>`;
  });
  h+=`</div>`;
  // Class tabs
  h+=`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">`;
  filteredClasses.forEach(code=>{
    const isOn=code===rulesClass;
    const sn=shortClassName(code);
    h+=`<button style="padding:5px 12px;border-radius:8px;border:1px solid ${isOn?'transparent':'var(--bdr)'};background:${isOn?'var(--txt)':'var(--sur)'};color:${isOn?'#fff':'var(--txt)'};font-size:12px;font-weight:600;cursor:pointer;font-family:inherit" onclick="rulesClass='${code}';rulesOpenStudent=null;renderRulesPage()">${sn}</button>`;
  });
  h+=`</div>`;

  // Student list with grids
  if(rulesClass){
    const students=getClassStudents(rulesDept,rulesClass);

    const sessionLabels=isATC?{1:'S1 Homework',2:'S2 Lesson'}:{0:'Session'};

      const isOpen=rulesOpenStudent===s.id;
      const stuRules=allRules.filter(r=>r.student_id===s.id&&r.dept===rulesDept);

        <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer" onclick="rulesToggleStudent('${s.id}')">

          </div>
          <div style="display:flex;align-items:center;gap:8px">
            ${activeCount?'<span style="font-size:10px;background:var(--warn);color:#fff;padding:1px 8px;border-radius:10px">'+activeCount+' active</span>':''}
            <span style="font-size:14px;color:var(--mut)">${isOpen?'▲':'▼'}</span>
          </div>
        </div>`;

      if(isOpen){
        // Active rules table
        const _today=todayStr();
        const activeRules=stuRules.filter(r=>r.is_active&&(!r.end_date||r.end_date>_today));
        const endedRules=stuRules.filter(r=>!r.is_active||(r.end_date&&r.end_date<=_today));

        sessions.forEach(sess=>{
          h+=`<th style="font-size:10px;color:var(--mut);padding:6px;text-align:center">${sessionLabels[sess]}</th>`;
        });
        h+=`</tr>`;

        for(let day=1;day<=5;day++){
          h+=`<tr style="border-top:1px solid var(--bdr)">
            <td style="padding:8px 6px;font-size:12px;font-weight:600">${dayNames[day]}</td>`;
          sessions.forEach(sess=>{
            const rule=activeRules.find(r=>r.day_of_week===day&&(r.session===sess||r.session===0));
            if(rule){
              const bg=rule.rule_type==='early_leave'?'#FFF3E0':(rule.rule_type==='late'?'#FFF8E1':'#F5F5F5');
              const label=ruleLabel(rule.rule_type);
              const color=rule.rule_type==='early_leave'?'#E65100':(rule.rule_type==='late'?'#854F0B':'#999');
              h+=`<td style="text-align:center;padding:6px;cursor:pointer;background:${bg};border-radius:4px" onclick="rulesEditCell('${rule.id}','${s.name}','${dayNames[day]}')">
                <div style="font-size:11px;font-weight:700;color:${color}">${label}</div>
                ${rule.reason?'<div style="font-size:9px;color:var(--mut);margin-top:1px">'+rule.reason+'</div>':''}
                <div style="font-size:8px;color:var(--hint);margin-top:2px">${rule.start_date||''}${rule.end_date?' → '+rule.end_date:' → now'}</div>

            }else{
              h+=`<td style="text-align:center;padding:6px;cursor:pointer;border-radius:4px" onclick="rulesAddCell('${s.id}','${s.name}','${rulesDept}','${rulesClass}',${day},${sess})" onmouseover="this.style.background='#f0f0f0'" onmouseout="this.style.background=''">

            }
          });

        }
        h+=`</table>`;

        // History (all rules - complete log)
        if(stuRules.length){
          const isATC=rulesDept==='ATC';
          const sessLabel={0:'All',1:'Homework',2:'Lesson'};
          h+=`<div style="margin-top:12px;border-top:1px solid var(--bdr);padding-top:8px">
            <div style="font-size:10px;font-weight:600;color:var(--mut);margin-bottom:6px">All Records (${stuRules.length})</div>`;
          [...stuRules].sort((a,b)=>(b.start_date||'').localeCompare(a.start_date||'')).forEach(r=>{
            const sessText=isATC?(sessLabel[r.session]||'All'):'';
            const isActive=r.is_active&&(!r.end_date||r.end_date>_today);
            h+=`<div style="font-size:10px;color:${isActive?'var(--txt)':'var(--hint)'};padding:4px 0;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(0,0,0,.04)">
              <span>${isActive?'🟢':'⚪'} ${dayNames[r.day_of_week]}${sessText?' · '+sessText:''} · ${{early_leave:'Early',late:'Late',absent:'Abs'}[r.rule_type]||r.rule_type}${r.reason?' · '+r.reason:''}</span>

                <button onclick="deleteHistoryRule('${r.id}')" style="background:#A32D2D;color:#fff;border:none;border-radius:4px;padding:1px 6px;font-size:9px;cursor:pointer">✕</button>
              </span>
            </div>`;
          });
          h+=`</div>`;
        }

        h+=`</div>`;
      }
      h+=`</div>`;
    });

    if(!students.length){
      h+=`<div style="text-align:center;color:var(--mut);padding:24px;font-size:12px">No students in this class.</div>`;
    }
  }

  el.innerHTML=h;
}

function closeRuleModal(){document.getElementById('rule-modal').style.display='none';_rmPending=null;_editId=null;document.getElementById('rm-title').textContent='Add Rule';}

async function submitRuleModal(){
  const ruleType=document.getElementById('rm-type').value;
  const startDate=document.getElementById('rm-start').value;
  const endDate=document.getElementById('rm-end').value||null;
  const reason=document.getElementById('rm-reason').value.trim();
  if(!startDate){toast('Start date required');return;}

  if(_editId){
    // Edit mode
    const{error}=await _sb.from('attendance_rules').update({
      rule_type:ruleType,start_date:startDate,end_date:endDate,reason:reason||null
    }).eq('id',_editId);
    if(error){toast('✕ Failed: '+error.message);return;}
    const r=allRules.find(x=>x.id===_editId);
    if(r){r.rule_type=ruleType;r.start_date=startDate;r.end_date=endDate;r.reason=reason||null;}
    _editId=null;
    closeRuleModal();
    renderRulesPage();
    toast('✓ Rule updated');
    return;
  }

  // Add mode
  if(!_rmPending) return;
  const{studentId,dept,classCode,day,session}=_rmPending;
  const{data,error}=await _sb.from('attendance_rules').insert({
    student_id:studentId,dept,class_code:classCode,
    day_of_week:day,session,rule_type:ruleType,
    reason:reason||null,start_date:startDate,end_date:endDate,
    created_by:userEmail
  }).select();
  if(error){toast('✕ Failed: '+error.message);return;}
  allRules.push(data[0]);
  closeRuleModal();
  renderRulesPage();
  toast('✓ Rule added');
}

function onRuleClassChange(){
  const dept=document.getElementById('rule-dept').value;
  const classCode=document.getElementById('rule-class').value;
  const stuSel=document.getElementById('rule-student');
  stuSel.innerHTML='<option value="">Student</option>';
  if(!dept||!classCode) return;
  const students=getClassStudents(dept,classCode);
  students.forEach(s=>{stuSel.innerHTML+=`<option value="${s.id}">${s.name}</option>`;});
}

async function addRule(){
  const dept=document.getElementById('rule-dept').value;
  const classCode=document.getElementById('rule-class').value;
  const studentId=document.getElementById('rule-student').value;
  const day=parseInt(document.getElementById('rule-day').value);
  const session=parseInt(document.getElementById('rule-session').value);
  const ruleType=document.getElementById('rule-type').value;
  const reason=document.getElementById('rule-reason').value.trim();
  if(!dept||!classCode||!studentId||!day){toast('Fill all required fields');return;}
  const{data,error}=await _sb.from('attendance_rules').insert({
    student_id:studentId,dept,class_code:classCode,
    day_of_week:day,session,rule_type:ruleType,
    reason:reason||null,created_by:userEmail
  }).select();
  if(error){toast('✕ Failed: '+error.message);return;}
  allRules.push(data[0]);
  renderRulesList();
  toast('✓ Rule added');
}

async function deleteRule(id){
  if(!confirm('Delete this rule?')) return;
  const{error}=await _sb.from('attendance_rules').delete().eq('id',id);
  if(error){toast('✕ Delete failed');return;}
  allRules=allRules.filter(r=>r.id!==id);
  renderRulesList();
  toast('✓ Rule deleted');
}

async function exportCSV(){
  toast('Preparing export…',4000);
  try{
    let rows;   /* v28 · 以前只汇出最早的 1,000 行 */
    try{ rows=await _fetchAll(()=>_sb.from('attendance').select('date,dept,class_code,student_name,status,note,marked_by').order('date',{ascending:true}).order('id'),'Export'); }
    catch(e){ toast('✕ Export failed: '+e.message,6000); return; }
    if(!rows.length){toast('No records to export');return;}
    const cols=['date','dept','class_code','student_name','status','note','marked_by'];
    const esc=v=>{const s=(v??'').toString();return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
    const lines=[cols.join(',')];
    rows.forEach(r=>lines.push(cols.map(c=>esc(r[c])).join(',')));
    const csv='\uFEFF'+lines.join('\r\n'); // UTF-8 BOM
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
    const now=new Date();
    const stamp=now.getFullYear()+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0')
      +'_'+String(now.getHours()).padStart(2,'0')+String(now.getMinutes()).padStart(2,'0');
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='OPR-AttendanceGo_'+stamp+'.csv';
    a.click();URL.revokeObjectURL(a.href);
    toast('✓ Exported '+rows.length+' records');
  }catch(e){console.error('Export error:',e);toast('✕ Export error');}
}

// ── Import JSON (Template standard) ──
async function importData(e){
  if(!noticeEditor){ toast('Office only'); e.target.value=''; return; }   /* v30 */
  const file=e.target.files[0];
  if(!file){return;}
  try{
    const text=await file.text();
    const pkg=JSON.parse(text);
    if(!pkg.records||!Array.isArray(pkg.records)){toast('✕ Invalid file: no records array');e.target.value='';return;}
    if(!confirm('Import '+pkg.records.length+' records?\n\nThis will ADD records. Duplicates (same date+student+dept+class) will be skipped.')){e.target.value='';return;}
    toast('Importing…',6000);
    let added=0,skipped=0;
    for(const r of pkg.records){
      const{error}=await _sb.from('attendance').upsert({
        date:r.date,dept:r.dept,class_code:r.class_code,
        student_id:r.student_id,student_name:r.student_name,
        status:r.status,note:r.note||null,marked_by:r.marked_by||userEmail
      },{onConflict:'date,student_id,dept,session'});
      if(error){skipped++;}else{added++;}
    }
    await loadTodayRecords();renderPage();
    toast('✓ Import done: '+added+' added, '+skipped+' skipped');
  }catch(err){console.error('Import error:',err);toast('✕ Import failed: '+err.message);}
  e.target.value='';
}
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  const dd=document.getElementById('dash-detail');
  if(dd&&dd.style.display!=='none'){dd.style.display='none';return;}
  let closed=false;
  document.querySelectorAll('[id^="stu-dd-"]').forEach(el=>{
    if(el.style.display==='block'){el.style.display='none';closed=true;}
  });
  if(closed) return;
});

(async()=>{
  const{data:{session}}=await _sb.auth.getSession();
  if(session){
    userEmail=session.user.email||'';
    await initApp();
  }
})();
