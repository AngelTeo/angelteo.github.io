<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1,user-scalable=no">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<title>OPR-AttendanceGo v42</title>
<style>
:root{
  --layer:#8B6C2A;
  --d-srk:#C45C5C;--d-gak:#E8A04E;--d-atc:#7AB05A;--d-srt:#8B6CAE;
  --sur:#ffffff;--sur2:#f7f6f2;--bdr:#e0ddd6;
  --txt:#1a1a1a;--mut:#888888;--hint:#bbbbbb;
  --ok:#0F6E56;--warn:#854F0B;--danger:#A32D2D;--info:#236FAD;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:var(--sur2);color:var(--txt);font-size:13px;line-height:1.4}

/* NAV */
.nav{background:var(--layer);border-bottom:.5px solid rgba(0,0,0,.2);
  display:flex;align-items:center;padding:0 16px;position:sticky;top:0;z-index:50;overflow-x:auto;gap:0}
.nav-home{background:none;border:none;color:rgba(255,255,255,.6);font-size:15px;cursor:pointer;padding:11px 10px 11px 0;flex-shrink:0}
.nav-home:hover{color:#fff}
.nav-logo{font-size:13px;font-weight:600;padding:12px 14px 12px 0;border-right:.5px solid rgba(255,255,255,.2);margin-right:4px;white-space:nowrap;flex-shrink:0;color:#fff}
.ver{background:#F9CB42;color:var(--layer);border-radius:4px;padding:1px 6px;font-size:10px;font-weight:700;margin-left:4px;vertical-align:middle}
.ntab{padding:11px 14px;font-size:11px;color:rgba(255,255,255,.7);cursor:pointer;border:none;background:transparent;border-bottom:2.5px solid transparent;transition:all .15s;white-space:nowrap;flex-shrink:0;font-family:inherit}
.ntab:hover{color:#fff}
body:not(.is-office) .adm-only{display:none!important}
body:not(.nt-on) .nt-only{display:none!important}   /* v32 · Notices：行政＋试行期只有 OWNER */   /* v30 · 只给行政 / 管理层 */
.ntab.on{color:#fff;border-bottom-color:#fff;font-weight:600}
.nav-r{margin-left:auto;display:flex;gap:5px;align-items:center;padding-left:10px;flex-shrink:0}
.btn-nav{padding:5px 12px;border-radius:6px;border:.5px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font-size:11px;font-weight:500;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-nav:hover{opacity:.85}
.saved{font-size:10px;color:rgba(255,255,255,.5);white-space:nowrap}

/* PAGES */
.page{display:none;padding:16px;max-width:1200px;margin:0 auto}
.page.on{display:block}

/* CARDS */
.card{background:var(--sur);border:.5px solid var(--bdr);border-radius:10px;padding:16px;margin-bottom:10px}

/* DEPT TABS */
.dept-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.dept-tab{padding:8px 16px;border-radius:8px;border:1.5px solid var(--bdr);background:var(--sur);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.dept-tab.on{color:#fff;border-color:transparent}
.dept-tab[data-dept="SRK"].on{background:var(--d-srk)}
.dept-tab[data-dept="GAK"].on{background:var(--d-gak)}
.dept-tab[data-dept="ATC"].on{background:var(--d-atc)}
.dept-tab[data-dept="SRT"].on{background:var(--d-srt)}

/* CLASS CARD */
.class-card{background:var(--sur);border:.5px solid var(--bdr);border-radius:10px;margin-bottom:8px;overflow:hidden}
.class-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.class-hdr:active{background:var(--sur2)}
.class-name{font-size:13px;font-weight:600}
.class-stat{font-size:11px;color:var(--mut)}
.class-body{display:none;border-top:.5px solid var(--bdr)}
.class-body.open{display:block}

/* STUDENT ROW */
.stu-row{display:flex;align-items:center;padding:10px 14px;border-bottom:.5px solid var(--bdr);gap:10px}
.stu-row:last-child{border-bottom:none}
.stu-name{flex:1;min-width:84px;font-size:12px;overflow-wrap:anywhere}
.stu-num{font-size:10px;color:var(--mut);width:24px;text-align:center;flex-shrink:0}
.stu-cn{font-size:10px;color:var(--mut)}
.fu-tag{display:inline-block;white-space:nowrap;font-size:9px;font-weight:700;color:#8A5A00;background:#FFF0C2;border:.5px solid #F2D178;border-radius:9px;padding:1px 7px;margin-left:6px;vertical-align:middle;cursor:pointer;flex-shrink:0}
.fu-tag.fu-ok{color:#1E6B4F;background:#E1F5EE;border-color:#9FE1CB}
.fu-ov{position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.fu-box{background:var(--sur);color:var(--txt);max-width:480px;width:100%;max-height:88vh;overflow:auto;border-radius:12px;padding:18px 20px;font-size:13px;line-height:1.5}
.fu-item{border:.5px solid var(--bdr);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.fu-item.fu-done{background:#E1F5EE;border-color:#9FE1CB}
.fu-item.fu-issue{background:#FFF8E1;border-color:#F9CB42}
.fu-item.fu-old{border-left:3px solid #C4622D}
.fu-btn{padding:5px 14px;border-radius:7px;border:1px solid var(--bdr);background:var(--sur);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.fu-btn.on-done{background:#2D6A4F;color:#fff;border-color:transparent}
.fu-btn.on-issue{background:#C4622D;color:#fff;border-color:transparent}
.fu-btn:disabled{opacity:.4;cursor:not-allowed}   /* v35 */
.stu-paused{display:inline-block;font-size:9px;color:#5A6270;background:#E8EAEE;border-radius:9px;padding:1px 7px;margin-left:6px;vertical-align:middle;flex-shrink:0}

/* STATUS TOGGLE */
.status-btn{display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.05;padding:4px 6px;border-radius:6px;font-weight:600;border:1.5px solid var(--bdr);background:var(--sur);cursor:pointer;font-family:inherit;min-width:30px;transition:all .1s;-webkit-tap-highlight-color:transparent}
.status-btn .sb-ic{font-size:12px}
.status-btn .sb-tx{font-size:8px;font-weight:500;opacity:.8}
.sb-wrap{display:flex;gap:4px;flex-shrink:0}
.status-btn.s-present{background:#E1F5EE;color:var(--ok);border-color:#9FE1CB}
.status-btn.s-absent{background:#FCEBEB;color:var(--danger);border-color:#F09595}
.status-btn.s-pend{border:1.5px dashed #E07070;color:var(--danger);background:#FFF7F7}   /* v33 · 家长已通知、还没点 */
.status-btn.s-late{background:#FFF8E1;color:var(--warn);border-color:#F9CB42}
.status-btn.s-early_leave{background:#FFF0E6;color:#C4622D;border-color:#F0B896}
.status-btn.s-mc{background:#EEF2F7;color:var(--info);border-color:#AABDD4}

/* MARK ALL BAR */
.mark-all-bar{display:flex;gap:6px;padding:10px 14px;background:var(--sur2);align-items:center}
.mark-all-bar span{font-size:10px;color:var(--mut);margin-right:auto}

/* STATS GRID */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat-box{background:var(--sur);border:.5px solid var(--bdr);border-radius:8px;padding:12px 10px;text-align:center}
.stat-num{font-size:22px;font-weight:700}
.stat-label{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}

/* DEPT SUMMARY */
.dept-sum{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:.5px solid var(--bdr)}
.dept-sum:last-child{border-bottom:none}
.dept-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dept-info{flex:1}
.dept-info-name{font-size:12px;font-weight:600}
.dept-info-stat{font-size:10px;color:var(--mut)}
.pct-bar{width:80px;height:6px;background:var(--sur2);border-radius:3px;overflow:hidden;flex-shrink:0}
.pct-fill{height:100%;border-radius:3px;background:var(--ok);transition:width .3s}

/* DATE PICKER */
.date-input{padding:8px 12px;border:1px solid var(--bdr);border-radius:8px;font-size:13px;font-family:inherit}

/* AUTH */
#auth-screen{display:flex;justify-content:center;align-items:center;min-height:100vh;background:var(--sur2)}
#auth-box{background:var(--sur);border:1px solid var(--bdr);border-radius:12px;padding:32px 28px;width:340px;max-width:90vw;text-align:center}
#auth-box h2{font-size:18px;font-weight:600;margin-bottom:4px;color:var(--layer)}
#auth-box p{font-size:12px;color:var(--mut);margin-bottom:20px}
#auth-box input{width:100%;padding:10px 12px;border:1px solid var(--bdr);border-radius:8px;font-size:13px;margin-bottom:10px;font-family:inherit}
#auth-box button{width:100%;padding:10px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;margin-bottom:6px}
.btn-login{background:var(--layer);color:#fff}
.btn-magic{background:var(--sur2);color:var(--mut);border:1px solid var(--bdr)!important}
#auth-err{color:var(--danger);font-size:11px;min-height:16px;margin-bottom:8px}
#loading-screen{display:none;justify-content:center;align-items:center;min-height:60vh;font-size:13px;color:var(--mut)}
#app{display:none}

/* HOLIDAY BANNER */
.holiday-banner{background:#FFF8E1;border:1px solid #F9CB42;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--warn);font-weight:500}

/* HISTORY TABLE */
.hist-row{display:flex;align-items:center;padding:8px 14px;border-bottom:.5px solid var(--bdr);font-size:12px}
.hist-row:last-child{border-bottom:none}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--txt);color:#fff;
  padding:9px 18px;border-radius:8px;font-size:12px;font-weight:500;opacity:0;
  transition:opacity .25s,transform .25s;pointer-events:none;z-index:9999;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* MANAGE */
.mg-title{font-size:11px;font-weight:600;color:var(--mut);letter-spacing:.05em;text-transform:uppercase;margin-bottom:12px}
.mg-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:.5px solid var(--bdr);font-size:12px}
.mg-row:last-child{border-bottom:none}
.mg-row .k{color:var(--mut)}
.mg-row .v{font-weight:600}
.mg-code{font-size:11px;background:var(--sur2);padding:2px 6px;border-radius:3px;font-family:monospace}
.btn-pri{padding:8px 16px;border-radius:8px;border:none;background:var(--layer);color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}

@media(max-width:480px){.stat-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<div id="auth-screen">
  <div id="auth-box">
    <h2>AttendanceGo</h2>
    <p>Daily Attendance · Login</p>
    <div id="auth-err"></div>
    <input type="email" id="auth-email" placeholder="Email">
    <input type="password" id="auth-pass" placeholder="Password">
    <button class="btn-login" onclick="doLogin()">Sign In</button>
    <div style="display:flex;align-items:center;gap:12px;margin:4px 0"><div style="flex:1;height:1px;background:var(--bdr)"></div><span style="font-size:12px;color:var(--mut)">or</span><div style="flex:1;height:1px;background:var(--bdr)"></div></div>
    <button class="btn-magic" onclick="doMagicLink()">Send Magic Link</button>
  </div>
</div>

<div id="loading-screen">Loading data…</div>

<!-- NO ACCESS -->
<div id="no-access" style="display:none;min-height:100vh;background:var(--bg);justify-content:center;align-items:center">
  <div style="text-align:center;padding:40px">
    <div style="font-size:48px;margin-bottom:12px">🔒</div>
    <div style="font-size:18px;font-weight:600;color:var(--layer);margin-bottom:8px">No Access</div>
    <div style="font-size:12px;color:var(--mut)">You do not have permission to view this system.</div>
    <button onclick="location.href='/index.html'" style="margin-top:20px;padding:8px 20px;border-radius:8px;border:none;background:var(--layer);color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">← Back to Home</button>
  </div>
</div>

<div id="app">
  <div class="nav">
    <button class="nav-home" onclick="location.href='/index.html'">←</button>
    <div class="nav-logo">OPR-AttendanceGo <span class="ver">v42</span></div>

    <div class="nav-r"><span class="saved" id="last-saved"></span><button class="btn-nav adm-only" onclick="exportData()">↑ Export</button><label class="btn-nav adm-only" style="cursor:pointer">↓ Import<input type="file" accept=".json" onchange="importData(event)" style="display:none"/></label></div>
  </div>

      <div style="font-size:11px;color:var(--mut);margin-bottom:16px" id="em-subtitle"></div>
      <div style="margin-bottom:10px">
        <label style="font-size:11px;font-weight:600;display:block;margin-bottom:4px">End Date</label>
        <input type="date" id="em-end" style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--bdr);font-size:13px;font-family:inherit">
      </div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button onclick="closeEndModal()" style="flex:1;padding:10px;border-radius:8px;border:1px solid var(--bdr);background:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">Cancel</button>
        <button onclick="submitEndModal()" style="flex:1;padding:10px;border-radius:8px;border:none;background:var(--warn);color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">End Rule</button>

  </div>
  <div class="page" id="page-atcweek"><div id="atcweek-content"></div></div>

      <div id="sw-body"></div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button onclick="swClose()" style="flex:1;min-height:44px;border-radius:8px;border:1px solid var(--bdr);background:var(--sur);font-size:13px;cursor:pointer;font-family:inherit">Cancel</button>

const ROW_STATUSES=['present','absent','late','early_leave'];
function absKind(status,note){
  if(status==='mc') return 'MC';
  if(status!=='absent') return '';
  const n=String(note||'');
  if(/^Absent: Holiday/.test(n)) return 'Holiday';
  if(/^Absent: Stay back/.test(n)) return 'Stay back';
  if(/^Absent: Not informed/.test(n)) return 'Not informed';
  if(/^Absent: Other/.test(n)) return /Not informed$/.test(n)?'Not informed':'Other';
  if(/^Absent: School event/.test(n)) return 'School event';     /* v29 */
  if(/^Absent: Family matter/.test(n)) return 'Family matter';   /* v29 */
  if(/^Absent: Notified/.test(n)) return 'Notified';             /* v29 · Notified — no reason */
  return 'Absent';
}

/* v26 · E-Class Attendance 写进来的纪录：note 开头 "E SAT.AM" / "E SAT.NN"（迟到是 "E SAT.AM · Late: 08:45"）。
   只有 Present / Late 换成 E 标记；缺席、MC、早退照旧（Owner 10-10）。 */
function eMark(r){
  if(!r||(r.status!=='present'&&r.status!=='late')) return '';
  const m=String(r.note||'').match(/^E [A-Z]{3}\.(AM|NN|PM)( ·|$)/);
  return m?('E·'+m[1]+(r.status==='late'?'⏰':'')):'';
}
function eRowTag(note){
  return '';   /* v42 · 不再显示 E-Class 标签 */
  const m=String(note||'').match(/(^|· )E ([A-Z]{3})\.(AM|NN|PM)( ·|$)/);
  return m?'<span style="font-size:9px;font-weight:700;color:#6B6B3A;background:rgba(107,107,58,.12);border-radius:8px;padding:1px 7px;margin-left:6px;vertical-align:middle;white-space:nowrap">E-Class '+m[3]+'</span>':'';
}
function attMark(r,ICON){
  /* v42 · E-Class 纪录照一般 ✓ 显示 */
  if(r&&r.status==='absent'){ const k=absKind('absent',r.note); if(k==='Holiday') return 'Hol'; if(k==='Stay back') return 'SB'; }
  return ICON[r.status];
}

function absentPicker(dept,name,notice,rule,pre,canClear){   /* v33 · canClear = 这孩子已经是缺席 → 可以清掉 */   /* v32 · pre = 晚到通知（ATC 3:00 后到 → 功课班算有通知的缺席） */   /* v30 · rule = 当天的固定例外（缺席类）→ 预选 */   /* v29 · notice = MiscGo 家长请假（有就预选） */
  return new Promise(resolve=>{
    const ov=document.createElement('div'); ov.id='abs-ov';
    ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:9999;display:flex;align-items:flex-end;justify-content:center';
    /* v29 · 选单与 MiscGo 请假单一致：MC · Holiday · School event · Family matter ·（ATC）Stay back · Notified · no reason · Other */
    const opts=[['mc','MC'],['holiday','Holiday'],['school','School event'],['family','Family matter']].concat(dept==='ATC'?[['stay','Stay back']]:[]).concat([['nonr','Notified · no reason'],['other','Other']]);
    const _nt=notice&&NT_REASON[notice.reason_code]?NT_REASON[notice.reason_code]:null;
    const btn=(k,t,st)=>`<button data-k="${k}" style="flex:1 1 40%;min-height:46px;margin:4px;border-radius:10px;border:1px solid var(--bdr);background:var(--sur);color:var(--txt);font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;${st||''}">${t}</button>`;
    const nm=String(name||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const _pre=(!_nt&&pre)?pre:null;   /* v32 */
    const _rl=(!_nt&&!_pre&&rule)?String(rule.reason||'').trim():null;   /* v30 · 家长通知优先；没有才用固定例外 */
    const _rlH=_rl===null?'':String(_rl||'Weekly exception').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const step1=()=>`<div style="font-size:13px;color:var(--mut);margin:0 4px 8px">Absent — ${nm}</div>`
      +(_nt?`<div style="margin:0 4px 8px;padding:8px 10px;border-radius:10px;background:#E7F6EC;color:#1E6B3A;font-size:13px">Parent notified the office: <b>${_nt.label}</b></div>${btn('nt','Absent · '+_nt.label+' (as notified)','background:#1E6B3A;color:#fff;border-color:transparent;flex-basis:100%')}<div style="font-size:12px;color:var(--mut);margin:6px 4px 2px">Or choose another reason:</div>`:'')
      +(_pre?`<div style="margin:0 4px 8px;padding:8px 10px;border-radius:10px;background:#FFF1D6;color:#7A4A00;font-size:13px">Parent notified the office: <b>${_pre.label}</b></div>${btn('pre','Absent · '+_pre.label+' (as notified)','background:#7A4A00;color:#fff;border-color:transparent;flex-basis:100%')}`:'')
      +(_rl!==null?`<div style="margin:0 4px 8px;padding:8px 10px;border-radius:10px;background:#EEF0FB;color:#3D3A8C;font-size:13px">Weekly exception: <b>${_rlH}</b></div>${btn('rl','Absent · '+_rlH+' (weekly exception)','background:#3D3A8C;color:#fff;border-color:transparent;flex-basis:100%')}`:'')
      +`<div style="display:flex;flex-wrap:wrap">${opts.map(([k,t])=>btn(k,t)).join('')}</div>${canClear?btn('clr','Not marked (clear this mark)','color:var(--danger);border-color:var(--danger);flex-basis:100%'):''}${btn('cancel','Cancel','background:transparent;border:none;color:var(--mut);font-weight:500;flex-basis:100%')}`;
    const step2=k=>`<div style="font-size:13px;color:var(--mut);margin:0 4px 8px">${k==='stay'?'Stay back':'Other'} — ${nm}</div>
      <input id="abs-why" placeholder="${k==='stay'?'Reason (e.g. extra class at school)':'Reason'}" style="width:100%;box-sizing:border-box;min-height:44px;padding:8px 12px;border:1px solid var(--bdr);border-radius:10px;font-size:15px;font-family:inherit;margin-bottom:6px">
      ${k==='other'?'<div id="abs-hint" style="font-size:12px;color:var(--mut);margin:0 4px 6px">Type the reason to Save. Don\'t know why? Tap Not informed.</div>':''}<div style="display:flex;flex-wrap:wrap">${btn('save','Save','background:var(--layer);color:#fff;border-color:transparent'+(k==='other'?';opacity:.4':''))}${btn('ni','Not informed')}</div>${btn('back','Back','background:transparent;border:none;color:var(--mut);font-weight:500;flex-basis:100%')}`;
    const box=document.createElement('div');
    box.style.cssText='background:var(--sur);width:100%;max-width:480px;border-radius:16px 16px 0 0;padding:16px 12px calc(16px + env(safe-area-inset-bottom))';
    ov.appendChild(box); document.body.appendChild(ov);
    let cur=null;
    const done=v=>{ ov.remove(); resolve(v); };
    const draw=()=>{ box.innerHTML=cur?step2(cur):step1(); if(cur){ const i=box.querySelector('#abs-why'); i&&i.focus();
      /* v27 · Other 没填原因 → Save 变淡、按了没反应 */
      if(cur==='other'&&i){ const sv=box.querySelector('button[data-k="save"]'); const upd=()=>{ const ok=!!i.value.trim(); sv.style.opacity=ok?'1':'.4'; sv.disabled=!ok; }; i.addEventListener('input',upd); upd(); } } };
    box.addEventListener('click',e=>{
      const k=e.target.closest('button')&&e.target.closest('button').dataset.k; if(!k) return;
      if(k==='cancel') return done(null);
      if(k==='clr') return done({clear:true});   /* v33 */
      if(k==='mc') return done({status:'mc',note:''});
      if(k==='holiday') return done({status:'absent',note:'Absent: Holiday'});
      if(k==='school') return done({status:'absent',note:'Absent: School event'});      /* v29 */
      if(k==='family') return done({status:'absent',note:'Absent: Family matter'});     /* v29 */
      if(k==='nonr') return done({status:'absent',note:'Absent: Notified — no reason'}); /* v29 */
      if(k==='nt'&&_nt) return done(Object.assign({},_nt.pick));                        /* v29 · 照家长通知 */
      if(k==='pre'&&_pre) return done(Object.assign({},_pre.pick));   /* v32 */
      if(k==='rl'&&_rl!==null) return done({status:'absent',note:'Absent: Other — '+(_rl||'Weekly exception')+' (weekly exception)'});   /* v30 */
      if(k==='stay'||k==='other'){ cur=k; return draw(); }
      if(k==='back'){ cur=null; return draw(); }
      const label=cur==='stay'?'Stay back':'Other';
      if(k==='ni') return done({status:'absent',note:'Absent: '+label+' — Not informed'});
      if(k==='save'){ const w=(box.querySelector('#abs-why').value||'').trim(); if(cur==='other'&&!w) return; return done({status:'absent',note:'Absent: '+label+(w?' — '+w:'')}); }
    });
    ov.addEventListener('click',e=>{ if(e.target===ov) done(null); });
    draw();
  });
}

/* ═══ v29 · MiscGo 学生请假通知（只读）══════════════════════════════
   资料库函式 notices_for_marking(日期, 部门) 只回这个帐号看得到的部门、只回点名需要的栏位。
   通知不写点名：老师按 Absent 才写，原因预选成家长说的那个。读不到 → 黄条，点名照常（不当成「没有通知」）。
   作废的通知下次读取就消失（切回分页、每 60 秒、换日期 / 部门）；已经点好的名不动。 */
let noticeCache={};        // 'YYYY-MM-DD|DEPT' → {ok, rows, sig}
let noticeInflight={};
let noticeScope={};        // DEPT → false = 这个帐号看不到该部门的通知
let noticeEditor=false;    // 行政 / 管理层：四个部门都看得到
const NT_REASON={
  mc:{label:'MC',pick:{status:'mc',note:''}},
  holiday:{label:'Holiday',pick:{status:'absent',note:'Absent: Holiday'}},
  school_event:{label:'School event',pick:{status:'absent',note:'Absent: School event'}},
  family_matter:{label:'Family matter',pick:{status:'absent',note:'Absent: Family matter'}},
  other:{label:'Other',pick:{status:'absent',note:'Absent: Other — Parent notified (MiscGo)'}},
  notified_no_reason:{label:'No reason given',pick:{status:'absent',note:'Absent: Notified — no reason'}}
};
async function loadNotices(date,dept){
  const key=date+'|'+dept;
  if(noticeInflight[key]) return noticeInflight[key];
  noticeInflight[key]=(async()=>{
    try{
      const{data,error}=await _sb.rpc('notices_for_marking',{p_date:date,p_dept:dept});
      if(error) throw error;
      const rows=(data||[]);   /* v32 · 所有种类（请假、早走、晚到、晚接、换人接） */
      noticeCache[key]={ok:true,rows,sig:JSON.stringify(rows.map(r=>[r.id,r.student_id,r.sessions,r.reason_code,r.date_from,r.date_to]))};
    }catch(e){ console.warn('[v29] notices not loaded',e); noticeCache[key]={ok:false,rows:[],sig:'ERR'}; }
    if(noticeScope[dept]===undefined&&!noticeEditor){
      try{ const{data,error}=await _sb.rpc('user_has_dept',{check_dept:dept}); if(!error) noticeScope[dept]=(data===true); }catch(e){}
    }
    delete noticeInflight[key];
    return noticeCache[key];
  })();
  return noticeInflight[key];
}
/* 这位孩子、这个部门、这一节（ATC 1 = H/W，2 = Lesson；其他部门 0）有没有有效的请假通知 */
function noticeFor(studentId,dept,session){
  const c=noticeCache[selectedDate+'|'+dept]; if(!c||!c.ok) return null;
  const s=dept==='ATC'?(session??currentSession):0;
  return c.rows.find(r=>r.kind==='absence'&&r.student_id===studentId&&r.dept===dept&&r.date_from<=selectedDate&&r.date_to>=selectedDate&&(r.sessions||[]).includes(s))||null;
}
/* v32 · 时间类通知（早走 / 晚到 / 晚接 / 换人接）：这位孩子、这个部门、这一节 */
function timeNoticesFor(studentId,dept,session){
  const c=noticeCache[selectedDate+'|'+dept]; if(!c||!c.ok) return [];
  const s=dept==='ATC'?(session??currentSession):0;
  return c.rows.filter(r=>r.kind!=='absence'&&r.student_id===studentId&&r.dept===dept&&r.date_from<=selectedDate&&r.date_to>=selectedDate&&(r.sessions||[]).includes(s));
}
function noticeOf(studentId,dept,session,kind){ return timeNoticesFor(studentId,dept,session).find(r=>r.kind===kind&&r.expected_time)||null; }
function ntHmT(t){ return t?String(t).slice(0,5):''; }
function ntTimeTag(studentId,dept,session){
  return timeNoticesFor(studentId,dept,session).map(r=>{
    const t=ntHmT(r.expected_time);
    const tx=r.kind==='early_leave'?'Leaves '+t:r.kind==='late_arrival'?'Arrives '+t:r.kind==='late_pickup'?'Pick-up '+t:'';
    if(r.kind==='pickup_change') return '<span style="font-size:10px;font-weight:700;color:#1E4E8C;background:#E3EEFB;border-radius:8px;padding:1px 7px;margin-left:6px;vertical-align:middle;white-space:nowrap">🚗 Pick-up change'+(t?' · '+t:'')+'</span>';   /* v40 · 换人接一律显示 */

function ntEsc(v){ return _escHtml(v); }
function ntToast(m,err){ toast(m,err?6000:3500); }
function ntUid(){
  if(window.crypto&&crypto.randomUUID) return crypto.randomUUID();
  const b=new Uint8Array(16); crypto.getRandomValues(b); b[6]=(b[6]&15)|64; b[8]=(b[8]&63)|128;
  const h=[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
  return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
}
function ntToday(){ return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kuala_Lumpur'}).format(new Date()); }
function ntAddDays(iso,n){ const d=new Date(iso+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function ntDays(a,b){ return Math.round((new Date(b+'T12:00:00Z')-new Date(a+'T12:00:00Z'))/86400000); }
function ntDmy(iso){ if(!iso) return ''; const p=iso.split('-'); return p[2]+'-'+p[1]+'-'+p[0]; }
function ntDow(iso){ return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(iso+'T12:00:00').getDay()]; }
function ntDates(f,t){ return f===t?(ntDmy(f)+' ('+ntDow(f)+')'):(ntDmy(f)+' to '+ntDmy(t)+' ('+(ntDays(f,t)+1)+' days)'); }
function ntHm(t){ return t?String(t).slice(0,5):''; }
function ntStu(sid){ return allStudents.find(s=>s.id===sid)||null; }

/* ── 本机待送清单：写进去、读回来一样才算存好 ──────────────────────────── */
function ntStoreRead(){ try{ const v=JSON.parse(localStorage.getItem(NT_Q_KEY)||'[]'); return Array.isArray(v)?v:[]; }catch(e){ return []; } }
function ntLoadQ(){ const q=ntStoreRead(); Object.values(NT.qmem).forEach(m=>{ const i=q.findIndex(x=>x.submission_id===m.submission_id); if(i>=0) q[i]=m; else q.push(m); }); return q; }
function ntSaveQ(q){
  try{ const txt=JSON.stringify(q); localStorage.setItem(NT_Q_KEY,txt); if(localStorage.getItem(NT_Q_KEY)!==txt) throw new Error('read-back mismatch'); NT.storageBad=false; return true; }
  catch(e){ console.warn('[nt] local queue not saved',e); NT.storageBad=true; return false; }
}
function ntQGet(id){ return NT.qmem[id]||ntStoreRead().find(x=>x.submission_id===id)||null; }
function ntQPut(sub){
  NT.qmem[sub.submission_id]=sub;
  const q=ntStoreRead(); const i=q.findIndex(x=>x.submission_id===sub.submission_id); if(i>=0) q[i]=sub; else q.push(sub);
  const ok=ntSaveQ(q); if(!ok) sub._notSaved=true; else delete sub._notSaved; return ok;
}
function ntQDel(id){ delete NT.qmem[id]; return ntSaveQ(ntStoreRead().filter(x=>x.submission_id!==id)); }

/* 资料库函式：15 秒逾时；分清楚「连不上」与「系统说不行」 */
async function ntRpc(fn,args){
  try{
    const r=await Promise.race([_sb.rpc(fn,args),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),15000))]);
    if(r.error){
      const msg=String(r.error.message||''); const code=String(r.error.code||'');
      if(code==='42501'||/NOT_AUTHORIZED/.test(msg)) return {kind:'denied',code:'NOT_AUTHORIZED'};
      if(!code||/fetch|network|Failed|timeout/i.test(msg)) return {kind:'offline'};
      return {kind:'error',code:code,message:msg};
    }
    const d=r.data;
    if(d&&typeof d==='object'&&!Array.isArray(d)&&d.ok===false) return {kind:'rejected',code:d.code||'ERROR',data:d};
    return {kind:'ok',data:d};
  }catch(e){ return {kind:'offline'}; }
}
function ntErrText(res){
  if(res.kind==='offline') return 'Could not reach the system (no internet?). Nothing is lost — tap Retry.';
  if(res.kind==='denied') return NT_ERR.NOT_AUTHORIZED;
  const c=res.code||''; return NT_ERR[c]||('The system did not accept this ('+c+').');
}

async function ntLoadList(){
  const box=()=>document.getElementById('nt-list');
  try{
    const r=await Promise.race([
      _sb.from('attendance_notice').select('id,submission_id,kind,student_id,dept,class_code,date_from,date_to,sessions,reason_code,reason_text,expected_time,bathe,lunch,pickup_name,pickup_relation,car_plate,remark,status,void_reason,record_id,created_at')
        .gte('date_to',ntAddDays(ntToday(),-7)).order('date_from',{ascending:false}).order('created_at',{ascending:false}).limit(400),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),15000))]);
    if(r.error) throw r.error;
    NT.list=r.data||[]; NT.listErr=''; NT.deliv={};
    const subs=[...new Set(NT.list.map(n=>n.submission_id))];
    if(subs.length){ const d=await _sb.from('attendance_message_delivery').select('id,submission_id,state,stale_at,created_at,content_fingerprint').in('submission_id',subs).order('created_at',{ascending:true});
      if(!d.error)(d.data||[]).forEach(x=>{ (NT.deliv[x.submission_id]=NT.deliv[x.submission_id]||[]).push(x); }); }
    const rids=[...new Set(NT.list.map(n=>n.record_id).filter(Boolean))];
    if(rids.length) NT.closeWarn=!(await ntCloseRecords(rids));
    /* v41 · 以前开过 WhatsApp 没按 I've sent it 的 → 照 MiscGo 算已送出，补记 */
    Object.values(NT.deliv).flat().filter(d=>d.state==='OPENED_WHATSAPP'&&!d.stale_at).forEach(d=>{
      ntRpc('delivery_confirm_sent',{p_id:d.id,p_fingerprint:d.content_fingerprint}).then(r=>{ if(r.kind==='ok'){ d.state='MANUALLY_CONFIRMED_SENT'; ntMarkRecordsSent(d.submission_id); } }); });
  }catch(e){ NT.list=null; NT.listErr='Could not load the list (no internet?).'; }
  if(box()) box().innerHTML=ntListHtml();
}
/* v33 · 一则通知有没有告诉群：自己那则、或合并的那则送出了都算（资料库 att_messages 算好的） */
function ntMsgStateN(n){
  const x=MS&&MS.data&&(MS.data.notices||[]).find(y=>y.id===n.id);
  if(x){ if(n.status!=='active') return {sent:x.sent,cancel_sent:x.cancel_sent,txt:''}; if(x.sent) return {sent:true,txt:'Message sent ✓'}; }
  return ntMsgState(n.submission_id);
}
function ntMsgState(subId){
  const ds=NT.deliv[subId]||[];
  if(ds.some(d=>d.state==='MANUALLY_CONFIRMED_SENT')) return {sent:true,txt:'Message sent ✓'};
  if(ds.some(d=>d.state==='OPENED_WHATSAPP'&&!d.stale_at)) return {sent:true,txt:'Message sent ✓'};   /* v41 · 打开过 WhatsApp 就算送出（下面会补记） */
  return {sent:false,txt:'Message not sent'};
}
/* 原文只是通知（不是要处理的个案）→ 设成 closed；回传有没有真的做到 */
async function ntCloseRecords(ids){
  try{
    const T=['ATT_ABSENCE'];   /* v41 · 换时间 / 换人接照 MiscGo 原本留著（Dashboard 看得到）；请假照 MiscGo v12 收起来 */
    const r=await _sb.from('records').update({status:'closed'}).in('id',ids).in('report_type',T).neq('status','closed').select('id');
    if(r.error) return false;
    const left=await _sb.from('records').select('id').in('id',ids).in('report_type',T).neq('status','closed');
    return !left.error&&!(left.data||[]).length;
  }catch(e){ return false; }
}

/* 孩子在哪些部门、哪一班（那一天有效的班籍；资料库会再检查一次 Enrolled） */
function ntMems(sid,iso){
  const order=['SRK','GAK','ATC','SRT'], pick={};
  allMemberships.filter(m=>m.student_id===sid&&m.start_date<=iso&&(m.end_date==null||m.end_date>iso)&&!String(m.class_code||'').includes('RSVP'))
    .forEach(m=>{ if(!pick[m.dept]||(m.start_date||'')>(pick[m.dept].start_date||'')) pick[m.dept]=m; });
  return Object.values(pick).map(m=>({dept:m.dept,cls:m.class_code})).sort((a,b)=>order.indexOf(a.dept)-order.indexOf(b.dept));
}
function ntHasClassOn(dept,cls,iso){
  const dow=new Date(iso+'T12:00:00').getDay();
  if(dept==='SRT'){ const D=['SUN','MON','TUE','WED','THU','FRI','SAT']; return String(cls||'').replace(/^SRT[-_]/,'').split(/[._]/).includes(D[dow]); }

}

/* 检查（与资料库同一套规则，资料库还会再检查一次） */
function ntValidate(f){
  const today=ntToday();
  if(!f.from) return 'Please choose the date.';
  if(f.kind==='absence'){ if(!f.to) return 'Please choose the dates.'; if(f.to<f.from) return 'The last day is before the first day.'; if(ntDays(f.from,f.to)>30) return 'At most 31 days. For longer leave use the Student page (Pause).'; }
  if(f.from<ntAddDays(today,-7)) return NT_ERR.TOO_OLD;
  if(!f.kids.length) return 'Please add at least one child.';
  for(const k of f.kids){ if(!Object.keys(k.depts).length) return 'Tick at least one class for '+ntStuName(k.sid)+'.'; }
  if(f.kind==='absence'){ if(!f.reason) return 'Please choose the reason.'; if(f.reason==='other'&&!(f.reason_text||'').trim()) return 'Please write the reason.'; }
  if(['early_leave','late_arrival','late_pickup'].includes(f.kind)&&!/^\d{2}:\d{2}/.test(f.time||'')) return 'Please choose the time.';
  if(f.kind==='pickup_change'&&(!(f.pickup_name||'').trim()||!(f.pickup_relation||'').trim())) return 'Please write who picks up and the relation.';
  return '';
}
function ntRows(f){
  const rows=[];
  f.kids.forEach(k=>Object.keys(k.depts).sort().forEach(d=>{
    const r={client_uid:ntUid(),kind:f.kind,student_id:k.sid,dept:d,date_from:f.from,date_to:f.kind==='absence'?f.to:f.from,
      sessions:d==='ATC'?k.depts[d].split(',').map(Number):[0],remark:(f.remark||'').trim()||null};
    if(f.kind==='absence'){ r.reason_code=f.reason; r.reason_text=f.reason==='other'?(f.reason_text||'').trim():null; }
    else if(f.kind==='pickup_change'){ r.pickup_name=f.pickup_name.trim(); r.pickup_relation=f.pickup_relation.trim(); r.car_plate=(f.car_plate||'').trim()||null; r.expected_time=f.time||null; }
    else { r.expected_time=f.time; r.bathe=f.bathe; r.lunch=f.lunch; }
    rows.push(r);
  }));
  return rows;
}
function ntSummary(f){
  if(f.kind==='absence') return '<b>Reason:</b> '+NT_REASON_LABEL[f.reason]+(f.reason==='other'?': '+ntEsc(f.reason_text):'');
  if(f.kind==='pickup_change') return '<b>Pick-up:</b> '+ntEsc(f.pickup_name)+' ('+ntEsc(f.pickup_relation)+')'+(f.car_plate?' · '+ntEsc(f.car_plate):'')+(f.time?' · going home '+f.time:'');
  return '<b>'+NT_KIND_LABEL[f.kind]+':</b> '+f.time+(f.bathe!=null?' · Bathe: '+(f.bathe?'Yes':'No'):'')+(f.lunch!=null?' · Lunch: '+(f.lunch?'Yes':'No'):'');
}

  const f=NT.form, e=ntValidate(f); if(e){ NT.err=e; ntDrawForm(); return; }
  NT.err='';

    +(f.remark?'<div style="font-size:13px"><b>Note:</b> '+ntEsc(f.remark)+'</div>':'');

/* ── 存档：先在本机记下 id，再送资料库 ────────────────────────────────── */
async function ntSubmit(){
  if(NT.busy) return;
  const f=NT.form, e=ntValidate(f); if(e){ NT.err=e; ntDrawForm(); return; }
  NT.busy=true; const btn=document.getElementById('nt-save'); if(btn){ btn.disabled=true; btn.textContent='Saving…'; }
  const sig=JSON.stringify(f); let sub;
  if(NT.unsaved&&NT.unsaved.formSig===sig) sub=NT.unsaved;
  else{ const rows=ntRows(f); const rec={}; [...new Set(rows.map(r=>r.student_id))].forEach(sid=>rec[sid]=ntUid());
    sub={submission_id:ntUid(),created:Date.now(),rows,record_uids:rec,delivery_uid:ntUid(),stage:'submit',err:'',form:JSON.parse(sig),formSig:sig}; }
  if(!ntQPut(sub)){
    delete NT.qmem[sub.submission_id]; NT.unsaved=sub; NT.busy=false;
    if(btn){ btn.disabled=false; btn.textContent='Save'; }
    const box=document.getElementById('nt-review-err'); if(box){ box.textContent=NT_STORE_MSG; box.style.display='block'; } else ntToast(NT_STORE_MSG,true);
    return;
  }
  NT.unsaved=null; NT.form=ntBlankForm(f.kind); try{ localStorage.removeItem(NT_FORM_KEY); }catch(e){}
  await ntRun(sub.submission_id,true); NT.busy=false;
}
async function ntResume(id){ if(NT.busy) return; NT.busy=true; await ntRun(id,false); NT.busy=false; }
async function ntRun(id,fromForm){
  let sub=ntQGet(id); if(!sub) return;
  if(sub.stage==='submit'){
    const res=await ntRpc('notice_submit',{p_submission_id:sub.submission_id,p_rows:sub.rows});
    if(res.kind==='offline'){ sub.err='No internet — tap Retry'; ntQPut(sub); if(fromForm) ntClose(); ntToast('Could not reach the system. It is kept on this device — tap Retry when online.',true); ntRender(); return; }
    if(res.kind!=='ok'){
      ntQDel(id);
      const who=res.data&&res.data.student_id?(' ('+ntStuName(res.data.student_id)+(res.data.dept?' · '+res.data.dept:'')+')'):'';
      NT.form=sub.form||ntBlankForm(); ntSaveForm(); NT.err=ntErrText(res)+who;
      if(!fromForm) ntRender(); ntDrawForm(); return;
    }
    sub.notices=(res.data.rows||[]).map(r=>({id:r.id,student_id:r.student_id,dept:r.dept}));
    sub.stage='record'; sub.err=''; if(!ntQPut(sub)) ntToast(NT_STAGE_MSG,true);
    for(const k in noticeCache) delete noticeCache[k];   /* 点名页重新读通知 */
  }
  if(sub.stage==='record'){
    const kind=sub.rows[0].kind;
    const p=Object.keys(sub.record_uids||{}).map(sid=>({client_uid:sub.record_uids[sid],student_id:sid,report_type:NT_RTYPE[kind],report_date:sub.rows[0].date_from,
      depts:[...new Set(sub.rows.filter(r=>r.student_id===sid).map(r=>r.dept))].sort()}));
    const res=await ntRpc('notice_record_write',{p_submission_id:sub.submission_id,p_rows:p});
    if(res.kind==='offline'){ sub.err='Saved. Message not ready — tap Send message when online'; const kept=ntQPut(sub); ntClose(); ntToast(kept?'Saved. Teachers can see it. The message will be ready when you are online.':'Saved. Teachers can see it. When online, tap Send message on the notice in the list.',!kept); ntRender(); return; }
    if(res.kind!=='ok'){ sub.err='Saved, but the message could not be prepared ('+(res.code||'')+')'; sub.stage='done'; ntQPut(sub); ntClose(); ntToast('Saved. Teachers can see it. The WhatsApp message could not be prepared — please tell the group yourself.',true); ntRender(); return; }
    const ids=(res.data.rows||[]).map(r=>r.record_id).filter(Boolean);
    sub.record_ids=ids; sub.stage='message'; sub.err=''; if(!ntQPut(sub)) ntToast(NT_STAGE_MSG,true);
    if(ids.length){ const ok=await ntCloseRecords(ids); if(!ok) NT.closeWarn=true; }
  }
  if(sub.stage==='message'){
    const res=await ntRpc('delivery_prepare',{p_client_uid:sub.delivery_uid,p_source:'notice_submission',p_submission_id:sub.submission_id,p_list_date:null,p_depts:null,p_content:null});
    if(res.kind==='offline'){ sub.err='Saved. Message not ready — tap Send message when online'; const kept=ntQPut(sub); ntClose(); ntToast(kept?'Saved. Teachers can see it. Tap Send message when you are online.':'Saved. Teachers can see it. When online, tap Send message on the notice in the list.',!kept); ntRender(); return; }
    if(res.kind!=='ok'){ sub.err='Saved. Message not available ('+(res.code||'')+')'; sub.stage='done'; ntQPut(sub); ntClose(); ntToast('Saved. Teachers can see it. The message is no longer available (something was changed or cancelled).',true); ntRender(); return; }
    sub.delivery={id:res.data.id,state:res.data.state,fingerprint:res.data.fingerprint,content:res.data.content}; sub.err=''; if(!ntQPut(sub)) ntToast(NT_STAGE_MSG,true);
    if(res.data.state==='MANUALLY_CONFIRMED_SENT'||res.data.state==='CANCELLED'){ sub.stage='done'; ntQPut(sub); ntRender(); return; }
    ntSendPanel(sub.submission_id);
  }
}

/* v39 · 照 MiscGo 的开法：先直接叫 WhatsApp app；2 秒后页面还在前景（电脑没装 app）才开网页版。
   以前直接开 wa.me 网页 → 多一页「Share on WhatsApp」不会自己关，讯息在那页也看不出分行 */
function ntWhatsApp(text){
  if(!text) return;
  const e=encodeURIComponent(text);
  let left=false;
  const mark=()=>{left=true;};
  const onVis=()=>{if(document.hidden)left=true;};
  document.addEventListener('visibilitychange',onVis);
  window.addEventListener('blur',mark); window.addEventListener('pagehide',mark);
  window.location.href='whatsapp://send?text='+e;
  setTimeout(()=>{
    document.removeEventListener('visibilitychange',onVis);
    window.removeEventListener('blur',mark); window.removeEventListener('pagehide',mark);
    if(!left&&!document.hidden) window.open('https://wa.me/?text='+e,'_blank');
  },2000);
}
async function ntOpenWA(id,method){
  const sub=ntQGet(id); if(!sub||!sub.delivery) return;
  if(method==='whatsapp_link') ntWhatsApp(sub.delivery.content);   /* v39 · 按下去当下就开 */
  const res=await ntRpc('delivery_mark_opened',{p_id:sub.delivery.id,p_method:method});
  if(res.kind!=='ok'){ ntToast(ntErrText(res),true); return; }
  sub.delivery.state='OPENED_WHATSAPP'; ntQPut(sub);
  if(method==='copied'){ try{ await navigator.clipboard.writeText(sub.delivery.content); ntToast('Copied — paste it in the WhatsApp group'); }catch(e){ ntToast('Could not copy — select the text and copy it',true); } }
  await ntConfirmSent(id);   /* v41 · 跟 MiscGo 一样：打开 WhatsApp 就算送出 */
}
/* v41 · MiscGo 纪录也标「已送 WhatsApp」（MiscGo Dashboard 才不会写 Not sent） */
async function ntMarkRecordsSent(subId){
  try{ if(subId) await _sb.from('records').update({wa_sent:true,wa_sent_at:new Date().toISOString()}).eq('submission_id',subId).eq('wa_sent',false); }catch(e){}
}
async function ntConfirmSent(id){
  const sub=ntQGet(id); if(!sub||!sub.delivery) return;
  const res=await ntRpc('delivery_confirm_sent',{p_id:sub.delivery.id,p_fingerprint:sub.delivery.fingerprint});
  if(res.kind==='ok'){ sub.stage='done'; sub.delivery.state='MANUALLY_CONFIRMED_SENT'; ntQPut(sub); ntMarkRecordsSent(sub.submission_id); ntClose(); ntToast('✓ Sent to WhatsApp'); ntRender(); return; }
  if(res.kind==='rejected'&&res.code==='STALE'){ sub.stage='done'; sub.err='Message out of date — something was cancelled after it was prepared'; ntQPut(sub); ntClose(); ntToast('This message is out of date (a notice was changed or cancelled). Please tell the group yourself.',true); ntRender(); return; }
  ntToast(ntErrText(res),true);
}
async function ntCancelMsg(id){
  const sub=ntQGet(id); if(!sub||!sub.delivery) return;
  if(!confirm('Do not send this message?\n\nThe notice stays saved — teachers still see it on the marking page.')) return;
  const res=await ntRpc('delivery_cancel',{p_id:sub.delivery.id});
  if(res.kind!=='ok'){ ntToast(ntErrText(res),true); return; }
  sub.stage='done'; sub.delivery.state='CANCELLED'; ntQPut(sub); ntClose(); ntToast('Message not sent. The notice stays saved.'); ntRender();
}
/* v40 · 卡片上直接按「I've sent it」—— 不用再打开送出视窗找按钮 */
function ntOpenedDeliv(subId){ const ds=(NT.deliv[subId]||[]).filter(d=>d.state==='OPENED_WHATSAPP'&&!d.stale_at); return ds.length?ds[ds.length-1]:null; }
async function ntSentFromList(subId){
  const d=ntOpenedDeliv(subId); if(!d) return;
  const res=await ntRpc('delivery_confirm_sent',{p_id:d.id,p_fingerprint:d.content_fingerprint});
  if(res.kind==='ok'){ const q=ntQGet(subId); if(q){ q.stage='done'; if(q.delivery) q.delivery.state='MANUALLY_CONFIRMED_SENT'; ntQPut(q); } ntToast('✓ Sent to WhatsApp'); ntLoadList(); if(typeof msLoad==='function') msLoad(); return; }
  if(res.kind==='rejected'&&res.code==='STALE'){ ntToast('This message is out of date (the notice was changed or the wording was updated). Tap “Open again” and send the new one.',true); ntLoadList(); return; }
  ntToast(ntErrText(res),true);
}

async function ntSendFromList(subId){
  if(NT.busy) return;
  let sub=ntQGet(subId);
  if(!sub){
    const ns=(NT.list||[]).filter(n=>n.submission_id===subId&&n.status==='active'); if(!ns.length) return;
    const rec={}; [...new Set(ns.map(n=>n.student_id))].forEach(sid=>{ if(!ns.some(m=>m.student_id===sid&&m.record_id)) rec[sid]=ntUid(); });
    sub={submission_id:subId,created:Date.now(),rows:ns.map(n=>({kind:n.kind,student_id:n.student_id,dept:n.dept,date_from:n.date_from,date_to:n.date_to})),
         record_uids:rec,delivery_uid:ntUid(),stage:Object.keys(rec).length?'record':'message',err:'',fromList:true};
    ntQPut(sub);
  }
  if(sub.stage==='done'){ sub.stage='message'; sub.delivery_uid=ntUid(); ntQPut(sub); }
  NT.busy=true; await ntRun(subId,false); NT.busy=false;
}

/* ══════════════════════════════════════════════════════════════════════════
   v33 · Messages to the groups（行政用，在 Notices 分页上方）—— 架构 v3 Step B / F / G
   - Today's list：今天（或选的日子）的出缺席名单 → 资料库产生文字（delivery_prepare 'today_list'，Step 0 已上线）
   - SRT replacement / temp slot：Manage 或老师 + Add visitor 存的安排 → 资料库产生文字（delivery_prepare_item 'swap'，Step B SQL）
   - Change of class：学生页 Change Class 存的永久换班 → 资料库产生文字（delivery_prepare_item 'class_change'，Step B SQL）
   一律：打开 WhatsApp / 复制（群由行政自己选）→ 按「I've sent it」才记为已送出；安排取消了、但之前已送出 → 提示送「取消」讯息。
   Step B SQL 还没上线时：Today's list 照常，其他两段显示「database update needed」，不报错。
   ══════════════════════════════════════════════════════════════════════════ */
let MS={data:null,err:'',missing:false,cur:null,busy:false,mem:{}};
/* 同一件事同一个 id：断网重按不会产生第二份。本机存不进去也照样有一份在记忆体里（不会卡住） */
function msUidFor(key){
  const k='ag_ms_uid_v1'; let m={}; try{ m=JSON.parse(localStorage.getItem(k)||'{}')||{}; }catch(e){}
  if(MS.mem[key]===null){ delete m[key]; MS.mem[key]=undefined; }
  if(!m[key]&&!MS.mem[key]){ MS.mem[key]=ntUid(); m[key]=MS.mem[key]; try{ localStorage.setItem(k,JSON.stringify(m)); }catch(e){} }
  return MS.mem[key]||m[key];
}
function msForget(key){ MS.mem[key]=null; const k='ag_ms_uid_v1'; try{ const m=JSON.parse(localStorage.getItem(k)||'{}')||{}; delete m[key]; localStorage.setItem(k,JSON.stringify(m)); }catch(e){} }
function msFresh(key){ msForget(key); MS.mem[key]=ntUid(); return MS.mem[key]; }
const MS_KINDS=[['absence','Absence'],['early_leave','Leave early'],['late_arrival','Arrive late'],['late_pickup','Late pick-up'],['pickup_change','Pick-up change'],['replacement','SRT replacement'],['temp','SRT change of slot'],['class_change','Change of class']];
const MS_KIND_LABEL=Object.fromEntries(MS_KINDS);
MS.selD=['SRK','GAK','ATC','SRT']; MS.selK=MS_KINDS.map(k=>k[0]); MS.waiting=null;
async function msLoad(){
  const [res,wt]=await Promise.all([ntRpc('att_messages',{p_days:14}),ntRpc('att_waiting',{})]);
  if(res.kind==='ok'){ MS.data=res.data; MS.err=''; MS.missing=false; }
  else if(res.kind==='error'&&/PGRST202|att_messages|404|Could not find/i.test((res.code||'')+' '+(res.message||''))){ MS.data=null; MS.missing=true; MS.err=''; }
  else { MS.data=null; MS.err=res.kind==='offline'?'Could not load (no internet?).':ntErrText(res); }
  MS.waiting=wt.kind==='ok'?(wt.data||[]):null;
  /* v41 · 合并发 / 补课换班 / 今天名单：以前开过 WhatsApp 没按 I've sent it 的 → 算已送出，补记 */
  try{ const o=await _sb.from('attendance_message_delivery').select('id,source,content_fingerprint')
         .eq('state','OPENED_WHATSAPP').is('stale_at',null).neq('source','notice_submission').gte('created_at',ntAddDays(ntToday(),-7));
       if(!o.error&&(o.data||[]).length){ let n=0; for(const d of o.data){ const r=await ntRpc('delivery_confirm_sent',{p_id:d.id,p_fingerprint:d.content_fingerprint}); if(r.kind==='ok'){ n++; if(d.source==='batch') msMarkBatchRecords(d.id); } }
         if(n){ const w2=await ntRpc('att_waiting',{}); if(w2.kind==='ok') MS.waiting=w2.data||[]; const r2=await ntRpc('att_messages',{p_days:14}); if(r2.kind==='ok') MS.data=r2.data; } } }catch(e){}
  const b=document.getElementById('ms-box'); if(b) b.innerHTML=msHtml();
  const l=document.getElementById('nt-list'); if(l&&NT.list) l.innerHTML=ntListHtml();   /* 「已送出」要算上合并送出的 */
  /* 本机「还没送讯息」的那几笔，如果已经在合并的讯息里送出 → 收起来 */
  if(MS.data&&MS.data.notices){ let ch=false;
    ntLoadQ().forEach(x=>{ if(x.stage!=='message') return; const ids=(x.notices||[]).map(n=>n.id);
      if(ids.length&&ids.every(id=>(MS.data.notices.find(y=>y.id===id)||{}).sent)){ x.stage='done'; ntQPut(x); ch=true; } });
    if(ch&&document.getElementById('page-notices').classList.contains('on')) ntRender(); }
}
function msCls(c){ return typeof swCls==='function'?swCls(c):c; }
function msDepts(){ return MS.selD.length?MS.selD.slice():['SRK','GAK','ATC','SRT']; }   /* v39 · 部门一个都不勾 = 全部部门 */
function msTick(group,v,on){ const a=group==='d'?MS.selD:MS.selK; const i=a.indexOf(v); if(on&&i<0) a.push(v); if(!on&&i>=0) a.splice(i,1); const b=document.getElementById('ms-box'); if(b) b.innerHTML=msHtml(); }
function msHtml(){

    const _D=msDepts(); const n=W.filter(x=>_D.includes(x.dept)&&MS.selK.includes(x.kind)).reduce((a,x)=>a+x.count,0);

      +'<span style="font-size:12px;color:var(--mut)">'+(W.length?'Waiting: '+W.map(x=>x.dept+' '+MS_KIND_LABEL[x.kind].replace(/^SRT /,'').toLowerCase()+' '+x.count).join(' · '):'Nothing waiting — everything has been told ✓')+'</span></div>';
  }
  /* ── 2 · 今天名单 ── */
  h+='<div style="border-top:1px solid var(--bdr);padding-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px">'

    +['SRK','GAK','ATC','SRT'].map(d=>'<label style="font-size:12.5px;display:inline-flex;gap:3px;align-items:center"><input type="checkbox" class="ms-tl-d" value="'+d+'" checked>'+d+'</label>').join(' ')
    +'<button style="'+NT_BTN+'" onclick="msTodayList()">Prepare</button></div>';
  const tls=(MS.data&&MS.data.today_lists)||[];
  if(tls.length) h+='<div style="font-size:11.5px;color:var(--mut)">'+tls.slice(0,4).map(x=>ntDmy(x.list_date)+' '+x.depts.join('+')+': '+(x.state==='MANUALLY_CONFIRMED_SENT'?'<span style="color:var(--ok)">sent ✓</span>':x.state==='CANCELLED'?'not sent':(x.stale?'out of date':'not sent yet'))).join(' · ')+'</div>';
  return h;
}
async function msBatch(){
  if(MS.busy) return;
  if(!MS.selK.length){ ntToast('Tick at least one kind',true); return; }
  const key='batch|'+Date.now();   /* 每按一次都是新的一则（只在同一次按、断网重送时沿用） */
  const prep=uid=>ntRpc('delivery_prepare_batch',{p_client_uid:uid,p_depts:msDepts(),p_kinds:MS.selK.slice()});
  MS.busy=true; const res=await prep(msUidFor(key)); MS.busy=false;
  if(res.kind==='rejected'&&res.code==='NOTHING_TO_SEND'){ ntToast('Nothing waiting for those — everything has been told'); msLoad(); return; }
  if(res.kind!=='ok'){ ntToast(ntErrText(res),true); return; }
  MS.cur={key,label:'one message for '+(res.data.count||'')+(res.data.count===1?' item':' items'),d:res.data,redo:prep}; msPanel();
}
async function msTodayList(retried){
  if(MS.busy) return;
  const d=(document.getElementById('ms-tl-date')||{}).value||ntToday();
  const depts=[...document.querySelectorAll('.ms-tl-d:checked')].map(x=>x.value);
  if(!depts.length){ ntToast('Tick at least one department',true); return; }
  const key='tl|'+d+'|'+depts.join(',');
  MS.busy=true;
  const res=await ntRpc('delivery_prepare',{p_client_uid:msUidFor(key),p_source:'today_list',p_submission_id:null,p_list_date:d,p_depts:depts,p_content:null});
  MS.busy=false;
  if(res.kind==='rejected'&&res.code==='DELIVERY_CONTENT_CONFLICT'&&!retried){ msFresh(key); return msTodayList(true); }   /* 名单有变：用新 id 重做 */
  if(res.kind!=='ok'){ ntToast(ntErrText(res),true); return; }
  if((res.data.state==='MANUALLY_CONFIRMED_SENT'||res.data.state==='CANCELLED')&&!retried){ msFresh(key); return msTodayList(true); }   /* 上一份已结束：这次是新的一份 */
  MS.cur={key,label:'Today\'s list',d:res.data,redo:uid=>ntRpc('delivery_prepare',{p_client_uid:uid,p_source:'today_list',p_submission_id:null,p_list_date:d,p_depts:depts,p_content:null})}; msPanel();
}
async function msSend(source,ref,isCancel){
  if(MS.busy) return;
  const key=source+'|'+ref+'|'+(isCancel?'c':'a');
  MS.busy=true;
  const prep=uid=>ntRpc('delivery_prepare_item',{p_client_uid:uid,p_source:source,p_ref:String(ref)});
  let res=await prep(msUidFor(key));
  if(res.kind==='rejected'&&res.code==='DELIVERY_CONTENT_CONFLICT') res=await prep(msFresh(key));
  else if(res.kind==='ok'&&(res.data.state==='CANCELLED'||res.data.state==='MANUALLY_CONFIRMED_SENT')) res=await prep(msFresh(key));
  MS.busy=false;
  if(res.kind!=='ok'){ ntToast(ntErrText(res),true); return; }
  MS.cur={key,label:source==='swap'?'SRT arrangement':'Change of class',d:res.data,redo:prep}; msPanel();
}
function msPanel(){
  const c=MS.cur; if(!c) return;

  ntModal('Send the message — '+c.label,
    (c.note?'<div style="background:#fef3c7;color:#92400e;border-radius:8px;padding:8px 10px;font-size:12.5px;margin-bottom:8px">'+ntEsc(c.note)+'</div>':'')
    +'<div style="font-size:12px;color:var(--mut);margin-bottom:6px">Send this to the right WhatsApp group (you choose the group):</div>'
    +'<pre style="white-space:pre-wrap;font-family:inherit;font-size:13px;background:var(--sur2);border:1px solid var(--bdr);border-radius:8px;padding:10px;max-height:45vh;overflow:auto;margin:0 0 8px">'+ntEsc(c.d.content||'')+'</pre>'
    +'<div style="display:flex;gap:8px;flex-wrap:wrap"><button style="'+NT_PRI+'" onclick="msOpen(\'whatsapp_link\')">Open WhatsApp</button><button style="'+NT_BTN+'" onclick="msOpen(\'copied\')">Copy text</button></div>'
    +'<div id="ms-hint" style="font-size:11.5px;color:var(--mut);margin-top:8px">Tap Open WhatsApp (or Copy text) — it is recorded as sent, like MiscGo.</div>',
    '<button style="'+NT_RED+'" onclick="msDont()">Don\'t send</button><button style="'+NT_BTN+'" onclick="ntClose();msLoad()">Send later (together)</button>'
    );
}
async function msOpen(method){
  const c=MS.cur; if(!c) return;
  /* 手机浏览器只在「按下去的那一刻」允许开新分页 / 复制 → 先做，再记录（Safari 否则会挡） */
  let w=null, copied=false;
  if(method==='whatsapp_link') ntWhatsApp(c.d.content);   /* v39 */
  else { try{ await navigator.clipboard.writeText(c.d.content); copied=true; }catch(e){} }
  const res=await ntRpc('delivery_mark_opened',{p_id:c.d.id,p_method:method});
  if(res.kind!=='ok'){ ntToast(ntErrText(res),true); return; }
  c.d.state='OPENED_WHATSAPP';
  if(method==='copied') ntToast(copied?'Copied — paste it in the WhatsApp group':'Could not copy — select the text and copy it',!copied);
  await msConfirm();   /* v41 · 打开 WhatsApp 就算送出 */
}
async function msMarkBatchRecords(deliveryId){   /* v41 · 合并发里的通知 → MiscGo 纪录标已送 */
  try{ const d=await _sb.from('attendance_message_delivery').select('items').eq('id',deliveryId).single();
       const ids=((d.data&&d.data.items&&d.data.items.notices)||[]); if(!ids.length) return;
       const n=await _sb.from('attendance_notice').select('submission_id').in('id',ids);
       const subs=[...new Set((n.data||[]).map(x=>x.submission_id))];
       if(subs.length) await _sb.from('records').update({wa_sent:true,wa_sent_at:new Date().toISOString()}).in('submission_id',subs).eq('wa_sent',false); }catch(e){}
}
async function msConfirm(){
  const c=MS.cur; if(!c) return;
  const res=await ntRpc('delivery_confirm_sent',{p_id:c.d.id,p_fingerprint:c.d.fingerprint});
  if(res.kind==='ok'){ msForget(c.key); MS.cur=null; ntClose(); ntToast('✓ Sent to WhatsApp'); if(c.d&&c.d.id&&/^one message/.test(c.label||'')) msMarkBatchRecords(c.d.id); msLoad(); return; }
  if(res.kind==='rejected'&&res.code==='STALE'&&c.redo){
    const r2=await c.redo(msFresh(c.key));
    if(r2.kind==='ok'&&r2.data.content===c.d.content){   /* 文字其实没变：你送出的就是对的，直接记已送出 */
      const o=await ntRpc('delivery_mark_opened',{p_id:r2.data.id,p_method:'copied'});
      const k=o.kind==='ok'?await ntRpc('delivery_confirm_sent',{p_id:r2.data.id,p_fingerprint:r2.data.fingerprint}):o;
      if(k.kind==='ok'){ msForget(c.key); MS.cur=null; ntClose(); ntToast('✓ Sent to WhatsApp'); msLoad(); return; }
    }
    if(r2.kind==='ok'){ MS.cur={key:c.key,label:c.label,d:r2.data,redo:c.redo,note:'Something changed after the first message was made. If you already sent the first one, send this updated one too.'}; msPanel(); return; }
    msForget(c.key); MS.cur=null; ntClose(); ntToast(ntErrText(r2),true); msLoad(); return;
  }
  if(res.kind==='rejected'&&res.code==='STALE'){ msForget(c.key); MS.cur=null; ntClose(); ntToast('Something changed after this message was prepared. Tap the button again for the up-to-date message.',true); msLoad(); return; }
  ntToast(ntErrText(res),true);
}
async function msDont(){
  const c=MS.cur; if(!c) return;
  if(!confirm('Do not send this message?')) return;
  const res=await ntRpc('delivery_cancel',{p_id:c.d.id});
  if(res.kind!=='ok'){ ntToast(ntErrText(res),true); return; }
  msForget(c.key); MS.cur=null; ntClose(); ntToast('Message not sent'); msLoad();
}

       改成 Active ＋ Paused 两种都收（Owner 09-23 裁定第 5 项第 1 点）。

    /* v17 · ATC 课表（ClassGo 是课表正本）：每班每天 s1 = 功课班老师，s2 = 科目 + 老师 */

}

/* v28 · 分批抓到完：每批照 id 排好、从上一批的尾巴接着抓，抓到空为止（不管云端上限是 1000 还是别的数字都对）。
   任何一批失败就整个丢错，呼叫的地方显示红字 —— 不准默默少资料。 */
async function _fetchAll(makeQuery,label){
  const out=[]; let from=0;
  for(let i=0;i<1000;i++){
    const{data,error}=await makeQuery().range(from,from+999);
    if(error) throw new Error((label||'Load')+': '+(error.message||error));
    if(!data||!data.length) return out;
    out.push(...data); from+=data.length;
  }
  throw new Error((label||'Load')+': too many rows');
}
function _loadFailHTML(e){ return `<div style="margin:12px 0;padding:12px 14px;border-radius:8px;background:#FCEBEB;color:#A32D2D;font-size:12px;font-weight:600">✕ Could not load all records — nothing below is shown so the numbers are not wrong. Please refresh and try again.<div style="font-weight:400;font-size:11px;margin-top:4px">${_escHtml(String(e&&e.message||e))}</div></div>`; }

// ── Load attendance for a date ──

  catch(e){ console.error(e); toast('✕ Could not load today\'s marks — refresh',5000); }

}

// ── Holiday check: returns matching holiday or null ──
// public_holiday / school_holiday / special_holiday / festival = no school
// extra_class = override, school ON even during holiday
const NO_SCHOOL_TYPES=['public_holiday','school_holiday','special_holiday','festival','centre_off'];   /* v30 · Calendar「中心关门」（Calendar v15 起有）以前没算进来 */
function getHoliday(dateStr,dept){
  return allCalendar.find(ev=>{
    if(!NO_SCHOOL_TYPES.includes(ev.type)) return false;
    if(dateStr<ev.start_date) return false;
    if(ev.end_date&&dateStr>ev.end_date) return false;
    if(!ev.end_date&&dateStr!==ev.start_date) return false;
    // depts null = all; depts array = only listed
    if(ev.depts&&ev.depts.length>0&&!ev.depts.includes(dept)) return false;
    return true;
  })||null;
}
function hasExtraClass(dateStr,dept){
  return allCalendar.find(ev=>{
    if(ev.type!=='extra_class') return false;
    if(dateStr<ev.start_date) return false;
    if(ev.end_date&&dateStr>ev.end_date) return false;
    if(!ev.end_date&&dateStr!==ev.start_date) return false;
    if(ev.depts&&ev.depts.length>0&&!ev.depts.includes(dept)) return false;
    return true;
  })||null;
}
function getHolidayAllDepts(dateStr){
  return allCalendar.find(ev=>{
    if(!NO_SCHOOL_TYPES.includes(ev.type)) return false;
    if(dateStr<ev.start_date) return false;
    if(ev.end_date&&dateStr>ev.end_date) return false;
    if(!ev.end_date&&dateStr!==ev.start_date) return false;
    if(!ev.depts||ev.depts.length===0) return true;
    return false;
  })||null;
}

function getTransferTarget(studentId,dept,endDate){

// ── Get students for a dept+class_code ──
function getClassStudents(dept,classCode){
  const mems=allMemberships.filter(m=>m.dept===dept&&m.class_code===classCode&&m.start_date<=selectedDate&&(m.end_date==null||m.end_date>=selectedDate));
  /* v10 · 同一个学生在同一班若有多笔生效班籍(资料错误)，只取一笔。
     不去重的後果：名册画出两列，但两列共用同一个
     attendance unique key (date,student_id,dept,session) ——
     点其中一列，另一列跟着变，而且班级人数会多算。
     取舍规则：座号小的优先(无座号排最後)，同座号取较早的 start_date。 */
  const _pick={};
  mems.forEach(function(m){
    const p=_pick[m.student_id];
    if(!p){ _pick[m.student_id]=m; return; }
    const a=(m.num==null?999:m.num), b=(p.num==null?999:p.num);
    if(a<b || (a===b && (m.start_date||'')<(p.start_date||''))) _pick[m.student_id]=m;
  });
  return Object.keys(_pick).map(function(k){ return _pick[k]; }).map(m=>{
    const stu=allStudents.find(s=>s.id===m.student_id);
    if(!stu) return null;
    /* v16 · 这一班、这一天是不是请假中（学生页课程那一行的 Pause 起讫日） */
    return{...stu,num:m.num,dept,class_code:classCode,_paused:memPausedOn(m,selectedDate),_pauseFrom:m.pause_from||null,_pauseTo:m.pause_to||null};
  }).filter(Boolean).sort((a,b)=>(a.num??999)-(b.num??999));
}

/* ═══ v12 · 请假（Paused）学生 ═══════════════════════════════════
   Owner 09-23 裁定第 5 项：名册照常列出、名字旁标「请假中」、不计缺席、
   月报与出席率不进分子分母、老师真要标照样标得下去。

   ⚠ 一个资料上的限制（不是 bug，是现在只能这样）：
   hub_students.status 只说「现在是不是请假」，没有请假的起讫日，
   所以「请假期间」只能用「现在是请假 ＋ 那一格没人点」来近似。
   要真正按期间排除，得先有带日期的请假栏位 —— 那是 SSOT 的事，未做。 */
/* v16 · 学生页 v35 起，请假记在「课程那一行」，有开始日（必填）和回来日（可空）。
   现在按日期判断：那一班、那一天在请假期间才算请假。回来日那天起就恢复正常。 */
/* v16 · 固定例外三种：迟到 / 早退 / 缺席（ATC 资料表 10-05 导入有「迟到」） */
function ruleLabel(t){ return t==='early_leave'?'EARLY':(t==='late'?'LATE':'ABS'); }
/* v18 · 点名纪录算哪一班：
   纪录的唯一键是 日期 + 学生 + 部门 + 节次（不含班级），Mark 画面也是这样找。
   可是纪录上写的 class_code 是「按下去那一班」。老师在旧班名单按 All ✓，纪录就写旧班，
   Monthly / Tracker 只找本班 class_code → 空白（10-03 SRT LV5 Celeste、Hng You Kai）。
   规则：纪录上那一班在那天还有效 → 照写的；否则 → 算那天学生实际在上的那一班（只有一班时）。 */
function attClassOf(r){
  /* v19 · 补课 / 换时段：在来访那班点的，算回原本那一班 */
  const sw=allSwaps.find(w=>w.student_id===r.student_id&&w.dept===r.dept&&w.to_date===r.date&&w.to_class===r.class_code);
  if(sw) return sw.from_class;
  const ms=allMemberships.filter(m=>m.student_id===r.student_id&&m.dept===r.dept);
  if(ms.some(m=>m.class_code===r.class_code&&m.start_date<=r.date&&(m.end_date==null||m.end_date>=r.date))) return r.class_code;
  const live=ms.filter(m=>m.start_date<=r.date&&(m.end_date==null||m.end_date>r.date)&&!String(m.class_code||'').includes('RSVP'));
  return live.length===1?live[0].class_code:r.class_code;
}
function memPausedOn(m,d){ return !!(m&&m.pause_from&&m.pause_from<=d&&(!m.pause_to||m.pause_to>d)); }
/* ═══ v33 · 出席率：每个部门照自己的规则算（Owner 10-22）══════════════════════
   共同：只算那个班真的有上课的日子（周末、Calendar 该部门假期不算；补课日 extra class 算）；
         Present / Late / Early = 有到；Absent / MC = 没到（家长有通知也算没到）；
         请假中（学生页 Paused）不算；固定例外（Exceptions）说不来的那天不算；
         还没点名不算（另外显示 not marked），但家长通知说不来 → 算没到。
   ATC：功课班（S1）、上课班（S2）分开算；功课班 3:00 或以后才到 = 缺席（点名时已经照这条记）。
   SRT：只算那班自己的上课日；E-Class 算有到；缺的那堂补课补了、补课那天有来 = 算有到；
        临时换 slot 那天在原班不算，算在他去的那班那一格。 */
const RATE_RULES={
  ALL:['Only real class days count (weekends and this department’s holidays in Calendar are left out).','Present, Late and Early leave = attended. Absent and MC = not attended, even when the parent told the office.','On leave (Paused in the Student page) and weekly exceptions (child not expected that day) are left out.','Not marked yet is left out (shown as “not marked”) — unless the parent told the office, then it counts as absent.'],
  SRK:[], GAK:[],
  ATC:['H/W and Lesson are counted separately.','H/W: arriving at 3:00 or later = absent. Lesson: late or leaving early still = attended.'],
  SRT:['Only the class’s own day counts (e.g. every Saturday AM).','E-Class = attended.','A missed class that was made up (and the child came to the replacement) = attended.','Temp slot: left out in the own class; counted in the class he went to that day.']
};
function isClassDay(dept,cls,ds){
  const dow=new Date(ds+'T12:00:00').getDay();
  if(dept==='SRT'){
    const p=String(cls||'').replace(/^SRT[-_]/,'').split(/[._]/);
    const dp=p.find(x=>['MON','TUE','WED','THU','FRI','SAT','SUN'].includes(x));
    if(!dp||dp!==DAY_MAP[dow]) return false;
  }else if(dow===0||dow===6) return false;
  if(getHoliday(ds,dept)&&!hasExtraClass(ds,dept)) return false;
  return true;
}
/* 某一天、某个部门、某一节的家长请假通知（要先 loadNotices 那一天） */
function noticeOn(studentId,dept,session,ds){
  const c=noticeCache[ds+'|'+dept]; if(!c||!c.ok) return null;
  const s=dept==='ATC'?session:0;
  return c.rows.find(r=>r.kind==='absence'&&r.student_id===studentId&&r.dept===dept&&r.date_from<=ds&&r.date_to>=ds&&(r.sessions||[]).includes(s))||null;
}
const RATE_ATT={present:1,late:1,early_leave:1}, RATE_ABS={absent:1,mc:1};
/* 一位孩子、一个月、一节 → {att,abs,unm,pct}
   rm = {day: record}（attClassOf 已经算回本班）；vis = {'stu|date': status} 补课那天的纪录 */
function rateFor(s,mem,dept,cls,session,rm,ym,days,eEls,vis){
  let att=0,abs=0,unm=0; const today=todayStr();
  for(let d=1;d<=days;d++){
    const ds=ym+'-'+String(d).padStart(2,'0');
    if(ds<mem.start_date||(mem.end_date&&ds>mem.end_date)) continue;
    const r=rm[d];
    if(r&&r.other){   /* 在别班点的（补课 / 临时换 slot） */
      const sw=allSwaps.find(w=>w.student_id===s.id&&w.to_date===ds&&w.from_class===cls&&w.status==='active');
      if(sw&&sw.kind==='replacement') continue;   /* 补课：功劳算在缺的那一天 */
      if(RATE_ATT[r.status]) att++; else if(RATE_ABS[r.status]) abs++;
      continue;
    }
    if(!isClassDay(dept,cls,ds)) continue;
    if(swAwayOn(s.id,cls,ds)) continue;                      /* SRT 临时换走：原班不算 */
    if(!r&&memPausedOn(mem,ds)) continue;                     /* 请假中 */
    if(!r&&eEls&&eEls[d]) continue;                           /* E-Class 算在另一班 */
    const dow=new Date(ds+'T12:00:00').getDay();
    const rule=getRule(s.id,dept,dow,session,ds);
    if(rule&&rule.rule_type==='absent'&&(!r||RATE_ABS[r.status])) continue;   /* 固定例外：本来就不来 */
    if(r&&RATE_ATT[r.status]){ att++; continue; }
    if(r&&RATE_ABS[r.status]){
      const mu=swMadeUp(s.id,cls,ds);
      if(mu){ const v=vis&&vis[s.id+'|'+mu.to_date];
        if(v&&RATE_ATT[v]){ att++; continue; }
        if(!v&&mu.to_date>=today) continue;                   /* 补课还没到：先不算 */
      }
      abs++; continue;
    }
    if(ds>today) continue;                                   /* 还没到的日子不算（家长先请假也一样，等那天过了才算） */
    if(noticeOn(s.id,dept,session,ds)){ abs++; continue; }   /* 没点、家长说不来 */
    unm++;
  }
  const n=att+abs;
  return {att,abs,unm,pct:n?Math.round(att/n*100):null};
}
function rateCell(x){
  if(!x||x.pct===null) return `<td style="padding:2px 6px;text-align:center;border-bottom:.5px solid var(--bdr);border-left:.5px solid var(--bdr);color:var(--hint);font-size:10px" title="${x&&x.unm?x.unm+' not marked':'No class days yet'}">–</td>`;
  const c=x.pct>=90?'var(--ok)':x.pct>=70?'var(--warn)':'var(--danger)';
  return `<td style="padding:2px 6px;text-align:center;border-bottom:.5px solid var(--bdr);border-left:.5px solid var(--bdr);font-size:10px;font-weight:700;color:${c};white-space:nowrap" title="${x.att} of ${x.att+x.abs} class days attended${x.unm?' · '+x.unm+' not marked':''}">${x.pct}%${x.unm?'<div style="font-size:7px;color:var(--mut);font-weight:500">'+x.unm+' unmarked</div>':''}</td>`;
}

function isPausedStu(s){
  if(!s) return false;
  if('_paused' in s) return !!s._paused;   /* 点名名册：看这一班、这一天 */
  /* 首页总数：这个学生那天在上的班全部请假中，才不算进分母 */
  const live=allMemberships.filter(m=>m.student_id===s.id&&m.start_date<=selectedDate&&(m.end_date==null||m.end_date>selectedDate)&&!String(m.class_code||'').includes('RSVP'));
  if(live.length) return live.every(m=>memPausedOn(m,selectedDate));
  return String(s.status||'').toLowerCase()==='paused';
}
function pauseText(s){
  if(s&&s._pauseTo) return 'back on '+s._pauseTo;
  if(s&&'_paused' in s&&s._paused) return 'return date not set';
  return String((s&&s.status_note)||'').trim();
}
function _escHtml(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
/* 灰底小标签：「请假中 · 几时回来」。说明取自 status_note（学生页写的） */
function pausedTag(s){
  if(!isPausedStu(s)) return '';
  const note=pauseText(s);   /* v16 */
  /* 标签本身保持短 —— 手机上一行放不下长备注（375px 会把整列撑出画面）。
     完整备注放 tooltip，点名列另外用下面那行小字显示。 */
  return '<span class="stu-paused" title="'+_escHtml(note||'On leave (paused)')+'">On leave</span>';
}
/* 「几时回来」独立一行小字，照这个档既有的缺席备注做法 */
function pausedNote(s){
  if(!isPausedStu(s)) return '';
  const note=pauseText(s);   /* v16 */
  return note ? '<div style="font-size:9px;color:var(--mut);margin-top:2px">On leave · '+_escHtml(note)+'</div>' : '';
}
/* 该不该算进「还没点名」的分母：请假的不算 —— 除非今天真的已经有人帮他点了。
   （第 5 项第 3 点：不自动算 absent、Dashboard 未点名不要把他算进去；
     第 5 点：请假期间突然来了，照常点得下去，点了就算。） */
function countsForMarking(s,dept,session){
  return !isPausedStu(s) || getStatus(s.id,dept,session)!=='unmarked';
}
function expectedCount(list,dept,session){
  return list.filter(s=>countsForMarking(s,dept,session)).length;
}

/* ═══════════════════════════════════════════════════════════════
   v14 · 返校 Follow-Up（第一期：只做 SRK）
   规则：这一轮，这个孩子做过了没有？没做过 ＋ 今天他来了 → 亮灯。
   不是看他哪天缺席 —— 周一做过的人，周四回来不用再做。
   ═══════════════════════════════════════════════════════════════ */
let allFuTasks = [];     // followup_task（设定）
let fuRecords  = [];      // followup_record（本周 ＋ 未结的待办）
let fuBusy     = false;

/* ── 这一周的上课日清单（周一起算，排除周末与假期） ── */
function fuWeekMonday(dateStr){
  const d = new Date(dateStr + 'T12:00:00');
  const dow = d.getDay();                 // 0=Sun
  const back = (dow === 0) ? 6 : dow - 1; // 回到周一
  d.setDate(d.getDate() - back);
  return d.toISOString().slice(0, 10);
}
function fuIsSchoolDay(dateStr, dept){
  const dow = new Date(dateStr + 'T12:00:00').getDay();
  if ((dow === 0 || dow === 6) && dept !== 'SRT') return false;
  const hol = getHoliday(dateStr, dept);
  if (hol && !hasExtraClass(dateStr, dept)) return false;
  return true;
}
function fuSchoolDaysOfWeek(dateStr, dept){
  const mon = fuWeekMonday(dateStr), out = [];
  for (let i = 0; i < 7; i++){
    const d = new Date(mon + 'T12:00:00'); d.setDate(d.getDate() + i);
    const ds = d.toISOString().slice(0, 10);
    if (fuIsSchoolDay(ds, dept)) out.push(ds);
  }
  return out;
}
/* ISO 週數 —— cycle_key 用它当「哪一周」 */
function fuIsoWeek(dateStr){
  const d = new Date(dateStr + 'T12:00:00');
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dn = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - dn);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  const wk = Math.ceil(((t - y0) / 86400000 + 1) / 7);
  return t.getUTCFullYear() + 'W' + String(wk).padStart(2, '0');
}
function fuCycleKey(dept, dateStr, nth, session){
  return dept + '-' + fuIsoWeek(dateStr) + '-D' + nth + (session ? '-S' + session : '');
}

/* ── 今天该做哪几项（含补做） ──
   任务的到期日 = 这周第 nth 个上课日。到期日 <= 今天 且今天是上课日 → 该做。
   到期日已过而还没做 → 今天补做（Owner 裁定 1：整周没来的回来那天全补）。
   那周上课日不够（长假）→ 全部挤在最后一个上课日（Owner 裁定 2：顺延到同一天）。 */
function fuDueTasks(dept, dateStr, session){
  if (!fuIsSchoolDay(dateStr, dept)) return [];
  const days = fuSchoolDaysOfWeek(dateStr, dept);
  const idx  = days.indexOf(dateStr);
  if (idx < 0) return [];
  const out = [];
  allFuTasks.forEach(t => {
    if (t.dept !== dept || !t.is_active) return;
    if ((t.session ?? 0) !== (session ?? 0)) return;
    /* 第一期只做 weekly_nth_day。after_absence 是 SRT 的路，排在第三期，
       而且「MC 算不算缺席」Owner 还没裁示 —— 没定之前不猜，直接跳过。 */
    if (t.trigger_type !== 'weekly_nth_day') return;
    let due = days[(t.nth_day || 1) - 1];
    if (!due) due = days[days.length - 1];   // 长假顺延
    if (!due || due > dateStr) return;        // 还没到期
    out.push(Object.assign({}, t, { due_date: due, cycle_key: fuCycleKey(dept, dateStr, t.nth_day || 1, t.session || 0) }));
  });
  return out.sort((a, b) => (a.nth_day - b.nth_day) || (a.sort_order - b.sort_order));
}

function fuRecOf(stuId, classCode, cycleKey, taskId){
  return fuRecords.find(r => r.student_id === stuId && r.class_code === classCode
    && r.cycle_key === cycleKey && r.task_id === taskId);
}
/* 未结的待办：以前按了「有问题」还没人结掉的，隔天继续亮 */
function fuOpenIssues(stuId, classCode, exceptCycle){
  return fuRecords.filter(r => r.student_id === stuId && r.class_code === classCode
    && r.result === 'issue' && !r.resolved_at && r.cycle_key !== exceptCycle);
}
/* 这个学生今天还差几项（含旧待办） */
function fuPending(stu, dept, classCode, dateStr, session){
  const due = fuDueTasks(dept, dateStr, session);
  let n = 0;
  due.forEach(t => { if (!fuRecOf(stu.id, classCode, t.cycle_key, t.task_id ?? t.id)) n++; });
  const cyc = due.length ? due[0].cycle_key : '';
  n += fuOpenIssues(stu.id, classCode, cyc).length;
  return n;
}
/* 这一班的 Follow-Up 全做完了没 —— 班级那个 ✓ 要看它（Owner 裁定：不做完点名不算完成） */
function fuClassDone(students, dept, classCode, dateStr, session){
  if (!fuDueTasks(dept, dateStr, session).length) return true;
  return students.every(s => !countsForMarking(s, dept, session) || fuPending(s, dept, classCode, dateStr, session) === 0);
}

/* ── 载入 ── */
async function fuLoadTasks(){
  try{
    const { data, error } = await _sb.from('followup_task').select('*').eq('is_active', true);
    if (error) throw error;
    allFuTasks = data || [];
  }catch(e){ console.warn('[Follow-Up] 读不到设定表：', e.message); allFuTasks = []; }
}
async function fuLoadRecords(dateStr){
  /* 分两次查，不用 .or() ——
     or() 里塞 like ＋ and() 的字串语法很容易写错而且不会报错，
     只会安静地回传错东西。两个单条件查询各自明确，合并去重就好。 */
  try{
    const wk = fuIsoWeek(dateStr);
    const [thisWeek, openIssues] = await Promise.all([
      _sb.from('followup_record').select('*').like('cycle_key', '%' + wk + '%'),
      _sb.from('followup_record').select('*').eq('result', 'issue').is('resolved_at', null)
    ]);
    if (thisWeek.error) throw thisWeek.error;
    if (openIssues.error) throw openIssues.error;
    const seen = new Set(), merged = [];
    [].concat(thisWeek.data || [], openIssues.data || []).forEach(r => {
      if (seen.has(r.id)) return; seen.add(r.id); merged.push(r);
    });
    fuRecords = merged;
  }catch(e){ console.warn('[Follow-Up] 读不到纪录：', e.message); fuRecords = []; }
}

/* ── 写入 ── */
async function fuMark(stu, dept, classCode, session, task, result, note){
  if (fuBusy) return false;
  fuBusy = true;
  try{
    const row = {
      student_id: stu.id, dept: dept, class_code: classCode, session: session ?? 0,
      task_id: task.task_id ?? task.id, cycle_key: task.cycle_key,
      due_date: task.due_date, done_date: selectedDate,
      result: result, note: note || null,
      marked_by: userEmail || null, marked_at: new Date().toISOString()
    };
    const { data, error } = await _sb.from('followup_record')
      .upsert(row, { onConflict: 'student_id,class_code,cycle_key,task_id' }).select();
    if (error) throw error;
    const saved = (data && data[0]) ? data[0] : row;
    const i = fuRecords.findIndex(r => r.student_id === row.student_id && r.class_code === row.class_code
      && r.cycle_key === row.cycle_key && r.task_id === row.task_id);
    if (i >= 0) fuRecords[i] = saved; else fuRecords.push(saved);
    return true;
  }catch(e){
    console.error('[Follow-Up] 存不进云端：', e.message);
    if (typeof toast === 'function') toast('❌ NOT SAVED — ' + (e.message || 'unknown'), 12000);
    return false;
  }finally{ fuBusy = false; }
}
/* 结掉旧待办 —— 任何老师都能结，但记是谁结的（Owner 裁定 4） */
async function fuResolve(rec){
  if (fuBusy) return false;
  fuBusy = true;
  try{
    const { error } = await _sb.from('followup_record')
      .update({ resolved_by: userEmail || null, resolved_at: new Date().toISOString() })
      .eq('id', rec.id);
    if (error) throw error;
    rec.resolved_at = new Date().toISOString(); rec.resolved_by = userEmail || null;
    return true;
  }catch(e){
    console.error('[Follow-Up] 结不掉：', e.message);
    if (typeof toast === 'function') toast('❌ NOT SAVED — ' + (e.message || 'unknown'), 12000);
    return false;
  }finally{ fuBusy = false; }
}

/* ── 老师看到的清单 ── */
function fuOpen(stuId, classCode){
  const students = getClassStudents(currentDept, classCode);
  const stu = students.find(x => x.id === stuId);
  if (!stu) return;
  const dept = currentDept, sess = currentSession, date = selectedDate;
  const due = fuDueTasks(dept, date, sess);
  const cyc = due.length ? due[0].cycle_key : '';
  const olds = fuOpenIssues(stuId, classCode, cyc);

  const ov = document.createElement('div'); ov.className = 'fu-ov'; ov.id = 'fu-ov';
  let saveFailed = false;   /* v35 · 云端存不进去时不能把老师关在视窗里 */
  function paint(){
    let h = '<div class="fu-box"><div style="font-weight:700;font-size:15px;margin-bottom:2px">' + _escHtml(stu.name) + '</div>'
      + '<div style="font-size:11px;color:var(--mut);margin-bottom:14px">Follow-Up &middot; ' + _escHtml(classCode) + '</div>';
    due.forEach(t => {
      const tid = t.task_id ?? t.id;
      const r = fuRecOf(stuId, classCode, t.cycle_key, tid);
      const st = r ? r.result : '';
      h += '<div class="fu-item ' + (st === 'done' ? 'fu-done' : st === 'issue' ? 'fu-issue' : '') + '">'
        + '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'
        + '<span style="flex:1;font-weight:600;min-width:120px">' + _escHtml(t.item_label) + '</span>'
        + '<button class="fu-btn ' + (st === 'done' ? 'on-done' : '') + '" data-a="done" data-t="' + tid + '">Done</button>'
        + '<button class="fu-btn ' + (st === 'issue' ? 'on-issue' : '') + '" data-a="issue" data-t="' + tid + '">Issue</button>'
        + '</div>'
        + (st === 'issue' ? '<input class="fu-note" data-t="' + tid + '" type="text" placeholder="What is the problem? (optional)" value="' + _escHtml((r && r.note) || '') + '" style="width:100%;margin-top:8px;padding:6px 8px;border:.5px solid var(--bdr);border-radius:6px;font-size:12px;font-family:inherit">' : '')
        + '</div>';
    });
    olds.forEach(r => {
      const t = allFuTasks.find(x => x.id === r.task_id);
      h += '<div class="fu-item fu-old">'
        + '<div style="font-size:10px;color:#C4622D;font-weight:700;margin-bottom:4px">From ' + _escHtml(r.due_date) + '</div>'
        + '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'
        + '<span style="flex:1;font-weight:600;min-width:120px">' + _escHtml(t ? t.item_label : r.task_id) + '</span>'
        + '<button class="fu-btn" data-a="resolve" data-r="' + r.id + '">Resolved</button></div>'
        + (r.note ? '<div style="font-size:11px;color:var(--mut);margin-top:6px">' + _escHtml(r.note) + '</div>' : '')
        + '</div>';
    });
    if (!due.length && !olds.length) h += '<div style="color:var(--mut);padding:10px 0">Nothing to follow up today.</div>';
    /* v35 · 必填（Owner 10-23）：今天该做的每一项都按了 Done 或 Issue 才能关。旧待办（From …）不挡 */
    const left = saveFailed ? 0 : due.filter(t => !fuRecOf(stuId, classCode, t.cycle_key, t.task_id ?? t.id)).length;
    h += '<div style="display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:14px">'
      + (left ? '<span id="fu-left" style="font-size:12px;color:#C4622D;font-weight:600">Tap Done or Issue for every item (' + left + ' left)</span>' : '')
      + '<button class="fu-btn" id="fu-close"' + (left ? ' disabled' : '') + '>Close</button></div></div>';
    ov.innerHTML = h;
  }
  paint();
  ov.addEventListener('click', async ev => {
    const b = ev.target.closest('button'); if (!b) return;
    if (b.id === 'fu-close'){
      if (!saveFailed && due.some(t => !fuRecOf(stuId, classCode, t.cycle_key, t.task_id ?? t.id))) return;   /* v35 · 还有没按的，不准关 */
      ov.remove(); renderMark(); return; }
    const act = b.getAttribute('data-a');
    if (act === 'resolve'){
      const rec = fuRecords.find(x => String(x.id) === b.getAttribute('data-r'));
      if (rec && await fuResolve(rec)){ const i = olds.indexOf(rec); if (i >= 0) olds.splice(i, 1); paint(); }
      return;
    }
    const tid = b.getAttribute('data-t');
    const t = due.find(x => (x.task_id ?? x.id) === tid); if (!t) return;

  let noteT = null;
  ov.addEventListener('input', ev => {
    const el = ev.target.closest('.fu-note'); if (!el) return;
    clearTimeout(noteT);
    noteT = setTimeout(async () => {
      const tid = el.getAttribute('data-t');
      const t = due.find(x => (x.task_id ?? x.id) === tid); if (!t) return;

    }, 800);
  });

}
function fuTag(stu, classCode){
  const nPend = fuPending(stu, currentDept, classCode, selectedDate, currentSession);
  const due = fuDueTasks(currentDept, selectedDate, currentSession);
  if (!due.length && !fuOpenIssues(stu.id, classCode, '').length) return '';
  if (nPend === 0) return '<span class="fu-tag fu-ok" onclick="event.stopPropagation();fuOpen(\'' + stu.id + '\',\'' + classCode + '\')">Follow-Up \u2713</span>';
  return '<span class="fu-tag" onclick="event.stopPropagation();fuOpen(\'' + stu.id + '\',\'' + classCode + '\')">Follow-Up (' + nPend + ')</span>';

// ── Get attendance status for a student ──
function getStatus(studentId,dept,session){
  const s=session??currentSession;
  const rec=todayRecords.find(r=>r.student_id===studentId&&r.dept===dept&&(r.session??0)===s);
  return rec?rec.status:'unmarked';
