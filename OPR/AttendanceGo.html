// ── Get attendance rule for a student on a given day/session ──
function getRule(studentId,dept,dayOfWeek,session,dateStr){
  const s=session??currentSession;
  const d=dateStr||selectedDate;
  return allRules.find(r=>r.student_id===studentId&&r.dept===dept&&r.day_of_week===dayOfWeek&&(r.session===0||r.session===s)&&r.is_active&&r.start_date<=d&&(!r.end_date||r.end_date>=d))||null;
}

// ── SRT: check if class has session today ──
function isSRTToday(classCode){
  // class_code like SRT_LV10_SAT_AM (D40 new format) or legacy SRT-LV10.SAT.AM
  const parts=classCode.replace(/^SRT[-_]/,'').split(/[._]/);
  // Day is the part matching MON/TUE/WED/THU/FRI/SAT/SUN
  const DAYS=['MON','TUE','WED','THU','FRI','SAT','SUN'];
  const dayPart=parts.find(p=>DAYS.includes(p));
  if(!dayPart) return false;
  const today=DAY_MAP[new Date(selectedDate+'T12:00:00').getDay()];
  return dayPart===today;
}

// ── Get unique classes for dept from memberships ──
function getDeptClasses(dept,filterToday=true){
  const codes=[...new Set(allMemberships.filter(m=>m.dept===dept&&m.start_date<=selectedDate&&(m.end_date==null||m.end_date>=selectedDate)).map(m=>m.class_code))];
  let sorted=codes.sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  if(dept==='SRT'&&filterToday) sorted=sorted.filter(c=>isSRTToday(c));
  sorted=sorted.filter(c=>!c.includes('RSVP'));
  return sorted;
}

// ── Navigation ──
// Category extraction: SRK_SR_1→SR, GAK-GAK_BB_1→BB, ATC_A1→A, SRT_LV1_SAT_AM→LV1
function extractCat(code){
  const p=code.split('_');
  if(p.length>=3) return p[1];
  if(p.length===2) return p[1].replace(/\d+$/,'');
  return '';
}
function shortClassName(code){
  const parts=code.split('_');
  return parts.length>=4?parts.slice(2).join('_'):parts.pop();
}

const ATC_TIME={hwStart:d=>d===5?12*60+15:13*60+15, hwAbsentFrom:15*60, lessonStart:15*60+30, lessonEnd:17*60+15};
function atcMin(t){ const m=String(t||'').match(/(\d{1,2})(?:[:.](\d{2}))?/); if(!m) return null; let h=+m[1]; const mi=+(m[2]||0); if(h<8) h+=12; return h*60+mi; }
function atcHHMM(min){ const h=Math.floor(min/60), m=min%60; return (h>12?h-12:h)+':'+String(m).padStart(2,'0'); }
let allTimetable=[];
const AW={day:0,sess:0,cls:'',type:'',view:'class',q:'',_init:false};   /* v22 · view: class=全班 / list=只列有状况的 */
const AW_DAYS=['','Mon','Tue','Wed','Thu','Fri'];
const AW_DCODE=['','MON','TUE','WED','THU','FRI'];
const AW_SESS={1:'H/W',2:'Lesson'};
const AW_TYPE={absent:{t:'Absent',c:'var(--danger)',bg:'#FBEAEA'},late:{t:'Late',c:'var(--warn)',bg:'#FFF8E1'},early_leave:{t:'Early',c:'#B35A00',bg:'#FFF3E0'}};
function awEsc(s){ return String(s==null?'':s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
function awTT(cls,day,sess){

function awCell(cls,day,sess){
  const roster=getClassStudents('ATC',cls);
  const items=[];
  roster.forEach(s=>{
    if(s._paused){ items.push({cls,day,sess,s,type:'absent',time:'',reason:'On leave (Paused)'}); return; }

  // 班级 × 时段 表

    slots.forEach(([d,s])=>{
      const x=grid[c+'|'+d+'|'+s]; const k=d+'|'+s;
      tot[k]=tot[k]||{size:0,abs:0,late:0,early:0};
      tot[k].size+=x.size; tot[k].abs+=x.abs; tot[k].late+=x.late; tot[k].early+=x.early;
      const sel=AW.cls===c&&AW.day===d&&AW.sess===s;

/* v36 · SRT 补课：日子 → 时段 → 班（Owner 10-23）；卡片沿用 v33 的 swMissedCards */
const SW_DAYS=['SUN','MON','TUE','WED','THU','FRI','SAT'];
function swAddDays(d,n){ const x=new Date(d+'T12:00:00Z'); x.setUTCDate(x.getUTCDate()+n); return x.toISOString().slice(0,10); }
function swParts(c){ const p=String(c||'').replace(/^SRT-SRT_/,'').replace(/^SRT_/,'').replace(/^SRT-/,'').split(/[._]/); return {lv:p.find(x=>/^LV\d+/i.test(x))||'', day:p.find(x=>SW_DAYS.includes(x))||'', slot:p.find(x=>/^(AM|NN|PM)$/.test(x))||''}; }
function swDayOf(d){ return SW_DAYS[new Date(d+'T12:00:00').getDay()]; }
function swNextDay(dayIdx){ let d=todayStr(); for(let i=0;i<7;i++){ if(new Date(d+'T12:00:00').getDay()===dayIdx) return d; d=swAddDays(d,1); } return d; }
function swPickDate(d){ SW.to_date=d; if(SW.to_class&&swParts(SW.to_class).day!==swDayOf(d)) SW.to_class=''; SW.slot=''; swRenderBody(); }
function swOpen(mode,toClass){
  SW={mode,to_class:toClass||'',to_date:mode==='mark'?selectedDate:todayStr(),stu:'',kind:'replacement',q:'',from_class:'',from_date:'',note:''};
  if(toClass) SW.slot=swParts(toClass).slot;   /* v37 */
  document.getElementById('sw-title').textContent=mode==='mark'?'Add visitor':'Arrange replacement / temp slot';
  document.getElementById('sw-sub').textContent=mode==='mark'?('To '+swCls(toClass)+' · '+selectedDate):'SRT only. The student will appear in that class roster on that day.';
  document.getElementById('sw-modal').style.display='flex';
  swRenderBody();
}
function ntSwap(kind){   /* v33 · Notices 分页登记 SRT 补课 / 换 slot（跟 Manage 同一张表单） */
  swOpen('manage',''); SW.kind=kind; SW.src='notices';
  document.getElementById('sw-title').textContent=kind==='replacement'?'SRT replacement class':'SRT change of slot (this one time)';
  swRenderBody();
}
function swClose(){ document.getElementById('sw-modal').style.display='none'; }
function swRenderBody(){
  const inp='width:100%;padding:8px;border-radius:8px;border:1px solid var(--bdr);font-size:13px;font-family:inherit;box-sizing:border-box';
  const lab=t=>`<label style="display:block;font-size:11px;color:var(--mut);margin:10px 0 4px">${t}</label>`;
  let h='';
  // 1 学生
  h+=lab('Student');
  if(SW.stu){
    const s=swStudent(SW.stu);
    h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px;border:1px solid var(--bdr);border-radius:8px"><span style="font-size:13px;font-weight:600">${_escHtml(s.name)}</span><button onclick="SW.stu='';SW.from_class='';SW.from_date='';swRenderBody()" style="border:none;background:none;color:var(--info);font-size:12px;cursor:pointer">Change</button></div>`;
  }else{
    h+=`<input id="sw-q" style="${inp}" placeholder="Type a name…" value="${_escHtml(SW.q)}" oninput="SW.q=this.value;swRenderList()">`;
    h+=`<div id="sw-list" style="max-height:180px;overflow:auto;margin-top:4px"></div>`;
  }
  // 2 类型
  h+=lab('Type');
  h+=`<div style="display:flex;gap:6px">${['replacement','temp'].map(k=>`<button onclick="SW.kind='${k}';SW.from_class='';SW.from_date='';swRenderBody()" style="flex:1;min-height:40px;border-radius:8px;border:1px solid ${SW.kind===k?'transparent':'var(--bdr)'};background:${SW.kind===k?'#7870CC':'#fff'};color:${SW.kind===k?'#fff':'var(--txt)'};font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">${SW_LABEL[k]}</button>`).join('')}</div>`;
  h+=`<div style="font-size:10px;color:var(--hint);margin-top:4px">${SW.kind==='replacement'?'Missed own class on another day and makes it up here.':'This day only: attends this slot instead of own slot. For good (every week)? Use the Student page → Change Class — it comes to Notices for the message by itself.'}</div>`;
  // 3 去哪 —— v36：日子 → 时段 → 班；v37：老师 + Add visitor 也能改（预设当下这班），补课时放在卡片后面（LL 10-23）
  const _h0=h; h='';
  {
    const btn=(on,txt,js,dis)=>`<button ${dis?'disabled':''} onclick="${js}" style="flex:1;min-height:38px;border-radius:8px;border:1px solid ${on?'transparent':'var(--bdr)'};background:${on?'#7870CC':dis?'var(--sur2)':'#fff'};color:${on?'#fff':'var(--txt)'};opacity:${dis?.5:1};font-size:12px;font-weight:600;cursor:${dis?'default':'pointer'};font-family:inherit">${txt}</button>`;
    h+=lab('Attends — day');
    const fri=swNextDay(5), sat=swNextDay(6);
    h+=`<div style="display:flex;gap:6px;margin-bottom:6px">${btn(SW.to_date===fri,'Fri '+_escHtml(fmtDate(fri).replace(/^\w+,?\s*/,'').replace(/\s\d{4}$/,'')),`swPickDate('${fri}')`)}${btn(SW.to_date===sat,'Sat '+_escHtml(fmtDate(sat).replace(/^\w+,?\s*/,'').replace(/\s\d{4}$/,'')),`swPickDate('${sat}')`)}</div>`;
    h+=`<input type="date" style="${inp}" value="${SW.to_date}" onchange="swPickDate(this.value)">`;
    const day=swDayOf(SW.to_date||todayStr());
    const cls=swSrtClassesOn(SW.to_date||todayStr()).filter(c=>swParts(c).day===day);
    if(!cls.length){ h+=`<div style="font-size:12px;color:var(--danger);margin-top:6px">No SRT class on ${_escHtml(fmtDate(SW.to_date))}. Choose a Friday or Saturday.</div>`; }
    else{
      const slots=['AM','NN','PM'].filter(t=>cls.some(c=>swParts(c).slot===t));
      if(SW.to_class&&!SW.slot) SW.slot=swParts(SW.to_class).slot;
      if(slots.length===1) SW.slot=slots[0];
      h+=lab('Attends — time');
      h+=`<div style="display:flex;gap:6px">${['AM','NN','PM'].map(t=>btn(SW.slot===t,t,`SW.slot='${t}';SW.to_class='';swRenderBody()`,!slots.includes(t))).join('')}</div>`;
      if(SW.slot){
        const ownLv=SW.from_class?swParts(SW.from_class).lv:(SW.stu?swParts(swStuClasses(SW.stu,SW.to_date)[0]||'').lv:'');
        const list=cls.filter(c=>swParts(c).slot===SW.slot).sort((a,b)=>((swParts(b).lv===ownLv)-(swParts(a).lv===ownLv))||a.localeCompare(b,undefined,{numeric:true}));
        h+=lab('Attends — class');
        h+=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px">${list.map(c=>{ const on=SW.to_class===c, same=ownLv&&swParts(c).lv===ownLv;
          return `<button onclick='SW.to_class=${swJ(c)};swRenderBody()' style="min-height:40px;border-radius:8px;border:${on?'2px solid #7870CC':'1px solid var(--bdr)'};background:${on?'#F3F1FB':'#fff'};font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">${_escHtml(swCls(c))}${same?'<div style="font-size:10px;color:#7870CC;font-weight:600">Same level</div>':''}</button>`; }).join('')}</div>`;
      }
    }
  }
  const _attends=h; h=_h0;
  if(SW.kind==='temp') h+=_attends;
  // 4 原本的班 + 日子
  if(SW.stu&&SW.kind==='temp'){   /* v33 · 补课的原班由卡片带出来 */
    const own=swStuClasses(SW.stu,SW.from_date||SW.to_date);
    if(!SW.from_class) SW.from_class=own[0]||'';
    h+=lab('Own class');
    h+=`<select style="${inp}" onchange="SW.from_class=this.value">${(own.length?own:[SW.from_class]).filter(Boolean).map(c=>`<option value="${_escHtml(c)}"${c===SW.from_class?' selected':''}>${_escHtml(swCls(c))}</option>`).join('')||'<option value="">— no SRT class —</option>'}</select>`;
  }
  if(SW.kind==='temp'){
    if(!SW.from_date) SW.from_date=SW.to_date;
    h+=lab('Own class date (the day he skips)');
    h+=`<input type="date" style="${inp}" value="${SW.from_date||''}" onchange="SW.from_date=this.value">`;
  }else{
    /* v33 · 补课：选「补哪一次缺席」—— 最近 60 天的缺席一天一张卡；已补的变灰不能选；家长已请假、还没点的也列（Owner 22-10） */
    h+=lab('Which missed class is this for?');
    if(!SW.stu) h+=`<div style="font-size:12px;color:var(--hint)">Choose the student first.</div>`;
    else{
      const L=swMissedCards(SW.stu);
      if(L===null) h+=`<div style="font-size:12px;color:var(--mut)">Loading…</div>`;
      else if(!L.length) h+=`<div style="font-size:12px;color:var(--danger)">No missed classes in the last 60 days — nothing to make up.</div>`;
      else h+=`<div style="display:grid;gap:6px">${L.map((c,i)=>{ const on=SW.from_date===c.date&&SW.from_class===c.cls, dis=!!c.made;
        return `<button ${dis?'disabled':''} onclick="swPickMissed(${i})" style="text-align:left;padding:8px 10px;border-radius:10px;border:${on?'2px solid #7870CC':'1px solid var(--bdr)'};background:${dis?'var(--sur2)':on?'#F3F1FB':'#fff'};opacity:${dis?.55:1};cursor:${dis?'default':'pointer'};font-family:inherit">
          <div style="font-size:13px;font-weight:700;color:var(--txt)">${_escHtml(fmtDate(c.date))} · ${_escHtml(swCls(c.cls))}</div>
          <div style="font-size:11.5px;color:var(--mut)">${_escHtml(c.why)}</div>
          <div style="font-size:11px;font-weight:600;color:${dis?'var(--mut)':c.notice?'#7A4A00':'#B42318'}">${dis?_escHtml('Made up on '+fmtDate(c.made.to_date)+' · '+swCls(c.made.to_class)):c.notice?'Notified, not marked yet':'Not made up yet'}</div></button>`; }).join('')}</div>`;
    }
  }
  if(SW.kind!=='temp'&&SW.stu&&SW.from_date) h+=_attends;   /* v37 · 先选补哪一次缺席，选了卡片才出现去哪补 */
  h+=lab('Note (optional)');
  h+=`<input style="${inp}" value="${_escHtml(SW.note||'')}" oninput="SW.note=this.value" placeholder="e.g. parent asked">`;
  document.getElementById('sw-body').innerHTML=h;
  if(SW.mode==='mark') document.getElementById('sw-sub').textContent=SW.to_class?('To '+swCls(SW.to_class)+' · '+SW.to_date):'Choose the day, time and class';   /* v37 */
  if(!SW.stu) swRenderList();
}
function swMissedCards(stuId){
  if(!SW._miss||SW._miss.id!==stuId){
    SW._miss={id:stuId,list:null};
    const from=ntAddDays(ntToday(),-60), to=ntAddDays(ntToday(),60);
    Promise.all([
      _sb.from('attendance').select('date,status,class_code,note,voided_at').eq('student_id',stuId).eq('dept','SRT').gte('date',from).in('status',['absent','mc']),
      noticeEditor?_sb.from('attendance_notice').select('date_from,date_to,reason_code,reason_text,status,kind,dept').eq('student_id',stuId).eq('dept','SRT').eq('kind','absence').eq('status','active').gte('date_to',from):Promise.resolve({data:[]})
    ]).then(([a,n])=>{
      if(!SW._miss||SW._miss.id!==stuId) return;
      const L=[];
      (a.data||[]).filter(r=>!r.voided_at).forEach(r=>{
        const why=r.status==='mc'?'MC':(absKind('absent',r.note)||String(r.note||'').replace(/^Absent:\s*/,'')||'Absent');
        L.push({date:r.date,cls:r.class_code,why:'Absent · '+why});
      });
      const own=[...new Set(allMemberships.filter(m=>m.student_id===stuId&&m.dept==='SRT'&&!String(m.class_code).includes('RSVP')).map(m=>m.class_code))];
      (n.data||[]).forEach(x=>{
        for(let d=x.date_from<from?from:x.date_from; d<=x.date_to&&d<=to; d=ntAddDays(d,1)){
          own.forEach(c=>{ const m=allMemberships.find(mm=>mm.student_id===stuId&&mm.class_code===c&&mm.start_date<=d&&(mm.end_date==null||mm.end_date>=d));
            if(m&&isClassDay('SRT',c,d)&&!L.some(y=>y.date===d&&y.cls===c)) L.push({date:d,cls:c,why:'Parent told the office · '+((NT_REASON[x.reason_code]||{label:'Absent'}).label),notice:true}); });
        }
      });
      L.forEach(c=>{ c.made=allSwaps.find(w=>w.status==='active'&&w.kind==='replacement'&&w.student_id===stuId&&w.from_class===c.cls&&w.from_date===c.date)||null; });
      L.sort((p,q)=>q.date.localeCompare(p.date));
      SW._miss.list=L;
      if(document.getElementById('sw-modal').style.display==='flex') swRenderBody();
    }).catch(e=>{ console.warn('[v33] missed classes',e); if(SW._miss&&SW._miss.id===stuId){ SW._miss.list=[]; if(document.getElementById('sw-modal').style.display==='flex') swRenderBody(); } });
  }
  return SW._miss.list;
}
function swPickMissed(i){ const c=(SW._miss&&SW._miss.list||[])[i]; if(!c||c.made) return; SW.from_date=c.date; SW.from_class=c.cls; swRenderBody(); }
function swRecentAbsences(stuId){
  /* 只看已载入的：今天这页的纪录不够，所以向资料库要最近 60 天的缺席（非同步，补进来再画一次） */
  if(!SW._abs||SW._abs.id!==stuId){
    SW._abs={id:stuId,list:[]};
    const from=new Date(Date.now()-60*86400000).toISOString().slice(0,10);
    _sb.from('attendance').select('date,status,class_code').eq('student_id',stuId).eq('dept','SRT').gte('date',from).then(({data})=>{
      if(SW._abs&&SW._abs.id===stuId){ SW._abs.list=(data||[]).filter(r=>r.status==='absent'||r.status==='mc').map(r=>r.date).sort().reverse().slice(0,6); if(document.getElementById('sw-modal').style.display==='flex') swRenderBody(); }
    });
  }
  return SW._abs.list;
}
function swRenderList(){
  const el=document.getElementById('sw-list'); if(!el) return;
  const q=(SW.q||'').trim().toLowerCase();
  if(q.length<2){ el.innerHTML='<div style="font-size:11px;color:var(--hint);padding:6px">Type at least 2 letters</div>'; return; }
  const d=SW.to_date||selectedDate;
  const ids=new Set(allMemberships.filter(m=>m.dept==='SRT'&&m.start_date<=d&&(m.end_date==null||m.end_date>d)).map(m=>m.student_id));
  const list=allStudents.filter(s=>ids.has(s.id)&&((s.name||'').toLowerCase().includes(q)||(s.name_cn||'').includes(SW.q.trim()))).slice(0,30);
  el.innerHTML=list.length?list.map(s=>`<div onclick='SW.stu=${swJ(s.id)};SW.from_class="";swRenderBody()' style="padding:8px;border-bottom:.5px solid var(--bdr);cursor:pointer;font-size:12px">${_escHtml(s.name)} <span style="color:var(--mut);font-size:11px">${_escHtml(s.name_cn||'')} · ${_escHtml(swStuClasses(s.id,d).map(swCls).join(', '))}</span></div>`).join(''):'<div style="font-size:11px;color:var(--hint);padding:6px">No matching results</div>';
}
async function swSave(){
  if(!SW.stu){ toast('Choose a student'); return; }
  if(SW.kind==='replacement'&&!SW.from_date){ toast('Choose which missed class this is for',4000); return; }   /* v33 · 一定要选 */
  if(!SW.to_class||!SW.to_date){ toast('Choose the day, time and class he attends'); return; }
  if(SW.kind==='replacement'&&allSwaps.some(w=>w.status==='active'&&w.kind==='replacement'&&w.student_id===SW.stu&&w.from_class===SW.from_class&&w.from_date===SW.from_date)){ toast('That missed class is already made up'); return; }   /* v36 */
  if(!SW.from_class){ toast('Own class is missing'); return; }
  if(SW.kind==='temp'&&!SW.from_date){ toast('Temp slot needs the own class date'); return; }
  if(SW.from_class===SW.to_class&&(SW.from_date||'')===SW.to_date){ toast('That is his own class on that day'); return; }
  /* v32 · 先向资料库重查（行政可能刚安排过）。同一孩子、同一目标班、同一天 = 已安排，不再写第二笔；
     同一天别的班（可能是另一节合法的课）→ 问一句再写 */
  try{ const{data:fresh,error:fe}=await _sb.from('attendance_swap').select('*').eq('status','active').eq('student_id',SW.stu).eq('to_date',SW.to_date);
       if(!fe&&fresh){ allSwaps=allSwaps.filter(w=>!(w.student_id===SW.stu&&w.to_date===SW.to_date)).concat(fresh); } }catch(e){}
  const _same=allSwaps.find(w=>w.student_id===SW.stu&&w.to_date===SW.to_date&&w.to_class===SW.to_class&&w.status==='active');
  if(_same){ toast((_same.created_by&&_same.created_by!==userEmail?'Already arranged by '+(markerNames[_same.created_by]||'the office'):'Already arranged')+' for this class that day',4500); return; }
  const _other=allSwaps.find(w=>w.student_id===SW.stu&&w.to_date===SW.to_date&&w.status==='active');
  if(_other&&!confirm('This child already has another arrangement that day ('+_other.to_class+').\n\nAdd this one too?')) return;
  const row={kind:SW.kind,student_id:SW.stu,dept:'SRT',from_class:SW.from_class,from_date:SW.from_date||null,to_class:SW.to_class,to_date:SW.to_date,note:(SW.note||'').trim()||null,client_uid:(crypto.randomUUID?crypto.randomUUID():undefined)};
  const btn=document.getElementById('sw-save'); btn.disabled=true;
  const{data,error}=await _sb.from('attendance_swap').insert(row).select();
  btn.disabled=false;
  if(error){ console.error(error); toast(String(error.code)==='23505'?'Already arranged for this child (same class and day, or the same missed class) — refresh to see it':'✕ Save failed',5000); return; }   /* v33 · Step B 资料库防重复 */
  allSwaps.push({status:'active',created_by:userEmail,...row,...((data&&data[0])||{})});
  swClose(); toast('✓ Saved');
  if(SW.src==='notices'){ const _nid=((data&&data[0])||{}).id; if(_nid&&typeof msSend==='function') msSend('swap',_nid); else if(typeof msLoad==='function') msLoad(); }   /* v33 · 从 Notices 登记 → 问要不要现在发 */
  if(document.getElementById('page-mark').classList.contains('on')) renderMark();
  if(document.getElementById('page-manage').classList.contains('on')) swRenderAdmin();
}
async function swCancel(id){
  const w=allSwaps.find(x=>x.id===id); if(!w) return;
  if(!confirm('Cancel this arrangement? (A mark already saved stays.)')) return;
  const{error}=await _sb.from('attendance_swap').update({status:'cancelled'}).eq('id',id);
  if(error){ console.error(error); toast('✕ Cancel failed'); return; }
  allSwaps=allSwaps.filter(x=>x.id!==id); toast('✓ Cancelled'); swRenderAdmin();
}
function swRenderAdmin(){
  const host=document.getElementById('manage-content'); if(!host) return;
  let box=document.getElementById('sw-admin');
  if(!box){ box=document.createElement('div'); box.id='sw-admin'; box.className='card'; host.insertBefore(box,host.firstChild); }

  const list=allSwaps.filter(w=>w.to_date>=from).sort((a,b)=>a.to_date.localeCompare(b.to_date)||a.to_class.localeCompare(b.to_class));

    <button onclick="swOpen('manage','')" style="min-height:36px;padding:6px 14px;border-radius:8px;border:none;background:var(--layer);color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">+ Add</button></div>`;
  if(!list.length) h+=`<div style="font-size:12px;color:var(--mut);padding:8px 0">No records yet (last 30 days and upcoming).</div>`;
  else{
    h+=`<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px;min-width:560px"><tr>${['Attends','Student','Type','Own class','By',''].map(t=>`<th style="text-align:left;padding:6px;font-size:10px;color:var(--mut);border-bottom:.5px solid var(--bdr)">${t}</th>`).join('')}</tr>`;
    list.forEach(w=>{ const s=swStudent(w.student_id);
      h+=`<tr><td style="padding:6px;border-bottom:.5px solid var(--bdr);white-space:nowrap">${_escHtml(w.to_date)}<br><span style="color:var(--mut)">${_escHtml(swCls(w.to_class))}</span></td>
        <td style="padding:6px;border-bottom:.5px solid var(--bdr)">${_escHtml(s.name)}${w.note?'<div style="font-size:10px;color:var(--mut)">'+_escHtml(w.note)+'</div>':''}</td>
        <td style="padding:6px;border-bottom:.5px solid var(--bdr)"><span style="font-size:10px;background:#F3F1FB;color:#7870CC;border-radius:8px;padding:1px 7px;font-weight:600;white-space:nowrap">${SW_LABEL[w.kind]}</span></td>
        <td style="padding:6px;border-bottom:.5px solid var(--bdr);white-space:nowrap">${_escHtml(swCls(w.from_class))}${w.from_date?'<br><span style="color:var(--mut)">'+(w.kind==='replacement'?'missed ':'')+_escHtml(w.from_date)+'</span>':''}</td>
        <td style="padding:6px;border-bottom:.5px solid var(--bdr);font-size:10px;color:var(--mut)">${_escHtml(markerNames[w.created_by]||w.created_by||'')}</td>
        <td style="padding:6px;border-bottom:.5px solid var(--bdr);text-align:right"><button onclick='swCancel(${swJ(w.id)})' style="padding:4px 10px;border-radius:6px;border:1px solid var(--bdr);background:#fff;font-size:11px;cursor:pointer;font-family:inherit">Cancel</button></td></tr>`; });
    h+=`</table></div>`;
  }
  box.innerHTML=h;
}

function renderDashboard(){
  const el=document.getElementById('dash-content');
  /* v12 · 请假的孩子不进「还没点名」的分母；已经被点的照算，否则会出现 362 of 361 */
  const total=allStudents.filter(s=>!isPausedStu(s)||todayRecords.some(r=>r.student_id===s.id)).length;
  const marked=todayRecords.length;

  // Group by status+dept
  const byStatus={absent:[],late:[],early_leave:[],mc:[]};
  todayRecords.forEach(r=>{if(byStatus[r.status])byStatus[r.status].push(r);});
  function deptCount(arr,dept){return arr.filter(r=>r.dept===dept).length;}
  function deptDetail(arr){return DEPTS.map(d=>{const n=deptCount(arr,d);return n?`<span style="color:${DEPT_COLORS[d]}">${d} ${n}</span>`:null;}).filter(Boolean).join(' · ')||'–';}

  let h='';

  // Holiday check (all-dept holidays on dashboard)
  const dashHoliday=getHolidayAllDepts(selectedDate);
  if(dashHoliday){
    h+=`<div class="holiday-banner">🏖 Today is a holiday — <strong>${dashHoliday.name}</strong>. No attendance required.</div>`;
  }

  h+=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
    <div><div style="font-size:16px;font-weight:600">${fmtDate(selectedDate)}</div>
    <div style="font-size:11px;color:var(--mut)">${marked} of ${total} students marked</div></div>
    <button onclick="goPage('mark')" style="padding:8px 16px;border-radius:8px;border:none;background:var(--layer);color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">Mark Attendance</button>
  </div>`;

  // 3 stat boxes (Absent / Late / MC) with dept breakdown
  h+=`<div class="stat-grid" style="grid-template-columns:repeat(4,1fr)">`;
  const statCfg=[
    {key:'absent',label:'ABSENT',color:'var(--danger)',icon:'✕'},
    {key:'late',label:'LATE',color:'var(--warn)',icon:'⏰'},
    {key:'early_leave',label:'EARLY',color:'#C4622D',icon:'🚪'},
    {key:'mc',label:'MC',color:'var(--info)',icon:'🤒'}
  ];
  statCfg.forEach(cfg=>{
    const arr=byStatus[cfg.key];
    h+=`<div class="stat-box" style="cursor:pointer" onclick="dashDetail('${cfg.key}')">
      <div class="stat-num" style="color:${cfg.color}">${arr.length}</div>
      <div class="stat-label">${cfg.label}</div>
      <div style="font-size:9px;margin-top:6px;line-height:1.6">${deptDetail(arr)}</div>
    </div>`;
  });
  h+=`</div>`;

  // Detail panel (hidden, shown on click)
  h+=`<div id="dash-detail" style="display:none"></div>`;

  // Contact parents section
  h+=`<div class="card" style="margin-top:10px"><div style="font-size:13px;font-weight:600;margin-bottom:10px;color:var(--danger)">📞 Contact Parents</div>`;
  h+=`<div style="font-size:10px;color:var(--mut);margin-bottom:8px">Absent 2+ consecutive days without notified reason</div>`;
  h+=`<div id="contact-parents">Loading...</div></div>`;

  el.innerHTML=h;
  loadContactParents();
}

// Show detail list for a status
function dashDetail(status){
  const el=document.getElementById('dash-detail');
  const arr=todayRecords.filter(r=>r.status===status);
  const ICON={absent:'✕',late:'⏰',early_leave:'🚪',mc:'🤒'};
  if(!arr.length){el.style.display='none';return;}
  let h=`<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
    <div style="font-size:13px;font-weight:600">${status.toUpperCase()} · ${arr.length} students</div>
    <button onclick="document.getElementById('dash-detail').style.display='none'" style="background:none;border:none;font-size:16px;color:var(--mut);cursor:pointer">✕</button>
  </div>`;
  // Group by dept
  for(const dept of DEPTS){
    const deptArr=arr.filter(r=>r.dept===dept);
    if(!deptArr.length) continue;
    h+=`<div style="font-size:10px;font-weight:600;color:${DEPT_COLORS[dept]};margin:8px 0 4px">${dept}</div>`;
    deptArr.forEach(r=>{
      h+=`<div style="display:flex;align-items:center;padding:4px 0;font-size:11px;border-bottom:.5px solid var(--bdr)">
        <div style="flex:1">${r.student_name}</div>
        <div style="font-size:10px;color:var(--mut)">${r.class_code}</div>
        ${r.note?`<div style="font-size:9px;color:var(--warn);margin-left:8px">${r.note}</div>`:''}
      </div>`;
    });
  }
  h+=`</div>`;
  el.innerHTML=h;
  el.style.display='block';
}

// Contact parents: 2+ consecutive absent without reason
async function loadContactParents(){
  const el=document.getElementById('contact-parents');
  if(!el) return;
  // Get yesterday's date (skip weekends simply)
  const today=new Date(selectedDate+'T12:00:00');
  const prev=new Date(today);
  prev.setDate(prev.getDate()-1);
  // Skip Sunday→Friday, Saturday→Friday
  if(prev.getDay()===0) prev.setDate(prev.getDate()-2);
  if(prev.getDay()===6) prev.setDate(prev.getDate()-1);
  const prevDate=prev.getFullYear()+'-'+String(prev.getMonth()+1).padStart(2,'0')+'-'+String(prev.getDate()).padStart(2,'0');

  const{data:prevRecs}=await _sb.from('attendance').select('student_id,student_name,dept,class_code,note').eq('date',prevDate).eq('status','absent');
  const prevAbsent=prevRecs||[];

  // Today's absent without reason
  const todayAbsent=todayRecords.filter(r=>r.status==='absent'&&!r.note);

  // Find students absent BOTH days without reason
  const needContact=[];
  todayAbsent.forEach(t=>{
    const prev=prevAbsent.find(p=>p.student_id===t.student_id&&p.dept===t.dept&&!p.note);
    if(prev) needContact.push(t);
  });

  if(!needContact.length){
    el.innerHTML='<div style="font-size:11px;color:var(--ok);padding:4px 0">✓ No students need contacting</div>';
    return;
  }
  let h='';
  needContact.forEach(r=>{
    h+=`<div style="display:flex;align-items:center;padding:6px 0;border-bottom:.5px solid var(--bdr);font-size:12px">
      <div class="dept-dot" style="background:${DEPT_COLORS[r.dept]};margin-right:8px"></div>
      <div style="flex:1;font-weight:500">${r.student_name}</div>
      <div style="font-size:10px;color:var(--mut)">${r.dept} · ${r.class_code}</div>
    </div>`;
  });
  el.innerHTML=h;
}

// MARK ATTENDANCE
// ═══════════════════════════════════════
function renderMark(){
  const el=document.getElementById('mark-content');
  let h=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
    <div style="font-size:14px;font-weight:600">${fmtDate(selectedDate)}</div>

  }
  h+=`</div>`;

  // Weekend check: SRK/GAK/ATC have no classes on Sat/Sun
  const _dow=new Date(selectedDate+'T12:00:00').getDay();

    h+=`<div class="holiday-banner">📅 <strong>${currentDept}</strong> — No classes on weekends.</div>`;

    if(extra){
      // Extra class overrides holiday — allow marking
      h+=`<div class="holiday-banner">📋 <strong>${currentDept}</strong> holiday — <strong>${markHoliday.name}</strong>. Extra class: <strong>${extra.name}</strong>.</div>`;
    }else{
      h+=`<div class="holiday-banner">🏖 <strong>${currentDept}</strong> holiday — <strong>${markHoliday.name}</strong>. No attendance needed.</div>`;
      el.innerHTML=h;return;
    }
  }

  // Class list

  // ATC session tabs
  if(currentDept==='ATC'){
    if(currentSession===0) currentSession=1; // default to S1
    h+=`<div style="display:flex;gap:6px;margin-bottom:14px">
      <button class="dept-tab${currentSession===1?' on':''}" style="${currentSession===1?'background:var(--d-atc);color:#fff;border-color:transparent':''}" onclick="switchSession(1)">S1: Homework 1:30-3:30</button>
      <button class="dept-tab${currentSession===2?' on':''}" style="${currentSession===2?'background:var(--d-atc);color:#fff;border-color:transparent':''}" onclick="switchSession(2)">S2: Lesson 3:30-5:30</button>
    </div>`;
  }else{
    currentSession=0;
  }

  const _dayOfWeek=new Date(selectedDate+'T12:00:00').getDay();

  // Classes for current dept
  const classes=getDeptClasses(currentDept);  if(!classes.length){
    h+=`<div class="card" style="text-align:center;color:var(--mut);padding:24px">`;
    h+=currentDept==='SRT'?'No SRT classes scheduled today':'No classes in this department';
    h+=`</div>`;
  }else{
    // Use global extractCat
    const cats=[...new Set(classes.map(c=>extractCat(c)))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
    if(!markCategory||!cats.includes(markCategory)) markCategory=cats[0]||'';
    const filteredClasses=classes.filter(c=>extractCat(c)===markCategory);
    if(!markClass||!filteredClasses.includes(markClass)) markClass=filteredClasses[0]||'';

    // Row 2: Category buttons
    h+=`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">`;
    cats.forEach(cat=>{
      const isOn=cat===markCategory;
      h+=`<button style="padding:5px 14px;border-radius:8px;border:1px solid ${isOn?'transparent':'var(--bdr)'};background:${isOn?'var(--mut)':'var(--sur)'};color:${isOn?'#fff':'var(--txt)'};font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;text-transform:uppercase" onclick="switchMarkCat('${cat}')">${cat}</button>`;
    });
    h+=`</div>`;

    // Row 3: Class buttons within category
    h+=`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">`;
    filteredClasses.forEach(code=>{
      const sts=getClassStudents(currentDept,code).filter(s=>!swAwayOn(s.id,code,selectedDate));   /* v19 */
      const mc=sts.filter(s=>getStatus(s.id,currentDept,currentSession)!=='unmarked').length;
      const _exp=expectedCount(sts,currentDept,currentSession);   /* v12 · 请假的不算，否则这班永远点不完 */
      /* v14 · Follow-Up 没做完，这班点名不算完成（Owner 27-09 裁定） */
      const done=mc===_exp&&_exp>0&&fuClassDone(sts,currentDept,code,selectedDate,currentSession);
      const isOn=code===markClass;
      const shortName=shortClassName(code);
      h+=`<button style="padding:6px 12px;border-radius:8px;border:1px solid ${isOn?'transparent':'var(--bdr)'};background:${isOn?'var(--txt)':'var(--sur)'};color:${isOn?'#fff':'var(--txt)'};font-size:12px;font-weight:600;cursor:pointer;font-family:inherit" onclick="switchMarkClass('${code}')">${shortName} <span style="font-size:10px;opacity:.7">${done?'\u2713':mc+'/'+_exp}</span></button>`;
    });
    h+=`</div>`;

    /* v29 · 家长请假通知的状态 */
    const _ntc=noticeCache[selectedDate+'|'+currentDept];
    if(!_ntc){ loadNotices(selectedDate,currentDept).then(()=>{ if(document.getElementById('page-mark').classList.contains('on')&&!document.getElementById('abs-ov')){ const y=window.scrollY; renderMark(); window.scrollTo(0,y); } }); }
    else if(!_ntc.ok) h+=`<div class="holiday-banner" style="display:flex;align-items:center;gap:8px">⚠ Parent absence notices could not be loaded — marking still works. <button onclick="retryNotices()" style="margin-left:auto;border:1px solid var(--bdr);background:#fff;border-radius:8px;padding:4px 10px;font-family:inherit;font-size:12px;cursor:pointer">Retry</button></div>`;
    else if(!noticeEditor&&noticeScope[currentDept]===false) h+=`<div style="font-size:11px;color:var(--mut);margin:-6px 0 10px">Parent absence notices for ${currentDept} are not shown to your account.</div>`;
    // Show selected class only
    const code=markClass;
    const students=getClassStudents(currentDept,code);
    const homeStu=students.filter(s=>!swAwayOn(s.id,code,selectedDate));   /* v19 · 今天换去别的时段的，不算这一班 */
    const markedCount=homeStu.filter(s=>getStatus(s.id,currentDept,currentSession)!=='unmarked').length;
    const expectCount=expectedCount(homeStu,currentDept,currentSession);   /* v12 · 请假的不算进分母 */
    const fuOk=fuClassDone(students,currentDept,code,selectedDate,currentSession);   /* v14 */
    const allMarked=markedCount===expectCount&&expectCount>0&&fuOk;
    h+=`<div class="card" style="padding:0">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--bdr)">
        <span style="font-size:14px;font-weight:700">${code}</span>
        <span style="font-size:12px;color:var(--mut)">${allMarked?'\u2713 ':''}${markedCount}/${expectCount}${(markedCount===expectCount&&expectCount>0&&!fuOk)?' &middot; Follow-Up pending':''}</span>
      </div>
      <div style="padding:0 0 8px">
        <div class="mark-all-bar"><span>Quick:</span>
          ${(canClearDay()&&todayRecords.some(r=>r.class_code===code&&r.dept===currentDept&&(r.session??0)===currentSession))?`<button class="status-btn" style="color:var(--danger);border-color:var(--danger)" onclick="clearAll('${currentDept}','${code}')">Clear all</button>`:''}
          <button class="status-btn s-present" onclick="markAll('${currentDept}','${code}','present')">All \u2713</button>
        </div>`;
    students.forEach(s=>{
      const st=getStatus(s.id,currentDept,currentSession);
      const active=st==='unmarked'?'':st;
      const rec=todayRecords.find(r=>r.student_id===s.id&&r.dept===currentDept&&(r.session??0)===currentSession);
      const note=rec?.note||'';
      const rule=getRule(s.id,currentDept,_dayOfWeek,currentSession);
      const ruleStyle=rule&&active===''?'background:rgba(0,0,0,.04);opacity:.6':'';
      const ruleTag=rule&&active===''?`<span style="font-size:9px;color:var(--mut);margin-left:6px" title="${rule.reason||''}">${ruleLabel(rule.rule_type)}${rule.reason?' \u00b7 '+rule.reason:''}</span>`:'';
      const mem=allMemberships.find(m=>m.student_id===s.id&&m.dept===currentDept&&m.class_code===code);
      const isTransferDay=mem&&mem.end_date===selectedDate;
      const away=swAwayOn(s.id,code,selectedDate);            /* v19 */
      const madeUp=swMadeUp(s.id,code,selectedDate);          /* v19 */
      const transferTo=isTransferDay?getTransferTarget(s.id,currentDept,mem.end_date):null;
      const transferTag=isTransferDay?'<span style="font-size:9px;color:#7870CC;margin-left:6px">\u2192 '+(transferTo?transferTo.class_code:'Moved')+'</span>':'';
      const lateMatch=(note||'').match(/Late:\s*(\d{1,2}:\d{2})/);
      /* v15 · 迟到时间只在「现在是 Late」时显示，放在按钮下面那行小字 —— 按钮宽度固定，名字不会被挤成一字一行 */
      const lateTx=(active==='late'&&lateMatch)?lateMatch[1]:'';
      const LABELS_ROW={present:'\u2713',absent:'\u2715',late:'\u23f0',early_leave:'\ud83d\udeaa',mc:'\ud83e\udd12'};
      const _ak=absKind(active,note);
      const _absDetail=(active==='absent'&&/^Absent: (Stay back|Other) — /.test(note)&&!/Not informed$/.test(note))?note.replace(/^Absent: (Stay back|Other) — /,''):'';
      const showNote=!isTransferDay&&((active==='early_leave'&&note)||(active==='absent'&&(_absDetail||(note&&!/^Absent: /.test(note)))));
      const _noteTx=active==='absent'?(_absDetail||note):note;
      const _nt=noticeFor(s.id,currentDept,currentSession);   /* v29 */
      const _laR=noticeOf(s.id,currentDept,currentSession,'late_arrival');   /* v33 */
      const _pend=active===''&&!!(_nt||(currentDept==='ATC'&&currentSession===1&&_laR&&ntHmT(_laR.expected_time)>='15:00'));
      const _ntTag=_nt?'<span style="font-size:10px;font-weight:700;color:#1E6B3A;background:#E7F6EC;border-radius:8px;padding:1px 7px;margin-left:6px;vertical-align:middle;white-space:nowrap">Notified · '+_escHtml((NT_REASON[_nt.reason_code]||{label:'Absent'}).label)+'</span>':'';
      h+=`<div class="stu-row" style="${ruleStyle}${(isTransferDay||away)?'opacity:.5':''}">
        <div class="stu-num">${s.num??''}</div>
        <div class="stu-name">${s.name}${s.name_cn?' <span class="stu-cn">'+s.name_cn+'</span>':''}${pausedTag(s)}${fuTag(s,code)}${_ntTag}${ntTimeTag(s.id,currentDept,currentSession)}${ruleTag}${transferTag}${eRowTag(note)}${showNote?'<div style="font-size:9px;color:var(--danger);margin-top:2px">'+_escHtml(_noteTx)+'</div>':''}${madeUp?'<div style="font-size:9px;color:#7870CC;margin-top:2px">Made up → '+_escHtml(madeUp.to_date+' '+swCls(madeUp.to_class))+'</div>':''}${pausedNote(s)}</div>
        ${away
          ?'<div style="font-size:10px;color:#7870CC;font-weight:600;white-space:nowrap;text-align:right">Temp slot<br>→ '+_escHtml(swCls(away.to_class))+(away.to_date!==selectedDate?' · '+_escHtml(away.to_date):'')+'</div>'
          :isTransferDay
          ?'<div style="font-size:10px;color:#7870CC;font-weight:600;white-space:nowrap">Class changed</div>'
          :`<div class="sb-wrap">${ROW_STATUSES.map(status=>{
            const on=active===status||(status==='absent'&&active==='mc');
            const ic=status==='absent'&&active==='mc'?LABELS_ROW.mc:LABELS_ROW[status];
            const tx=status==='late'&&lateTx?lateTx:(status==='absent'&&_ak?_ak:(status==='absent'&&_pend?'Notified':STATUS_TX[status]));
            return `<button class="status-btn${on?' s-'+active:''}${(!on&&status==='absent'&&_pend)?' s-pend':''}" onclick="markStudent('${s.id}','${s.name}','${currentDept}','${code}','${status}')"><span class="sb-ic">${ic}</span><span class="sb-tx">${tx}</span></button>`;
          }).join('')}</div>`}
      </div>`;
    });
    if(currentDept==='SRT') h+=swVisitorsHtml(code);   /* v19 · 来访：补课 / 临时换时段 */
    h+=`</div></div>`;
  }
  el.innerHTML=h;
}

/* v33 · 点错了要回到「没点」：再按一次 Present；缺席的在 Absent 选单按 Not marked。老师只能改当天（跟 Clear all 一样） */
async function unmarkStudent(studentId,dept){
  if(!canClearDay()){ toast('Only today\'s marks can be changed back to not marked'); return; }
  const scrollY=window.scrollY;
  try{
    const{data,error}=await _sb.from('attendance').delete().eq('date',selectedDate).eq('student_id',studentId).eq('dept',dept).eq('session',currentSession).select('student_id');
    if(error) throw error;
    if(!(data||[]).length){ toast('⚠ Not changed — refresh the page and check',5000); return; }
    todayRecords=todayRecords.filter(r=>!(r.student_id===studentId&&r.dept===dept&&(r.session??0)===currentSession));
    renderMark(); window.scrollTo(0,scrollY);
    document.getElementById('last-saved').textContent='Saved '+fmtTime(); toast('↺ Not marked');
  }catch(e){ console.error('Unmark failed:',e); toast('✕ Could not change — nothing changed',5000); }
}
async function markStudent(studentId,studentName,dept,classCode,status){
  const _was=getStatus(studentId,dept,currentSession);   /* v33 */
  if(status==='present'&&_was==='present') return unmarkStudent(studentId,dept);
  let note='';
  const _dow=new Date(selectedDate+'T12:00:00').getDay();
  const rule=getRule(studentId,dept,_dow,currentSession,selectedDate);
  if(status==='present'&&rule){
    const reason=prompt(studentName+' is expected '+rule.rule_type.replace('_',' ')+'.\n\nReason for attending:','');
    if(reason===null) return;
    note=reason?'Override: '+reason:'Override: no reason given';
  }
  let _hwAbs=false, _lateTip='';
  if(status==='late'){
    const now=new Date();
    const timeStr=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
    const _atc=dept==='ATC';
    const _start=_atc?(currentSession===2?'3:30':atcHHMM(ATC_TIME.hwStart(_dow))):'';
    const _ask=v=>prompt(_atc?('Arrival time ('+(currentSession===2?'Lesson':'H/W')+' starts '+_start+'):'):'Late time:',v);
    /* v24 · ATC：今天第一次按 Late → 直接记现在的时间，不跳视窗；已经是 Late 再按一次 → 改时间。
       补点以前的日子（不是今天）一样会问，因为「现在」不是孩子到的时间。 */
    const _prev=todayRecords.find(r=>r.student_id===studentId&&r.dept===dept&&(r.session??0)===currentSession);
    const _prevT=_prev&&_prev.status==='late'?(((_prev.note||'').match(/Late:\s*(\d{1,2}[:.]\d{2})/)||[])[1]||''):'';
    let input;
    if(_atc&&!_prevT&&selectedDate===todayStr()) input=timeStr;
    else { input=_ask(_prevT||timeStr); if(input===null) return; }
    note='Late: '+input;
    /* v23 · H/W 3:00 或以后才到 → 照规则改记 Absent；按取消可以改时间 */
    while(_atc&&currentSession===1){
      const m=atcMin(input);
      if(m==null||m<ATC_TIME.hwAbsentFrom) break;
      if(confirm(studentName+' arrived '+input+'.\n\nArriving 3:00 or later counts as ABSENT for H/W.\nOK = mark Absent · Cancel = change the time')){
        status='absent'; note='Arrived '+input+' (3:00 or later = H/W absent)'; _hwAbs=true; break;
      }
      input=_ask(input); if(input===null) return;
      note='Late: '+input;
    }
    if(status==='late'&&_atc&&!_prevT) _lateTip='Late '+input+' · tap Late again to change the time';
  }
  if(status==='absent'&&!_hwAbs){
    const _la=noticeOf(studentId,dept,currentSession,'late_arrival'), _laT=_la?ntHmT(_la.expected_time):'';   /* v32 · ATC 晚到 3:00 或以后 → 功课班算有通知的缺席 */
    const _pre=(dept==='ATC'&&currentSession===1&&_la&&_laT>='15:00')?{label:'Arriving '+_laT,pick:{status:'absent',note:'Absent: Other — Late arrival '+_laT+' (notified)'}}:null;
    const pick=await absentPicker(dept,studentName,noticeFor(studentId,dept,currentSession),(rule&&rule.rule_type==='absent')?rule:null,_pre,_was==='absent'||_was==='mc');   /* v29 · v30 加固定例外 · v33 可清掉 */
    if(!pick) return;
    if(pick.clear) return unmarkStudent(studentId,dept);
    status=pick.status; note=pick.note;
  }
  if(status==='early_leave'){
    const _el=noticeOf(studentId,dept,currentSession,'early_leave')||noticeOf(studentId,dept,currentSession,'pickup_change');   /* v32 · 家长通知优先 */
    const reason=prompt('Left early — what time and why? (e.g. 3:30 piano — you can leave this blank):',_el?(ntHmT(_el.expected_time)+' (parent notified)'):(rule&&rule.rule_type==='early_leave')?String(rule.reason||''):'');   /* v30 · 固定例外预填 */
    if(reason===null) return;
    note=reason?'Early: '+reason:'Early leave';
  }
  const scrollY=window.scrollY;
  const openIds=[...document.querySelectorAll('.class-body.open')].map(el=>el.id);
  const existing=todayRecords.findIndex(r=>r.student_id===studentId&&r.dept===dept&&(r.session??0)===currentSession);
  if(existing>=0){ todayRecords[existing].status=status; todayRecords[existing].note=note; }
  else todayRecords.push({date:selectedDate,student_id:studentId,student_name:studentName,dept,class_code:classCode,status,note,marked_by:userEmail,session:currentSession});
  renderMark();
  openIds.forEach(id=>{const el=document.getElementById(id);if(el)el.classList.add('open');});
  window.scrollTo(0,scrollY);
  /* v15 · 点了「有来」（Present / Late / Early）而这孩子还有 Follow-Up 没做 → 直接弹出清单，老师不用另外找那颗黄标 */
  if((status==='present'||status==='late'||status==='early_leave') && !document.getElementById('fu-ov')
     && fuPending({id:studentId},dept,classCode,selectedDate,currentSession)>0){ fuOpen(studentId,classCode); }
  try{
    const{error}=await _sb.from('attendance').upsert({
      date:selectedDate,student_id:studentId,student_name:studentName,
      dept,class_code:classCode,status,note,marked_by:userEmail,
      session:currentSession,
      updated_at:new Date().toISOString()
    },{onConflict:'date,student_id,dept,session'});
    if(error){ console.error('Save failed:',error); toast('✕ Save failed'); }
    else { document.getElementById('last-saved').textContent='Saved '+fmtTime(); toast(_lateTip?('✓ Saved · '+_lateTip):'✓ Saved',_lateTip?3500:undefined); }
  }catch(e){console.error('Save error:',e);toast('✕ Save error');}
}

/* v31 · Clear all：这一班、这一天、这一节，本班学生在本班点的名全部清掉（回到未点）。
   老师只能清当天（Owner 10-22）；行政 / 管理层任何日期。换去别班的、来访的不动；Follow-Up 纪录不动。 */
function askOk(title,msg,okLabel){   /* v33 · 页面上的「确定吗」 */
  return new Promise(resolve=>{
    const ov=document.createElement('div'); ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px';
    const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    ov.innerHTML='<div style="background:var(--sur);border-radius:14px;max-width:400px;width:100%;padding:16px"><div style="font-size:15px;font-weight:700;margin-bottom:6px">'+esc(title)+'</div><div style="font-size:13px;color:var(--mut);margin-bottom:14px">'+esc(msg)+'</div>'
      +'<div style="display:flex;gap:8px;justify-content:flex-end"><button data-v="0" style="min-height:40px;padding:6px 14px;border-radius:8px;border:1px solid var(--bdr);background:var(--sur);font-family:inherit;font-weight:600;cursor:pointer">Cancel</button>'
      +'<button data-v="1" id="ask-ok" style="min-height:40px;padding:6px 14px;border-radius:8px;border:none;background:var(--danger);color:#fff;font-family:inherit;font-weight:700;cursor:pointer">'+esc(okLabel||'OK')+'</button></div></div>';
    ov.addEventListener('click',e=>{ const b=e.target.closest('button'); if(b){ ov.remove(); resolve(b.dataset.v==='1'); } else if(e.target===ov){ ov.remove(); resolve(false); } });
    document.body.appendChild(ov);
  });
}
function canClearDay(){ return noticeEditor||selectedDate===todayStr(); }
async function clearAll(dept,classCode){
  if(!canClearDay()){ toast('Only today\'s marks can be cleared'); return; }
  const ids=getClassStudents(dept,classCode).filter(s=>!swAwayOn(s.id,classCode,selectedDate)).map(s=>s.id);
  const recs=todayRecords.filter(r=>ids.includes(r.student_id)&&r.dept===dept&&(r.session??0)===currentSession&&r.class_code===classCode);
  if(!recs.length){ toast('Nothing to clear'); return; }
  const sess=dept==='ATC'?(currentSession===2?' · Lesson':' · H/W'):'';
  if(!(await askOk('Clear all '+recs.length+' marks?',classCode+sess+' · '+fmtDate(selectedDate)+'. Everyone goes back to not marked. This cannot be undone.','Clear all'))) return;   /* v33 · 页面上的确认框（有些手机 / 视窗会挡浏览器的确认框） */
  const scrollY=window.scrollY;
  try{
    const{data,error}=await _sb.from('attendance').delete()
      .eq('date',selectedDate).eq('dept',dept).eq('session',currentSession).eq('class_code',classCode)
      .in('student_id',recs.map(r=>r.student_id)).select('student_id');
    if(error) throw error;
    const gone=new Set((data||[]).map(r=>r.student_id));
    todayRecords=todayRecords.filter(r=>!(gone.has(r.student_id)&&r.dept===dept&&(r.session??0)===currentSession&&r.class_code===classCode));
    renderMark(); window.scrollTo(0,scrollY);
    if(gone.size===recs.length){ document.getElementById('last-saved').textContent='Saved '+fmtTime(); toast('✓ Cleared '+gone.size); }
    else toast('⚠ Cleared '+gone.size+' of '+recs.length+' — refresh the page and check',6000);
  }catch(e){ console.error('Clear failed:',e); toast('✕ Clear failed — nothing changed',5000); }
}

async function markAll(dept,classCode,status){
  const scrollY=window.scrollY;
  const openIds=[...document.querySelectorAll('.class-body.open')].map(el=>el.id);
  const _all=getClassStudents(dept,classCode).filter(s=>!swAwayOn(s.id,classCode,selectedDate));   /* v19 · 换走的不点，免得盖掉他在来访班的纪录 */
  /* v30 · All ✓ 只补「还没点」的孩子，老师已经点好的不动。
     v33 · 还没点的孩子照这个顺序决定记什么（Owner 10-22「在对应的格子里标记上」）：
       1 家长请假通知 → 照通知的原因记缺席（MC → MC）
       2 ATC 功课班、家长说 3:00 或以后才到 → 缺席（Late arrival HH:MM (notified)）
       3 家长说晚到（其他）→ 不点，等孩子到了老师按 Late
       4 固定例外 → 照例外记：不来 = 缺席、晚到 = Late（时间照例外；功课班 3:00 后 = 缺席）、早走 = Early
       5 其他 → Present
     记错了老师照样一颗一颗改（孩子其实来了就按 ✓）。 */
  const _dowA=new Date(selectedDate+'T12:00:00').getDay();
  const hm=t=>t?String(t).slice(0,5):'';
  const plan=[]; let nNt=0,nPre=0,nLate=0,nRule=0,nSome=0;
  for(const s of _all){
    if(getStatus(s.id,dept,currentSession)!=='unmarked') continue;
    const nt=noticeFor(s.id,dept,currentSession);
    if(nt){ const p=(NT_REASON[nt.reason_code]||NT_REASON.notified_no_reason).pick; plan.push([s,p.status,p.note]); nNt++; continue; }
    const la=noticeOf(s.id,dept,currentSession,'late_arrival');
    if(la){ const t=ntHmT(la.expected_time);
      if(dept==='ATC'&&currentSession===1&&t>='15:00'){ plan.push([s,'absent','Absent: Other — Late arrival '+t+' (notified)']); nPre++; }
      else nLate++;
      continue; }
    const rule=getRule(s.id,dept,_dowA,currentSession,selectedDate);
    if(rule&&awIsSometimes(rule)){ nSome++; continue; }   /* 「Sometimes」不一定：留给老师 */
    if(rule){ const why=String(rule.reason||'').trim()||'Weekly exception', t=hm(rule.from_time);
      if(rule.rule_type==='absent') plan.push([s,'absent','Absent: Other — '+why+' (weekly exception)']);
      else if(rule.rule_type==='late'){
        if(dept==='ATC'&&currentSession===1&&t&&t>='15:00') plan.push([s,'absent','Arrived '+t+' (3:00 or later = H/W absent) (weekly exception)']);
        else plan.push([s,'late',(t?'Late: '+t+' · ':'Late: ')+why+' (weekly exception)']);
      }
      else if(rule.rule_type==='early_leave') plan.push([s,'early_leave','Early: '+(t?t+' ':'')+why+' (weekly exception)']);
      else plan.push([s,status,null]);
      nRule++; continue; }
    plan.push([s,status,null]);
  }
  for(const [s,st,note] of plan){
    const existing=todayRecords.findIndex(r=>r.student_id===s.id&&r.dept===dept&&(r.session??0)===currentSession);
    if(existing>=0){ todayRecords[existing].status=st; todayRecords[existing].note=note; }
    else todayRecords.push({date:selectedDate,student_id:s.id,student_name:s.name,dept,class_code:classCode,status:st,note,marked_by:userEmail,session:currentSession});
  }
  renderMark();
  openIds.forEach(id=>{const el=document.getElementById(id);if(el)el.classList.add('open');});
  window.scrollTo(0,scrollY);
  const rows=plan.map(([s,st,note])=>({
    date:selectedDate,student_id:s.id,student_name:s.name,
    dept,class_code:classCode,status:st,note,marked_by:userEmail,
    session:currentSession,
    updated_at:new Date().toISOString()
  }));
  const _info=[nNt+nPre?(nNt+nPre)+' absent as the parent told the office':'',nRule?nRule+' as the weekly exception says':''].filter(Boolean).join(' · ');
  const _left=[nLate?nLate+' arriving late — tap Late when they come':'',nSome?nSome+' with a “sometimes” exception — mark them yourself':''].filter(Boolean).join(' · ');
  if(!rows.length){ toast(_left?('Nothing to mark · '+_left):'Everyone is already marked',4500); return; }
  try{
    const{error}=await _sb.from('attendance').upsert(rows,{onConflict:'date,student_id,dept,session',ignoreDuplicates:true});   /* v33 · 别的手机刚点过的不盖 */
    if(error){ console.error('Batch save failed:',error); toast('✕ Save failed'); }
    else { document.getElementById('last-saved').textContent='Saved '+fmtTime(); toast('✓ Marked '+rows.length+(_info?' · '+_info:'')+(_left?' · '+_left:''),(_info||_left)?5000:undefined); }
  }catch(e){console.error('Batch error:',e);toast('✕ Save error');}
}

// MONTHLY VIEW
// ═══════════════════════════════════════
let monthlyDept='SRK';
let monthlyCat='';
let monthlyClass='';
let monthlyMonth=todayStr().slice(0,7); // YYYY-MM
let monthlySession=0;
let _monthlyTok=0;   /* v28 */   // 0=single(SRK/GAK/SRT), 1=ATC功课班, 2=ATC上课班 — D-A35

async function renderMonthly(){
  const el=document.getElementById('monthly-content');
  const classes=getDeptClasses(monthlyDept,false);
  const cats=[...new Set(classes.map(c=>extractCat(c)))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  if(!monthlyCat||!cats.includes(monthlyCat)) monthlyCat=cats[0]||'';
  const filteredClasses=classes.filter(c=>extractCat(c)===monthlyCat);
  if(!monthlyClass||!filteredClasses.includes(monthlyClass)) monthlyClass=filteredClasses[0]||'';

  // Dept tabs
  let h=`<div class="dept-tabs" style="margin-bottom:10px">`;
  DEPTS.forEach(d=>{h+=`<button class="dept-tab${d===monthlyDept?' on':''}" data-dept="${d}" onclick="monthlyDept='${d}';monthlyCat='';monthlyClass='';monthlySession=(('${d}')==='ATC'?1:0);renderMonthly()">${d}</button>`;});
  h+=`</div>`;
  // Category tabs
  h+=`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">`;
  cats.forEach(cat=>{
    const isOn=cat===monthlyCat;
    h+=`<button style="padding:5px 14px;border-radius:8px;border:1px solid ${isOn?'transparent':'var(--bdr)'};background:${isOn?'var(--mut)':'var(--sur)'};color:${isOn?'#fff':'var(--txt)'};font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;text-transform:uppercase" onclick="monthlyCat='${cat}';monthlyClass='';renderMonthly()">${cat}</button>`;
  });
  h+=`</div>`;
  // Class tabs + month picker + print
  h+=`<div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:14px">`;
  filteredClasses.forEach(code=>{
    const isOn=code===monthlyClass;
    const sn=shortClassName(code);
    h+=`<button style="padding:5px 12px;border-radius:8px;border:1px solid ${isOn?'transparent':'var(--bdr)'};background:${isOn?'var(--txt)':'var(--sur)'};color:${isOn?'#fff':'var(--txt)'};font-size:12px;font-weight:600;cursor:pointer;font-family:inherit" onclick="monthlyClass='${code}';renderMonthly()">${sn}</button>`;
  });
  h+=`<input type="month" class="date-input" value="${monthlyMonth}" onchange="monthlyMonth=this.value;renderMonthly()" style="margin-left:auto">`;
  h+=`<button onclick="printMonthly()" style="padding:8px 14px;border-radius:8px;border:none;background:var(--layer);color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">🖨 Print</button>`;
  h+=`</div>`;

  // ATC session tabs — mirrors Mark page pattern (D-A35)
  if(monthlyDept==='ATC'){
    if(monthlySession===0) monthlySession=1;
    h+=`<div style="display:flex;gap:6px;margin-bottom:14px">
      <button class="dept-tab${monthlySession===1?' on':''}" style="${monthlySession===1?'background:var(--d-atc);color:#fff;border-color:transparent':''}" onclick="monthlySession=1;renderMonthly()">S1: Homework</button>
      <button class="dept-tab${monthlySession===2?' on':''}" style="${monthlySession===2?'background:var(--d-atc);color:#fff;border-color:transparent':''}" onclick="monthlySession=2;renderMonthly()">S2: Lesson</button>
    </div>`;
  }else{ monthlySession=0; }

  if(!monthlyClass){
    h+=`<div class="card" style="text-align:center;color:var(--mut);padding:24px">Select a class</div>`;
    el.innerHTML=h;return;
  }

  // Get students — time overlap: visible if membership overlaps this month
  const [yr,mo]=monthlyMonth.split('-').map(Number);
  const daysInMonth=new Date(yr,mo,0).getDate();
  const dayNames=['SU','MO','TU','WE','TH','FR','SA'];
  const monthStart=monthlyMonth+'-01';
  const monthEnd=monthlyMonth+'-'+String(daysInMonth).padStart(2,'0');
  const activeMems=allMemberships.filter(m=>
    m.dept===monthlyDept&&m.class_code===monthlyClass&&
    m.start_date<=monthEnd&&
    (m.end_date==null||m.end_date>=monthStart)
  );
  // Deduplicate students and get their membership info for this class
  const stuMap=new Map();
  activeMems.forEach(m=>{
    const stu=allStudents.find(s=>s.id===m.student_id);
    if(stu&&!stuMap.has(stu.id)) stuMap.set(stu.id,{...stu,mem:m});
  });
  const students=[...stuMap.values()].sort((a,b)=>(a.mem.num??999)-(b.mem.num??999));

  // Fetch month records
  const startDate=monthlyMonth+'-01';
  const endDate=monthlyMonth+'-'+String(daysInMonth).padStart(2,'0');
  let monthRecs; const _tok=++_monthlyTok;
  try{
    monthRecs=await _fetchAll(()=>_sb.from('attendance').select('*')
      .gte('date',startDate).lte('date',endDate)
      .eq('dept',monthlyDept)   /* v18 · 不再只抓本班 class_code，下面用 attClassOf 判断 */
      .order('date').order('session').order('id'),'Monthly');   /* v28 · 分批抓到完（以前超过 1000 行就截掉月底） */
  }catch(e){ console.error(e); if(_tok===_monthlyTok) el.innerHTML=h+_loadFailHTML(e); return; }
  if(_tok!==_monthlyTok) return;   /* v28 · 分批要多等几下：老师已经换了班 / 月份，这一份就不画，免得旧的盖掉新的 */
  // D-A35: ATC 一天两条 (session 1/2)。不按 session 过滤 = recMap 后条覆盖前条,
  // Rate 分母翻倍, 显示哪一节不可预测。一刀切好 recMap/Rate/Marked by 三处。
  monthRecs=(monthRecs||[]).filter(r=>!r.voided_at);   /* v33 */
  const recs=(monthRecs||[]).filter(r=>(r.session??0)===monthlySession&&attClassOf(r)===monthlyClass);
  /* v26 · 双班学生（例：一个人同时在 LV7.SAT.NN 与 LV6.FRI.PM）：E-Class 一天只记一条、算在一班。
     在另一班的月报照样显示灰色 E，让两班老师都看得到；不进本班出席率。 */
  const eElse={};
  (monthRecs||[]).filter(r=>(r.session??0)===monthlySession&&attClassOf(r)!==monthlyClass&&eMark(r)).forEach(r=>{
    (eElse[r.student_id]=eElse[r.student_id]||{})[parseInt(r.date.split('-')[2])]=r;
  });

  /* v33 · 这个月每个上课日的家长请假通知（点名页用的同一个函式；读不到就不显示，不影响点名纪录） */
  try{
    const _days=[]; for(let d=1;d<=daysInMonth;d++){ const ds=monthlyMonth+'-'+String(d).padStart(2,'0'); if(isClassDay(monthlyDept,monthlyClass,ds)&&!(noticeCache[ds+'|'+monthlyDept]&&noticeCache[ds+'|'+monthlyDept].ok)) _days.push(ds); }
    if(noticeEditor||noticeScope[monthlyDept]!==false) await Promise.all(_days.map(ds=>loadNotices(ds,monthlyDept)));
  }catch(e){ console.warn('[v33] month notices',e); }
  if(_tok!==_monthlyTok) return;
  /* v33 · SRT 补课那天的纪录（可能在别的月份）→ 缺的那天算不算补回来 */
  const _vis={};
  if(monthlyDept==='SRT'){
    const mus=allSwaps.filter(w=>w.status==='active'&&w.kind==='replacement'&&w.from_class===monthlyClass&&w.from_date&&w.from_date.slice(0,7)===monthlyMonth);
    if(mus.length){ try{ const{data:vr}=await _sb.from('attendance').select('student_id,date,status,voided_at').in('student_id',[...new Set(mus.map(w=>w.student_id))]).in('date',[...new Set(mus.map(w=>w.to_date))]).eq('dept','SRT');
      (vr||[]).filter(r=>!r.voided_at).forEach(r=>{ _vis[r.student_id+'|'+r.date]=r.status; }); }catch(e){} }
    if(_tok!==_monthlyTok) return;
  }
  // Build lookup: recMap[studentId][day] = {status, note, marked_by}
  const recMap={};
  recs.forEach(r=>{
    const day=parseInt(r.date.split('-')[2]);
    (recMap[r.student_id]=recMap[r.student_id]||{})[day]={status:r.status,note:r.note||'',marked_by:r.marked_by||'',other:r.class_code!==monthlyClass?r.class_code:''};   /* v18 · other = 在别班名单点的 */
  });

  const ICON={present:'✓',absent:'✕',late:'⏰',early_leave:'🚪',mc:'🤒'};
  const BG={present:'#E1F5EE',absent:'#FCEBEB',late:'#FFF8E1',early_leave:'#FFF0E6',mc:'#EEF2F7'};
  function lateTime(note){ const m=(note||'').match(/Late:\s*(\d{1,2}:\d{2})/); return m?m[1]:''; }

  h+=`<div id="monthly-grid" style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:11px;background:var(--sur);border-radius:10px;overflow:hidden">
    <thead><tr style="background:var(--sur2)">
      <th style="padding:8px;text-align:left;min-width:140px;position:sticky;left:0;background:var(--sur2);z-index:1">Student (${students.length})</th>`;
  for(let d=1;d<=daysInMonth;d++){
    const dow=new Date(yr,mo-1,d).getDay();
    const isWknd=dow===0||dow===6;
    h+=`<th style="padding:4px 2px;text-align:center;min-width:28px;font-size:9px;${isWknd?'color:var(--danger);':''}"><div>${d}</div><div style="font-size:8px">${dayNames[dow]}</div></th>`;
  }
  /* v33 · 出席率：ATC 两节各一格，其他部门一格 */
  const _rCols=monthlyDept==='ATC'?[[1,'H/W'],[2,'Lesson']]:[[0,'Rate']];
  const _recMapS={};
  _rCols.forEach(([ss])=>{ const m={}; (monthRecs||[]).filter(r=>(r.session??0)===ss&&attClassOf(r)===monthlyClass).forEach(r=>{ (m[r.student_id]=m[r.student_id]||{})[parseInt(r.date.split('-')[2])]={status:r.status,note:r.note||'',other:r.class_code!==monthlyClass?r.class_code:''}; }); _recMapS[ss]=m; });
  const _rTot={}; _rCols.forEach(([ss])=>_rTot[ss]={att:0,abs:0,unm:0});
  _rCols.forEach(([ss,lb])=>{ h+=`<th style="padding:4px 6px;text-align:center;font-size:9px;border-left:.5px solid var(--bdr);white-space:nowrap${ss&&ss===monthlySession?';text-decoration:underline':''}">${lb}<div style="font-size:8px;font-weight:400">rate</div></th>`; });
  h+=`</tr></thead><tbody>`;

  // Student rows
  students.forEach(s=>{
    const mem=s.mem;
    const transferred=mem.end_date!=null;
    const transferTarget=transferred?getTransferTarget(s.id,monthlyDept,mem.end_date):null;
    const pzMonth=mem.pause_from&&mem.pause_from<=monthEnd&&(!mem.pause_to||mem.pause_to>monthStart);   /* v16 */
    const nameLabel=s.name+(pzMonth?'<span class="stu-paused" title="Paused from '+_escHtml(mem.pause_from)+(mem.pause_to?' · back on '+_escHtml(mem.pause_to):'')+'">On leave</span>':'')+(transferred?' <span style="font-size:9px;color:var(--hint)">↗ '+( transferTarget?transferTarget.class_code:'Moved')+'</span>':'');
    h+=`<tr><td style="padding:6px 8px;border-bottom:.5px solid var(--bdr);white-space:nowrap;position:sticky;left:0;background:var(--sur);z-index:1;font-size:11px">${nameLabel}</td>`;
    for(let d=1;d<=daysInMonth;d++){
      const dayStr=monthlyMonth+'-'+String(d).padStart(2,'0');
      const hol=getHoliday(dayStr,monthlyDept);
      // Check if this day is outside membership range
      const beforeStart=dayStr<mem.start_date;
      const afterEnd=transferred&&dayStr>mem.end_date;
      if(hol){
        const r=(recMap[s.id]||{})[d];
        const extra=hasExtraClass(dayStr,monthlyDept);
        if(extra&&r){
          const icon=r.status==='late'&&lateTime(r.note)?lateTime(r.note):attMark(r,ICON);
          h+=`<td style="padding:2px;text-align:center;border-bottom:.5px solid var(--bdr);background:${BG[r.status]||''};font-size:${String(icon).startsWith('E·')?'8px':'10px'}" title="${hol.name} (${extra.name})">${icon}</td>`;
        }else{
          h+=`<td style="padding:2px;text-align:center;border-bottom:.5px solid var(--bdr);background:#FFF8E1;color:var(--warn);font-size:9px;font-weight:600" title="${hol.name}">H</td>`;
        }
      }else if(transferred&&dayStr===mem.end_date){
        // Transfer day: show attendance record + transfer marker below
        const r=(recMap[s.id]||{})[d];
        const targetName=transferTarget?transferTarget.class_code.replace(/^[A-Z]+_/,''):'Moved';
        const attIcon=r?(r.status==='late'&&lateTime(r.note)?lateTime(r.note):attMark(r,ICON)):'·';
        const attBg=r?BG[r.status]||'':'';
        h+=`<td style="padding:1px;text-align:center;border-bottom:.5px solid var(--bdr);background:${attBg};line-height:1.1" title="Class change → ${transferTarget?transferTarget.class_code:'—'}">
          <div style="font-size:10px">${attIcon}</div>
          <div style="font-size:6px;color:#7870CC;font-weight:700">→${targetName}</div>
        </td>`;
      }else if(beforeStart||afterEnd){
        h+=`<td style="padding:2px;text-align:center;border-bottom:.5px solid var(--bdr);background:#f5f5f5;color:var(--hint);font-size:9px">–</td>`;
      }else{
        const r=(recMap[s.id]||{})[d];
        if(!r&&memPausedOn(mem,dayStr)){   /* v16 · 请假期间没点 → 灰色 L，不算缺席 */
          h+=`<td style="padding:2px;text-align:center;border-bottom:.5px solid var(--bdr);background:#f0eee8;color:var(--mut);font-size:9px" title="On leave">L</td>`;
        }else if(!r&&(eElse[s.id]||{})[d]){   /* v26 */
          const er=eElse[s.id][d];
          h+=`<td style="padding:2px;text-align:center;border-bottom:.5px solid var(--bdr);background:#f0eee8;color:var(--mut);font-size:8px;font-weight:600" title="${_escHtml('Counted in '+swCls(attClassOf(er)))}">${er.status==='late'?'⏰':'✓'}</td>`;
        }else if(!r&&swAwayOn(s.id,monthlyClass,dayStr)){   /* v19 · 换到别的日子上，这天没纪录 */
          const aw=swAwayOn(s.id,monthlyClass,dayStr);
          h+=`<td style="padding:2px;text-align:center;border-bottom:.5px solid var(--bdr);background:#F3F1FB;color:#7870CC;font-size:9px;font-weight:600" title="${_escHtml('Temp slot → '+aw.to_date+' '+swCls(aw.to_class))}">Temp</td>`;
        }else if(r){
          const display=r.status==='late'&&lateTime(r.note)?lateTime(r.note):attMark(r,ICON)||'·';
          const _sw=swMarkFor(s.id,monthlyClass,dayStr,r.status);   /* v19 · 补 / 换 / 已补 */
          if(_sw){ r.other=r.other||''; }
          const oth=(r.other?' · marked in '+r.other:'')+(_sw?' · '+_sw.t:'');   /* v18 / v19 */
          h+=`<td style="padding:2px;text-align:center;border-bottom:.5px solid var(--bdr);background:${BG[r.status]||''};font-size:${(r.status==='late'||display==='Hol'||display==='SB'||String(display).startsWith('E·'))?'8px':'11px'};${(r.other||_sw)?'box-shadow:inset 0 -2px 0 #7870CC':''};line-height:1.05" title="${_escHtml((r.note||r.status)+oth)}">${display}${_sw?'<div style="font-size:7px;color:#7870CC;font-weight:700">'+_sw.k+'</div>':''}</td>`;
        }else if(noticeOn(s.id,monthlyDept,monthlySession,dayStr)&&isClassDay(monthlyDept,monthlyClass,dayStr)){   /* v33 · 家长说不来、还没点 */
          const _n=noticeOn(s.id,monthlyDept,monthlySession,dayStr);
          h+=`<td style="padding:2px;text-align:center;border-bottom:.5px solid var(--bdr);background:#FFF4F4;color:var(--danger);font-size:9px;font-weight:700;outline:1px dashed #E07070;outline-offset:-3px" title="${_escHtml('Parent told the office: '+((NT_REASON[_n.reason_code]||{label:'Absent'}).label)+' · not marked yet · counted as absent')}">N</td>`;
        }else{
          h+=`<td style="padding:2px;text-align:center;border-bottom:.5px solid var(--bdr);color:var(--hint)">·</td>`;
        }
      }
    }
    _rCols.forEach(([ss])=>{ const x=rateFor(s,mem,monthlyDept,monthlyClass,ss,(_recMapS[ss][s.id]||{}),monthlyMonth,daysInMonth,ss===monthlySession?eElse[s.id]:null,_vis);
      _rTot[ss].att+=x.att; _rTot[ss].abs+=x.abs; _rTot[ss].unm+=x.unm; h+=rateCell(x); });   /* v33 */
    h+=`</tr>`;
  });

  // Rate row
  h+=`<tr style="background:var(--sur2);font-weight:600"><td style="padding:6px 8px;position:sticky;left:0;background:var(--sur2);z-index:1;font-size:10px">Rate</td>`;
  for(let d=1;d<=daysInMonth;d++){
    const dayStr=monthlyMonth+'-'+String(d).padStart(2,'0');
    const hol=getHoliday(dayStr,monthlyDept);
    if(hol){
      const dayRecs=recs.filter(r=>parseInt(r.date.split('-')[2])===d);
      const extra=hasExtraClass(dayStr,monthlyDept);
      if(extra&&dayRecs.length){
        const present=dayRecs.filter(r=>r.status==='present'||r.status==='late'||r.status==='early_leave').length;
        const pct=Math.round(present/dayRecs.length*100);
        h+=`<td style="padding:2px;text-align:center;font-size:9px;color:${pct>=90?'var(--ok)':pct>=70?'var(--warn)':'var(--danger)'};background:#FFF8E1" title="${hol.name} (${extra.name})">${pct}%</td>`;
      }else{
        h+=`<td style="padding:2px;text-align:center;font-size:9px;color:var(--warn);background:#FFF8E1" title="${hol.name}">H</td>`;
      }
    }else{
      const dayRecs=recs.filter(r=>parseInt(r.date.split('-')[2])===d);
      if(dayRecs.length){
        const present=dayRecs.filter(r=>r.status==='present'||r.status==='late'||r.status==='early_leave').length;
        const pct=Math.round(present/dayRecs.length*100);
        h+=`<td style="padding:2px;text-align:center;font-size:9px;color:${pct>=90?'var(--ok)':pct>=70?'var(--warn)':'var(--danger)'}">${pct}%</td>`;
      }else{
        h+=`<td style="padding:2px;text-align:center;font-size:9px;color:var(--hint)">–</td>`;
      }
    }
  }
  _rCols.forEach(([ss])=>{ const t=_rTot[ss], n=t.att+t.abs; h+=rateCell({att:t.att,abs:t.abs,unm:t.unm,pct:n?Math.round(t.att/n*100):null}); });   /* v33 · 全班 */
  h+=`</tr>`;

  // Marked by row
  h+=`<tr style="background:var(--sur2)"><td style="padding:6px 8px;position:sticky;left:0;background:var(--sur2);z-index:1;font-size:10px;color:var(--mut)">Marked by</td>`;
  for(let d=1;d<=daysInMonth;d++){
    const dayRecs=recs.filter(r=>parseInt(r.date.split('-')[2])===d);
    const markers=[...new Set(dayRecs.map(r=>r.marked_by).filter(Boolean))];
    const short=markers.map(e=>markerNames[e]||e.split('@')[0].slice(0,3).toUpperCase()).join(',');
    h+=`<td style="padding:2px;text-align:center;font-size:7px;color:var(--mut)" title="${markers.join(', ')}">${short||'–'}</td>`;
  }
  _rCols.forEach(()=>{ h+=`<td style="border-left:.5px solid var(--bdr)"></td>`; });
  h+=`</tr>`;

  h+=`</tbody></table></div>`;
  /* v33 · 这个部门的出席率怎么算 */
  h+=`<details style="margin-top:10px;font-size:12px;color:var(--mut)"><summary style="cursor:pointer;font-weight:600;color:var(--txt)">How the ${monthlyDept} rate is counted</summary><ul style="margin:6px 0 0 18px;line-height:1.5">${RATE_RULES[monthlyDept].concat(RATE_RULES.ALL).map(t=>'<li>'+t+'</li>').join('')}<li>N in a box = the parent told the office the child is absent, and the teacher has not marked it yet.</li></ul></details>`;

  el.innerHTML=h;
}

      <div id="stu-dd-${i}" style="position:absolute;top:100%;left:0;right:0;background:var(--sur);border:1px solid var(--bdr);border-radius:0 0 8px 8px;z-index:10;display:none;max-height:200px;overflow-y:auto"></div>

let trackerStudents=[{id:'',name:''},{id:'',name:''},{id:'',name:''}];
let trackerFrom=(()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01';})();
let trackerTo=todayStr();
let searchTimeout;
let searchIdx=0;

function searchStudentMulti(query,idx){
  searchIdx=idx;
  clearTimeout(searchTimeout);
  const el=document.getElementById('stu-dd-'+idx);
  if(!el) return;
  if(query.length<2){el.style.display='none';return;}
  searchTimeout=setTimeout(()=>{
    const q=query.toLowerCase();
    const matches=allStudents.filter(s=>s.name.toLowerCase().includes(q)||(s.name_cn||'').includes(q)).slice(0,5);
    if(!matches.length){el.innerHTML='<div style="padding:8px;font-size:11px;color:var(--mut)">No match</div>';el.style.display='block';return;}
    let h='';
    matches.forEach(s=>{
      h+=`<div style="padding:6px 8px;border-bottom:.5px solid var(--bdr);cursor:pointer;font-size:12px" onclick="selectTrackerStudent('${s.id}','${s.name}',${idx})">${s.name}${s.name_cn?' <span style="color:var(--mut)">'+s.name_cn+'</span>':''}</div>`;
    });
    el.innerHTML=h;
    el.style.display='block';
  },300);
}

function selectTrackerStudent(id,name,idx){
  trackerStudents[idx]={id,name};
  document.querySelectorAll('.stu-input')[idx].value=name;
  document.getElementById('stu-dd-'+idx).style.display='none';
  loadTrackerMatrix();
}

async function loadTrackerMatrix(){
  trackerFrom=document.getElementById('tk-from')?.value||trackerFrom;
  trackerTo=document.getElementById('tk-to')?.value||trackerTo;
  const el=document.getElementById('tracker-matrix');
  if(!el) return;
  const active=trackerStudents.filter(s=>s.id);
  if(!active.length){el.innerHTML='';return;}

  // Build date columns
  const from=new Date(trackerFrom+'T12:00:00');
  const to=new Date(trackerTo+'T12:00:00');
  const days=[];
  const dayNames=['SU','MO','TU','WE','TH','FR','SA'];
  for(let d=new Date(from);d<=to;d.setDate(d.getDate()+1)){
    days.push({date:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),
      day:d.getDate(),dow:d.getDay(),label:dayNames[d.getDay()]});
  }
  if(days.length>31) days.length=31;

  // Fetch all records for selected students in range
  const ids=active.map(s=>s.id);
  let recs;
  try{ recs=await _fetchAll(()=>_sb.from('attendance').select('*').in('student_id',ids).gte('date',trackerFrom).lte('date',trackerTo).order('id'),'Tracker'); }   /* v28 */
  catch(e){ console.error(e); el.innerHTML=_loadFailHTML(e); return; }
  recs=(recs||[]).filter(r=>!r.voided_at);   /* v33 */

  const ICON={present:'✓',absent:'✕',late:'⏰',early_leave:'🚪',mc:'🤒'};
  const BG={present:'#E1F5EE',absent:'#FCEBEB',late:'#FFF8E1',early_leave:'#FFF0E6',mc:'#EEF2F7'};
  function lateTime(note){const m=(note||'').match(/Late:\s*(\d{1,2}:\d{2})/);return m?m[1]:'';}

  // Stats
  const total=recs.length;
  const present=recs.filter(r=>r.status==='present'||r.status==='early_leave').length;   /* v33 · 早走算有到（跟出席率规则一致） */
  const late=recs.filter(r=>r.status==='late').length;
  const absent=recs.filter(r=>r.status==='absent').length;
  const mc=recs.filter(r=>r.status==='mc').length;
  const rate=total?Math.round((present+late)/total*100):0;

  let h=`<div class="card">
    <div style="display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap;font-size:12px">
      <span>Records: <strong>${total}</strong></span>
      <span style="color:${rate>=90?'var(--ok)':rate>=70?'var(--warn)':'var(--danger)'}">Rate: <strong>${rate}%</strong></span>
      <span style="color:var(--ok)">✓${present}</span><span style="color:var(--danger)">✕${absent}</span>
      <span style="color:var(--warn)">⏰${late}</span><span style="color:var(--info)">🤒${mc}</span>
    </div>
    <div id="tracker-grid" style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:11px">
      <thead><tr style="background:var(--sur2)">
        <th style="padding:6px 8px;text-align:left;min-width:140px;position:sticky;left:0;background:var(--sur2);z-index:1">Student / Class</th>`;
  days.forEach(d=>{
    const isWknd=d.dow===0||d.dow===6;
    h+=`<th style="padding:3px 2px;text-align:center;min-width:28px;font-size:9px;${isWknd?'color:var(--danger);':''}"><div>${d.day}</div><div style="font-size:8px">${d.label}</div></th>`;
  });
  h+=`</tr></thead><tbody>`;

  // Rows for each student × each membership
  active.forEach(stu=>{
    const mems=allMemberships.filter(m=>m.student_id===stu.id).sort((a,b)=>a.start_date>b.start_date?1:-1);
    const stuRecs=recs.filter(r=>r.student_id===stu.id);

    // Show transfer summary if multiple memberships in same dept
    const transfers=mems.filter(m=>m.end_date!=null);
    if(transfers.length>0){
      let transferHtml='';
      transfers.forEach(t=>{
        const target=getTransferTarget(stu.id,t.dept,t.end_date);
        if(target){
          transferHtml+=`<span style="font-size:10px;color:#7870CC;margin-right:10px">🔄 ${t.end_date}: <span style="color:${DEPT_COLORS[t.dept]}">${t.dept}</span> ${t.class_code} → ${target.class_code}</span>`;
        }
      });
      if(transferHtml){
        h+=`<tr><td colspan="${days.length+1}" style="padding:4px 8px;border-bottom:.5px solid var(--bdr);background:#F9F5FF">${transferHtml}</td></tr>`;
      }
    }

    mems.forEach((mem,mi)=>{
      const recByDate={};
      stuRecs.filter(r=>r.dept===mem.dept&&attClassOf(r)===mem.class_code).forEach(r=>{recByDate[r.date]=r;});   /* v18 */
      const ended=mem.end_date!=null;
      h+=`<tr><td style="padding:5px 8px;border-bottom:.5px solid var(--bdr);position:sticky;left:0;background:var(--sur);z-index:1;font-size:10px;white-space:nowrap">
        ${mi===0?'<strong>'+stu.name+'</strong><br>':''}
        <span style="color:${DEPT_COLORS[mem.dept]}">${mem.dept}</span> ${mem.class_code}${ended?' <span style="font-size:8px;color:var(--hint)">(~'+mem.end_date+')</span>':''}
      </td>`;
      days.forEach(d=>{
        const r=recByDate[d.date];
        if(r){
          const display=r.status==='late'&&lateTime(r.note)?lateTime(r.note):attMark(r,ICON);
          h+=`<td style="padding:2px;text-align:center;border-bottom:.5px solid var(--bdr);background:${BG[r.status]||''};font-size:${(r.status==='late'||display==='Hol'||display==='SB'||String(display).startsWith('E·'))?'8px':'11px'}" title="${r.note||r.status}">${display}</td>`;
        }else{
          h+=`<td style="padding:2px;text-align:center;border-bottom:.5px solid var(--bdr);color:var(--hint)">·</td>`;
        }
      });
      h+=`</tr>`;
    });
    // Separator between students
    if(active.indexOf(stu)<active.length-1){
      h+=`<tr><td colspan="${days.length+1}" style="height:4px;background:var(--sur2)"></td></tr>`;
    }
  });

  h+=`</tbody></table></div></div>`;
  el.innerHTML=h;
}

/* ── v14 · 行政自己维护清单，不必找人改程式 ── */
function fuRenderAdmin(){
