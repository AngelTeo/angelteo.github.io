<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LoveGo v53 · SRK Registry UAT</title><style>body{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;margin:24px;line-height:1.45;color:#111}h1{font-size:22px}pre{white-space:pre-wrap;background:#f5f5f5;padding:14px;border-radius:10px}table{border-collapse:collapse;width:100%;margin-top:16px}th,td{border:1px solid #ddd;padding:7px 8px;text-align:left;font-size:13px}th{background:#f2f2f2}.ok{font-weight:700}.bad{font-weight:700}button{padding:8px 12px;margin-right:8px}</style></head><body><h1>LoveGo v53 · SRK Evidence Registry UAT</h1><p>只验证 Registry；不会连接 Supabase，也不会建立 Review / Assignment。</p><div><button onclick="run(3)">AGE 3</button><button onclick="run(4)">AGE 4</button><button onclick="run(5)">AGE 5</button><button onclick="run(6)">AGE 6</button></div><pre id="qc">Loading…</pre><div id="out"></div><script src="LoveGo_v53_srk_evidence_registry.js"></script><script>function esc(x){return String(x??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}function run(age){const R=window.LOVEGO_SRK_EVIDENCE_REGISTRY;if(!R){document.getElementById('qc').textContent='Registry not loaded';return}const q=R.validate();const rows=R.visibleRows({age});document.getElementById('qc').textContent=JSON.stringify({qc:q,meta:R.meta,age,visible_rows:rows.length},null,2);const by={};rows.forEach(r=>(by[r.indicator_id]??=[]).push(r));let h='<table><thead><tr><th>Indicator</th><th>Code</th><th>Teacher wording</th><th>Polarity</th><th>Support</th><th>Opportunity</th></tr></thead><tbody>';Object.keys(by).sort().forEach(ind=>by[ind].forEach(r=>{h+=`<tr><td>${esc(ind)}</td><td>${esc(r.behaviour_code)}</td><td>${esc(r.teacher_wording_zh)}</td><td>${esc(r.polarity)}</td><td>${esc(r.support_response_capture)}</td><td>${esc(r.opportunity_guard||'')}</td></tr>`}));h+='</tbody></table>';document.getElementById('out').innerHTML=h}setTimeout(()=>run(3),50);</script></body></html>
