<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const LOVEGO_TEACHER_FLOW_V33=[
  '学生','长期观察','生活片段','提交'
];
// Evidence consistency: a Domain marked insufficient cannot supply Strength/Growth indicators.
function validateInsufficientVsPriority(review){
  const insufficient=new Set(
    Object.entries(review?.domains||{})
      .filter(([,v])=>v?.insufficient_observation===true)
      .map(([code])=>code)
  );
  const refs=[...(review?.strength_refs||[]),...(review?.growth_refs||[])];
  const conflicts=refs.filter(r=>insufficient.has(r.domain_code));
  return {ok:conflicts.length===0,conflicts};
}
// Single submit-gate aggregator: keep complexity behind the UI.
function lovegoSubmitGateV22(review){
  const checks={
    domains:(typeof validateDomainCompletion==='function')?validateDomainCompletion(review):{ok:true},
    daily:(typeof validateDailyLifeGate==='function')?validateDailyLifeGate(review):{ok:true},
    consistency:{ok:true}
  };
  return {ok:Object.values(checks).every(x=>x?.ok!==false),checks};
}

function growthSupportRef(indicatorRef, supportCode, note=''){
 return {indicator_ref:indicatorRef,support_code:supportCode||null,note:String(note||'').trim()};
}

function validateStrengthGrowthCount(review){
 const s=review?.strength_refs||[], g=review?.growth_refs||[];
 return {ok:s.length>=1&&s.length<=3&&g.length>=1&&g.length<=3,strength_count:s.length,growth_count:g.length};
}

function strengthGrowthOverlap(review){
 const key=x=>[x.taxonomy_version||'',x.domain_code||'',x.indicator_code||''].join('|');
 const s=new Set((review?.strength_refs||[]).map(key));
 return (review?.growth_refs||[]).filter(x=>s.has(key(x)));
}
function validateStrengthGrowthOverlap(review){
 const overlap=strengthGrowthOverlap(review);
 return {ok:overlap.length===0 || !!String(review?.strength_growth_overlap_note||'').trim(), overlap};
}

function frameworkIndicatorRef(domainCode, indicatorCode, taxonomyVersion){
 return {taxonomy_version:taxonomyVersion||null,domain_code:domainCode,indicator_code:indicatorCode};
}

/* Strength/Growth choices are derived at runtime from the current department's locked Student Domains/Indicators. No parallel universal tag bank. */
function validateStructuredStrengthGrowth(review){
 const s=review?.strength_tags||[], g=review?.growth_tags||[];
 return {strength:Array.isArray(s)&&s.length>0,growth:Array.isArray(g)&&g.length>0};
}

function validateNarrativeGate(review){
 return {strength:!!String(review?.strength||'').trim(),growth:!!String(review?.growth||'').trim()};
}

function validateDailyStudentLife(review){
 const d=review?.daily_life||{};
 return ['routine','social','emotion','change'].some(k=>String(d[k]||'').trim().length>0);
}

function validateLoveGoDomainCompletion(review, applicableCodes){
  return (applicableCodes||[]).filter(code=>{const x=review?.domains?.[code]||{}; return !(x.insufficient_observation || (Array.isArray(x.obs)&&x.obs.length) || String(x.note||'').trim());});
}
