<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NoticeGo-Holiday v39</title>
<style>
:root{
  --acc:#5C1010; --grn:#0F6E56; --org:#854F0B; --red:#A32D2D; --pur:#534AB7;
  --sur:#ffffff; --sur2:#f7f6f2; --bdr:#e0ddd6;
  --txt:#1a1a1a; --mut:#888888; --hint:#bbbbbb;
  --srk:#185FA5; --gak:#0F6E56; --atc:#854F0B; --srt:#7030A0;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:var(--sur2);color:var(--txt);font-size:13px;line-height:1.4}

/* NAV */
.nav{background:#5C1010;border-bottom:.5px solid #3d0a0a;
  display:flex;align-items:center;padding:0 16px;position:sticky;top:0;z-index:50;
  overflow-x:auto;gap:0}
.nav-logo{font-size:13px;font-weight:600;padding:12px 14px 12px 0;
  border-right:.5px solid rgba(255,255,255,.2);margin-right:4px;white-space:nowrap;
  flex-shrink:0;color:#fff}
.ntab{padding:11px 14px;font-size:11px;color:rgba(255,255,255,.7);cursor:pointer;
  border:none;background:transparent;border-bottom:2.5px solid transparent;
  transition:all .15s;white-space:nowrap;flex-shrink:0;font-family:inherit}
.ntab:hover{color:#fff}
.ntab.on{color:#fff;border-bottom-color:#fff;font-weight:600}
.nav-r{margin-left:auto;display:flex;gap:5px;align-items:center;padding-left:10px;flex-shrink:0}

/* BUTTONS */
.btn{padding:5px 12px;border-radius:6px;border:.5px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.12);color:#fff;font-size:11px;cursor:pointer;
  font-family:inherit;transition:opacity .15s;white-space:nowrap}
.btn:hover{opacity:.85}
.btn-pri{background:#fff;color:#5C1010;border-color:#fff;font-weight:600}
.btn-plain{background:var(--sur);border:.5px solid var(--bdr);color:var(--txt);font-size:11px;
  padding:5px 12px;border-radius:6px;cursor:pointer;font-family:inherit}
.btn-plain:hover{background:var(--sur2)}
.btn-grn{background:var(--grn);color:#fff;border:none;font-weight:500;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:11px;font-family:inherit}
.btn-red{background:var(--red);color:#fff;border:none;padding:4px 10px;border-radius:5px;cursor:pointer;font-size:10px;font-family:inherit}

.saved{font-size:10px;color:var(--grn);margin-right:8px;display:none}

/* PAGES */
.page{display:none;padding:16px;max-width:1400px;margin:0 auto}
.page.on{display:block}

/* CARDS */
.card{background:var(--sur);border:.5px solid var(--bdr);border-radius:10px;
  padding:16px;margin-bottom:12px}
.card-hdr{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;flex-wrap:wrap;gap:8px}
.card-title{font-size:11px;font-weight:500;color:var(--mut);
  letter-spacing:.05em;text-transform:uppercase}

/* TABLES */
table.data{width:100%;border-collapse:collapse;font-size:12px}
table.data thead th{background:#2d2d2d;color:#fff;padding:9px 12px;text-align:left;
  font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  white-space:nowrap;position:sticky;top:0}
table.data tbody td{padding:8px 12px;border-bottom:.5px solid var(--bdr);vertical-align:middle}
table.data tbody tr:nth-child(even){background:var(--sur2)}
table.data tbody tr:hover{background:#FFF9E6}

/* INPUTS */
input[type=text],input[type=number],input[type=date],input[type=email],
input[type=tel],select,textarea{
  border:.5px solid var(--bdr);border-radius:6px;padding:6px 10px;
  font-size:12px;font-family:inherit;background:var(--sur);color:var(--txt);
  min-width:120px;box-sizing:border-box}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}

/* BADGES */
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;
  font-weight:600;white-space:nowrap}
.b-srk{background:#185FA520;color:#185FA5}
.b-gak{background:#0F6E5620;color:#0F6E56}
.b-atc{background:#854F0B20;color:#854F0B}
.b-srt{background:#7030A020;color:#7030A0}
.b-active{background:#E1F5EE;color:#0F6E56}
.b-inactive{background:#FCEBEB;color:#A32D2D}
.b-sensitive{background:#FFF3CD;color:#854F0B;border:.5px solid #ffc107}

/* SUB NAV */
.sub-nav{background:var(--sur);border-bottom:.5px solid var(--bdr);
  padding:0 16px;gap:2px;position:sticky;top:44px;z-index:49;
  display:flex;overflow-x:auto;align-items:center;min-height:38px}
.sub-ntab{padding:9px 14px;font-size:11px;color:var(--mut);cursor:pointer;
  border:none;background:transparent;border-bottom:2px solid transparent;
  transition:all .15s;white-space:nowrap;flex-shrink:0;font-family:inherit}
.sub-ntab:hover{color:var(--txt)}
.sub-ntab.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}

/* MISC */
.tip{font-size:11px;color:var(--mut);margin:8px 0}
.empty{text-align:center;padding:40px 20px;color:var(--hint);font-size:12px}

/* STATS CARDS */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat-card{background:var(--sur);border:.5px solid var(--bdr);border-radius:10px;padding:14px 16px}
.stat-n{font-size:26px;font-weight:700;color:var(--acc)}
.stat-l{font-size:10px;color:var(--mut);margin-top:2px;text-transform:uppercase;letter-spacing:.05em}

  /* ── Print styles ── */
  @media print {
    /* Hide everything except the calendar content */
    body { background: #fff !important; margin: 0 !important; }
    .nav { display: none !important; }
    .sub-nav { display: none !important; }
    .no-print { display: none !important; }
    .print-only { display: block !important; }
    /* Hide all pages except holidays */
    .page { display: none !important; }
    #page-holidays { display: block !important; }
    /* Hide the holidays sub-nav and controls */
    #page-holidays .sub-nav { display: none !important; }
    /* Show only the calendar tab content */
    #hol-tab-content { padding: 0 !important; }
    /* 4-column calendar grid */
    #cal-grid { grid-template-columns: repeat(4, 1fr) !important; gap: 8px !important; }
    /* Force colors to print */
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    /* Remove scrollbar space */
    ::-webkit-scrollbar { display: none !important; }
    /* Remove any horizontal scroll containers */
    .page { overflow: visible !important; }
  }
</style>

<script>

const S = {

// ═══════════════════════════════════════════════════════════════════════════
// PERSISTENCE
// ═══════════════════════════════════════════════════════════════════════════
function saveAll(){
  S.meta.lastUpdated = new Date().toISOString();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(S));
}
function loadData(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(!raw) return;
  try{
    const p = JSON.parse(raw);
    if(p.holidayDates    && typeof p.holidayDates==='object')    S.holidayDates    = p.holidayDates;
    if(p.schoolHolDates  && typeof p.schoolHolDates==='object')  S.schoolHolDates  = p.schoolHolDates;
    if(p.specialHolidays && typeof p.specialHolidays==='object') S.specialHolidays = p.specialHolidays;
    if(p.srtDates && typeof p.srtDates==='object') S.srtDates = p.srtDates;
    if(p.noticeFooters && typeof p.noticeFooters==='object') S.noticeFooters = Object.assign({}, S.noticeFooters, p.noticeFooters);
    if(p.festivalDates   && typeof p.festivalDates==='object')   S.festivalDates   = p.festivalDates;
    if(p.extraClasses    && typeof p.extraClasses==='object')    S.extraClasses    = p.extraClasses;
    if(p.meta && typeof p.meta==='object') S.meta = Object.assign({}, S.meta, p.meta);
  }catch(e){ console.error('loadData failed', e); }
}
/* ══════════════════════════════════════════════════════════════
   APP_VERSION —— 2026-09-13 改名（原本叫 HOLIDAYGO_BUILD）。

   这个系统一直都有版本号，只是常数名字跟平台惯例不一样，

   照 Standard §25 统一改叫 APP_VERSION。

   37 → 38：档案内容有变（改名 + <title> 补版本号），所以进位。
   一个版本号只对应一份档，不让两份不同的档同时叫 v37。

   改版规则：只用整数，且两处必须同时改 ——
   ① <title>  ② 下面这个常数（顶栏徽章由它衍生，不用手改）
   ══════════════════════════════════════════════════════════════ */
/* 38 → 39（2026-10-09）：改读 Calendar 的每日结果表 calendar_days；中心关门周进通知；SRT 改由 Calendar 卡 G 管；书本通知错字「知悲」→「知悉」；
   变成纯读者：拿掉 Holidays 编辑页 / HR View / 网上抓假期 / 贴上汇入；新增 Year Calendar（按部门全年，从 Calendar 的 Parent View 搬来） */
const APP_VERSION = 39;
function flashSaved(){
  const el = document.getElementById('saved');
  el.style.display='inline';
  setTimeout(()=>el.style.display='none', 1500);
}

// ═══════════════════════════════════════════════════════════════════════════
// NAV
// ═══════════════════════════════════════════════════════════════════════════
function goPage(p){
  document.querySelectorAll('.page').forEach(el=>el.classList.remove('on'));
  document.querySelectorAll('.ntab').forEach(el=>el.classList.remove('on'));
  const pageEl = document.getElementById('page-'+p);
  if(pageEl) pageEl.classList.add('on');
  const map = {home:0,holidays:1,book:2,parent:3,settings:4};
  document.querySelectorAll('.ntab')[map[p]]?.classList.add('on');
  // Call renderer
  const fn = window['render_' + p];
  if(typeof fn==='function') fn();
}

// ═══════════════════════════════════════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════════════════════════════════════
function genId(prefix){
  return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
}
function yearToAge(yr){
  if(!yr) return '';
  const thisYear = new Date().getFullYear();
  return thisYear - parseInt(yr);
}
function deptBadge(d){
  const cls = 'b-'+String(d||'').toLowerCase();
  return `<span class="badge ${cls}">${d}</span>`;
}
function statusBadge(s){
  return `<span class="badge ${s==='active'?'b-active':'b-inactive'}">${s}</span>`;
}
function escapeHTML(s){
  return String(s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ═══════════════════════════════════════════════════════════════════════════
// HOME
// ═══════════════════════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════════════════════
// HOME — Holiday Go landing
// ═══════════════════════════════════════════════════════════════════════════
function render_home(){
  const el = document.getElementById('home-content');
  const yr = window._holYear || new Date().getFullYear();
  const d = _hd(yr);
  const sh = S.schoolHolDates[yr] || {};
  const fd = S.festivalDates[yr] || {};
  const sp = S.specialHolidays[yr] || [];
  const subs = _getSubHols(yr);

  const totalTpl = HOLIDAY_TEMPLATE.length;
  const setTpl = Object.values(d).filter(Boolean).length;
  const shCount = Object.values(sh).filter(r=>r.start&&r.end).length;
  const festCount = Object.values(fd).filter(f=>f.start&&f.end).length;

  el.innerHTML = `
    <div class="card" style="background:linear-gradient(135deg,#FFF8F0 0%,#FFFDF5 100%);border:.5px solid #F9CB42">
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
        <div style="font-size:42px">🌴</div>
        <div style="flex:1">
          <div style="font-size:22px;font-weight:700;color:#854F0B">NoticeGo-Holiday</div>
          <div style="font-size:13px;color:var(--mut);margin-top:2px">Academee 假期 + 通知系统 / Holiday & Notice System</div>
        </div>
        <select onchange="window._holYear=parseInt(this.value);render_home()" style="padding:7px 12px;font-size:13px;font-weight:600;border:.5px solid #F9CB42;border-radius:6px;background:#FFFFFF">
          ${[2025,2026,2027,2028].map(y=>`<option value="${y}"${y===yr?' selected':''}>${y}</option>`).join('')}
        </select>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:14px">
      ${_homeStat('📋','Template Holidays',`${setTpl}/${totalTpl}`,'#185FA5','#EEF4FB')}
      ${_homeStat('⚖️','Substitute Days',subs.length,'#9C1B4B','#FFF0F6')}
      ${_homeStat('🎉','Festival Periods',festCount,'#D4380D','#FFF0E6')}
      ${_homeStat('🏫','School Holidays',shCount,'#0F6E56','#EDFAF4')}
      ${_homeStat('⚡','Special / Ad-hoc',sp.length,'#7030A0','#F5F0FF')}
    </div>

    <div class="card" style="margin-top:14px">
      <div class="card-hdr"><div class="card-title">📤 Quick Actions</div></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:6px">
        <button onclick="goPage('holidays')" class="quick-card" style="background:#FFF8F0;border-color:#F9CB42">
          <div style="font-size:24px">📅</div>
          <div style="font-weight:600;margin-top:6px">Manage Holidays</div>
          <div style="font-size:11px;color:var(--mut);margin-top:3px">Set dates · Festivals · School holidays</div>
        </button>
        <button onclick="goPage('parent')" class="quick-card" style="background:#EDFAF4;border-color:#9FE1CB">
          <div style="font-size:24px">👨‍👩‍👧</div>
          <div style="font-weight:600;margin-top:6px">Parent Notices</div>
          <div style="font-size:11px;color:var(--mut);margin-top:3px">6 bi-monthly notices · 中英双语</div>
        </button>
      </div>
    </div>

    <div class="card" style="margin-top:14px">
      <div class="card-hdr"><div class="card-title">🌟 Upcoming Holidays in ${yr}</div></div>
      ${_homeUpcoming(yr)}
    </div>

    <style>
      .quick-card{display:block;text-align:left;padding:14px;border:.5px solid var(--bdr);border-radius:8px;cursor:pointer;font-family:inherit;transition:.15s;color:var(--txt)}
      .quick-card:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
    </style>
  `;
}

function _homeStat(icon, label, val, color, bg){
  return `<div style="background:${bg};border:.5px solid ${color}33;border-radius:8px;padding:11px 14px">
    <div style="font-size:18px">${icon}</div>
    <div style="font-size:22px;font-weight:700;color:${color};margin-top:3px">${val}</div>
    <div style="font-size:10px;color:var(--mut);margin-top:1px">${label}</div>
  </div>`;
}

function _homeUpcoming(yr){
  const today = new Date().toISOString().slice(0,10);
  const list = [];
  const d = _hd(yr);
  HOLIDAY_TEMPLATE.forEach(t=>{
    const dt = t.dt==='fixed' ? `${yr}-${t.md}` : d[t.id];
    if(dt && dt >= today) list.push({date:dt, name:t.name, cat:t.cat});
  });
  FESTIVAL_CONFIG.forEach(fc=>{
    const fest = (S.festivalDates[yr]||{})[fc.id]||{};
    Object.entries(fest.days||{}).forEach(([ds,cat])=>{
      if(ds >= today && (cat==='PH2'||cat==='OFF')){
        list.push({date:ds, name:fc.name+(cat==='OFF'?' (OFF)':' (PH)'), cat:cat});
      }
    });
  });
  (S.specialHolidays[yr]||[]).forEach(s=>{
    if(s.date && s.date >= today) list.push({date:s.date, name:s.name, cat:s.category||'PH2'});
  });
  _getSubHols(yr).forEach(s=>{
    if(s.date >= today) list.push({date:s.date, name:s.name, cat:'SUB'});
  });
  list.sort((a,b)=>a.date.localeCompare(b.date));
  const next = list.slice(0,6);
  if(!next.length) return `<div style="padding:20px;text-align:center;color:var(--hint);font-size:12px">No upcoming holidays. Set them in 📅 Holidays tab.</div>`;
  return `<table class="data" style="margin-top:6px">
    <thead><tr><th>Date</th><th>Day</th><th>Holiday</th><th style="text-align:center">Type</th></tr></thead>
    <tbody>${next.map(r=>{
      const dow = new Date(r.date+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short'});
      return `<tr>
        <td style="font-weight:600">${_ddmmL(r.date)}</td>
        <td style="color:var(--mut)">${dow}</td>
        <td>${escapeHTML(r.name)}</td>
        <td style="text-align:center">${_catBadge(r.cat)}</td>
      </tr>`;
    }).join('')}</tbody></table>`;
}

// ═══════════════════════════════════════════════════════════════════════════
// HOLIDAY TEMPLATE — Fixed names & categories. Only dates change per year.
// ═══════════════════════════════════════════════════════════════════════════
// Holiday template — CNY/Raya/Deepavali removed (handled by FESTIVAL system)

function _hd(yr){ return S.holidayDates[yr] || {}; }
function _getDate(yr, id){ return _hd(yr)[id] || ''; }

// Returns true if date is PH1 or PH2 (not AL deductible)
function isPH(ds){
  const yr = parseInt(ds.slice(0,4));
  const d = _hd(yr);
  if(HOLIDAY_TEMPLATE.filter(t=>t.cat==='PH1'||t.cat==='PH2').some(t=>d[t.id]===ds)) return true;
  if((S.specialHolidays[yr]||[]).some(h=>h.date===ds)) return true;
  // Festival days marked PH2 — must be within declared range
  const fd = S.festivalDates[yr]||{};
  return Object.values(fd).some(f=>f.start&&f.end&&ds>=f.start&&ds<=f.end&&f.days&&f.days[ds]==='PH2');
}
// Returns true if date is OFF (deducts AL, not a gazetted PH)
function isCentreOff(ds){
  const yr = parseInt(ds.slice(0,4));
  const d = _hd(yr);
  if(HOLIDAY_TEMPLATE.filter(t=>t.cat==='OFF').some(t=>d[t.id]===ds)) return true;
  // Festival days marked OFF — must be within declared range
  const fd = S.festivalDates[yr]||{};
  return Object.values(fd).some(f=>f.start&&f.end&&ds>=f.start&&ds<=f.end&&f.days&&f.days[ds]==='OFF');
}
// Returns true if date is inside a school holiday range (deducts AL)
function isSchoolHol(ds){
  const yr = parseInt(ds.slice(0,4));
  const sh = S.schoolHolDates[yr] || {};
  return Object.values(sh).some(r=>r.start && r.end && ds>=r.start && ds<=r.end);
}
function getPHName(ds){
  const yr = parseInt(ds.slice(0,4));
  const d = _hd(yr);
  const t = HOLIDAY_TEMPLATE.find(t=>(t.cat==='PH1'||t.cat==='PH2') && d[t.id]===ds);
  if(t) return t.name;
  const sp = (S.specialHolidays[yr]||[]).find(h=>h.date===ds);
  if(sp) return sp.name;
  const fd = S.festivalDates[yr]||{};
  for(const [fid,f] of Object.entries(fd)){
    if(f.start&&f.end&&ds>=f.start&&ds<=f.end&&f.days&&f.days[ds]==='PH2'){
      const fc=FESTIVAL_CONFIG.find(x=>x.id===fid);
      return fc?fc.name:null;

  }
  return null;
}

// ═══════════════════════════════════════════════════════════════════════════
// SUBSTITUTE HOLIDAY ENGINE  (Act 369, Section 3)
// Rule: PH1/PH2 falls on Sunday → next Monday becomes substitute PH
//       If that Monday is also PH → keep moving forward
// Company: Working Day = Mon–Sat,  Rest Day = Sunday
// ═══════════════════════════════════════════════════════════════════════════
function _getSubHols(yr){
  const subs = [];
  const d = _hd(yr);

  // ── Collect ALL gazetted PH entries (PH1/PH2/Festival PH2/Special) ──
  // Each entry: { date, name, cat }
  const allPH = [];

  HOLIDAY_TEMPLATE.filter(t=>t.cat==='PH1'||t.cat==='PH2').forEach(t=>{
    const dt = t.dt==='fixed' ? `${yr}-${t.md}` : d[t.id];
    if(dt) allPH.push({ date:dt, name:t.name, cat:t.cat });
  });

  FESTIVAL_CONFIG.forEach(fc=>{
    const fest=(S.festivalDates[yr]||{})[fc.id]||{};
    Object.entries(fest.days||{}).forEach(([date,cat])=>{
      if(cat==='PH2' && new Date(date+'T12:00:00').getDay()!==0)
        allPH.push({ date, name:fc.name, cat:'PH2' });
    });
  });

  (S.specialHolidays[yr]||[]).forEach(h=>{
    allPH.push({ date:h.date, name:h.name, cat:h.category||'PH2' });
  });

  // ── Also collect OFF for company Replace policy ──
  const allOFF = [];
  HOLIDAY_TEMPLATE.filter(t=>t.cat==='OFF').forEach(t=>{
    if(d[t.id]) allOFF.push({ date:d[t.id], name:t.name, cat:'OFF' });
  });

  const allDates = [...allPH, ...allOFF];

  // ── Build date-count map to detect COINCIDING holidays ──
  // dateMap: { 'YYYY-MM-DD': [{ name, cat }, ...] }
  const dateMap = {};
  allDates.forEach(h=>{
    if(!dateMap[h.date]) dateMap[h.date]=[];
    dateMap[h.date].push(h);
  });

  // Set of all taken dates (to avoid double-Replace collisions)
  const taken = new Set(Object.keys(dateMap));

  // Helper: find next available working day
  function nextWorkDay(fromDs){
    let s = new Date(fromDs+'T12:00:00');
    s.setDate(s.getDate()+1);
    while(s.getDay()===0 || taken.has(s.toISOString().slice(0,10))){
      s.setDate(s.getDate()+1);
    }
    return s.toISOString().slice(0,10);
  }

  // ── RULE 1: PH falls on Sunday → Replace ──────────────────────────
  // (Act 369 Section 3, first part)
  Object.entries(dateMap).forEach(([ds, holidays])=>{
    const dow = new Date(ds+'T12:00:00').getDay();
    if(dow !== 0) return; // Only Sunday triggers this rule
    // Use the first PH on that Sunday
    const ph = holidays[0];
    const subDs = nextWorkDay(ds);
    taken.add(subDs);
    subs.push({
      date: subDs, name:'Replace: '+ph.name,
      cat:'SUB', srcDate:ds, srcCat:ph.cat,
      id:'sub_sun_'+ds, isSub:true, fixed:true,
      rule:'Sunday PH → Act 369 S.3'
    });
  });

  // ── RULE 2: Two or more PH coincide on the SAME working day → Replace ─
  // (Act 369 Section 3: "if such day is already a public holiday, then
  //  the day following shall be a public holiday")
  // When 2 gazetted PHs fall on the same weekday, the extra PH generates
  // a substitute — employee is entitled to both days.
  Object.entries(dateMap).forEach(([ds, holidays])=>{
    const dow = new Date(ds+'T12:00:00').getDay();
    if(dow === 0) return; // Sunday already handled above
    // Only triggered when 2+ GAZETTED PHs (PH1/PH2/SP) coincide
    const gazetted = holidays.filter(h=>h.cat==='PH1'||h.cat==='PH2'||h.cat==='SP');
    if(gazetted.length < 2) return;
    // Extra PHs (beyond the first) each generate a Replace
    for(let i=1; i<gazetted.length; i++){
      const ph = gazetted[i];
      const subDs = nextWorkDay(ds);
      taken.add(subDs);
      subs.push({
        date: subDs, name:'Replace: '+ph.name+' (coincides with '+gazetted[0].name+')',
        cat:'SUB', srcDate:ds, srcCat:ph.cat,
        id:'sub_coinc_'+ds+'_'+i, isSub:true, fixed:true,
        rule:'Coinciding PH → Act 369 S.3'
      });
    }
  });

  return subs.sort((a,b)=>a.date.localeCompare(b.date));
}

// Update isPH to recognise substitute holidays
const _isPH_base = isPH;
isPH = function(ds){
  if(_isPH_base(ds)) return true;
  // Check substitute holidays
  const yr = parseInt(ds.slice(0,4));
  return _getSubHols(yr).some(s=>s.date===ds);
};

function getPHNameFull(ds){
  const n = getPHName(ds); if(n) return n;
  const yr = parseInt(ds.slice(0,4));
  const sub = _getSubHols(yr).find(s=>s.date===ds);
  return sub ? sub.name : null;
}

function _scDayCount(s,e){
  let al=0, total=0, phDays=0;
  let d=new Date(s+'T12:00:00'), end=new Date(e+'T12:00:00');
  while(d<=end){
    const dow=d.getDay();
    const ds=d.toISOString().slice(0,10);
    if(dow!==0){ // Mon–Sat (working days)
      total++;
      if(isPH(ds)||_getSubHols(parseInt(ds.slice(0,4))).some(sub=>sub.date===ds)){
        phDays++; // PH day — no AL deducted
      } else {
        al++; // AL will be deducted
      }
    }
    d.setDate(d.getDate()+1);
  }
  return { al, total, ph:phDays };
}
// Simple count for backward-compat (just AL days)
function _scDayCountNum(s,e){ return _scDayCount(s,e).al; }

function _collectAllHolidays(yr){
  const list = [];
  const d = _hd(yr);
  HOLIDAY_TEMPLATE.forEach(t=>{
    const dt = t.dt==='fixed' ? `${yr}-${t.md}` : d[t.id];
    if(!dt) return;
    list.push({ date:dt, name:t.name, cat:t.cat });
  });
  FESTIVAL_CONFIG.forEach(fc=>{
    const fest = (S.festivalDates[yr]||{})[fc.id]||{};
    Object.entries(fest.days||{}).forEach(([ds,cat])=>{
      if(cat==='PH2'||cat==='OFF'){
        if(new Date(ds+'T12:00:00').getDay()===0 && cat!=='PH2') return;
        // Festival OFF → grey (like calendar); Festival PH2 → black
        list.push({ date:ds, name:fc.name, cat: cat==='OFF' ? 'FEST_OFF' : cat });
      }
    });
  });
  (S.specialHolidays[yr]||[]).forEach(s=>{
    if(s.date) list.push({ date:s.date, name:s.name, cat:s.category||'PH2' });
  });
  _getSubHols(yr).forEach(s=>{
    list.push({ date:s.date, name:s.name, cat:'SUB', isReplace:true, srcName:s.name });
  });
  const sh = S.schoolHolDates[yr]||{};
  Object.entries(sh).forEach(([id, r])=>{
    if(!r.start||!r.end) return;
    list.push({
      date:r.start,
      endDate:r.end,
      name:r.name||'School Holiday',
      cat:'SH',
      isRange:true,
      depts: r.depts||['MASTER','TEACHER','SRK','GAK','ATC']
    });
  });
  list.sort((a,b)=>a.date.localeCompare(b.date));
  return list;
}

function _filterPeriodHolidays(yr, months){
  return _collectAllHolidays(yr).filter(h=>{
    const m = parseInt(h.date.slice(5,7));
    if(months.includes(m)) return true;
    if(h.isRange){
      const em = parseInt((h.endDate||h.date).slice(5,7));
      if(months.includes(em)) return true;
    }
    return false;
  });
}

function _fmtNoticeDate(ds){
  const d = new Date(ds+'T12:00:00');
  const day = d.getDate();
  const monthsEN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const dowEN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  return `${day} ${monthsEN[d.getMonth()]} (${dowEN[d.getDay()]})`;
}

    <div class="toolbar"><span>📲</span><div><b>Download PNG</b><br><span style="font-size:10px;opacity:.8;">Share on WhatsApp / WeChat</span></div><button onclick="doDownload()">⬇ Download PNG</button><button class="sec" onclick="window.print()">🖨 PDF</button><button class="sec" onclick="window.close()">✕</button><span id="status"></span></div>

// Build a mini calendar for one month, colours from holiday list
// ── Notice mini calendar — copy of Calendar month render, notice colours ──
function _buildNoticeMiniCal(yr, mo, allHol, noticeDept){
  const MNAMES=['January','February','March','April','May','June',
                'July','August','September','October','November','December'];
  const MNAMES_CN=['\u4e00\u6708','\u4e8c\u6708','\u4e09\u6708','\u56db\u6708','\u4e94\u6708','\u516d\u6708',
                   '\u4e03\u6708','\u516b\u6708','\u4e5d\u6708','\u5341\u6708','\u5341\u4e00\u6708','\u5341\u4e8c\u6708'];

  const days = new Date(yr, mo, 0).getDate();
  const ms   = `${yr}-${String(mo).padStart(2,'0')}`;
  const af   = (new Date(yr, mo-1, 1).getDay() + 6) % 7; // first day offset Mon=0
  const d    = _hd(yr);

  // ── Dept helpers (same as Calendar, dept = noticeDept) ───────────
  const dept = noticeDept || 'SRK';
  const satIsWork = false; // SRK/GAK/ATC/SRT: Sat is off

  const subDates = new Set(_getSubHols(yr).map(s=>s.date));

  function deptMatch(depts){ return !depts||depts.includes(dept)||depts.includes('MASTER'); }

  function isSHForDept(ds2){
    const sh2 = S.schoolHolDates[yr]||{};
    return Object.values(sh2).some(r=>r.start&&r.end&&ds2>=r.start&&ds2<=r.end&&deptMatch(r.depts));
  }

  function getFestCatLocal(ds2){
    const tplDates = new Set(HOLIDAY_TEMPLATE.map(t=>t.dt==='fixed'?`${yr}-${t.md}`:(d[t.id]||'')).filter(Boolean));
    if(tplDates.has(ds2)) return null;
    for(const fc of FESTIVAL_CONFIG){
      const f=(S.festivalDates[yr]||{})[fc.id]||{};
      if(f.start&&f.end&&ds2>=f.start&&ds2<=f.end) return (f.days||{})[ds2]||null;
    }
    return null;
  }

  // ── getDayStyle equivalent (SAME logic as Calendar) ─────────────
  // Maps Calendar colours to notice palette:
  //   black (#000)    → #5C1010  (dark maroon)
  //   grey  (#AAAAAA) → #F2DADA  (light pink)
  //   white (#fff)    → #fff
  function noticeStyle(ds2, dow){
    const isSun=dow===6, isSat=dow===5;
    if(isSun||(isSat&&!satIsWork)) return {bg:'#5C1010',txt:'#fff',bold:false};
    const festCat=getFestCatLocal(ds2);
    const shDay=isSHForDept(ds2);
    const isSpec=(S.specialHolidays[yr]||[]).some(h=>h.date===ds2);
    const isSub=subDates.has(ds2);
    const nonFestPH=(isPH(ds2)&&!festCat)||isSpec||isSub;
    const nonFestOFF=isCentreOff(ds2)&&!festCat;
    if(nonFestPH||nonFestOFF) return {bg:'#5C1010',txt:'#fff',bold:true};
    if(festCat==='PH2') return {bg:'#5C1010',txt:'#fff',bold:true};
    if(festCat==='OFF') return {bg:'#F2DADA',txt:'#7A1E1E',bold:true};
    if(shDay)           return {bg:'#F2DADA',txt:'#7A1E1E',bold:true};
    return {bg:'#fff',txt:'#555',bold:false};
  }

  // isECDay — exact copy of Calendar's isExtraClass(ds, dept) logic
  function isECDay(ds2){
    return ((S.extraClasses||{})[yr]||[]).some(e=>{
      if(!e.start||!e.end||ds2<e.start||ds2>e.end) return false;
      return !dept||!e.depts||!e.depts.length||e.depts.includes(dept);
    });
  }

  // ── Build HTML ────────────────────────────────────────────────────
  let html = `<div style="border:2px solid #5C1010;border-radius:6px;overflow:hidden;font-family:Arial,sans-serif;background:#fff;">`;

  // Month header
  html += `<div style="background:#5C1010;color:#fff;padding:7px 12px;display:flex;justify-content:space-between;align-items:center;">
    <span style="font-weight:700;font-size:12px;">${MNAMES[mo-1]} ${yr}</span>
    <span style="font-size:10px;opacity:.7;">${MNAMES_CN[mo-1]}</span>
  </div>`;

  // Day headers — M-F medium red, S/S dark
  html += `<div style="display:grid;grid-template-columns:repeat(7,1fr);">
    ${['M','T','W','T','F','S','S'].map((x,i)=>`<div style="text-align:center;font-size:9px;font-weight:700;padding:4px 0;background:${i>=5?'#3d1a1a':'#8B3030'};color:#fff;">${x}</div>`).join('')}
  </div>`;

  // Day grid
  html += `<div style="display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid #5C1010;">`;
  for(let i=0;i<af;i++) html+=`<div style="min-height:26px;background:#faf9f7;"></div>`;
  for(let day=1;day<=days;day++){
    const ds2=`${yr}-${String(mo).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const dow=(af+day-1)%7;
    const {bg,txt,bold}=noticeStyle(ds2,dow);
    const ec=isECDay(ds2);
    html+=`<div style="min-height:26px;padding:2px;background:${bg};border:1px solid ${bg==='#fff'?'#ede9e3':'transparent'};display:flex;flex-direction:column;align-items:center;justify-content:center;">
      <span style="font-size:11px;font-weight:700;color:${txt};line-height:1;">${day}</span>
      ${ec?`<span style="font-size:7px;line-height:1;color:${bg==='#5C1010'?'#fff':bg==='#F2DADA'?'#7A1E1E':'#5C1010'}">★</span>`:''}
    </div>`;
  }
  const rem=(af+days)%7;
  if(rem>0) for(let i=0;i<7-rem;i++) html+=`<div style="min-height:26px;background:#faf9f7;"></div>`;
  html+=`</div>`;

  // ── Sections (SAME logic as Calendar) ─────────────────────────────

  // isFestOnlyOFF: same as Calendar
  const isFestOnlyOFF=(ds2)=>{
    const isFestOFF=FESTIVAL_CONFIG.some(fc=>{
      const f=(S.festivalDates[yr]||{})[fc.id]||{};
      return f.start&&f.end&&ds2>=f.start&&ds2<=f.end&&(f.days||{})[ds2]==='OFF';
    });
    if(!isFestOFF) return false;
    const tpl=new Set(HOLIDAY_TEMPLATE.map(t=>t.dt==='fixed'?`${yr}-${t.md}`:(d[t.id]||'')).filter(Boolean));
    return !tpl.has(ds2);
  };

  // Holiday list
  const subs2=_getSubHols(yr);
  const monthPHList=[];
  for(let dd=1;dd<=days;dd++){
    const ds2=`${yr}-${String(mo).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
    const subEntry=subs2.find(s=>s.date===ds2);
    if(!subEntry&&isFestOnlyOFF(ds2)) continue;
    const phName=getPHNameFull(ds2)||getOffName(ds2);
    if(subEntry) monthPHList.push(`<div style="font-size:9px;line-height:1.6;font-weight:700"><b>${dd}</b> ${escapeHTML(subEntry.name.replace(/\s*\([^)]*\)/g,'').trim())}</div>`);
    else if(phName) monthPHList.push(`<div style="font-size:9px;line-height:1.6;font-weight:700"><b>${dd}</b> ${escapeHTML(phName)}</div>`);
  }

  // Festival ranges
  const festInMonth=[];
  FESTIVAL_CONFIG.forEach(fc=>{
    const fest=(S.festivalDates[yr]||{})[fc.id]||{};
    if(!fest.start||!fest.end) return;
    if(fest.end<ms+'-01'||fest.start>ms+'-31') return;
    festInMonth.push({name:fc.name,start:_ddmmS(fest.start),end:_ddmmS(fest.end)});
  });

  // School holiday ranges
  const sh=S.schoolHolDates[yr]||{};
  const shRanges=Object.values(sh).filter(r=>{
    if(!r.start||!r.end) return false;
    if(!deptMatch(r.depts)) return false;
    return r.start.startsWith(ms)||r.end.startsWith(ms)||(r.start<=ms+'-01'&&r.end>=ms+'-28');
  });

  // Extra class
  // ecInMonth — exact copy of Calendar's ecInMonth filter logic
  const ecInMonth = ((S.extraClasses||{})[yr]||[]).filter(e=>{
    if(!e.start||!e.end) return false;
    if(!(!dept||!e.depts||!e.depts.length||e.depts.includes(dept))) return false;
    return e.start.startsWith(ms)||e.end.startsWith(ms)||(e.start<=ms+'-01'&&e.end>=ms+'-28');
  });

  // Government type: solid outer → dashed between PH and SH
  // Centre type:     solid separator → dashed between Festive and EC
  if(monthPHList.length) html+=`<div style="padding:6px 10px;border-top:1px solid #5C1010;background:#faf8f5;">
    <div style="font-size:8px;font-weight:700;color:#5C1010;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;">Public Holiday</div>
    ${monthPHList.join('')}</div>`;
  if(shRanges.length) html+=`<div style="padding:6px 10px;border-top:${monthPHList.length?'1.5px dashed #C0A0A0':'1px solid #5C1010'};background:#edecea;">
    <div style="font-size:8px;font-weight:700;color:#5C1010;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;">KPM School Holiday</div>
    ${shRanges.map(r=>`<div style="font-size:9px;line-height:1.6">${_ddmmS(r.start)} – ${_ddmmS(r.end)} (${escapeHTML(r.name||'School Holiday')})</div>`).join('')}</div>`;
  if(festInMonth.length) html+=`<div style="padding:6px 10px;border-top:1px solid #5C1010;background:#f5f2ec;">
    <div style="font-size:8px;font-weight:700;color:#5C1010;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;">Our Festive Holidays</div>
    ${festInMonth.map(f=>`<div style="font-size:9px;line-height:1.6">${f.start} – ${f.end} (${escapeHTML(f.name)})</div>`).join('')}</div>`;
  if(ecInMonth.length){
    // Deduplicate by date range (e.start / e.end)
    const ecGroups={};
    ecInMonth.forEach(e=>{
      const key=`${e.start}|${e.end||e.start}`;
      if(!ecGroups[key]) ecGroups[key]={start:e.start,end:e.end||e.start,entries:[]};
      const lbl=[e.name&&e.name!=='Extra Class'?e.name:'',e.time||'',e.msg||''].filter(Boolean).join(' · ');
      if(lbl&&!ecGroups[key].entries.includes(lbl)) ecGroups[key].entries.push(lbl);
    });
    const ecRows=Object.values(ecGroups).map(g=>`<div style="font-size:9px;line-height:1.7"><b>${_ddmmS(g.start)}${g.end&&g.end!==g.start?' – '+_ddmmS(g.end):''}</b>${g.entries.length?' <span style="font-weight:400">'+escapeHTML(g.entries.join(' / '))+'</span>':''}</div>`);
    html+=`<div style="padding:6px 10px;border-top:${festInMonth.length?'1.5px dashed #C0A0A0':'1px solid #5C1010'};background:#f5f0fa;">
    <div style="font-size:8px;font-weight:700;color:#5C1010;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;">★ Our Extra Learning Day</div>
    ${ecRows.join('')}</div>`;
  }
  if(!monthPHList.length&&!festInMonth.length&&!shRanges.length&&!ecInMonth.length)
    html+=`<div style="border-top:1px solid #5C1010;min-height:4px;"></div>`;

  html+=`</div>`;
  return html;
}

// ── Book Notice mini calendar — same logic, black/grey/white palette ──

  // Day header row — dark grey for M-F, black for S/S

    const fest=(S.festivalDates[yr]||{})[fc.id]||{};
    if(!fest.start||!fest.end) return;
    if(fest.end<ms+'-01'||fest.start>ms+'-31') return;
    festInMonth.push({name:fc.name,start:_ddmmS(fest.start),end:_ddmmS(fest.end)});
  });
  const sh=S.schoolHolDates[yr]||{};
  const shRanges=Object.values(sh).filter(r=>{
    if(!r.start||!r.end) return false;
    if(!deptMatch(r.depts)) return false;
    return r.start.startsWith(ms)||r.end.startsWith(ms)||(r.start<=ms+'-01'&&r.end>=ms+'-28');
  });
  const ecInMonth=((S.extraClasses||{})[yr]||[]).filter(e=>{
    if(!e.start||!e.end) return false;
    if(!(!dept||!e.depts||!e.depts.length||e.depts.includes(dept))) return false;
    return e.start.startsWith(ms)||e.end.startsWith(ms)||(e.start<=ms+'-01'&&e.end>=ms+'-28');
  });

  const S_LINE='border-top:1px solid #000';
  const D_LINE='border-top:1.5px dashed #aaa';
  let secs='';
  if(monthPHList.length) secs+=`<div style="padding:6px 10px;${S_LINE};background:#f8f8f8;"><div style="font-size:8px;font-weight:700;color:#000;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;">Public Holiday</div>${monthPHList.join('')}</div>`;
  if(shRanges.length) secs+=`<div style="padding:6px 10px;${monthPHList.length?D_LINE:S_LINE};background:#f0f0f0;"><div style="font-size:8px;font-weight:700;color:#000;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;">KPM School Holiday</div>${shRanges.map(r=>`<div style="font-size:9px;line-height:1.6">${_ddmmS(r.start)} – ${_ddmmS(r.end)} (${escapeHTML(r.name||'School Holiday')})</div>`).join('')}</div>`;
  if(festInMonth.length) secs+=`<div style="padding:6px 10px;${S_LINE};background:#eee;"><div style="font-size:8px;font-weight:700;color:#000;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;">Our Festive Holidays</div>${festInMonth.map(f=>`<div style="font-size:9px;line-height:1.6">${f.start} – ${f.end} (${escapeHTML(f.name)})</div>`).join('')}</div>`;
  if(ecInMonth.length){
    const ecG={};
    ecInMonth.forEach(e=>{const k=`${e.start}|${e.end||e.start}`;if(!ecG[k])ecG[k]={start:e.start,end:e.end||e.start,entries:[]};const lbl=[e.name&&e.name!=='Extra Class'?e.name:'',e.time||'',e.msg||''].filter(Boolean).join(' · ');if(lbl&&!ecG[k].entries.includes(lbl))ecG[k].entries.push(lbl);});
    secs+=`<div style="padding:6px 10px;${festInMonth.length?D_LINE:S_LINE};background:#e8e8e8;"><div style="font-size:8px;font-weight:700;color:#000;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;">★ Our Extra Learning Day</div>${Object.values(ecG).map(g=>`<div style="font-size:9px;line-height:1.7"><b>${_ddmmS(g.start)}${g.end&&g.end!==g.start?' – '+_ddmmS(g.end):''}</b>${g.entries.length?' <span style="font-weight:400">'+escapeHTML(g.entries.join(' / '))+'</span>':''}</div>`).join('')}</div>`;
  }
  if(!secs) secs=`<div style="${S_LINE};min-height:4px;"></div>`;

  return `<div style="border:2px solid #000;border-radius:6px;overflow:hidden;font-family:Arial,sans-serif;background:#fff;">
    <div style="background:#000;color:#fff;padding:7px 12px;display:flex;justify-content:space-between;align-items:center;">

    <div style="display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid #000;">${cells}</div>
    ${secs}
  </div>`;
}

// Dept-aware holiday collector for parent notice
function _filterPeriodHolidaysForDept(yr, months, dept){
  const list = [];
  const d = _hd(yr);
  // Template holidays (same for all depts)
  HOLIDAY_TEMPLATE.forEach(t=>{
    const dt = t.dt==='fixed' ? `${yr}-${t.md}` : d[t.id];
    if(!dt) return;
    list.push({ date:dt, name:t.name, cat:t.cat });
  });
  // Festival holidays (same for all depts)
  FESTIVAL_CONFIG.forEach(fc=>{
    const fest = (S.festivalDates[yr]||{})[fc.id]||{};
    Object.entries(fest.days||{}).forEach(([ds,cat])=>{
      if(!fest.start||!fest.end||ds<fest.start||ds>fest.end) return;
      if(cat==='PH2'||cat==='OFF'){
        if(new Date(ds+'T12:00:00').getDay()===0 && cat!=='PH2') return;
        list.push({ date:ds, name:fc.name, cat });
      }
    });
  });
  // Special holidays
  (S.specialHolidays[yr]||[]).forEach(s=>{
    if(s.date) list.push({ date:s.date, name:s.name, cat:s.category||'PH2' });
  });
  // Substitute holidays
  _getSubHols(yr).forEach(s=>{
    list.push({ date:s.date, name:s.name.replace(/\s*\(.*?\)/g,'').trim(), cat:'SUB', isReplace:true });
  });
  // School holidays — filtered by dept
  const sh = S.schoolHolDates[yr]||{};
  Object.entries(sh).forEach(([id, r])=>{
    if(!r.start||!r.end) return;
    const depts = r.depts||['MASTER','TEACHER','SRK','GAK','ATC'];
    if(dept && !depts.includes(dept) && !depts.includes('MASTER')) return;
    list.push({
      date:r.start, endDate:r.end,
      name:r.name||'School Holiday', cat:'SH', isRange:true,
      depts: depts
    });
  });
  // Extra classes — filter by dept (same logic as Calendar deptMatch)
  ((S.extraClasses||{})[yr]||[]).forEach(ec=>{
    if(!ec.start) return;
    const ecDepts = ec.depts||[];
    // Empty depts = applies to all; otherwise must include this dept or MASTER
    if(ecDepts.length>0 && !ecDepts.includes(dept) && !ecDepts.includes('MASTER')) return;
    list.push({ date:ec.start, endDate:ec.end||ec.start, name:ec.name||'Extra Class', cat:'EC', isRange:!!(ec.end&&ec.end!==ec.start), isEC:true, depts:ecDepts });
  });

  list.sort((a,b)=>a.date.localeCompare(b.date));
  return list.filter(h=>{
    const m = parseInt(h.date.slice(5,7));
    if(months.includes(m)) return true;
    if(h.isRange){
      const em = parseInt((h.endDate||h.date).slice(5,7));
      if(months.includes(em)) return true;
    }
    return false;
  });
}

function _noticeCopy(periodId, yr){
  const period = NOTICE_PERIODS.find(p=>p.id===periodId);
  const holidays = _filterPeriodHolidays(yr, period.months);
  const center = (S.meta && S.meta.centerName) || 'Academee';
  let txt = `*${center.toUpperCase()} - HOLIDAY NOTICE*\n*${period.label} ${yr} · ${period.labelCN} ${yr}*\n\n`;
  txt += `Dear Parents, please be informed of our holiday schedule for ${period.label} ${yr}:\n`;
  txt += `亲爱的家长，谨此通知本中心 ${period.labelCN} 的休假日如下：\n\n`;
  if(!holidays.length){
    txt += `(No holidays in this period / 此期间无假期)\n`;
  } else {
    holidays.forEach(h=>{
      const cn = NOTICE_NAME_CN[h.name] || h.name;
      const dateStr = h.isRange ? `${_fmtNoticeDate(h.date)} – ${_fmtNoticeDate(h.endDate)}` : _fmtNoticeDate(h.date);
      txt += `📅 ${dateStr}\n   ${h.name}\n   ${cn}\n\n`;

  }
  const pf = S.noticeFooters[periodId]||S.noticeFooters.p1;
  txt += `${pf.en}\n${pf.cn}\n\n— ${center} Management`;
  navigator.clipboard.writeText(txt).then(()=>alert('✓ Copied to clipboard!\n\nReady to paste into WhatsApp / WeChat.'))
  .catch(()=>{
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    alert('✓ Copied to clipboard!');
  });
}

// IMPORT / EXPORT
// ═══════════════════════════════════════════════════════════════════════════
function exportAll(){
  const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `NoticeGo-Holiday_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
function importAll(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const p = JSON.parse(e.target.result);
      if(!confirm('This will OVERWRITE all current holiday data with the imported file. Continue?')) return;
      if(p.holidayDates    && typeof p.holidayDates==='object')    S.holidayDates    = p.holidayDates;
      if(p.schoolHolDates  && typeof p.schoolHolDates==='object')  S.schoolHolDates  = p.schoolHolDates;
      if(p.specialHolidays && typeof p.specialHolidays==='object') S.specialHolidays = p.specialHolidays;
    if(p.srtDates && typeof p.srtDates==='object') S.srtDates = p.srtDates;
    if(p.noticeFooters && typeof p.noticeFooters==='object') S.noticeFooters = Object.assign({}, S.noticeFooters, p.noticeFooters);
      if(p.festivalDates   && typeof p.festivalDates==='object')   S.festivalDates   = p.festivalDates;
      if(p.extraClasses    && typeof p.extraClasses==='object')    S.extraClasses    = p.extraClasses;
      if(p.meta && typeof p.meta==='object') S.meta = Object.assign({}, S.meta, p.meta);
      saveAll();
      alert('Import successful!');
      location.reload();
    }catch(err){ alert('Import failed: '+err.message); }
  };
  reader.readAsText(file);
}
function clearAll(){
  if(!confirm('⚠️ This will DELETE all holiday data. This cannot be undone. Continue?')) return;
  if(!confirm('Really sure? Click OK to confirm deletion.')) return;
  localStorage.removeItem(STORAGE_KEY);
  location.reload();
}

// ═══════════════════════════════════════════════════════════════════════════
// LIVE READ from MasterHub Calendar (Supabase SSOT) — all date data, read-only
// ═══════════════════════════════════════════════════════════════════════════
async function _pullFromCalendar(){
  try{
    const { data, error } = await _sb.from('calendar_events').select('*');
    if(error) throw error;
    const TPL_IDS = (typeof SCHOOL_HOL_TEMPLATE!=='undefined') ? SCHOOL_HOL_TEMPLATE.map(t=>t.id) : [];
    const H={}, SHd={}, SP={}, FD={}, EC={}, SRT={};
    for(const r of (data||[])){
      const yr=String(r.year);
      const depts=Array.isArray(r.depts)?r.depts:[];
      const det=r.details||{};
      if(r.type==='public_holiday'){
        (H[yr]=H[yr]||{})[r.name]=r.start_date;
      } else if(r.type==='school_holiday'){
        const key=TPL_IDS.includes(r.name)?r.name:r.id;
        (SHd[yr]=SHd[yr]||{})[key]={ start:r.start_date, end:r.end_date, depts:depts, name:r.name };
      } else if(r.type==='festival'){
        (FD[yr]=FD[yr]||{})[r.name]={ start:r.start_date, end:r.end_date, days:(det.days||{}) };
      } else if(r.type==='extra_class'){
        (EC[yr]=EC[yr]||[]).push({ id:r.id, name:r.name, start:r.start_date, end:r.end_date, time:(det.time||''), msg:(det.msg||''), depts:depts });
      } else if(r.type==='dept_off' && (det.slot==='fri' || det.slot==='sat')){   // v39 · SRT 放假日（Calendar 卡 G）
        const g=(SRT[yr]=SRT[yr]||{ fridays:[], saturdays:[] }); g[det.slot==='fri'?'fridays':'saturdays'].push(r.start_date);
      } else if(r.type==='special_holiday'){
        (SP[yr]=SP[yr]||[]).push(Object.assign({ date:r.start_date, name:r.name }, det));
      }
    }
    S.holidayDates=H; S.schoolHolDates=SHd; S.specialHolidays=SP; S.festivalDates=FD; S.extraClasses=EC;
    // v39 · SRT 改由 Calendar 管：这台电脑以前存的 SRT 日期先留一份（只留一次），SRT 页会提醒还没搬进 Calendar 的日期
    try{ const has=Object.values(S.srtDates||{}).some(g=>[...(g.fridays||[]), ...(g.saturdays||[])].some(Boolean)); if(has && !localStorage.getItem(_SRT_LOCAL_KEY)) localStorage.setItem(_SRT_LOCAL_KEY, JSON.stringify(S.srtDates)); }catch(e){}
    Object.values(SRT).forEach(g=>{ g.fridays.sort(); g.saturdays.sort(); }); S.srtDates=SRT;
    await _pullDays();   // v39 · 每日结果表
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); }catch(e){}
    if(typeof render_home==='function') render_home();
    if(document.getElementById('page-holidays') && document.getElementById('page-holidays').classList.contains('on') && typeof render_holidays==='function') render_holidays();
    ['book','parent'].forEach(p=>{ const el=document.getElementById('page-'+p); if(el && el.classList.contains('on')) window['render_'+p](); });   // v39
  }catch(e){ console.error('Calendar live-read failed → using local cache', e); }
}


/* ═══ 共用 · 迷你月历（Calendar 总览与 NoticeGo 用同一份；2026-10-09）═══
   资料一律是「每日结果」的列（calendar_days 的格式：day / kind / name / depts / no_class / detail）。
   Calendar 用自己算出来的列（草稿年份也看得到）；NoticeGo 用云端已公布的列。两边画出来的规则一模一样。 */
const _CENTRE = ['PH1','PH2','SUB','OFF'];
const _dDay = r => String(r.day).slice(0,10);
const _dMatch = (r, dept) => !r.depts || !r.depts.length || !dept || dept==='MASTER' || r.depts.includes(dept);
const _stripPar = n => String(n||'').replace(/\s*\([^)]*\)/g,'').trim();
const _nextD = (ds,n) => { const d=new Date(ds+'T12:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const _isSunD = ds => new Date(ds+'T12:00:00').getDay()===0;
const _follows = (end, ds) => _nextD(end,1)===ds || (_isSunD(_nextD(end,1)) && _nextD(end,2)===ds);   // 中间隔一个星期日也算连着
function _runs(list){   // 「日期＋名字」→ 连续同名合成一段
  const out=[]; list.slice().sort((a,b)=>a.n.localeCompare(b.n)||a.d.localeCompare(b.d)).forEach(x=>{
    const cur=out[out.length-1];
    if(cur && cur.n===x.n && _follows(cur.end,x.d)){ cur.end=x.d; cur.ss.add(x.s); cur.kk.add(x.k); }
    else out.push({ n:x.n, start:x.d, end:x.d, ss:new Set([x.s]), kk:new Set([x.k]) });
  });
  return out;
}
function _centrePartsOf(rows){   // 全中心每一天里的每一个假期
  const per=[];
  (rows||[]).filter(r=>_CENTRE.includes(r.kind)).forEach(r=>{
    const its=(r.detail && r.detail.items && r.detail.items.length) ? r.detail.items : [{ n:r.name, s:'gazette' }];
    its.forEach(it=>per.push({ d:_dDay(r), n:(it.s==='sub'?_stripPar(it.n):it.n), s:it.s, k:r.kind, f:it.f }));
  });
  return per;
}
const _PAL_PARENT = { dark:'#5C1010', light:'#F2DADA', lightTxt:'#7A1E1E', wk:'#8B3030', we:'#3d1a1a', pad:'#faf9f7', cellBd:'#ede9e3', sec:['#faf8f5','#edecea','#f5f2ec','#fbeeee','#f5f0fa'], line:'1px solid #5C1010', dash:'1.5px dashed #C0A0A0', ttl:'#5C1010', cnOp:.7 };
const _PAL_BOOK   = { dark:'#000',    light:'#AAAAAA', lightTxt:'#000',    wk:'#555',    we:'#000',    pad:'#f8f8f8', cellBd:'#e0e0e0', sec:['#f8f8f8','#f0f0f0','#eee','#e4e4e4','#e8e8e8'], line:'1px solid #000',    dash:'1.5px dashed #aaa',    ttl:'#000',    cnOp:.6 };
/* opt.allDepts：Calendar 总览（全部门）。只有星期日涂黑；某部门不上课（SRT）不涂色，另列一段。
   没有 opt.allDepts：给家长看（某一个部门）。星期日涂黑；星期六 SRK / GAK / ATC 没课涂黑，SRT 有课（Owner 10/9）。 */
function _miniCal(yr, mo, allRows, dept, P, opt){
  opt=opt||{}; const all=!!opt.allDepts;
  const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const MC=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  const days=new Date(yr,mo,0).getDate(), ms=`${yr}-${String(mo).padStart(2,'0')}`, af=(new Date(yr,mo-1,1).getDay()+6)%7;
  const rows=(allRows||[]).filter(r=>all || _dMatch(r,dept)), byDay={};
  rows.forEach(r=>{ (byDay[_dDay(r)]=byDay[_dDay(r)]||[]).push(r); });
  const DARK={ bg:P.dark, txt:'#fff' }, LIGHT={ bg:P.light, txt:P.lightTxt }, WHITE={ bg:'#fff', txt:'#555' };
  const style=(ds,dow)=>{
    if(dow===6 || (!all && dow===5 && dept!=='SRT')) return DARK;   // SRT 星期六有课（Owner 10/9）
    const rs=byDay[ds]||[], c=rs.find(r=>_CENTRE.includes(r.kind));
    if(c){ const ss=((c.detail&&c.detail.items)||[]).map(i=>i.s); return (!ss.length || ss.some(s=>s!=='fest_off')) ? DARK : LIGHT; }
    if(!all && rs.some(r=>r.kind==='DEPT_OFF')) return DARK;
    if(rs.some(r=>r.kind==='SCHOOL')) return LIGHT;
    return WHITE;
  };
  let cells='';
  for(let i=0;i<af;i++) cells+=`<div style="min-height:26px;background:${P.pad};"></div>`;
  for(let d=1; d<=days; d++){
    const ds=`${ms}-${String(d).padStart(2,'0')}`, st=style(ds,(af+d-1)%7), rs=byDay[ds]||[], ec=rs.some(r=>r.kind==='EXTRA');
    const tip=[...new Set(rs.map(r=>r.name))].join(' · ');
    cells+=`<div title="${escapeHTML(tip)}" style="min-height:26px;padding:2px;background:${st.bg};border:1px solid ${st===WHITE?P.cellBd:'transparent'};display:flex;flex-direction:column;align-items:center;justify-content:center;">
      <span style="font-size:11px;font-weight:700;color:${st.txt};line-height:1;">${d}</span>
      ${ec?`<span style="font-size:7px;line-height:1;color:${st===DARK?'#fff':st===LIGHT?P.lightTxt:P.dark}">★</span>`:''}</div>`;
  }
  const rem=(af+days)%7; if(rem>0) for(let i=0;i<7-rem;i++) cells+=`<div style="min-height:26px;background:${P.pad};"></div>`;
  const inM = (a,b) => a<=ms+'-31' && (b||a)>=ms+'-01';
  const line = t => `<div style="font-size:9px;line-height:1.6">${t}</div>`;
  const ph=[];
  for(let d=1; d<=days; d++){
    const ds=`${ms}-${String(d).padStart(2,'0')}`, c=(byDay[ds]||[]).find(r=>_CENTRE.includes(r.kind)); if(!c) continue;
    const its=((c.detail&&c.detail.items)||[{ n:c.name, s:'gazette' }]).filter(i=>i.s!=='fest_off' && i.s!=='closure');
    if(its.length) ph.push(`<div style="font-size:9px;line-height:1.6;font-weight:700"><b>${d}</b> ${escapeHTML([...new Set(its.map(i=>i.s==='sub'?_stripPar(i.n):i.n))].join(' / '))}</div>`);
  }
  const shM={}; rows.filter(r=>r.kind==='SCHOOL').forEach(r=>{ const a=(r.detail||{}).start||_dDay(r), b=(r.detail||{}).end||_dDay(r); if(!inM(a,b)) return; const k=r.name+'|'+a+'|'+b;
    if(!shM[k]) shM[k]={ a, b, n:r.name, dp:new Set() }; (r.depts||[]).forEach(x=>shM[k].dp.add(x)); });
  const sh=Object.values(shM).sort((x,y)=>x.a.localeCompare(y.a)).map(x=>line(`${_ddmmS(x.a)} – ${_ddmmS(x.b)} (${escapeHTML(String(x.n).replace(/^School Holiday \((.+)\)$/,'$1'))})${all&&x.dp.size?' · '+escapeHTML([...x.dp].sort().join(' ')):''}`));
  const parts=_centrePartsOf(rows);
  const fest=_runs(parts.filter(p=>p.f).map(p=>({ d:p.d, n:p.f, s:p.s, k:p.k }))).filter(g=>inM(g.start,g.end)).sort((x,y)=>x.start.localeCompare(y.start)).map(g=>line(`${_ddmmS(g.start)} – ${_ddmmS(g.end)} (${escapeHTML(g.n)})`));
  const clo=_runs(parts.filter(p=>p.s==='closure')).filter(g=>inM(g.start,g.end)).map(g=>({ a:g.start, t:`${_ddmmS(g.start)}${g.end!==g.start?' – '+_ddmmS(g.end):''} (${escapeHTML(g.n)})` }));
  const dOff=rows.filter(r=>r.kind==='DEPT_OFF' && _dDay(r).startsWith(ms));
  dOff.forEach(r=>clo.push({ a:_dDay(r), t:`${_ddmmS(_dDay(r))} (${escapeHTML(r.name)})` }));
  const cl=clo.sort((x,y)=>x.a.localeCompare(y.a)).map(x=>line(x.t));
  const ecG={}; rows.filter(r=>r.kind==='EXTRA').forEach(r=>{ const a=(r.detail||{}).start||_dDay(r), b=(r.detail||{}).end||_dDay(r); if(!inM(a,b)) return; const k=a+'|'+b; if(!ecG[k]) ecG[k]={ a, b, e:[] };
    const lbl=[r.name&&r.name!=='Extra Class'?r.name:'', (r.detail||{}).time||'', (r.detail||{}).msg||'', all&&r.depts&&r.depts.length?r.depts.join(' '):''].filter(Boolean).join(' · '); if(lbl && !ecG[k].e.includes(lbl)) ecG[k].e.push(lbl); });
  const ec=Object.values(ecG).sort((x,y)=>x.a.localeCompare(y.a)).map(g=>`<div style="font-size:9px;line-height:1.7"><b>${_ddmmS(g.a)}${g.b!==g.a?' – '+_ddmmS(g.b):''}</b>${g.e.length?' <span style="font-weight:400">'+escapeHTML(g.e.join(' / '))+'</span>':''}</div>`);
  const sec=(bd,bg,title,body)=>`<div style="padding:6px 10px;border-top:${bd};background:${bg};"><div style="font-size:8px;font-weight:700;color:${P.ttl};text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;">${title}</div>${body.join('')}</div>`;
  let secs='';
  if(ph.length)   secs+=sec(P.line, P.sec[0], 'Public Holiday', ph);
  if(sh.length)   secs+=sec(ph.length?P.dash:P.line, P.sec[1], 'KPM School Holiday', sh);
  if(fest.length) secs+=sec(P.line, P.sec[2], 'Our Festive Holidays', fest);
  if(cl.length)   secs+=sec(fest.length?P.dash:P.line, P.sec[3], dOff.length?'Centre Closed / No Class':'Centre Closed', cl);
  if(ec.length)   secs+=sec((fest.length||cl.length)?P.dash:P.line, P.sec[4], '★ Our Extra Learning Day', ec);
  if(!secs) secs=`<div style="border-top:${P.line};min-height:4px;"></div>`;
  return `<div style="border:2px solid ${P.dark};border-radius:6px;overflow:hidden;font-family:Arial,sans-serif;background:#fff;">
    <div style="background:${P.dark};color:#fff;padding:7px 12px;display:flex;justify-content:space-between;align-items:center;">
      <span style="font-weight:700;font-size:12px;">${MN[mo-1]} ${yr}</span><span style="font-size:10px;opacity:${P.cnOp};">${MC[mo-1]}</span></div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);">${['M','T','W','T','F','S','S'].map((x,i)=>`<div style="text-align:center;font-size:9px;font-weight:700;padding:4px 0;background:${(i===6||(!all&&i===5&&dept!=='SRT'))?P.we:P.wk};color:#fff;">${x}</div>`).join('')}</div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);border-bottom:${P.line};">${cells}</div>
    ${secs}</div>`;
}

// v39 · 2026-10-09 · 改读 MasterHub Calendar 的「每日结果表」calendar_days
//   以前（v38）：自己读 calendar_events、自己算补假。结果：中心关门周不出现、2026 学校假期印出代码
//   （sh_midterm2）、自订节日不出现、补假讲法跟 Calendar 不一样。
//   现在：Calendar 公布后把每一天的结果写好，这里照着印。
//   哪一年还没有每日结果（表还没建 / 还没写），那一年照旧用 v38 的算法，画面不会空掉。

let _DAYS = {};
const _SRT_LOCAL_KEY = 'academee_holidaygo_srt_local_before_v39';
async function _pullDays(){
  try{
    const { data, error } = await _sb.from('calendar_days').select('year,day,kind,name,depts,no_class,detail');
    if(error) throw error;
    const by = {}; (data||[]).forEach(r=>(by[r.year]=by[r.year]||[]).push(r)); _DAYS = by;
  }catch(e){ console.warn('calendar_days not readable → using the v38 way', e); _DAYS = {}; }
}
function _dOK(yr){ return !!(_DAYS[yr] && _DAYS[yr].length); }
const _centreParts = yr => _centrePartsOf(_DAYS[yr]);
function _v39Items(yr, dept, withEC){
  const out=[];
  _runs(_centreParts(yr)).forEach(g=>{
    const cat = g.ss.has('sub') ? 'SUB' : g.ss.has('closure') ? 'CLOSED' : g.ss.has('fest') ? 'PH2' : g.ss.has('fest_off') ? 'FEST_OFF' : (g.kk.has('PH1') ? 'PH1' : g.kk.has('PH2') ? 'PH2' : 'OFF');
    out.push({ date:g.start, endDate:g.end, isRange:g.end!==g.start, name:g.n, cat });
  });
  const grp = (rows, key) => { const m={}; rows.forEach(r=>{ const k=key(r); (m[k]=m[k]||[]).push(r); }); return Object.values(m); };
  const rows=(_DAYS[yr]||[]);
  const sch=rows.filter(r=>r.kind==='SCHOOL' && (dept ? _dMatch(r,dept) : true));
  grp(sch, r=>r.name+'|'+((r.detail||{}).start||'')+'|'+((r.detail||{}).end||'')).forEach(a=>{
    const ds=a.map(_dDay).sort(); out.push({ date:ds[0], endDate:ds[ds.length-1], isRange:true, name:a[0].name, cat:'SH', depts:(a[0].depts&&a[0].depts.length?a[0].depts:['SRK','GAK','ATC','SRT']) });
  });
  if(dept && dept!=='MASTER'){
    _runs(rows.filter(r=>r.kind==='DEPT_OFF' && _dMatch(r,dept)).map(r=>({ d:_dDay(r), n:r.name, s:'dept', k:r.kind }))).forEach(g=>out.push({ date:g.start, endDate:g.end, isRange:g.end!==g.start, name:g.n, cat:'DOFF' }));
  }
  if(withEC){
    grp(rows.filter(r=>r.kind==='EXTRA' && _dMatch(r,dept)), r=>r.name+'|'+((r.detail||{}).start||_dDay(r))+'|'+((r.detail||{}).end||_dDay(r))).forEach(a=>{
      const ds=a.map(_dDay).sort(); out.push({ date:ds[0], endDate:ds[ds.length-1], isRange:ds.length>1, name:a[0].name, cat:'EC', isEC:true, depts:a[0].depts||[] });
    });
  }
  return out.sort((a,b)=>a.date.localeCompare(b.date) || a.name.localeCompare(b.name));
}
function _inMonths(h, months){
  const m=+h.date.slice(5,7), em=+(h.endDate||h.date).slice(5,7);
  for(let k=m; k<=em; k++) if(months.includes(k)) return true;
  return false;
}

_filterPeriodHolidaysForDept = function(yr, months, dept){ return _dOK(yr) ? _v39Items(yr, dept, true).filter(h=>_inMonths(h,months)) : _v38.dept(yr, months, dept); };
_buildNoticeMiniCal = function(yr, mo, allHol, dept){ return _dOK(yr) ? _v39Mini(yr, mo, dept||'SRK', _PAL_PARENT) : _v38.mini(yr, mo, allHol, dept); };
_buildBookMiniCal   = function(yr, mo, allHol, dept){ return _dOK(yr) ? _v39Mini(yr, mo, dept||'SRK', _PAL_BOOK)   : _v38.book(yr, mo, allHol, dept); };
_homeUpcoming = function(yr){
  if(!_dOK(yr)) return _v38.upcoming(yr);
  const today=new Date().toISOString().slice(0,10);
  const next=_v39Items(yr, null, false).filter(h=>h.cat!=='SH' && (h.endDate||h.date)>=today).slice(0,6);

  return `<table class="data" style="margin-top:6px"><thead><tr><th>Date</th><th>Day</th><th>Holiday</th><th style="text-align:center">Type</th></tr></thead><tbody>${next.map(r=>{
    const dow=new Date(r.date+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short'});
    return `<tr><td style="font-weight:600;white-space:nowrap">${_ddmmL(r.date)}${r.isRange?' – '+_ddmmL(r.endDate):''}</td><td style="color:var(--mut)">${dow}</td><td>${escapeHTML(r.name)}</td><td style="text-align:center">${_catBadge(badge[r.cat]||r.cat)}</td></tr>`; }).join('')}</tbody></table>`;
};
