<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LoveGo Test</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:#171717;font-family:system-ui,-apple-system,sans-serif}.top{background:#98751f;color:#fff;padding:14px 18px;font-size:22px;font-weight:900}.top small{background:#f2ca50;color:#5d4708;border-radius:8px;padding:4px 9px;margin-left:10px}.wrap{max-width:900px;margin:auto;padding:28px 22px}h1{font-size:38px;line-height:1.12;margin:18px 0 8px}.mut{color:#747474}.panel,.start{background:#fff;border:1px solid #e3dfd7;border-radius:22px;padding:22px;margin:20px 0}.title{font-weight:850;color:#667085;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.btn{border:1px solid #dedad3;border-radius:18px;background:#fff;padding:19px;text-align:left;min-height:96px}.btn b{display:block;font-size:22px}.btn span{color:#777}.btn.on{outline:3px solid #a98b49}.dept.on{background:#c95d5d;color:#fff;outline:0}.start{display:flex;align-items:center;justify-content:space-between;gap:16px}.go{border:0;border-radius:16px;background:#98751f;color:#fff;font-size:18px;font-weight:850;padding:16px 22px}.go:disabled{opacity:.35}.hide{display:none!important}.students{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.student{background:#fff;border:1px solid #dedad3;border-radius:16px;padding:15px;text-align:left}.student b{display:block}.num{font-size:23px;font-weight:900}.pill{display:inline-block;margin-top:8px;background:#fde8e8;color:#a92929;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}@media(max-width:600px){h1{font-size:32px}.wrap{padding:24px 18px}.start{display:block}.go{width:100%;margin-top:14px}}</style></head><body><div class="top">💗 LoveGo <small>WEB TEST v25</small></div><main class="wrap"><section id="home"><div style="color:#98751f;font-weight:900;letter-spacing:.12em">LOVEGO</div><h1>这一轮，你要完成哪些学生？</h1><div class="mut">统一网页测试入口 · 不再使用下载 HTML</div><div class="panel"><div class="title">① 部门</div><div class="grid" id="dg"></div></div><div class="panel hide" id="cp"><div class="title">② 班级</div><div class="grid" id="cg"></div></div><div class="panel hide" id="ep"><div class="title">③ 环节</div><div class="grid" id="eg"></div></div><div class="start"><div><b id="sum">请选择部门与班级</b><div class="mut" id="meta">选择后开始填写 LoveGo</div></div><button id="go" class="go" disabled>开始填写 →</button></div></section><section id="work" class="hide"><button onclick="back()">← 回主页</button><h1 id="wt">学生观察</h1><div class="mut" id="wm"></div><div class="panel"><div class="title">学生观察 · 全班学生</div><div class="students" id="sg"></div></div></section></main><script>const C={SRK:[['BB 1',11],['IN 1',14],['IN 2',15],['JR 1',16],['JR 2',15],['SR 1',15],['SR 2',14],['SR 3',8]],GAK:[['BB 1',14],['IN 1',21],['JR 1',14],['SR 1',17],['SR 2',16]],ATC:[['A1',14],['A2',12],['A3',17],['A4',13],['A5',10],['A6',7]],SRT:[['LV2 · FRI PM',0],['LV3 · FRI PM',0],['LV4 · SAT AM',0],['LV4 · SAT NN',0],['LV5 · SAT PM',0]]};let S={d:'',c:'',n:0,e:''};const $=x=>document.getElementById(x);function stages(){if(S.d==='GAK'){let a=[['transition','下午班转换'],['bath','沐浴'],['lunch','午餐'],['homework','功课'],['learning','上课']];if(/^(BB|JR)/.test(S.c))a.push(['nap','睡觉 · 3–4岁']);return a}if(S.d==='ATC')return [['homework','功课班'],['lesson','上课班']];return []}function render(){dg.innerHTML=['SRK','GAK','ATC','SRT'].map(d=>`<button class="btn dept ${S.d===d?'on':''}" onclick="pd('${d}')"><b>${d}</b><span>${C[d].length} 班</span></button>`).join('');cp.classList.toggle('hide',!S.d);cg.innerHTML=S.d?C[S.d].map(x=>`<button class="btn ${S.c===x[0]?'on':''}" onclick="pc('${x[0]}',${x[1]})"><b>${x[0]}</b><span>${x[1]} 位在籍</span></button>`).join(''):'';let e=stages();ep.classList.toggle('hide',!S.c||!e.length);eg.innerHTML=e.map(x=>`<button class="btn ${S.e===x[0]?'on':''}" onclick="pe('${x[0]}')"><b>${x[1]}</b></button>`).join('');let ready=S.c&&(!e.length||S.e);go.disabled=!ready;sum.textContent=S.c?`${S.d} · ${S.c}${S.e?' · '+(e.find(x=>x[0]===S.e)||[])[1]:''}`:'请选择部门与班级';meta.textContent=S.c&&e.length&&!S.e?'班级已选择 · 请选择负责环节':S.c?`${S.n} 位在籍 · LoveGo Review`:'选择后开始填写 LoveGo'}function pd(d){S={d,c:'',n:0,e:''};render()}function pc(c,n){S.c=c;S.n=n;S.e='';render()}function pe(e){S.e=e;render()}go.onclick=()=>{home.classList.add('hide');work.classList.remove('hide');wt.textContent=`${S.d} · ${S.c} · 学生观察`;wm.textContent=(stages().find(x=>x[0]===S.e)?.[1]||'')+' · 全班学生';sg.innerHTML=Array.from({length:S.n},(_,i)=>`<button class="student"><b>Preview Student ${i+1}</b><span class="mut">学生观察</span><div class="num">${i+1} 号</div><span class="pill">待填写</span></button>`).join('')};function back(){work.classList.add('hide');home.classList.remove('hide')}render();</script></body></html>
