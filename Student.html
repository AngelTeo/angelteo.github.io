  } catch (e) {
    alert('Import failed: ' + e.message);
  }
};

function titleCase(str) {
  if (!str) return '';
  return str.toLowerCase().replace(/(?:^|\s|\/)\S/g, function(c) { return c.toUpperCase(); });
}

window.printDeptNamelist = function(dept) {
  if (dept === 'SRK' || dept === 'GAK') { printSrkGak(); return; }
  if (dept === 'ATC') { printGenericDept('ATC', 'Academee — ATC Namelist', 3); return; }
  if (dept === 'SRT') { printSrt(); return; }
  window.print();
};

function printSrkGak() {
  var GROUP_ORDER = ['SR', 'IN', 'JR', 'BB', 'RSVP'];
  var srkClasses = getClasses('SRK');

  var groups = {};
  srkClasses.forEach(function(cn) {
    /* v26 · 旧版用 cn.replace('SRK-','').split('.')[0] 取前缀，那是旧班名写法。
       现在班码是 SRK_SR_1，这样算出来的前缀会变成 "SRK_SR_"，
       跟 GROUP_ORDER 的 'SR' 永远对不上 —— 分组等於是坏的。
       改用 classStage() 统一判定。 */
    var prefix = classStage(cn) || 'OTHER';
    if (!groups[prefix]) groups[prefix] = [];
    groups[prefix].push(cn);
  });

  // Sort within each group
  Object.keys(groups).forEach(function(k) {

  var css = [

    '.legend b {font-weight:600;}',
    '.row {display:flex;gap:8px;margin-bottom:6px;page-break-inside:avoid;}',
    '.cls {flex:1;min-width:0;}',
    '.cls-hdr {font-weight:700;font-size:8px;text-align:center;border-bottom:1.2px solid #333;padding:2px 0 1px;}',
    '.cls-sub {font-size:6.5px;text-align:center;color:#222;margin-bottom:1px;}',
    '.tbl {width:100%;border-collapse:collapse;}',

    '.ft span {margin:0 4px;}',
    '.summary {text-align:center;font-size:7px;color:#222;margin-top:4px;border-top:.5px solid #ccc;padding-top:2px;}'
  ].join('\n');

  var body = '<div class="title">Academee — SRK + GAK Namelist</div>';
  body += '<div class="date">' + new Date().toLocaleDateString('en-MY', {year:'numeric',month:'long',day:'numeric'}) + '</div>';
  body += '<div class="legend"><b>White</b> = SRK only &nbsp;&nbsp; <span style="background:#e8e8e8;padding:1px 6px"><b>Light grey</b> = GAK 530</span> &nbsp;&nbsp; <span style="background:#d0d0d0;padding:1px 6px"><b>Dark grey</b> = GAK 300</span></div>';

  GROUP_ORDER.forEach(function(prefix) {

    for (var p = clsList.length; p < 3; p++) {

    '.cls-hdr {font-weight:700;font-size:7px;text-align:center;border-bottom:1px solid #333;padding:1px 0;}',

    '.empty-cls {flex:1;min-width:0;}',

  ].join('\n');

  var body = '<div class="title">Academee \u2014 SRT Namelist</div>';
  body += '<div class="date">' + new Date().toLocaleDateString('en-MY', {year:'numeric',month:'long',day:'numeric'}) + '</div>';
  body += '<div style="text-align:center;font-size:6.5px;margin-bottom:4px;color:#666"><b>White</b> = SRT only &nbsp;&nbsp; <span style="background:#ddd;padding:0 4px"><b>Grey</b> = also in SRK/GAK/ATC</span></div>';

  // Column headers

    '.tbl .a {width:14px;text-align:right;color:#222;font-size:7px;}',

  ].join('\n');

  body += '<div class="date">' + new Date().toLocaleDateString('en-MY', {year:'numeric',month:'long',day:'numeric'}) + '</div>';

  // Chunk classes into rows
  for (var i = 0; i < classList.length; i += colsPerRow) {
    // Calculate max roster in this row

function buildPrintClass(dept, className, minRows) {
  var roster = getClassRoster(dept, className);
  var short = clsName(dept, className).replace(dept + '-', '');
  var label = short.replace(/\./g, ' ');

  var h = '<div class="cls">';
  h += '<div class="cls-hdr">' + esc(clsName(dept, className)) + '</div>';
  h += '<div class="cls-sub">' + esc(label) + '</div>';
  h += '<table class="tbl">';

  var boys = 0, girls = 0;
  roster.forEach(function(r, i) {
    var s = r.student, m = r.membership;

    // Detect cross-dept for highlighting
    var gakTier = null;
    var hasCrossDept = false;
    for (var mi = 0; mi < s.memberships.length; mi++) {
      var mb = s.memberships[mi];
      // SRK print: detect GAK tier
      if (dept === 'SRK' && mb.dept === 'GAK' && mb.tier) {
        gakTier = mb.tier;
        if (gakTier === '300') break;
      }
      // SRT print: detect if also in SRK/GAK/ATC
      if (dept === 'SRT' && (mb.dept === 'SRK' || mb.dept === 'GAK' || mb.dept === 'ATC')) {
        hasCrossDept = true;
      }
    }

    var nameCls = '';
    var numCls = 'n';
    if (gakTier === '300') { nameCls = 'g300'; numCls = 'n g300n'; }
    else if (gakTier === '530') { nameCls = 'g530'; }
    else if (hasCrossDept) { nameCls = 'g530'; }
    var age = getAge(s.birth_year);

    if (s.gender === 'B') boys++;
    else if (s.gender === 'G') girls++;

    h += '<tr>';
    h += '<td class="' + numCls + '">' + (m.num || (i + 1)) + '</td>';
    h += '<td class="' + nameCls + '">' + titleCase(s.name) + '</td>';
    h += '<td class="a">' + (age != null ? age : '') + '</td>';
    h += '</tr>';
  });

  // Pad empty rows to align with other classes in same row
  var padTo = minRows || 0;
  for (var p = roster.length; p < padTo; p++) {
    h += '<tr><td class="n" style="color:transparent">' + (p + 1) + '</td><td>&nbsp;</td><td class="a"></td></tr>';
  }

  h += '</table>';
  h += '<div class="ft"><span>B: ' + boys + '</span><span>G: ' + girls + '</span></div>';
  h += '</div>';
  return h;
}

// ══ AUTH ══
async function doLogin(){
  const email=document.getElementById('auth-email').value.trim();
  const pass=document.getElementById('auth-pass').value;
  const errEl=document.getElementById('auth-err');
  errEl.textContent='';
  if(!email){errEl.textContent='Please enter email';return;}
  if(!pass){errEl.textContent='Please enter password';return;}
  const btn=document.getElementById('auth-login-btn');
  btn.disabled=true;btn.textContent='Logging in...';
  try{
    const{error}=await _sb.auth.signInWithPassword({email,password:pass});
    if(error)throw error;
    await initApp();
  }catch(e){errEl.textContent=e.message||'Login failed';btn.disabled=false;btn.textContent='Login';}
}
async function doMagicLink(){
  const email=document.getElementById('auth-email').value.trim();
  const errEl=document.getElementById('auth-err');
  errEl.textContent='';
  if(!email){errEl.textContent='Please enter email';return;}
  const btn=document.getElementById('auth-magic-btn');
  btn.disabled=true;btn.textContent='Sending...';
  try{
    const{error}=await _sb.auth.signInWithOtp({email});
    if(error)throw error;
    errEl.style.color='#0F6E56';errEl.textContent='✓ Check your email for the login link';
  }catch(e){errEl.textContent=e.message||'Failed to send';}
  btn.disabled=false;btn.textContent='Send Magic Link';
}
document.addEventListener('DOMContentLoaded',()=>{
  ['auth-email','auth-pass'].forEach(id=>{
    const el=document.getElementById(id);
    if(el)el.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
  });
});
async function initApp(){
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('loading-screen').style.display='flex';
  try {
    await initData();
    if (S.meta.last_updated) safeSet('last-saved', 'Saved ' + new Date(S.meta.last_updated).toLocaleTimeString('en-GB'));
    document.getElementById('loading-screen').style.display='none';
    renderCurrentPage('dashboard');
  } catch (e) {
    console.error('init failed:', e);
    document.getElementById('loading-screen').style.display='none';
    /* v26 · 失败画面改成安全的：只给「重新整理」。
       旧版给的是「Wipe localStorage and reload」—— 读不到资料的时候清本机，
       只会让情况更糟，而且使用者会以为那是修复动作。 */
    document.body.innerHTML =
      '<div style="max-width:520px;margin:60px auto;padding:28px;font-family:system-ui;line-height:1.7">'
      + '<h2 style="margin:0 0 12px">读不到资料</h2>'
      + '<p style="margin:0 0 6px"><b>没有任何资料被改动。</b>现有的学生与班籍资料都还在云端，完好无缺。</p>'
      + '<p style="color:#666;margin:0 0 18px">原因：' + esc(e.message) + '</p>'
      + '<button onclick="location.reload()" style="padding:10px 18px;font-size:15px">重新整理</button>'
      + '<p style="color:#666;font-size:13px;margin-top:18px">重新整理两三次还是这样，请截图找管理层。'
      + '<br>不要清浏览器资料，那不会修好这个问题。</p></div>';
  }
}

// ===================== INIT =====================
(async () => {
  const { data: { session } } = await _sb.auth.getSession();
  if (session) { await initApp(); }
})();
window.addEventListener('beforeunload', (ev) => {
  try { const payload={students:S.students,classes:S.classes,meta:{...S.meta,last_updated:new Date().toISOString()}}; localStorage.setItem(STORAGE_KEY,JSON.stringify(payload)); } catch(e){}
  /* v31 · 有未上云资料时，离开页面前拦一下，逼使用者先 Export */
  try{
    if(localStorage.getItem(PENDING_KEY) === '1' || UNSYNCED){
      ev.preventDefault();
      ev.returnValue = '有资料还没存进云端。离开前请先 Export 备份。';
      return ev.returnValue;
    }
  }catch(e){}
});
