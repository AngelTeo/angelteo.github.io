<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MasterHub — Calendar v16</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --acc:#5C1010; --grn:#0F6E56; --org:#854F0B; --red:#A32D2D; --pur:#534AB7;
  --sur:#ffffff; --sur2:#f7f6f2; --bdr:#e0ddd6;
  --txt:#1a1a1a; --mut:#888888; --hint:#bbbbbb;
  --layer:#5C1010; --d-srk:#C45C5C; --d-gak:#E8A04E; --d-atc:#7AB05A; --d-srt:#8B6CAE;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:var(--sur2);color:var(--txt);font-size:13px;line-height:1.4}

/* NAV */
.nav{background:var(--layer);border-bottom:.5px solid rgba(0,0,0,.2);
  display:flex;align-items:center;padding:0 16px;position:sticky;top:0;z-index:50;
  overflow-x:auto;gap:0}
.nav-logo{font-size:13px;font-weight:600;padding:12px 14px 12px 0;
  border-right:.5px solid rgba(255,255,255,.2);margin-right:4px;white-space:nowrap;
  flex-shrink:0;color:#fff}
.ver{background:#F9CB42;color:var(--layer);border-radius:4px;padding:1px 6px;font-size:10px;font-weight:700;margin-left:4px;vertical-align:middle}
.ntab{padding:11px 14px;font-size:11px;color:rgba(255,255,255,.7);cursor:pointer;
  border:none;background:transparent;border-bottom:2.5px solid transparent;
  transition:all .15s;white-space:nowrap;flex-shrink:0;font-family:inherit}
.ntab:hover{color:#fff}
.ntab.on{color:#fff;border-bottom-color:#fff;font-weight:600}
.nav-r{margin-left:auto;display:flex;gap:5px;align-items:center;padding-left:10px;flex-shrink:0}

/* BUTTONS */
.btn{padding:5px 12px;border-radius:6px;border:.5px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.12);color:#fff;font-size:11px;cursor:pointer;
  font-family:inherit;transition:opacity .15s;white-space:nowrap}
.btn:hover{opacity:.85}
.btn-pri{background:#fff;color:#5C1010;border-color:#fff;font-weight:600}
.btn-plain{background:var(--sur);border:.5px solid var(--bdr);color:var(--txt);font-size:11px;
  padding:5px 12px;border-radius:6px;cursor:pointer;font-family:inherit}
.btn-plain:hover{background:var(--sur2)}
.btn-grn{background:var(--grn);color:#fff;border:none;font-weight:500;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:11px;font-family:inherit}
.btn-red{background:var(--red);color:#fff;border:none;padding:4px 10px;border-radius:5px;cursor:pointer;font-size:10px;font-family:inherit}

.saved{font-size:10px;color:var(--grn);margin-right:8px;display:none}

/* PAGES */
.page{display:none;padding:16px;max-width:1400px;margin:0 auto}
.page.on{display:block}

/* CARDS */
.card{background:var(--sur);border:.5px solid var(--bdr);border-radius:10px;
  padding:16px;margin-bottom:12px}
.card-hdr{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;flex-wrap:wrap;gap:8px}
.card-title{font-size:11px;font-weight:500;color:var(--mut);
  letter-spacing:.05em;text-transform:uppercase}

/* TABLES */
table.data{width:100%;border-collapse:collapse;font-size:12px}
table.data thead th{background:#2d2d2d;color:#fff;padding:9px 12px;text-align:left;
  font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  white-space:nowrap;position:sticky;top:0}
table.data tbody td{padding:8px 12px;border-bottom:.5px solid var(--bdr);vertical-align:middle}
table.data tbody tr:nth-child(even){background:var(--sur2)}
table.data tbody tr:hover{background:#FFF9E6}

/* INPUTS */
input[type=text],input[type=number],input[type=date],input[type=email],
input[type=tel],select,textarea{
  border:.5px solid var(--bdr);border-radius:6px;padding:6px 10px;
  font-size:12px;font-family:inherit;background:var(--sur);color:var(--txt);
  min-width:120px;box-sizing:border-box}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--layer)}

/* BADGES */
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;
  font-weight:600;white-space:nowrap}
.b-srk{background:rgba(196,92,92,.12);color:#C45C5C}
.b-gak{background:rgba(232,160,78,.12);color:#E8A04E}
.b-atc{background:rgba(122,176,90,.12);color:#7AB05A}
.b-srt{background:rgba(139,108,174,.12);color:#8B6CAE}
.b-active{background:#E1F5EE;color:#0F6E56}
.b-inactive{background:#FCEBEB;color:#A32D2D}
.b-sensitive{background:#FFF3CD;color:#854F0B;border:.5px solid #ffc107}

/* SUB NAV */
.sub-nav{background:var(--sur);border-bottom:.5px solid var(--bdr);
  padding:0 16px;gap:2px;position:sticky;top:44px;z-index:49;
  display:flex;overflow-x:auto;align-items:center;min-height:38px}
.sub-ntab{padding:9px 14px;font-size:11px;color:var(--mut);cursor:pointer;
  border:none;background:transparent;border-bottom:2px solid transparent;
  transition:all .15s;white-space:nowrap;flex-shrink:0;font-family:inherit}
.sub-ntab:hover{color:var(--txt)}
.sub-ntab.on{color:var(--layer);border-bottom-color:var(--layer);font-weight:600}

/* MISC */
.tip{font-size:11px;color:var(--mut);margin:8px 0}
.empty{text-align:center;padding:40px 20px;color:var(--hint);font-size:12px}

/* STATS CARDS */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat-card{background:var(--sur);border:.5px solid var(--bdr);border-radius:10px;padding:14px 16px}
.stat-n{font-size:26px;font-weight:700;color:var(--layer)}
.stat-l{font-size:10px;color:var(--mut);margin-top:2px;text-transform:uppercase;letter-spacing:.05em}

  /* ── Print styles ── */
  @media print {
    /* Hide everything except the calendar content */
    body { background: #fff !important; margin: 0 !important; }
    .nav { display: none !important; }
    .sub-nav { display: none !important; }
    .no-print { display: none !important; }
    .print-only { display: block !important; }
    /* Hide all pages except holidays */
    .page { display: none !important; }
    #page-holidays { display: block !important; }
    /* Hide the holidays sub-nav and controls */
    #page-holidays .sub-nav { display: none !important; }
    /* Show only the calendar tab content */
    #hol-tab-content { padding: 0 !important; }
    /* 4-column calendar grid */
    #cal-grid { grid-template-columns: repeat(4, 1fr) !important; gap: 8px !important; }
    /* Force colors to print */
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    /* Remove scrollbar space */
    ::-webkit-scrollbar { display: none !important; }
    /* Remove any horizontal scroll containers */
    .page { overflow: visible !important; }
  }

/* ══════ AUTH SCREEN ══════ */
.auth-screen{position:fixed;inset:0;background:var(--sur2);z-index:9000;
  display:flex;align-items:center;justify-content:center;padding:20px}
.auth-box{background:var(--sur);border:.5px solid var(--bdr);border-radius:12px;
  padding:32px 28px;width:340px;max-width:100%;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.auth-title{font-size:16px;font-weight:700;text-align:center;margin-bottom:4px;color:var(--layer)}
.auth-sub{font-size:11px;color:var(--mut);text-align:center;margin-bottom:20px}
.auth-row{margin-bottom:14px}
.auth-row label{font-size:11px;color:var(--mut);display:block;margin-bottom:4px}
.auth-row input{width:100%;padding:8px 10px;border:.5px solid var(--bdr);border-radius:6px;
  font-size:13px;font-family:inherit;background:var(--sur);color:var(--txt)}
.auth-row input:focus{outline:none;border-color:var(--layer)}
.auth-btn{width:100%;padding:10px;border-radius:6px;border:none;font-size:13px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:opacity .15s}
.auth-btn-pri{background:var(--layer);color:#fff}
.auth-btn-sec{background:transparent;color:var(--layer);border:.5px solid var(--layer);margin-top:8px}
.auth-btn:hover{opacity:.85}
.auth-btn:disabled{opacity:.5;cursor:not-allowed}
.auth-err{font-size:11px;color:var(--danger,#A32D2D);text-align:center;margin-top:10px;min-height:16px}
.auth-or{text-align:center;font-size:10px;color:var(--hint);margin:12px 0}
</style>
</head>

<div class="nav">

<script>
// ═══════════════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════════════
const STORAGE_KEY = 'masterhub_calendar_v6';
const APP_VERSION = 16;

/* ══════════════════════════════════════════════════════════════════
   v13 · 2026-09-25 · 存档统一逻辑（claude/Academee_存档统一逻辑_提案_20260924.md 五条规则）
   以前（vv12）：云端拒绝储存 → 只写 console，角落照样显示「Saved HH:MM」；
        改动只在记忆体里，使用者一 refresh 就永久消失（跟 24-09 Teacher v14 同一种死法）。
   现在：① 每次改动先写进这台电脑（pending 旗标），云端真的成功才清掉
        ② 载入时有 pending → 不准用云端盖掉；跳视窗列出「你会失去什么」让人选
        ③ 指示器只看云端：☁ 已同步 · HH:MM ／ ⚠ 未上云（红字常驻）／ 失败 = 红色横幅直到下次成功
        ④ 有未上云资料时离开页面要拦
        ⑤ 推云只走一个出口 _syncRun()，同时多次改动会排队合并，不会互相踩
   ══════════════════════════════════════════════════════════════════ */
const SYNC_SYS    = 'Calendar';
const PENDING_KEY = 'masterhub_calendar_pending';   /* {data, loadedIds, t}：这台电脑上还没进云端的那一份 */
const BACKUP_KEY  = 'masterhub_calendar_backup';   /* 覆盖 / 放弃前留的上一份，救命用 */
let   UNSYNCED    = false;
let   _syncLastOk = null;
let   _syncBusy   = null, _syncAgain = false;

function _pendingGet(){
  try{ const s = localStorage.getItem(PENDING_KEY); if(!s) return null;
       const p = JSON.parse(s); return (p && p.data) ? p : null; }catch(e){ return null; }
}
function _pendingSave(data, loadedIds){
  try{
    const prev = localStorage.getItem(PENDING_KEY);
    if(prev) localStorage.setItem(BACKUP_KEY, prev);
    localStorage.setItem(PENDING_KEY, JSON.stringify({ data:data, loadedIds:[...(loadedIds||[])], t:Date.now() }));
  }catch(e){ console.error('['+SYNC_SYS+'] 写本机失败', e); }
  UNSYNCED = true; _syncPaint();
}
function _pendingClear(){ try{ localStorage.removeItem(PENDING_KEY); }catch(e){} UNSYNCED = false; }
function _pendingDownload(){
  const p = _pendingGet(); if(!p){ alert('这台电脑上没有未上云的资料。'); return; }
  const blob = new Blob([JSON.stringify(p, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  const d = new Date(p.t||Date.now());
  a.download = 'MasterHub_'+SYNC_SYS+'_未上云_'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'_'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+'.json';
  document.body.appendChild(a); a.click(); a.remove();
}

/* ③ 指示器：只看云端 */
function _syncPaint(state){
  const el = document.getElementById('last-saved'); if(!el) return;
  /* v16 · 以前先设 display 再整组换 cssText，display 被洗掉 → 被 .saved{display:none} 藏住，永远看不到。现在 cssText 自带 display */
  const pending = UNSYNCED || !!_pendingGet();
  if(state === 'busy' && pending){
    el.textContent = '☁ 同步中…';
    el.style.cssText = 'display:inline-block;font-size:11px;white-space:nowrap;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,.15);color:#fff';
  } else if(pending){
    el.textContent = '⚠ 未上云 — 只在这台电脑';
    el.style.cssText = 'display:inline-block;font-size:11px;font-weight:700;white-space:nowrap;padding:2px 8px;border-radius:10px;background:#c0392b;color:#fff';
  } else {
    const t = _syncLastOk ? _syncLastOk.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) : '';
    el.textContent = t ? ('☁ 已同步 · ' + t) : '☁ 已同步';
    el.style.cssText = 'display:inline-block;font-size:11px;white-space:nowrap;padding:2px 8px;border-radius:10px;background:rgba(159,225,203,.25);color:#9FE1CB;font-weight:600';
  }
}
/* ③ 失败横幅：不会自己消失，直到下一次存成功 */
function _syncBanner(msg){
  let bar = document.getElementById('sync-fail-bar');
  if(!msg){ if(bar) bar.remove(); return; }
  if(!bar){
    bar = document.createElement('div'); bar.id = 'sync-fail-bar';
    bar.style.cssText = 'position:sticky;top:0;z-index:99990;background:#c0392b;color:#fff;padding:10px 14px;font-size:13px;font-weight:600;line-height:1.55';
    document.body.insertBefore(bar, document.body.firstChild);
  }
  bar.innerHTML = '⚠ 没有存进云端 —— ' + String(msg).replace(/</g,'&lt;')
    + '<br>你的改动<b>还在，也存在这台电脑里</b>，重新整理不会消失；但<b>只在这台电脑上</b>，别人看不到。'
    + '<br><button onclick="saveAll()" style="margin-top:6px;padding:4px 12px;border:none;border-radius:5px;background:#fff;color:#c0392b;font-weight:700;cursor:pointer">☁ 再试一次</button> '
    + '<button onclick="_pendingDownload()" style="margin-top:6px;padding:4px 12px;border:1px solid #fff;border-radius:5px;background:transparent;color:#fff;font-weight:700;cursor:pointer">↓ 下载这份未上云资料</button>'
    + ' <span style="font-weight:400">请截图告诉 Teo。</span>';
}
function _syncAfter(r){
  if(r && !r.error){
    _pendingClear(); _syncLastOk = new Date(); _syncBanner(null); _syncPaint();
  } else {
    UNSYNCED = true;
    const m = (r && r.error) || 'unknown';
    console.error('['+SYNC_SYS+'] 云端拒绝储存:', m);
    _syncBanner(m); _syncPaint();
  }
}
/* ⑤ 单一出口：同一时间只有一个推云在跑；跑的时候又有改动 → 跑完再补推一次最新的 */
function _syncRun(fn){
  if(_syncBusy){ _syncAgain = true; return _syncBusy; }
  _syncBusy = (async () => {
    let r;
    try{
      do { _syncAgain = false; _syncPaint('busy'); r = await fn(); } while(_syncAgain);
    }catch(e){ r = { error: String((e && e.message) || e) }; }
    finally { _syncBusy = null; }
    _syncAfter(r);
    return r;
  })();
  return _syncBusy;
}

/* ② 载入：本机有未上云 → 不准盖。列出差异，让人选 */
async function _syncOnLoad(cloudRaw){
  const pend = _pendingGet(); if(!pend) return null;
  let local, cloud;
  try{ local = JSON.parse(pend.data); cloud = JSON.parse(cloudRaw); }catch(e){ return null; }
  const L = _syncRowsOf(local), C = _syncRowsOf(cloud), snap = new Set(pend.loadedIds||[]);
  const mine = [], others = [];
  L.forEach((v, id) => {
    const c = C.get(id);
    if(!c) mine.push((snap.has(id) ? '云端已被删掉、你这份还有：' : '新增：') + v.label);
    else if(c.sig !== v.sig) mine.push('修改：' + v.label);
  });
  snap.forEach(id => { if(!L.has(id) && C.has(id)) mine.push('删除：' + C.get(id).label); });
  C.forEach((v, id) => { if(!L.has(id) && !snap.has(id)) others.push(v.label); });
  if(!mine.length){ _pendingClear(); return null; }   /* 跟云端一模一样 → 静默用云端，不吓人 */
  const choice = await _syncAsk(mine, others, pend.t);
  if(choice === 'local'){
    UNSYNCED = true; window._syncRestored = true;
    return { raw: pend.data, loadedIds: new Set(pend.loadedIds||[]) };
  }
  try{ localStorage.setItem(BACKUP_KEY, JSON.stringify(pend)); }catch(e){}   /* 放弃的那份也留着 */
  _pendingClear();
  return null;
}
function _syncAsk(mine, others, t){
  return new Promise(resolve => {
    const esc2 = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
    const list = a => a.slice(0,30).map(x => '<li>'+esc2(x)+'</li>').join('') + (a.length>30 ? '<li>…还有 '+(a.length-30)+' 项</li>' : '');
    const when = t ? new Date(t).toLocaleString('en-GB',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
    const ov = document.createElement('div'); ov.id = 'sync-ask';
    ov.style.cssText = 'position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;font-family:system-ui,sans-serif';
    ov.innerHTML = '<div style="background:#fff;color:#222;max-width:560px;width:100%;max-height:90vh;overflow:auto;border-radius:12px;padding:22px 24px;line-height:1.55;font-size:14px">'
      + '<h2 style="margin:0 0 8px;font-size:17px;color:#c0392b">⚠ 这台电脑上有还没存进云端的改动</h2>'
      + '<p style="margin:0 0 10px">上次（'+esc2(when)+'）云端没收下。<b>这些改动还在，没有被盖掉。</b>请选要用哪一份：</p>'
      + '<div style="font-weight:700;margin:6px 0 2px">选「用云端的」会失去这 '+mine.length+' 项：</div>'
      + '<ul id="sync-ask-mine" style="margin:0 0 10px;padding-left:20px;color:#8a1f11">'+list(mine)+'</ul>'
      + (others.length ? '<div style="font-size:12px;color:#555;margin:0 0 10px">另外，云端有 '+others.length+' 项是别人这段时间新增的（例如 '+esc2(others.slice(0,3).join('、'))+'）。<b>两个选项都不会删掉它们。</b></div>' : '')
      + '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">'

// SUBSTITUTE HOLIDAY ENGINE  (Act 369, Section 3)
// Rule: PH1/PH2 falls on Sunday → next Monday becomes substitute PH
//       If that Monday is also PH → keep moving forward
// Company: Working Day = Mon–Sat,  Rest Day = Sunday
// ═══════════════════════════════════════════════════════════════════════════
function _getSubHols(yr){
  const subs = [];
  const d = _hd(yr);

  // ── Collect ALL gazetted PH entries (PH1/PH2/Festival PH2/Special) ──
  // Each entry: { date, name, cat }
  const allPH = [];

  HOLIDAY_TEMPLATE.filter(t=>t.cat==='PH1'||t.cat==='PH2').forEach(t=>{
    const dt = d[t.id];   /* v15 · 没填就不算（以前固定日期没填也会被拿来算补假） */
    if(dt) allPH.push({ date:dt, name:t.name, cat:t.cat });
  });

  FESTIVAL_CONFIG.forEach(fc=>{
    const fest=(S.festivalDates[yr]||{})[fc.id]||{};
    /* v15 · 只用卡 A 的节日 Day 1 / Day 2（落星期日也算，由下面规则补到下一个工作日）。
       旧资料里额外标的 PH2（例：2026 开斋 3/22、3/23，屠妖 11/9）不再拿来算补假，否则会多出薪资表没有的补假（2026-03-24）。 */
    _festSlots(yr, fc.id).slots.forEach(date=>allPH.push({ date, name:fc.name, cat:'PH2' }));
  });

  (S.specialHolidays[yr]||[]).forEach(h=>{
    allPH.push({ date:h.date, name:h.name, cat:h.category||'PH2' });
  });

  // ── Also collect OFF for company Replace policy ──
  const allOFF = [];
  HOLIDAY_TEMPLATE.filter(t=>t.cat==='OFF').forEach(t=>{
    if(d[t.id]) allOFF.push({ date:d[t.id], name:t.name, cat:'OFF' });
  });
  ((S.centreOff||{})[yr]||[]).filter(c=>c.slot==='ph' && c.start && c.status==='active').forEach(c=>allOFF.push({ date:c.start, name:c.name||'Public holiday', cat:'OFF' }));   /* v15 */

  const allDates = [...allPH, ...allOFF];

  // ── Build date-count map to detect COINCIDING holidays ──
  // dateMap: { 'YYYY-MM-DD': [{ name, cat }, ...] }
  const dateMap = {};
  allDates.forEach(h=>{
    if(!h.date || !/^\d{4}-\d{2}-\d{2}$/.test(h.date)) return;   /* v15 · 空白日期跳过 */
    if(!dateMap[h.date]) dateMap[h.date]=[];
    dateMap[h.date].push(h);
  });

  // Set of all taken dates (to avoid double-Replace collisions)
  const taken = new Set(Object.keys(dateMap));

  // Helper: find next available working day
  function nextWorkDay(fromDs){
    let s = new Date(fromDs+'T12:00:00');
    s.setDate(s.getDate()+1);
    while(s.getDay()===0 || taken.has(s.toISOString().slice(0,10))){
      s.setDate(s.getDate()+1);
    }
    return s.toISOString().slice(0,10);
  }

  // ── RULE 1: PH falls on Sunday → Replace ──────────────────────────
  // (Act 369 Section 3, first part)
  Object.entries(dateMap).forEach(([ds, holidays])=>{
    const dow = new Date(ds+'T12:00:00').getDay();
    if(dow !== 0) return; // Only Sunday triggers this rule
    /* v15 · 同一个星期日有几个假期就补几天（带薪的先补，OFF 的后补） */
    holidays.slice().sort((a,b)=>(a.cat==='OFF')-(b.cat==='OFF')).forEach((ph,i)=>{
      const subDs = nextWorkDay(ds);
      taken.add(subDs);
      subs.push({
        date: subDs, name:'Replace: '+ph.name,
        cat:'SUB', srcDate:ds, srcCat:ph.cat,
        id:'sub_sun_'+ds+(i?'_'+i:''), isSub:true, fixed:true,
        rule:'Sunday PH → Act 369 S.3'
      });
    });
  });

  // ── RULE 2: Two or more PH coincide on the SAME working day → Replace ─
  // (Act 369 Section 3: "if such day is already a public holiday, then
  //  the day following shall be a public holiday")
  // When 2 gazetted PHs fall on the same weekday, the extra PH generates
  // a substitute — employee is entitled to both days.
  Object.entries(dateMap).forEach(([ds, holidays])=>{
    const dow = new Date(ds+'T12:00:00').getDay();
    if(dow === 0) return; // Sunday already handled above
    // Only triggered when 2+ GAZETTED PHs (PH1/PH2/SP) coincide
    const gazetted = holidays.filter(h=>h.cat==='PH1'||h.cat==='PH2'||h.cat==='SP');
    if(gazetted.length < 2) return;
    // Extra PHs (beyond the first) each generate a Replace
    for(let i=1; i<gazetted.length; i++){
      const ph = gazetted[i];
      const subDs = nextWorkDay(ds);
      taken.add(subDs);
      subs.push({
        date: subDs, name:'Replace: '+ph.name+' (coincides with '+gazetted[0].name+')',
        cat:'SUB', srcDate:ds, srcCat:ph.cat,
        id:'sub_coinc_'+ds+'_'+i, isSub:true, fixed:true,
        rule:'Coinciding PH → Act 369 S.3'
      });
    }
  });

  return subs.sort((a,b)=>a.date.localeCompare(b.date));
}

// Update isPH to recognise substitute holidays
const _isPH_base = isPH;
isPH = function(ds){
  if(_isPH_base(ds)) return true;
  // Check substitute holidays
  const yr = parseInt(ds.slice(0,4));
  return _getSubHols(yr).some(s=>s.date===ds && s.srcCat!=='OFF') || (ds.slice(5,7)==='01' && _getSubHols(yr-1).some(s=>s.date===ds && s.srcCat!=='OFF'));   /* v15 · 只有带薪假期的补假才带薪；含去年底补过来的 */
};
/* v15 · 扣年假假期（OFF）落星期日 → 补的那天关门、扣年假 */
const _isCO_base = isCentreOff;
isCentreOff = function(ds){
  if(_isCO_base(ds)) return true;
  const _y=parseInt(ds.slice(0,4));
  return _getSubHols(_y).some(s=>s.date===ds && s.srcCat==='OFF') || (ds.slice(5,7)==='01' && _getSubHols(_y-1).some(s=>s.date===ds && s.srcCat==='OFF'));
};

function getPHNameFull(ds){
  const n = getPHName(ds); if(n) return n;
  const yr = parseInt(ds.slice(0,4));
  const sub = _getSubHols(yr).find(s=>s.date===ds);
  return sub ? sub.name : null;
}

function _renderHolMain(){
  const yr   = window._holYear;

  const fd   = S.festivalDates[yr]||{};
  const subs = _getSubHols(yr);

  // ── Build rows ─────────────────────────────────────────────────────────
  const rows = [];

  // Template holidays
  HOLIDAY_TEMPLATE.forEach(t=>{
    rows.push({ date:d[t.id]||'', name:t.name, cat:t.cat, id:t.id, fixed:t.dt==='fixed', isTpl:true });
  });

  // Festival days — only PH2 days appear in the list; OFF days are managed in Festival section only
  FESTIVAL_CONFIG.forEach(fc=>{
    const fest=fd[fc.id]||{};
    if(!fest.start||!fest.end) return;
    let cur=new Date(fest.start+'T12:00:00'),end=new Date(fest.end+'T12:00:00');
    while(cur<=end){
      if(cur.getDay()!==0){
        const ds=cur.toISOString().slice(0,10);

          rows.push({ date:ds, name:fc.name, cat, id:'fest_'+fc.id+'_'+ds, fixed:true, isFest:true, festId:fc.id });

  // Substitute holidays (auto-generated, Act 369 Section 3)

  // Sort
  rows.sort((a,b)=>{

    return a.date.localeCompare(b.date);

// ── Festival helpers ───────────────────────────────────────────────────
// Date format helpers
function _ddmmS(ds){ return ds.slice(8)+'/'+ds.slice(5,7); }        // DD/MM
function _ddmmL(ds){ return ds.slice(8)+'/'+ds.slice(5,7)+'/'+ds.slice(0,4); } // DD/MM/YYYY

// Sunday toggle: clicking marks/unmarks Sunday as PH2 + manages substitute
function _holFestToggleSun(fid, sunDs, subDs, yr){
  if(!S.festivalDates[yr]||!S.festivalDates[yr][fid]) return;
  const days=S.festivalDates[yr][fid].days||{};
  if(days[sunDs]==='PH2'){
    // Un-mark: remove PH2 from Sunday and its substitute
    days[sunDs]='REST';
    if(days[subDs]==='PH2') delete days[subDs];
  } else {
    // Mark Sunday as PH2 → auto-set substitute as PH2
    days[sunDs]='PH2';
    days[subDs]='PH2';
  }
  S.festivalDates[yr][fid].days=days;
  saveAll(); _renderHolMain();
}

function _holFestRange(fid, field, val, yr){
  if(!_inYear(val,yr)){ _renderHolMain(); return; }   /* v15 */
  { const f0=((S.festivalDates[yr]||{})[fid])||{};
    if(field==='end' && val && f0.start && val < f0.start){ alert('End cannot be before Start.'); _renderHolMain(); return; }
    if(field==='start' && val && f0.end && f0.end < val) f0.end = val; }
  if(!S.festivalDates[yr]) S.festivalDates[yr]={};
  if(!S.festivalDates[yr][fid]) S.festivalDates[yr][fid]={start:'',end:'',days:{}};
  S.festivalDates[yr][fid][field]=val;
  // When range changes, default all weekdays to OFF
  const fest=S.festivalDates[yr][fid];
  if(fest.start&&fest.end){
    // Clean up orphan keys outside new range
    Object.keys(fest.days).forEach(ds=>{
      if(ds<fest.start||ds>fest.end) delete fest.days[ds];
    });
    let cur=new Date(fest.start+'T12:00:00'),end=new Date(fest.end+'T12:00:00');
    while(cur<=end){
      const ds=cur.toISOString().slice(0,10);
      // Weekdays default OFF; Sundays left undefined (clickable Rest Day)
      if(cur.getDay()!==0 && !fest.days[ds]) fest.days[ds]='OFF';
      cur.setDate(cur.getDate()+1);
    }
  }
  saveAll(); _renderHolMain();
}
function _holFestToggle(fid, ds, yr){
  if(!S.festivalDates[yr]) return;
  const fest=S.festivalDates[yr][fid];
  if(!fest||!fest.days) return;
  fest.days[ds] = (fest.days[ds]==='PH2') ? 'OFF' : 'PH2';
  saveAll(); _renderHolMain();
}
function _holFestSetAllPH2(fid, yr){
  const fest=(S.festivalDates[yr]||{})[fid];
  if(!fest||!fest.days) return;
  Object.keys(fest.days).forEach(ds=>{ fest.days[ds]='PH2'; });
  saveAll(); _renderHolMain();
}
function _holFestSetAllOFF(fid, yr){
  const fest=(S.festivalDates[yr]||{})[fid];
  if(!fest||!fest.days) return;
  Object.keys(fest.days).forEach(ds=>{ fest.days[ds]='OFF'; });
  saveAll(); _renderHolMain();
}

function _holAutoFestival(fkey,day1date,yr){
  if(!day1date){alert('Set Day 1 in the table first.');return;}
  if(!S.holidayDates[yr]) S.holidayDates[yr]={};
  const keys=fkey==='cny'
    ?['ph2_cny2','off_cny3','off_cny4','off_cny5','off_cny6','off_cny7']
    :['ph2_raya2','off_raya3','off_raya4','off_raya5','off_raya6','off_raya7'];
  const base=new Date(day1date+'T12:00:00');
  keys.forEach((k,i)=>{const nd=new Date(base);nd.setDate(nd.getDate()+(i+1));S.holidayDates[yr][k]=nd.toISOString().slice(0,10);});
  saveAll(); _renderHolMain();

    if(field==='start' && val && e0.end && e0.end < val) e0.end = val; }

function _ecToggleDept(yr,idx,dept,checked){

function isExtraClass(ds,dept){
  const yr=parseInt(ds.slice(0,4));
  return ((S.extraClasses||{})[yr]||[]).some(e=>{
    if(!e.start||!e.end||ds<e.start||ds>e.end) return false;
    return !dept||dept==='MASTER'||dept==='TEACHER'||!e.depts||!e.depts.length||e.depts.includes(dept);
  });
}
function getECInfo(ds,dept){
  const yr=parseInt(ds.slice(0,4));
  return ((S.extraClasses||{})[yr]||[]).find(e=>{

function _coAdd(yr){
  if(!S.centreOff) S.centreOff = {};
  const own = _canManage();
  (S.centreOff[yr] = S.centreOff[yr] || []).push({ id:genId('co'), name:'Centre closed', start:'', end:'',
    status: own ? 'active' : 'pending', req: own ? null : 'add', by: window._ME||'', at: new Date().toISOString() });
  saveAll(); _renderHolMain();
}
function _coUpdate(yr,id,field,val){
  const c = _coGet(yr,id); if(!c) return;
  if((c.status==='active' || c.req==='remove') && !_canManage()){ alert('Only the Owner, Admin or Top Mgmt can change this closure. Use "Request removal", then add a new one.'); _renderHolMain(); return; }
  if((field==='start'||field==='end') && !_inYear(val,yr)){ _renderHolMain(); return; }
  c[field] = val;
  if(field==='start' && (!c.end || c.end < val)) c.end = val;
  if(field==='end' && c.start && val && val < c.start){ alert('Last day cannot be before the first day.'); c.end = c.start; }
  saveAll(); if(field!=='name') _renderHolMain();
}
function _coDelete(yr,id){
  const c = _coGet(yr,id); if(!c) return;
  if(c.status==='active'){
    if(!_canManage()) return;
    if(!confirm('Delete this centre closure?\nThese days will be open again.')) return;
  } else if(!confirm('Cancel this request?')) return;
  _coRemove(yr,id); saveAll(); _renderHolMain();
}
function _coRequestRemove(yr,id){
  const c = _coGet(yr,id); if(!c) return;
  if(!confirm('Ask the Owner to remove this closure?\nIt stays in effect until the Owner approves.')) return;
  c.status = 'pending'; c.req = 'remove'; c.by = window._ME||''; c.at = new Date().toISOString();
  saveAll(); _renderHolMain();
}
function _coApprove(yr,id){
  if(!_canManage()) return;
  const c = _coGet(yr,id); if(!c) return;
  if(c.req==='remove'){ _coRemove(yr,id); }
  else {
    if(!c.start){ alert('Set the dates first.'); return; }
    c.status = 'active'; c.req = null; c.approved_by = window._ME||''; c.approved_at = new Date().toISOString();
  }
  saveAll(); _renderHolMain();
}
function _coReject(yr,id){
  if(!_canManage()) return;
  const c = _coGet(yr,id); if(!c) return;
  if(c.req==='remove'){ c.status = 'active'; c.req = null; }
  else _coRemove(yr,id);
  saveAll(); _renderHolMain();
}

let _listCat = 'all', _listMonth = '', _listQ = '';
const _LIST_CATS = { all:'All', paid:'PH1 / PH2', al:'OFF', noclass:'No class', extra:'Extra class' };
function _listRows(yr){
  const DL = ['SRK','GAK','ATC','SRT'], rows = [];
  const shName = r => { const t = SCHOOL_HOL_TEMPLATE.find(x=>x.id===r.name); return t ? t.name : (String(r.name||'').trim() || 'School Holiday'); };
  for(let mo=1; mo<=12; mo++) for(let dd=1; dd<=_daysInMonth(yr,mo); dd++){
    const ds = _isoDate(yr,mo,dd), dow = _holidayDow(ds);
    const ph = isPH(ds);
    const al = !ph && dow!==0 && (isCentreOff(ds) || isCentreClosed(ds));
    const sh = Object.values(S.schoolHolDates[yr]||{}).filter(r=>r.start && r.end && ds>=r.start && ds<=r.end);
    const shD = [...new Set(sh.flatMap(r=>(r.depts||[]).filter(x=>DL.includes(x))))];
    const ec = ((S.extraClasses||{})[yr]||[]).filter(e=>e.start && e.end && ds>=e.start && ds<=e.end);
    const ecD = [...new Set(ec.flatMap(e=>(e.depts||[]).filter(x=>DL.includes(x))))];
    if(dow===0 && !ph) continue;
    if(!ph && !al && !ecD.length && !(shD.length && dow!==6)) continue;
    const name = getPHNameFull(ds) || getOffName(ds) || getCentreClosedName(ds) || (sh[0] ? shName(sh[0]) : '') || (ec[0] ? (ec[0].name||'Extra Class') : '');
    const staff = dow===0 ? 'rest' : (ph ? 'paid' : (al ? 'al' : 'work'));
    const noAll = ph || al;
    const noD = noAll ? [] : shD.filter(x=>!ecD.includes(x));
    const cats = [];
    if(ph) cats.push('paid'); if(al) cats.push('al'); if(noAll || noD.length) cats.push('noclass'); if(ecD.length && !noAll) cats.push('extra');
    rows.push({ ds, dow, name, staff, dt:_dayType(ds), noAll, noD, ecD, ecTime:[...new Set(ec.map(e=>e.time).filter(Boolean))].join(' / '), cats });
  }
  return rows;

const _CHG_LBL = { paid:'PH', al:'OFF', '':'Open' };
function _staffMap(){
  const m = {}, yrs = new Set();
  ['holidayDates','festivalDates','specialHolidays','schoolHolDates','centreOff'].forEach(k=>Object.keys(S[k]||{}).forEach(y=>yrs.add(parseInt(y))));
  yrs.forEach(y=>{ if(!y) return;
    const subs = new Set(_getSubHols(y).filter(s=>s.srcCat!=='OFF').map(s=>s.date));
    for(let mo=1; mo<=12; mo++) for(let d=1; d<=_daysInMonth(y,mo); d++){
      const ds = _isoDate(y,mo,d); if(_holidayDow(ds)===0) continue;
      const v = (_isPH_base(ds) || subs.has(ds)) ? 'paid' : ((isCentreOff(ds) || isCentreClosed(ds)) ? 'al' : '');
      if(v) m[ds] = v;
    }
  });
  return m;
}
function _chgCheck(){
  try{
    if(!_CHG_SNAP) return;
    const now = _staffMap();
    if(!_canManage()){
      const days = [...new Set([...Object.keys(_CHG_SNAP), ...Object.keys(now)])].filter(ds=>(_CHG_SNAP[ds]||'')!==(now[ds]||'') && _yearStatus(ds.slice(0,4))==='published').sort();
      days.forEach(ds=>_CHG_QUEUE.push({ by_email: window._ME||'', day: ds, before: _CHG_LBL[_CHG_SNAP[ds]||''], after: _CHG_LBL[now[ds]||''],
        holiday: getPHNameFull(ds) || getOffName(ds) || getCentreClosedName(ds) || '' }));
    }
    _CHG_SNAP = now;
    if(_CHG_QUEUE.length) _chgPush();
  }catch(e){ console.warn('change log', e); }
}
async function _chgPush(){
  const rows = _CHG_QUEUE.splice(0);
  try{
    const { error } = await _sb.from('calendar_change_log').insert(rows);
    if(error) throw error;
  }catch(e){ _CHG_QUEUE = rows.concat(_CHG_QUEUE); console.warn('change log not sent yet — will retry on next save', e); }
}
async function _chgLoad(){
  window._CHG_UNSEEN = [];
  if(!_isOwner()) return;
  try{
    const { data, error } = await _sb.from('calendar_change_log').select('*').is('seen_at', null).order('at', { ascending:false });
    if(!error) window._CHG_UNSEEN = data || [];
  }catch(e){}
}
async function _chgSeen(){
  const ids = window._CHG_UNSEEN.map(r=>r.id); if(!ids.length) return;
  try{
    const { error } = await _sb.from('calendar_change_log').update({ seen_at: new Date().toISOString() }).in('id', ids);
    if(error) throw error;
    window._CHG_UNSEEN = []; render_holidays();
  }catch(e){ alert('Could not mark as seen: '+(e.message||e)); }
}
function _chgCard(){
  const L = window._CHG_UNSEEN || []; if(!_isOwner() || !L.length) return '';
  const grp = {};
  L.forEach(x=>{ const k=(x.by_email||'?')+'|'+String(x.day).slice(0,4); (grp[k]=grp[k]||[]).push(x); });
  const sum = Object.entries(grp).map(([k,a])=>{ const [who,y]=k.split('|'); const c=t=>a.filter(x=>x.after===t).length;
    return `<div style="font-size:11px;line-height:1.8"><b>${escapeHTML(who)}</b> · ${y}: ${a.length} day${a.length>1?'s':''} changed — now ${[['PH',c('PH')],['OFF',c('OFF')],['Open',c('Open')]].filter(z=>z[1]).map(z=>z[1]+' '+z[0]).join(', ')}</div>`; }).join('');
  return `<div class="card" style="margin-bottom:14px;border-left:3px solid var(--org);background:#FFFDF5">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px">
      <div style="font-size:12px;font-weight:600;color:#854F0B;flex:1">Changes by Admin / Top Mgmt to public holidays and closed days</div>
      <button class="btn-plain" style="font-size:10px;padding:3px 10px" onclick="const e=this.closest('.card').querySelector('.chg-d');e.style.display=(e.style.display==='none'?'block':'none')">Show details</button>
      <button class="btn-plain" style="font-size:10px;padding:3px 10px" onclick="_chgSeen()">Mark all as seen</button>
    </div>
    ${sum}
    <div class="chg-d" style="display:none;overflow-x:auto;margin-top:8px"><table class="data"><thead><tr><th>Changed</th><th>By</th><th>Day</th><th>Before → After</th><th>Holiday</th></tr></thead><tbody>
      ${L.slice().sort((a,b)=>String(a.day).localeCompare(String(b.day))).map(r=>`<tr><td style="white-space:nowrap">${_locTime(r.at)}</td><td>${escapeHTML(r.by_email||'')}</td>
        <td style="white-space:nowrap;font-weight:600">${_ddmmL(r.day)} ${new Date(r.day+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short'})}</td>
        <td style="white-space:nowrap">${escapeHTML(r.before)} → <b>${escapeHTML(r.after)}</b></td><td>${escapeHTML(r.holiday||'')}</td></tr>`).join('')}
    </tbody></table></div>
  </div>`;
}

let _EV_YEARS = new Set();
window._card = null;
function _yearStatus(y){ const r=(S.years||{})[String(y)]; if(r && r.status) return r.status; return _EV_YEARS.has(String(y)) ? 'published' : 'draft'; }
function _yf(yr){ if(!S.years) S.years={}; const k=String(yr); if(!S.years[k]) S.years[k]={ flags:{} }; if(!S.years[k].flags) S.years[k].flags={}; return S.years[k].flags; }
const _DOW = ds => new Date(ds+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short'});
const _addD = (ds,n) => { const d=new Date(ds+'T12:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
function _cn(name){ return (typeof NOTICE_NAME_CN!=='undefined' && NOTICE_NAME_CN[name]) || ''; }
function _firstMonJune(y){ for(let d=1; d<=7; d++){ const ds=_isoDate(y,6,d); if(_holidayDow(ds)===1) return ds; } return ''; }

/* ── 卡 A 的 16 项（带薪 9 项 ＋ 扣年假 7 项）── */
const _A_FIXED = [ ['ph1_labour','05-01'], ['ph1_sultan_bday','03-23'], ['ph1_agong_bday','agong'], ['ph1_merdeka','08-31'], ['ph1_malaysia','09-16'], ['ph2_christmas','12-25'] ];
const _A_FEST  = [ ['cny',1,'Day 1'], ['cny',2,'Day 2'], ['raya',1,'Day 1'], ['raya',2,'Day 2'], ['deepavali',1,''] ];
const _A_AL    = ['off_thaipusam','off_ramadan','off_qurban','off_wesak','off_hijrah','off_hol_iskandar','off_nabi'];
const _tplName = k => (HOLIDAY_TEMPLATE.find(t=>t.id===k)||{}).name || k;
const _fcName  = k => (FESTIVAL_CONFIG.find(f=>f.id===k)||{}).name || k;

function _fest(yr,fid){ if(!S.festivalDates[yr]) S.festivalDates[yr]={}; if(!S.festivalDates[yr][fid]) S.festivalDates[yr][fid]={ start:'', end:'', days:{} }; const f=S.festivalDates[yr][fid]; if(!f.days) f.days={}; return f; }
function _festPaid(yr,fid){ const f=((S.festivalDates[yr]||{})[fid])||{}; return Object.keys(f.days||{}).filter(ds=>f.days[ds]==='PH2').sort(); }
/* 节日带薪日：去掉「星期日带薪的隔天」那种旧补假标记，剩下的依序是 Day 1、Day 2 */
function _festSlots(yr,fid){
  const all=_festPaid(yr,fid), n = FESTIVAL_CONFIG.some(f=>f.id===fid) ? (fid==='deepavali' ? 1 : 2) : 0;
  if(all.length<=n) return { slots: all, extra: [] };   // 正常情况：几天就是几天（例：新年 Day1 星期日、Day2 星期一，两天都是真的）
  const slots=[], extra=[];
  all.forEach(ds=>{ const prev=_addD(ds,-1); if(all.includes(prev) && _holidayDow(prev)===0 && _holidayDow(ds)===1) extra.push({ds, why:'replacement for Sunday'}); else slots.push(ds); });
  slots.slice(n).forEach(ds=>extra.push({ds, why:'also marked PH2'}));
  return { slots: slots.slice(0,n), extra };
}
function _festRange(f){
  const ks=Object.keys(f.days||{}).filter(ds=>f.days[ds]==='PH2'||f.days[ds]==='OFF').sort();
  if(!ks.length){ f.start=f.anchor||''; f.end=f.anchor||''; f.days={}; return; }
  f.start=ks[0]; f.end=ks[ks.length-1];
  Object.keys(f.days).forEach(ds=>{ if(ds<f.start||ds>f.end) delete f.days[ds]; });
}
function _aFest(yr,fid,n,val){
  if(!_inYear(val,yr)){ _renderCards(); return; }
  const f=_fest(yr,fid), cur=_festSlots(yr,fid).slots, two = fid!=='deepavali';
  if(two && val && _addD(val,1).slice(0,4)!==String(yr)){ alert('Day 2 would fall in the next year. Enter this festival in the next year instead.'); _renderCards(); return; }
  cur.forEach(ds=>{ delete f.days[ds]; });                 // 换日期：旧的 Day 1、Day 2 一起拿掉
  if(val){ f.days[val]='PH2'; if(two) f.days[_addD(val,1)]='PH2'; }   // Day 2 = Day 1 的隔天
  _festRange(f); saveAll(); _renderCards();
}
function _aFestDrop(yr,fid,ds){ const f=_fest(yr,fid); if(!confirm('Remove '+_ddmmL(ds)+' as a '+_fcName(fid)+' PH2 day?')) return; delete f.days[ds]; _festRange(f); saveAll(); _renderCards(); }
function _aTpl(yr,k,val){ if(!_inYear(val,yr)){ _renderCards(); return; } if(!S.holidayDates[yr]) S.holidayDates[yr]={}; S.holidayDates[yr][k]=val; saveAll(); _renderCards(); }
function _aAuto(yr){
  if(!S.holidayDates[yr]) S.holidayDates[yr]={};
  let n=0;
  _A_FIXED.forEach(([k,md])=>{ if(!S.holidayDates[yr][k]){ S.holidayDates[yr][k] = md==='agong' ? _firstMonJune(yr) : `${yr}-${md}`; n++; } });
  if(n) saveAll();
}
function _subFor(yr,ds){ return _getSubHols(yr).find(s=>s.srcDate===ds); }
function _sunNote(yr,ds){
  if(!ds) return '';
  if(_holidayDow(ds)!==0) return '';
  const s=_subFor(yr,ds);
  if(!s) return '<span class="cp-note">Sunday</span>';
  return `<span class="cp-note">Sunday → Replacement <b>${_ddmmS(s.date)} ${_DOW(s.date)}</b></span>`;
}
function _aItems(yr){
  const d=_hd(yr), it=[];
  const cat = k => (HOLIDAY_TEMPLATE.find(t=>t.id===k)||{}).cat || 'PH2';
  _A_FIXED.filter(([k])=>cat(k)==='PH1').forEach(([k,md])=>it.push({ kind:'tpl', k, paid:true, cls:'PH1', auto:md, name:_tplName(k), date:d[k]||'' }));
  _A_FIXED.filter(([k])=>cat(k)!=='PH1').forEach(([k,md])=>it.push({ kind:'tpl', k, paid:true, cls:'PH2', auto:md, name:_tplName(k), date:d[k]||'' }));
  _A_FEST.forEach(([fid,n,lbl])=>it.push({ kind:'fest', fid, n, paid:true, cls:'PH2', name:_fcName(fid)+(lbl?' ('+lbl+')':''), cnName:_fcName(fid), date:_festSlots(yr,fid).slots[n-1]||'' }));
  _A_AL.forEach(k=>it.push({ kind:'tpl', k, paid:false, cls:'OFF', name:_tplName(k), date:d[k]||'' }));
  return it;
}

/* ── 卡 B：KPM 学校假期 4 段 ── */
const _KPM = [ { k:'p1', name:'Cuti Penggal 1' }, { k:'mid', name:'Cuti Pertengahan Tahun' }, { k:'p2', name:'Cuti Penggal 2' }, { k:'end', name:'Cuti Akhir Persekolahan' }, { k:'other', name:'Other school holiday', opt:true } ];
function _shKpm(r){ if(r.kpm) return r.kpm; const s=r.start||r.end; if(!s) return ''; const m=+s.slice(5,7); return m<=4?'p1':(m<=7?'mid':(m<=10?'p2':'end')); }
function _shRows(yr){ return Object.entries(S.schoolHolDates[yr]||{}).map(([key,r])=>Object.assign({ key }, r)).sort((a,b)=>(a.start||'9').localeCompare(b.start||'9')); }
function _kpmWin(yr,p){
  const rs=_shRows(yr).filter(r=>_shKpm(r)===p && r.start && r.end).sort((a,b)=>a.start.localeCompare(b.start)); if(!rs.length) return null;
  const g=[]; rs.forEach(r=>{ const last=g[g.length-1]; if(last && r.start<=_addD(last.end,3)){ if(r.end>last.end) last.end=r.end; } else g.push({ start:r.start, end:r.end }); });   // 相连（隔 3 天内）的合成一段
  return g.sort((a,b)=>(new Date(b.end)-new Date(b.start))-(new Date(a.end)-new Date(a.start)))[0];   // 取最长的一段
}
function _bAdd(yr,p){
  if(!S.schoolHolDates[yr]) S.schoolHolDates[yr]={};
  const key='sh_custom_'+Date.now();
  S.schoolHolDates[yr][key]={ start:'', end:'', name:(_KPM.find(x=>x.k===p)||{}).name||'School Holiday', depts:['SRK','GAK','ATC'], kpm:p };
  saveAll(); _renderCards();
}
function _bKpm(yr,key,p){ const r=(S.schoolHolDates[yr]||{})[key]; if(!r) return; r.kpm=p; saveAll(); _renderCards(); }

/* ── 卡 C：节日加关 ── */
function _cToggle(yr,fid,ds){
  if(String(ds).slice(0,4)!==String(yr)) return;   // 不能改到别的年份
  const f=_fest(yr,fid);
  if(f.days[ds]==='PH2' || _holidayDow(ds)===0 || _cOther(yr,fid,ds)) return;   // 别张卡已经定了的日子不能在这里改
  if(f.days[ds]==='OFF') f.days[ds]='OPEN'; else f.days[ds]='OFF';
  _festRange(f);
  const fl=_yf(yr); if(fl.c) delete fl.c[fid];   // 改了就要重新确认
  saveAll(); _renderCards();
}
function _cConfirm(yr,fid){ const fl=_yf(yr); fl.c=fl.c||{}; fl.c[fid]=true; saveAll(); _renderCards(); }

/* ── 卡 D：关门周（年中、圣诞）＋ 卡 F 的意外关门 ── */
function _coSlot(c){ if(c.slot) return c.slot; const m=+(c.start||'0000-00').slice(5,7); return m===6||m===7||m===5 ? 'mid' : (m===12 ? 'xmas' : 'adhoc'); }
function _dSuggest(yr,slot){
  if(slot==='xmas'){ const x=`${yr}-12-25`; let s=x; while(_holidayDow(s)!==1) s=_addD(s,-1); return { start:s, end:_addD(s,5) }; }
  const w=_kpmWin(yr,'mid'); if(!w) return null;
  let e=w.end; while(_holidayDow(e)===0) e=_addD(e,-1);
  let s=e; while(_holidayDow(s)!==1) s=_addD(s,-1);
  return { start:s, end:e };
}
function _coNew(yr,slot,start,end,name){
  if(!S.centreOff) S.centreOff={};
  const own=_canManage();
  (S.centreOff[yr]=S.centreOff[yr]||[]).push({ id:genId('co'), name, start:start||'', end:end||start||'', slot,
    status: own ? 'active' : 'pending', req: own ? null : 'add', by: window._ME||'', at: new Date().toISOString() });
  saveAll(); _renderCards();
}
function _coRowHTML(yr,c){
  const own=_canManage(), locked = (c.status==='active' || c.req==='remove') && !own;
  const n = c.start ? _scDayCount(c.start, c.end||c.start).al : 0;
  const chip = c.status==='active' ? '<span class="st st-done">active</span>' : `<span class="st st-wait">pending · ${c.req==='remove'?'remove':'add'}</span>`;
  let act='';
  if(c.status==='pending') act = own
    ? `<button class="btn-plain" style="background:#0F6E56;color:#fff;border-color:#0F6E56" onclick="_coApprove(${yr},'${c.id}')">${c.req==='remove'?'Approve removal':'Approve'}</button><button class="btn-plain" onclick="_coReject(${yr},'${c.id}')">${c.req==='remove'?'Keep it':'Reject'}</button>`
    : (c.req==='add' ? `<span class="cp-note">Waiting for Owner</span><button class="btn-plain" onclick="_coDelete(${yr},'${c.id}')">Cancel request</button>` : '<span class="cp-note">Waiting for Owner</span>');
  else act = own ? `<button class="btn-plain" style="color:var(--red)" onclick="_coDelete(${yr},'${c.id}')">Delete</button>` : `<button class="btn-plain" onclick="_coRequestRemove(${yr},'${c.id}')">Request removal</button>`;
  return `<div class="cp-row">
    <input type="text" value="${escapeHTML(c.name||'')}" ${locked?'disabled':''} class="cp-date" style="flex:1;min-width:170px" onchange="_coUpdate(${yr},'${c.id}','name',this.value)">
    <input type="date" value="${c.start||''}" ${locked?'disabled':''} class="cp-date ${c.start?'ok':''}" onchange="_coUpdate(${yr},'${c.id}','start',this.value)">
    <span class="cp-note">to</span>
    <input type="date" value="${c.end||''}" ${locked?'disabled':''} class="cp-date ${c.end?'ok':''}" onchange="_coUpdate(${yr},'${c.id}','end',this.value)">
    ${c.start?`<span class="st st-off">${n} day${n===1?'':'s'} OFF</span>`:''} ${chip}

/* ── 卡 E：补课 ── */
function _ecKpm(yr,e){ if(e.kpm) return e.kpm; if(!e.start) return ''; for(const p of ['p1','mid','p2','end']){ const w=_kpmWin(yr,p); if(w && e.start<=w.end && (e.end||e.start)>=w.start) return p; } const m=+e.start.slice(5,7); return m<=4?'p1':(m<=7?'mid':(m<=10?'p2':'end')); }

}

/* ── 每张卡的进度 ── */
function _cards(yr){
  const fl=_yf(yr), R={};
  const A=_aItems(yr), ax=_aExtra(yr), aN=A.filter(x=>x.date).length+ax.filter(x=>x.date).length, aOf=18+ax.length;
  R.A={ n:aN, of:aOf, state: aN===0?'todo':(aN<aOf?'doing':'done'), line:`${aN} / ${aOf} dates` };
  const bN=_KPM.filter(p=>!p.opt && _kpmWin(yr,p.k)).length;
  R.B={ n:bN, of:4, state: bN===0?'todo':(bN<4?'doing':'done'), line:`${bN} / 4 periods` };
  const legacy=_yearStatus(yr)==='published';   // 已公布的年份：节日加关视为已确认（以前只认没有年份纪录的，存档一次后 2026 会变回 0 / 3）
  const cN=['cny','raya','deepavali'].filter(f=>(fl.c||{})[f] || (legacy && _festSlots(yr,f).slots.length)).length, cReady=['cny','raya','deepavali'].every(f=>_festSlots(yr,f).slots.length);
  R.C={ n:cN, of:3, state: cN===3?'done':(cN?'doing':'todo'), line:`${cN} / 3 festivals confirmed`, hint: cReady?'':'Fill card A (festival dates) first' };
  const co=_coList(yr).filter(c=>['mid','xmas'].includes(_coSlot(c)));
  const dA=['mid','xmas'].filter(s=>(fl.dNone||{})[s] || co.some(c=>_coSlot(c)===s && c.status==='active' && c.start)).length, dP=co.filter(c=>c.status==='pending').length;
  const dPd=co.filter(c=>c.status==='pending'&&c.start).length;
  R.D={ n:dA, of:2, state: dA===2&&!dP?'done':(dPd?'wait':(co.some(c=>c.start)?'doing':'todo')), line:`${dA} / 2 approved${dPd?` · ${dPd} waiting for Owner`:''}`, hint: _kpmWin(yr,'mid')?'':'Fill card C (mid-year school holiday) first' };
  const ec=(S.extraClasses[yr]||[]);
  const eN=['p1','mid','p2'].filter(p=>(fl.eNone||{})[p] || ec.some(e=>e.start&&e.end&&_ecKpm(yr,e)===p)).length;
  R.E={ n:eN, of:3, state: eN===3?'done':(eN||ec.length?'doing':'todo'), line:`${eN} / 3 school breaks`, hint: _kpmWin(yr,'p1')?'':'Fill card C first' };
  const fN=(S.specialHolidays[yr]||[]).filter(h=>h.src!=='A').length + _coList(yr).filter(c=>_coSlot(c)==='adhoc').length;
  R.F={ n:fN, of:0, state:'opt', line: fN ? `${fN} item${fN>1?'s':''}` : 'Nothing this year (normal)' };
  const gS=_gStat(yr);   /* v15 · 卡 G：SRT（10/9 从 NoticeGo 搬进来） */
  R.G={ n:gS.n, of:gS.n?8:0, state: gS.n===0?'opt':((gS.f.length>=4&&gS.s.length>=4&&!gS.bad.length&&!gS.clash.length)?'done':'doing'), line: gS.n ? `${gS.f.length} Friday${gS.f.length===1?'':'s'} · ${gS.s.length} Saturday${gS.s.length===1?'':'s'}${gS.mk.length?` · ${gS.mk.length} makeup`:''}` : 'Not set (SRT only)' };
  return R;
}
function _checks(yr){
  const R=_cards(yr), L=[], paid=_paidDays(yr).length;
  const ok = (cond,txt,warnOnly) => L.push({ s: cond?'y':(warnOnly?'w':'n'), txt });
  ok(R.A.state==='done', `Card A: ${R.A.line}`);
  ok(R.C.state==='done', `Card B: ${R.C.line}`);
  ok(R.B.state==='done', `Card C: ${R.B.line}`);
  ok(R.D.state==='done', `Card D: ${R.D.line}`);
  ok(R.E.state==='done', `Card E: ${R.E.line}`);
  const _p1n = new Set(HOLIDAY_TEMPLATE.filter(t=>t.cat==='PH1').map(t=>t.name).concat((S.specialHolidays[yr]||[]).filter(h=>h.category==='PH1').map(h=>h.name)));
  const p1=_paidDays(yr).filter(([ds,nm])=>_p1n.has(nm)).length, p2=paid-p1;
  ok(p1>=5, `PH1: ${p1} / 5${p1>5?' (+'+(p1-5)+' added)':''}`);
  ok(p2>=6, `PH2: ${p2} / 6${p2>6?' (+'+(p2-6)+' added)':''}`);
  { const g=_gStat(yr);   /* v15 · 卡 G：只提醒，不挡公布 */
    if(!g.n) L.push({ s:'i', txt:'Card G: SRT off days not set (SRT only — optional)' });
    else ok(!g.bad.length && !g.clash.length && g.f.length>=4 && g.s.length>=4, `Card G: SRT ${g.f.length} Friday / ${g.s.length} Saturday${g.bad.length?` · ${g.bad.length} date(s) on the wrong weekday`:''}${g.clash.length?' · a Saturday off is also a makeup class day':''}`, true); }
  const subs=_getSubHols(yr);
  L.push({ s:'i', txt:`Sunday / clash replacements worked out automatically: ${subs.length ? subs.map(s=>`${_ddmmS(s.srcDate)} ${escapeHTML(s.name.replace(/^Replace: /,'').replace(/\s*\(.*\)/,''))} → <b>${_ddmmS(s.date)} ${_DOW(s.date)}</b> `).join(' · ') : 'none'}` });
  const clash=[]; (S.extraClasses[yr]||[]).forEach(e=>{ if(!e.start||!e.end) return; let d=e.start; while(d<=e.end){ if(_holidayDow(d)!==0 && (isPH(d)||isCentreOff(d)||isCentreClosed(d))) clash.push(d); d=_addD(d,1); } });
  ok(!clash.length, clash.length ? `Extra class on a day the centre is closed: ${[...new Set(clash)].map(_ddmmS).join(', ')}` : 'No extra class on a closed day', true);
  let al=0; for(let mo=1;mo<=12;mo++) for(let d=1;d<=_daysInMonth(yr,mo);d++){ const ds=_isoDate(yr,mo,d); if(_holidayDow(ds)!==0 && !isPH(ds) && (isCentreOff(ds)||isCentreClosed(ds))) al++; }

  const ready = L.filter(x=>x.s==='n').length===0;
  return { L, ready, al };
}

          <input type="date" class="cp-date ${s.date?'ok':''}" value="${s.date||''}" onchange="_holSpecialUpdate(${yr},'${s.id}','date',this.value)"><select class="cp-date" style="width:auto" onchange="_holSpecialUpdate(${yr},'${s.id}','category',this.value)"><option${(s.category||'PH1')==='PH1'?' selected':''}>PH1</option><option${s.category==='PH2'?' selected':''}>PH2</option></select>
          <button class="btn-plain" style="margin-left:auto;color:var(--red)" onclick="if(confirm('Delete this holiday?'))_holDeleteSpecial(${yr},'${s.id}')">Delete</button></div>`).join('')}
        <div class="cp-row"><button class="btn-plain" onclick="_holAddSpecial(${yr})">+ Add government holiday</button></div></div>
      <div class="card" style="padding:0;overflow:hidden"><div class="cp-sec">Unexpected closure (Owner approves)</div>
        ${ad.map(c=>_coRowHTML(yr,c)).join('')}
        <div class="cp-row"><button class="btn-plain" onclick="_coNew(${yr},'adhoc','','','Unexpected closure')">+ Add closure</button></div></div>`;
  }
  else if(k==='G'){ h=_gPage(yr); }
  else if(k==='CHK'){
    const C=_checks(yr), st=_yearStatus(yr), y=(S.years||{})[String(yr)]||{}, own=_canManage();

    h=_cardHead('CHK')+`<div class="card" style="padding:0;overflow:hidden">${C.L.map(x=>`<div class="ck"><i class="${cl[x.s]}">${ic[x.s]}</i><span>${x.txt}</span></div>`).join('')}</div>
      <div class="card" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        ${st==='published'
          ? `<span class="st st-done">Published${y.published_at?' '+_locTime(y.published_at).slice(0,10):''}${y.published_by?' by '+escapeHTML(y.published_by):''}</span><span class="cp-note">Changes now take effect at once.</span>`
          : (own ? `<button class="btn-plain" style="min-height:40px;padding:0 18px;font-size:12px;${C.ready?'background:var(--grn);color:#fff;border-color:var(--grn)':'opacity:.5'}" ${C.ready?'':'disabled'} onclick="_publishYear(${yr})">Publish ${yr}</button><span class="cp-note">${C.ready?'ClassGo, HrLeave, parent notices and the other systems start using '+yr+' after you publish.':'Fix the ✕ items first.'}</span>`

function _dFill(yr,id,a,b){ const c=_coGet(yr,id); if(!c) return; if((c.status==='active' || c.req==='remove') && !_canManage()) return; c.start=a; c.end=b; saveAll(); _renderCards(); }
/* 11 天：节日算 Day 1 / Day 2（落星期日也算那一天，补假另算），旧资料里「星期日的隔天」那种补假标记不重复算 */
_paidDays = function(yr){
  const d=_hd(yr), m=new Map(); const add=(ds,name)=>{ if(ds && !m.has(ds+'|'+name)) m.set(ds+'|'+name,name); };   // 同一天两个不同假期 → 两天都算
  HOLIDAY_TEMPLATE.filter(t=>t.cat==='PH1'||t.cat==='PH2').forEach(t=>add(d[t.id], t.name));
  (S.specialHolidays[yr]||[]).forEach(h=>add(h.date, h.name));
  FESTIVAL_CONFIG.forEach(fc=>_festSlots(yr,fc.id).slots.forEach(ds=>add(ds, fc.name)));
  return [...m.entries()].map(([k,v])=>[k.slice(0,10),v]).sort((a,b)=>a[0].localeCompare(b[0]));
};

/* 卡 C：这一天是不是已经由别的假期定了（公共假期、补假、扣年假的公共假期）→ 显示出来、不能点 */
function _cOther(yr,fid,ds){
  const f=((S.festivalDates[yr]||{})[fid])||{days:{}}, keep=f.days[ds]; let res=null;
  if(keep==='OFF'){ delete f.days[ds]; }   // 先拿掉自己这一格再判断，避免自己挡自己
  if(isPH(ds)){ const sub=_getSubHols(yr).find(x=>x.date===ds && x.srcCat!=='OFF'); res={ paid:true, lbl: sub ? 'Replacement' : (_dayType(ds).t==='PH1'?'PH1':'PH2') }; }
  else if(isCentreOff(ds) && !Object.values(S.festivalDates[yr]||{}).some(x=>(x.days||{})[ds]==='OFF')){ const n=getOffName(ds); res={ paid:false, lbl: n ? 'OFF' : 'Replacement' }; }
  if(keep==='OFF') f.days[ds]='OFF';
  return res;
}

/* ── 卡 A：政府新增的公共假期。带薪 → 存成特别假期（src:A）；扣年假 → 存成关门（slot:ph，跟 7 个扣年假假期一样不用批准，但会通知 Owner）── */
function _aExtra(yr){
  const p=(S.specialHolidays[yr]||[]).filter(h=>h.src==='A').map(h=>({ kind:'sp', id:h.id, name:h.name, date:h.date||'', paid:true, cat:(h.category||'PH2') }));
  const a=_coList(yr).filter(c=>c.slot==='ph').map(c=>({ kind:'ph', id:c.id, name:c.name, date:c.start||'', paid:false }));
  return p.concat(a);
}
function _aAddHol(yr,paid){

function _aExName(yr,kind,id,v){ if(kind==='sp') return _holSpecialUpdate(yr,id,'name',v); const c=_coGet(yr,id); if(c){ c.name=v; saveAll(); } }

function _aAdded(yr){

    <input type="date" class="cp-date ${x.date?'ok':''}" value="${x.date}" onchange="_aExDate(${yr},'${x.kind}','${x.id}',this.value)">

}

/* ── 卡 B（节日加关）：其他节日或假期前后也要加关（例：哈芝节前后）── */
function _cCustoms(yr){ return Object.keys(S.festivalDates[yr]||{}).filter(k=>!FESTIVAL_CONFIG.some(f=>f.id===k)); }
function _cAdd(yr){ const k='fx_'+Date.now(); _fest(yr,k).label='Other holiday'; saveAll(); _renderCards(); }
function _cLabel(yr,k,v){ _fest(yr,k).label=v; saveAll(); }
function _cAnchor(yr,k,v){ if(!_inYear(v,yr)){ _renderCards(); return; } const f=_fest(yr,k); f.anchor=v; _festRange(f); saveAll(); _renderCards(); }
function _cDel(yr,k){ if(!confirm('Delete this festival and its closed days?')) return; delete S.festivalDates[yr][k]; saveAll(); _renderCards(); }
function _cCustomHTML(yr){
  const ks=_cCustoms(yr);
  return ks.map(k=>{ const f=_fest(yr,k); let chips='';
      if(f.anchor){ let d=[_addD(f.anchor,-6),`${yr}-01-01`].sort()[1]; const to=[_addD(f.anchor,6),`${yr}-12-31`].sort()[0];
        while(d<=to){ const dow=_holidayDow(d), v=(f.days||{})[d], o=_cOther(yr,k,d);
          chips += _cChip(yr,k,d); d=_addD(d,1); } }
      const nOff=Object.values(f.days||{}).filter(v=>v==='OFF').length;
      return `<div class="card" style="padding:0;overflow:hidden"><div class="cp-row" style="background:var(--sur2)">
          <input type="text" class="cp-date" style="flex:1;min-width:170px" value="${escapeHTML(f.label||'')}" onchange="_cLabel(${yr},'${k}',this.value)">
          <span class="cp-note">around</span><input type="date" class="cp-date ${f.anchor?'ok':''}" value="${f.anchor||''}" onchange="_cAnchor(${yr},'${k}',this.value)">
          <span class="cp-note">${nOff} OFF day${nOff===1?'':'s'}</span>
          <button class="btn-plain" style="margin-left:auto;color:var(--red)" onclick="_cDel(${yr},'${k}')">Delete</button></div>
        ${f.anchor?`<div class="chips">${chips}</div>`:'<div class="cp-row"><span class="yc-hint">Pick a date to see the days around it.</span></div>'}</div>`; }).join('')
    + `<div class="card" style="padding:10px 14px"><button class="btn-plain" onclick="_cAdd(${yr})">+ Add another festival / holiday</button> <span class="cp-note">e.g. close the day after Hari Raya Haji</span></div>`;
}
/* 自订节日的关门日：名称用自己取的名字 */
const _getOffName_base = getOffName;
getOffName = function(ds){
  const n=_getOffName_base(ds); if(n) return n;
  const yr=parseInt(ds.slice(0,4));
  for(const [k,f] of Object.entries(S.festivalDates[yr]||{})){ if(!FESTIVAL_CONFIG.some(x=>x.id===k) && (f.days||{})[ds]==='OFF') return f.label||'Centre closed'; }
  const c=_coList(yr).find(c=>c.slot==='ph' && c.start===ds && c.status==='active'); return c ? (c.name||'Public holiday') : null;
};

/* ── 一天的类别（不写薪资 / 年假字眼）：PH1 / PH2 / Replacement / OFF / Centre closed / Sunday / Open ── */
function _dayType(ds){
  const yr=parseInt(ds.slice(0,4)), d=_hd(yr), dow=_holidayDow(ds);
  const tpl=HOLIDAY_TEMPLATE.find(t=>d[t.id]===ds);
  const sp=(S.specialHolidays[yr]||[]).find(h=>h.date===ds);
  if(tpl && tpl.cat==='PH1') return { t:'PH1', label:'PH1' };
  if(sp) return { t:(sp.category==='PH1'?'PH1':'PH2'), label:(sp.category==='PH1'?'PH1':'PH2') };
  if((tpl && tpl.cat==='PH2') || FESTIVAL_CONFIG.some(fc=>_festSlots(yr,fc.id).slots.includes(ds))) return { t:'PH2', label:'PH2' };
  const sub=_getSubHols(yr).find(x=>x.date===ds) || (ds.slice(5,7)==='01' ? _getSubHols(yr-1).find(x=>x.date===ds) : null);   // 含去年底补过来的
  if(sub) return sub.srcCat==='OFF' ? { t:'OFF', label:'OFF' } : { t:'SUB', label:'Replacement' };
  if(FESTIVAL_CONFIG.some(fc=>_festSlots(yr,fc.id).extra.some(e=>e.ds===ds && /replacement/.test(e.why)))) return { t:'SUB', label:'Replacement' };
  if(dow===0) return { t:'SUN', label:'Sunday' };
  if(isPH(ds)) return { t:'PH2', label:'PH2' };
  if(isCentreOff(ds) || isCentreClosed(ds)) return { t:'OFF', label:'OFF' };
  return { t:'OPEN', label:'Open' };
}
function _dtChip(dt){
  const c={ PH1:'st-ph1', PH2:'st-ph2', SUB:'st-sub', OFF:'st-off', CL:'st-cl' }[dt.t];
  return c ? `<span class="st ${c}">${dt.label}</span>` : `<span style="font-size:11px;color:var(--mut)">${dt.label}</span>`;
}

/* 卡 B 的节日格子：标签照这一天真正的类别显示；只有「这个节日自己加关的 OFF」和 Open 可以点 */
function _cChip(yr,fid,d){
  const f=((S.festivalDates[yr]||{})[fid])||{days:{}}, v=(f.days||{})[d], o=_cOther(yr,fid,d), dt=_dayType(d);
  const own = v==='OFF' && !o;
  const cls = { PH1:'ph1', PH2:'paid', SUB:'sub', OFF:'off', SUN:'sun' }[dt.t] || '';
  const lock = !own && dt.t!=='OPEN';
  return `<button class="chip-d ${cls}${lock?' lock':''}" onclick="_cToggle(${yr},'${fid}','${d}')"><span>${_ddmmS(d)} ${_DOW(d)}</span><b>${dt.label}</b></button>`;
}

function _dNone(yr,slot,on){ const fl=_yf(yr); fl.dNone=fl.dNone||{}; if(on) fl.dNone[slot]=true; else delete fl.dNone[slot]; saveAll(); _renderCards(); }
/* 时间用这台电脑的本地时间显示（马来西亚 UTC+8），不是 UTC */
function _locTime(ts){ const d=new Date(ts); if(isNaN(d)) return String(ts||''); const p=n=>String(n).padStart(2,'0'); return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`; }
/* 存云端时：节日 Day 1 / Day 2 落星期日的补假日，照 v14 的习惯也标 PH2 写进 details.days（其他系统照旧读得到）；
   同时记在 details.auto，读回来时拿掉，画面与计算只用真的 Day 1 / Day 2 */
function _festOut(yr,fid,f){
  const days=Object.assign({}, f.days||{}), auto=[];
  if(FESTIVAL_CONFIG.some(x=>x.id===fid)){
    const sl=_festSlots(yr,fid).slots;
    _getSubHols(yr).filter(s=>sl.includes(s.srcDate) && s.srcCat!=='OFF').forEach(s=>{ if(days[s.date]!=='PH2'){ days[s.date]='PH2'; auto.push(s.date); } });
  }
  return auto.length ? { days, auto } : { days };
}
function _festIn(det){ const days=Object.assign({}, det.days||{}); (det.auto||[]).forEach(ds=>{ if(days[ds]==='PH2') delete days[ds]; }); return days; }

/* ═══ v15 · 2026-10-09 · 卡 G：SRT 放假日（从 NoticeGo 搬进来，进云端）＋ 每日结果表 calendar_days ═══ */

/* ── 卡 G · SRT off days ──
   每年几个星期五、几个星期六 SRT 不上课（NoticeGo 原本固定 4 ＋ 4，这里可以加）。
   星期五遇到公共假期 → 那个星期六 SRT 补课（照 NoticeGo 原规则）。
   云端存成 calendar_events type = dept_off、depts = [SRT]，一个日期一笔。只影响 SRT。 */
function _srtGet(yr){ const s=((S.srtDates||{})[yr])||{}; return { fridays:(s.fridays||[]).slice(), saturdays:(s.saturdays||[]).slice() }; }
function _srt(yr){ if(!S.srtDates) S.srtDates={}; if(!S.srtDates[yr]) S.srtDates[yr]={ fridays:[], saturdays:[] }; const s=S.srtDates[yr]; if(!Array.isArray(s.fridays)) s.fridays=[]; if(!Array.isArray(s.saturdays)) s.saturdays=[]; return s; }
function _srtMakeup(fri){ if(!fri || !isPH(fri)) return null; return _addD(fri,1); }
function _gSet(yr,kind,i,val){
  if(val && !_inYear(val,yr)){ _renderCards(); return; }
  const a=_srt(yr)[kind]; while(a.length<=i) a.push(''); a[i]=val||'';
  saveAll(); _renderCards();
}
function _gAdd(yr,kind){ const a=_srt(yr)[kind], n=Math.max(4,a.length); while(a.length<n+1) a.push(''); _renderCards(); }
function _gDel(yr,kind,i){ const a=_srt(yr)[kind]; if(i<a.length) a.splice(i,1); saveAll(); _renderCards(); }
function _gStat(yr){
  const g=_srtGet(yr), f=g.fridays.filter(Boolean), s=g.saturdays.filter(Boolean);
  const bad=f.filter(d=>_holidayDow(d)!==5).concat(s.filter(d=>_holidayDow(d)!==6));
  const mk=f.map(_srtMakeup).filter(Boolean), clash=s.filter(d=>mk.includes(d));
  return { f, s, n:f.length+s.length, bad, mk, clash };
}
function _gPage(yr){
  const g=_srtGet(yr), st=_gStat(yr);
  const row=(kind,i,ds)=>{
    const fri=kind==='fridays', bad=ds && _holidayDow(ds)!==(fri?5:6), mk=fri && ds ? _srtMakeup(ds) : null, clash=!fri && ds && st.mk.includes(ds);
    return `<div class="cp-row"><span style="width:84px;font-size:12px;color:var(--mut)">${fri?'Friday':'Saturday'} ${i+1}</span>
      <input type="date" class="cp-date ${ds&&!bad&&!clash?'ok':''}" value="${ds||''}" onchange="_gSet(${yr},'${kind}',${i},this.value)">
      ${ds?`<span style="font-size:11px;color:var(--mut)">${_DOW(ds)}</span>`:''}
      ${bad?`<span class="yc-hint">Not a ${fri?'Friday':'Saturday'}</span>`:''}

  };
  const sec=(kind,title)=>{ const a=g[kind], n=Math.max(4,a.length); let h=''; for(let i=0;i<n;i++) h+=row(kind,i,a[i]||'');
    return `<div class="card" style="padding:0;overflow:hidden"><div class="cp-sec">${title}</div>${h}

}

/* ── 每日结果表 calendar_days ──
   已公布的年份：每一天的最终结果写成一行一行。其他系统（NoticeGo、ClassGo、HrLeave …）只读这张，不用自己算补假、关门、学校假期。
   kind：PH1 / PH2 / SUB（Replacement）/ OFF  → 全中心那一天（一天最多一行）
         SCHOOL（学校假期）/ EXTRA（补课）/ DEPT_OFF（某部门不上课，例：SRT）→ 看 depts
   depts 空 = 全部门；no_class = 那天该部门的正常课不上。星期日不用看这张，永远不上课。 */
const _dStrip = a => (Array.isArray(a)?a:[]).filter(d=>d!=='MASTER'&&d!=='TEACHER');
function _festNm(yr,fid){ const f=((S.festivalDates[yr]||{})[fid])||{}; return FESTIVAL_CONFIG.some(x=>x.id===fid) ? _fcName(fid) : (f.label||'Other holiday'); }
function _dayItems(ds){
  const yr=parseInt(ds.slice(0,4)), d=_hd(yr), out=[];
  const add=(n,s,f)=>{ if(!out.some(x=>x.n===n && x.s===s)) out.push(f?{ n, s, f }:{ n, s }); };
  HOLIDAY_TEMPLATE.forEach(t=>{ if(d[t.id]===ds) add(t.name,'gazette'); });
  (S.specialHolidays[yr]||[]).forEach(h=>{ if(h.date===ds) add(h.name||'Public holiday','gazette'); });
  Object.keys(S.festivalDates[yr]||{}).forEach(fid=>{
    const f=S.festivalDates[yr][fid]||{}, nm=_festNm(yr,fid), v=(f.days||{})[ds], std=FESTIVAL_CONFIG.some(x=>x.id===fid);
    if(std ? _festSlots(yr,fid).slots.includes(ds) : v==='PH2') add(nm,'fest',nm);
    else if(v==='OFF') add(nm,'fest_off',nm);
  });
  _getSubHols(yr).concat(ds.slice(5,7)==='01' ? _getSubHols(yr-1) : []).forEach(s=>{ if(s.date!==ds) return;
    const sy=parseInt(String(s.srcDate||ds).slice(0,4)), fid=Object.keys(S.festivalDates[sy]||{}).find(k=>FESTIVAL_CONFIG.some(x=>x.id===k) && _festSlots(sy,k).slots.includes(s.srcDate));
    add(s.name,'sub', fid ? _festNm(sy,fid) : null); });   // 节日的补假：记下是哪个节日（通知的节日整段才连得起来）
  const c=_coFind(ds); if(c) add(c.name||'Centre closed', c.slot==='ph' ? 'gazette' : 'closure');
  return out;
}
function _centreRow(ds){
  const dt=_dayType(ds)||{}, it=_dayItems(ds);
  let kind=['PH1','PH2','SUB','OFF'].includes(dt.t) ? dt.t : null;
  if(!kind && !it.length) return null;
  if(!kind) kind='OFF';                                  // 星期日的扣年假假期 / 关门：照样记，名字给通知用
  if(!it.length) it.push({ n:(getPHNameFull(ds)||getOffName(ds)||getCentreClosedName(ds)||'Holiday'), s:(kind==='SUB'?'sub':'gazette') });
  return { day:ds, kind, name:it.map(x=>x.n).join(' / '), depts:[], no_class:true, detail:{ items:it } };
}
function _dayRows(yr){
  yr=parseInt(yr); const Y=String(yr), rows=[];
  for(let m=1;m<=12;m++) for(let d=1;d<=_daysInMonth(yr,m);d++){ const r=_centreRow(_isoDate(yr,m,d)); if(r) rows.push(r); }
  const span=(a,b,fn)=>{ if(!a) return; let d=a; const e=(b&&b>=a)?b:a; while(d<=e){ if(d.slice(0,4)===Y) fn(d); d=_addD(d,1); } };
  Object.entries(S.schoolHolDates[yr]||{}).forEach(([k,r])=>{ if(!r.start||!r.end) return; const nm=_shName(r.name||k), dp=_dStrip(r.depts).sort();
    span(r.start,r.end,ds=>rows.push({ day:ds, kind:'SCHOOL', name:nm, depts:dp, no_class:true, detail:{ start:r.start, end:r.end } })); });
  (S.extraClasses[yr]||[]).forEach(e=>{ if(!e.start) return; const dp=_dStrip(e.depts).sort();
    span(e.start,e.end||e.start,ds=>rows.push({ day:ds, kind:'EXTRA', name:(e.name||'Extra Class'), depts:dp, no_class:false, detail:{ start:e.start, end:(e.end||e.start), time:(e.time||''), msg:(e.msg||'') } })); });
  const g=_srtGet(yr);
  [...new Set(g.fridays.filter(Boolean))].forEach(ds=>{ if(ds.slice(0,4)===Y) rows.push({ day:ds, kind:'DEPT_OFF', name:'SRT Friday off', depts:['SRT'], no_class:true, detail:{ slot:'fri' } }); });
  [...new Set(g.saturdays.filter(Boolean))].forEach(ds=>{ if(ds.slice(0,4)===Y) rows.push({ day:ds, kind:'DEPT_OFF', name:'SRT Saturday off', depts:['SRT'], no_class:true, detail:{ slot:'sat' } }); });
  [...new Set(g.fridays.map(_srtMakeup).filter(Boolean))].forEach(ds=>{ if(ds.slice(0,4)===Y && !g.saturdays.includes(ds)) rows.push({ day:ds, kind:'EXTRA', name:'SRT makeup class', depts:['SRT'], no_class:false, detail:{ srt:true } }); });
  return rows.sort((a,b)=>a.day.localeCompare(b.day) || a.kind.localeCompare(b.kind) || a.name.localeCompare(b.name));
}
/* 跟云端比：一样就不写（每次存档不用重写整年） */
function _canon(v){ if(Array.isArray(v)) return '['+v.map(_canon).join(',')+']'; if(v && typeof v==='object') return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+_canon(v[k])).join(',')+'}'; return JSON.stringify(v===undefined?null:v); }
function _daysSig(rows){ return rows.map(r=>_canon([String(r.day).slice(0,10), r.kind, r.name||'', (r.depts||[]).slice().sort(), !!r.no_class, r.detail||{}])).sort().join('\n'); }
let _DAYS_SIG = null;
function _pubYears(){ const ys=new Set(Object.keys(S.years||{}).concat([..._EV_YEARS]).map(Number)); return [...ys].filter(y=>y && _yearStatus(y)==='published').sort(); }
async function _daysSync(){
  if(!_DAYS_SIG){
    const { data, error } = await _sb.from('calendar_days').select('year,day,kind,name,depts,no_class,detail');
    if(error) throw error;
    const by={}; (data||[]).forEach(r=>(by[r.year]=by[r.year]||[]).push(r));
    _DAYS_SIG={}; Object.entries(by).forEach(([y,a])=>{ _DAYS_SIG[y]=_daysSig(a); });
  }
  let n=0;
  for(const y of _pubYears()){
    const rows=_dayRows(y), sig=_daysSig(rows);
    if(_DAYS_SIG[y]===sig) continue;
    const { error } = await _sb.rpc('calendar_days_replace', { p_year:y, p_rows:rows });
    if(error){ _DAYS_SIG=null; throw error; }
    _DAYS_SIG[y]=sig; n++;
  }
  return n;
}

/* ═══ 共用 · 迷你月历（Calendar 总览与 NoticeGo 用同一份；2026-10-09）═══
   资料一律是「每日结果」的列（calendar_days 的格式：day / kind / name / depts / no_class / detail）。
   Calendar 用自己算出来的列（草稿年份也看得到）；NoticeGo 用云端已公布的列。两边画出来的规则一模一样。 */
const _CENTRE = ['PH1','PH2','SUB','OFF'];
const _dDay = r => String(r.day).slice(0,10);
const _dMatch = (r, dept) => !r.depts || !r.depts.length || !dept || dept==='MASTER' || r.depts.includes(dept);
const _stripPar = n => String(n||'').replace(/\s*\([^)]*\)/g,'').trim();
const _nextD = (ds,n) => { const d=new Date(ds+'T12:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const _isSunD = ds => new Date(ds+'T12:00:00').getDay()===0;
const _follows = (end, ds) => _nextD(end,1)===ds || (_isSunD(_nextD(end,1)) && _nextD(end,2)===ds);   // 中间隔一个星期日也算连着
function _runs(list){   // 「日期＋名字」→ 连续同名合成一段
  const out=[]; list.slice().sort((a,b)=>a.n.localeCompare(b.n)||a.d.localeCompare(b.d)).forEach(x=>{
    const cur=out[out.length-1];
    if(cur && cur.n===x.n && _follows(cur.end,x.d)){ cur.end=x.d; cur.ss.add(x.s); cur.kk.add(x.k); }
    else out.push({ n:x.n, start:x.d, end:x.d, ss:new Set([x.s]), kk:new Set([x.k]) });
  });
  return out;
}
function _centrePartsOf(rows){   // 全中心每一天里的每一个假期
  const per=[];
  (rows||[]).filter(r=>_CENTRE.includes(r.kind)).forEach(r=>{
    const its=(r.detail && r.detail.items && r.detail.items.length) ? r.detail.items : [{ n:r.name, s:'gazette' }];
    its.forEach(it=>per.push({ d:_dDay(r), n:(it.s==='sub'?_stripPar(it.n):it.n), s:it.s, k:r.kind, f:it.f }));
  });
  return per;
}
const _PAL_PARENT = { dark:'#5C1010', light:'#F2DADA', lightTxt:'#7A1E1E', wk:'#8B3030', we:'#3d1a1a', pad:'#faf9f7', cellBd:'#ede9e3', sec:['#faf8f5','#edecea','#f5f2ec','#fbeeee','#f5f0fa'], line:'1px solid #5C1010', dash:'1.5px dashed #C0A0A0', ttl:'#5C1010', cnOp:.7 };
const _PAL_BOOK   = { dark:'#000',    light:'#AAAAAA', lightTxt:'#000',    wk:'#555',    we:'#000',    pad:'#f8f8f8', cellBd:'#e0e0e0', sec:['#f8f8f8','#f0f0f0','#eee','#e4e4e4','#e8e8e8'], line:'1px solid #000',    dash:'1.5px dashed #aaa',    ttl:'#000',    cnOp:.6 };
/* opt.allDepts：Calendar 总览（全部门）。只有星期日涂黑；某部门不上课（SRT）不涂色，另列一段。
   没有 opt.allDepts：给家长看（某一个部门）。星期日涂黑；星期六 SRK / GAK / ATC 没课涂黑，SRT 有课（Owner 10/9）。 */
function _miniCal(yr, mo, allRows, dept, P, opt){
  opt=opt||{}; const all=!!opt.allDepts;
  const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const MC=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  const days=new Date(yr,mo,0).getDate(), ms=`${yr}-${String(mo).padStart(2,'0')}`, af=(new Date(yr,mo-1,1).getDay()+6)%7;
  const rows=(allRows||[]).filter(r=>all || _dMatch(r,dept)), byDay={};
  rows.forEach(r=>{ (byDay[_dDay(r)]=byDay[_dDay(r)]||[]).push(r); });
  const DARK={ bg:P.dark, txt:'#fff' }, LIGHT={ bg:P.light, txt:P.lightTxt }, WHITE={ bg:'#fff', txt:'#555' };
  const style=(ds,dow)=>{
    if(dow===6 || (!all && dow===5 && dept!=='SRT')) return DARK;   // SRT 星期六有课（Owner 10/9）
    const rs=byDay[ds]||[], c=rs.find(r=>_CENTRE.includes(r.kind));
    if(c){ const ss=((c.detail&&c.detail.items)||[]).map(i=>i.s); return (!ss.length || ss.some(s=>s!=='fest_off')) ? DARK : LIGHT; }
    if(!all && rs.some(r=>r.kind==='DEPT_OFF')) return DARK;
    if(rs.some(r=>r.kind==='SCHOOL')) return LIGHT;
    return WHITE;
  };
  let cells='';
  for(let i=0;i<af;i++) cells+=`<div style="min-height:26px;background:${P.pad};"></div>`;
  for(let d=1; d<=days; d++){
    const ds=`${ms}-${String(d).padStart(2,'0')}`, st=style(ds,(af+d-1)%7), rs=byDay[ds]||[], ec=rs.some(r=>r.kind==='EXTRA');
    const tip=[...new Set(rs.map(r=>r.name))].join(' · ');
    cells+=`<div title="${escapeHTML(tip)}" style="min-height:26px;padding:2px;background:${st.bg};border:1px solid ${st===WHITE?P.cellBd:'transparent'};display:flex;flex-direction:column;align-items:center;justify-content:center;">
      <span style="font-size:11px;font-weight:700;color:${st.txt};line-height:1;">${d}</span>
      ${ec?`<span style="font-size:7px;line-height:1;color:${st===DARK?'#fff':st===LIGHT?P.lightTxt:P.dark}">★</span>`:''}</div>`;
  }
  const rem=(af+days)%7; if(rem>0) for(let i=0;i<7-rem;i++) cells+=`<div style="min-height:26px;background:${P.pad};"></div>`;
  const inM = (a,b) => a<=ms+'-31' && (b||a)>=ms+'-01';
  const line = t => `<div style="font-size:9px;line-height:1.6">${t}</div>`;
  const ph=[];
  for(let d=1; d<=days; d++){
    const ds=`${ms}-${String(d).padStart(2,'0')}`, c=(byDay[ds]||[]).find(r=>_CENTRE.includes(r.kind)); if(!c) continue;
    const its=((c.detail&&c.detail.items)||[{ n:c.name, s:'gazette' }]).filter(i=>i.s!=='fest_off' && i.s!=='closure');
    if(its.length) ph.push(`<div style="font-size:9px;line-height:1.6;font-weight:700"><b>${d}</b> ${escapeHTML([...new Set(its.map(i=>i.s==='sub'?_stripPar(i.n):i.n))].join(' / '))}</div>`);
  }
  const shM={}; rows.filter(r=>r.kind==='SCHOOL').forEach(r=>{ const a=(r.detail||{}).start||_dDay(r), b=(r.detail||{}).end||_dDay(r); if(!inM(a,b)) return; const k=r.name+'|'+a+'|'+b;
    if(!shM[k]) shM[k]={ a, b, n:r.name, dp:new Set() }; (r.depts||[]).forEach(x=>shM[k].dp.add(x)); });
  const sh=Object.values(shM).sort((x,y)=>x.a.localeCompare(y.a)).map(x=>line(`${_ddmmS(x.a)} – ${_ddmmS(x.b)} (${escapeHTML(String(x.n).replace(/^School Holiday \((.+)\)$/,'$1'))})${all&&x.dp.size?' · '+escapeHTML([...x.dp].sort().join(' ')):''}`));
  const parts=_centrePartsOf(rows);
  const fest=_runs(parts.filter(p=>p.f).map(p=>({ d:p.d, n:p.f, s:p.s, k:p.k }))).filter(g=>inM(g.start,g.end)).sort((x,y)=>x.start.localeCompare(y.start)).map(g=>line(`${_ddmmS(g.start)} – ${_ddmmS(g.end)} (${escapeHTML(g.n)})`));
  const clo=_runs(parts.filter(p=>p.s==='closure')).filter(g=>inM(g.start,g.end)).map(g=>({ a:g.start, t:`${_ddmmS(g.start)}${g.end!==g.start?' – '+_ddmmS(g.end):''} (${escapeHTML(g.n)})` }));
  const dOff=rows.filter(r=>r.kind==='DEPT_OFF' && _dDay(r).startsWith(ms));
  dOff.forEach(r=>clo.push({ a:_dDay(r), t:`${_ddmmS(_dDay(r))} (${escapeHTML(r.name)})` }));
  const cl=clo.sort((x,y)=>x.a.localeCompare(y.a)).map(x=>line(x.t));
  const ecG={}; rows.filter(r=>r.kind==='EXTRA').forEach(r=>{ const a=(r.detail||{}).start||_dDay(r), b=(r.detail||{}).end||_dDay(r); if(!inM(a,b)) return; const k=a+'|'+b; if(!ecG[k]) ecG[k]={ a, b, e:[] };
    const lbl=[r.name&&r.name!=='Extra Class'?r.name:'', (r.detail||{}).time||'', (r.detail||{}).msg||'', all&&r.depts&&r.depts.length?r.depts.join(' '):''].filter(Boolean).join(' · '); if(lbl && !ecG[k].e.includes(lbl)) ecG[k].e.push(lbl); });
  const ec=Object.values(ecG).sort((x,y)=>x.a.localeCompare(y.a)).map(g=>`<div style="font-size:9px;line-height:1.7"><b>${_ddmmS(g.a)}${g.b!==g.a?' – '+_ddmmS(g.b):''}</b>${g.e.length?' <span style="font-weight:400">'+escapeHTML(g.e.join(' / '))+'</span>':''}</div>`);
  const sec=(bd,bg,title,body)=>`<div style="padding:6px 10px;border-top:${bd};background:${bg};"><div style="font-size:8px;font-weight:700;color:${P.ttl};text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;">${title}</div>${body.join('')}</div>`;
  let secs='';
  if(ph.length)   secs+=sec(P.line, P.sec[0], 'Public Holiday', ph);
  if(sh.length)   secs+=sec(ph.length?P.dash:P.line, P.sec[1], 'KPM School Holiday', sh);
  if(fest.length) secs+=sec(P.line, P.sec[2], 'Our Festive Holidays', fest);
  if(cl.length)   secs+=sec(fest.length?P.dash:P.line, P.sec[3], dOff.length?'Centre Closed / No Class':'Centre Closed', cl);
  if(ec.length)   secs+=sec((fest.length||cl.length)?P.dash:P.line, P.sec[4], '★ Our Extra Learning Day', ec);
  if(!secs) secs=`<div style="border-top:${P.line};min-height:4px;"></div>`;
  return `<div style="border:2px solid ${P.dark};border-radius:6px;overflow:hidden;font-family:Arial,sans-serif;background:#fff;">
    <div style="background:${P.dark};color:#fff;padding:7px 12px;display:flex;justify-content:space-between;align-items:center;">
      <span style="font-weight:700;font-size:12px;">${MN[mo-1]} ${yr}</span><span style="font-size:10px;opacity:${P.cnOp};">${MC[mo-1]}</span></div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);">${['M','T','W','T','F','S','S'].map((x,i)=>`<div style="text-align:center;font-size:9px;font-weight:700;padding:4px 0;background:${(i===6||(!all&&i===5&&dept!=='SRT'))?P.we:P.wk};color:#fff;">${x}</div>`).join('')}</div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);border-bottom:${P.line};">${cells}</div>
    ${secs}</div>`;
}

/* Import（汇入整份 JSON，会盖掉云端）只给 Owner（10/9） */
function _navRole(){ const el=document.getElementById('nav-import'); if(el) el.style.display=_isOwner()?'':'none'; }

function _scDayCount(s,e){
  let al=0, total=0, phDays=0;
  let d=new Date(s+'T12:00:00'), end=new Date(e+'T12:00:00');
  while(d<=end){
    const dow=d.getDay();
    const ds=d.toISOString().slice(0,10);
    if(dow!==0){ // Mon–Sat (working days)
      total++;
      if(isPH(ds)){   /* v15 · isPH 已含带薪补假；扣年假的补假不算 PH */
        phDays++; // PH day — no AL deducted
      } else {
        al++; // AL will be deducted
      }
    }
    d.setDate(d.getDate()+1);
  }
  return { al, total, ph:phDays };

/* v13 · 从 Store.set 拆出来：S → calendar_events 列。储存与「载入时比对差异」共用同一套，不会各说各话 */
function _calRows(obj){
    const strip = (a)=> (Array.isArray(a)?a:[]).filter(d=>d!=='MASTER'&&d!=='TEACHER');   // table stores real depts only
    const rows = [];
    for(const yr in (obj.holidayDates||{})){
      for(const name in obj.holidayDates[yr]){
        rows.push({ id:_rowId(yr,'public_holiday',name), year:parseInt(yr), type:'public_holiday', name:name, start_date:obj.holidayDates[yr][name]||null, end_date:null, depts:[], details:{} });
      }
    }
    for(const yr in (obj.schoolHolDates||{})){
      for(const key in obj.schoolHolDates[yr]){
        const h = obj.schoolHolDates[yr][key];
        rows.push({ id:_rowId(yr,'school_holiday',key), year:parseInt(yr), type:'school_holiday', name:(h.name||key), start_date:h.start||null, end_date:h.end||null, depts:strip(h.depts), details:Object.assign(SCHOOL_HOL_TEMPLATE.some(t=>t.id===key) ? { slot:key } : {}, h.kpm ? { kpm:h.kpm } : {}) });
      }
    }
    for(const yr in (obj.festivalDates||{})){
      for(const name in obj.festivalDates[yr]){
        const f = obj.festivalDates[yr][name];
        rows.push({ id:_rowId(yr,'festival',name), year:parseInt(yr), type:'festival', name:name, start_date:f.start||null, end_date:f.end||null, depts:[], details:Object.assign(_festOut(parseInt(yr), name, f), f.label?{ label:f.label }:{}, f.anchor?{ anchor:f.anchor }:{}) });
      }
    }
    for(const yr in (obj.extraClasses||{})){
      for(const e of (obj.extraClasses[yr]||[])){
        rows.push({ id:(e.id||('ec_'+Date.now().toString(36)+Math.random().toString(36).slice(2,5))), year:parseInt(yr), type:'extra_class', name:(e.name||'Extra Class'), start_date:e.start||null, end_date:e.end||null, depts:strip(e.depts), details:Object.assign({ time:(e.time||''), msg:(e.msg||'') }, e.kpm ? { kpm:e.kpm } : {}) });
      }
    }
    for(const yr in (obj.specialHolidays||{})){
      for(const s of (obj.specialHolidays[yr]||[])){
        const rest = {}; for(const k in s){ if(k!=='date'&&k!=='name'&&k!=='id') rest[k]=s[k]; }
        rows.push({ id:(s.id||('sp_'+(s.date||'')+'_'+Math.random().toString(36).slice(2,6))), year:parseInt(yr), type:'special_holiday', name:(s.name||'Special'), start_date:(s.date||null), end_date:null, depts:[], details:rest });
      }
    }
    for(const yr in (obj.centreOff||{})){   /* v15 · 中心关门：全中心、全天；状态 active / pending */
      for(const c of (obj.centreOff[yr]||[])){
        const rest = {}; for(const k in c){ if(!['id','name','start','end'].includes(k)) rest[k]=c[k]; }
        rows.push({ id:c.id, year:parseInt(yr), type:'centre_off', name:(c.name||'Centre closed'), start_date:(c.start||null), end_date:(c.end||c.start||null), depts:[], details:rest });
      }
    }
    for(const yr in (obj.srtDates||{})){   /* v15 · 卡 G：SRT 放假日，一个日期一笔；编号用日期，排序变了也不换号 */
      const g=obj.srtDates[yr]||{};
      [['fri',g.fridays],['sat',g.saturdays]].forEach(([slot,a])=>[...new Set((a||[]).filter(Boolean))].forEach(ds=>{
        rows.push({ id:'srt_'+slot+'_'+ds, year:parseInt(yr), type:'dept_off', name:(slot==='fri'?'SRT Friday off':'SRT Saturday off'), start_date:ds, end_date:ds, depts:['SRT'], details:{ slot } });
      }));
    }
    return rows;
}

      if(p.extraClasses    && typeof p.extraClasses==='object')    S.extraClasses    = p.extraClasses;
  if(p.centreOff       && typeof p.centreOff==='object')       S.centreOff       = p.centreOff;
  if(p.years           && typeof p.years==='object')           S.years           = p.years;
  if(p.srtDates        && typeof p.srtDates==='object')        S.srtDates        = p.srtDates;

async function doLogin() {
  const email = document.getElementById('auth-email').value.trim();
  const pass = document.getElementById('auth-pass').value;
  const errEl = document.getElementById('auth-err');
  errEl.textContent = '';
  if (!email) { errEl.textContent = 'Please enter email'; return; }
  if (!pass) { errEl.textContent = 'Please enter password'; return; }
  const btn = document.getElementById('auth-login-btn');
  btn.disabled = true; btn.textContent = 'Logging in...';
  try {
    const { error } = await _sb.auth.signInWithPassword({ email, password: pass });
    if (error) throw error;
    await initApp();
  } catch (e) {
    errEl.textContent = e.message || 'Login failed';
    btn.disabled = false; btn.textContent = 'Login';
  }
}

    window._ROLE = (r && !r.error && r.data) || '';
  }catch(e){ window._ROLE = ''; }
  try{ _CHG_SNAP = _staffMap(); await _chgLoad(); }catch(e){}   /* v15 · 改动纪录 */
  try{ await _daysSync(); }catch(e){ console.warn('calendar_days check on open', e); }   /* v15 · 每日结果表跟现在的资料对一次（只有能编辑的人写得进去） */
  goPage('holidays');
  _syncPaint();
  if (window._syncRestored) { setTimeout(() => saveAll(), 600); }   /* v13 · 选了「保留我的」→ 自动再推云 */
}
function showLoadFail(){
  CLOUD_READ_OK = false;
  document.body.innerHTML = '<div style="max-width:460px;margin:80px auto;padding:28px;border:1px solid #ddd;border-radius:12px;font-family:system-ui,sans-serif;line-height:1.6">'
    + '<h2 style="margin:0 0 10px;font-size:18px">暂时读不到资料</h2>'
    + '<p style="margin:0 0 6px"><b>没有任何资料被改动。</b>所有资料都还在云端，完好无缺。</p>'
    + '<p style="margin:0 0 16px;color:#666">可能是网路不稳或登入过期。请重新载入；还是不行，请联络管理员。</p>'
    + '<button onclick="location.reload()" style="padding:9px 18px;border-radius:8px;border:none;background:#2D6A4F;color:#fff;font-size:14px;cursor:pointer">重新载入</button></div>';
  _syncLoadFailNote();   /* v13 */
}

// ═══════════════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════════════
(async () => {
  const { data: { session } } = await _sb.auth.getSession();
  if (session) {
    await initApp();
  }
})();

/* ══════════════════════════════════════════════════════════════════
   断线重试 + 关页面补送 · 照 ObsGo v14 的做法，另加 pagehide
   ① 网路一回来 → 立刻补送
   ② 画面被切走（切 App / 换分页）→ 马上补送
   ③ 分页被关掉 / 被手机回收（pagehide）→ 马上补送
      —— iOS Safari 直接回收分页时不保证跑 visibilitychange，pagehide 会跑
   ④ 还有没送出去的 → 每 60 秒自己再试
   ⑤ 开页面 / 登入後 → 本机还有没上云的，自动补送
   全部走既有的 saveAll()，不另开推云路径；送之前先看有没有真的还没送的，避免重复送。
   ══════════════════════════════════════════════════════════════════ */
function _resendPending(){
  try{ return !!(UNSYNCED || _pendingGet()); }catch(e){ return false; }
}
let _resendBusy = false;
async function _resendNow(why){
  if(_resendBusy) return;
  if(!_resendPending()) return;
  _resendBusy = true;
  try{
    if(!_resendPending()) return;
    console.log('[补送] ' + why);
    await saveAll();
  }catch(e){ console.warn('[补送] 失败，等下次再试：', (e && e.message) || e); }
  finally{ _resendBusy = false; }
}
window.addEventListener('online', () => { _resendNow('网路回来了'); });
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'hidden') _resendNow('画面被切走');
});
window.addEventListener('pagehide', () => { _resendNow('分页被关掉'); });
setInterval(() => { if(navigator.onLine !== false) _resendNow('每 60 秒再试一次'); }, 60000);
/* 开页面 / 登入後补送：等载入流程（含「要保留哪一份」）走完再看 */
(function(){
  const _origInitApp = (typeof initApp === 'function') ? initApp : null;
  if(!_origInitApp) return;
  initApp = async function(){
    const r = await _origInitApp.apply(this, arguments);
    setTimeout(() => _resendNow('开页面时本机还有没上云的'), 1500);
    return r;
  };
})();
</script>
