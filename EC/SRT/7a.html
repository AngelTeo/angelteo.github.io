<!doctype html>
<html lang="en">
<head>
<meta name="srt-internal" content="LV8 W27">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Reader Kids English Programme</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1d2433;--muted:#5d6577;--line:#dfe3ea;--brand:#1f3a5f;--accent:#f2b134;--ok:#1f9d6b;--okbg:#e3f6ee;--bad:#d64545;--badbg:#fde8e8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;font-size:18px;line-height:1.5}
button,input,textarea{font:inherit}
.wrap{max-width:860px;margin:0 auto;padding:16px}
header{background:var(--brand);color:#fff;border-radius:16px;padding:18px 20px;margin-bottom:14px}
header h1{margin:0;font-size:26px}
header .s{opacity:.85;font-size:15px;margin-top:4px}
.name{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.name input{flex:1;min-width:180px;border:0;border-radius:10px;padding:8px 12px;font-size:18px}
.how{background:#fff;border-radius:14px;padding:12px 16px;margin-bottom:14px;font-size:16px;border-left:6px solid var(--accent)}
.how ol{margin:4px 0;padding-left:22px}
details.gn{background:#fff;border-radius:14px;padding:10px 16px;margin-bottom:14px}
details.gn summary{font-weight:800;color:var(--brand);cursor:pointer}
.gn table{border-collapse:collapse;width:100%;font-size:15px;margin:8px 0}
.gn th{background:var(--brand);color:#fff;text-align:left;padding:6px 8px}
.gn td{border:1px solid var(--line);padding:6px 8px;vertical-align:top}
.gn .ex{color:#2f6fde;font-weight:600}
.gn h4{margin:12px 0 4px}
.sec{background:var(--card);border-radius:16px;padding:14px 18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.sec h2{margin:0 0 2px;font-size:21px;color:var(--brand)}
.sec .ins{color:var(--muted);font-size:15px;margin-bottom:8px}
.sec .ss{float:right;font-weight:800;font-size:16px;color:var(--brand)}
.q{padding:10px 0;border-top:1px solid #eef0f4}
.q:first-of-type{border-top:0}
.qt{display:flex;gap:8px}
.qt .n{min-width:28px;font-weight:800;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 0 36px}
.opts label{border:2px solid #c9cfdb;border-radius:12px;padding:4px 14px;cursor:pointer;background:#fff;font-weight:600}
.opts input{margin-right:6px}
.opts label.sel{border-color:var(--brand);background:#eef3fb}
.q input.t{border:2px solid #c9cfdb;border-radius:10px;padding:4px 10px;min-width:150px;max-width:100%;font-weight:600}
.q input.t.full{width:100%;margin:6px 0 0 36px;width:calc(100% - 36px)}
.hint{color:var(--muted);font-style:italic}
.ok input.t,.ok .opts label.sel{border-color:var(--ok)!important;background:var(--okbg)!important}
.bad input.t,.bad .opts label.sel{border-color:var(--bad)!important;background:var(--badbg)!important}
.fb{display:none;margin:6px 0 0 36px;font-weight:700;font-size:16px}
.ok .fb{display:block;color:var(--ok)}
.bad .fb{display:block;color:var(--bad)}
table.tb{border-collapse:collapse;width:100%;margin:6px 0 12px}
table.tb th{background:#eef1f6;border:1px solid var(--line);padding:6px;font-size:15px}
table.tb td{border:1px solid var(--line);padding:4px;text-align:center}
table.tb td.g{font-weight:800}
table.tb input{width:100%;border:2px solid #c9cfdb;border-radius:8px;padding:4px 6px;text-align:center;font-weight:600}
table.tb td.ok input{border-color:var(--ok);background:var(--okbg)}
table.tb td.bad input{border-color:var(--bad);background:var(--badbg)}
table.tb .c{display:none;font-size:14px;color:var(--bad);font-weight:700}
table.tb td.bad .c{display:block}
.cap{font-weight:800;margin:10px 0 2px}
.w textarea{width:calc(100% - 36px);margin:6px 0 0 36px;border:2px solid #c9cfdb;border-radius:10px;padding:6px 10px;min-height:56px}
.w .cue{color:var(--muted)}
.w button{margin:6px 0 0 36px;border:1px solid #c9cfdb;background:#fff;border-radius:9px;padding:2px 12px;font-size:15px;color:var(--brand)}
.w .model{display:none;margin:6px 0 0 36px;color:var(--ok);font-weight:700}
.w .model.show{display:block}
.essay p{font-size:18px;line-height:1.75}
.pbox{border:2px solid #1d2433;border-radius:10px;padding:8px 12px;margin:6px 0 6px 36px;background:#fffef7}
.pbox div{margin:1px 0}
@media (max-width:600px){.pbox{margin-left:0}}
.bar{position:sticky;bottom:0;background:rgba(244,246,250,.96);padding:10px 0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.bar button{border:0;border-radius:12px;padding:10px 22px;font-weight:800;font-size:18px;background:#fff;color:var(--brand);border:2px solid var(--brand)}
.bar button.pri{background:var(--brand);color:#fff}
.result{display:none;background:#fff;border-radius:16px;padding:18px 20px;margin-bottom:16px;border:3px solid var(--accent);text-align:center}
.result.show{display:block}
.result .big{font-size:52px;font-weight:900;color:var(--brand)}
.result .stars{font-size:34px}
.result table{margin:8px auto;border-collapse:collapse;font-size:16px}
.result td{padding:3px 10px;border-bottom:1px solid var(--line);text-align:left}
.result .who{font-size:20px;font-weight:800}
.result .tip{color:var(--muted);font-size:15px}
.warn{color:var(--bad);font-weight:700}
@media (max-width:600px){.bar{position:static}html,body{font-size:17px}.opts{margin-left:0}.q input.t.full,.w textarea,.fb,.w button,.w .model{margin-left:0;width:100%}table.tb th,table.tb td{font-size:14px;padding:3px}header h1{font-size:22px}}
@media print{.bar{display:none}}
.spk{border:1px solid #9aa4b8;background:#eef3ff;border-radius:16px;padding:2px 10px;font-size:14px;cursor:pointer;margin:4px 0}
.spk:active{background:#d6e2ff}
</style>
</head>

<script>
const D={"code": "7a", "key": "LV8_W27", "title": "Smart Reader Kids English Programme", "sub": "E Class Homework · 7a · 176 questions · auto-marked", "notes": "<table><tr><th colspan=2>A · Adverbs of manner tell us <u>how</u> something happens.</th></tr>\n<tr><td colspan=2>They are usually placed either <b>after the main verb</b> or <b>after the object</b>.</td></tr>\n<tr><td>1</td><td class=ex>He swims well.</td></tr><tr><td>2</td><td class=ex>He ran quickly.</td></tr><tr><td>3</td><td class=ex>She spoke softly.</td></tr>\n<tr><td>4</td><td class=ex>James coughed loudly to attract her attention.</td></tr>\n<tr><td>5</td><td class=ex>He plays the flute beautifully. <i>(after the direct object)</i></td></tr>\n<tr><td>6</td><td class=ex>He ate the chocolate cake greedily. <i>(after the direct object)</i></td></tr></table>\n<p>👉 Ask: <b>How</b> does he swim? → <b>well</b>. <b>How</b> did he run? → <b>quickly</b>.</p><table><tr><th colspan=2>Adverbs of Time</th></tr>\n<tr><td><b>Use</b></td><td>Tell us <b>when</b> an action happens.</td></tr>\n<tr><td><b>Examples</b></td><td class=ex>1. We will visit tomorrow.<br>2. She visited us yesterday.</td></tr></table><table><tr><th colspan=3>Rule 1 · Usually, add -ly to the adjective</th></tr><tr><td colspan=3><b>[ adjective + ly ]</b></td></tr><tr><td class=ex>quiet</td><td>→</td><td class=ex><b>quietly</b></td></tr><tr><td class=ex>poor</td><td>→</td><td class=ex><b>poorly</b></td></tr><tr><td class=ex>slow</td><td>→</td><td class=ex><b>slowly</b></td></tr></table><table><tr><th colspan=3>Rule 2 · Adjectives ending in -y</th></tr><tr><td colspan=3><b>[ remove y + ily ]</b></td></tr><tr><td class=ex>easy</td><td>→</td><td class=ex><b>easily</b></td></tr><tr><td class=ex>angry</td><td>→</td><td class=ex><b>angrily</b></td></tr><tr><td class=ex>happy</td><td>→</td><td class=ex><b>happily</b></td></tr></table><table><tr><th colspan=3>Rule 3 · Adjectives ending in -e</th></tr><tr><td colspan=3><b>[ keep the e + ly ]</b></td></tr><tr><td class=ex>private</td><td>→</td><td class=ex><b>privately</b></td></tr><tr><td class=ex>brave</td><td>→</td><td class=ex><b>bravely</b></td></tr></table><p>⚠ Exceptions: true → <b>truly</b> · due → <b>duly</b> · whole → <b>wholly</b></p><table><tr><th colspan=3>Rule 4 · Adjectives ending in -le (-tle, -ble, -ple)</th></tr><tr><td colspan=3><b>[ remove e + y ]</b></td></tr><tr><td class=ex>terrible</td><td>→</td><td class=ex><b>terribly</b></td></tr><tr><td class=ex>gentle</td><td>→</td><td class=ex><b>gently</b></td></tr><tr><td class=ex>simple</td><td>→</td><td class=ex><b>simply</b></td></tr></table><table><tr><th colspan=3>Rule 5 · Adjectives ending in -ful</th></tr><tr><td colspan=3><b>[ keep -ful + ly ]</b></td></tr><tr><td class=ex>wonderful</td><td>→</td><td class=ex><b>wonderfully</b></td></tr><tr><td class=ex>careful</td><td>→</td><td class=ex><b>carefully</b></td></tr></table><p>⚠ full → <b>fully</b></p><table><tr><th colspan=2>Rule 6 · Some adverbs have the same form as the adjective</th></tr>\n<tr><th>Adjective</th><th>Adverb</th></tr><tr><td>fast</td><td><b>fast</b></td></tr><tr><td>hard</td><td><b>hard</b></td></tr><tr><td>late</td><td><b>late</b></td></tr><tr><td>early</td><td><b>early</b></td></tr><tr><td>daily</td><td><b>daily</b></td></tr><tr><td>straight</td><td><b>straight</b></td></tr>\n<tr><td>good</td><td><b>well</b> ⭐</td></tr></table>\n<p>Careful: <b>hardly</b> means “almost not”, <b>lately</b> means “recently”.</p><table><tr><th></th><th>Uses</th><th>Form</th><th>Examples</th></tr>\n<tr><td><b>Positive</b></td><td>Describes the actions without comparison</td><td>Base form (often ends in -ly)</td><td class=ex>1. She sings beautifully on the stage.<br>2. He runs fast.</td></tr>\n<tr><td><b>Comparative</b></td><td>Compares two actions</td><td>Use <b>\"more\"</b> (…than)</td><td class=ex>1. She sings more beautifully than her friend.<br>2. He runs faster than his friend.</td></tr>\n<tr><td><b>Superlative</b></td><td>Shows the highest degree among three or more actions</td><td>Use <b>\"most\"</b> (the…)</td><td class=ex>1. She sings the most beautifully of all singers.<br>2. He runs the fastest of all runners.</td></tr></table><table><tr><th>B · An adverb of manner <u>cannot</u> go between a verb and its direct object.</th></tr>\n<tr><td>Put it <b>before the verb</b> or <b>at the end</b>.</td></tr></table><table><tr><th colspan=2>C · With a preposition before the object</th></tr>\n<tr><td colspan=2>Put the adverb <b>before the preposition</b> or <b>after the object</b>.</td></tr>\n<tr><td class=ex colspan=2>The child ran happily towards his mother.<br>The child ran towards his mother happily.</td></tr>\n<tr><th colspan=2>D · Verbs with no object</th></tr><tr><td colspan=2>Put the adverb <b>right after the verb</b>.</td></tr>\n<tr><td class=ex colspan=2>The town grew quickly after 1997.<br>He waited patiently for his mother to arrive.</td></tr>\n<tr><th colspan=2>E · well, badly, hard, fast</th></tr><tr><td colspan=2>Almost always <b>right after the verb</b>.</td></tr>\n<tr><td class=ex colspan=2>He swam well despite being tired.<br>The rain fell hard during the storm.</td></tr></table><table><tr><th colspan=2>F · Two verbs in one sentence — the position changes the meaning</th></tr>\n<tr><th>Example</th><th>Meaning</th></tr>\n<tr><td class=ex>She quickly agreed to retype the letter.</td><td>the agreeing is quick</td></tr>\n<tr><td class=ex>She agreed quickly to retype the letter.</td><td>the agreeing is quick</td></tr>\n<tr><td class=ex>She agreed to retype the letter quickly.</td><td>the retyping is quick</td></tr>\n<tr><td class=ex>He quietly asked me to leave the house.</td><td>the asking is quiet</td></tr>\n<tr><td class=ex>He asked me to leave the house quietly.</td><td>the leaving is quiet</td></tr></table><h4>Grammar Note 2 · Adverbs of Time / Frequency</h4><table><tr><th>Position</th><th>Examples</th></tr>\n<tr><td><b>Beginning of the Sentence</b></td><td class=ex>Next week, we are going on a field trip.<br>Today, I learned how to ride a bicycle.</td></tr>\n<tr><td><b>End of the Sentence</b></td><td class=ex>She will start her homework tomorrow.<br>They played soccer yesterday.</td></tr>\n<tr><td><b>\"Never\", \"Always\", \"Sometimes\" — Before the Main Verb</b></td><td class=ex>She never eats breakfast before school.<br>They always arrive early for the meetings.</td></tr>\n<tr><td><b>After the Verb \"to be\"</b></td><td class=ex>He is never late to school.<br>He is always on time.</td></tr></table>", "sections": [{"type": "read", "title": "Reading: The Balloon Car", "ins": "Listen 🔊 and read the story two times. Then answer the questions below.", "paras": ["Last month, Ms Tan announced a science fair at Sam's school. “Each group must build a small car that moves without batteries,” she said. Sam, Ravi and Mei decided to work together. That evening, they met at Sam's house and started immediately.", "Ravi had a clever idea. “Let's use a balloon!” he said excitedly. When the air rushes out of the balloon, it pushes the car forward. The children worked hard every day after school. Mei cut the cardboard neatly, Ravi fixed the wheels carefully, and Sam tested the car again and again.", "At first, the car moved slowly. It stopped after only one metre. “We have to make it lighter,” said Mei thoughtfully. They replaced the heavy wheels with bottle caps. Now the car ran faster than before. They practised harder than ever, and the car went further every day.", "On the day of the fair, the hall was full. Ten cars lined up at the starting line. When Ms Tan shouted “Go!”, the children let go of their cars at once. Daniel's car moved the fastest at the start, but it soon turned sideways and crashed into the wall. The balloon car moved more steadily than the others and finally crossed the finish line first.", "The judges were very impressed. “This group worked best together,” they said. Later that day, Sam told his parents the good news proudly. “Next year,” he said, “we will build an even better car!”"], "imgs": [null, null, null, null, null]}, {"type": "choice", "title": "Reading: Questions", "ins": "Choose the correct answer.", "items": [{"q": "Who announced the science fair?", "opts": ["Ms Tan", "the headmaster", "Sam's father"], "ans": ["Ms Tan"]}, {"q": "What made the car move?", "opts": ["batteries", "a balloon", "a motor"], "ans": ["a balloon"]}, {"q": "Why did the car run faster after the change?", "opts": ["They used lighter wheels.", "They added batteries.", "They painted it."], "ans": ["They used lighter wheels."]}, {"q": "What happened to Daniel's car?", "opts": ["It won the race.", "It crashed into the wall.", "It never moved."], "ans": ["It crashed into the wall."]}, {"q": "Which car crossed the finish line first?", "opts": ["Daniel's car", "the balloon car", "Ms Tan's car"], "ans": ["the balloon car"]}, {"q": "What did the judges say about the group?", "opts": ["They worked best together.", "They were the fastest.", "They were late."], "ans": ["They worked best together."]}]}, {"type": "input", "title": "Reading: Find it in the story", "ins": "Look back at the story. Type the missing word.", "items": [{"q": "The children worked ___ every day after school.", "hint": "hard / hardly", "ans": ["hard"]}, {"q": "Now the car ran ___ than before.", "hint": "fast", "ans": ["faster"]}, {"q": "They practised ___ than ever.", "hint": "hard", "ans": ["harder"]}, {"q": "Daniel's car moved the ___ at the start.", "hint": "fast", "ans": ["fastest"]}, {"q": "The balloon car moved ___ steadily than the others.", "hint": "more / most", "ans": ["more"]}, {"q": "“This group worked ___ together.”", "hint": "well", "ans": ["best"]}]}, {"type": "choice", "title": "Adjective or Adverb?", "ins": "Choose the correct word. Adjective describes a noun; adverb describes a verb.", "items": [{"q": "The bed is very ______ so I can sleep very well.", "opts": ["soft", "softly"], "ans": ["soft"]}, {"q": "He can play sports ______ because he is strong.", "opts": ["good", "well"], "ans": ["well"]}, {"q": "The homework was ______ and I finished it fast.", "opts": ["easy", "easily"], "ans": ["easy"]}, {"q": "Please walk ______ because my sister is sleeping.", "opts": ["quiet", "quietly"], "ans": ["quietly"]}, {"q": "My friends are ______ that I didn't help them.", "opts": ["angry", "angrily"], "ans": ["angry"]}, {"q": "Danny looks ______ today.", "opts": ["happy", "happily"], "ans": ["happy"]}, {"q": "You always speak so ______ to everyone.", "opts": ["nice", "nicely"], "ans": ["nicely"]}]}, {"type": "input", "title": "Spelling: Adjective → Adverb", "ins": "Change the adjective into an adverb. Check the spelling rules in Grammar Notes.", "items": [{"q": "crazy → ______", "hint": null, "ans": ["crazily"]}, {"q": "early → ______", "hint": null, "ans": ["early"]}, {"q": "hopeful → ______", "hint": null, "ans": ["hopefully"]}, {"q": "slow → ______", "hint": null, "ans": ["slowly"]}, {"q": "true → ______", "hint": null, "ans": ["truly"]}, {"q": "greedy → ______", "hint": null, "ans": ["greedily"]}, {"q": "sad → ______", "hint": null, "ans": ["sadly"]}, {"q": "complete → ______", "hint": null, "ans": ["completely"]}, {"q": "warm → ______", "hint": null, "ans": ["warmly"]}, {"q": "whole → ______", "hint": null, "ans": ["wholly"]}, {"q": "busy → ______", "hint": null, "ans": ["busily"]}, {"q": "full → ______", "hint": null, "ans": ["fully"]}, {"q": "due → ______", "hint": null, "ans": ["duly"]}, {"q": "steady → ______", "hint": null, "ans": ["steadily"]}, {"q": "peaceful → ______", "hint": null, "ans": ["peacefully"]}, {"q": "clumsy → ______", "hint": null, "ans": ["clumsily"]}, {"q": "possible → ______", "hint": null, "ans": ["possibly"]}, {"q": "daily → ______", "hint": null, "ans": ["daily"]}, {"q": "skilful → ______", "hint": null, "ans": ["skilfully", "skillfully"]}, {"q": "messy → ______", "hint": null, "ans": ["messily"]}, {"q": "rapid → ______", "hint": null, "ans": ["rapidly"]}, {"q": "careful → ______", "hint":    T.rows.forEach((r,ri)=>{const tr=el('tr');r.forEach((c,ci)=>{if(typeof c==='string'){tr.append(el('td',{class:'g'},c));return;}const id=si+'_'+ti+'_'+ri+'_'+ci;const inp=el('input',{autocomplete:'off',autocapitalize:'off',spellcheck:'false'});inp.value=saved[id]||'';const cc=el('div',{class:'c'});const td=el('td',{},inp,cc);inp.oninput=()=>{saved[id]=inp.value;save();td.classList.remove('ok','bad');};tr.append(td);g.items.push({id,q:td,fb:cc,ans:c.ans,get:()=>saved[id],cell:true});});t.append(tr);});sec.append(t);});}
 if(S.type==='write'){S.items.forEach((it,i)=>{const id=si+'_'+i;const ta=el('textarea',{placeholder:'Write your sentence here'});ta.value=saved[id]||'';ta.oninput=()=>{saved[id]=ta.value;save();};const m=el('div',{class:'model'},'Example: '+it.model);
   sec.append(el('div',{class:'q w'},el('div',{class:'qt'},el('span',{class:'n'},(i+1)+'.'),el('span',{},el('b',{},it.verb),' ',el('span',{class:'cue'},it.cue))),ta,el('button',{onclick:()=>{if(!ta.value.trim()){alert('Write your own sentence first!');return;}m.classList.toggle('show');}},'Check with example'),m,spk(()=>ta.value||'Write your sentence first','🔊 Read my sentence')));});}
 if(S.type==='read'){sec.append(spk(S.paras.join(' '),'🔊 Listen to all'),el('div',{class:'essay'},...S.paras.map((p,i)=>el('div',{},S.imgs&&S.imgs[i]?el('img',{src:S.imgs[i],alt:'',style:'width:100%;border-radius:14px;margin:10px 0 4px;display:block'}):null,el('p',{},el('span',{html:p}),' ',spk(p,'🔊'))))));}
 if(g.items.length)graders.push(g);$('#main').append(sec);});
function grade(){let sc=0,tot=0;graders.forEach(g=>{g.score=0;g.total=g.items.length;g.items.forEach(it=>{const v=it.get();const ok=it.exact?it.ans.includes(v):isRight(v,it.ans);it.q.classList.remove('ok','bad');it.q.classList.add(ok?'ok':'bad');it.fb.textContent=ok?(it.cell?'':'✓ Correct!'):(it.cell?it.ans[0]:'✗ Answer: '+it.ans[0]);if(ok)g.score++;});g.ss.textContent=g.score+' / '+g.total;sc+=g.score;tot+=g.total;});return[sc,tot];}
function showResult(sc,tot){const pct=tot?Math.round(sc/tot*100):0;const stars=pct>=90?'⭐⭐⭐':pct>=70?'⭐⭐':pct>=50?'⭐':'💪';const now=new Date();
 const r=$('#res');r.innerHTML='';r.append(el('div',{class:'who'},($('#nm').value||'(no name)')+' · '+D.code+'. SRT E Class Homework'),el('div',{class:'big'},sc+' / '+tot),el('div',{class:'stars'},stars+'  '+pct+'%'),
  el('table',{},...graders.map(g=>el('tr',{},el('td',{},g.sec),el('td',{},el('b',{},g.score+' / '+g.total))))),
  el('div',{class:'tip'},'Submitted: '+now.toLocaleString()),el('div',{class:'tip'},'📸 Take a screenshot of this box and send it to your teacher.'),
  el('div',{class:'tip'},'Red answers are wrong — read the correct answer below each one.'));r.classList.add('show');r.scrollIntoView({behavior:'smooth'});}
$('#sub').onclick=()=>{if(!$('#nm').value.trim()){alert('Please write your name first.');$('#nm').focus();return;}
 const blank=graders.reduce((n,g)=>n+g.items.filter(it=>!String(it.get()||'').trim()).length,0);
 if(blank&&!confirm(blank+' question(s) not answered. Submit anyway?'))return;
 const[sc,tot]=grade();showResult(sc,tot);};
$('#again').onclick=()=>{graders.forEach(g=>g.items.forEach(it=>{if(it.q.classList.contains('bad')){delete saved[it.id];const i=it.q.querySelector('input.t,input:not([type=radio])');if(i)i.value='';it.q.querySelectorAll('input[type=radio]').forEach(x=>x.checked=false);it.q.querySelectorAll('label').forEach(x=>x.classList.remove('sel'));it.q.classList.remove('bad');it.fb.textContent='';}}));save();$('#res').classList.remove('show');window.scrollTo({top:0,behavior:'smooth'});};
