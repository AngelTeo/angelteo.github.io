e → <b>wholly</b></p><table><tr><th colspan=3>Rule 4 · Adjectives ending in -le (-tle, -ble, -ple)</th></tr><tr><td colspan=3><b>[ remove e + y ]</b></td></tr><tr><td class=ex>terrible</td><td>→</td><td class=ex><b>terribly</b></td></tr><tr><td class=ex>gentle</td><td>→</td><td class=ex><b>gently</b></td></tr><tr><td class=ex>simple</td><td>→</td><td class=ex><b>simply</b></td></tr></table><table><tr><th colspan=3>Rule 5 · Adjectives ending in -ful</th></tr><tr><td colspan=3><b>[ keep -ful + ly ]</b></td></tr><tr><td class=ex>wonderful</td><td>→</td><td class=ex><b>wonderfully</b></td></tr><tr><td class=ex>careful</td><td>→</td><td class=ex><b>carefully</b></td></tr></table><p>⚠ full → <b>fully</b></p><table><tr><th colspan=2>Rule 6 · Some adverbs have the same form as the adjective</th></tr>\n<tr><th>Adjective</th><th>Adverb</th></tr><tr><td>fast</td><td><b>fast</b></td></tr><tr><td>hard</td><td><b>hard</b></td></tr><tr><td>late</td><td><b>late</b></td></tr><tr><td>early</td><td><b>early</b></td></tr><tr><td>daily</td><td><b>daily</b></td></tr><tr><td>straight</td><td><b>straight</b></td></tr>\n<tr><td>good</td><td><b>well</b> ⭐</td></tr></table>\n<p>Careful: <b>hardly</b> means “almost not”, <b>lately</b> means “recently”.</p><table><tr><th></th><th>Uses</th><th>Form</th><th>Examples</th></tr>\n<tr><td><b>Positive</b></td><td>Describes the actions without comparison</td><td>Base form (often ends in -ly)</td><td class=ex>1. She sings beautifully on the stage.<br>2. The baby sleeps soundly in the room.</td></tr>\n<tr><td><b>Comparative</b></td><td>Compares two actions</td><td>Use <b>\"more\"</b> (…than)</td><td class=ex>1. She sings more beautifully than her friend.<br>2. The baby sleeps more soundly than the toddler.</td></tr>\n<tr><td><b>Superlative</b></td><td>Shows the highest degree among three or more actions</td><td>Use <b>\"most\"</b> (the…)</td><td class=ex>1. She sings the most beautifully of all singers.<br>2. The baby sleeps the most soundly of all the children.</td></tr></table><table><tr><th>B · An adverb of manner <u>cannot</u> go between a verb and its direct object.</th></tr>\n<tr><td>Put it <b>before the verb</b> or <b>at the end</b>.</td></tr></table><table><tr><th colspan=2>C · With a preposition before the object</th></tr>\n<tr><td colspan=2>Put the adverb <b>before the preposition</b> or <b>after the object</b>.</td></tr>\n<tr><td class=ex colspan=2>The child ran happily towards his mother.<br>The child ran towards his mother happily.</td></tr>\n<tr><th colspan=2>D · Verbs with no object</th></tr><tr><td colspan=2>Put the adverb <b>right after the verb</b>.</td></tr>\n<tr><td class=ex colspan=2>The town grew quickly after 1997.<br>He waited patiently for his mother to arrive.</td></tr>\n<tr><th colspan=2>E · well, badly, hard, fast</th></tr><tr><td colspan=2>Almost always <b>right after the verb</b>.</td></tr>\n<tr><td class=ex colspan=2>He swam well despite being tired.<br>The rain fell hard during the storm.</td></tr></table>", "sections": [{"type": "read", "title": "Reading 1: Sports Day", "ins": "Listen 🔊 and read the story two times. Then answer the questions below.", "paras": ["Last Friday was Sports Day at Sam's school. The sun shone brightly and the parents cheered loudly.", "Sam ran in the 100-metre race. He ran quickly, but Ravi ran more quickly than Sam. Ravi won the race easily. Sam smiled and shook Ravi's hand.", "Next was the egg-and-spoon race. Lily walked carefully because she did not want to drop her egg. Mei walked more quickly than Lily, but her egg fell onto the ground. Crack!", "Lily walked the most carefully of all the girls. The other girls dropped their eggs. Lily finished slowly but safely, and she won the race!", "At the end of the day, the headmaster gave out the medals. Lily went home proudly with her medal. Sam was proud of her too."], "imgs": [null, null, null, null, null]}, {"type": "choice", "title": "Reading 1: Questions", "ins": "Choose the correct answer.", "items": [{"q  if(S.type==='read'){sec.append(spk(S.paras.join(' '),'🔊 Listen to all'),el('div',{class:'essay'},...S.paras.map((p,i)=>el('div',{},S.imgs&&S.imgs[i]?el('img',{src:S.imgs[i],alt:'',style:'width:100%;border-radius:14px;margin:10px 0 4px;display:block'}):null,el('p',{},el('span',{html:p}),' ',spk(p,'🔊'))))));}
 if(g.items.length)graders.push(g);$('#main').append(sec);});
function grade(){let sc=0,tot=0;graders.forEach(g=>{g.score=0;g.total=g.items.length;g.items.forEach(it=>{const v=it.get();const ok=it.exact?it.ans.includes(v):isRight(v,it.ans);it.q.classList.remove('ok','bad');it.q.classList.add(ok?'ok':'bad');it.fb.textContent=ok?(it.cell?'':'✓ Correct!'):(it.cell?it.ans[0]:'✗ Answer: '+it.ans[0]);if(ok)g.score++;});g.ss.textContent=g.score+' / '+g.total;sc+=g.score;tot+=g.total;});return[sc,tot];}
function showResult(sc,tot){const pct=tot?Math.round(sc/tot*100):0;const stars=pct>=90?'⭐⭐⭐':pct>=70?'⭐⭐':pct>=50?'⭐':'💪';const now=new Date();
 const r=$('#res');r.innerHTML='';r.append(el('div',{class:'who'},($('#nm').value||'(no name)')+' · '+D.code+'. SRT E Class Homework'),el('div',{class:'big'},sc+' / '+tot),el('div',{class:'stars'},stars+'  '+pct+'%'),
  el('table',{},...graders.map(g=>el('tr',{},el('td',{},g.sec),el('td',{},el('b',{},g.score+' / '+g.total))))),
  el('div',{class:'tip'},'Submitted: '+now.toLocaleString()),el('div',{class:'tip'},'📸 Take a screenshot of this box and send it to your teacher.'),
  el('div',{class:'tip'},'Red answers are wrong — read the correct answer below each one.'));r.classList.add('show');r.scrollIntoView({behavior:'smooth'});}
$('#sub').onclick=()=>{if(!$('#nm').value.trim()){alert('Please write your name first.');$('#nm').focus();return;}
 const blank=graders.reduce((n,g)=>n+g.items.filter(it=>!String(it.get()||'').trim()).length,0);
 if(blank&&!confirm(blank+' question(s) not answered. Submit anyway?'))return;
 const[sc,tot]=grade();showResult(sc,tot);};
$('#again').onclick=()=>{graders.forEach(g=>g.items.forEach(it=>{if(it.q.classList.contains('bad')){delete saved[it.id];const i=it.q.querySelector('input.t,input:not([type=radio])');if(i)i.value='';it.q.querySelectorAll('input[type=radio]').forEach(x=>x.checked=false);it.q.querySelectorAll('label').forEach(x=>x.classList.remove('sel'));it.q.classList.remove('bad');it.fb.textContent='';}}));save();$('#res').classList.remove('show');window.scrollTo({top:0,behavior:'smooth'});};
