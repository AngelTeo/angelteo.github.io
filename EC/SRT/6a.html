const D={"code": "6a", "key": "LV7_W27", "title": "Smart Reader Kids English Programme", "sub": "E Class Homework · 6a · 173 questions · auto-marked · open until Tue 20 Oct", "notes": "<table><tr><th colspan=2>A · Adverbs of manner tell us <u>how</u> something happens.</th></tr>\n<tr><td colspan=2>They are usually placed either <b>after the main verb</b> or <b>after the object</b>.</td></tr>\n<tr><td>1</td><td class=ex>He swims well.</td></tr><tr><td>2</td><td class=ex>He ran quickly.</td></tr><tr><td>3</td><td class=ex>She spoke softly.</td></tr>\n<tr><td>4</td><td class=ex>James coughed loudly to attract her attention.</td></tr>\n<tr><td>5</td><td class=ex>He plays the flute beautifully. <i>(after the direct object)</i></td></tr>\n<tr><td>6</td><td class=ex>He ate the chocolate cake greedily. <i>(after the direct object)</i></td></tr></table>\n<p>👉 Ask: <b>How</b> does he swim? → <b>well</b>. <b>How</b> did he run? → <b>quickly</b>.</p><table><tr><th colspan=2>Adverbs of Time</th></tr>\n<tr><td><b>Use</b></td><td>Tell us <b>when</b> an action happens.</td></tr>\n<tr><td><b>Examples</b></td><td class=ex>1. We will visit tomorrow.<br>2. She visited us yesterday.</td></tr></table><table><tr><th colspan=3>Rule 1 · Usually, add -ly to the adjective</th></tr><tr><td colspan=3><b>[ adjective + ly ]</b></td></tr><tr><td class=ex>quiet</td><td>→</td><td class=ex><b>quietly</b></td></tr><tr><td class=ex>poor</td><td>→</td><td class=ex><b>poorly</b></td></tr><tr><td class=ex>slow</td><td>→</td><td class=ex><b>slowly</b></td></tr></table><table><tr><th colspan=3>Rule 2 · Adjectives ending in -y</th></tr><tr><td colspan=3><b>[ remove y + ily ]</b></td></tr><tr><td class=ex>easy</td><td>→</td><td class=ex><b>easily</b></td></tr><tr><td class=ex>angry</td><td>→</td><td class=ex><b>angrily</b></td></tr><tr><td class=ex>happy</td><td>→</td><td class=ex><b>happily</b></td></tr></table><table><tr><th colspan=3>Rule 3 · Adjectives ending in -e</th></tr><tr><td colspan=3><b>[ keep the e + ly ]</b></td></tr><tr><td class=ex>private</td><td>→</td><td class=ex><b>privately</b></td></tr><tr><td class=ex>brave</td><td>→</td><td class=ex><b>bravely</b></td></tr></table><p>⚠ Exceptions: true → <b>truly</b> · due → <b>duly</b> · whole → <b>wholly</b></p><table><tr><th colspan=3>Rule 4 · Adjectives ending in -le (-tle, -ble, -ple)</th></tr><tr><td colspan=3><b>[ remove e + y ]</b></td></tr><tr><td class=ex>terrible</td><td>→</td><td class=ex><b>terribly</b></td></tr><tr><td class=ex>gentle</td><td>→</td><td class=ex><b>gently</b></td></tr><tr><td class=ex>simple</td><td>→</td><td class=ex><b>simply</b></td></tr></table><table><tr><th colspan=3>Rule 5 · Adjectives ending in -ful</th></tr><tr><td colspan=3><b>[ keep -ful + ly ]</b></td></tr><tr><td class=ex>wonderful</td><td>→</td><td class=ex><b>wonderfully</b></td></tr><tr><td class=ex>careful</td><td>→</td><td class=ex><b>carefully</b></td></tr></table><p>⚠ full → <b>fully</b></p><table><tr><th colspan=2>Rule 6 · Some adverbs have the same form as the adjective</th></tr>\n<tr><th>Adjective</th><th>Adverb</th></tr><tr><td>fast</td><td><b>fast</b></td></tr><tr><td>hard</td><td><b>hard</b></td></tr><tr><td>late</td><td><b>late</b></td></tr><tr><td>early</td><td><b>early</b></td></tr><tr><td>daily</td><td><b>daily</b></td></tr><tr><td>straight</td><td><b>straight</b></td></tr>\n<tr><td>good</td><td><b>well</b> ⭐</td></tr></table>\n<p>Careful: <b>hardly</b> means “almost not”, <b>lately</b> means “recently”.</p><table><tr><th></th><th>Uses</th><th>Form</th><th>Examples</th></tr>\n<tr><td><b>Positive</b></td><td>Describes the actions without comparison</td><td>Base form (often ends in -ly)</td><td class=ex>1. She sings beautifully on the stage.<br>2. The baby sleeps soundly in the room.</td></tr>\n<tr><td><b>Comparative</b></td><td>Compares two actions</td><td>Use <b>\"more\"</b> (…than)</td><td class=ex>1. She sings more beautifully than her friend.<br>2. The baby sleeps more soundly than the toddler.</td></tr>\n<tr><td><b>Superlative</b></td><td>Shows the highest degree among three or more actions</td><td>Use <b>\"most\"</b> (the…)</td><td class=ex>1. She sings the most beautifully of all singers.<br>2. The baby sleeps the most soundly of all the children.</td></tr></table><table><tr><th>B · An adverb of manner <u>cannot</u> go between a verb and its direct object.</th></tr>\n<tr><td>Put it <b>before the verb</b> or <b>at the end</b>.</td></tr></table><table><tr><th colspan=2>C · With a preposition before the object</th></tr>\n<tr><td colspan=2>Put the adverb <b>before the preposition</b> or <b>after the object</b>.</td></tr>\n<tr><td class=ex colspan=2>The child ran happily towards his mother.<br>The child ran towards his mother happily.</td></tr>\n<tr><th colspan=2>D · Verbs with no object</th></tr><tr><td colspan=2>Put the adverb <b>right after the verb</b>.</td></tr>\n<tr><td class=ex colspan=2>The town grew quickly after 1997.<br>He waited patiently for his mother to arrive.</td></tr>\n<tr><th colspan=2>E · well, badly, hard, fast</th></tr><tr><td colspan=2>Almost always <b>right after the verb</b>.</td></tr>\n<tr><td class=ex colspan=2>He swam well despite being tired.<br>The rain fell hard during the storm.</td></tr></table><table><tr><th colspan=2>F · Two verbs in one sentence — the position changes the meaning</th></tr>\n<tr><th>Example</th><th>Meaning</th></tr>\n<tr><td class=ex>She quickly agreed to retype the letter.</td><td>the agreeing is quick</td></tr>\n<tr><td class=ex>She agreed quickly to retype the letter.</td><td>the agreeing is quick</td></tr>\n<tr><td class=ex>She agreed to retype the letter quickly.</td><td>the retyping is quick</td></tr>\n<tr><td class=ex>He quietly asked me to leave the house.</td><td>the asking is quiet</td></tr>\n<tr><td class=ex>He asked me to leave the house quietly.</td><td>the leaving is quiet</td></tr></table><h4>Grammar Note 2 · Adverbs of Time / Frequency</h4><table><tr><th>Position</th><th>Examples</th></tr>\n<tr><t er.", "items": [{"q": "When did the family plan the trip?", "opts": ["yesterday", "last week", "last month"], "ans": ["last week"]}, {"q": "What time did their train leave?", "opts": ["six o'clock", "seven o'clock", "eight o'clock"], "ans": ["seven o'clock"]}, {"q": "Where were Lily's shoes?", "opts": ["under the bed", "in the taxi", "at the station"], "ans": ["under the bed"]}, {"q": "Why was Lily sad at the station?", "opts": ["She lost her diary.", "The train had already left.", "The taxi was late."], "ans": ["The train had already left."]}, {"q": "How did the family wait on the platform?", "opts": ["patiently", "angrily", "noisily"], "ans": ["patiently"]}, {"q": "What did Lily write in her diary?", "opts": ["“Tomorrow I will wake up earlier!”", "“I will never take a train again.”", "“The museum was boring.”"], "ans": ["“Tomorrow I will wake up earlier!”"]}]}, {"type": "input", "title": "Reading: Find it in the story", "ins": "Look back at the story. Type the missing word.", "items": [{"q": "Mum knocked on the children's door ___.", "hint": "loud", "ans": ["loudly"]}, {"q": "Dad spoke ___ to the man at the counter.", "hint": "calm", "ans": ["calmly"]}, {"q": "The family waited ___ on the platform.", "hint": "patient", "ans": ["patiently"]}, {"q": "When they got there, the train had ___ left.", "hint": "already / yesterday", "ans": ["already"]}, {"q": "Everyone went to bed ___ that night.", "hint": "early / earlily", "ans": ["early"]}, {"q": "Tomorrow I will wake up ___!", "hint": "early → ?", "ans": ["earlier"]}]}, {"type": "choice", "title": "Adjective or Adverb?", "ins": "Choose the correct word. Adjective describes a noun; adverb describes a verb.", "items": [{"q": "The bed is very ______ so I can sleep very well.", "opts": ["soft", "softly"], "ans": ["soft"]}, {"q": "He can play sports ______ because he is strong.", "opts": ["good", "well"], "ans": ["well"]}, {"q": "The homework was ______ and I finished it fast.", "opts": ["easy", "easily"], "ans": ["easy"]}    const fb=el('div',{class:'fb'});q.append(el('div',{class:'qt'},el('span',{class:'n'},(i+1)+'.'),line),fb);sec.append(q);g.items.push({id,q,fb,ans:it.ans,get:()=>saved[id]});});}
 if(S.type==='table'){S.tables.forEach((T,ti)=>{if(T.cap)sec.append(el('div',{class:'cap'},T.cap));const t=el('table',{class:'tb'});t.append(el('tr',{},...T.cols.map(c=>el('th',{html:c}))));
   T.rows.forEach((r,ri)=>{const tr=el('tr');r.forEach((c,ci)=>{if(typeof c==='string'){tr.append(el('td',{class:'g'},c));return;}const id=si+'_'+ti+'_'+ri+'_'+ci;const inp=el('input',{autocomplete:'off',autocapitalize:'off',spellcheck:'false'});inp.value=saved[id]||'';const cc=el('div',{class:'c'});const td=el('td',{},inp,cc);inp.oninput=()=>{saved[id]=inp.value;save();td.classList.remove('ok','bad');};tr.append(td);g.items.push({id,q:td,fb:cc,ans:c.ans,get:()=>saved[id],cell:true});});t.append(tr);});sec.append(t);});}
 if(S.type==='write'){S.items.forEach((it,i)=>{const id=si+'_'+i;const ta=el('textarea',{placeholder:'Write your sentence here'});ta.value=saved[id]||'';ta.oninput=()=>{saved[id]=ta.value;save();};const m=el('div',{class:'model'},'Example: '+it.model);
   sec.append(el('div',{class:'q w'},el('div',{class:'qt'},el('span',{class:'n'},(i+1)+'.'),el('span',{},el('b',{},it.verb),' ',el('span',{class:'cue'},it.cue))),ta,el('button',{onclick:()=>{if(!ta.value.trim()){alert('Write your own sentence first!');return;}m.classList.toggle('show');}},'Check with example'),m,spk(()=>ta.value||'Write your sentence first','🔊 Read my sentence')));});}
 if(S.type==='read'){sec.append(spk(S.paras.join(' '),'🔊 Listen to all'),el('div',{class:'essay'},...S.paras.map((p,i)=>el('div',{},S.imgs&&S.imgs[i]?el('img',{src:S.imgs[i],alt:'',style:'width:100%;border-radius:14px;margin:10px 0 4px;display:block'}):null,el('p',{},el('span',{html:p}),' ',spk(p,'🔊'))))));}
 if(g.items.length)graders.push(g);$('#main').append(sec);});
function grade(){let sc=0,tot=0;graders.forEach(g=>{g.score=0;g.total=g.items.length;g.items.forEach(it=>{const v=it.get();const ok=it.exact?it.ans.includes(v):isRight(v,it.ans);it.q.classList.remove('ok','bad');it.q.classList.add(ok?'ok':'bad');it.fb.textContent=ok?(it.cell?'':'✓ Correct!'):(it.cell?it.ans[0]:'✗ Answer: '+it.ans[0]);if(ok)g.score++;});g.ss.textContent=g.score+' / '+g.total;sc+=g.score;tot+=g.total;});return[sc,tot];}
function showResult(sc,tot){const pct=tot?Math.round(sc/tot*100):0;const stars=pct>=90?'⭐⭐⭐':pct>=70?'⭐⭐':pct>=50?'⭐':'💪';const now=new Date();
 const r=$('#res');r.innerHTML='';r.append(el('div',{class:'who'},($('#nm').value||'(no name)')+' · '+D.code+'. SRT E Class Homework'),el('div',{class:'big'},sc+' / '+tot),el('div',{class:'stars'},stars+'  '+pct+'%'),
  el('table',{},...graders.map(g=>el('tr',{},el('td',{},g.sec),el('td',{},el('b',{},g.score+' / '+g.total))))),
  el('div',{class:'tip'},'Submitted: '+now.toLocaleString()),el('div',{class:'tip'},'📸 Take a screenshot of this box and send it to your teacher.'),
  el('div',{class:'tip'},'Red answers are wrong — read the correct answer below each one.'));r.classList.add('show');r.scrollIntoView({behavior:'smooth'});}
$('#sub').onclick=()=>{if(!$('#nm').value.trim()){alert('Please write your name first.');$('#nm').focus();return;}
 const blank=graders.reduce((n,g)=>n+g.items.filter(it=>!String(it.get()||'').trim()).length,0);
 if(blank&&!confirm(blank+' question(s) not answered. Submit anyway?'))return;
 const[sc,tot]=grade();showResult(sc,tot);};
$('#again').onclick=()=>{graders.forEach(g=>g.items.forEach(it=>{if(it.q.classList.contains('bad')){delete saved[it.id];const i=it.q.querySelector('input.t,input:not([type=radio])');if(i)i.value='';it.q.querySelectorAll('input[type=radio]').forEach(x=>x.checked=false);it.q.querySelectorAll('label').forEach(x=>x.classList.remove('sel'));it.q.classList.remove('bad');it.fb.textContent='';}}));save();$('#res').classList.remove('show');window.scrollTo({top:0,behavior:'smooth'});};
</script>
