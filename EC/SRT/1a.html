<!doctype html>
<html lang="en">
<head>
<meta name="srt-internal" content="LV2 W27">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Reader Kids English Programme</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1d2433;--muted:#5d6577;--line:#dfe3ea;--brand:#1f3a5f;--accent:#f2b134;--ok:#1f9d6b;--okbg:#e3f6ee;--bad:#d64545;--badbg:#fde8e8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;font-size:18px;line-height:1.5}
button,input,textarea{font:inherit}
.wrap{max-width:860px;margin:0 auto;padding:16px}
header{background:var(--brand);color:#fff;border-radius:16px;padding:18px 20px;margin-bottom:14px}
header h1{margin:0;font-size:26px}
header .s{opacity:.85;font-size:15px;margin-top:4px}
.name{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.name input{flex:1;min-width:180px;border:0;border-radius:10px;padding:8px 12px;font-size:18px}
.how{background:#fff;border-radius:14px;padding:12px 16px;margin-bottom:14px;font-size:16px;border-left:6px solid var(--accent)}
.how ol{margin:4px 0;padding-left:22px}
details.gn{background:#fff;border-radius:14px;padding:10px 16px;margin-bottom:14px}
details.gn summary{font-weight:800;color:var(--brand);cursor:pointer}
.gn table{border-collapse:collapse;width:100%;font-size:15px;margin:8px 0}
.gn th{background:var(--brand);color:#fff;text-align:left;padding:6px 8px}
.gn td{border:1px solid var(--line);padding:6px 8px;vertical-align:top}
.gn .ex{color:#2f6fde;font-weight:600}
.gn h4{margin:12px 0 4px}
.sec{background:var(--card);border-radius:16px;padding:14px 18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.sec h2{margin:0 0 2px;font-size:21px;color:var(--brand)}
.sec .ins{color:var(--muted);font-size:15px;margin-bottom:8px}
.sec .ss{float:right;font-weight:800;font-size:16px;color:var(--brand)}
.q{padding:10px 0;border-top:1px solid #eef0f4}
.q:first-of-type{border-top:0}
.qt{display:flex;gap:8px}
.qt .n{min-width:28px;font-weight:800;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 0 36px}
.opts label{border:2px solid #c9cfdb;border-radius:12px;padding:4px 14px;cursor:pointer;background:#fff;font-weight:600}
.opts input{margin-right:6px}
.opts label.sel{border-color:var(--brand);background:#eef3fb}
.q input.t{border:2px solid #c9cfdb;border-radius:10px;padding:4px 10px;min-width:150px;max-width:100%;font-weight:600}
.q input.t.full{width:100%;margin:6px 0 0 36px;width:calc(100% - 36px)}
.hint{color:var(--muted);font-style:italic}
.ok input.t,.ok .opts label.sel{border-color:var(--ok)!important;background:var(--okbg)!important}
.bad input.t,.bad .opts label.sel{border-color:var(--bad)!important;background:var(--badbg)!important}
.fb{display:none;margin:6px 0 0 36px;font-weight:700;font-size:16px}
.ok .fb{display:block;color:var(--ok)}
.bad .fb{display:block;color:var(--bad)}
table.tb{border-collapse:collapse;width:100%;margin:6px 0 12px}
table.tb th{background:#eef1f6;border:1px solid var(--line);padding:6px;font-size:15px}
table.tb td{border:1px solid var(--line);padding:4px;text-align:center}
table.tb td.g{font-weight:800}
table.tb input{width:100%;border:2px solid #c9cfdb;border-radius:8px;padding:4px 6px;text-align:center;font-weight:600}
table.tb td.ok input{border-color:var(--ok);background:var(--okbg)}
table.tb td.bad input{border-color:var(--bad);background:var(--badbg)}
table.tb .c{display:none;font-size:14px;color:var(--bad);font-weight:700}
table.tb td.bad .c{display:block}
.cap{font-weight:800;margin:10px 0 2px}
.w textarea{width:calc(100% - 36px);margin:6px 0 0 36px;border:2px solid #c9cfdb;border-radius:10px;padding:6px 10px;min-height:56px}
.w .cue{color:var(--muted)}
.w button{margin:6px 0 0 36px;border:1px solid #c9cfdb;background:#fff;border-radius:9px;padding:2px 12px;font-size:15px;color:var(--brand)}
.w .model{display:none;margin:6px 0 0 36px;color:var(--ok);font-weight:700}
.w .model.show{display:block}
.essay p{font-size:18px;line-height:1.75}
.pbox{border:2px solid #1d2433;border-radius:10px;padding:8px 12px;margin:6px 0 6px 36px;background:#fffef7}
.pbox div{margin:1px 0}
@media (max-width:600px){.pbox{margin-left:0}}
.bar{position:sticky;bottom:0;background:rgba(244,246,250,.96);padding:10px 0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.bar button{border:0;border-radius:12px;padding:10px 22px;font-weight:800;font-size:18px;background:#fff;color:var(--brand);border:2px solid var(--brand)}
.bar button.pri{background:var(--brand);color:#fff}
.result{display:none;background:#fff;border-radius:16px;padding:18px 20px;margin-bottom:16px;border:3px solid var(--accent);text-align:center}
.result.show{display:block}
.result .big{font-size:52px;font-weight:900;color:var(--brand)}
.result .stars{font-size:34px}
.result table{margin:8px auto;border-collapse:collapse;font-size:16px}
.result td{padding:3px 10px;border-bottom:1px solid var(--line);text-align:left}
.result .who{font-size:20px;font-weight:800}
.result .tip{color:var(--muted);font-size:15px}
.warn{color:var(--bad);font-weight:700}
@media (max-width:600px){.bar{position:static}html,body{font-size:17px}.opts{margin-left:0}.q input.t.full,.w textarea,.fb,.w button,.w .model{margin-left:0;width:100%}table.tb th,table.tb td{font-size:14px;padding:3px}header h1{font-size:22px}}
@media print{.bar{display:none}}
.spk{border:1px solid #9aa4b8;background:#eef3ff;border-radius:16px;padding:2px 10px;font-size:14px;cursor:pointer;margin:4px 0}
.spk:active{background:#d6e2ff}
</style>
</head>

const $=s=>document.querySelector(s);
const el=(t,a={},...kids)=>{const e=document.createElement(t);for(const[k,v]of Object.entries(a)){if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v);}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c));}return e;};
const KEY='srthw_'+D.key;
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){saved={};}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(saved));}catch(e){}};
const norm=s=>String(s||'').toLowerCase().replace(/[’‘`]/g,"'").replace(/[“”]/g,'"').replace(/[.!?]+\s*$/,'').replace(/\s*,\s*/g,', ').replace(/\s+/g,' ').trim();
let RATE=0.85;
function pickVoice(){try{const vs=speechSynthesis.getVoices();return vs.find(v=>/en-GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;}catch(e){return null;}}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t).replace(/<[^>]+>/g,' ').replace(/______+|____/g,'blank'));u.lang='en-GB';const v=pickVoice();if(v)u.voice=v;u.rate=RATE;speechSynthesis.speak(u);}catch(e){}}
function spk(t,lbl){return el('button',{class:'spk',type:'button',onclick:()=>say(typeof t==='function'?t():t)},lbl||'🔊 Listen');}
function variants(a){const out=new Set();String(a).split(' / ').forEach(x=>{const n=norm(x);out.add(n);out.add(n.replace(/n't\b/g,' not').replace(/\s+/g,' '));if(n.startsWith('the '))out.add(n.slice(4));});return out;}
function isRight(v,ans){const nv=norm(v);if(!nv)return false;const nv2=nv.replace(/n't\b/g,' not');for(const a of ans){const vs=variants(a);if(vs.has(nv)||vs.has(nv2))return true;}return false;}

function grade(){let sc=0,tot=0;graders.forEach(g=>{g.score=0;g.total=g.items.length;g.items.forEach(it=>{const v=it.get();const ok=it.exact?it.ans.includes(v):isRight(v,it.ans);it.q.classList.remove('ok','bad');it.q.classList.add(ok?'ok':'bad');it.fb.textContent=ok?(it.cell?'':'✓ Correct!'):(it.cell?it.ans[0]:'✗ Answer: '+it.ans[0]);if(ok)g.score++;});g.ss.textContent=g.score+' / '+g.total;sc+=g.score;tot+=g.total;});return[sc,tot];}
function showResult(sc,tot){const pct=tot?Math.round(sc/tot*100):0;const stars=pct>=90?'⭐⭐⭐':pct>=70?'⭐⭐':pct>=50?'⭐':'💪';const now=new Date();
