function mentorPlans(){
  const me=S.me&&S.me.code;
  if(!me)return [];
  return S.plans.filter(p=>{
    if(p.teacherCode===me)return false;                 // 自己的训练计划不算
    if(p.status==='completed'&&!(p.depts||[]).some(x=>x.status==='active'))return false;
    if(p.mentorCode===me)return true;
    return (p.mentorHistory||[]).some(e=>e.mentor_code===me);   // 中途接手的也算
  });
}

function renderMentorHome(){
  const el=document.getElementById('dashboard-content');
  const plans=mentorPlans();
  const iso=todayISO();

  if(!plans.length){
    el.innerHTML=`<div class="card" style="text-align:center;padding:36px">
      <div style="font-size:30px;margin-bottom:10px">👨‍🏫</div>
      <div style="font-weight:600;margin-bottom:5px">You are not mentoring anyone right now</div>
      <div style="color:var(--mut);font-size:12px">Once management assigns a new teacher to you, they will appear here.</div>
    </div>`;return;
  }

  // 先把每个学员今天该做的算出来，顺便记住第一件还没做的
  const cards=[];
  let first=null;
  let offFirst=null;
  plans.forEach(p=>{
    const blocks=roleDayBlocks(p,'mentor');   // v32：不再被学员课表整批挡掉
    const onDuty=deptsOnDay(p.teacherCode,iso);
    if(!first){
      for(const b of blocks){
        if(b.rest||b.offDuty)continue;
        const t=b.tasks.find(x=>!S.taskChecks[checkKey(p.uid,b.dept,'mentor',b.day,x.id)]);
        if(t){first={task:t,plan:p,dept:b.dept,day:b.day};break;}
      }
    }
    if(!offFirst){
      for(const b of blocks){
        if(b.rest||!b.offDuty)continue;
        const t=doableOffDuty(b.tasks).find(x=>!S.taskChecks[checkKey(p.uid,b.dept,'mentor',b.day,x.id)]);
        if(t){offFirst={task:t,plan:p,dept:b.dept,day:b.day};break;}
      }
    }
    cards.push({plan:p,blocks,onDuty});
  });

  const anyDuty=cards.some(c=>c.blocks.some(b=>!b.rest&&!b.offDuty));
  const restAll=cards.length&&cards.every(c=>c.blocks.length&&c.blocks.every(b=>b.rest));

  let h='';

  // ── 第一层：今天做这一件 ──────────────────────────────────
  if(restAll){
    h+=`<div class="card" style="border:2px solid var(--gold)">
      <div style="font-size:11px;font-weight:700;color:var(--gold);letter-spacing:.6px">Today is a catch-up day</div>
      <div style="font-size:19px;font-weight:700;margin:8px 0 4px">Help them close the gaps</div>
      <div style="font-size:12px;color:var(--mut)">No tasks are issued today. Look at where they got stuck this week and walk them through it.</div>
    </div>`;
  }else if(first){
    h+=`<div class="card" style="border:2px solid var(--acc)">
      <div style="font-size:11px;font-weight:700;color:var(--acc);letter-spacing:.6px">Do this next</div>
      <div style="font-size:19px;font-weight:700;margin:8px 0 4px;line-height:1.35">${esc(first.task.text)}</div>
      <div style="font-size:12px;color:var(--mut)">With ${esc(first.plan.teacherName)} · ${deptShort(first.dept)} · ${dayLabel(first.day)} · ${tagBadge(first.task.tag)}</div>
      <div style="margin-top:13px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-pri" onclick="openMentorPlan('${first.plan.uid}','${first.dept}','tasks')">Start</button>
        <button class="btn" onclick="openMentorPlan('${first.plan.uid}','${first.dept}','report')">Write today's report</button>
      </div>
    </div>
    <div style="text-align:center;color:var(--mut);font-size:11px;margin:-4px 0 10px">One thing at a time.</div>`;
  }else if(anyDuty){
    h+=`<div class="card" style="border:2px solid var(--grn)">
      <div style="font-size:11px;font-weight:700;color:var(--grn);letter-spacing:.6px">Everything for today is done</div>
      <div style="font-size:19px;font-weight:700;margin:8px 0 4px">Just the day report left</div>
    </div>`;
  }else if(offFirst){
    h+=`<div class="card" style="border:2px solid var(--acc)">
      <div style="font-size:11px;font-weight:700;color:var(--acc);letter-spacing:.6px">No class with them today — but this one you can still do</div>
      <div style="font-size:19px;font-weight:700;margin:8px 0 4px;line-height:1.35">${esc(offFirst.task.text)}</div>
      <div style="font-size:12px;color:var(--mut)">With ${esc(offFirst.plan.teacherName)} · ${deptShort(offFirst.dept)} · ${dayLabel(offFirst.day)} · ${tagBadge(offFirst.task.tag)}</div>
      <div style="margin-top:13px"><button class="btn btn-pri" onclick="openMentorPlan('${offFirst.plan.uid}','${offFirst.dept}','tasks')">Open the tasks</button></div>
      <div style="font-size:11.5px;color:var(--mut);margin-top:10px;line-height:1.55">
        The DEMO and SUPERVISE items need a real class — they wait until your trainee is next on the timetable. Their day number does not move today.</div>
    </div>`;
  }else{
    h+=`<div class="card">
      <div style="font-size:15px;font-weight:700;margin-bottom:4px">Nothing to mentor today</div>
      <div style="font-size:12px;color:var(--mut)">Your trainees are not on the timetable today, and everything for their current day that can be done without a class is already ticked.</div>
    </div>`;
  }

  // ── 第二层：我带的人 ──────────────────────────────────────
  cards.forEach(c=>{
    const p=c.plan;
    const allDone=(p.depts||[]).length&&(p.depts||[]).every(x=>x.status==='completed');
    h+=`<div class="card">
      <div class="card-hdr">
        <span class="card-title">🎓 ${esc(p.teacherName)}</span>
        ${allDone?'<span class="chip chip-grn">Training finished</span>':''}
      </div>`;

    (p.depts||[]).forEach(pd=>{
      setRD(pd.dept);
      const day=pd.currentDay||1;
      const rest=isRestDate(p,pd.dept,iso);
      const duty=c.onDuty.includes(pd.dept);
      const active=pd.status==='active';
      const tasks=(!active||rest||!duty)?[]:((D.TASKS.mentor||{})[day]||[]);
      const done=tasks.filter(t=>S.taskChecks[checkKey(p.uid,pd.dept,'mentor',day,t.id)]).length;
      const dots=tasks.map((t,i)=>`<i style="display:inline-block;width:15px;height:6px;border-radius:3px;margin-right:4px;background:${i<done?'var(--grn)':(i===done?'var(--acc)':'var(--bdr)')}"></i>`).join('');

      // 她的日报交了没
      const theirsIn=reportSubmitted(p.uid,'mentee',day,pd.dept);
      const theirsDraft=!theirsIn&&!!getReport(p.uid,'mentee',day,pd.dept);
      const mineIn=reportSubmitted(p.uid,'mentor',day,pd.dept);
      let rpt='';
      if(active&&duty&&!rest){
        rpt = theirsIn   ? '<span class="chip chip-grn" style="font-size:9px">Theirs is in</span>'
            : theirsDraft? '<span class="chip chip-amb" style="font-size:9px">Theirs is a draft</span>'
                         : '<span class="chip chip-amb" style="font-size:9px">Theirs not in</span>';
        if(!mineIn) rpt += ' <span class="chip chip-red" style="font-size:9px">Yours not in</span>';
      }

      h+=`<div style="display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:.5px solid var(--bdr);cursor:pointer"
             onclick="openMentorPlan('${p.uid}','${pd.dept}','tasks')">
        <span class="chip ${duty&&active?'chip-blue':''}" style="min-width:42px;text-align:center">${deptShort(pd.dept)}</span>
        <div style="flex:1;min-width:0">
          <div style="font-size:12.5px;font-weight:500">${pd.status==='completed'?'Department finished':(rest?'Catch-up day':dayLabel(day))} ${rpt}</div>
          <div style="margin-top:5px">${dots||'<span style="font-size:11px;color:var(--mut)">—</span>'}</div>
        </div>
        <div style="font-size:11.5px;color:var(--mut);white-space:nowrap">
          ${pd.status==='completed'?'<span style="color:var(--grn)">✅ Done</span>'
            :(rest?'Catch-up':(duty?`${done}／${tasks.length} done`:'No class today'))}
        </div>
      </div>`;
    });

    // 岗位清单进度 ＋ 客观证据
    const cw=planCompDone(p);
    if(cw.total){
      const mc=miscCountOf(p.teacherCode);
      h+=`<div style="margin-top:10px;padding-top:9px;border-top:.5px solid var(--bdr)">
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px">
          <span style="font-weight:500">Job checklist</span>
          <span style="color:${cw.done?'var(--grn)':'var(--mut)'}">${cw.ok}／${cw.total} signed off</span></div>
        <div class="prog-bar"><div class="prog-fill ${cw.done?'grn':''}" style="width:${Math.round(cw.ok/cw.total*100)}%"></div></div>
        <div style="font-size:11px;color:var(--mut);margin-top:5px">
          MiscGo reports they filed: ${mc===null?'cannot read (you have no MiscGo access)':'<b>'+mc+'</b> · reference only, does not block signing'}</div>
        <div style="margin-top:8px"><button class="btn btn-sm" onclick="openMentorComp('${p.uid}')">Sign checklist ›</button></div>
      </div>`;
    }
    // 她的求助
    const ops=openHelps(p.uid);
    if(ops.length){
      h+=`<div style="margin-top:10px;padding-top:9px;border-top:.5px solid var(--bdr)">
        <div style="font-size:12px;font-weight:600;color:var(--amb);margin-bottom:6px">🙋 Waiting for your reply (${ops.length})</div>`;
      ops.slice(0,3).forEach(x=>{
        h+=`<div style="padding:7px 0;border-bottom:.5px solid var(--bdr)">
          <div style="font-size:12.5px">${x.urgent?'<span class="chip chip-red" style="margin-right:5px">Needs help now</span>':''}${esc(x.body)}</div>
          <div style="margin-top:5px"><button class="btn btn-sm" onclick="event.stopPropagation();openAnswerHelp('${x.id}')">Reply</button></div>
        </div>`;
      });
      h+=`</div>`;
    }
    if(allDone){
      h+= p.released
        ? `<div class="alert alert-grn" style="margin-top:10px">🎉 They have been released.</div>`
        : `<div class="alert alert-amb" style="margin-top:10px">Training is finished — waiting for management to release them.</div>`;
      const cp=completionOf(p.uid);
      h+=`<div style="margin-top:8px"><button class="btn btn-sm" onclick="openCompletionModal('${p.uid}')">${cp?'Edit completion note':'✍️ Write completion note'}</button>
        ${cp&&cp.acknowledged_at?'<span style="font-size:11px;color:var(--grn);margin-left:7px">They have read it</span>':(cp?'<span style="font-size:11px;color:var(--mut);margin-left:7px">Not read yet</span>':'')}</div>`;
    }
    h+=`<div style="margin-top:10px"><button class="btn btn-sm" onclick="openMentorPlan('${p.uid}','${(p.depts[0]||{}).dept||'SRK'}','progress')">See their whole plan ›</button></div>
    </div>`;
  });

  el.innerHTML=h;
}

// 从 Mentor 首页跳进某一个学员的某一个部门
function openMentorPlan(uid,dept,page){
  S.planUid=uid; S.dept=dept; setRD(dept);
  goPage(page||'tasks');
}
function openMentorComp(uid){
  const p=getPlan(uid); if(!p)return;
  S.planUid=uid; S.dept=(p.depts[0]||{}).dept||'SRK'; setRD(S.dept);
  goPage('comp');
}

function renderMenteeHome(){
  const el=document.getElementById('dashboard-content');
  const p=getPlan();
  if(!p){el.innerHTML=`<div class="card" style="text-align:center;padding:36px">
    <div style="font-size:30px;margin-bottom:10px">🎓</div>
    <div style="font-weight:600;margin-bottom:5px">No training plan yet</div>
    <div style="color:var(--mut);font-size:12px">Ask management to set one up for you.</div></div>`;return;}

  const iso=todayISO();
  const blocks=menteeDayBlocks(p);
  const onDuty=deptsOnDay(p.teacherCode,iso);
  const active=blocks.filter(b=>!b.rest);
  const duty  =active.filter(b=>!b.offDuty);
  const off   =active.filter(b=>b.offDuty);

  // ── 第一层：今天这一件（只从今天有课的部门挑）──
  let first=null, firstDept=null, firstDay=null;
  for(const b of duty){
    const t=b.tasks.find(x=>!S.taskChecks[checkKey(p.uid,b.dept,'mentee',b.day,x.id)]);
    if(t){first=t;firstDept=b.dept;firstDay=b.day;break;}
  }
  // 今天没课，但当天还是有不用上课就能做掉的事（读手册、写纪录…）
  let offFirst=null, offBlock=null;
  if(!first){
    for(const b of off){
      const t=doableOffDuty(b.tasks).find(x=>!S.taskChecks[checkKey(p.uid,b.dept,'mentee',b.day,x.id)]);
      if(t){offFirst=t;offBlock=b;break;}
    }
  }
  const dutyAllDone = duty.length>0 && duty.every(b=>b.tasks.every(t=>S.taskChecks[checkKey(p.uid,b.dept,'mentee',b.day,t.id)]));
  const dutyRepsIn  = duty.length>0 && duty.every(b=>reportSubmitted(p.uid,'mentee',b.day,b.dept));
  const restToday=blocks.length&&blocks.every(b=>b.rest);

  const _d1=active.length?Math.min(...active.map(b=>dayNo(b.day))):1;
  let h=`<details class="card" ${_d1<=1?'open':''} style="border:1.5px solid var(--acc)">
    <summary style="cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px">
      <div class="card-title">👋 How this training works</div>
      <span class="chip chip-blue">Start here</span>
    </summary>
    <div style="font-size:12.5px;line-height:1.75;margin-top:10px">
      <b>${esc(p.teacherName)}</b> — welcome. Your Mentor is <b>${esc(mentorOnDay(p,(active[0]||{}).day||1,(active[0]||{}).dept)||p.mentorName||'—')}</b>. Ask them anything; asking is never the problem.
      <div style="margin-top:9px"><b>How long.</b> 12 training days${p.targetDate?`, target <b>${fmtDate(p.targetDate)}</b>`:''}. Catch-up days sit in between and are not numbered. Your day number only moves when your Mentor confirms it — not automatically at midnight.</div>
      <div style="margin-top:9px"><b>What finishes it.</b> Not the day count — the <b>Job Checklist</b>. Training is done when every item on it has been signed at its required level, and then management releases you to take a class on your own.</div>
      <div style="margin-top:9px"><b>Your day.</b> Home shows the one next thing → <b>Today</b> has the full list and the SOP for each → teach → <b>Day Report</b> before you go home. That is the whole loop.</div>
      <div style="margin-top:9px"><b>Where things are.</b> 📖 SOP = how every step is done, open it any time. ✅ Job Checklist = what you still have to be signed off on. 📊 Progress = the calendar view. 🏫 Handbook = who we are and the Code of Conduct.</div>
      <div style="margin-top:9px;background:#FCEBEB;border:.5px solid #F09595;border-radius:6px;padding:9px 10px">
        <b style="color:#7a1f1f">One rule from day one.</b> If a parent asks you anything — at the door, by phone, by message — you say one line: <i>“I will pass this to management and they will contact you.”</i> Then you file it in <b>MiscGo</b>. Never handle it yourself, never promise anything, never report it verbally or in a group chat. Everything goes into MiscGo so nothing gets missed.
      </div>
      <div style="margin-top:9px;color:var(--mut)">Stuck, or a step never came up today? Use the two buttons at the bottom of this page. Neither one counts against you.</div>
    </div>
  </details>`;
  if(restToday){
    const ct=catchupsOf(p.uid,iso);
    const weak=(()=>{const m=[];(p.depts||[]).forEach(d=>{compDone(p.uid,d.dept).missing.forEach(x=>m.push(x));});return m;})();
    h+=`<div class="card" style="border:2px solid var(--gold)">
      <div style="font-size:11px;font-weight:700;color:var(--gold);letter-spacing:.6px">Today is a catch-up day</div>
      <div style="font-size:19px;font-weight:700;margin:8px 0 4px">Work on your weak spots</div>
      <div style="font-size:12px;color:var(--mut)">No training tasks today, and it does not count as a training day.</div>
    </div>`;
    h+=`<div class="card"><div class="card-title" style="margin-bottom:8px">Assigned by management (${ct.length})</div>`;
    if(!ct.length){h+=`<div style="font-size:12px;color:var(--mut)">Nothing assigned to you today.</div>`;}
    ct.forEach(x=>{
      const done=x.status==='completed';
      h+=`<div style="display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-bottom:.5px solid var(--bdr)">
        <input type="checkbox" ${done?'checked':''} onchange="toggleCatchup('${x.id}',this.checked)" style="width:18px;height:18px;margin-top:2px">
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:500;${done?'opacity:.55;text-decoration:line-through':''}">${esc(x.title)}</div>
          ${x.body?`<div style="font-size:11.5px;color:var(--mut);margin-top:3px">${esc(x.body)}</div>`:''}
        </div></div>`;
    });
    h+=`</div>`;
    if(weak.length){
      h+=`<div class="card"><div class="card-title" style="margin-bottom:8px">Your own gaps (${weak.length} still short)</div>`;
      weak.slice(0,6).forEach(x=>{h+=`<div style="font-size:12.5px;padding:6px 0;border-bottom:.5px solid var(--bdr)">${esc(x.name)}
        <span class="chip" style="margin-left:5px">needs Level ${x.level_required}</span></div>`;});
      if(weak.length>6)h+=`<div style="font-size:11.5px;color:var(--mut);margin-top:7px">…and ${weak.length-6} more — see the Checklist page.</div>`;
      h+=`<div style="margin-top:10px"><button class="btn btn-sm" onclick="goPage('comp')">See the whole checklist ›</button></div></div>`;
    }
  }else if(first){
    h+=`<div class="card" style="border:2px solid var(--acc)">
      <div style="font-size:11px;font-weight:700;color:var(--acc);letter-spacing:.6px">Do this next</div>
      <div style="font-size:19px;font-weight:700;margin:8px 0 4px;line-height:1.35">${esc(first.text)}</div>
      <div style="font-size:12px;color:var(--mut)">${deptShort(firstDept)} · ${dayLabel(firstDay)} · ${tagBadge(first.tag)}</div>
      <div style="margin-top:13px;display:flex;gap:8px;flex-wrap:wrap">
        ${first.go?`<button class="btn btn-pri" onclick="goPage('${first.go}')">${esc(first.goLabel||'Open')} ›</button>`
                  :((first.sops||[]).length&&D.SOP&&D.SOP[first.sops[0]]
                    ?`<button class="btn btn-pri" onclick="openSopModal('${first.sops[0]}')">📖 Open the SOP</button>`
                    :'')}
        <button class="btn" onclick="goPage('tasks')">All of today's tasks</button>
        <button class="btn" onclick="goPage('report')">Write today's report</button>
      </div>
    </div>
    <div style="text-align:center;color:var(--mut);font-size:11px;margin:-4px 0 10px">One thing at a time.</div>`;
  }else if(dutyAllDone&&dutyRepsIn){
    // ── B2：她该做的都做完、日报也交了。接下来是 Mentor 的事，讲清楚。──
    const nx=duty.map(b=>{const i=ALL_DAYS.indexOf(b.day);return{dept:b.dept,day:b.day,next:ALL_DAYS[i+1]};});
    h+=`<div class="card" style="border:2px solid var(--grn)">
      <div style="font-size:11px;font-weight:700;color:var(--grn);letter-spacing:.6px">Your day is complete</div>
      <div style="font-size:19px;font-weight:700;margin:8px 0 4px">Tasks done and report submitted</div>
      <div style="font-size:12.5px;color:var(--mut);line-height:1.6">Nothing else is waiting on you today. ${nx.map(x=>
        x.next?`Your Mentor reads your ${deptShort(x.dept)} report and confirms before <b>${dayLabel(x.next)}</b> opens — that is why you are still on ${dayLabel(x.day)}.`
              :`Your Mentor reviews your ${deptShort(x.dept)} report and then decides on sign-off.`).join(' ')}</div>
      <div style="margin-top:13px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" onclick="goPage('report')">See what I submitted</button>
        <button class="btn" onclick="goPage('comp')">Work on my checklist</button>
      </div>
    </div>`;
  }else if(duty.length){
    h+=`<div class="card" style="border:2px solid var(--grn)">
      <div style="font-size:11px;font-weight:700;color:var(--grn);letter-spacing:.6px">Everything for today is done</div>
      <div style="font-size:19px;font-weight:700;margin:8px 0 4px">Just the day report left</div>
      <div style="margin-top:12px"><button class="btn btn-pri" onclick="goPage('report')">Write today's report</button></div>
    </div>`;
  }else if(offFirst){
    // ── A2：今天没排到课，但当天还是有不用上课就能做的事。不可以整批藏起来。──
    h+=`<div class="card" style="border:2px solid var(--acc)">
      <div style="font-size:11px;font-weight:700;color:var(--acc);letter-spacing:.6px">No class for you today — but this one you can still do</div>
      <div style="font-size:19px;font-weight:700;margin:8px 0 4px;line-height:1.35">${esc(offFirst.text)}</div>
      <div style="font-size:12px;color:var(--mut)">${deptShort(offBlock.dept)} · ${dayLabel(offBlock.day)} · ${tagBadge(offFirst.tag)}</div>
      <div style="margin-top:13px;display:flex;gap:8px;flex-wrap:wrap">
        ${offFirst.go?`<button class="btn btn-pri" onclick="goPage('${offFirst.go}')">${esc(offFirst.goLabel||'Open')} ›</button>`
                     :((offFirst.sops||[]).length&&D.SOP&&D.SOP[offFirst.sops[0]]
                       ?`<button class="btn btn-pri" onclick="openSopModal('${offFirst.sops[0]}')">📖 Open the SOP</button>`:'')}
        <button class="btn" onclick="goPage('tasks')">All of today's tasks</button>
      </div>
      <div style="font-size:11.5px;color:var(--mut);margin-top:10px;line-height:1.55">
        The OBSERVE and TEACH items for ${dayLabel(offBlock.day)} need a real class — they wait for your next class day. Your day number does not move today.</div>
    </div>`;
  }else if(off.length){
    h+=`<div class="card">
      <div style="font-size:15px;font-weight:700;margin-bottom:4px">No class for you today</div>
      <div style="font-size:12px;color:var(--mut);line-height:1.6">Everything on ${off.map(b=>dayLabel(b.day)).join(' / ')} that can be done without a class is already ticked. The rest needs a real class, so your day number stays where it is. Good time to re-read an SOP.</div>
      <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" onclick="goPage('tasks')">See today's tasks</button>
        <button class="btn" onclick="goPage('sop')">Open SOP library</button>
      </div>
    </div>`;
  }else{
    h+=`<div class="card">
      <div style="font-size:15px;font-weight:700;margin-bottom:4px">No training scheduled today</div>
      <div style="font-size:12px;color:var(--mut)">Your training plan has no active department today. Good time to re-read an SOP.</div>
      <div style="margin-top:12px"><button class="btn" onclick="goPage('sop')">Open SOP library</button></div>
    </div>`;
  }

  // ── 第二层：这一週（用件数，不用天数）──
  h+=`<div class="card"><div class="card-title" style="margin-bottom:8px">This week</div>`;
  (p.depts||[]).forEach(pd=>{
    setRD(pd.dept);
    const day=pd.currentDay||1;
    const rest=isRestDate(p,pd.dept,iso);
    const tasks=rest?[]:((D.TASKS.mentee||{})[day]||[]);
    const done=tasks.filter(t=>S.taskChecks[checkKey(p.uid,pd.dept,'mentee',day,t.id)]).length;
    const dots=tasks.map((t,i)=>`<i style="display:inline-block;width:15px;height:6px;border-radius:3px;margin-right:4px;background:${i<done?'var(--grn)':(i===done?'var(--acc)':'var(--bdr)')}"></i>`).join('');
    const duty=onDuty.includes(pd.dept);
    h+=`<div style="display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:.5px solid var(--bdr)">
      <span class="chip ${duty?'chip-blue':''}" style="min-width:42px;text-align:center">${deptShort(pd.dept)}</span>
      <div style="flex:1;min-width:0">
        <div style="font-size:12.5px;font-weight:500">${pd.status==='completed'?'Department finished':(rest?'Catch-up day':dayLabel(day))}</div>
        <div style="margin-top:5px">${dots||'<span style="font-size:11px;color:var(--mut)">—</span>'}</div>
      </div>
      <div style="font-size:11.5px;color:var(--mut);white-space:nowrap">
        ${pd.status==='completed'?'<span style="color:var(--grn)">✅ Done</span>'
          :(rest?'Catch-up':(duty?`${done}／${tasks.length} done`:'No class today'))}
      </div>
    </div>`;
  });
  h+=`<div style="margin-top:10px"><button class="btn btn-sm" onclick="goPage('progress')">My whole plan ›</button></div></div>`;

  // ── 清单进度 ──
  const cw=planCompDone(p);
  if(cw.total){
    h+=`<div class="card">
      <div class="card-title" style="margin-bottom:6px">Job checklist</div>
      <div class="prog-bar"><div class="prog-fill ${cw.done?'grn':''}" style="width:${Math.round(cw.ok/cw.total*100)}%"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-top:6px">
        <span>${cw.ok}／${cw.total} signed off</span>
        <span style="color:var(--mut)">${cw.done?'All complete':(cw.ok===0?'Your target list for the whole training':'Completion is judged on this list, not the day count')}</span></div>
      <div style="margin-top:10px"><button class="btn btn-sm" onclick="goPage('comp')">See checklist ›</button></div>
    </div>`;
  }

  // ── 卡住了 / 没机会练 ──
  h+=`<div class="card">
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-pri" onclick="openHelpModal()">🙋 I am stuck</button>
      <button class="btn" onclick="openNoPracticeModal()">🕳️ No chance to practise today</button>
    </div>
    <div style="font-size:11.5px;color:var(--mut);margin-top:8px">Asking is not embarrassing — guessing is. Log anything that did not come up; it will not look like slacking.</div>`;
  const myHelps=helpsOf(p.uid).slice(0,4);
  if(myHelps.length){
    h+=`<div style="margin-top:12px;border-top:.5px solid var(--bdr);padding-top:9px">`;
    myHelps.forEach(x=>{
      h+=`<div style="padding:7px 0;border-bottom:.5px solid var(--bdr)">
        <div style="font-size:12.5px">${esc(x.body)}</div>
        <div style="font-size:11px;color:var(--mut);margin-top:3px">
          ${x.status==='completed'?'<span style="color:var(--grn)">Answered</span> · '+esc(x.answered_by_code||''):'<span style="color:var(--amb)">Waiting for a reply</span>'}
        </div>
        ${x.answer?`<div style="font-size:12px;background:var(--sur2);padding:7px 9px;border-radius:6px;margin-top:5px">${esc(x.answer)}</div>`:''}
      </div>`;
    });
    h+=`</div>`;
  }
  h+=`</div>`;

  // ── 放行状态（完成之后才出现）──
  const allDone=(p.depts||[]).length&&(p.depts||[]).every(x=>x.status==='completed');
  if(allDone){
    h+=p.released
      ? `<div class="alert alert-grn">🎉 You have been released — you can take a class on your own.</div>`
      : `<div class="alert alert-amb">Training is finished. Waiting for management to release you.</div>`;
    const cp=completionOf(p.uid);
    if(cp){
      h+=`<div class="card" style="border:2px solid var(--grn)">
        <div class="card-title" style="margin-bottom:8px">🎓 Your completion note</div>
        ${cp.summary?`<div style="font-size:11px;font-weight:600;color:var(--mut)">What you went through</div><div style="font-size:13px;margin:3px 0 10px;line-height:1.5">${esc(cp.summary)}</div>`:''}
        ${cp.strengths?`<div style="font-size:11px;font-weight:600;color:var(--mut)">What you did well</div><div style="font-size:13px;margin:3px 0 10px;line-height:1.5">${esc(cp.strengths)}</div>`:''}
        ${cp.watch?`<div style="font-size:11px;font-weight:600;color:var(--mut)">What to watch once you are on your own</div><div style="font-size:13px;margin:3px 0 10px;line-height:1.5">${esc(cp.watch)}</div>`:''}

  el.innerHTML=h;
}

async function doRelease(uid){
  const p=getPlan(uid); if(!p)return;
  const note=prompt(`Release ${p.teacherName}?\n\nOnce released they can take a class on their own. This action is recorded (who and when).\n\nNote (optional):`,'');
  if(note===null)return;
  await setReleased(uid,true,note);
  alert('✅ Released. The record has been kept.');
}

function openNewPlan(){
  const tOpts=S.teachers.map(t=>`<option value="${esc(t.id)}">${esc(t.name||t.id)} (${esc(t.id)})</option>`).join('');
  const dChips=DEPT_OPTIONS.map(o=>`<span class="cb${o.code==='SRK'?' on':''}" data-d="${o.code}" onclick="npToggle(this)">
      <span>${o.code==='SRK'?'✓':'＋'}</span> ${o.code}</span>`).join('');
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="modal" style="max-width:460px">
    <div class="modal-hdr"><span class="modal-hdr-title">New training plan</span>
      <button class="modal-close" onclick="this.closest('.overlay').remove()">×</button></div>
    <div class="modal-body">
      <label class="lbl">New teacher *</label>
      <select id="np_teacher"><option value="">— Choose —</option>${tOpts}</select>
      <label class="lbl">Mentor *</label>
      <select id="np_mentor"><option value="">— Choose —</option>${tOpts}</select>
      <label class="lbl">Which departments they train in * (choose one or more)</label>
      <div class="chk" id="np_depts">${dChips}</div>
      <label class="lbl" style="margin-top:10px">Start date *</label>
      <input type="date" id="np_start" value="${getTodayISO()}" onchange="npPreview()">
      <div id="np_preview" style="font-size:11px;color:var(--mut);margin-top:6px;line-height:1.7"></div>
      <label class="lbl">Note</label><textarea id="np_note" rows="2" placeholder="Optional"></textarea>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="this.closest('.overlay').remove()">Cancel</button>
      <button class="btn btn-pri" onclick="createPlan()">✅ Create</button></div>
  </div>`;

function npToggle(e){
  e.classList.toggle('on');
  e.firstElementChild.textContent=e.classList.contains('on')?'✓':'＋';
  npPreview();
}
function npSelectedDepts(){
  return [...document.querySelectorAll('#np_depts .cb.on')].map(x=>x.dataset.d);
}
function npPreview(){
  const box=document.getElementById('np_preview'); if(!box)return;
  const start=document.getElementById('np_start')?.value;
  const depts=npSelectedDepts();
  if(!start||!depts.length){box.textContent='';return;}
  const fake={startDate:start,exceptions:[],depts:depts.map(d=>({dept:d}))};
  const lines=depts.map(d=>{
    const m=planDates(fake,d);
    const skipped=[];
    let cur=parseISO(start), n=0, guard=0;
    while(n<14&&guard++<500){
      const iso=isoOf(cur), dow=cur.getDay();
      if(dow>=1&&dow<=5){ if(isHoliday(iso,d)) skipped.push(holidayName(iso,d)); else n++; }
      cur.setDate(cur.getDate()+1);
    }
    const uniq=[...new Set(skipped)];
    return `${d}: ${fmtDate(m[1])} → ${fmtDate(m[14])}${uniq.length?` (skipping ${uniq.slice(0,2).join(', ')}${uniq.length>2?' etc.':''})`:''}`;
  });
  box.innerHTML='Monday to Friday are training days; public holidays push everything back automatically. Catch-up days are marked by hand after the plan is created.<br>'+lines.join('<br>');
}
async function createPlan(){
  const tc=document.getElementById('np_teacher')?.value;
  const mc=document.getElementById('np_mentor')?.value;
  const st=document.getElementById('np_start')?.value;
  const depts=npSelectedDepts();
  if(!tc||!mc||!st||!depts.length){alert('New teacher, Mentor, departments and start date are all required.');return;}
  if(tc===mc){alert('The new teacher and the Mentor cannot be the same person.');return;}
  const uid='plan_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
  const plan={uid:uid,teacherCode:tc,mentorCode:mc,startDate:st,
    note:document.getElementById('np_note')?.value||'',status:'active',depts:depts.map(d=>({dept:d}))};
  plan.targetDate=targetDateOf(plan)||null;
  await savePlan(plan);
  for(const d of depts) await savePlanDept(uid,d,1,'active');
  document.querySelector('.overlay')?.remove();
  await reloadAll();
  goPage('mgmt');
  alert(`✅ Training plan created for ${teacherName(tc)} (${depts.join(' / ')})`);
}

async function addExceptionFromForm(uid){
  const d=document.getElementById('pe_ex_date')?.value;
  const dp=document.getElementById('pe_ex_dept')?.value||null;
  const kd=document.getElementById('pe_ex_kind')?.value||'skip';
  const r=document.getElementById('pe_ex_reason')?.value.trim();
  if(!d||!r){alert('Both the date and the reason are required.');return;}
  await addException(uid,dp,d,r,kd);
  document.querySelector('.overlay')?.remove();
  openPlanEdit(uid);
}
async function savePlanEdit(uid){
  const p=getPlan(uid); if(!p)return;
  const oldMentor=p.mentorCode;
  const newMentor=document.getElementById('pe_mentor')?.value||p.mentorCode;
  // v32：以前换 Mentor 只改计划上的名字，traingo_mentor_history 从来没有人写 ——
  // Progress 会把前几天也显示成新 Mentor 带的，而且新 Mentor 可以改写前一位写的日报。
  // 现在先把「谁从哪一天开始带」写进 history（每个部门一笔），再改计划。
  if(newMentor&&newMentor!==oldMentor){
    const firstTime=!(p.mentorHistory||[]).length;
    const rows=[];
    (p.depts||[]).forEach(d=>{
      if(firstTime&&oldMentor)rows.push({plan_uid:p.uid,dept:d.dept,mentor_code:oldMentor,from_day:1,reason:'original Mentor'});
      rows.push({plan_uid:p.uid,dept:d.dept,mentor_code:newMentor,from_day:d.currentDay||1,
                 from_date:todayISO(),reason:'Mentor changed on Settings'});
    });
    if(rows.length&&sb){
      const {error}=await sb.from('traingo_mentor_history').insert(rows);
      if(error){alert('Could not record the Mentor change, so nothing was changed.\n\n'+error.message);return;}
    }
  }
  p.mentorCode=newMentor;
  p.startDate=document.getElementById('pe_start')?.value||p.startDate;
  p.note=document.getElementById('pe_note')?.value||'';
  p.targetDate=targetDateOf(p)||null;
  await savePlan(p);
  document.querySelector('.overlay')?.remove();
  await reloadAll();
  alert('✅ Saved');
}
async function deletePlan(uid){
  const p=getPlan(uid); if(!p)return;
  if(!confirm(`Delete ${p.teacherName}'s whole plan?\nDay reports and task checks go with it. This cannot be undone.`))return;
  const {error}=await sb.from('traingo_plan').delete().eq('client_uid',uid);
  if(error){alert('Could not delete: '+error.message);return;}
  S.planUid=null;
  await reloadAll();
  goPage('mgmt');
}

         \"If technical issue with attendance system, report to MGMT immediately and record time manually\",\n              \"After signing in, go directly to ready class and duty\",\n              \"If eating at school, finish meal 10 minutes before official working time\"\n            ]\n          },\n          {\n            \"sub\": \"Punch Out (Clock Out)\",\n            \"bullets\": [\n              \"Complete all classes and duties before official clock-out time\",\n              \"Ensure classroom is prepared for next day, materials neatly arranged\",\n              \"Do not clock out early without prior MGMT approval\",\n              \"If technical issue, report to MGMT and record time manually\"\n            ]\n          },\n          {\n            \"sub\": \"Leave Application\",\n            \"bullets\": [\n              \"Request and fill Leave Application Form from MGMT\",\n              \"Arrange reliever for duties and classes\",\n              \"Submit form and attach supporting evidence\",\n              \"Follow up to confirm approval or rejection\",\n              \"One day before: remind reliever and pass all teaching materials and lesson plans\"\n            ]\n          },\n          {\n            \"sub\": \"Emergency / Last-Minute Absence\",\n            \"bullets\": [\n              \"Notify and obtain approval from MGMT before 8:00am\",\n              \"Inform MGMT of: (1) Lesson Plan (2) Materials (3) Student Issues (4) Urgent Tasks (5) Additional Notes\",\n              \"Submit leave form after returning, with supporting evidence if any\"\n            ]\n          }\n        ]\n      },\n      {\n        \"heading\": \"B. Workplace Conduct\",\n        \"subsections\": [\n          {\n            \"sub\": \"Dress Code\",\n            \"bullets\": [\n              \"Dress neatly, clothing must be clean and well maintained, maintain good personal hygiene\",\n              \"Shorts and skirts above the knee are not allowed\",\n              \"One (1) pinafore provided FREE upon confirmation. Extra pinafores must be purchased from MGMT\"\n            ]\n          },\n          {\n            \"sub\": \"Shoes\",\n            \"bullets\": [\n              \"Slippers are not allowed. Sandals are permitted\",\n              \"Place shoes neatly on the shoe rack — not on the floor\"\n            ]\n          },\n          {\n            \"sub\": \"Lunch Arrangements\",\n            \"bullets\": [\n              \"30 minutes for lunch daily, taken according to schedule\",\n              \"May bring own meals, eat school-provided meals, or order food to go\",\n              \"If unsure about meal arrangements, ask MGMT for guidance\"\n            ]\n          }\n        ]\n      },\n      {\n        \"heading\": \"C. Mobile Phone & Digital Use\",\n        \"subsections\": [\n          {\n            \"sub\": \"Mobile Phone During Working Hours\",\n            \"bullets\": [\n              \"Set mobile phone to silent mode during working hours\",\n              \"Must NOT be used during teaching sessions (except work-related purposes)\",\n              \"Do not share personal mobile numbers or social media accounts with students or parents\",\n              \"Refrain from personal use: casual calls, browsing, social media, gaming, online shopping\",\n              \"Emergency calls: use designated private areas only (e.g. reception room)\"\n            ]\n          },\n          {\n            \"sub\": \"Photo, Video & Social Media\",\n            \"bullets\": [\n              \"Must not photograph or record students, parents, or colleagues without permission\",\n              \"Student photos and videos are strictly for internal or approved school use only\",\n              \"May not post or discuss content related to students or parents on personal platforms\",\n              \"Must comply with the Personal Data Protection Act (PDPA)\",\n              \"May identify as Company staff on social media but must maintain professionalism\"\n            ]\n          }\n        ]\n      },\n      {\n        \"heading\": \"D. Communication & Reporting\",\n        \"subsections\": [\n          {\n            \"sub\": \"Reporting Line\",\n            \"bullets\": [\n              \"For HR matters: contact ADMIN directly\",\n              \"For work-related issues: report to MGMT and work together to find solutions\"\n            ]\n          },\n          {\n            \"sub\": \"Parents Communication\",\n            \"bullets\": [\n              \"⚠️ Teachers are NOT permitted to communicate directly with parents — to prevent dissemination of inaccurate information\",\n              \"All parent communication must go through MGMT\"\n            ]\n          },\n          {\n            \"sub\": \"Issue Reporting & Incident Handling\",\n            \"bullets\": [\n              \"Immediately report any accidents, incidents, or unusual situations to MGMT or Admin\",\n              \"Urgent matters must be escalated immediately and followed up until fully resolved\",\n              \"Maintain professionalism and confidentiality — report only relevant facts\"\n            ]\n          }\n        ]\n      }\n    ]\n  }\n]");


// ── Handbook renderer ──────────────────────────────────────────

// Per-document accent colours
const HB_THEME = {
  about:   {bg:'#EEF5FF', border:'#AABDD4', accent:'#185FA5', light:'#D6E8FF'},
  core:    {bg:'#E8F7F2', border:'#9FE1CB', accent:'#0F6E56', light:'#C2EEE0'},
  special: {bg:'#FFF8E1', border:'#F9CB42', accent:'#9C6500', light:'#FDEDB0'},
  conduct: {bg:'#F4F0FF', border:'#C5B3F5', accent:'#5B35C4', light:'#E2D9FF'},
};

// Department colour accents
const DEPT_THEME = {
  'SRK/GAK': {bg:'#E8F7F2', border:'#9FE1CB', code:'#0F6E56'},
  'ATC':     {bg:'#EEF5FF', border:'#AABDD4', code:'#185FA5'},
  'SRT':     {bg:'#FFF8E1', border:'#F9CB42', code:'#9C6500'},
  'CIY':     {bg:'#F4F0FF', border:'#C5B3F5', code:'#5B35C4'},
};

function renderHandbook(){
  const el=document.getElementById('handbook-content');
  const activeId=window._hbActive||'about';
  const doc=HANDBOOK.find(h=>h.id===activeId)||HANDBOOK[0];
  const theme=HB_THEME[activeId]||HB_THEME.about;

  // Tab bar
  let html=`<div style="margin-bottom:12px">
    <div class="card-title" style="margin-bottom:10px">🏫 Staff Handbook</div>
    <div class="itab-row">
      ${HANDBOOK.map(h=>{
        const t=HB_THEME[h.id];
        return`<button class="itab ${h.id===activeId?'on':''}"
          style="${h.id===activeId?`border-bottom-color:${t.accent};color:${t.accent};font-weight:700`:''}"
          onclick="openHandbook('${h.id}')">${h.icon} ${h.num} ${h.title}</button>`;
      }).join('')}
    </div>
  </div>`;

  // Doc card with themed header
  html+=`<div style="border:.5px solid ${theme.border};border-radius:12px;overflow:hidden;background:var(--sur)">

    <!-- Coloured header band -->
    <div style="background:${theme.bg};border-bottom:.5px solid ${theme.border};padding:16px 20px;display:flex;align-items:center;gap:12px">
      <span style="font-size:32px">${doc.icon}</span>
      <div>
        <div style="font-size:16px;font-weight:800;color:${theme.accent}">${doc.num} — ${doc.title}</div>
        <div style="font-size:11px;color:${theme.accent};opacity:.75;margin-top:2px">${doc.subtitle}</div>
      </div>
    </div>

    <div style="padding:18px 20px">`;

  doc.sections.forEach(sec=>{
    html+=`<div style="margin-bottom:20px">`;

    if(sec.heading){
      html+=`<div style="font-size:11px;font-weight:800;color:${theme.accent};text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px;padding-bottom:5px;border-bottom:2px solid ${theme.light}">${sec.heading}</div>`;
    }

    if(sec.body){
      html+=`<div style="font-size:12px;line-height:1.85;color:var(--txt);white-space:pre-line">${sec.body}</div>`;
    }

    if(sec.highlight){
      html+=`<div style="background:${theme.bg};border-left:4px solid ${theme.accent};padding:14px 16px;border-radius:0 10px 10px 0;font-size:12px;line-height:1.85;white-space:pre-line;font-style:italic;color:${theme.accent}">${sec.highlight}</div>`;
    }

    if(sec.bullets){
      html+=`<div style="display:flex;flex-direction:column;gap:7px">
        ${sec.bullets.map(b=>`
          <div style="display:flex;align-items:flex-start;gap:8px;padding:8px 12px;background:${theme.bg};border-radius:8px;border:.5px solid ${theme.border}">
            <span style="font-size:13px;flex-shrink:0">${b.split(' ')[0]}</span>
            <span style="font-size:12px;line-height:1.55">${b.split(' ').slice(1).join(' ')}</span>
          </div>`).join('')}
      </div>`;
    }

    if(sec.redlines){
      html+=`<div style="background:#FCEBEB;border:.5px solid #F09595;border-radius:10px;padding:14px 16px">
        <div style="font-size:10px;font-weight:700;color:#7a1f1f;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">These red lines NEVER change — regardless of department or student age</div>
        <div style="display:flex;flex-direction:column;gap:6px">
          ${sec.redlines.map(r=>`<div style="font-size:12px;line-height:1.55;color:#7a1f1f;display:flex;gap:8px;align-items:flex-start"><span style="flex-shrink:0">❌</span><span>${r}</span></div>`).join('')}
        </div>
      </div>`;
    }

    if(sec.departments){
      html+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        ${sec.departments.map(d=>{
          const dt=DEPT_THEME[d.code]||{bg:'#f5f4f0',border:'#e0ddd6',code:'#185FA5'};
          return`<div style="border:.5px solid ${dt.border};border-radius:10px;overflow:hidden">
            <div style="background:${dt.bg};padding:10px 12px;border-bottom:.5px solid ${dt.border}">
              <div style="font-weight:800;font-size:14px;color:${dt.code}">${d.code}</div>
              <div style="font-size:10px;color:var(--mut);margin-top:1px">${d.full} · ${d.age}</div>
            </div>
            <div style="padding:10px 12px">
              <div style="font-size:11px;font-weight:700;color:var(--gold);margin-bottom:5px">${d.theme}</div>
              <div style="font-size:11px;line-height:1.55;color:var(--txt)">${d.focus}</div>
            </div>
          </div>`;
        }).join('')}
      </div>`;
    }

    if(sec.twoCol){
      sec.twoCol.forEach(tc=>{
        html+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px">
          <div style="background:#E1F5EE;border:.5px solid #9FE1CB;border-radius:10px;padding:12px">
            <div style="font-size:10px;font-weight:700;color:#0F6E56;margin-bottom:7px;text-transform:uppercase;letter-spacing:.05em">✅ Do</div>
            ${tc.good.map(g=>`<div style="font-size:12px;line-height:1.65;margin-bottom:3px">${g}</div>`).join('')}
          </div>
          <div style="background:#FCEBEB;border:.5px solid #F09595;border-radius:10px;padding:12px">
            <div style="font-size:10px;font-weight:700;color:#A32D2D;margin-bottom:7px;text-transform:uppercase;letter-spacing:.05em">❌ Never</div>
            ${tc.bad.map(b=>`<div style="font-size:12px;line-height:1.65;margin-bottom:3px">${b}</div>`).join('')}
          </div>
        </div>`;
      });
    }

    if(sec.numbered){
      html+=`<div style="display:flex;flex-direction:column;gap:10px">
        ${sec.numbered.map((n,i)=>{
          const colours=['#EEF5FF','#E8F7F2','#FFF8E1','#F4F0FF'];
          const borders=['#AABDD4','#9FE1CB','#F9CB42','#C5B3F5'];
          const accents=['#185FA5','#0F6E56','#9C6500','#5B35C4'];
          const ci=i%4;
          return`<div style="border:.5px solid ${borders[ci]};border-radius:10px;overflow:hidden">
            <div style="background:${colours[ci]};padding:9px 14px;border-bottom:.5px solid ${borders[ci]}">
              <div style="font-weight:700;font-size:12px;color:${accents[ci]}">${n.title}</div>
            </div>
            <div style="padding:10px 14px;font-size:12px;line-height:1.75;white-space:pre-line;color:var(--txt)">${n.body}</div>
          </div>`;
        }).join('')}
      </div>`;
    }

    if(sec.subsections){
      html+=`<div style="display:flex;flex-direction:column;gap:12px">
        ${sec.subsections.map(ss=>`
          <div style="border:.5px solid ${theme.border};border-radius:10px;overflow:hidden">
            <div style="background:${theme.bg};padding:8px 14px;border-bottom:.5px solid ${theme.border}">
              <div style="font-size:11px;font-weight:700;color:${theme.accent}">${ss.sub}</div>
            </div>
            <div style="padding:10px 14px;display:flex;flex-direction:column;gap:5px">
              ${ss.bullets.map(b=>`<div style="font-size:12px;line-height:1.55;display:flex;gap:8px;align-items:flex-start"><span style="color:${theme.accent};flex-shrink:0">•</span><span>${b}</span></div>`).join('')}
            </div>
          </div>`).join('')}
      </div>`;
    }

    html+=`</div>`;
  });

  html+=`</div></div>`;
  el.innerHTML=html;
}

function openHandbook(id){
  window._hbActive=id;
  renderHandbook();
}


// ══════════════════════════════════════════════════════════════
// EXPORT / IMPORT
// ══════════════════════════════════════════════════════════════
function exportData(){
  const data={cohorts:S.cohorts,reports:S.reports,taskChecks:S.taskChecks};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const d=new Date();
  const stamp=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  a.href=url;a.download=`TrainGo_System_${stamp}.json`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importData(){
  document.getElementById('importFileInput').click();
}

function handleImportFile(input){
  const file=input.files[0];if(!file)return;
  if(!(S.me&&S.me.isAdmin)){alert('Only management can import.');input.value='';return;}
  const reader=new FileReader();
  reader.onload=async function(e){
    try{
      const data=JSON.parse(e.target.result);
      if(!data.cohorts){alert('Wrong file format — use a JSON exported from TrainGo.');return;}
      const dept=(prompt('Which department does this old backup belong to? Enter SRK / GAK / ATC / SRT','SRK')||'').toUpperCase().trim();
      if(!['SRK','GAK','ATC','SRT'].includes(dept)){alert('That department code is not valid — cancelled.');return;}

      // 旧档只有名字没有代号，尽量对回老师名册
      const byName=n=>{
        if(!n)return null;
        const t=S.teachers.find(x=>(x.name||'').toLowerCase()===String(n).toLowerCase()
                                 ||(x.id||'').toLowerCase()===String(n).toLowerCase());
        return t?t.id:null;
      };
      const unmatched=[];
      const plans=data.cohorts.map(c=>{
        const tc=byName(c.menteeName), mc=byName(c.mentorName);
        if(!tc)unmatched.push(c.menteeName);
        return {old:c.id, uid:'plan_'+c.id, teacher_code:tc, mentor_code:mc,
                start_date:c.startDate, status:c.status==='completed'?'completed':'active',
                note:(c.notes||'')+(c.ageGroup?' · '+c.ageGroup:''), currentDay:c.currentDay||1};
      }).filter(p=>p.teacher_code);

      if(!plans.length){alert('No teacher matched the roster, so nothing was imported.\nNo match for: '+unmatched.join(', '));return;}
      if(!confirm(`Import ${dept}?\n\nPlans: ${plans.length}`
        +(unmatched.length?` (${unmatched.length} did not match the roster and will be skipped: ${unmatched.join(', ')})`:'')
        +`\nDay reports: ${(data.reports||[]).length}\nTask checks: ${Object.keys(data.taskChecks||{}).length}\n\nRows with the same id are overwritten; everything else is left alone.`))return;

      let r=await sb.from('traingo_plan').upsert(plans.map(p=>({
        client_uid:p.uid, teacher_code:p.teacher_code, mentor_code:p.mentor_code,
        start_date:p.start_date, status:p.status, note:p.note})),{onConflict:'client_uid'});
      if(r.error)throw r.error;

      r=await sb.from('traingo_plan_dept').upsert(plans.map(p=>({
        plan_uid:p.uid, dept:dept, current_day:p.currentDay,
        status:p.status==='completed'?'completed':'active'})),{onConflict:'plan_uid,dept'});
      if(r.error)throw r.error;

      const uidOf={}; plans.forEach(p=>{uidOf[p.old]=p.uid;});

      const rpts=(data.reports||[]).filter(x=>uidOf[x.cohortId]).map(x=>({
        client_uid:'rpt_'+x.id, plan_uid:uidOf[x.cohortId], dept:dept,
        role:x.role, day:x.day, state:'submitted', payload:x}));
      if(rpts.length){r=await sb.from('traingo_report').upsert(rpts,{onConflict:'plan_uid,dept,role,day'});if(r.error)throw r.error;}

      // 旧键 {cohortId}_{role}_{day}_{taskId} → 新键 {planUid}_{dept}_{role}_{day}_{taskId}
      const OLD_RE=/^(.+)_(mentor|mentee)_(\d+)_(.+)$/;
      const ck=Object.entries(data.taskChecks||{}).map(([k,v])=>{
        const m=OLD_RE.exec(k); if(!m)return null;
        const uid=uidOf[m[1]]; if(!uid)return null;
        return {check_key:checkKey(uid,dept,m[2],parseInt(m[3],10),m[4]),
                plan_uid:uid, dept:dept, role:m[2], day:parseInt(m[3],10), task_id:m[4], checked:!!v};
      }).filter(Boolean);
      if(ck.length){r=await sb.from('traingo_task_check').upsert(ck,{onConflict:'check_key'});if(r.error)throw r.error;}

      await reloadAll();
      goPage('mgmt');
      alert(`✅ Import done — plans ${plans.length} · reports ${rpts.length} · checks ${ck.length}`
        +(unmatched.length?`\nSkipped ${unmatched.length} (name did not match the teacher roster)`:''));
    }catch(err){alert('Import failed: '+(err.message||err));}
  };
  reader.readAsText(file);
  input.value='';
}
