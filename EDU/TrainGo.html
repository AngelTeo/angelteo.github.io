      <div style="font-size:12px;color:var(--mut)">${deptShort(offBlock.dept)} · ${dayLabel(offBlock.day)} · ${tagBadge(offFirst.tag)}</div>
      <div style="margin-top:13px;display:flex;gap:8px;flex-wrap:wrap">
        ${offFirst.go?`<button class="btn btn-pri" onclick="goPage('${offFirst.go}')">${esc(offFirst.goLabel||'Open')} ›</button>`
                     :((offFirst.sops||[]).length&&D.SOP&&D.SOP[offFirst.sops[0]]
                       ?`<button class="btn btn-pri" onclick="openSopModal('${offFirst.sops[0]}')">📖 Open the SOP</button>`:'')}
        <button class="btn" onclick="goPage('tasks')">All of today's tasks</button>
      </div>
      <div style="font-size:11.5px;color:var(--mut);margin-top:10px;line-height:1.55">
        The OBSERVE and TEACH items for ${dayLabel(offBlock.day)} need a real class — they wait for your next class day. Your day number does not move today.</div>
    </div>`;
  }else if(off.length){
    h+=`<div class="card">
      <div style="font-size:15px;font-weight:700;margin-bottom:4px">No class for you today</div>
      <div style="font-size:12px;color:var(--mut);line-height:1.6">Everything on ${off.map(b=>dayLabel(b.day)).join(' / ')} that can be done without a class is already ticked. The rest needs a real class, so your day number stays where it is. Good time to re-read an SOP.</div>
      <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" onclick="goPage('tasks')">See today's tasks</button>
        <button class="btn" onclick="goPage('sop')">Open SOP library</button>
      </div>
    </div>`;
  }else{
    h+=`<div class="card">
      <div style="font-size:15px;font-weight:700;margin-bottom:4px">No training scheduled today</div>
      <div style="font-size:12px;color:var(--mut)">Your training plan has no active department today. Good time to re-read an SOP.</div>
      <div style="margin-top:12px"><button class="btn" onclick="goPage('sop')">Open SOP library</button></div>
    </div>`;
  }

  // ── 第二层：这一週（用件数，不用天数）──
  h+=`<div class="card"><div class="card-title" style="margin-bottom:8px">This week</div>`;
  (p.depts||[]).forEach(pd=>{
    setRD(pd.dept);
    const day=pd.currentDay||1;
    const rest=isRestDate(p,pd.dept,iso);
    const tasks=rest?[]:((D.TASKS.mentee||{})[day]||[]);
    const done=tasks.filter(t=>S.taskChecks[checkKey(p.uid,pd.dept,'mentee',day,t.id)]).length;
    const dots=tasks.map((t,i)=>`<i style="display:inline-block;width:15px;height:6px;border-radius:3px;margin-right:4px;background:${i<done?'var(--grn)':(i===done?'var(--acc)':'var(--bdr)')}"></i>`).join('');
    const duty=onDuty.includes(pd.dept);
    h+=`<div style="display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:.5px solid var(--bdr)">
      <span class="chip ${duty?'chip-blue':''}" style="min-width:42px;text-align:center">${deptShort(pd.dept)}</span>
      <div style="flex:1;min-width:0">
        <div style="font-size:12.5px;font-weight:500">${pd.status==='completed'?'Department finished':(rest?'Catch-up day':dayLabel(day))}</div>
        <div style="margin-top:5px">${dots||'<span style="font-size:11px;color:var(--mut)">—</span>'}</div>
      </div>
      <div style="font-size:11.5px;color:var(--mut);white-space:nowrap">
        ${pd.status==='completed'?'<span style="color:var(--grn)">✅ Done</span>'
          :(rest?'Catch-up':(duty?`${done}／${tasks.length} done`:'No class today'))}
      </div>
    </div>`;
  });
  h+=`<div style="margin-top:10px"><button class="btn btn-sm" onclick="goPage('progress')">My whole plan ›</button></div></div>`;

  // ── 清单进度 ──
  const cw=planCompDone(p);
  if(cw.total){
    h+=`<div class="card">
      <div class="card-title" style="margin-bottom:6px">Job checklist</div>
      <div class="prog-bar"><div class="prog-fill ${cw.done?'grn':''}" style="width:${Math.round(cw.ok/cw.total*100)}%"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-top:6px">
        <span>${cw.ok}／${cw.total} signed off</span>
        <span style="color:var(--mut)">${cw.done?'All complete':(cw.ok===0?'Your target list for the whole training':'Completion is judged on this list, not the day count')}</span></div>
      <div style="margin-top:10px"><button class="btn btn-sm" onclick="goPage('comp')">See checklist ›</button></div>
    </div>`;
  }

  // ── 卡住了 / 没机会练 ──
  h+=`<div class="card">
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-pri" onclick="openHelpModal()">🙋 I am stuck</button>
      <button class="btn" onclick="openNoPracticeModal()">🕳️ No chance to practise today</button>
    </div>
    <div style="font-size:11.5px;color:var(--mut);margin-top:8px">Asking is not embarrassing — guessing is. Log anything that did not come up; it will not look like slacking.</div>`;
  const myHelps=helpsOf(p.uid).slice(0,4);
  if(myHelps.length){
    h+=`<div style="margin-top:12px;border-top:.5px solid var(--bdr);padding-top:9px">`;
    myHelps.forEach(x=>{
      h+=`<div style="padding:7px 0;border-bottom:.5px solid var(--bdr)">
        <div style="font-size:12.5px">${esc(x.body)}</div>
        <div style="font-size:11px;color:var(--mut);margin-top:3px">
          ${x.status==='completed'?'<span style="color:var(--grn)">Answered</span> · '+esc(x.answered_by_code||''):'<span style="color:var(--amb)">Waiting for a reply</span>'}
        </div>
        ${x.answer?`<div style="font-size:12px;background:var(--sur2);padding:7px 9px;border-radius:6px;margin-top:5px">${esc(x.answer)}</div>`:''}
      </div>`;
    });
    h+=`</div>`;
  }
  h+=`</div>`;

  // ── 放行状态（完成之后才出现）──
  const allDone=(p.depts||[]).length&&(p.depts||[]).every(x=>x.status==='completed');
  if(allDone){
    h+=p.released
      ? `<div class="alert alert-grn">🎉 You have been released — you can take a class on your own.</div>`
      : `<div class="alert alert-amb">Training is finished. Waiting for management to release you.</div>`;
    const cp=completionOf(p.uid);
    if(cp){
      h+=`<div class="card" style="border:2px solid var(--grn)">
        <div class="card-title" style="margin-bottom:8px">🎓 Your completion note</div>
        ${cp.summary?`<div style="font-size:11px;font-weight:600;color:var(--mut)">What you went through</div><div style="font-size:13px;margin:3px 0 10px;line-height:1.5">${esc(cp.summary)}</div>`:''}
        ${cp.strengths?`<div style="font-size:11px;font-weight:600;color:var(--mut)">What you did well</div><div style="font-size:13px;margin:3px 0 10px;line-height:1.5">${esc(cp.strengths)}</div>`:''}
        ${cp.watch?`<div style="font-size:11px;font-weight:600;color:var(--mut)">What to watch once you are on your own</div><div style="font-size:13px;margin:3px 0 10px;line-height:1.5">${esc(cp.watch)}</div>`:''}
        <div style="font-size:11px;color:var(--mut)">Written by ${esc(cp.issued_by_code||'')} on ${String(cp.issued_at).slice(0,10)}</div>
        ${cp.acknowledged_at?`<div style="font-size:11.5px;color:var(--grn);margin-top:8px">✅ You have read this</div>`
          :`<div style="margin-top:10px"><button class="btn btn-pri btn-sm" onclick="doAckCompletion('${cp.id}')">I have read this</button></div>`}
      </div>`;
    }
  }
  el.innerHTML=h;
}

function npToggle(e){
  e.classList.toggle('on');
  e.firstElementChild.textContent=e.classList.contains('on')?'✓':'＋';
  npPreview();
}
function npSelectedDepts(){
  return [...document.querySelectorAll('#np_depts .cb.on')].map(x=>x.dataset.d);
}
function npPreview(){
  const box=document.getElementById('np_preview'); if(!box)return;
  const start=document.getElementById('np_start')?.value;
  const depts=npSelectedDepts();
  if(!start||!depts.length){box.textContent='';return;}
  const fake={startDate:start,exceptions:[],depts:depts.map(d=>({dept:d}))};
  const lines=depts.map(d=>{
    const m=planDates(fake,d);
    const skipped=[];
    let cur=parseISO(start), n=0, guard=0;
    while(n<14&&guard++<500){
      const iso=isoOf(cur), dow=cur.getDay();
      if(dow>=1&&dow<=5){ if(isHoliday(iso,d)) skipped.push(holidayName(iso,d)); else n++; }
      cur.setDate(cur.getDate()+1);
    }
    const uniq=[...new Set(skipped)];
    return `${d}: ${fmtDate(m[1])} → ${fmtDate(m[14])}${uniq.length?` (skipping ${uniq.slice(0,2).join(', ')}${uniq.length>2?' etc.':''})`:''}`;
  });
  box.innerHTML='Monday to Friday are training days; public holidays push everything back automatically. Catch-up days are marked by hand after the plan is created.<br>'+lines.join('<br>');
}
async function createPlan(){
  const tc=document.getElementById('np_teacher')?.value;
  const mc=document.getElementById('np_mentor')?.value;
  const st=document.getElementById('np_start')?.value;
  const depts=npSelectedDepts();
  if(!tc||!mc||!st||!depts.length){alert('New teacher, Mentor, departments and start date are all required.');return;}
  if(tc===mc){alert('The new teacher and the Mentor cannot be the same person.');return;}
  const uid='plan_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
  const plan={uid:uid,teacherCode:tc,mentorCode:mc,startDate:st,
    note:document.getElementById('np_note')?.value||'',status:'active',depts:depts.map(d=>({dept:d}))};
  plan.targetDate=targetDateOf(plan)||null;
  await savePlan(plan);
  for(const d of depts) await savePlanDept(uid,d,1,'active');
  document.querySelector('.overlay')?.remove();
  await reloadAll();
  goPage('mgmt');
  alert(`✅ Training plan created for ${teacherName(tc)} (${depts.join(' / ')})`);
}

async function savePlanEdit(uid){
  const p=getPlan(uid); if(!p)return;
  const oldMentor=p.mentorCode;
  const newMentor=document.getElementById('pe_mentor')?.value||p.mentorCode;
  // v32：以前换 Mentor 只改计划上的名字，traingo_mentor_history 从来没有人写 ——
  // Progress 会把前几天也显示成新 Mentor 带的，而且新 Mentor 可以改写前一位写的日报。
  // 现在先把「谁从哪一天开始带」写进 history（每个部门一笔），再改计划。
  if(newMentor&&newMentor!==oldMentor){
    const firstTime=!(p.mentorHistory||[]).length;
    const rows=[];
    (p.depts||[]).forEach(d=>{
      if(firstTime&&oldMentor)rows.push({plan_uid:p.uid,dept:d.dept,mentor_code:oldMentor,from_day:1,reason:'original Mentor'});
      rows.push({plan_uid:p.uid,dept:d.dept,mentor_code:newMentor,from_day:d.currentDay||1,
                 from_date:todayISO(),reason:'Mentor changed on Settings'});
    });
    if(rows.length&&sb){
      const {error}=await sb.from('traingo_mentor_history').insert(rows);
      if(error){alert('Could not record the Mentor change, so nothing was changed.\n\n'+error.message);return;}
    }
  }
  p.mentorCode=newMentor;
  p.startDate=document.getElementById('pe_start')?.value||p.startDate;
  p.note=document.getElementById('pe_note')?.value||'';
  p.targetDate=targetDateOf(p)||null;
  await savePlan(p);
  document.querySelector('.overlay')?.remove();
  await reloadAll();
  alert('✅ Saved');
}
async function deletePlan(uid){
  if(!isAdminRole()){alert(ADMIN_ONLY_MSG);return;}
  const p=getPlan(uid); if(!p)return;
  if(!confirm(`Delete ${p.teacherName}'s whole plan?\nDay reports and task checks go with it. This cannot be undone.`))return;
  const {error}=await sb.from('traingo_plan').delete().eq('client_uid',uid);
  if(error){alert('Could not delete: '+error.message);return;}
  S.planUid=null;
  await reloadAll();
  goPage('mgmt');
}

const HANDBOOK = []   /* v34：内容已移到资料库 traingo_content，登入後由 loadContent() 原地填入 */;


// ── Handbook renderer ──────────────────────────────────────────

// Per-document accent colours
const HB_THEME = {
  about:   {bg:'#EEF5FF', border:'#AABDD4', accent:'#185FA5', light:'#D6E8FF'},
  core:    {bg:'#E8F7F2', border:'#9FE1CB', accent:'#0F6E56', light:'#C2EEE0'},
  special: {bg:'#FFF8E1', border:'#F9CB42', accent:'#9C6500', light:'#FDEDB0'},
  conduct: {bg:'#F4F0FF', border:'#C5B3F5', accent:'#5B35C4', light:'#E2D9FF'},
};

// Department colour accents
const DEPT_THEME = {
  'SRK/GAK': {bg:'#E8F7F2', border:'#9FE1CB', code:'#0F6E56'},
  'ATC':     {bg:'#EEF5FF', border:'#AABDD4', code:'#185FA5'},
  'SRT':     {bg:'#FFF8E1', border:'#F9CB42', code:'#9C6500'},
  'CIY':     {bg:'#F4F0FF', border:'#C5B3F5', code:'#5B35C4'},
};

function renderHandbook(){
  const el=document.getElementById('handbook-content');
  const activeId=window._hbActive||'about';
  logOpen('HANDBOOK:'+activeId);
  const doc=HANDBOOK.find(h=>h.id===activeId)||HANDBOOK[0];
  const theme=HB_THEME[activeId]||HB_THEME.about;

  // Tab bar
  let html=`<div style="margin-bottom:12px">
    <div class="card-title" style="margin-bottom:10px">🏫 Staff Handbook</div>
    <div class="itab-row">
      ${HANDBOOK.map(h=>{
        const t=HB_THEME[h.id];
        return`<button class="itab ${h.id===activeId?'on':''}"
          style="${h.id===activeId?`border-bottom-color:${t.accent};color:${t.accent};font-weight:700`:''}"
          onclick="openHandbook('${h.id}')">${h.icon} ${h.num} ${h.title}</button>`;
      }).join('')}
    </div>
  </div>`;

  // Doc card with themed header
  html+=`<div style="border:.5px solid ${theme.border};border-radius:12px;overflow:hidden;background:var(--sur)">

    <!-- Coloured header band -->
    <div style="background:${theme.bg};border-bottom:.5px solid ${theme.border};padding:16px 20px;display:flex;align-items:center;gap:12px">
      <span style="font-size:32px">${doc.icon}</span>
      <div>
        <div style="font-size:16px;font-weight:800;color:${theme.accent}">${doc.num} — ${doc.title}</div>
        <div style="font-size:11px;color:${theme.accent};opacity:.75;margin-top:2px">${doc.subtitle}</div>
      </div>
    </div>

    <div style="padding:18px 20px">`;

  doc.sections.forEach(sec=>{
    html+=`<div style="margin-bottom:20px">`;

    if(sec.heading){
      html+=`<div style="font-size:11px;font-weight:800;color:${theme.accent};text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px;padding-bottom:5px;border-bottom:2px solid ${theme.light}">${sec.heading}</div>`;
    }

    if(sec.body){
      html+=`<div style="font-size:12px;line-height:1.85;color:var(--txt);white-space:pre-line">${sec.body}</div>`;
    }

    if(sec.highlight){
      html+=`<div style="background:${theme.bg};border-left:4px solid ${theme.accent};padding:14px 16px;border-radius:0 10px 10px 0;font-size:12px;line-height:1.85;white-space:pre-line;font-style:italic;color:${theme.accent}">${sec.highlight}</div>`;
    }

    if(sec.bullets){
      html+=`<div style="display:flex;flex-direction:column;gap:7px">
        ${sec.bullets.map(b=>`
          <div style="display:flex;align-items:flex-start;gap:8px;padding:8px 12px;background:${theme.bg};border-radius:8px;border:.5px solid ${theme.border}">
            <span style="font-size:13px;flex-shrink:0">${b.split(' ')[0]}</span>
            <span style="font-size:12px;line-height:1.55">${b.split(' ').slice(1).join(' ')}</span>
          </div>`).join('')}
      </div>`;
    }

    if(sec.redlines){
      html+=`<div style="background:#FCEBEB;border:.5px solid #F09595;border-radius:10px;padding:14px 16px">
        <div style="font-size:10px;font-weight:700;color:#7a1f1f;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">These red lines NEVER change — regardless of department or student age</div>
        <div style="display:flex;flex-direction:column;gap:6px">
          ${sec.redlines.map(r=>`<div style="font-size:12px;line-height:1.55;color:#7a1f1f;display:flex;gap:8px;align-items:flex-start"><span style="flex-shrink:0">❌</span><span>${r}</span></div>`).join('')}
        </div>
      </div>`;
    }

    if(sec.departments){
      html+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        ${sec.departments.map(d=>{
          const dt=DEPT_THEME[d.code]||{bg:'#f5f4f0',border:'#e0ddd6',code:'#185FA5'};
          return`<div style="border:.5px solid ${dt.border};border-radius:10px;overflow:hidden">
            <div style="background:${dt.bg};padding:10px 12px;border-bottom:.5px solid ${dt.border}">
              <div style="font-weight:800;font-size:14px;color:${dt.code}">${d.code}</div>
              <div style="font-size:10px;color:var(--mut);margin-top:1px">${d.full} · ${d.age}</div>
            </div>
            <div style="padding:10px 12px">
              <div style="font-size:11px;font-weight:700;color:var(--gold);margin-bottom:5px">${d.theme}</div>
              <div style="font-size:11px;line-height:1.55;color:var(--txt)">${d.focus}</div>
            </div>
          </div>`;
        }).join('')}
      </div>`;
    }

    if(sec.twoCol){
      sec.twoCol.forEach(tc=>{
        html+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px">
          <div style="background:#E1F5EE;border:.5px solid #9FE1CB;border-radius:10px;padding:12px">
            <div style="font-size:10px;font-weight:700;color:#0F6E56;margin-bottom:7px;text-transform:uppercase;letter-spacing:.05em">✅ Do</div>
            ${tc.good.map(g=>`<div style="font-size:12px;line-height:1.65;margin-bottom:3px">${g}</div>`).join('')}
          </div>
          <div style="background:#FCEBEB;border:.5px solid #F09595;border-radius:10px;padding:12px">
            <div style="font-size:10px;font-weight:700;color:#A32D2D;margin-bottom:7px;text-transform:uppercase;letter-spacing:.05em">❌ Never</div>
            ${tc.bad.map(b=>`<div style="font-size:12px;line-height:1.65;margin-bottom:3px">${b}</div>`).join('')}
          </div>
        </div>`;
      });
    }

    if(sec.numbered){
      html+=`<div style="display:flex;flex-direction:column;gap:10px">
        ${sec.numbered.map((n,i)=>{
          const colours=['#EEF5FF','#E8F7F2','#FFF8E1','#F4F0FF'];
          const borders=['#AABDD4','#9FE1CB','#F9CB42','#C5B3F5'];
          const accents=['#185FA5','#0F6E56','#9C6500','#5B35C4'];
          const ci=i%4;
          return`<div style="border:.5px solid ${borders[ci]};border-radius:10px;overflow:hidden">
            <div style="background:${colours[ci]};padding:9px 14px;border-bottom:.5px solid ${borders[ci]}">
              <div style="font-weight:700;font-size:12px;color:${accents[ci]}">${n.title}</div>
            </div>
            <div style="padding:10px 14px;font-size:12px;line-height:1.75;white-space:pre-line;color:var(--txt)">${n.body}</div>
          </div>`;
        }).join('')}
      </div>`;
    }

    if(sec.subsections){
      html+=`<div style="display:flex;flex-direction:column;gap:12px">
        ${sec.subsections.map(ss=>`
          <div style="border:.5px solid ${theme.border};border-radius:10px;overflow:hidden">
            <div style="background:${theme.bg};padding:8px 14px;border-bottom:.5px solid ${theme.border}">
              <div style="font-size:11px;font-weight:700;color:${theme.accent}">${ss.sub}</div>
            </div>
            <div style="padding:10px 14px;display:flex;flex-direction:column;gap:5px">
              ${ss.bullets.map(b=>`<div style="font-size:12px;line-height:1.55;display:flex;gap:8px;align-items:flex-start"><span style="color:${theme.accent};flex-shrink:0">•</span><span>${b}</span></div>`).join('')}
            </div>
          </div>`).join('')}
      </div>`;
    }

    html+=`</div>`;
  });

  html+=`</div></div>`;
  el.innerHTML=html;
}

function openHandbook(id){
  window._hbActive=id;
  renderHandbook();
}
