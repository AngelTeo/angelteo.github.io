<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Academee 平台共用登入（Supabase） -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<title>TrainGo</title>
<style>
:root {
  --acc:#185FA5;--grn:#0F6E56;--red:#A32D2D;--amb:#854F0B;--pur:#6B3FA0;
  --sur:#ffffff;--sur2:#f5f4f0;--bdr:#e0ddd6;
  --txt:#1a1a1a;--mut:#888888;--hint:#bbbbbb;--gold:#c8860a;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--sur2);color:var(--txt);font-size:13px;}
.topbar{background:#1B3A5C;border-bottom:none;padding:0 12px;display:flex;align-items:center;gap:2px;position:sticky;top:0;z-index:100;min-height:46px;flex-wrap:wrap;}
.topbar-brand{font-weight:800;font-size:13px;color:#ffffff;margin-right:2px;white-space:nowrap;}
.topbar-ver{font-size:9px;font-weight:600;color:rgba(255,255,255,.45);margin-right:8px;letter-spacing:.04em;align-self:flex-end;padding-bottom:14px;}
.ntab{border:none;background:none;padding:12px 9px;font-size:11px;cursor:pointer;color:rgba(255,255,255,.65);border-bottom:2px solid transparent;font-family:inherit;white-space:nowrap;}
.ntab.on{color:#ffffff;border-bottom-color:#ffffff;font-weight:600;}
.ntab:hover{color:#ffffff;}
.role-badge{margin-left:auto;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:600;border:1px solid;flex-shrink:0;}
.role-mentor{background:rgba(24,95,165,.25);color:#9EC8FF;border-color:rgba(158,200,255,.4);}
.role-mentee{background:rgba(15,110,86,.25);color:#7BE8C8;border-color:rgba(123,232,200,.4);}
.role-mgmt{background:rgba(133,79,11,.25);color:#FFD580;border-color:rgba(255,213,128,.4);}
.page{display:none;padding:14px;max-width:960px;margin:0 auto;}
.page.on{display:block;}
.card{background:var(--sur);border:.5px solid var(--bdr);border-radius:10px;padding:14px;margin-bottom:12px;}
.card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.card-title{font-size:13px;font-weight:600;}
.btn{border:.5px solid var(--bdr);background:var(--sur);border-radius:6px;padding:6px 13px;font-size:11px;cursor:pointer;color:var(--txt);font-family:inherit;transition:background .15s;}
.btn:hover{background:var(--sur2);}
.btn-pri{background:var(--acc);color:#fff;border-color:var(--acc);}
.btn-pri:hover{background:#134e8a;}
.btn-grn{background:var(--grn);color:#fff;border-color:var(--grn);}
.btn-red{background:var(--red);color:#fff;border-color:var(--red);}
.btn-sm{padding:4px 9px;font-size:10px;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:12px;}
.stat{background:var(--sur);border:.5px solid var(--bdr);border-radius:10px;padding:12px;text-align:center;}
.stat-num{font-size:22px;font-weight:700;color:var(--acc);}
.stat-lbl{font-size:10px;color:var(--mut);margin-top:2px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
/* TASK */
.task-item{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:.5px solid var(--bdr);}
.task-item:last-child{border-bottom:none;}
.task-item input[type=checkbox]{margin-top:2px;width:15px;height:15px;cursor:pointer;accent-color:var(--acc);flex-shrink:0;}
.task-label{flex:1;font-size:12px;line-height:1.5;cursor:pointer;}
.task-item.done .task-label{text-decoration:line-through;color:var(--mut);}
.task-tag{font-size:9px;padding:1px 5px;border-radius:8px;font-weight:600;margin-right:3px;}
.tag-must{background:#FCEBEB;color:#A32D2D;}
.tag-doc{background:#EEF2F7;color:#185FA5;}
.tag-obs{background:#FFF8E1;color:#854F0B;}
.tag-teach{background:#E1F5EE;color:#0F6E56;}
.sop-btn{font-size:10px;padding:2px 7px;border-radius:10px;border:.5px solid var(--bdr);background:var(--sur2);color:var(--acc);cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:inherit;margin-top:1px;}
.sop-btn:hover{background:#EEF2F7;border-color:var(--acc);}
/* TIMELINE */
.timeline{display:flex;gap:0;margin-bottom:14px;}
.stage-block{flex:1;position:relative;}
.stage-bar{height:7px;background:var(--bdr);}
.stage-block.done .stage-bar{background:var(--grn);}
.stage-block.current .stage-bar{background:var(--acc);}
.stage-dot{width:17px;height:17px;border-radius:50%;border:2px solid var(--bdr);background:var(--sur);position:absolute;top:-5px;left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;font-size:8px;}
.stage-block.done .stage-dot{background:var(--grn);border-color:var(--grn);color:#fff;}
.stage-block.current .stage-dot{background:var(--acc);border-color:var(--acc);color:#fff;}
.stage-lbl{text-align:center;font-size:8px;color:var(--mut);margin-top:14px;}
.stage-block.current .stage-lbl{color:var(--acc);font-weight:600;}
/* SOP MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:999;display:flex;align-items:center;justify-content:center;padding:8px;}
.modal{background:var(--sur);border-radius:14px;width:min(580px,96vw);max-height:90vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.28);}
.modal-hdr{padding:12px 14px;border-bottom:.5px solid var(--bdr);display:flex;align-items:center;position:sticky;top:0;background:var(--sur);z-index:2;border-radius:14px 14px 0 0;gap:8px;}
.modal-hdr-title{font-size:14px;font-weight:700;flex:1;}
.modal-close{background:none;border:none;font-size:20px;color:var(--mut);cursor:pointer;flex-shrink:0;}
.modal-body{padding:12px 14px;}
.modal-foot{padding:10px 14px;border-top:.5px solid var(--bdr);display:flex;justify-content:flex-end;position:sticky;bottom:0;background:var(--sur);border-radius:0 0 14px 14px;}
/* SOP STEP TABLE */
.sop-step{display:flex;gap:8px;padding:7px 0;border-bottom:.5px solid var(--bdr);font-size:12px;}
.sop-step:last-child{border-bottom:none;}
.sop-step-n{font-size:10px;font-weight:700;color:var(--hint);min-width:20px;padding-top:1px;}
.sop-step-body{flex:1;}
.sop-step-title{font-weight:600;color:var(--txt);margin-bottom:2px;}
.sop-step-do{color:var(--txt);line-height:1.55;}
.sop-step-warn{font-size:10px;color:var(--red);margin-top:2px;}
/* AGE TABLE */
.age-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:10px;}
.age-table th{padding:6px 8px;text-align:left;border-bottom:.5px solid var(--bdr);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);}
.age-table td{padding:6px 8px;border-bottom:.5px solid var(--bdr);vertical-align:top;line-height:1.5;}
.age-jr{background:#FFF8F0;}
.age-in{background:#F0F7FF;}
.age-sr{background:#F0FFF6;}
.age-hdr-jr{background:#FFE8CC;color:#7a3500;font-weight:700;}
.age-hdr-in{background:#C8DFFF;color:#0d3d7a;font-weight:700;}
.age-hdr-sr{background:#B8F0D4;color:#0a4a28;font-weight:700;}
/* WARN PILLS */
.warn-pill{display:flex;gap:6px;align-items:flex-start;font-size:11px;padding:5px 8px;background:#FCEBEB;border-radius:6px;margin-bottom:4px;color:#7a1f1f;line-height:1.4;}
/* SOP LIBRARY */
.sop-card{background:var(--sur);border:.5px solid var(--bdr);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:border-color .15s;}
.sop-card:hover{border-color:var(--acc);}
.sop-icon{font-size:22px;flex-shrink:0;}
.sop-cat-badge{font-size:9px;padding:2px 7px;border-radius:8px;font-weight:600;}
.cat-monday{background:#FFF8E1;color:#854F0B;}
.cat-daily{background:#E1F5EE;color:#0F6E56;}
.cat-teaching{background:#EEF2F7;color:#185FA5;}
.cat-closing{background:#F3EEF9;color:#6B3FA0;}
.cat-morning{background:#FFF3E0;color:#E65100;}
.cat-end{background:#F3EEF9;color:#6B3FA0;}
/* REPORT */
textarea{width:100%;border:.5px solid var(--bdr);border-radius:6px;padding:8px;font-family:inherit;font-size:12px;resize:vertical;background:var(--sur);color:var(--txt);}
input[type=text],input[type=date],select{border:.5px solid var(--bdr);border-radius:6px;padding:7px 10px;font-family:inherit;font-size:12px;background:var(--sur);color:var(--txt);width:100%;}
label.lbl{font-size:11px;color:var(--mut);display:block;margin-bottom:4px;margin-top:10px;}
label.lbl:first-child{margin-top:0;}
/* MISC */
.alert{padding:9px 12px;border-radius:8px;font-size:12px;margin-bottom:7px;display:flex;align-items:center;gap:7px;line-height:1.45;}
.alert-red{background:#FCEBEB;border:.5px solid #F09595;color:#7a1f1f;}
.alert-amb{background:#FFF8E1;border:.5px solid #F9CB42;color:#7a4500;}
.alert-grn{background:#E1F5EE;border:.5px solid #9FE1CB;color:#065041;}
.alert-blue{background:#EEF2F7;border:.5px solid #AABDD4;color:#143d6e;}
.chip{display:inline-block;padding:2px 7px;border-radius:10px;font-size:9px;font-weight:600;}
.chip-grn{background:#E1F5EE;color:var(--grn);}
.chip-amb{background:#FFF8E1;color:var(--amb);}
.chip-red{background:#FCEBEB;color:var(--red);}
.chip-blue{background:#EEF2F7;color:var(--acc);}
.chip-pur{background:#F3EEF9;color:var(--pur);}
.prog-bar{background:var(--bdr);border-radius:99px;height:5px;overflow:hidden;margin-top:4px;}
.prog-fill{height:100%;border-radius:99px;background:var(--acc);transition:width .3s;}
.prog-fill.grn{background:var(--grn);}
.cohort-card{background:var(--sur);border:.5px solid var(--bdr);border-radius:10px;padding:12px 14px;margin-bottom:9px;cursor:pointer;transition:border-color .15s;}
.cohort-card:hover{border-color:var(--acc);}
.cohort-meta{font-size:10px;color:var(--mut);margin-top:3px;}
.day-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:10px;}
.day-btn{padding:5px 3px;border-radius:6px;border:.5px solid var(--bdr);background:var(--sur);cursor:pointer;font-size:9px;text-align:center;font-family:inherit;color:var(--mut);}
.day-btn.active{background:var(--acc);color:#fff;border-color:var(--acc);}
.day-btn.done{background:#E1F5EE;border-color:#9FE1CB;color:var(--grn);}
.day-btn.locked{opacity:.4;cursor:not-allowed;}
.itab-row{display:flex;gap:0;border-bottom:.5px solid var(--bdr);margin-bottom:12px;overflow-x:auto;}
.itab{padding:7px 12px;font-size:11px;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit;white-space:nowrap;}
.itab.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:600;}
.saved-flash{position:fixed;bottom:18px;right:18px;background:var(--grn);color:#fff;padding:7px 14px;border-radius:20px;font-size:11px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;}
/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--sur2);}
.login-box{background:var(--sur);border:.5px solid var(--bdr);border-radius:16px;padding:32px 28px;width:380px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.08);}
.login-logo{font-size:22px;font-weight:800;color:var(--acc);margin-bottom:3px;letter-spacing:-.3px;}
.login-sub{font-size:10px;color:var(--mut);margin-bottom:20px;}
.role-btn{width:100%;padding:13px;margin-bottom:8px;border-radius:10px;border:1.5px solid var(--bdr);background:var(--sur);cursor:pointer;font-family:inherit;font-size:12px;font-weight:600;display:flex;align-items:center;gap:10px;transition:all .15s;text-align:left;}
.role-btn:hover{border-color:var(--acc);background:#F0F6FF;}
.role-btn .icon{font-size:20px;}
.role-btn small{font-size:10px;color:var(--mut);font-weight:400;display:block;}
@media(max-width:600px){.stats{grid-template-columns:1fr 1fr;}.grid2{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="saved-flash" id="savedFlash">✓ Saved</div>

<!-- 未登入 / 无权限 时显示（本系统不自己管密码，跟平台共用登入）-->
<div class="login-wrap" id="gate">
  <div class="login-box">
    <div style="font-size:40px;margin-bottom:10px">🎯</div>
    <div class="login-logo">TrainGo</div>
    <div class="login-sub">Academee 新老师训练系统</div>
    <div id="gateMsg" style="margin-top:20px;font-size:13px;line-height:1.7;color:var(--txt)">正在确认你的身份…</div>
    <a id="gateBtn" href="../index.html" style="display:none;margin-top:18px;padding:12px;border-radius:10px;background:#1B3A5C;color:#fff;font-size:14px;font-weight:700;text-decoration:none">回平台首页登入 →</a>
  </div>
</div>

<!-- MAIN APP -->
<div id="mainApp" style="display:none">
  <div class="topbar">
    <span class="topbar-brand">🎯 TrainGo</span>
    <span class="topbar-ver" id="topbarVer"></span>
    <span id="syncStatus" style="font-size:10px;margin-left:2px;opacity:.7" title="云端同步状态"></span>
    <button class="ntab on" onclick="goPage('dashboard')">🏠 首页</button>
    <button class="ntab" onclick="goPage('tasks')">📋 任务</button>
    <button class="ntab" onclick="goPage('report')">📝 日报</button>
    <button class="ntab" onclick="goPage('progress')">📊 进度</button>
    <button class="ntab" onclick="goPage('sop')">📖 SOP</button>
    <button class="ntab" onclick="goPage('handbook')">🏫 手册</button>
    <button class="ntab" id="tab-mgmt" style="display:none" onclick="goPage('mgmt')">⚙️ 设定</button>
    <span id="roleBadgeTop" class="role-badge" style="margin-left:auto"></span>
    <button class="btn btn-sm" onclick="exportData()" style="margin-left:8px;flex-shrink:0;background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3)">↑ 汇出</button>
    <button class="btn btn-sm" onclick="importData()" style="margin-left:4px;flex-shrink:0;background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3)">↓ 汇入</button>
  </div>
  <input type="file" id="importFileInput" accept=".json" style="display:none" onchange="handleImportFile(this)">
  <div class="page on" id="page-dashboard"><div id="dashboard-content"></div></div>
  <div class="page" id="page-tasks"><div id="tasks-content"></div></div>
  <div class="page" id="page-report"><div id="report-content"></div></div>
  <div class="page" id="page-progress"><div id="progress-content"></div></div>
  <div class="page" id="page-sop"><div id="sop-content"></div></div>
  <div class="page" id="page-handbook"><div id="handbook-content"></div></div>
  <div class="page" id="page-mgmt"><div id="mgmt-content"></div></div>
</div>

<script>

function refreshCurrentPage(){

  for(const p of pages){const el=document.getElementById('page-'+p);

// ══════════════════════════════════════════════════════════════
// SOP DATA — 13 STEPS
// ══════════════════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════════
// 部门配置 · DEPARTMENT CONFIG  (v21 · 各部门各自保留阶段切法)
// ══════════════════════════════════════════════════════════════
const SRK_SOP_DATA= {
  hygiene:{id:'hygiene',n:1,name:'Hygiene Checking',nameZh:'Head-to-Toe Check',icon:'👀',when:'MONDAY ONLY',cat:'monday',
    steps:[
      {n:1,title:'Hair',warn:'⚠️ Lice / Nits',do_:'Check hair & scalp carefully'},
      {n:2,title:'Forehead',warn:'⚠️ Fever',do_:'Touch forehead to check temperature'},
      {n:3,title:'Eyes',warn:'⚠️ Eye Infection',do_:'"Open eyes big big. Look up, look down, look left, look right."'},
      {n:4,title:'Face & Mouth',warn:'⚠️ HFMD · Mouth sores · Ulcers · Flu',do_:'Use torch: "Say AHHH! Show me your tongue." Ask: "Throat pain? Mouth pain?" Model cough/sneeze sounds.'},
      {n:5,title:'Body & Skin',warn:'⚠️ HFMD · Chickenpox — red spots, blisters',do_:'"Turn around!" Check skin for red spots or blisters.'},
      {n:6,title:'Hands & Fingers',warn:'⚠️ HFMD · Chickenpox · Nail length (must be short)',do_:'"Show me your hands! Turn behind! Hands on the table!" Check palms, back of hands, and fingernails.'},
      {n:7,title:'Feet',warn:'⚠️ HFMD — red spots / blisters',do_:'"Feet up! Flamingo!" — check both feet.'},
      {n:8,title:'Uniform & Cleanliness',warn:'',do_:'Encourage: brush teeth, wash face, tuck in shirt. Come to school in neat uniform daily.'},
    ],
    age:{
      jr:{tips:['DEMONSTRATE entire flow WITH student','CHECK each part together step by step','GUIDE every action slowly','HELP student with actions','MODEL funny sounds (cough/sneeze!) — make it fun','ENCOURAGE participation — never scare them'],goal:'Stands still, follows simple instructions, not scared, cooperates, laughs at funny parts'},
      in_:{tips:['DEMONSTRATE entire flow','GUIDE student through steps','ENCOURAGE independent actions','MONITOR understanding','MODEL clear voice & actions'],goal:'Follows sequence, does actions independently, responds to questions, more confident'},
      sr:{tips:['BRIEF reminder only','GUIDE through quickly','MONITOR compliance','Quick efficient check'],goal:'Knows entire routine, follows independently, quick cooperation, no anxiety, efficient'},
    },
    warns:['🚨 INFECTIOUS DISEASE SIGNS → bring to MGMT IMMEDIATELY','⚠️ Same hygiene issue 3 weeks in a row → Report to MGMT','⚠️ Student reports mouth pain multiple times → Track','⚠️ Frequent "not feeling well" → Inform parents','📝 Normal concerns: record in Hygiene Checklist weekly'],
  },

  bookcollect:{id:'bookcollect',n:2,name:'Collection of Books',nameZh:'Collect by Subject',icon:'📚',when:'MONDAY ONLY',cat:'monday',
    steps:[
      {n:1,do_:'Announce: "Take out ALL your books. Submit by subject." Give time to prepare.'},
      {n:2,do_:'Students submit books. Walk around to check, sort by subject, stack neatly.'},
      {n:3,do_:'Check subject by subject: "English book!" Count each. Compare with attendance number.'},
      {n:4,warn:'⚠️ Number wrong',do_:'"Everyone stand up!" → Call names one by one → Check bags → Check cupboard → Sit when confirmed.'},
      {n:5,warn:'Report: Unfound Book',do_:'Write student name on board (top right) → Photo → WhatsApp to MGMT group.'},
      {n:6,do_:'Keep books in cupboard by subject. Continue to next activity.'},
    ],
    age:{
      jr:{tips:['DEMONSTRATE how to take out & submit','HELP sort books FOR them','Name each subject clearly','Show WHERE in cupboard to keep books'],goal:'Can take out books with help, learning to submit, follows teacher guidance'},
      in_:{tips:['GUIDE sorting: "Find your English book"','Help if stuck','Check organization','Encourage neatness'],goal:'Can sort with guidance, knows most subjects, improving organization'},
      sr:{tips:['BRIEF instruction only','MONITOR independently','Should be efficient — quick process'],goal:'Sorts independently, neat organization, all subjects correct, no prompting needed'},
    },
    warns:['⚠️ 3 weeks consecutive missing same book → Serious concern → Parent contact needed','📝 Photo + WhatsApp to MGMT when names written on board'],
  },

  attendance:{id:'attendance',n:3,name:'Take Attendance',nameZh:'Roll Call',icon:'✋',when:'EVERY DAY',cat:'daily',
    steps:[
      {n:1,do_:'Lead the morning chant:<br>Teacher: "Clap clap — good morning children!"<br>Students: "Clap clap — good morning Teacher!"<br><br>Wait for full quiet. "Sit properly. Listen for your name."'},
      {n:2,do_:'Call each name CLEARLY and LOUDLY. Wait for response. Make eye contact. Verify it\'s the right student.'},
      {n:3,warn:'⚠️ Too quiet / shy',do_:'"Louder please! Show me your STRONG voice!" Praise loud responses. Make it FUN — different voices, raise hand HIGH!'},
      {n:4,do_:'Tick (✓) attendance sheet immediately and accurately. Record on correct line.'},
      {n:5,warn:'⚠️ Absent (3+ times → MGMT)',do_:'Note absent student clearly in book. Inform MGMT for 3 or more absences.'},
      {n:6,warn:'⚠️ Late (3+ times/week → MGMT)',do_:'Note exact time of arrival. Record in attendance book. 3+ times per week → Weekly report → Inform MGMT.'},
      {n:7,do_:'Close attendance book. "Let\'s start our lesson!" Transition smoothly to next activity.'},

// 训练计划模型（v23）
// 一位老师一份计划；计划里每个部门各自一条进度线；任务跟课表走
// ══════════════════════════════════════════════════════════════

const WEEK_CODE=['SUN','MON','TUE','WED','THU','FRI','SAT'];
// 整理日不再固定在週五 —— 由管理层自己标（见 traingo_day_exception.kind）
const TRAIN_DAYS=[1,2,3,4,6,7,8,9,11,12,13,14];   // 任务表的键，沿用 v20 的编号
const PLAN_DAYS=TRAIN_DAYS;
const REST_DAYS=[];                                // 保留空阵列，避免旧引用出错

function esc(x){return String(x==null?'':x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function isoOf(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function parseISO(s){return new Date(String(s).slice(0,10)+'T12:00:00');}
function todayISO(){return isoOf(new Date());}
function weekdayCode(iso){return WEEK_CODE[parseISO(iso).getDay()];}

// ── 行事历：这一天该部门放不放假 ──────────────────────────────
function isHoliday(iso,dept){
  return S.holidays.some(h=>{
    if(h.type==='extra_class')return false;           // 加课不是假期
    const a=String(h.start_date).slice(0,10);
    const b=h.end_date?String(h.end_date).slice(0,10):a;
    if(iso<a||iso>b)return false;
    const dl=h.depts||[];
    return dl.length===0 || dl.includes(dept);        // 空阵列 = 全公司
  });
}
function holidayName(iso,dept){
  const h=S.holidays.find(x=>{
    if(x.type==='extra_class')return false;
    const a=String(x.start_date).slice(0,10);
    const b=x.end_date?String(x.end_date).slice(0,10):a;
    if(iso<a||iso>b)return false;
    const dl=x.depts||[];return dl.length===0||dl.includes(dept);
  });
  return h?h.name:'';
}
// ── 临时例外：管理层标注「今天不算训练日」──────────────────────
function dayMark(plan,dept,iso){
  return (plan.exceptions||[]).find(e=>String(e.on_date).slice(0,10)===iso&&(!e.dept||e.dept===dept))||null;
}
// skip = 这天不算训练日，整个跳过往后顺延
function isException(plan,dept,iso){
  const m=dayMark(plan,dept,iso); return !!m && (m.kind||'skip')==='skip';
}
// consolidate = 整理日：算在计划里，但不出任务
function isRestDate(plan,dept,iso){
  const m=dayMark(plan,dept,iso); return !!m && m.kind==='consolidate';
}
function exceptionReason(plan,dept,iso){
  const m=dayMark(plan,dept,iso); return m?m.reason:'';
}

// ── 排程：第 N 天是哪一天（週一到週五，跳假期与例外）────────────
// 训练日编号 = TRAIN_DAYS 的顺位（1,2,3,4,6,7,8,9,11,12,13,14 是任务表的键）
// 画面上一律写「第 N 个训练日」，N = 顺位，所以永远照时间排，不会跳号
function dayNo(d){const i=TRAIN_DAYS.indexOf(d);return i<0?1:i+1;}
function dayLabel(d){return '第 '+dayNo(d)+' 个训练日';}

// 週一到週四 = 训练日；週五 = 整理日。碰到假期或例外整天跳过。
// 週一到週五都是训练日。碰到假期、被标「跳过」、或被标「整理日」的那天，不给训练日编号。
function planDates(plan,dept){
  const map={}, rest=[];
  const train=[...TRAIN_DAYS];
  let d=parseISO(plan.startDate), guard=0;
  while(train.length&&guard++<600){
    const dow=d.getDay(), iso=isoOf(d);
    if(dow>=1&&dow<=5){
      if(isRestDate(plan,dept,iso))      rest.push(iso);
      else if(!isHoliday(iso,dept)&&!isException(plan,dept,iso)) map[train.shift()]=iso;
    }
    d.setDate(d.getDate()+1);
  }
  map._rest=rest;
  return map;
}

function targetDateOf(plan){
  let last='';
  (plan.depts||[]).forEach(pd=>{
    const m=planDates(plan,pd.dept);
    const v=m[TRAIN_DAYS[TRAIN_DAYS.length-1]]||'';
    if(v>last)last=v;});
  return last;
}
function dayOfDate(plan,dept,iso){
  const m=planDates(plan,dept);
  for(const k in m) if(m[k]===iso) return parseInt(k,10);
  return null;
}

// ── 课表：她今天被排到哪些部门 ────────────────────────────────
function deptsOnDay(teacherCode,iso){
  const w=weekdayCode(iso);
  return [...new Set(S.timetable.filter(t=>t.teacher===teacherCode&&t.day===w).map(t=>t.dept))]
    .filter(d=>DEPT_CFG[deptKey(d)]);
}
function sessionsOnDay(teacherCode,iso,dept){
  const w=weekdayCode(iso);
  return S.timetable.filter(t=>t.teacher===teacherCode&&t.day===w&&t.dept===dept);
}

// ── 今天该出哪些部门的任务 ────────────────────────────────────
// 规则：她今天有课的部门 ∩ 计划里还在跑的部门。整理日不出任务。
function deptFirstSession(teacherCode,iso,dept){
  const rows=sessionsOnDay(teacherCode,iso,dept);
  if(!rows.length)return 'z9';
  return rows.map(r=>r.session||'z9').sort()[0];
}
function todayDeptTasks(plan){
  const iso=todayISO();
  const onDuty=deptsOnDay(plan.teacherCode,iso);
  const out=[];
  const ordered=[...(plan.depts||[])].sort((a,b)=>
    deptFirstSession(plan.teacherCode,iso,a.dept).localeCompare(
    deptFirstSession(plan.teacherCode,iso,b.dept)));
  ordered.forEach(pd=>{
    if(pd.status!=='active')return;
    if(!onDuty.includes(pd.dept))return;
    const day=pd.currentDay||1;
    if(isRestDate(plan,pd.dept,iso)){out.push({dept:pd.dept,day,rest:true,tasks:[]});return;}
    setRD(pd.dept);
    const mine=(D.TASKS[S.role==='mentor'?'mentor':'mentee']||{})[day]||[];
    out.push({dept:pd.dept,day,rest:false,tasks:mine});
  });
  return out;
}

async function boot(){
  if(!sb){gate('读不到云端程式库。请检查网络后重新整理。<br><b>没有任何资料被改动。</b>',false);return;}
  let session=null;
  try{const r=await sb.auth.getSession();session=r.data.session;}catch(e){}
  if(!session){gate('你还没有登入 Academee 平台。<br>本系统与平台共用同一个登入。',true);return;}
  let me=null;
  try{
    const {data,error}=await sb.rpc('traingo_me');
    if(error)throw error;
    me=(data&&data[0])||null;
  }catch(e){gate('读不到你的身份资料：'+e.message+'<br><b>没有任何资料被改动。</b>',false);return;}
  if(!me){gate('你的平台帐号还没有建立资料。请管理层先设定。',false);return;}
  S.me={code:me.teacher_code,name:me.display_name,role:me.role,isAdmin:!!me.is_admin,
    see:{SRK:!!me.srk_see,GAK:!!me.gak_see,ATC:!!me.atc_see,SRT:!!me.srt_see},
    edit:{SRK:!!me.srk_edit,GAK:!!me.gak_edit,ATC:!!me.atc_edit,SRT:!!me.srt_edit}};
  if(!mySeeDepts().length){gate('你的角色（'+me.role+'）没有任何部门的 TrainGo 权限。',false);return;}
  decideRole(); applyRole();
  document.getElementById('gate').style.display='none';
  document.getElementById('mainApp').style.display='block';
  await reloadAll();
  goPage('dashboard');
}

  const labels={mgmt:'🏫 管理层',mentor:'👨‍🏫 Mentor',mentee:'🎓 新老师'};
  const cls={mgmt:'role-mgmt',mentor:'role-mentor',mentee:'role-mentee'};
  const b=document.getElementById('roleBadgeTop');
  if(b){b.textContent=(labels[S.role]||'')+' · '+(m.name||m.code);b.className='role-badge '+(cls[S.role]||'');}
  const t=document.getElementById('tab-mgmt'); if(t)t.style.display=(S.role==='mgmt')?'':'none';
  const vEl=document.getElementById('topbarVer'); if(vEl)vEl.textContent=APP_VERSION;
}

// 梯队读回来后，如果她是某个梯队的 Mentor，就升成 Mentor 身份
function settleRole(){
  if(S.role==='mgmt')return;
  if(!S.me)return;
  const my=S.me.code;
  S.role = S.plans.some(p=>p.mentorCode===my && p.teacherCode!==my) ? 'mentor' : 'mentee';
  applyRole();
}

const PAGE_MAP={dashboard:0,tasks:1,report:2,progress:3,sop:4,handbook:5,mgmt:6};
function goPage(p){
  // Access control — only MGMT can access Admin page
  if(p==='mgmt'&&S.role!=='mgmt'){goPage('dashboard');return;}
  document.querySelectorAll('.page').forEach(el=>el.classList.remove('on'));
  document.querySelectorAll('.ntab').forEach(el=>el.classList.remove('on'));
  const pg=document.getElementById('page-'+p);if(pg)pg.classList.add('on');
  const tabs=document.querySelectorAll('.ntab');
  if(tabs[PAGE_MAP[p]])tabs[PAGE_MAP[p]].classList.add('on');
  if(p==='dashboard')renderDashboard();
  if(p==='tasks')renderTasks();
  if(p==='report')renderReport();
  if(p==='progress')renderProgress();
  if(p==='sop')renderSopLibrary();
  if(p==='handbook')renderHandbook();
  if(p==='mgmt')renderMgmt();
}

function getTodayISO(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
const _WD=['日','一','二','三','四','五','六'];
Date.prototype.__zhDate=function(){return (this.getMonth()+1)+' 月 '+this.getDate()+' 日（周'+_WD[this.getDay()]+'）';};
function fmtDate(ds){if(!ds)return'—';return new Date(ds+'T12:00:00').__zhDate();}
function getDayDate(startDate,dayNum,schedule){
  // Use manual schedule if set for this day
  if(schedule&&schedule[dayNum])
    return new Date(schedule[dayNum]+'T12:00:00').__zhDate();
  // Fall back to auto-calculate from startDate
  if(!startDate)return'';
  const idx=ALL_DAYS.indexOf(dayNum);if(idx<0)return'';
  const d=new Date(startDate+'T12:00:00');
  d.setDate(d.getDate()+idx);
  return d.__zhDate();
}
function genId(p){return p+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,5);}
function getReport(uid,role,day,dept){
  const dp=dept||S.dept;
  return S.reports.find(r=>r.planUid===uid&&r.role===role&&r.day===day&&r.dept===dp);
}
function getDayLabel(d){const m={1:'D1',2:'D2',3:'D3',4:'D4',6:'D6',7:'D7',8:'D8',9:'D9',11:'D11',12:'D12',13:'D13',14:'D14'};return m[d]||'D'+d;}
function stageProgress(cohort){
  if(!cohort)return{stage:1,pct:0};
  const day=cohort.currentDay||1;const stage=getStageForDay(day);
  const idx=ALL_DAYS.indexOf(day);const pct=Math.round(((idx+1)/ALL_DAYS.length)*100);
  return{stage:stage.id,pct};
}
function tagBadge(tag){
  const m={must:'tag-must',doc:'tag-doc',obs:'tag-obs',teach:'tag-teach'};
  const l={must:'CRITICAL',doc:'RECORD',obs:'OBSERVE',teach:'TEACH'};
  return`<span class="task-tag ${m[tag]||'tag-obs'}">${l[tag]||tag.toUpperCase()}</span>`;
}
function countChecked(cid,role,day,dept){
  const dp=dept||S.dept||'SRK'; setRD(dp);
  const tasks=(D.TASKS[role]||{})[day]||[];
  return tasks.filter(t=>S.taskChecks[checkKey(cid,dp,role,day,t.id)]).length;
}

    </div>

function renderMenteeActionItems(cohort,day,stage){
  const menteeRpt=getReport(cohort.id,'mentee',day);
  const mentorRpt=getReport(cohort.id,'mentor',day);
  const items=[];
  if(menteeRpt){
    const stageCfg=D.SKILL_STAGES[stage.id]?.mentee;
    const sops=D.STAGE_SOPS[stage.id]||[];
    sops.forEach(sopId=>{
      const sop=D.SOP[sopId];if(!sop)return;
      const probeVal=menteeRpt.probes?.[sopId]||'';
      const noteVal=menteeRpt.notes?.[sopId]||'';
      const probeOpt=stageCfg?.options?.find(o=>o.val===probeVal);
      if(!probeOpt||['yes','clear','correct','absolute','executed','full','exact','smooth'].includes(probeVal))return;
      const isQuestion=probeVal==='questions';
      items.push({icon:isQuestion?'❓':'⚠️',type:isQuestion?'Ask your Mentor':'Review before tomorrow',
        sop:`${sop.icon} ${sop.name}`,note:noteVal||(isQuestion?'You have a question about this step':'You marked this as unclear')});
    });
  }
  // Mentor flagged re-demo — only show SOP name, NOT the critique
  if(mentorRpt){
    const sops=D.STAGE_SOPS[stage.id]||[];
    sops.forEach(sopId=>{
      const sop=D.SOP[sopId];if(!sop)return;
      const pv=mentorRpt.probes?.[sopId]||'';
      if((pv==='poor'||pv==='major')&&!items.find(i=>i.sop===`${sop.icon} ${sop.name}`))
        items.push({icon:'🔄',type:'Mentor will re-demo tomorrow',sop:`${sop.icon} ${sop.name}`,note:'Pay close attention during the re-demo.'});
    });
  }
  if(!menteeRpt&&!mentorRpt)return`<div class="card" style="border-left:3px solid var(--bdr)"><div class="card-hdr"><span class="card-title">📌 待办</span></div><div style="font-size:12px;color:var(--mut)">交了日报才看得到今天的待办。</div></div>`;
  if(!items.length)return`<div class="card" style="border-left:3px solid var(--grn)"><div class="card-hdr"><span class="card-title">📌 待办</span><span class="chip chip-grn">都正常 ✅</span></div><div style="font-size:12px;color:var(--grn)">很好，没有要跟进的。</div></div>`;
  return`<div class="card" style="border-left:3px solid var(--gold)">
    <div class="card-hdr"><span class="card-title">📌 明天的待办</span><span class="chip chip-amb">${items.length} 项</span></div>
    ${items.map(i=>`<div style="padding:8px 10px;margin-bottom:6px;border-radius:8px;background:#FFFBEA;border:.5px solid #F9CB42">
      <div style="display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600"><span>${i.icon}</span><span style="color:var(--amb)">${i.type}</span><span style="font-weight:400;color:var(--txt)">— ${i.sop}</span></div>
      ${i.note?`<div style="font-size:11px;color:var(--mut);margin-top:4px;padding-left:22px;font-style:italic">"${i.note}"</div>`:''}
    </div>`).join('')}
  </div>`;
}

function renderMentorActionItems(cohort,day,stage){
  const menteeRpt=getReport(cohort.id,'mentee',day);
  const items=[];

  if(menteeRpt){
    // Check probe values for items needing attention
    const stageCfg=D.SKILL_STAGES[stage.id]?.mentee;
    const sops=D.STAGE_SOPS[stage.id]||[];
    sops.forEach(sopId=>{
      const sop=D.SOP[sopId];if(!sop)return;
      const probeVal=menteeRpt.probes?.[sopId]||'';
      const noteVal=menteeRpt.notes?.[sopId]||'';
      const probeOpt=stageCfg?.options?.find(o=>o.val===probeVal);
      if(!probeOpt||probeVal==='yes'||probeVal==='clear'||probeVal==='correct'||probeVal==='absolute'||probeVal==='executed'||probeVal==='full'||probeVal==='exact'||probeVal==='smooth')return;
      const isRedemo=probeVal==='poor'||probeVal==='major';
      items.push({
        icon:isRedemo?'🔴':'🟡',
        type:isRedemo?'Re-demo required':'Needs follow-up',
        sop:`${sop.icon} ${sop.name}`,
        note:noteVal||probeOpt.label,
        urgent:isRedemo,
      });
    });

    // Questions from mentee
    if(menteeRpt.questions){
      items.push({icon:'❓',type:'Question to answer',sop:'From New Teacher',note:menteeRpt.questions,urgent:false});
    }
  }

  if(!items.length&&!menteeRpt){
    return`<div class="card" style="border-left:3px solid var(--bdr)">
      <div class="card-hdr"><span class="card-title">📌 待办</span></div>

  }
  if(!items.length){
    return`<div class="card" style="border-left:3px solid var(--grn)">
      <div class="card-hdr"><span class="card-title">📌 待办</span><span class="chip chip-grn">都正常 ✅</span></div>
      <div style="font-size:12px;color:var(--grn)">没有要跟进的，她进度正常。</div>
    </div>`;
  }

    <div class="card-hdr"><span class="card-title">📌 明天的待办</span><span class="chip ${items.some(i=>i.urgent)?'chip-red':'chip-amb'}">${items.length} 项</span></div>
    ${items.map(i=>`
      <div style="padding:8px 10px;margin-bottom:6px;border-radius:8px;background:${i.urgent?'#FFF0F0':'#FFFBEA'};border:.5px solid ${i.urgent?'#F09595':'#F9CB42'}">
        <div style="display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600">

          <span style="color:${i.urgent?'var(--red)':'var(--amb)'}">${i.type}</span>
          <span style="font-weight:400;color:var(--txt)">— ${i.sop}</span>
        </div>
        ${i.note?`<div style="font-size:11px;color:var(--mut);margin-top:4px;padding-left:22px;font-style:italic">"${i.note}"</div>`:''}
      </div>`).join('')}
  </div>`;
}

function getMgmtInterventions(cohort){
  // Returns list of skills uncleared for 2+ consecutive days
  const flags=[];
  const day=cohort.currentDay||1;
  const stage=getStageForDay(day);
  const sops=D.STAGE_SOPS[stage.id]||[];

  sops.forEach(sopId=>{
    const sop=D.SOP[sopId];if(!sop)return;
    // Check consecutive uncleared days within current stage
    const stageDays=stage.days.filter(d=>d<=day);
    if(stageDays.length<2)return;
    let consecutiveUncleared=0;
    let lastTwo=stageDays.slice(-2);
    lastTwo.forEach(d=>{
      const mr=getReport(cohort.id,'mentor',d);
      const tr=getReport(cohort.id,'mentee',d);
      if(!mr||!tr)return;
      const mskI=mr?.skills?.[sopId]||[false];
      const tskI=tr?.skills?.[sopId]||[false];
      const mProbe=mr?.probes?.[sopId]||'';
      const tProbe=tr?.probes?.[sopId]||'';
      // Bad probes: poor/major/significant/notexecuted/dependent/skipped/help/struggled
      const badProbes=['poor','major','significant','notexecuted','dependent','skipped','help','struggled'];
      const mBad=badProbes.includes(mProbe)||!mskI[0];
      const tBad=badProbes.includes(tProbe)||!tskI[0];
      if(mBad||tBad)consecutiveUncleared++;
    });
    if(consecutiveUncleared>=2){
      flags.push({sopId,name:sop.name,icon:sop.icon,stage:stage.id,days:lastTwo});
    }
  });

  // Also check for Mentor-flagged MGMT items
  const mentorFlags=[];
  ALL_DAYS.filter(d=>d<=day).forEach(d=>{
    const mr=getReport(cohort.id,'mentor',d);
    if(mr?.mgmtFlag&&mr.mgmtFlag.trim()){
      mentorFlags.push({day:d,flag:mr.mgmtFlag,time:mr.submitTime});
    }
  });

  return{skillFlags:flags,mentorFlags};
}

      ${alerts.map(a=>`<div class="alert ${a.type==='skill'?'alert-red':a.type==='mgmt'?'alert-amb':'alert-amb'}" style="margin-bottom:5px">${a.msg}</div>`).join('')}

function renderMgmtActionItems(active){
  const items=[];
  active.forEach(c=>{
    const d=c.currentDay||1;const stage=getStageForDay(d);
    const mr=getReport(c.id,'mentor',d);const tr=getReport(c.id,'mentee',d);
    // Advance readiness
    if(mr?.advanceReady==='yes')items.push({icon:'🚀',type:'Ready to advance',cohort:c.menteeName,note:`Mentor says ${c.menteeName} is ready for next stage. Review and advance when ready.`,urgent:false,action:()=>goPage('mgmt')});
    if(mr?.advanceReady==='no')items.push({icon:'⏸️',type:'Not ready to advance',cohort:c.menteeName,note:`Mentor says ${c.menteeName} needs more time in current stage.`,urgent:false,action:null});
    // MGMT flag from mentor
    if(mr?.mgmtFlag)items.push({icon:'🚨',type:'Mentor requests MGMT intervention',cohort:c.menteeName,note:mr.mgmtFlag,urgent:true,action:null});
    // SOP re-demo flags from mentor assessment
    const sops=D.STAGE_SOPS[stage.id]||[];
    sops.forEach(sopId=>{
      const sop=D.SOP[sopId];if(!sop)return;
      const pv=mr?.probes?.[sopId]||'';
      if(pv==='poor'||pv==='major')items.push({icon:'🔴',type:'SOP needs re-demo',cohort:c.menteeName,note:`${sop.icon} ${sop.name} — Mentor flagged for re-demo`,urgent:true,action:null});
    });
    // Missing reports
    if(!mr&&!tr)items.push({icon:'📋',type:'No reports submitted today',cohort:c.menteeName,note:`Day ${d} — neither Mentor nor New Teacher has submitted.`,urgent:false,action:null});
  });
  if(!active.length||!items.length)return'';
  const urgent=items.filter(i=>i.urgent);const normal=items.filter(i=>!i.urgent);
  return`<div class="card" style="border-left:3px solid ${urgent.length?'var(--red)':'var(--gold)'}">

      ${i.note?`<div style="font-size:11px;color:var(--mut);margin-top:4px;padding-left:22px;font-style:italic">"${i.note}"</div>`:''}
    </div>`).join('')}

function renderSkillConfirm(cohort,role,day,stage,existing){

  let html=`<div style="margin-bottom:14px">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
      <div style="font-size:12px;font-weight:700">🎯 技能确认 — 第 ${stage.id} 阶段 ${meta.label}</div>
      <span class="chip chip-blue">${roleLabel}</span>
    </div>
    ${meta.risk?`<div style="font-size:10px;color:var(--mut);margin-bottom:10px;font-style:italic">Risk this stage: ${meta.risk}</div>`:'<div style="margin-bottom:10px"></div>'}`;

  sops.forEach(sopId=>{
    const sop=D.SOP[sopId];if(!sop)return;
    const checked=sk[sopId]?.[0]===true;
    const probeVal=probes[sopId]||'';
    const noteVal=notes[sopId]||'';
    const selOpt=cfg.options.find(o=>o.val===probeVal);
    const borderCol=probeVal===''?'var(--bdr)':selOpt?.val==='correct'||selOpt?.val==='clear'||selOpt?.val==='absolute'||selOpt?.val==='executed'||selOpt?.val==='full'||selOpt?.val==='exact'||selOpt?.val==='yes'||selOpt?.val==='smooth'?'#9FE1CB':selOpt?.requireNote&&!selOpt?.warn?.includes('MGMT')?'#F9CB42':'#F09595';

    html+=`<div style="border:.5px solid ${borderCol};border-radius:8px;padding:11px;margin-bottom:9px;background:var(--sur)">
      <div style="display:flex;align-items:center;gap:7px;margin-bottom:9px">
        <span style="font-size:16px">${sop.icon}</span>
        <span style="font-weight:600;font-size:12px">${sop.name}</span>
        <span style="font-size:9px;color:var(--mut);margin-left:auto">${sop.when}</span>
      </div>

      <!-- Step 1: Checkbox -->
      <div style="display:flex;align-items:flex-start;gap:8px;padding-bottom:9px;border-bottom:.5px solid var(--bdr);margin-bottom:9px">
        <input type="checkbox" id="${skillKey(cohort.id,role,day,sopId,0)}" ${checked?'checked':''}
          style="margin-top:2px;width:15px;height:15px;accent-color:var(--grn);flex-shrink:0;cursor:pointer"
          onchange="onSkillCheck('${cohort.id}','${role}',${day},'${sopId}',this.checked)">
        <label for="${skillKey(cohort.id,role,day,sopId,0)}" style="font-size:12px;font-weight:500;cursor:pointer;color:${checked?'var(--grn)':'var(--txt)'}">${cfg.check}</label>
      </div>

      <!-- Step 2: Understanding Probe (radio) -->
      <div style="font-size:11px;font-weight:600;color:var(--mut);margin-bottom:7px">${cfg.probe}</div>
      <div style="display:flex;flex-direction:column;gap:5px">
      ${cfg.options.map(opt=>`
        <label style="display:flex;align-items:flex-start;gap:8px;cursor:pointer;padding:6px 8px;border-radius:6px;border:.5px solid ${probeVal===opt.val?borderCol:'var(--bdr)'};background:${probeVal===opt.val?'var(--sur2)':'transparent'};transition:all .15s">
          <input type="radio" name="${skillProbeKey(cohort.id,role,day,sopId)}" value="${opt.val}" ${probeVal===opt.val?'checked':''}
            style="margin-top:1px;flex-shrink:0;cursor:pointer;accent-color:var(--acc)"
            onchange="onProbeChange('${cohort.id}','${role}',${day},'${sopId}','${opt.val}')">

        </label>`).join('')}

        ${renderProbeExtra(cohort.id,role,day,sopId,probeVal,noteVal,cfg)}

    </div>`;
  });

  html+=`</div>`;
  return html;
}

function renderProbeExtra(cid,role,day,sopId,probeVal,noteVal,cfg){
  if(!probeVal)return'';
  const opt=cfg.options.find(o=>o.val===probeVal);
  if(!opt)return'';
  let html='';
  if(opt.warn){
    const isRed=opt.warn.includes('MGMT')||opt.warn.includes('CRITICAL')||opt.warn.includes('escalat')||opt.warn.includes('flagged');
    html+=`<div style="margin-top:8px;padding:7px 10px;border-radius:6px;background:${isRed?'#FCEBEB':'#FFF8E1'};border:.5px solid ${isRed?'#F09595':'#F9CB42'};font-size:11px;color:${isRed?'#7a1f1f':'#7a4500'};line-height:1.5">${opt.warn}</div>`;
  }
  if(opt.requireNote){
    html+=`<div style="margin-top:8px">
      <textarea id="${skillNoteKey(cid,role,day,sopId)}" rows="2" placeholder="${opt.notePlaceholder||'请描述…'}"
        style="width:100%;border:.5px solid var(--bdr);border-radius:6px;padding:7px;font-family:inherit;font-size:11px;resize:vertical;background:var(--sur)"
        oninput="saveNoteTemp('${cid}','${role}',${day},'${sopId}',this.value)">${noteVal}</textarea>
    </div>`;
  }
  return html;
}

function collectSkillData(cid,role,day){
  const stage=getStageForDay(day);
  const sops=D.STAGE_SOPS[stage.id]||[];
  const cfg=D.SKILL_STAGES[stage.id]?.[role];
  const skills={},probes={},notes={};
  sops.forEach(sopId=>{
    const cb=document.getElementById(skillKey(cid,role,day,sopId,0));
    skills[sopId]=[cb?cb.checked:false];
    const radios=document.querySelectorAll(`input[name="${skillProbeKey(cid,role,day,sopId)}"]:checked`);
    probes[sopId]=radios.length?radios[0].value:'';
    const ta=document.getElementById(skillNoteKey(cid,role,day,sopId));
    notes[sopId]=ta?ta.value.trim():'';
  });
  return{skills,probes,notes};
}

// ── 草稿自动上云：停止打字 1.2 秒存一次 ──────────────────────
let _draftT=null;
function scheduleDraft(uid,role,day,dept){
  clearTimeout(_draftT);
  _draftT=setTimeout(()=>saveDraft(uid,role,day,dept),1200);
}
async function saveDraft(uid,role,day,dept){
  const rpt=collectReport(uid,role,day,dept);
  if(!rpt)return;
  rpt.state='draft';
  await saveReport(rpt,'draft');
  const f=document.getElementById('savedFlash');
  if(f){f.textContent='已储存 '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
        f.style.opacity='1';setTimeout(()=>f.style.opacity='0',1600);}
}
function collectReport(uid,role,day,dept){
  const g=id=>document.getElementById(id)?.value||'';
  const existing=getReport(uid,role,day,dept)||{};
  return Object.assign({},existing,{
    id:existing.id||('rpt_'+Date.now()+'_'+Math.random().toString(36).slice(2,6)),
    planUid:uid, dept:dept||S.dept, role:role, day:day,
    summary:g('rpt_summary'), misc:g('rpt_misc'),
    questions:g('rpt_questions'), mgmtFlag:g('rpt_mgmt_flag'),
    skills:existing.skills||{}, probes:existing.probes||{}, notes:existing.notes||{}
  });
}

async function submitReport(cid,role,day){
  if(!cid){alert('⚠️ No cohort found. Please wait for data to load, then try again.');return;}
  const good=document.getElementById('rpt_good')?.value.trim();
  if(!good){alert('请先填「今天哪里做得好」。');return;}
  const stage=getStageForDay(day);
  const sops=D.STAGE_SOPS[stage.id]||[];
  const qs=D.SKILL_STAGES[stage.id]?.[role]||[];

  // Collect skill confirmations + probes + notes
  const{skills,probes,notes}=collectSkillData(cid,role,day);

  const rpt={id:genId('rpt'),cohortId:cid,role,day,good,skills,probes,notes,
    improve:document.getElementById('rpt_improve')?.value.trim()||'',
    misc:document.getElementById('rpt_misc')?.value.trim()||'',
    submitTime:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),
    submitDate:getTodayISO(),
    tasksChecked:countChecked(cid,role,day),totalTasks:((D.TASKS[role]||{})[day]||[]).length,
  };
  if(role==='mentor'){
    rpt.advanceReady=document.getElementById('rpt_advance')?.value||'';
    rpt.mgmtFlag=document.getElementById('rpt_mgmt_flag')?.value.trim()||'';
  }else{
    rpt.questions=document.getElementById('rpt_questions')?.value.trim()||'';
  }
  // Save to Firebase first — must succeed before we show success
  try{
    const old=S.reports.find(r=>r.planUid===cid&&r.role===role&&r.day===day);
    if(old)await deleteReportFb(old.id).catch(()=>{});
    await saveReport(rpt);
  }catch(e){
    alert('⚠️ Failed to save to cloud. Check your internet and try again.\n\n'+e.message);
    return;
  }
  // Update local state after confirmed Firebase save
  S.reports=S.reports.filter(r=>!(r.planUid===cid&&r.role===role&&r.day===day));
  S.reports.push(rpt);
  renderReport();
  alert(`✅ Day ${day} report submitted and saved to cloud!`);
}

async function deleteReport(cid,role,day){
  if(!confirm('删掉这份日报重填？'))return;
  const rpt=S.reports.find(r=>r.planUid===cid&&r.role===role&&r.day===day);
  if(rpt)await deleteReportFb(rpt.id);
  renderReport();
}

function renderCohortRptDetail(cohort){
  const el=document.getElementById('cohort-rpt-detail');if(!el)return;
  const day=cohort.currentDay||1;const stage=getStageForDay(day);
  const mr=getReport(cohort.id,'mentor',day);const tr=getReport(cohort.id,'mentee',day);

  let html=`<div class="itab-row">`;
  ALL_DAYS.filter(d=>d<=day).forEach(d=>{
    const mr2=getReport(cohort.id,'mentor',d);const tr2=getReport(cohort.id,'mentee',d);
    const both=mr2&&tr2;
    html+=`<button class="itab ${d===day?'on':''}" onclick="viewRptDay('${cohort.id}',${d})">${getDayLabel(d)} ${both?'✅':mr2||tr2?'⏳':'⬜'}</button>`;
  });
  html+=`</div>`;
  html+=`<div style="font-size:11px;color:var(--mut);margin-bottom:10px">第 ${day} 个训练日 · 第 ${stage.id} 阶段 ${stage.nameZh} · ${cohort.menteeName}</div>`;

  // ── SKILL CONFIRMATION MATRIX ──
  const sops=D.STAGE_SOPS[stage.id]||[];
  if(sops.length&&(mr||tr)){
    html+=`<div class="card" style="margin-bottom:10px">
      <div class="card-hdr"><span class="card-title">🎯 技能确认表 — 第 ${stage.id} 阶段</span><span style="font-size:10px;color:var(--mut)">管理层总览</span></div>
      <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:11px">
        <thead><tr style="background:var(--sur2)">
          <th style="padding:7px 10px;text-align:left;border-bottom:.5px solid var(--bdr)">SOP 项目</th>
          <th style="padding:7px 10px;text-align:center;border-bottom:.5px solid var(--bdr);color:#185FA5">👨‍🏫 Mentor<br><span style="font-weight:400;font-size:9px">教过 ✓ ｜ 确认过 ✓</span></th>
          <th style="padding:7px 10px;text-align:center;border-bottom:.5px solid var(--bdr);color:#0F6E56">🎓 新老师<br><span style="font-weight:400;font-size:9px">学过 ✓ ｜ 练过 ✓</span></th>
          <th style="padding:7px 10px;text-align:center;border-bottom:.5px solid var(--bdr)">状态</th>
        </tr></thead><tbody>`;

    sops.forEach((sopId,i)=>{
      const sop=D.SOP[sopId];if(!sop)return;
      const msk=mr?.skills?.[sopId]||[false,false];
      const tsk=tr?.skills?.[sopId]||[false,false];
      const mskV=mr?.skills?.[sopId]||[false];const tskV=tr?.skills?.[sopId]||[false];
      const mProbeV=mr?.probes?.[sopId]||'';const tProbeV=tr?.probes?.[sopId]||'';
      const goodP=['correct','clear','absolute','executed','full','yes','smooth','exact'];
      const badP=['poor','major','significant','notexecuted','dependent','skipped','help','struggled'];
      const mGood=mskV[0]&&goodP.includes(mProbeV);
      const tGood=tskV[0]&&goodP.includes(tProbeV);
      const mBadFlag=badP.includes(mProbeV);const tBadFlag=badP.includes(tProbeV);
      const bothFull=mGood&&tGood;
      const noData=!mr&&!tr;
      const statusCls=bothFull?'chip-grn':mBadFlag||tBadFlag?'chip-red':(!mr||!tr)?'chip-amb':'chip-amb';
      const statusTxt=bothFull?'✅ Cleared':noData?'⬜ No data':(!mr||!tr)?'⏳ Pending':mBadFlag?'🔴 Mentor flagged issue':tBadFlag?'🔴 NT flagged issue':'⚠️ Incomplete';
      // MGMT flag
      const hasMgmtFlag=mr?.mgmtFlag&&mr.mgmtFlag.trim();

      html+=`<tr style="${i%2===0?'':'background:var(--sur2)'}">
        <td style="padding:7px 10px">
          <div style="display:flex;align-items:center;gap:6px">
            <span>${sop.icon}</span>
            <div><div style="font-weight:600">${sop.name}</div><div style="font-size:9px;color:var(--mut)">${sop.when}</div></div>
          </div>
        </td>
        <td style="padding:7px 10px;text-align:center">
          ${mr?(()=>{
            const msk2=mr?.skills?.[sopId]||[false];
            const mp=mr?.probes?.[sopId]||'';
            const mn=mr?.notes?.[sopId]||'';
            const cfg2=D.SKILL_STAGES[stage.id]?.mentor;
            const opt2=cfg2?.options?.find(o=>o.val===mp);
            const good2=['correct','clear','absolute','executed','full'].includes(mp);
            return`<div style="font-size:10px"><span style="color:${msk2[0]?'var(--grn)':'var(--red)'}">${msk2[0]?'✅':'⬜'}</span> ${cfg2?.check||''}</div>
              ${mp?`<div style="margin-top:3px;font-size:10px;padding:3px 6px;border-radius:4px;background:${good2?'#E1F5EE':'#FCEBEB'};color:${good2?'var(--grn)':'var(--red)'}">${opt2?.label||mp}</div>`:''}
              ${mn?`<div style="margin-top:2px;font-size:9px;color:var(--mut);font-style:italic">"${mn.slice(0,60)}${mn.length>60?'…':''}"</div>`:''}`;
          })():'<span style="color:var(--hint)">—</span>'}
        </td>
        <td style="padding:7px 10px;text-align:center">
          ${tr?(()=>{
            const tsk2=tr?.skills?.[sopId]||[false];
            const tp=tr?.probes?.[sopId]||'';
            const tn=tr?.notes?.[sopId]||'';
            const cfg3=D.SKILL_STAGES[stage.id]?.mentee;
            const opt3=cfg3?.options?.find(o=>o.val===tp);
            const good3=['yes','smooth','exact','full'].includes(tp);
            return`<div style="font-size:10px"><span style="color:${tsk2[0]?'var(--grn)':'var(--red)'}">${tsk2[0]?'✅':'⬜'}</span> ${cfg3?.check||''}</div>
              ${tp?`<div style="margin-top:3px;font-size:10px;padding:3px 6px;border-radius:4px;background:${good3?'#E1F5EE':'#FCEBEB'};color:${good3?'var(--grn)':'var(--red)'}">${opt3?.label||tp}</div>`:''}
              ${tn?`<div style="margin-top:2px;font-size:9px;color:var(--mut);font-style:italic">"${tn.slice(0,60)}${tn.length>60?'…':''}"</div>`:''}`;
          })():'<span style="color:var(--hint)">—</span>'}
        </td>
        <td style="padding:7px 10px;text-align:center">
          <span class="chip ${statusCls}">${statusTxt}</span>
          ${hasMgmtFlag&&sops.indexOf(sopId)===0?`<div style="margin-top:4px;font-size:9px;color:var(--amb)">⚠️ MGMT flagged</div>`:''}
        </td>
      </tr>`;
    });
    html+=`</tbody></table></div>`;

    // MGMT flag from mentor
    if(mr?.mgmtFlag){
      html+=`<div class="alert alert-amb" style="margin-top:10px"><strong>⚠️ Mentor flagged for MGMT:</strong> ${mr.mgmtFlag}</div>`;
    }
    html+=`</div>`;
  }

  // ── SIDE BY SIDE REPORTS ──
  html+=`<div class="grid2">`;
  html+=`<div class="card"><div class="card-hdr"><span class="card-title">👨‍🏫 Mentor</span>${mr?`<span class="chip chip-grn">✅ ${mr.submitTime}</span>`:'<span class="chip chip-red">未交</span>'}</div>`;
  if(mr){html+=renderRptBody(mr,'mentor');if(mr.advanceReady){const cls=mr.advanceReady==='yes'?'alert-grn':mr.advanceReady==='no'?'alert-red':'alert-amb';const lbl=mr.advanceReady==='yes'?'✅ Ready to advance':mr.advanceReady==='no'?'❌ Not ready':'⏳ Needs more time';html+=`<div class="alert ${cls}" style="margin-top:8px">${lbl}</div>`;}}
  else{html+=`<div style="color:var(--mut);font-size:12px;padding:10px 0">还没交</div>`;}
  html+=`</div>`;
  html+=`<div class="card"><div class="card-hdr"><span class="card-title">🎓 新老师</span>${tr?`<span class="chip chip-grn">✅ ${tr.submitTime}</span>`:'<span class="chip chip-red">未交</span>'}</div>`;
  if(tr)html+=renderRptBody(tr,'mentee');else html+=`<div style="color:var(--mut);font-size:12px;padding:10px 0">还没交</div>`;
  html+=`</div></div>`;

  const canAdvance=mr?.advanceReady==='yes'&&tr&&day<14;
  const nextDay=ALL_DAYS[ALL_DAYS.indexOf(day)+1];
  if(canAdvance&&nextDay){
    // Check if any skills are not cleared
    const sopsToCheck=D.STAGE_SOPS[stage.id]||[];
    const unclearedSops=sopsToCheck.filter(sopId=>{
      const mskP=mr?.skills?.[sopId]||[false];const tskP=tr?.skills?.[sopId]||[false];
      return!(mskP.every(v=>v)&&tskP.every(v=>v));
    });
    html+=`<div class="card" style="border-color:var(--grn);background:#E1F5EE">
      <div class="card-title" style="color:var(--grn);margin-bottom:6px">⭐ Mentor 建议前进到第 ${nextDay}</div>
      ${unclearedSops.length?`<div class="alert alert-amb" style="margin-bottom:8px">⚠️ ${unclearedSops.length} skill(s) not fully confirmed: ${unclearedSops.map(id=>D.SOP[id]?.name||id).join(', ')}</div>`:'<div style="font-size:11px;margin-bottom:8px">✅ All skills confirmed by both parties.</div>'}
      <button class="btn btn-grn" onclick="advanceDay('${cohort.id}')">✅ Confirm — Advance to Day ${nextDay}</button>
    </div>`;
  }
  el.innerHTML=html;
}

function renderRptBody(r,role){
  let h=`<div style="font-size:12px;line-height:1.7">`;
  if(r.tasksChecked!==undefined)h+=`<div style="margin-bottom:6px"><span class="chip chip-blue">Tasks ${r.tasksChecked}/${r.totalTasks}</span></div>`;
  if(r.good)h+=`<div><strong>✅</strong> ${r.good}</div>`;
  if(r.improve)h+=`<div><strong>🔧</strong> ${r.improve}</div>`;
  if(r.learn)h+=`<div><strong>📖</strong> ${r.learn}</div>`;
  if(r.questions)h+=`<div style="color:var(--amb)"><strong>❓</strong> ${r.questions}</div>`;
  if(r.misc)h+=`<div style="color:var(--red)"><strong>⚠️</strong> ${r.misc}</div>`;
  if(role==='mentor'&&r.ratings){
    h+=`<div style="margin-top:6px;font-size:10px">`;
    Object.entries(r.ratings).forEach(([k,v])=>{if(v)h+=`<div>${k.replace(/_/g,' ')}: ${'⭐'.repeat(parseInt(v)||0)}</div>`;});
    h+=`</div>`;
  }
  h+=`</div>`;return h;
}

function viewRptDay(cohortId,day){
  const cohort=getCohort(cohortId);if(!cohort)return;
  const saved=cohort.currentDay;cohort.currentDay=day;
  renderCohortRptDetail(cohort);cohort.currentDay=saved;
}

async function advanceDay(planUid,dept){
  const p=getPlan(planUid); if(!p)return;
  const dp=dept||S.dept;
  const pd=(p.depts||[]).find(x=>x.dept===dp); if(!pd)return;
  const day=pd.currentDay||1;
  const idx=TRAIN_DAYS.indexOf(day);
  if(idx<TRAIN_DAYS.length-1){
    pd.currentDay=TRAIN_DAYS[idx+1];
    await savePlanDept(p.uid,dp,pd.currentDay,'active');
    await reloadAll();
    alert(`✅ ${dp} 前进到${dayLabel(pd.currentDay)}`);
  }else{
    pd.status='completed';
    await savePlanDept(p.uid,dp,day,'completed');
    await reloadAll();
    const allDone=(getPlan(p.uid).depts||[]).every(x=>x.status==='completed');
    alert(allDone?'🎉 所有部门都跑完了。接下来由放行人决定能不能独立带班。':`✅ ${dp} 跑完了。其他部门还在进行。`);
  }
}

async function openAdvanceModal(planUid,dept){
  const p=getPlan(planUid); if(!p)return;
  const dp=dept||S.dept;
  const pd=(p.depts||[]).find(x=>x.dept===dp); if(!pd)return;
  const day=pd.currentDay||1;
  const idx=TRAIN_DAYS.indexOf(day);
  const next=TRAIN_DAYS[idx+1];
  const mr=getReport(p.uid,'mentor',day,dp), tr=getReport(p.uid,'mentee',day,dp);
  const msg=next
    ? `${p.teacherName} · ${dp}\n${dayLabel(day)} → ${dayLabel(next)}？\n\nMentor 日报：${mr?'✅ 已交':'⚠️ 还没交'}\n新老师日报：${tr?'✅ 已交':'⚠️ 还没交'}\n\n继续？`
    : `${p.teacherName} · ${dp}\n这是最后一天。标记这个部门跑完？`;
  if(confirm(msg)) await advanceDay(p.uid,dp);
}

        <th style="padding:6px 9px;border-bottom:.5px solid var(--bdr);text-align:center">Mentor 的任务</th>

function renderTrainingChart(cohort){
  const day=cohort.currentDay||1;
  // Stage colour palette
  const stagePal={
    1:{bg:'#E8F0FE',border:'#7BA7F5',txt:'#1a4490',label:'Establishing Basics',icon:'👁'},
    2:{bg:'#E6F4EA',border:'#7BC99A',txt:'#0d5c2e',label:'Co-Teaching',icon:'🤝'},
    3:{bg:'#FEF7E0',border:'#F5C842',txt:'#6b4500',label:'Mirror Teaching',icon:'🪞'},
    4:{bg:'#FCE8E6',border:'#F28B82',txt:'#7a1f1f',label:'Independent Teaching',icon:'🎯'},
    5:{bg:'#F3E8FD',border:'#C58AF9',txt:'#4a1070',label:'Full Independence',icon:'⭐'},
  };
  const weeks=[
    {label:'Week 1',days:[1,2,3,4]},
    {label:'Week 2',days:[6,7,8,9]},
    {label:'Week 3',days:[11,12,13,14]},
  ];

  // Build grid HTML
  let grid=`
  <div style="margin-top:18px">
    <div style="font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px">训练进度图</div>
    <div style="overflow-x:auto">
    <table style="border-collapse:separate;border-spacing:4px;width:100%;min-width:520px">
      <thead>
        <tr>
          <td style="width:120px"></td>
          ${weeks.map(w=>`<td colspan="${w.days.length}" style="text-align:center;font-size:10px;font-weight:700;color:var(--mut);padding-bottom:4px;text-transform:uppercase;letter-spacing:.06em">${w.label}</td>`).join('')}
        </tr>
        <tr>
          <td style="font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;padding-right:8px">阶段</td>
          ${weeks.flatMap(w=>w.days).map(d=>{
            const isCurrent=d===day;const isFuture=d>day;
            return`<td style="text-align:center;font-size:9px;font-weight:${isCurrent?'700':'400'};color:${isCurrent?'var(--acc)':isFuture?'var(--hint)':'var(--mut)'};padding-bottom:2px">${getDayLabel(d)}</td>`;
          }).join('')}
        </tr>
      </thead>
      <tbody>`;

  D.STAGES.forEach(stage=>{
    const pal=stagePal[stage.id];
    const allDaysCols=weeks.flatMap(w=>w.days);
    grid+=`<tr>
      <td style="padding:3px 8px 3px 0;vertical-align:middle">
        <div style="font-size:10px;font-weight:700;color:${pal.txt}">${pal.icon} S${stage.id}</div>
        <div style="font-size:9px;color:var(--mut);line-height:1.3">${pal.label}</div>
      </td>`;

    allDaysCols.forEach(d=>{
      const isStagDay=stage.days.includes(d);
      const isCurrent=d===day;
      const isFuture=d>day;
      const mr=getReport(cohort.id,'mentor',d);
      const tr2=getReport(cohort.id,'mentee',d);

      if(!isStagDay){
        grid+=`<td style="background:var(--sur2);border-radius:6px;height:38px"></td>`;
      } else {
        let cellBg=isFuture?'#f5f4f0':pal.bg;
        let cellBorder=isCurrent?`2px solid var(--acc)`:`.5px solid ${pal.border}`;
        let inner='';
        if(isCurrent){
          inner=`<div style="font-size:9px;font-weight:700;color:var(--acc)">今天</div>`;
        } else if(!isFuture){
          const done=mr&&tr2;const partial=mr||tr2;
          inner=`<div style="font-size:12px">${done?'✅':partial?'⏳':'⬜'}</div>`;
        } else {
          inner=`<div style="font-size:9px;color:var(--hint)">—</div>`;
        }
        grid+=`<td style="background:${cellBg};border:${cellBorder};border-radius:6px;height:38px;text-align:center;vertical-align:middle;transition:all .2s">${inner}</td>`;
      }
    });
    grid+=`</tr>`;
  });

  grid+=`</tbody></table>
    </div>
    <!-- Legend -->
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px">
      <span style="font-size:10px;color:var(--mut)">说明：</span>
      <span style="font-size:10px">✅ 两份日报都交了</span>
      <span style="font-size:10px">⏳ 还差一份</span>
      <span style="font-size:10px">⬜ 都还没交</span>
      <span style="font-size:10px;font-weight:600;color:var(--acc)">蓝色 = 今天</span>
    </div>
  </div>`;
  return grid;
}

function renderSopLibrary(){
  const el=document.getElementById('sop-content');

  const CAT_META=_RD==='ATC'?{
    daily: {label:'Every Day',          icon:'🔄',color:'#0F6E56',bg:'#E8F7F2',border:'#9FE1CB'},
    hw:    {label:'功课班 Homework Class',icon:'📓',color:'#185FA5',bg:'#EEF5FF',border:'#AABDD4'},
    class: {label:'课辅班 Tutorial Class',icon:'📚',color:'#6B3FA0',bg:'#F4F0FF',border:'#C5B3F5'},
    record:{label:'课后记录 After Class', icon:'📝',color:'#854F0B',bg:'#FFF8E1',border:'#F9CB42'},
    alert: {label:'上报 Escalation',      icon:'⚡',color:'#A32D2D',bg:'#FCEBEB',border:'#F09595'},
  }:{
    morning:{label:'Before Class',icon:'🌅',color:'#0F6E56',bg:'#E8F7F2',border:'#9FE1CB'},
    monday: {label:'Monday Only', icon:'📅',color:'#854F0B',bg:'#FFF8E1',border:'#F9CB42'},
    daily:  {label:'Every Day',   icon:'🔄',color:'#185FA5',bg:'#EEF5FF',border:'#AABDD4'},
    teaching:{label:'Teaching Activities',icon:'📚',color:'#5B35C4',bg:'#F4F0FF',border:'#C5B3F5'},
    closing:{label:'Closing',     icon:'🌱',color:'#0F6E56',bg:'#E8F7F2',border:'#9FE1CB'},
    end:    {label:'End of Day',  icon:'🏡',color:'#A32D2D',bg:'#FCEBEB',border:'#F09595'},
  };

  // Group SOPs by cat
  const groups={};
  D.SOP_LIST.forEach(s=>{
    if(!groups[s.cat])groups[s.cat]=[];
    groups[s.cat].push(s);
  });

  let html=`<div style="margin-bottom:12px">
    <div class="card-title">📖 SOP 内容库 <span class="chip chip-blue">${deptShort(_RD)}</span></div>
    <div style="font-size:11px;color:var(--mut);margin:3px 0 8px">点任何一步看完整流程${_RD==='SRK'?' + JR / IN / SR approach':' + ATC 1–2 / 3–6 approach'}</div>
    <div style="display:flex;gap:5px;flex-wrap:wrap">${Object.keys(DEPT_CFG).map(k=>
      `<button class="btn btn-sm ${_RD===k?'btn-pri':''}" onclick="setRD('${k}');renderSopLibrary()">${k}</button>`).join('')}</div>
  </div>`;

  Object.keys(CAT_META).forEach(cat=>{
    const items=groups[cat];if(!items||!items.length)return;
    const m=CAT_META[cat];
    html+=`
    <!-- ── ${m.label} ── -->
    <div style="border:.5px solid ${m.border};border-radius:12px;overflow:hidden;margin-bottom:14px">
      <!-- Category header band -->
      <div style="background:${m.bg};padding:10px 16px;border-bottom:.5px solid ${m.border};display:flex;align-items:center;gap:8px">
        <span style="font-size:18px">${m.icon}</span>
        <span style="font-size:12px;font-weight:800;color:${m.color};text-transform:uppercase;letter-spacing:.07em">${m.label}</span>
        <span style="margin-left:auto;font-size:10px;color:${m.color};opacity:.7">${items.length} step${items.length>1?'s':''}</span>
      </div>
      <!-- Grid of SOP cards -->
      <div style="display:grid;grid-template-columns:1fr;gap:0">
        ${items.map((sop,i)=>{
          const fullWidth=false;
          const br='';
          const bb=i<items.length-1?'border-bottom:.5px solid '+m.border+';':'';
          const stepCount=sop.stepGroups?.reduce((a,g)=>a+g.steps.length,0)||sop.steps?.length||sop.timeline?.reduce((a,b)=>a+b.items.length,0)||0;
          return`<div onclick="openSopModal('${sop.id}')"
            style="padding:14px 16px;cursor:pointer;background:var(--sur);transition:background .15s;${fullWidth?'grid-column:1/-1;':''}${br}${bb}"
            onmouseover="this.style.background='${m.bg}'" onmouseout="this.style.background='var(--sur)'">
            <div style="display:flex;align-items:flex-start;gap:10px">
              <span style="font-size:26px;flex-shrink:0;line-height:1">${sop.icon}</span>
              <div style="flex:1;min-width:0">
                <div style="font-weight:700;font-size:13px;margin-bottom:2px">${sop.n}. ${sop.name}</div>
                <div style="font-size:11px;color:var(--mut);margin-bottom:6px">${sop.nameZh}</div>
                <div style="display:flex;align-items:center;gap:6px">
                  <span style="font-size:9px;background:${m.bg};color:${m.color};border:.5px solid ${m.border};padding:2px 7px;border-radius:8px;font-weight:600">${sop.when}</span>
                  <span style="font-size:10px;color:var(--hint)">${stepCount} step${stepCount!==1?'s':''}</span>
                  <span style="font-size:10px;color:${m.color};margin-left:auto">点开看 →</span>
                </div>
              </div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  });

  // Core Principles card at bottom
  html+=`<div class="card" style="background:var(--sur2)">
    <div class="card-title" style="margin-bottom:8px">🔑 核心原则</div>
    <div style="font-size:12px;line-height:1.8">
      <div style="margin-bottom:6px"><strong>Gentle but Firm</strong></div>
      <div>✅ Rules over emotions — use rules, not mood, to manage students</div>
      <div>✅ Address behaviour, not person — correct what they DID, not who they ARE</div>
      <div>✅ Be consistent — same standard every day, for every student</div>
    </div>
    <div style="margin-top:10px;padding:9px;background:#FCEBEB;border-radius:6px">
      <div style="font-size:11px;font-weight:600;color:var(--red);margin-bottom:5px">🚫 Teacher Red Lines (NEVER do)</div>
      <div style="font-size:11px;color:#7a1f1f;line-height:1.8">
        ❌ No shouting, table-banging, throwing things<br>
        ❌ No sarcasm or mockery<br>
        ❌ No personal attacks or labelling students<br>
        ❌ No bringing up past mistakes<br>
        ❌ No public humiliation<br>
        ❌ No different treatment based on your mood
      </div>
    </div>
  </div>`;

  el.innerHTML=html;
}

// ══════════════════════════════════════════════════════════════
// 新老师首页：三层（今天一件 / 这一週 / 整份计划点开看）
// ══════════════════════════════════════════════════════════════
function renderMenteeHome(){
  const el=document.getElementById('dashboard-content');
  const p=getPlan();
  if(!p){el.innerHTML=`<div class="card" style="text-align:center;padding:36px">
    <div style="font-size:30px;margin-bottom:10px">🎓</div>
    <div style="font-weight:600;margin-bottom:5px">还没有训练计划</div>
    <div style="color:var(--mut);font-size:12px">请管理层先帮你建立。</div></div>`;return;}

  const iso=todayISO();
  const blocks=todayDeptTasks(p);
  const onDuty=deptsOnDay(p.teacherCode,iso);

  // ── 第一层：今天这一件 ──
  let first=null, firstDept=null, firstDay=null;
  for(const b of blocks){
    if(b.rest)continue;
    const t=b.tasks.find(x=>!S.taskChecks[checkKey(p.uid,b.dept,'mentee',b.day,x.id)]);
    if(t){first=t;firstDept=b.dept;firstDay=b.day;break;}
  }
  const restToday=blocks.length&&blocks.every(b=>b.rest);

  let h='';
  if(restToday){
    h+=`<div class="card" style="border:2px solid var(--gold)">
      <div style="font-size:11px;font-weight:700;color:var(--gold);letter-spacing:.6px">今天是整理日</div>
      <div style="font-size:19px;font-weight:700;margin:8px 0 4px">整理自己，补弱的地方</div>
      <div style="font-size:12px;color:var(--mut)">把这一週学的东西过一遍。管理层可能会派任务给你。</div>
    </div>`;
  }else if(first){
    h+=`<div class="card" style="border:2px solid var(--acc)">
      <div style="font-size:11px;font-weight:700;color:var(--acc);letter-spacing:.6px">今天做这一步</div>
      <div style="font-size:19px;font-weight:700;margin:8px 0 4px;line-height:1.35">${esc(first.text)}</div>
      <div style="font-size:12px;color:var(--mut)">${deptShort(firstDept)} · ${dayLabel(firstDay)} · ${tagBadge(first.tag)}</div>
      <div style="margin-top:13px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-pri" onclick="goPage('tasks')">开始</button>
        <button class="btn" onclick="goPage('report')">写今天的日报</button>
      </div>
    </div>
    <div style="text-align:center;color:var(--mut);font-size:11px;margin:-4px 0 10px">系统一次只叫你做一件事。</div>`;
  }else if(blocks.length){
    h+=`<div class="card" style="border:2px solid var(--grn)">
      <div style="font-size:11px;font-weight:700;color:var(--grn);letter-spacing:.6px">今天的都做完了</div>
      <div style="font-size:19px;font-weight:700;margin:8px 0 4px">剩下写日报</div>
      <div style="margin-top:12px"><button class="btn btn-pri" onclick="goPage('report')">写今天的日报</button></div>
    </div>`;
  }else{
    h+=`<div class="card">
      <div style="font-size:15px;font-weight:700;margin-bottom:4px">今天没有排到训练的课</div>
      <div style="font-size:12px;color:var(--mut)">你今天的课表没有训练中的部门。可以自己看 SOP 复习。</div>
    </div>`;
  }

  // ── 第二层：这一週（用件数，不用天数）──
  h+=`<div class="card"><div class="card-title" style="margin-bottom:8px">这一週</div>`;
  (p.depts||[]).forEach(pd=>{
    setRD(pd.dept);
    const day=pd.currentDay||1;
    const rest=isRestDate(p,pd.dept,iso);
    const tasks=rest?[]:((D.TASKS.mentee||{})[day]||[]);
    const done=tasks.filter(t=>S.taskChecks[checkKey(p.uid,pd.dept,'mentee',day,t.id)]).length;
    const dots=tasks.map((t,i)=>`<i style="display:inline-block;width:15px;height:6px;border-radius:3px;margin-right:4px;background:${i<done?'var(--grn)':(i===done?'var(--acc)':'var(--bdr)')}"></i>`).join('');
    const duty=onDuty.includes(pd.dept);
    h+=`<div style="display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:.5px solid var(--bdr)">
      <span class="chip ${duty?'chip-blue':''}" style="min-width:42px;text-align:center">${deptShort(pd.dept)}</span>
      <div style="flex:1;min-width:0">
        <div style="font-size:12.5px;font-weight:500">${pd.status==='completed'?'这个部门跑完了':(rest?'整理日':dayLabel(day))}</div>
        <div style="margin-top:5px">${dots||'<span style="font-size:11px;color:var(--mut)">—</span>'}</div>
      </div>
      <div style="font-size:11.5px;color:var(--mut);white-space:nowrap">
        ${pd.status==='completed'?'<span style="color:var(--grn)">✅ 完成</span>'
          :(rest?'整理':(duty?`做完 ${done}／${tasks.length}`:'今天没课'))}
      </div>
    </div>`;
  });
  h+=`<div style="margin-top:10px"><button class="btn btn-sm" onclick="goPage('progress')">我的整份计划 ›</button></div></div>`;

  // ── 放行状态（完成之后才出现）──
  const allDone=(p.depts||[]).length&&(p.depts||[]).every(x=>x.status==='completed');
  if(allDone){
    h+=p.released
      ? `<div class="alert alert-grn">🎉 你已经被放行，可以自己带班了。</div>`
      : `<div class="alert alert-amb">训练都跑完了，等管理层放行。</div>`;
  }
  el.innerHTML=h;
}

async function doRelease(uid){
  const p=getPlan(uid); if(!p)return;
  const note=prompt(`放行 ${p.teacherName}？\n\n放行后她可以自己带班。这个动作会留下纪录（谁、何时）。\n\n备注（可留白）：`,'');
  if(note===null)return;
  await setReleased(uid,true,note);
  alert('✅ 已放行，纪录留下了。');
}

// ── 新增计划 ─────────────────────────────────────────────────
function openNewPlan(){
  const tOpts=S.teachers.map(t=>`<option value="${esc(t.id)}">${esc(t.name||t.id)} (${esc(t.id)})</option>`).join('');
  const dChips=DEPT_OPTIONS.map(o=>`<span class="cb${o.code==='SRK'?' on':''}" data-d="${o.code}" onclick="npToggle(this)">
      <span>${o.code==='SRK'?'✓':'＋'}</span> ${o.code}</span>`).join('');
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="modal" style="max-width:460px">
    <div class="modal-hdr"><span class="modal-hdr-title">新增训练计划</span>
      <button class="modal-close" onclick="this.closest('.overlay').remove()">×</button></div>
    <div class="modal-body">
      <label class="lbl">新老师 *</label>
      <select id="np_teacher"><option value="">— 请选择 —</option>${tOpts}</select>
      <label class="lbl">Mentor *</label>
      <select id="np_mentor"><option value="">— 请选择 —</option>${tOpts}</select>
      <label class="lbl">她要受训哪些部门 *（可多选）</label>
      <div class="chk" id="np_depts">${dChips}</div>
      <label class="lbl" style="margin-top:10px">开始日期 *</label>
      <input type="date" id="np_start" value="${getTodayISO()}" onchange="npPreview()">
      <div id="np_preview" style="font-size:11px;color:var(--mut);margin-top:6px;line-height:1.7"></div>
      <label class="lbl">备注</label><textarea id="np_note" rows="2" placeholder="可留白"></textarea>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="this.closest('.overlay').remove()">取消</button>
      <button class="btn btn-pri" onclick="createPlan()">✅ 建立</button></div>
  </div>`;
  document.body.appendChild(ov);
  npPreview();
}
function npToggle(e){
  e.classList.toggle('on');
  e.firstElementChild.textContent=e.classList.contains('on')?'✓':'＋';
  npPreview();
}
function npSelectedDepts(){
  return [...document.querySelectorAll('#np_depts .cb.on')].map(x=>x.dataset.d);
}
function npPreview(){
  const box=document.getElementById('np_preview'); if(!box)return;
  const start=document.getElementById('np_start')?.value;
  const depts=npSelectedDepts();
  if(!start||!depts.length){box.textContent='';return;}
  const fake={startDate:start,exceptions:[],depts:depts.map(d=>({dept:d}))};
  const lines=depts.map(d=>{
    const m=planDates(fake,d);
    const skipped=[];
    let cur=parseISO(start), n=0, guard=0;
    while(n<14&&guard++<500){
      const iso=isoOf(cur), dow=cur.getDay();
      if(dow>=1&&dow<=5){ if(isHoliday(iso,d)) skipped.push(holidayName(iso,d)); else n++; }
      cur.setDate(cur.getDate()+1);
    }
    const uniq=[...new Set(skipped)];
    return `${d}：${fmtDate(m[1])} → ${fmtDate(m[14])}${uniq.length?`（跳过 ${uniq.slice(0,2).join('、')}${uniq.length>2?' 等':''}）`:''}`;
  });
  box.innerHTML='週一到週五都是训练日，碰到假期自动往后挪。整理日建好之后自己标。<br>'+lines.join('<br>');
}
async function createPlan(){
  const tc=document.getElementById('np_teacher')?.value;
  const mc=document.getElementById('np_mentor')?.value;
  const st=document.getElementById('np_start')?.value;
  const depts=npSelectedDepts();
  if(!tc||!mc||!st||!depts.length){alert('新老师、Mentor、部门、开始日期都要填。');return;}
  if(tc===mc){alert('新老师与 Mentor 不能是同一个人。');return;}
  const uid='plan_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
  const plan={uid:uid,teacherCode:tc,mentorCode:mc,startDate:st,
    note:document.getElementById('np_note')?.value||'',status:'active',depts:depts.map(d=>({dept:d}))};
  plan.targetDate=targetDateOf(plan)||null;
  await savePlan(plan);
  for(const d of depts) await savePlanDept(uid,d,1,'active');
  document.querySelector('.overlay')?.remove();
  await reloadAll();
  goPage('mgmt');
  alert(`✅ ${teacherName(tc)} 的训练计划建好了（${depts.join(' / ')}）`);
}

    <div class="modal-body">

      <label class="lbl">开始日期</label><input type="date" id="pe_start" value="${p.startDate}">
      <label class="lbl">备注</label><textarea id="pe_note" rows="2">${esc(p.note||'')}</textarea>

      <div style="margin-top:14px;border-top:.5px solid var(--bdr);padding-top:12px">
        <div style="font-size:12px;font-weight:700;margin-bottom:3px">📅 标注某一天</div>

            <option value="consolidate">整理日</option>
          </select>
          <select id="pe_ex_dept" style="width:auto">${dOpts}</select>
        </div>
        <input type="text" id="pe_ex_reason" placeholder="原因（必填）" style="margin-top:6px">

        <div style="margin-top:8px">
          ${(p.exceptions||[]).map(e=>`<div style="font-size:11px;color:var(--mut);padding:3px 0">
            <span class="chip ${e.kind==='consolidate'?'chip-amb':''}" style="margin-right:5px">${e.kind==='consolidate'?'整理日':'跳过'}</span>
            ${fmtDate(e.on_date)}${e.dept?' · '+e.dept:' · 全部'} — ${esc(e.reason)}</div>`).join('')||'<span style="font-size:11px;color:var(--mut)">还没有标注</span>'}
        </div>
      </div>

      <div style="margin-top:14px;border-top:.5px solid var(--bdr);padding-top:12px">
        <div style="font-size:12px;font-weight:700;margin-bottom:3px">👨‍🏫 Mentor 换人纪录</div>
        <div style="margin-top:6px">
          ${(p.mentorHistory||[]).map(e=>`<div style="font-size:11px;color:var(--mut);padding:3px 0">
            ${esc(teacherName(e.mentor_code))} — 从第 ${e.from_day||'?'} 天起${e.dept?' · '+e.dept:''}</div>`).join('')||'<span style="font-size:11px;color:var(--mut)">没有换过</span>'}
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="this.closest('.overlay').remove()">取消</button>
      <button class="btn btn-pri" onclick="savePlanEdit('${p.uid}')">储存</button></div>
  </div>`;
  document.body.appendChild(ov);
}
async function addExceptionFromForm(uid){
  const d=document.getElementById('pe_ex_date')?.value;
  const dp=document.getElementById('pe_ex_dept')?.value||null;
  const kd=document.getElementById('pe_ex_kind')?.value||'skip';
  const r=document.getElementById('pe_ex_reason')?.value.trim();
  if(!d||!r){alert('日期和原因都要填。');return;}
  await addException(uid,dp,d,r,kd);
  document.querySelector('.overlay')?.remove();
  openPlanEdit(uid);
}
async function savePlanEdit(uid){
  const p=getPlan(uid); if(!p)return;
  p.mentorCode=document.getElementById('pe_mentor')?.value||p.mentorCode;
  p.startDate=document.getElementById('pe_start')?.value||p.startDate;
  p.note=document.getElementById('pe_note')?.value||'';
  p.targetDate=targetDateOf(p)||null;
  await savePlan(p);
  document.querySelector('.overlay')?.remove();
  await reloadAll();
  alert('✅ 已储存');
}
async function deletePlan(uid){
  const p=getPlan(uid); if(!p)return;
  if(!confirm(`删掉 ${p.teacherName} 的整份计划？\n日报与打勾会一起删掉，无法复原。`))return;
  const {error}=await sb.from('traingo_plan').delete().eq('client_uid',uid);
  if(error){alert('删不掉：'+error.message);return;}
  S.planUid=null;
  await reloadAll();
  goPage('mgmt');
}

          style="${h.id===activeId?`border-bottom-color:${t.accent};color:${t.accent};font-weight:700`:''}"

    if(sec.body){
      html+=`<div style="font-size:12px;line-height:1.85;color:var(--txt);white-space:pre-line">${sec.body}</div>`;
