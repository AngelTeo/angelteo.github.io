<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Academee 平台共用登入（Supabase） -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<title>TrainGo</title>
<style>
:root {
  --acc:#185FA5;--grn:#0F6E56;--red:#A32D2D;--amb:#854F0B;--pur:#6B3FA0;
  --sur:#ffffff;--sur2:#f5f4f0;--bdr:#e0ddd6;
  --txt:#1a1a1a;--mut:#888888;--hint:#bbbbbb;--gold:#c8860a;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--sur2);color:var(--txt);font-size:13px;}
.topbar{background:#1B3A5C;border-bottom:none;padding:0 12px;display:flex;align-items:center;gap:2px;position:sticky;top:0;z-index:100;min-height:46px;flex-wrap:wrap;}
.topbar-brand{font-weight:800;font-size:13px;color:#ffffff;margin-right:2px;white-space:nowrap;}
.topbar-ver{font-size:9px;font-weight:600;color:rgba(255,255,255,.45);margin-right:8px;letter-spacing:.04em;align-self:flex-end;padding-bottom:14px;}
.ntab{border:none;background:none;padding:12px 9px;font-size:11px;cursor:pointer;color:rgba(255,255,255,.65);border-bottom:2px solid transparent;font-family:inherit;white-space:nowrap;}
.ntab.on{color:#ffffff;border-bottom-color:#ffffff;font-weight:600;}
.ntab:hover{color:#ffffff;}
.role-badge{margin-left:auto;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:600;border:1px solid;flex-shrink:0;}
.role-mentor{background:rgba(24,95,165,.25);color:#9EC8FF;border-color:rgba(158,200,255,.4);}
.role-mentee{background:rgba(15,110,86,.25);color:#7BE8C8;border-color:rgba(123,232,200,.4);}
.role-mgmt{background:rgba(133,79,11,.25);color:#FFD580;border-color:rgba(255,213,128,.4);}
.page{display:none;padding:14px;max-width:960px;margin:0 auto;}
.page.on{display:block;}
.card{background:var(--sur);border:.5px solid var(--bdr);border-radius:10px;padding:14px;margin-bottom:12px;}
.card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.card-title{font-size:13px;font-weight:600;}
.btn{border:.5px solid var(--bdr);background:var(--sur);border-radius:6px;padding:6px 13px;font-size:11px;cursor:pointer;color:var(--txt);font-family:inherit;transition:background .15s;}
.btn:hover{background:var(--sur2);}
.btn-pri{background:var(--acc);color:#fff;border-color:var(--acc);}
.btn-pri:hover{background:#134e8a;}
.btn-grn{background:var(--grn);color:#fff;border-color:var(--grn);}
.btn-red{background:var(--red);color:#fff;border-color:var(--red);}
.btn-sm{padding:4px 9px;font-size:10px;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:12px;}
.stat{background:var(--sur);border:.5px solid var(--bdr);border-radius:10px;padding:12px;text-align:center;}
.stat-num{font-size:22px;font-weight:700;color:var(--acc);}
.stat-lbl{font-size:10px;color:var(--mut);margin-top:2px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
/* TASK */
.task-item{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:.5px solid var(--bdr);}
.task-item:last-child{border-bottom:none;}
.task-item input[type=checkbox]{margin-top:2px;width:15px;height:15px;cursor:pointer;accent-color:var(--acc);flex-shrink:0;}
.task-label{flex:1;font-size:12px;line-height:1.5;cursor:pointer;}
.task-item.done .task-label{text-decoration:line-through;color:var(--mut);}
.task-tag{font-size:9px;padding:1px 5px;border-radius:8px;font-weight:600;margin-right:3px;}
.tag-must{background:#FCEBEB;color:#A32D2D;}
.tag-doc{background:#EEF2F7;color:#185FA5;}
.tag-obs{background:#FFF8E1;color:#854F0B;}
.tag-teach{background:#E1F5EE;color:#0F6E56;}
.sop-btn{font-size:10px;padding:2px 7px;border-radius:10px;border:.5px solid var(--bdr);background:var(--sur2);color:var(--acc);cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:inherit;margin-top:1px;}
.sop-btn:hover{background:#EEF2F7;border-color:var(--acc);}
/* TIMELINE */
.timeline{display:flex;gap:0;margin-bottom:14px;}
.stage-block{flex:1;position:relative;}
.stage-bar{height:7px;background:var(--bdr);}
.stage-block.done .stage-bar{background:var(--grn);}
.stage-block.current .stage-bar{background:var(--acc);}
.stage-dot{width:17px;height:17px;border-radius:50%;border:2px solid var(--bdr);background:var(--sur);position:absolute;top:-5px;left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;font-size:8px;}
.stage-block.done .stage-dot{background:var(--grn);border-color:var(--grn);color:#fff;}
.stage-block.current .stage-dot{background:var(--acc);border-color:var(--acc);color:#fff;}
.stage-lbl{text-align:center;font-size:8px;color:var(--mut);margin-top:14px;}
.stage-block.current .stage-lbl{color:var(--acc);font-weight:600;}
/* SOP MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:999;display:flex;align-items:center;justify-content:center;padding:8px;}
.modal{background:var(--sur);border-radius:14px;width:min(580px,96vw);max-height:90vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.28);}
.modal-hdr{padding:12px 14px;border-bottom:.5px solid var(--bdr);display:flex;align-items:center;position:sticky;top:0;background:var(--sur);z-index:2;border-radius:14px 14px 0 0;gap:8px;}
.modal-hdr-title{font-size:14px;font-weight:700;flex:1;}
.modal-close{background:none;border:none;font-size:20px;color:var(--mut);cursor:pointer;flex-shrink:0;}
.modal-body{padding:12px 14px;}
.modal-foot{padding:10px 14px;border-top:.5px solid var(--bdr);display:flex;justify-content:flex-end;position:sticky;bottom:0;background:var(--sur);border-radius:0 0 14px 14px;}
/* SOP STEP TABLE */
.sop-step{display:flex;gap:8px;padding:7px 0;border-bottom:.5px solid var(--bdr);font-size:12px;}
.sop-step:last-child{border-bottom:none;}
.sop-step-n{font-size:10px;font-weight:700;color:var(--hint);min-width:20px;padding-top:1px;}
.sop-step-body{flex:1;}
.sop-step-title{font-weight:600;color:var(--txt);margin-bottom:2px;}
.sop-step-do{color:var(--txt);line-height:1.55;}
.sop-step-warn{font-size:10px;color:var(--red);margin-top:2px;}
/* AGE TABLE */
.age-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:10px;}
.age-table th{padding:6px 8px;text-align:left;border-bottom:.5px solid var(--bdr);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);}
.age-table td{padding:6px 8px;border-bottom:.5px solid var(--bdr);vertical-align:top;line-height:1.5;}
.age-jr{background:#FFF8F0;}
.age-in{background:#F0F7FF;}
.age-sr{background:#F0FFF6;}
.age-hdr-jr{background:#FFE8CC;color:#7a3500;font-weight:700;}
.age-hdr-in{background:#C8DFFF;color:#0d3d7a;font-weight:700;}
.age-hdr-sr{background:#B8F0D4;color:#0a4a28;font-weight:700;}
/* WARN PILLS */
.warn-pill{display:flex;gap:6px;align-items:flex-start;font-size:11px;padding:5px 8px;background:#FCEBEB;border-radius:6px;margin-bottom:4px;color:#7a1f1f;line-height:1.4;}
/* SOP LIBRARY */
.sop-card{background:var(--sur);border:.5px solid var(--bdr);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:border-color .15s;}
.sop-card:hover{border-color:var(--acc);}
.sop-icon{font-size:22px;flex-shrink:0;}
.sop-cat-badge{font-size:9px;padding:2px 7px;border-radius:8px;font-weight:600;}
.cat-monday{background:#FFF8E1;color:#854F0B;}
.cat-daily{background:#E1F5EE;color:#0F6E56;}
.cat-teaching{background:#EEF2F7;color:#185FA5;}
.cat-closing{background:#F3EEF9;color:#6B3FA0;}
.cat-morning{background:#FFF3E0;color:#E65100;}
.cat-end{background:#F3EEF9;color:#6B3FA0;}
/* REPORT */
textarea{width:100%;border:.5px solid var(--bdr);border-radius:6px;padding:8px;font-family:inherit;font-size:12px;resize:vertical;background:var(--sur);color:var(--txt);}
input[type=text],input[type=date],select{border:.5px solid var(--bdr);border-radius:6px;padding:7px 10px;font-family:inherit;font-size:12px;background:var(--sur);color:var(--txt);width:100%;}
label.lbl{font-size:11px;color:var(--mut);display:block;margin-bottom:4px;margin-top:10px;}
label.lbl:first-child{margin-top:0;}
/* MISC */
.alert{padding:9px 12px;border-radius:8px;font-size:12px;margin-bottom:7px;display:flex;align-items:center;gap:7px;line-height:1.45;}
.alert-red{background:#FCEBEB;border:.5px solid #F09595;color:#7a1f1f;}
.alert-amb{background:#FFF8E1;border:.5px solid #F9CB42;color:#7a4500;}
.alert-grn{background:#E1F5EE;border:.5px solid #9FE1CB;color:#065041;}
.alert-blue{background:#EEF2F7;border:.5px solid #AABDD4;color:#143d6e;}
.chip{display:inline-block;padding:2px 7px;border-radius:10px;font-size:9px;font-weight:600;}
.chip-grn{background:#E1F5EE;color:var(--grn);}
.chip-amb{background:#FFF8E1;color:var(--amb);}
.chip-red{background:#FCEBEB;color:var(--red);}
.chip-blue{background:#EEF2F7;color:var(--acc);}
.chip-pur{background:#F3EEF9;color:var(--pur);}
.prog-bar{background:var(--bdr);border-radius:99px;height:5px;overflow:hidden;margin-top:4px;}
.prog-fill{height:100%;border-radius:99px;background:var(--acc);transition:width .3s;}
.prog-fill.grn{background:var(--grn);}
.cohort-card{background:var(--sur);border:.5px solid var(--bdr);border-radius:10px;padding:12px 14px;margin-bottom:9px;cursor:pointer;transition:border-color .15s;}
.cohort-card:hover{border-color:var(--acc);}
.cohort-meta{font-size:10px;color:var(--mut);margin-top:3px;}
.day-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:10px;}
.day-btn{padding:5px 3px;border-radius:6px;border:.5px solid var(--bdr);background:var(--sur);cursor:pointer;font-size:9px;text-align:center;font-family:inherit;color:var(--mut);}
.day-btn.active{background:var(--acc);color:#fff;border-color:var(--acc);}
.day-btn.done{background:#E1F5EE;border-color:#9FE1CB;color:var(--grn);}
.day-btn.locked{opacity:.4;cursor:not-allowed;}
.itab-row{display:flex;gap:0;border-bottom:.5px solid var(--bdr);margin-bottom:12px;overflow-x:auto;}
.itab{padding:7px 12px;font-size:11px;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit;white-space:nowrap;}
.itab.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:600;}
.saved-flash{position:fixed;bottom:18px;right:18px;background:var(--grn);color:#fff;padding:7px 14px;border-radius:20px;font-size:11px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;}
/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--sur2);}
.login-box{background:var(--sur);border:.5px solid var(--bdr);border-radius:16px;padding:32px 28px;width:380px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.08);}
.login-logo{font-size:22px;font-weight:800;color:var(--acc);margin-bottom:3px;letter-spacing:-.3px;}
.login-sub{font-size:10px;color:var(--mut);margin-bottom:20px;}
.role-btn{width:100%;padding:13px;margin-bottom:8px;border-radius:10px;border:1.5px solid var(--bdr);background:var(--sur);cursor:pointer;font-family:inherit;font-size:12px;font-weight:600;display:flex;align-items:center;gap:10px;transition:all .15s;text-align:left;}
.role-btn:hover{border-color:var(--acc);background:#F0F6FF;}
.role-btn .icon{font-size:20px;}
.role-btn small{font-size:10px;color:var(--mut);font-weight:400;display:block;}
@media(max-width:600px){.stats{grid-template-columns:1fr 1fr;}.grid2{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="saved-flash" id="savedFlash">✓ Saved</div>

<!-- 未登入 / 无权限 时显示（本系统不自己管密码，跟平台共用登入）-->
<div class="login-wrap" id="gate">
  <div class="login-box">
    <div style="font-size:40px;margin-bottom:10px">🎯</div>
    <div class="login-logo">TrainGo</div>
    <div class="login-sub">Academee New Teacher Training System</div>
    <div id="gateMsg" style="margin-top:20px;font-size:13px;line-height:1.7;color:var(--txt)">Checking who you are…</div>
    <a id="gateBtn" href="../index.html" style="display:none;margin-top:18px;padding:12px;border-radius:10px;background:#1B3A5C;color:#fff;font-size:14px;font-weight:700;text-decoration:none">Sign in on the platform home →</a>
  </div>
</div>

<!-- MAIN APP -->
<div id="mainApp" style="display:none">
  <div class="topbar">
    <span class="topbar-brand">🎯 TrainGo</span>
    <span class="topbar-ver" id="topbarVer"></span>
    <span id="syncStatus" style="font-size:10px;margin-left:2px;opacity:.7" title="Cloud sync status"></span>
    <button class="ntab on" data-pg="dashboard" onclick="goPage('dashboard')">🏠 Home</button>
    <button class="ntab" data-pg="tasks" onclick="goPage('tasks')">📋 Today</button>
    <button class="ntab" data-pg="sop" onclick="goPage('sop')">📖 SOP</button>
    <button class="ntab" data-pg="report" onclick="goPage('report')">📝 Day Report</button>
    <button class="ntab" data-pg="comp" onclick="goPage('comp')">✅ Job Checklist</button>
    <button class="ntab" data-pg="progress" onclick="goPage('progress')">📊 Progress</button>
    <button class="ntab" data-pg="handbook" onclick="goPage('handbook')">🏫 Handbook</button>
    <button class="ntab" data-pg="mgmt" id="tab-mgmt" style="display:none" onclick="goPage('mgmt')">⚙️ Settings</button>
    <span id="roleBadgeTop" class="role-badge" style="margin-left:auto"></span>
    <button class="btn btn-sm" id="btnExport" style="display:none;margin-left:8px;flex-shrink:0;background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3)" onclick="exportData()">↑ Export</button>
    <button class="btn btn-sm" id="btnImport" style="display:none;margin-left:4px;flex-shrink:0;background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3)" onclick="importData()">↓ Import</button>
  </div>
  <input type="file" id="importFileInput" accept=".json" style="display:none" onchange="handleImportFile(this)">
  <div class="page on" id="page-dashboard"><div id="dashboard-content"></div></div>
  <div class="page" id="page-tasks"><div id="tasks-content"></div></div>
  <div class="page" id="page-report"><div id="report-content"></div></div>
  <div class="page" id="page-progress"><div id="progress-content"></div></div>
  <div class="page" id="page-comp"><div id="comp-content"></div></div>
  <div class="page" id="page-sop"><div id="sop-content"></div></div>
  <div class="page" id="page-handbook"><div id="handbook-content"></div></div>
  <div class="page" id="page-mgmt"><div id="mgmt-content"></div></div>
</div>

// ══════════════════════════════════════════════════════════════
// SOP DATA — 13 STEPS
// ══════════════════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════════
// 部门配置 · DEPARTMENT CONFIG  (v21 · 各部门各自保留阶段切法)
// ══════════════════════════════════════════════════════════════
const SRK_SOP_DATA= {
  hygiene:{id:'hygiene',n:1,name:'Hygiene Checking',nameZh:'Head-to-Toe Check',icon:'👀',when:'MONDAY ONLY',cat:'monday',
    steps:[
      {n:1,title:'Hair',warn:'⚠️ Lice / Nits',do_:'Check hair & scalp carefully'},

      {n:6,title:'Hands & Fingers',warn:'⚠️ HFMD · Chickenpox · Nail length (must be short)',do_:'"Show me your hands! Turn behind! Hands on the table!" Check palms, back of hands, and fingernails.'},

      {n:8,title:'Uniform & Cleanliness',warn:'',do_:'Encourage: brush teeth, wash face, tuck in shirt. Come to school in neat uniform daily.'},
    ],
    age:{
      jr:{tips:['DEMONSTRATE entire flow WITH student','CHECK each part together step by step','GUIDE every action slowly','HELP student with actions','MODEL funny sounds (cough/sneeze!) — make it fun','ENCOURAGE participation — never scare them'],goal:'Stands still, follows simple instructions, not scared, cooperates, laughs at funny parts'},
      in_:{tips:['DEMONSTRATE entire flow','GUIDE student through steps','ENCOURAGE independent actions','MONITOR understanding','MODEL clear voice & actions'],goal:'Follows sequence, does actions independently, responds to questions, more confident'},

  },

  bookcollect:{id:'bookcollect',n:2,name:'Collection of Books',nameZh:'Collect by Subject',icon:'📚',when:'MONDAY ONLY',cat:'monday',
    steps:[
      {n:1,do_:'Announce: "Take out ALL your books. Submit by subject." Give time to prepare.'},
      {n:2,do_:'Students submit books. Walk around to check, sort by subject, stack neatly.'},

      {n:4,warn:'⚠️ Number wrong',do_:'"Everyone stand up!" → Call names one by one → Check bags → Check cupboard → Sit when confirmed.'},

      {n:6,do_:'Keep books in cupboard by subject. Continue to next activity.'},
    ],

      jr:{tips:['DEMONSTRATE how to take out & submit','HELP sort books FOR them','Name each subject clearly','Show WHERE in cupboard to keep books'],goal:'Can take out books with help, learning to submit, follows teacher guidance'},
      in_:{tips:['GUIDE sorting: "Find your English book"','Help if stuck','Check organization','Encourage neatness'],goal:'Can sort with guidance, knows most subjects, improving organization'},
      sr:{tips:['BRIEF instruction only','MONITOR independently','Should be efficient — quick process'],goal:'Sorts independently, neat organization, all subjects correct, no prompting needed'},
    },
    warns:['⚠️ 3 weeks consecutive missing same book → file it in MiscGo. MGMT contacts the parent, never you','📝 Photo + MiscGo entry when names are written on the board'],
  },

  attendance:{id:'attendance',n:3,name:'Take Attendance',nameZh:'Roll Call',icon:'✋',when:'EVERY DAY',cat:'daily',
    steps:[
      {n:1,do_:'Lead the morning chant:<br>Teacher: "Clap clap — good morning children!"<br>Students: "Clap clap — good morning Teacher!"<br><br>Wait for full quiet. "Sit properly. Listen for your name."'},
      {n:2,do_:'Call each name CLEARLY and LOUDLY. Wait for response. Make eye contact. Verify it\'s the right student.'},
      {n:3,warn:'⚠️ Too quiet / shy',do_:'"Louder please! Show me your STRONG voice!" Praise loud responses. Make it FUN — different voices, raise hand HIGH!'},

  escalation:{id:'escalation',n:14,name:'Escalation & Parent Contact',nameZh:'Reporting & Parent Boundary',icon:'🚨',when:'AS TRIGGERED',cat:'end',
    steps:[
      {n:1,title:'Everything starts in MiscGo — nothing else',do_:'One entry point, one standard, so nothing gets missed. Do not open WhatsApp yourself, do not report verbally, do not ask someone else to pass it on. Pick the right report type, write what actually happened — not your guess, not your opinion.',warn:'⚡ File it, then stop. MGMT handles the rest — do not chase it yourself'},
      {n:2,title:'Press "Generate + Save", then "Send to WhatsApp"',do_:'The moment you press <b>Generate + Save</b> the record is already stored — you do not need to save it again. A preview appears: check it, then press <b>Send to WhatsApp</b> and pick the group, so MGMT actually sees it.<br>If you try to leave without sending, the system stops you once. That is a reminder, not an obstacle.',warn:'⚠️ Stored in the system is NOT the same as management knowing. It has to be sent'},
      {n:3,title:'Never respond to a parent',do_:'If a parent messages you, calls you, or stops you at the door — you say one line and nothing else: <b>"I will pass this to management and they will contact you."</b> Then end the conversation and file it in MiscGo.',warn:'⚠️ Never say "OK", "no problem", "I will sort it out" or "that should be fine" — to a parent that is a promise'},
      {n:4,title:'What you must never discuss with a parent',do_:'Other children · other teachers · fees · staffing or scheduling · discipline decisions. However friendly or however angry the parent is, the rule does not change.',warn:'⚠️ A parent\'s mood is not an exception'},
      {n:5,title:'Immediately — child not accounted for',do_:'A child who should be here and is not → file MiscGo at once, report type <b>PICKUP</b>. Say which child and which pickup or bus. Do not finish what you are doing first.',warn:'⚡ Immediately'},
      {n:6,title:'Immediately — child unwell or injured',do_:'Any sign of illness → <b>HEALTH</b>. Any injury, however small → <b>INJURED</b>. Do not decide for yourself whether it is serious enough.',warn:'⚡ Immediately'},
      {n:7,title:'Immediately — conflict between children',do_:'Separate them. Stay calm. Do not question anyone alone. Then file MiscGo, report type <b>BEHAVIOUR_R</b>.',warn:'⚡ Immediately'},
      {n:8,title:'Same day — upset or crying',do_:'A private check-in after class, then file MiscGo, report type <b>EMOTION</b>. Write what set it off.'},
      {n:9,title:'Pick the right report type',do_:'Complaint → <b>COMPLAINT</b> · Request (time change, leave, special arrangement) → <b>REQUEST</b> · Pickup → <b>PICKUP</b> · Unwell → <b>HEALTH</b> · Injury → <b>INJURED</b> · Medicine → <b>MEDICINE</b> · Behaviour → <b>BEHAVIOUR_R</b> · Upset → <b>EMOTION</b> · Forgot something → <b>FORGOT</b> · Lost or found → <b>LOST</b> / <b>FOUND</b> · None of these → <b>GENERAL</b>.'},
    ],
    age:{
      jr:{tips:['Same rule at every age — the child being 4 changes nothing'],goal:'Files every incident in MiscGo; never answers a parent directly'},
      in_:{tips:['Same rule at every age'],goal:'Files every incident in MiscGo; never answers a parent directly'},
      sr:{tips:['Same rule at every age'],goal:'Files every incident in MiscGo; never answers a parent directly'},
    },
    warns:['⚠️ Stored is not sent — always press Send to WhatsApp','⚠️ You are NOT expected to handle any of this alone — filing it IS the action','⚠️ Not sure whether to report? Report. Getting the call wrong is not a mistake; staying quiet is','⚠️ Nobody is ever criticised for filing too much','⚠️ A parent question is never yours to answer — one line, then MiscGo'],
  },

const WEEK_CODE=['SUN','MON','TUE','WED','THU','FRI','SAT'];
// 整理日不再固定在週五 —— 由管理层自己标（见 traingo_day_exception.kind）
const TRAIN_DAYS=[1,2,3,4,6,7,8,9,11,12,13,14];   // 任务表的键，沿用 v20 的编号
const PLAN_DAYS=TRAIN_DAYS;
const REST_DAYS=[];                                // 保留空阵列，避免旧引用出错

function esc(x){return String(x==null?'':x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function isoOf(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function parseISO(s){return new Date(String(s).slice(0,10)+'T12:00:00');}
function todayISO(){return isoOf(new Date());}
function weekdayCode(iso){return WEEK_CODE[parseISO(iso).getDay()];}

// ── 行事历：这一天该部门放不放假 ──────────────────────────────
function isHoliday(iso,dept){
  return S.holidays.some(h=>{
    if(h.type==='extra_class')return false;           // 加课不是假期
    const a=String(h.start_date).slice(0,10);
    const b=h.end_date?String(h.end_date).slice(0,10):a;
    if(iso<a||iso>b)return false;
    const dl=h.depts||[];
    return dl.length===0 || dl.includes(dept);        // 空阵列 = 全公司
  });
}
function holidayName(iso,dept){
  const h=S.holidays.find(x=>{
    if(x.type==='extra_class')return false;
    const a=String(x.start_date).slice(0,10);
    const b=x.end_date?String(x.end_date).slice(0,10):a;
    if(iso<a||iso>b)return false;
    const dl=x.depts||[];return dl.length===0||dl.includes(dept);
  });
  return h?h.name:'';
}
// ── 临时例外：管理层标注「今天不算训练日」──────────────────────
function dayMark(plan,dept,iso){
  return (plan.exceptions||[]).find(e=>String(e.on_date).slice(0,10)===iso&&(!e.dept||e.dept===dept))||null;
}
// skip = 这天不算训练日，整个跳过往后顺延
function isException(plan,dept,iso){
  const m=dayMark(plan,dept,iso); return !!m && (m.kind||'skip')==='skip';
}
// consolidate = 整理日：算在计划里，但不出任务
function isRestDate(plan,dept,iso){
  const m=dayMark(plan,dept,iso); return !!m && m.kind==='consolidate';
}
function exceptionReason(plan,dept,iso){
  const m=dayMark(plan,dept,iso); return m?m.reason:'';
}

// ── 排程：第 N 天是哪一天（週一到週五，跳假期与例外）────────────
// 训练日编号 = TRAIN_DAYS 的顺位（1,2,3,4,6,7,8,9,11,12,13,14 是任务表的键）
// 画面上一律写「第 N 个训练日」，N = 顺位，所以永远照时间排，不会跳号
function isExtraDay(d){return d>TRAIN_DAYS[TRAIN_DAYS.length-1];}
function extraNo(d){return d-TRAIN_DAYS[TRAIN_DAYS.length-1];}
// v32：以前 dayNo(15) 找不到 → 回 1 → 延长天全都显示成「Day 1」
function dayNo(d){if(isExtraDay(d))return TRAIN_DAYS.length+extraNo(d);const i=TRAIN_DAYS.indexOf(d);return i<0?1:i+1;}
function dayLabel(d){return isExtraDay(d)?'Extra day '+extraNo(d):'Day '+dayNo(d);}

// 週一到週四 = 训练日；週五 = 整理日。碰到假期或例外整天跳过。
// 週一到週五都是训练日。碰到假期、被标「跳过」、或被标「整理日」的那天，不给训练日编号。
function planDates(plan,dept){
  const map={}, rest=[];
  const train=[...TRAIN_DAYS];
  let d=parseISO(plan.startDate), guard=0;
  while(train.length&&guard++<600){
    const dow=d.getDay(), iso=isoOf(d);
    if(dow>=1&&dow<=5){
      if(isRestDate(plan,dept,iso))      rest.push(iso);
      else if(!isHoliday(iso,dept)&&!isException(plan,dept,iso)) map[train.shift()]=iso;
    }
    d.setDate(d.getDate()+1);
  }
  map._rest=rest;
  return map;
}

function targetDateOf(plan){
  let last='';
  (plan.depts||[]).forEach(pd=>{
    const m=planDates(plan,pd.dept);
    const v=m[TRAIN_DAYS[TRAIN_DAYS.length-1]]||'';
    if(v>last)last=v;});
  return last;
}
function dayOfDate(plan,dept,iso){
  const m=planDates(plan,dept);
  for(const k in m) if(m[k]===iso) return parseInt(k,10);
  return null;
}

// ── 课表：她今天被排到哪些部门 ────────────────────────────────
function deptsOnDay(teacherCode,iso){
  const w=weekdayCode(iso);
  return [...new Set(S.timetable.filter(t=>t.teacher===teacherCode&&t.day===w).map(t=>t.dept))]
    .filter(d=>DEPT_CFG[deptKey(d)]);
}
function sessionsOnDay(teacherCode,iso,dept){
  const w=weekdayCode(iso);
  return S.timetable.filter(t=>t.teacher===teacherCode&&t.day===w&&t.dept===dept);
}

// ── 今天该出哪些部门的任务 ────────────────────────────────────
// 规则：她今天有课的部门 ∩ 计划里还在跑的部门。整理日不出任务。
function deptFirstSession(teacherCode,iso,dept){
  const rows=sessionsOnDay(teacherCode,iso,dept);
  if(!rows.length)return 'z9';
  return rows.map(r=>r.session||'z9').sort()[0];
}
function todayDeptTasks(plan){
  const iso=todayISO();
  const onDuty=deptsOnDay(plan.teacherCode,iso);
  const out=[];
  const ordered=[...(plan.depts||[])].sort((a,b)=>
    deptFirstSession(plan.teacherCode,iso,a.dept).localeCompare(
    deptFirstSession(plan.teacherCode,iso,b.dept)));
  ordered.forEach(pd=>{
    if(pd.status!=='active')return;
    if(!onDuty.includes(pd.dept))return;
    const day=pd.currentDay||1;
    if(isRestDate(plan,pd.dept,iso)){out.push({dept:pd.dept,day,rest:true,tasks:[]});return;}
    setRD(pd.dept);
    const mine=(D.TASKS[S.role==='mentor'?'mentor':'mentee']||{})[day]||[];
    out.push({dept:pd.dept,day,rest:false,tasks:mine});
  });
  return out;
}

// 完成 ＝ 清单上每一项都到了要求的级数（架构正本 §4.1）。天数只是进度显示。
function compDone(planUid,dept){
  const list=compFor(dept);
  if(!list.length)return{done:false,ok:0,total:0,missing:[]};
  const missing=list.filter(it=>compLevel(planUid,it.id)<(it.level_required||3));
  return{done:missing.length===0,ok:list.length-missing.length,total:list.length,missing:missing};
}
function planCompDone(p){
  const ds=(p.depts||[]).map(x=>x.dept);
  if(!ds.length)return{done:false,ok:0,total:0};
  let ok=0,total=0,all=true;
  ds.forEach(d=>{const r=compDone(p.uid,d);ok+=r.ok;total+=r.total;if(!r.done)all=false;});
  return{done:all&&total>0,ok:ok,total:total};
}

                   (plan.mentorHistory||[]).some(e=>e.mentor_code===S.me.code);

  return'You cannot sign on this plan — view only.';

function getTodayISO(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
const _WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const _MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
Date.prototype.__zhDate=function(){return _WD[this.getDay()]+', '+this.getDate()+' '+_MO[this.getMonth()];};
function fmtDate(ds){if(!ds)return'—';return new Date(ds+'T12:00:00').__zhDate();}
function getDayDate(startDate,dayNum,schedule){
  // Use manual schedule if set for this day
  if(schedule&&schedule[dayNum])
    return new Date(schedule[dayNum]+'T12:00:00').__zhDate();
  // Fall back to auto-calculate from startDate
  if(!startDate)return'';
  const idx=ALL_DAYS.indexOf(dayNum);if(idx<0)return'';
  const d=new Date(startDate+'T12:00:00');
  d.setDate(d.getDate()+idx);
  return d.__zhDate();
}
function genId(p){return p+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,5);}
// 看的是不是自己的训练计划。是 → 用「你」；不是 → 用名字。不要预设性别。
function isMine(p){return !!(S.me&&p&&p.teacherCode===S.me.code);}
function whoName(p){return p?esc(p.teacherName||p.teacherCode||'this teacher'):'this teacher';}

}
// 新老师首页专用：不管 ClassGo 今天有没有排她的课，都把当天的任务拿出来，
// 只是多带一个 offDuty 旗标。todayDeptTasks 保持原样，别动到 Mentor 那几页。
function roleDayBlocks(plan,role){
  const iso=todayISO();
  const onDuty=deptsOnDay(plan.teacherCode,iso);   // 依学员的课表，Mentor 陪的是她的课
  const out=[];
  const ordered=[...(plan.depts||[])].sort((a,b)=>
    deptFirstSession(plan.teacherCode,iso,a.dept).localeCompare(
    deptFirstSession(plan.teacherCode,iso,b.dept)));
  ordered.forEach(pd=>{
    if(pd.status!=='active')return;
    const day=pd.currentDay||1;
    if(isRestDate(plan,pd.dept,iso)){out.push({dept:pd.dept,day,rest:true,offDuty:false,tasks:[]});return;}
    setRD(pd.dept);
    const mine=(D.TASKS[role==='mentor'?'mentor':'mentee']||{})[day]||[];
    out.push({dept:pd.dept,day,rest:false,offDuty:!onDuty.includes(pd.dept),tasks:mine});
  });
  return out;
}
function menteeDayBlocks(plan){return roleDayBlocks(plan,'mentee');}
// 没课那天也能先做掉的：CRITICAL 与 RECORD。OBSERVE / TEACH 要有课才算数。
function doableOffDuty(tasks){return (tasks||[]).filter(t=>t.tag==='must'||t.tag==='doc');}
function getReport(uid,role,day,dept){
  const dp=dept||S.dept;
  return S.reports.find(r=>r.planUid===uid&&r.role===role&&r.day===day&&r.dept===dp);
}
// v31：以前这里自己写死一套 D1..D14，跟 dayLabel() 的「第 N 个训练日」对不上 ——
// 同一天在首页叫 Day 5，在天数条却叫 D6。一律以 dayNo() 为准。
function getDayLabel(d){return isExtraDay(d)?'E'+extraNo(d):'D'+dayNo(d);}
function stageProgress(cohort){
  if(!cohort)return{stage:1,pct:0};
  const day=cohort.currentDay||1;const stage=getStageForDay(day);
  const idx=ALL_DAYS.indexOf(day);const pct=Math.round(((idx+1)/ALL_DAYS.length)*100);
  return{stage:stage.id,pct};
}
// 任务本来就带 sops[] 和 go，之前一个都没画出来，只好在文字里写「Tap X in the menu」。
function taskLinks(t){
  if(!t)return'';
  const bits=[];
  if(t.go)bits.push(`<button class="btn btn-sm" style="padding:3px 9px;font-size:11px" onclick="event.preventDefault();goPage('${t.go}')">${esc(t.goLabel||'Open')} ›</button>`);
  (t.sops||[]).forEach(k=>{const sop=D.SOP&&D.SOP[k];if(!sop)return;
    bits.push(`<button class="btn btn-sm" style="padding:3px 9px;font-size:11px" onclick="event.preventDefault();openSopModal('${k}')">📖 ${esc(sop.name)}</button>`);});
  if(!bits.length)return'';
  return`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">${bits.join('')}</div>`;
}
function extraDayCard(cohort,role){
  const r=compDone(cohort.id,cohort.dept);
  return`<div class="card" style="border:2px solid var(--gold)">
    <div style="font-size:11px;font-weight:700;color:var(--gold);letter-spacing:.6px">${dayLabel(cohort.currentDay)} · after the 12 training days</div>
    <div style="font-size:17px;font-weight:700;margin:8px 0 4px">${role==='mentor'?'Help '+esc(cohort.menteeName)+' close the checklist':'Close the gaps on your checklist'}</div>

    ${r.missing.length?`<div style="margin-top:8px;font-size:12px">${r.missing.slice(0,5).map(x=>'· '+esc(x.name)).join('<br>')}${r.missing.length>5?'<br>…and '+(r.missing.length-5)+' more':''}</div>`:''}
    <div style="margin-top:11px"><button class="btn btn-pri btn-sm" onclick="goPage('comp')">Open the Job Checklist ›</button></div>
  </div>`;
}
function tagBadge(tag){
  const m={must:'tag-must',doc:'tag-doc',obs:'tag-obs',teach:'tag-teach'};
  const l={must:'CRITICAL',doc:'RECORD',obs:'OBSERVE',teach:'TEACH'};
  return`<span class="task-tag ${m[tag]||'tag-obs'}">${l[tag]||tag.toUpperCase()}</span>`;
}
function countChecked(cid,role,day,dept){
  const dp=dept||S.dept||'SRK'; setRD(dp);
  const tasks=(D.TASKS[role]||{})[day]||[];
  return tasks.filter(t=>S.taskChecks[checkKey(cid,dp,role,day,t.id)]).length;
}

function renderMenteeActionItems(cohort,day,stage){
  const menteeRpt=getReport(cohort.id,'mentee',day);
  const mentorRpt=getReport(cohort.id,'mentor',day);
  const items=[];
  if(menteeRpt){
    const stageCfg=D.SKILL_STAGES[stage.id]?.mentee;
    const sops=D.STAGE_SOPS[stage.id]||[];
    sops.forEach(sopId=>{
      const sop=D.SOP[sopId];if(!sop)return;
      const probeVal=menteeRpt.probes?.[sopId]||'';
      const noteVal=menteeRpt.notes?.[sopId]||'';
      const probeOpt=stageCfg?.options?.find(o=>o.val===probeVal);
      if(!probeOpt||['yes','clear','correct','absolute','executed','full','exact','smooth'].includes(probeVal))return;
      const isQuestion=probeVal==='questions';
      items.push({icon:isQuestion?'❓':'⚠️',type:isQuestion?'Ask your Mentor':'Review before tomorrow',
        sop:`${sop.icon} ${sop.name}`,note:noteVal||(isQuestion?'You have a question about this step':'You marked this as unclear')});
    });
  }
  // Mentor flagged re-demo — only show SOP name, NOT the critique
  if(mentorRpt){
    const sops=D.STAGE_SOPS[stage.id]||[];
    sops.forEach(sopId=>{
      const sop=D.SOP[sopId];if(!sop)return;
      const pv=mentorRpt.probes?.[sopId]||'';
      if((pv==='poor'||pv==='major')&&!items.find(i=>i.sop===`${sop.icon} ${sop.name}`))
        items.push({icon:'🔄',type:'Mentor will re-demo tomorrow',sop:`${sop.icon} ${sop.name}`,note:'Pay close attention during the re-demo.'});
    });
  }
  if(!menteeRpt&&!mentorRpt)return`<div class="card" style="border-left:3px solid var(--bdr)"><div class="card-hdr"><span class="card-title">📌 Follow-ups</span></div><div style="font-size:12px;color:var(--mut)">Follow-ups appear once the day reports are in.</div></div>`;

  return`<div class="card" style="border-left:3px solid var(--gold)">
    <div class="card-hdr"><span class="card-title">📌 Follow-ups for tomorrow</span><span class="chip chip-amb">${items.length}</span></div>
    ${items.map(i=>`<div style="padding:8px 10px;margin-bottom:6px;border-radius:8px;background:#FFFBEA;border:.5px solid #F9CB42">
      <div style="display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600"><span>${i.icon}</span><span style="color:var(--amb)">${i.type}</span><span style="font-weight:400;color:var(--txt)">— ${i.sop}</span></div>
      ${i.note?`<div style="font-size:11px;color:var(--mut);margin-top:4px;padding-left:22px;font-style:italic">"${i.note}"</div>`:''}
    </div>`).join('')}
  </div>`;
}

  const menteeRpt=getReport(cohort.id,'mentee',day);

  if(menteeRpt){

    const sops=D.STAGE_SOPS[stage.id]||[];

      const sop=D.SOP[sopId];if(!sop)return;
      const probeVal=menteeRpt.probes?.[sopId]||'';
      const noteVal=menteeRpt.notes?.[sopId]||'';
      const probeOpt=stageCfg?.options?.find(o=>o.val===probeVal);
      if(!probeOpt||probeVal==='yes'||probeVal==='clear'||probeVal==='correct'||probeVal==='absolute'||probeVal==='executed'||probeVal==='full'||probeVal==='exact'||probeVal==='smooth')return;

function getMgmtInterventions(cohort){
  // Returns list of skills uncleared for 2+ consecutive days
  const flags=[];
  const day=cohort.currentDay||1;
  const stage=getStageForDay(day);
  const sops=D.STAGE_SOPS[stage.id]||[];

  sops.forEach(sopId=>{
    const sop=D.SOP[sopId];if(!sop)return;
    // Check consecutive uncleared days within current stage
    const stageDays=stage.days.filter(d=>d<=day);
    if(stageDays.length<2)return;
    let consecutiveUncleared=0;
    let lastTwo=stageDays.slice(-2);
    lastTwo.forEach(d=>{
      const mr=getReport(cohort.id,'mentor',d);
      const tr=getReport(cohort.id,'mentee',d);
      if(!mr||!tr)return;
      const mskI=mr?.skills?.[sopId]||[false];
      const tskI=tr?.skills?.[sopId]||[false];
      const mProbe=mr?.probes?.[sopId]||'';
      const tProbe=tr?.probes?.[sopId]||'';
      // Bad probes: poor/major/significant/notexecuted/dependent/skipped/help/struggled
      const badProbes=['poor','major','significant','notexecuted','dependent','skipped','help','struggled'];
      const mBad=badProbes.includes(mProbe)||!mskI[0];
      const tBad=badProbes.includes(tProbe)||!tskI[0];
      if(mBad||tBad)consecutiveUncleared++;
    });
    if(consecutiveUncleared>=2){
      flags.push({sopId,name:sop.name,icon:sop.icon,stage:stage.id,days:lastTwo});
    }
  });

  // Also check for Mentor-flagged MGMT items
  const mentorFlags=[];
  ALL_DAYS.filter(d=>d<=day).forEach(d=>{
    const mr=getReport(cohort.id,'mentor',d);
    if(mr?.mgmtFlag&&mr.mgmtFlag.trim()){
      mentorFlags.push({day:d,flag:mr.mgmtFlag,time:mr.submitTime});
    }
  });

  return{skillFlags:flags,mentorFlags};
}

function renderSkillConfirm(cohort,role,day,stage,existing){
  const sops=D.STAGE_SOPS[stage.id]||[];

  if(!sops.length||!cfg)return'';
  const sk=existing?.skills||{};
  const probes=existing?.probes||{};

      <div style="font-size:12px;font-weight:700">🎯 Skill confirmation — Stage ${stage.id} ${meta.label}</div>
      <span class="chip chip-blue">${roleLabel}</span>
    </div>
    ${meta.risk?`<div style="font-size:10px;color:var(--mut);margin-bottom:6px;font-style:italic">Risk this stage: ${meta.risk}</div>`:''}
    <div style="background:var(--sur2);border-radius:6px;padding:8px 9px;font-size:11px;color:var(--mut);line-height:1.55;margin-bottom:10px">
      ${role==='mentor'
        ? 'This is your read of how they did today. It does <b>not</b> sign anything off — go to the <b>Job Checklist</b> page to actually sign an item.'
        : 'This is your own read of today, and your Mentor reads it. It does <b>not</b> sign anything off — the Job Checklist only moves when your Mentor signs it there.'}</div>`;

  sops.forEach(sopId=>{
    const sop=D.SOP[sopId];if(!sop)return;
    const checked=sk[sopId]?.[0]===true;
    const probeVal=probes[sopId]||'';
    const noteVal=notes[sopId]||'';
    const selOpt=cfg.options.find(o=>o.val===probeVal);
    const borderCol=probeVal===''?'var(--bdr)':selOpt?.val==='correct'||selOpt?.val==='clear'||selOpt?.val==='absolute'||selOpt?.val==='executed'||selOpt?.val==='full'||selOpt?.val==='exact'||selOpt?.val==='yes'||selOpt?.val==='smooth'?'#9FE1CB':selOpt?.requireNote&&!selOpt?.warn?.includes('MGMT')?'#F9CB42':'#F09595';

    html+=`<div style="border:.5px solid ${borderCol};border-radius:8px;padding:11px;margin-bottom:9px;background:var(--sur)">

      <div style="display:flex;align-items:flex-start;gap:8px;padding-bottom:9px;border-bottom:.5px solid var(--bdr);margin-bottom:9px">
        <input type="checkbox" id="${skillKey(cohort.id,role,day,sopId,0)}" ${checked?'checked':''}
          style="margin-top:2px;width:15px;height:15px;accent-color:var(--grn);flex-shrink:0;cursor:pointer"
          onchange="onSkillCheck('${cohort.id}','${role}',${day},'${sopId}',this.checked)">
        <label for="${skillKey(cohort.id,role,day,sopId,0)}" style="font-size:12px;font-weight:500;cursor:pointer;color:${checked?'var(--grn)':'var(--txt)'}">${cfg.check}</label>
      </div>

      <!-- Step 2: Understanding Probe (radio) -->
      <div style="font-size:11px;font-weight:600;color:var(--mut);margin-bottom:7px">${cfg.probe}</div>
      <div style="display:flex;flex-direction:column;gap:5px">
      ${cfg.options.map(opt=>`
        <label style="display:flex;align-items:flex-start;gap:8px;cursor:pointer;padding:6px 8px;border-radius:6px;border:.5px solid ${probeVal===opt.val?borderCol:'var(--bdr)'};background:${probeVal===opt.val?'var(--sur2)':'transparent'};transition:all .15s">
          <input type="radio" name="${skillProbeKey(cohort.id,role,day,sopId)}" value="${opt.val}" ${probeVal===opt.val?'checked':''}
            style="margin-top:1px;flex-shrink:0;cursor:pointer;accent-color:var(--acc)"

  });

  html+=`</div>`;
  return html;
}

function renderProbeExtra(cid,role,day,sopId,probeVal,noteVal,cfg){
  if(!probeVal)return'';
  const opt=cfg.options.find(o=>o.val===probeVal);
  if(!opt)return'';
  let html='';
  if(opt.warn){
    const isRed=opt.warn.includes('MGMT')||opt.warn.includes('CRITICAL')||opt.warn.includes('escalat')||opt.warn.includes('flagged');
    html+=`<div style="margin-top:8px;padding:7px 10px;border-radius:6px;background:${isRed?'#FCEBEB':'#FFF8E1'};border:.5px solid ${isRed?'#F09595':'#F9CB42'};font-size:11px;color:${isRed?'#7a1f1f':'#7a4500'};line-height:1.5">${opt.warn}</div>`;
  }
  if(opt.requireNote){
    html+=`<div style="margin-top:8px">
      <textarea id="${skillNoteKey(cid,role,day,sopId)}" rows="2" placeholder="${opt.notePlaceholder||'Describe it…'}"
        style="width:100%;border:.5px solid var(--bdr);border-radius:6px;padding:7px;font-family:inherit;font-size:11px;resize:vertical;background:var(--sur)"
        oninput="saveNoteTemp('${cid}','${role}',${day},'${sopId}',this.value)">${noteVal}</textarea>
    </div>`;
  }
  return html;
}

// ── 草稿自动上云：停止打字 1.2 秒存一次 ──────────────────────
let _draftT=null;
function scheduleDraft(uid,role,day,dept){
  clearTimeout(_draftT);
  _draftT=setTimeout(()=>saveDraft(uid,role,day,dept),1200);
}
async function saveDraft(uid,role,day,dept){
  const rpt=collectReport(uid,role,day,dept);
  if(!rpt)return;
  // v32：已经交出去的那一笔，不可以被自动存档降回草稿。
  // （以前 submit 根本不会写 'submitted'，所以看不出来；修好 submit 之後就会：
  //  交完再打一个字 → 自动存档 → 状态被改回 draft → Mentor 那边又变成「没交」。）
  const was=getReport(uid,role,day,dept);
  const keep=(was&&was.state==='submitted')?'submitted':'draft';
  rpt.state=keep;
  await saveReport(rpt,keep);
  const f=document.getElementById('savedFlash');
  if(f){f.textContent=(keep==='submitted'?'Edit saved ':'Draft saved ')+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
        f.style.opacity='1';setTimeout(()=>f.style.opacity='0',1600);}
}
function collectReport(uid,role,day,dept){
  const g=id=>document.getElementById(id)?.value||'';
  const existing=getReport(uid,role,day,dept)||{};
  return Object.assign({},existing,{
    id:existing.id||('rpt_'+Date.now()+'_'+Math.random().toString(36).slice(2,6)),
    planUid:uid, dept:dept||S.dept, role:role, day:day,
    summary:g('rpt_summary'), misc:g('rpt_misc'),
    questions:g('rpt_questions'), mgmtFlag:g('rpt_mgmt_flag'),
    skills:existing.skills||{}, probes:existing.probes||{}, notes:existing.notes||{}
  });
}

async function submitReport(cid,role,day){
  if(!cid){alert('⚠️ No cohort found. Please wait for data to load, then try again.');return;}
  const good=document.getElementById('rpt_good')?.value.trim();
  if(!good){alert('Please fill in "What went well today" first.');return;}
  const stage=getStageForDay(day);
  const sops=D.STAGE_SOPS[stage.id]||[];
  const qs=D.SKILL_STAGES[stage.id]?.[role]||[];

  // Collect skill confirmations + probes + notes
  const{skills,probes,notes}=collectSkillData(cid,role,day);

  const rpt={id:genId('rpt'),planUid:cid,dept:S.dept,state:'submitted',role,day,good,skills,probes,notes,
    improve:document.getElementById('rpt_improve')?.value.trim()||'',
    misc:document.getElementById('rpt_misc')?.value.trim()||'',
    submitTime:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),
    submitDate:getTodayISO(),
    tasksChecked:countChecked(cid,role,day),totalTasks:((D.TASKS[role]||{})[day]||[]).length,
  };
  if(role==='mentor'){
    rpt.advanceReady=document.getElementById('rpt_advance')?.value||'';
    rpt.mgmtFlag=document.getElementById('rpt_mgmt_flag')?.value.trim()||'';
  }else{
    rpt.questions=document.getElementById('rpt_questions')?.value.trim()||'';
  }
  // v32：以前这里呼叫 deleteReportFb()，那个函式根本不存在 —— 只要云上已经有草稿
  // （打过字就会有）就丢 ReferenceError，被下面 catch 住，跳「Failed to save to cloud」。
  // 不需要先删：saveReport 走 upsert，onConflict 是 plan_uid,dept,role,day，本来就会覆盖同一笔。
  let res;
  try{ res=await saveReport(rpt,'submitted'); }catch(e){ res={error:e}; }
  if(res&&res.error){
    alert('⚠️ Your report was NOT submitted.\n\n'+reportErrMsg(res.error)+'\n\n('+(res.error.message||res.error)+')');
    return;
  }
  // Update local state after confirmed Firebase save
  S.reports=S.reports.filter(r=>!(r.planUid===cid&&r.role===role&&r.day===day&&r.dept===S.dept));
  S.reports.push(rpt);
  renderReport();
  alert(`✅ ${dayLabel(day)} report submitted and saved to cloud!`);
}

// v32：以前呼叫 deleteReportFb()，那个函式从来不存在 —— 按下去只会丢 ReferenceError。
// 资料库也没有给一般老师删日报的权限（这是对的：交过的纪录不该消失）。
// 改成「撤回」：状态退回草稿、内容留着，改完再交一次。Mentor 那边会看到它回到「草稿」。
async function deleteReport(cid,role,day){
  const rpt=S.reports.find(r=>r.planUid===cid&&r.role===role&&r.day===day&&r.dept===S.dept);
  if(!rpt)return;
  if(!confirm('Withdraw this report?\n\nIt goes back to a draft — nothing you wrote is lost. Edit it, then submit again.'))return;
  const back=Object.assign({},rpt,{state:'draft'});
  const res=await saveReport(back,'draft');
  if(res&&res.error){alert('⚠️ Could not withdraw.\n\n'+reportErrMsg(res.error));return;}
  rpt.state='draft';
  renderReport();
}

function renderRptBody(r,role){
  let h=`<div style="font-size:12px;line-height:1.7">`;
  if(r.tasksChecked!==undefined)h+=`<div style="margin-bottom:6px"><span class="chip chip-blue">Tasks ${r.tasksChecked}/${r.totalTasks}</span></div>`;
  if(r.good)h+=`<div><strong>✅</strong> ${r.good}</div>`;
  if(r.improve)h+=`<div><strong>🔧</strong> ${r.improve}</div>`;
  if(r.learn)h+=`<div><strong>📖</strong> ${r.learn}</div>`;
  if(r.questions)h+=`<div style="color:var(--amb)"><strong>❓</strong> ${r.questions}</div>`;
  if(r.misc)h+=`<div style="color:var(--red)"><strong>⚠️</strong> ${r.misc}</div>`;
  if(role==='mentor'&&r.ratings){
    h+=`<div style="margin-top:6px;font-size:10px">`;
    Object.entries(r.ratings).forEach(([k,v])=>{if(v)h+=`<div>${k.replace(/_/g,' ')}: ${'⭐'.repeat(parseInt(v)||0)}</div>`;});
    h+=`</div>`;
  }
  h+=`</div>`;return h;
}

function viewRptDay(cohortId,day){
  const cohort=getCohort(cohortId);if(!cohort)return;
  const saved=cohort.currentDay;cohort.currentDay=day;
  renderCohortRptDetail(cohort);cohort.currentDay=saved;
}

async function advanceDay(planUid,dept){
  const p=getPlan(planUid); if(!p)return;
  const dp=dept||S.dept;
  const pd=(p.depts||[]).find(x=>x.dept===dp); if(!pd)return;
  const day=pd.currentDay||1;
  const idx=TRAIN_DAYS.indexOf(day);
  if(idx<TRAIN_DAYS.length-1){
    pd.currentDay=TRAIN_DAYS[idx+1];
    await savePlanDept(p.uid,dp,pd.currentDay,'active');
    await reloadAll();
    alert(`✅ ${dp} moved on to ${dayLabel(pd.currentDay)}`);
  }else{
    // 完成 ≠ 跑完 14 天。清单没齐就继续往下跑（架构正本 §4.1）
    const r=compDone(p.uid,dp);
    if(!r.done){
      const nextDay=day+1;
      pd.currentDay=nextDay;
      await savePlanDept(p.uid,dp,nextDay,'active');
      await reloadAll();
      alert(`${dp}: the checklist is still ${r.total-r.ok} item(s) short, so this is not complete. Moving on to ${dayLabel(nextDay)}.\n\nStill missing:\n`
            +r.missing.slice(0,6).map(x=>'· '+x.name).join('\n')
            +(r.missing.length>6?`\n…and ${r.missing.length-6} more`:''));
      return;
    }
    pd.status='completed';
    await savePlanDept(p.uid,dp,day,'completed');
    await reloadAll();
    const allDone=(getPlan(p.uid).depts||[]).every(x=>x.status==='completed');
    alert(allDone?'🎉 Every department checklist is complete. A releaser now decides whether they can take a class on their own.':`✅ ${dp} checklist is complete. Other departments are still running.`);
  }
}

async function openAdvanceModal(planUid,dept){
  const p=getPlan(planUid); if(!p)return;
  const dp=dept||S.dept;
  const pd=(p.depts||[]).find(x=>x.dept===dp); if(!pd)return;
  const day=pd.currentDay||1;
  const idx=TRAIN_DAYS.indexOf(day);
  const next=TRAIN_DAYS[idx+1];
  const mr=getReport(p.uid,'mentor',day,dp), tr=getReport(p.uid,'mentee',day,dp);
  const cr=compDone(p.uid,dp);
  const compLine=`\nJob checklist: ${cr.ok}／${cr.total} signed off`+(cr.done?' ✅':' ⚠️ '+(cr.total-cr.ok)+' still short');
  const msg=next
    ? `${p.teacherName} · ${dp}\n${dayLabel(day)} → ${dayLabel(next)}?\n\nMentor report: ${mr?'✅ submitted':'⚠️ not yet'}\nNew teacher report: ${tr?'✅ submitted':'⚠️ not yet'}${compLine}\n\nContinue?`
    : `${p.teacherName} · ${dp}\nThis is ${dayLabel(day)}. ${compLine}\n\n`+(cr.done?'Checklist complete — mark this department as finished?':'Checklist is not complete — this will move on to the next day, not mark it finished.');
  if(confirm(msg)) await advanceDay(p.uid,dp);
}

  });
  html+=`</tbody></table></div>
    ${renderTrainingChart(cohort)}
  </div>`;return html;
}

function renderTrainingChart(cohort){
  const day=cohort.currentDay||1;
  // Stage colour palette
  const stagePal={
    1:{bg:'#E8F0FE',border:'#7BA7F5',txt:'#1a4490',label:'Establishing Basics',icon:'👁'},
    2:{bg:'#E6F4EA',border:'#7BC99A',txt:'#0d5c2e',label:'Co-Teaching',icon:'🤝'},
    3:{bg:'#FEF7E0',border:'#F5C842',txt:'#6b4500',label:'Mirror Teaching',icon:'🪞'},
    4:{bg:'#FCE8E6',border:'#F28B82',txt:'#7a1f1f',label:'Independent Teaching',icon:'🎯'},
    5:{bg:'#F3E8FD',border:'#C58AF9',txt:'#4a1070',label:'Full Independence',icon:'⭐'},
  };
  const weeks=[
    {label:'Week 1',days:[1,2,3,4]},
    {label:'Week 2',days:[6,7,8,9]},
    {label:'Week 3',days:[11,12,13,14]},
  ];

  // Build grid HTML
  let grid=`
  <div style="margin-top:18px">
    <div style="font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px">Training progress chart</div>
    <div style="overflow-x:auto">
    <table style="border-collapse:separate;border-spacing:4px;width:100%;min-width:520px">
      <thead>
        <tr>
          <td style="width:120px"></td>
          ${weeks.map(w=>`<td colspan="${w.days.length}" style="text-align:center;font-size:10px;font-weight:700;color:var(--mut);padding-bottom:4px;text-transform:uppercase;letter-spacing:.06em">${w.label}</td>`).join('')}
        </tr>
        <tr>
          <td style="font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;padding-right:8px">Stage</td>
          ${weeks.flatMap(w=>w.days).map(d=>{
            const isCurrent=d===day;const isFuture=d>day;
            return`<td style="text-align:center;font-size:9px;font-weight:${isCurrent?'700':'400'};color:${isCurrent?'var(--acc)':isFuture?'var(--hint)':'var(--mut)'};padding-bottom:2px">${getDayLabel(d)}</td>`;
          }).join('')}
        </tr>
      </thead>
      <tbody>`;

  D.STAGES.forEach(stage=>{
    const pal=stagePal[stage.id];
    const allDaysCols=weeks.flatMap(w=>w.days);
    grid+=`<tr>
      <td style="padding:3px 8px 3px 0;vertical-align:middle">
        <div style="font-size:10px;font-weight:700;color:${pal.txt}">${pal.icon} S${stage.id}</div>
        <div style="font-size:9px;color:var(--mut);line-height:1.3">${pal.label}</div>
      </td>`;

    allDaysCols.forEach(d=>{
      const isStagDay=stage.days.includes(d);
      const isCurrent=d===day;
      const isFuture=d>day;
      const mr=getReport(cohort.id,'mentor',d);
      const tr2=getReport(cohort.id,'mentee',d);

      if(!isStagDay){
        grid+=`<td style="background:var(--sur2);border-radius:6px;height:38px"></td>`;
      } else {
        let cellBg=isFuture?'#f5f4f0':pal.bg;
        let cellBorder=isCurrent?`2px solid var(--acc)`:`.5px solid ${pal.border}`;
        let inner='';
        if(isCurrent){
          inner=`<div style="font-size:9px;font-weight:700;color:var(--acc)">Today</div>`;
        } else if(!isFuture){
          const done=mr&&tr2;const partial=mr||tr2;
          inner=`<div style="font-size:12px">${done?'✅':partial?'⏳':'⬜'}</div>`;
        } else {
          inner=`<div style="font-size:9px;color:var(--hint)">—</div>`;
        }
        grid+=`<td style="background:${cellBg};border:${cellBorder};border-radius:6px;height:38px;text-align:center;vertical-align:middle;transition:all .2s">${inner}</td>`;
      }
    });
    grid+=`</tr>`;
  });

  grid+=`</tbody></table>
    </div>
    <!-- Legend -->
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px">
      <span style="font-size:10px;color:var(--mut)">Legend:</span>
      <span style="font-size:10px">✅ Both reports in</span>
      <span style="font-size:10px">⏳ One still missing</span>
      <span style="font-size:10px">⬜ Neither submitted</span>
      <span style="font-size:10px;font-weight:600;color:var(--acc)">Blue = today</span>
    </div>
  </div>`;
  return grid;
}

function contextChoices(){
  let plans=[];
  if(S.role==='mentor')plans=mentorPlans();
  else if(S.role==='mentee'){const m=myPlan();plans=m?[m]:[];}
  const out=[];
  plans.forEach(p=>(p.depts||[]).forEach(d=>{if(d.status==='active')out.push({uid:p.uid,dept:d.dept,name:p.teacherName,day:d.currentDay||1});}));
  return out;
}
function contextBar(page){
  if(S.role==='mgmt')return'';
  const ch=contextChoices(); if(!ch.length)return'';
  const cur=ch.find(c=>c.uid===S.planUid&&c.dept===S.dept)||ch[0];
  if(cur.uid!==S.planUid||cur.dept!==S.dept){S.planUid=cur.uid;S.dept=cur.dept;setRD(cur.dept);}
  const who=S.role==='mentor'?esc(cur.name):'You';
  const label=`<div style="font-size:12px;color:var(--mut)">${S.role==='mentor'?'Mentoring':'Training'}: <b style="color:var(--txt)">${who}</b> · ${deptShort(cur.dept)} · ${dayLabel(cur.day)}</div>`;
  if(ch.length<2)return`<div style="margin:0 0 10px">${label}</div>`;
  return`<div class="filter" style="margin-bottom:10px;align-items:center;flex-wrap:wrap;gap:6px">
    <span style="font-size:11px;color:var(--mut);margin-right:4px">${S.role==='mentor'?'Whose':'Which department'}</span>
    ${ch.map(c=>`<button class="itab ${c.uid===cur.uid&&c.dept===cur.dept?'on':''}" onclick="switchContext('${c.uid}','${c.dept}','${page}')">${S.role==='mentor'?esc(c.name)+' · ':''}${deptShort(c.dept)} <span style="opacity:.6">${dayLabel(c.day)}</span></button>`).join('')}
  </div>`;
}
function switchContext(uid,dept,page){S.planUid=uid;S.dept=dept;setRD(dept);goPage(page);}

function openCompModal(compId){
  const p=getPlan(); if(!p)return;
  const it=(S.comp||[]).find(x=>x.id===compId); if(!it)return;
  const lv=compLevel(p.uid,it.id);
  const ck=compCheck(p.uid,it.id);
  const req=it.level_required||3;
  const maxSign=maxSignableLevel(p);
  const opts=[0,1,2,3,4].filter(n=>n<=maxSign||n===lv)
    .map(n=>`<option value="${n}" ${n===lv?'selected':''} ${n>maxSign?'disabled':''}>${n} · ${LEVEL_LABEL[n]}${n===req?'　← required':''}${n>maxSign?'　(not yours to sign)':''}</option>`).join('');
  // v32：以前只排除「我自己」，学员本人还留在选单里 ——
  // 安全类项目让被评核的人替自己背书，等於没有第二签名。
  // 现在也排除：被评核的学员，以及任何还在受训中的人。
  const _stillTraining=new Set((S.plans||[])
    .filter(x=>(x.depts||[]).some(d=>d.status==='active'))
    .map(x=>x.teacherCode));
  const people=(S.teachers||[]).filter(t=>
        t.id!==(S.me&&S.me.code)
     && t.id!==p.teacherCode
     && !_stillTraining.has(t.id)
     && !t.resigned)
    .map(t=>`<option value="${esc(t.id)}" ${ck&&ck.second_by_code===t.id?'selected':''}>${esc(t.name||t.id)}</option>`).join('');
  const ov=document.createElement('div');
  ov.className='overlay';
  ov.innerHTML=`<div class="modal">
    <div class="modal-hdr">
      <div class="modal-hdr-title">${esc(it.name)}<br>
        <span style="font-size:11px;font-weight:400;color:var(--mut)">${esc(p.teacherName)} · ${deptShort(it.dept)} · requires Level ${req}${it.is_safety?' · safety-critical':''}</span></div>
      <button class="modal-close" onclick="this.closest('.overlay').remove()">×</button>
    </div>
    <div class="modal-body">
      <div style="font-size:11px;font-weight:600;color:var(--mut);margin-bottom:5px">${isMine(p)?'What level are you at now':'What level is '+whoName(p)+' at now'}</div>
      <select id="cmLevel" style="width:100%;padding:9px;border:1px solid var(--bdr);border-radius:6px;font-size:13px">${opts}</select>
      <div style="font-size:11px;color:var(--mut);margin-top:6px">
        1 Knows · 2 Can do with supervision · 3 Can do independently · 4 Can teach others (= can mentor this item)<br>
        ${isMine(p)?'Level 1 you sign yourself':'Level 1 the new teacher signs'} · Levels 2 and 3 the Mentor signs · Level 4 management signs
      </div>
      <div style="margin-top:9px;background:var(--sur2);border-radius:6px;padding:8px 9px;font-size:11.5px;line-height:1.55">${signerHint(p)}${maxSign<req?`<br><b>This item needs Level ${req}</b>, which is above what you can sign — someone else has to close it.`:''}</div>
      ${it.is_safety?`<div style="margin-top:14px">
        <div style="font-size:11px;font-weight:600;color:var(--red);margin-bottom:5px">Safety-critical · reaching Level 3 needs a second signer</div>
        <div style="font-size:11px;color:var(--mut);margin-bottom:5px">Someone who watched them do it — not you, not ${esc(p.teacherName)}, and not another teacher still in training.</div>
        <select id="cmSecond" style="width:100%;padding:9px;border:1px solid var(--bdr);border-radius:6px;font-size:13px">
          <option value="">— Choose a second signer —</option>${people}</select>
      </div>`:''}
      <div style="margin-top:14px">
        <div style="font-size:11px;font-weight:600;color:var(--mut);margin-bottom:5px">Note (optional)</div>
        <textarea id="cmNote" rows="2" style="width:100%;padding:9px;border:1px solid var(--bdr);border-radius:6px;font-size:13px;font-family:inherit">${esc(ck&&ck.note||'')}</textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="this.closest('.overlay').remove()">${maxSign>0?'Cancel':'Close'}</button>
      ${maxSign>0?`<button class="btn btn-pri" onclick="submitCompLevel('${it.id}',this)">Save</button>`:''}
    </div>
  </div>`;
  ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});
  document.body.appendChild(ov);
}

async function submitCompLevel(compId,btn){
  const p=getPlan(); if(!p)return;
  const it=(S.comp||[]).find(x=>x.id===compId); if(!it)return;
  const maxSign=maxSignableLevel(p);
  if(maxSign<=0){alert('You cannot sign on this training plan — this page is view only for you.');return;}
  const lv=parseInt(document.getElementById('cmLevel').value,10);
  if(lv>maxSign){alert(signerHint(p));return;}
  const secEl=document.getElementById('cmSecond');
  const sec=secEl?secEl.value:'';
  const note=(document.getElementById('cmNote')||{}).value||'';
  if(it.is_safety&&lv>=3&&!sec){alert('This is safety-critical — reaching Level 3 needs a second signer.');return;}
  if(it.is_safety&&lv>=3&&sec===p.teacherCode){alert('The second signer cannot be the person being assessed.');return;}
  btn.disabled=true;btn.textContent='Saving…';
  const ok=await setCompLevel(p.uid,compId,it.dept,lv,sec,note);
  if(ok){const ov=btn.closest('.overlay');if(ov)ov.remove();renderCompetency();}
  else{btn.disabled=false;btn.textContent='Save';}
}
