<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TrainGo · v22</title>
<style>
:root{
  --layer:#236FAD;
  --d-srk:#C45C5C; --d-gak:#E8A04E; --d-atc:#7AB05A; --d-srt:#8B6CAE;
  --sur:#ffffff; --sur2:#f7f6f2; --bdr:#e0ddd6;
  --txt:#1a1a1a; --mut:#888888; --hint:#bbbbbb;
  --ok:#0F6E56; --warn:#854F0B; --danger:#A32D2D; --info:#236FAD;
  --layer-a:#eaf2f9; --layer-b:#cfe1f0; --layer-c:#8fb8d8;
  --ok-a:#e6f2ee; --warn-a:#fbf2e3; --danger-a:#f8ebeb;
  --ver-bg:#F9CB42;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow-x:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--sur2); color:var(--txt); font-size:14px; line-height:1.55; font-weight:400;
}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.35}
button,input,select,textarea{font-family:inherit;font-size:14px;color:var(--txt)}

/* ══ Row 1 · Topbar —— §4-26 八元件 ══════════════════ */
.topbar{
  background:var(--layer); color:#fff;
  min-height:56px; padding:0 14px;
  padding-top:env(safe-area-inset-top);
  display:flex; align-items:center; gap:10px;
  position:sticky; top:0; z-index:60;
  overflow-x:auto; scrollbar-width:none; white-space:nowrap;
}
.topbar::-webkit-scrollbar{display:none}
.tb-back{
  flex:0 0 auto; min-width:44px; min-height:44px;
  display:flex; align-items:center; justify-content:center;
  color:#fff; text-decoration:none; font-size:19px; border-radius:8px;
}
.tb-back:hover{background:rgba(255,255,255,.18)}
.brand{flex:0 0 auto;display:flex;align-items:center;gap:7px;font-size:15px;font-weight:600;min-height:44px}
.brand-ic{font-size:17px}
.ver{
  background:var(--ver-bg); color:var(--layer);
  font-size:10px; font-weight:700; border-radius:4px;
  padding:2px 6px; letter-spacing:.03em;
}
.ntabs{flex:0 0 auto;display:flex;gap:2px;margin-left:10px}
.ntab{
  background:none; border:0; border-bottom:2.5px solid transparent;
  color:rgba(255,255,255,.78); font-size:13px; font-weight:500;
  padding:0 13px; min-height:44px; cursor:pointer; white-space:nowrap;
}
.ntab:hover{color:#fff}
.ntab.on{color:#fff;border-bottom-color:#fff;font-weight:600}
.tb-right{flex:0 0 auto;display:flex;align-items:center;gap:8px;margin-left:24px;padding-right:6px}
.sync{
  display:inline-flex; align-items:center; gap:6px;
  background:rgba(255,255,255,.16); border:0; color:#fff;
  font-size:12px; font-weight:500; border-radius:16px;
  padding:0 13px; min-height:44px; cursor:pointer;
}
.sync:hover{background:rgba(255,255,255,.26)}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--hint);flex:0 0 auto}
.sync.ok  .dot{background:#6ee7b7}
.sync.bad .dot{background:#fca5a5}
.tb-btn{
  background:rgba(255,255,255,.16); border:0; color:#fff;
  font-size:12px; font-weight:500; padding:0 13px;
  min-height:44px; border-radius:8px; cursor:pointer; white-space:nowrap;
}
.tb-btn:hover{background:rgba(255,255,255,.26)}

/* ══ Row 3 · Filter ═══════════════════════════════════ */
.filterbar{
  background:var(--sur); border-bottom:.5px solid var(--bdr);
  padding:10px 14px; display:flex; gap:8px; align-items:center; flex-wrap:wrap
}
.srch{flex:1;min-width:150px;padding:0 12px;border:.5px solid var(--bdr);
  border-radius:8px;background:var(--sur2);min-height:44px}
.pill{
  border:.5px solid var(--bdr); background:var(--sur); color:var(--mut);
  padding:0 14px; border-radius:22px; font-size:12px; font-weight:500;
  cursor:pointer; min-height:44px
}
.pill.on{background:var(--layer);border-color:var(--layer);color:#fff;font-weight:600}
mark{background:#fdeeb0;color:inherit;border-radius:2px;padding:0 1px}

/* ══ Row 4-5 · Page ═══════════════════════════════════ */
.page{display:none;max-width:1200px;margin:0 auto;padding:16px 14px 80px}
.page.on{display:block}
.ptitle{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ptitle h2{font-size:17px}
.ptitle .sub{font-size:12px;color:var(--mut);font-weight:400}

.card{background:var(--sur);border:.5px solid var(--bdr);border-radius:12px;
  padding:16px;margin-bottom:10px}
.card-title{font-size:13px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.muted{color:var(--mut);font-size:12px;font-weight:400}
.hintx{color:var(--hint);font-size:12px}

.btn{background:var(--sur);border:.5px solid var(--bdr);color:var(--txt);
  padding:0 16px;border-radius:8px;font-size:13px;font-weight:500;
  cursor:pointer;min-height:44px}
.btn:hover{background:var(--sur2)}
.btn-pri{background:var(--layer);border-color:var(--layer);color:#fff;font-weight:600}
.btn-pri:hover{filter:brightness(1.08)}
.btn-dgr{background:var(--sur);border-color:var(--danger);color:var(--danger);font-weight:600}
.btn-sm{padding:0 12px;font-size:12px;min-height:44px}
.btn:disabled{opacity:.4;cursor:not-allowed}

.chip{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;
  border-radius:9px;letter-spacing:.03em;white-space:nowrap}
.c-layer{background:var(--layer-a);color:var(--layer)}
.c-ok{background:var(--ok-a);color:var(--ok)}
.c-warn{background:var(--warn-a);color:var(--warn)}
.c-dgr{background:var(--danger-a);color:var(--danger)}
.c-mut{background:var(--sur2);color:var(--mut)}

.alert{border-radius:9px;padding:12px 14px;font-size:13px;margin-bottom:10px;border:.5px solid}
.a-warn{background:var(--warn-a);border-color:#e6d2a8;color:var(--warn)}
.a-dgr{background:var(--danger-a);border-color:#e8c4c4;color:var(--danger)}
.a-ok{background:var(--ok-a);border-color:#bfe0d5;color:var(--ok)}
.a-info{background:var(--layer-a);border-color:var(--layer-b);color:var(--layer)}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;font-weight:600;color:var(--mut);
  text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;
  border-bottom:.5px solid var(--bdr);white-space:nowrap}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--txt)}
td{padding:9px 10px;border-bottom:.5px solid var(--bdr);height:32px;vertical-align:middle}
tr:last-child td{border-bottom:0}

/* ══ 梯级 ═════════════════════════════════════════════ */
.rung{display:inline-flex;align-items:center;justify-content:center;
  min-width:22px;height:22px;border-radius:5px;font-size:10px;font-weight:600}
.r0{background:var(--sur2);color:var(--hint);border:.5px dashed var(--bdr)}
.r1{background:var(--layer-a);color:var(--layer)}
.r2{background:var(--layer-b);color:var(--layer)}
.r3{background:var(--layer-c);color:#fff}
.r4{background:var(--layer);color:#fff}
.r5{background:var(--ok-a);color:var(--ok);border:.5px solid var(--ok)}
.r6{background:var(--ok);color:#fff}
.rx{background:var(--danger-a);color:var(--danger);border:.5px solid var(--danger)}
.ladder{display:flex;gap:3px;align-items:center;margin:8px 0}
.lstep{flex:1;height:6px;border-radius:3px;background:var(--sur2);border:.5px solid var(--bdr)}
.lstep.fill{background:var(--layer);border-color:var(--layer)}
.lstep.done{background:var(--ok);border-color:var(--ok)}

.ty{display:inline-block;width:19px;height:19px;line-height:18px;text-align:center;
  border-radius:5px;font-size:10px;font-weight:600}
.ty-K{background:var(--sur2);color:var(--mut);border:.5px solid var(--bdr)}
.ty-S{background:var(--layer-a);color:var(--layer)}
.ty-J{background:var(--warn-a);color:var(--warn)}
.ty-C{background:var(--danger-a);color:var(--danger);border:.5px solid var(--danger)}

.dept{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:9px;color:#fff}
.dp-CORE{background:var(--mut)} .dp-SRK{background:var(--d-srk)}
.dp-GAK{background:var(--d-gak)} .dp-ATC{background:var(--d-atc)}
.dp-SRT{background:var(--d-srt)}

/* ══ 模块七块 ═════════════════════════════════════════ */
.blk{border-left:3px solid var(--bdr);padding:2px 0 2px 13px;margin-bottom:16px}
.blk-h{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;
  letter-spacing:.06em;margin-bottom:6px}
.blk-why{border-left-color:var(--layer)}
.blk-std{border-left-color:var(--ok)}
.blk-step{border-left-color:var(--layer-c)}
.blk-see{border-left-color:var(--d-gak)}
.blk-do{border-left-color:var(--d-atc)}
.blk-if{border-left-color:var(--warn)}
.blk-pass{border-left-color:var(--ok)}
.stp{display:flex;gap:10px;margin-bottom:9px}
.stp-n{flex:0 0 22px;height:22px;border-radius:50%;background:var(--layer-a);
  color:var(--layer);font-size:11px;font-weight:600;
  display:flex;align-items:center;justify-content:center}
.stp-b{flex:1}
.stp-t{font-weight:600;font-size:13px}
.stp-d{font-size:13px}
.stp-w{font-size:12px;color:var(--warn);margin-top:3px}
.pc{background:var(--ok-a);border:.5px solid #bfe0d5;border-radius:7px;
  padding:9px 12px;font-size:13px;margin-bottom:6px}

/* ══ 工作视角 / 状态 ══════════════════════════════════ */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.wcell{background:var(--sur);border:.5px solid var(--bdr);border-radius:10px;
  padding:14px 13px;cursor:pointer;text-align:left;min-height:64px}
.wcell:hover{border-color:var(--layer);background:var(--layer-a)}
.wcell-n{font-size:11px;color:var(--mut);font-weight:500}
.wcell-t{font-size:13px;font-weight:600;margin-top:2px}
.wcell-c{font-size:11px;color:var(--mut);margin-top:4px}
.stat4{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:12px}
.st{background:var(--sur2);border-radius:9px;padding:12px 13px}
.st-l{font-size:11px;color:var(--mut);font-weight:500}
.st-n{font-size:21px;font-weight:600;margin-top:2px}
.bar{height:5px;background:var(--bdr);border-radius:3px;margin-top:7px;overflow:hidden}
.bar-f{height:100%;background:var(--layer);border-radius:3px}
.bar-f.ok{background:var(--ok)}

/* ══ 技能矩阵 ═════════════════════════════════════════ */
.mx-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.mx{border-collapse:separate;border-spacing:2px;font-size:11px;width:auto}
.mx th{padding:4px 2px;font-size:10px;text-transform:none;letter-spacing:0;border:0;
  text-align:center;vertical-align:bottom;width:30px;min-width:30px;color:var(--mut)}
.mx th .ic{font-size:15px;line-height:1.2}
.mx th .no{font-size:9px;font-weight:600}
.mx td{padding:0;border:0;height:auto}
.mx .nm{font-weight:500;white-space:nowrap;padding-right:9px;text-align:left;
  width:auto;min-width:0;position:sticky;left:0;background:var(--sur);z-index:2}
.mxkey{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:3px 14px;margin-top:12px}
.mxkey div{font-size:11px;color:var(--mut)}
.mxkey b{color:var(--txt);font-weight:600}
.cellx{width:26px;height:26px;border-radius:5px;display:flex;align-items:center;
  justify-content:center;font-size:10px;font-weight:600}

/* ══ 管理页 —— §4-24 铁则二 可量测规格 ════════════════ */
.mg{border-radius:16px;border:.5px solid var(--bdr);background:var(--sur);
  padding:16px 18px;margin-bottom:12px}
.mg-h{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;
  letter-spacing:.06em;margin-bottom:10px}
.mg-l{font-size:12px;line-height:2}
.mg-v{background:var(--sur2);border-radius:4px;font-size:11px;padding:1px 6px}
.mg-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mg-acc{background:none;border:0;padding:0;cursor:pointer;width:100%;text-align:left;
  min-height:44px;display:flex;align-items:center;gap:8px}

/* ══ 闸门 · Modal · Toast ═════════════════════════════ */
.gate{position:fixed;inset:0;background:var(--layer);display:flex;
  align-items:center;justify-content:center;padding:20px;z-index:200}
.gate-box{background:var(--sur);border-radius:16px;padding:32px 26px;
  width:100%;max-width:380px;text-align:center}
.gate-ic{font-size:38px}
.gate-box h1{font-size:22px;margin:6px 0 4px}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:150}
.ov.on{display:block}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  background:var(--sur);border-radius:14px;width:min(560px,94vw);
  max-height:88vh;overflow:auto;z-index:160;display:none}
.modal.on{display:block}
.m-hdr{padding:16px 18px;border-bottom:.5px solid var(--bdr);display:flex;align-items:center;gap:10px}
.m-hdr h3{font-size:15px;flex:1}
.m-x{background:none;border:0;font-size:20px;color:var(--mut);cursor:pointer;
  width:44px;height:44px;border-radius:8px}
.m-body{padding:18px}
.m-foot{padding:14px 18px;border-top:.5px solid var(--bdr);display:flex;gap:9px;align-items:center}
.m-foot .sp{flex:1}
.toast{position:fixed;right:16px;bottom:16px;background:var(--txt);color:#fff;
  padding:11px 17px;border-radius:9px;font-size:13px;font-weight:500;
  opacity:0;transition:opacity .2s;z-index:300;display:flex;align-items:center;gap:10px}
.toast.on{opacity:1}
.toast button{background:rgba(255,255,255,.22);border:0;color:#fff;
  border-radius:6px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;min-height:32px}

.fld{margin-bottom:13px}
.fld label{display:block;font-size:12px;font-weight:500;color:var(--mut);margin-bottom:5px}
.fld .req{color:var(--danger)}
.fld input,.fld select,.fld textarea{width:100%;padding:10px 12px;
  border:.5px solid var(--bdr);border-radius:8px;background:var(--sur2);min-height:44px}
.fld textarea{min-height:76px;resize:vertical}
.opt{display:block;width:100%;text-align:left;border:.5px solid var(--bdr);
  background:var(--sur);border-radius:9px;padding:13px 15px;margin-bottom:8px;
  cursor:pointer;font-size:13px;min-height:48px}
.opt.on{border-width:1.5px;font-weight:600}
.opt.o-ok.on{border-color:var(--ok);background:var(--ok-a);color:var(--ok)}
.opt.o-warn.on{border-color:var(--warn);background:var(--warn-a);color:var(--warn)}
.opt.o-dgr.on{border-color:var(--danger);background:var(--danger-a);color:var(--danger)}
.empty{text-align:center;padding:38px 18px;color:var(--mut)}
.empty .big{font-size:30px;margin-bottom:9px}

@media print{
  .topbar,.filterbar,.btn,.tb-btn,.toast,.ov,.modal,.mg-btns{display:none!important}
  .page{display:block!important;padding:0}
  body{background:#fff;font-size:11pt}
  .card,.mg{break-inside:avoid;border:.5px solid #ccc}
  .print-sign{display:block!important;margin-top:28px;border-top:1px solid #999;width:220px;padding-top:6px}
}
.print-sign{display:none}
@media(max-width:480px){
  .page{padding:13px 11px 80px}
  .wgrid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<!-- ══ 未登入闸门（平台同源 SSO，本系统不设密码、不设登出）══ -->
<div class="gate" id="gate">
  <div class="gate-box">
    <div class="gate-ic">🎓</div>
    <h1>TrainGo</h1>
    <div class="muted">Academee 老师训练系统</div>
    <div class="alert a-info" id="gateMsg" style="margin-top:18px;text-align:left">正在确认登入状态…</div>
    <a class="btn btn-pri" id="gateBtn" href="../index.html" style="display:none;width:100%;text-decoration:none;display:none">← 回平台首页登入</a>
  </div>
</div>

<!-- ══ MAIN ═══════════════════════════════════════════════ -->
<div id="app" style="display:none">

  <!-- Row 1 · Topbar（§4-26 八元件，顺序固定）-->
  <div class="topbar">
    <a class="tb-back" href="../index.html" title="回平台">←</a>
    <div class="brand"><span class="brand-ic">🎓</span>TrainGo<span class="ver" id="verBadge">v22</span></div>
    <div class="ntabs" id="nav">
      <button class="ntab" data-p="today"   onclick="go('today')">今天</button>
      <button class="ntab" data-p="learn"   onclick="go('learn')">我的训练</button>
      <button class="ntab" data-p="verify"  onclick="go('verify')">验证</button>
      <button class="ntab" data-p="matrix"  onclick="go('matrix')">技能矩阵</button>
      <button class="ntab" data-p="people"  onclick="go('people')">梯队</button>
      <button class="ntab" data-p="library" onclick="go('library')">模块库</button>
      <button class="ntab" data-p="manage"  onclick="go('manage')">管理</button>
    </div>
    <div class="tb-right">
      <button class="sync" id="sync" onclick="reloadAll()" title="点一下重新载入"><i class="dot"></i><span id="syncTxt">连线中</span></button>
      <button class="tb-btn" onclick="doExport()">↓ Export</button>
      <button class="tb-btn" id="btnImport" onclick="el('impFile').click()">↑ Import</button>
      <input type="file" id="impFile" accept=".json" style="display:none" onchange="doImport(event)">
    </div>
  </div>

  <!-- Row 3 · Filter -->
  <div class="filterbar" id="filterbar" style="display:none">
    <input class="srch" id="srch" placeholder="搜寻模块…" oninput="onSearch()">
    <button class="pill" id="clrBtn" style="display:none" onclick="clearSearch()">✕ 清除</button>
    <span id="deptPills"></span>
  </div>

  <!-- Row 4-5 · Title + Content -->
  <div class="page" id="p-today"></div>
  <div class="page" id="p-learn"></div>
  <div class="page" id="p-verify"></div>
  <div class="page" id="p-matrix"></div>
  <div class="page" id="p-people"></div>
  <div class="page" id="p-library"></div>
  <div class="page" id="p-manage"></div>
</div>

<div class="ov" id="ov" onclick="closeModal()"></div>
<div class="modal" id="modal">
  <div class="m-hdr"><h3 id="mTitle"></h3><button class="m-x" onclick="closeModal()">✕</button></div>
  <div class="m-body" id="mBody"></div>
  <div class="m-foot" id="mFoot"></div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ══════════════════════════════════════════════════════════════
// TrainGo · MODULES — 训练内容写在档里
// 不写死老师 / 学生 / 班级名单；进度 · 验证 · 梯队 · 老师一律读云端
// 版本常数在主程式（APP_VERSION / ARCH_VERSION / STD_VERSION）
// ══════════════════════════════════════════════════════════════

// 7 段工作视角（四部门共用骨架）
const SEGMENTS=[
  {id:'s1',n:'①',t:'上班后',     q:'我上班后做什么？'},
  {id:'s2',n:'②',t:'学生到了',   q:'学生来了怎么办？'},
  {id:'s3',n:'③',t:'上课中',     q:'我要怎样开始一堂课？'},
  {id:'s4',n:'④',t:'功课',       q:'怎样教 / 检查 / 批改？'},
  {id:'s5',n:'⑤',t:'行为',       q:'学生不听话怎么办？'},
  {id:'s6',n:'⑥',t:'放学',       q:'放学怎样处理？'},
  {id:'s7',n:'⑦',t:'回家前',     q:'什么必须完成才能回家？'},
];

// 六级梯（0 = 未开始）
const RUNGS=[
  {r:0,k:'NOT STARTED',t:'未开始', d:'还没开始'},
  {r:1,k:'LEARN',      t:'读过',   d:'读完 为什么 / 标准 / 步骤 / 异常'},

// ══ 工具（Universal Standard §13）══════════════════════════════
function el(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function genId(p){return p+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);}
function isoToday(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function fmtDate(ds){ if(!ds)return '—';
  return new Date(String(ds).slice(0,10)+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}
function addDays(ds,n){const d=new Date(ds+'T12:00:00');d.setDate(d.getDate()+n);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function addMonths(ds,n){const d=new Date(ds+'T12:00:00');d.setMonth(d.getMonth()+n);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function daysBetween(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);}
function csvCell(v){const s=String(v==null?'':v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function hi(s){ const q=S.ui.q; if(!q)return esc(s);
  const i=String(s).toLowerCase().indexOf(q); if(i<0)return esc(s);
  return esc(String(s).slice(0,i))+'<mark>'+esc(String(s).substr(i,q.length))+'</mark>'+esc(String(s).slice(i+q.length));}
function saveUi(){ try{localStorage.setItem(UIKEY,JSON.stringify({advOpen:S.ui.advOpen}));}catch(e){} }
function loadUi(){ try{const r=localStorage.getItem(UIKEY); if(r)S.ui.advOpen=!!JSON.parse(r).advOpen;}catch(e){} }

// ══ Toast（右下 2 秒；§4-09 Undo 30 秒）═══════════════════════
let toastT=null, undoFn=null, undoT=null;
function toast(msg,undoLabel,fn){
  const t=el('toast');
  t.innerHTML='<span>'+esc(msg)+'</span>'+(undoLabel?'<button onclick="runUndo()">'+esc(undoLabel)+'</button>':'');
  t.classList.add('on'); clearTimeout(toastT);
  toastT=setTimeout(()=>t.classList.remove('on'),undoLabel?30000:2000);
  if(fn){ undoFn=fn; clearTimeout(undoT); undoT=setTimeout(()=>{undoFn=null;},30000); }
}
function runUndo(){ if(undoFn){const f=undoFn;undoFn=null;el('toast').classList.remove('on');f();} }

// ══ 开机：同源 SSO ════════════════════════════════════════════
async function boot(){
  loadUi();
  el('verBadge').textContent=APP_VERSION;
  document.title='TrainGo · '+APP_VERSION;
  if(!sb){ gate('读不到云端程式库。请检查网络后重新整理。<b>没有任何资料被改动。</b>'); return; }
  let session=null;
  try{ const r=await sb.auth.getSession(); session=r.data.session; }catch(e){}
  if(!session){ gate('你还没有登入 Academee 平台。<br>本系统与平台共用同一个登入，请先回首页登入。'); return; }
  let me=null;
  try{
    const {data,error}=await sb.rpc('traingo_me');
    if(error) throw error;
    me=(data&&data[0])||null;
  }catch(e){ gate('读不到你的身份资料：'+esc(e.message||e)+'<br><b>没有任何资料被改动。</b>'); return; }
  if(!me){ gate('你的平台帐号还没有建立资料（users_meta）。请管理层先设定。'); return; }
  S.me={
    code:me.teacher_code, role:me.role, name:me.display_name, isAdmin:!!me.is_admin,
    see:{SRK:!!me.srk_see,GAK:!!me.gak_see,ATC:!!me.atc_see,SRT:!!me.srt_see},
    edit:{SRK:!!me.srk_edit,GAK:!!me.gak_edit,ATC:!!me.atc_edit,SRT:!!me.srt_edit},
  };
  if(!Object.values(S.me.see).some(Boolean)){
    gate('你的角色（'+esc(S.me.role)+'）没有任何部门的 TrainGo 权限。'); return;
  }
  el('gate').style.display='none';
  el('app').style.display='block';
  buildNav();
  await reloadAll();
  go('today');
}
function gate(msg){ el('gateMsg').innerHTML=msg; el('gateBtn').style.display='block'; }

function myDepts(){ return DEPTS.filter(d=>d!=='CORE'&&S.me&&S.me.see[d]); }
function canEditDept(d){ return !!(S.me&&S.me.edit[d]); }

function buildNav(){
  document.querySelectorAll('.ntab').forEach(b=>{
    const show=(b.dataset.p==='manage')?S.me.isAdmin:true;   // §4-24 铁则一
    b.style.display=show?'':'none';

}

// ══ 载入（读不到就停下，不写回任何东西）══════════════════════
async function reloadAll(){
  setSync('连线中','');
  try{
    const [t,c,p,v]=await Promise.all([
      sb.from('teachers').select('id,name,status,resigned').order('id'),
      sb.from('traingo_cohort').select('*'),
      sb.from('traingo_progress').select('*'),
      sb.from('traingo_verification').select('*').order('verified_at',{ascending:false}).limit(500),
    ]);
    for(const r of [t,c,p,v]) if(r.error) throw r.error;
    S.teachers=(t.data||[]).filter(x=>!x.resigned);
    S.cohorts=c.data||[];
    S.progress={}; (p.data||[]).forEach(x=>{S.progress[x.teacher_code+'__'+x.module_id]=x;});
    S.verifs=v.data||[];
    S.ready=true; S.err=null; setSync('已同步','ok');
  }catch(e){
    S.ready=false; S.err=e.message||String(e); setSync('读取失败','bad');
  }
  refresh();
}
function setSync(txt,cls){
  const s=el('sync'); if(!s)return;
  s.className='sync'+(cls?' '+cls:''); el('syncTxt').textContent=txt;
}
function cloudGuard(){
  if(S.err) return `<div class="alert a-dgr">⛔ 读不到云端：${esc(S.err)}<br><b>没有任何资料被改动。</b>请重新整理，不要在这个状态下输入资料。</div>`;
  if(!S.ready) return `<div class="alert a-info">正在读取云端资料…</div>`;
  return '';
}

// ══ 进度模型（人 × 模块）══════════════════════════════════════
function pkey(code,mid){return code+'__'+mid;}
function rungOf(code,mid){const p=S.progress[pkey(code,mid)];return p?(p.rung||0):0;}
function goalOf(m){return TYPES[m.type].goal;}
function expiryOf(code,m){
  const p=S.progress[pkey(code,m.id)]; if(!p||!p.passed_at)return null;
  const vm=(m.validMonths!=null)?m.validMonths:TYPES[m.type].vm;
  if(!vm)return null; return addMonths(String(p.passed_at).slice(0,10),vm);
}
function isExpired(code,m){const e=expiryOf(code,m);return e?e<isoToday():false;}
function expiringSoon(code,m){const e=expiryOf(code,m);
  if(!e)return false; const d=daysBetween(isoToday(),e); return d>=0&&d<=30;}
function cohortOf(code){return S.cohorts.find(c=>c.mentee_code===code&&c.status==='active')||null;}
function deptOf(code){ const c=cohortOf(code); return c?c.dept:(myDepts()[0]||'ATC'); }
const DUE_BY_TYPE={C:5,S:10,J:14,K:1};
function dueDateOf(code,m){
  const c=cohortOf(code); if(!c||!c.start_date)return null;
  const d=(m.targetDay!=null)?m.targetDay:DUE_BY_TYPE[m.type];
  return addDays(String(c.start_date).slice(0,10),d);
}
function isOverdue(code,m){
  if(rungOf(code,m.id)>=goalOf(m))return false;
  const d=dueDateOf(code,m); return d?d<isoToday():false;
}
function verifierNeededFor(m,rung){
  if(rung<=2)return 'self';
  if(rung<=4)return 'mentor';
  return (m.type==='C')?'dual':'verifier';
}
function iAmMentorOf(code){return S.cohorts.some(c=>c.mentee_code===code&&c.mentor_code===S.me.code&&c.status==='active');}
function canIAdvance(m,code,rung){
  const dept=(m.dept==='CORE')?deptOf(code):m.dept;
  if(!canEditDept(dept))return false;
  if(rung<=2) return code===S.me.code||iAmMentorOf(code)||S.me.isAdmin;
  if(code===S.me.code)return false;                 // 不准自己签自己（DB 也挡）
  return iAmMentorOf(code)||S.me.isAdmin;
}
function statusOf(code){
  const dept=deptOf(code), mods=modulesForDept(dept);
  const grp=t=>mods.filter(m=>m.type===t);
  const pct=(arr,fn)=>arr.length?Math.round(arr.filter(fn).length/arr.length*100):100;
  const K=pct(grp('K'),m=>rungOf(code,m.id)>=1);
  const Sp=pct(grp('S'),m=>rungOf(code,m.id)>=6);
  const V=pct(mods.filter(m=>['S','J','C'].includes(m.type)),m=>rungOf(code,m.id)>=5);
  const C=pct(grp('C'),m=>rungOf(code,m.id)>=6&&!isExpired(code,m));
  const J=pct(grp('J'),m=>rungOf(code,m.id)>=5);
  const anyExpired=grp('C').some(m=>isExpired(code,m));
  let st='IN TRAINING';
  if(anyExpired) st='EXPIRED';
  else if(C<100) st='IN TRAINING';
  else if(Sp>=90&&J>=100) st='INDEPENDENT';
  else st='SUPERVISED';
  return {K:K,S:Sp,V:V,C:C,J:J,status:st,dept:dept,mods:mods};
}
const ST_CLS={'INDEPENDENT':'c-ok','SUPERVISED':'c-warn','IN TRAINING':'c-layer','EXPIRED':'c-dgr'};

const RENDER={today:renderToday,learn:renderLearn,verify:renderVerify,
              matrix:renderMatrix,people:renderPeople,library:renderLibrary,manage:renderManage};
function go(p){
  if(p==='manage'&&!S.me.isAdmin) p='today';        // 守卫在最前面，不先渲染再踢
  S.page=p;
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.ntab').forEach(x=>x.classList.remove('on'));
  el('p-'+p).classList.add('on');
  const tab=document.querySelector('.ntab[data-p="'+p+'"]'); if(tab)tab.classList.add('on');
  el('filterbar').style.display=(p==='library'||p==='learn')?'flex':'none';
  (RENDER[p]||renderToday)();
}
function refresh(){ if(S.me) (RENDER[S.page]||renderToday)(); }
function onSearch(){ S.ui.q=el('srch').value.trim().toLowerCase();
  el('clrBtn').style.display=S.ui.q?'':'none'; refresh(); }
function clearSearch(){ el('srch').value=''; S.ui.q=''; el('clrBtn').style.display='none'; refresh(); }
function setDept(d){ S.ui.dept=d; refresh(); }
function deptPillsHtml(){
  return ['ALL','CORE'].concat(myDepts()).map(d=>
    `<button class="pill ${S.ui.dept===d?'on':''}" onclick="setDept('${d}')">${d==='ALL'?'全部':d}</button>`).join(' ');
}
function sortBy(k){
  if(S.ui.sortKey!==k){S.ui.sortKey=k;S.ui.sortDir=1;}
  else if(S.ui.sortDir===1)S.ui.sortDir=-1;
  else {S.ui.sortKey=null;S.ui.sortDir=0;}
  refresh();
}
function sortArrow(k){ if(S.ui.sortKey!==k)return ''; return S.ui.sortDir===1?' ▲':' ▼'; }
function applySort(rows,map){
  if(!S.ui.sortKey||!map[S.ui.sortKey])return rows;
  const f=map[S.ui.sortKey], d=S.ui.sortDir;
  return rows.slice().sort((a,b)=>{const x=f(a),y=f(b);return (x>y?1:x<y?-1:0)*d;});
}

// ══ 共用片段 ══════════════════════════════════════════════════
function rungChip(code,m){
  if(isExpired(code,m))return '<span class="rung rx" title="已过期">!</span>';
  const r=rungOf(code,m.id);
  return `<span class="rung r${r}" title="${RUNGS[r].k} · ${RUNGS[r].t}">${r}</span>`;
}
function ladderBar(code,m){
  const r=rungOf(code,m.id), g=goalOf(m); let h='<div class="ladder">';
  for(let i=1;i<=6;i++) h+=`<div class="lstep ${(r>=g&&i<=r)?'done':(i<=r?'fill':'')}" title="${RUNGS[i].t}"></div>`;
  return h+'</div>';
}
function typeBadge(m){return `<span class="ty ty-${m.type}" title="${TYPES[m.type].t} · ${TYPES[m.type].z}">${m.type}</span>`;}
function deptBadge(m){return `<span class="dept dp-${m.dept}">${m.dept}</span>`;}
function teacherName(code){const t=S.teachers.find(x=>x.id===code);return t?t.name:code;}

// ══ 今天 ══════════════════════════════════════════════════════
function renderToday(){
  let h=cloudGuard();
  const code=S.me.code, known=S.teachers.some(t=>t.id===code), st=statusOf(code), c=cohortOf(code);
  h+=`<div class="ptitle"><h2>👋 早，${esc(S.me.name||code)}</h2>
      <span class="chip c-mut">${esc(S.me.role)}</span>`;
  if(known) h+=`<span class="chip ${ST_CLS[st.status]}">${st.status}</span>`;
  if(c) h+=`<span class="sub">${c.dept} · 第 ${daysBetween(String(c.start_date).slice(0,10),isoToday())+1} 天</span>`;
  h+=`</div>`;
  if(!known){
    h+=`<div class="alert a-warn">你的代号 <b>${esc(code)}</b> 不在老师名册里，所以没有自己的训练进度。
        名册的 Owner 是 MasterHub — Teacher，本系统只读不写。</div>`;
  }else{
    const todo=todayTasks(code,st.mods);
    h+=`<div class="card"><div class="card-title">今天必须完成 ${todo.length?`<span class="chip c-layer">${todo.length}</span>`:''}</div>`;
    if(!todo.length) h+='<div class="muted">今天没有到期的项目。</div>';
    todo.forEach(m=>{
      const d=dueDateOf(code,m);
      h+=`<div style="display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:.5px solid var(--bdr)">
        ${rungChip(code,m)}${typeBadge(m)}
        <div style="flex:1;min-width:0"><div style="font-weight:500">${esc(m.nameZh)}</div>
        <div class="muted">${isExpired(code,m)
          ?`已过期 · 需重新验证（${fmtDate(expiryOf(code,m))} 到期）`
          :`${RUNGS[rungOf(code,m.id)].t} → ${RUNGS[Math.min(rungOf(code,m.id)+1,6)].t}${d?` · 期限 ${fmtDate(d)}`:''}`}</div></div>
        ${isOverdue(code,m)?'<span class="chip c-dgr">逾期</span>':''}
        <button class="btn btn-sm btn-pri" onclick="openModule('${m.id}','${code}')">打开</button></div>`;
    });
    h+='</div>';
    h+='<div class="card"><div class="card-title">我现在要做什么</div><div class="wgrid">';
    SEGMENTS.forEach(s=>{
      const n=st.mods.filter(m=>m.seg===s.id).length;
      h+=`<button class="wcell" onclick="openSeg('${s.id}')"><div class="wcell-n">${s.n}</div>
        <div class="wcell-t">${s.t}</div><div class="wcell-c">${s.q} · ${n} 个模块</div></button>`;
    });
    h+='</div></div>'+statusCard(code,st);
  }
  if(S.me.isAdmin||myDepts().some(canEditDept)) h+=mgmtPanel();
  el('p-today').innerHTML=h;
}
function todayTasks(code,mods){
  return mods.filter(m=>rungOf(code,m.id)<goalOf(m)||isExpired(code,m))
    .sort((a,b)=>{
      const ex=m=>isExpired(code,m)?0:1; if(ex(a)!==ex(b))return ex(a)-ex(b);
      const od=m=>isOverdue(code,m)?0:1; if(od(a)!==od(b))return od(a)-od(b);
      const w={C:0,S:1,J:2,K:3}; if(w[a.type]!==w[b.type])return w[a.type]-w[b.type];
      return rungOf(code,b.id)-rungOf(code,a.id);
    }).slice(0,3);
}
function statusCard(code,st){
  const row=(l,v,ok)=>`<div class="st"><div class="st-l">${l}</div><div class="st-n">${v}%</div>
    <div class="bar"><div class="bar-f ${ok?'ok':''}" style="width:${v}%"></div></div></div>`;
  return `<div class="card"><div class="card-title">我的状态</div><div class="stat4">
    ${row('Knowledge',st.K,st.K>=100)}${row('Practice',st.S,st.S>=90)}
    ${row('Live Verification',st.V,st.V>=90)}${row('Critical Skills',st.C,st.C>=100)}</div>
    <div style="display:flex;align-items:center;gap:9px"><span class="muted">STATUS</span>
    <span class="chip ${ST_CLS[st.status]}" style="font-size:12px;padding:4px 11px">${st.status}</span></div>
    ${st.status!=='INDEPENDENT'?`<div class="muted" style="margin-top:8px">${st.C<100
      ?'还有 Critical 模块未通过 —— 这是独立上岗的硬门槛。'
      :'Critical 已全过。把 Skill 类推到 90% 以上就能转 INDEPENDENT。'}</div>`:''}</div>`;
}
function mgmtPanel(){
  const pend=MODULES.filter(m=>m.pending).length;
  let alerts=[],exp=[];
  S.teachers.forEach(t=>{ if(!cohortOf(t.id))return;
    const st=statusOf(t.id);
    st.mods.forEach(m=>{
      if(isExpired(t.id,m))exp.push({t:t,m:m,k:'过期'});
      else if(expiringSoon(t.id,m))exp.push({t:t,m:m,k:'30 天内'});
      if(isOverdue(t.id,m)&&m.type==='C')alerts.push({t:t,m:m});
    });
  });
  let h=`<div class="card"><div class="card-title">全公司训练状况</div><div class="stat4">
    <div class="st"><div class="st-l">进行中梯队</div><div class="st-n">${S.cohorts.filter(c=>c.status==='active').length}</div></div>
    <div class="st"><div class="st-l">在职老师</div><div class="st-n">${S.teachers.length}</div></div>
    <div class="st"><div class="st-l">Critical 逾期</div><div class="st-n" style="color:${alerts.length?'var(--danger)':'inherit'}">${alerts.length}</div></div>
    <div class="st"><div class="st-l">到期 / 将到期</div><div class="st-n" style="color:${exp.length?'var(--warn)':'inherit'}">${exp.length}</div></div></div>`;
  if(pend) h+=`<div class="alert a-warn">⚠️ 有 <b>${pend}</b> 个模块还没有内容（多数是 Critical）。到「模块库」看清单。</div>`;
  if(exp.length){
    h+='<table><thead><tr><th>老师</th><th>模块</th><th>到期</th><th></th></tr></thead><tbody>';
    exp.slice(0,15).forEach(e=>{h+=`<tr><td>${esc(teacherName(e.t.id))}</td><td>${esc(e.m.nameZh)}</td>
      <td>${fmtDate(expiryOf(e.t.id,e.m))}</td><td><span class="chip ${e.k==='过期'?'c-dgr':'c-warn'}">${e.k}</span></td></tr>`;});
    h+='</tbody></table>';
  }
  return h+'</div>';
}
function openSeg(sid){
  const code=S.me.code, st=statusOf(code), s=SEGMENTS.find(x=>x.id===sid);
  const mods=st.mods.filter(m=>m.seg===sid);
  let b=`<div class="muted" style="margin-bottom:12px">${s.q}</div>`;
  if(!mods.length) b+='<div class="empty">这一段还没有模块。</div>';
  mods.forEach(m=>{ b+=`<button class="opt" onclick="closeModal();openModule('${m.id}','${code}')">
    ${rungChip(code,m)} ${typeBadge(m)} ${esc(m.nameZh)}
    <div class="muted" style="margin-top:3px">${esc(m.name)}${m.pending?' · ⛔ 内容待提供':''}</div></button>`; });
  openModal(`${s.n} ${s.t}`,b,'<div class="sp"></div><button class="btn" onclick="closeModal()">关闭</button>');
}

// ══ 我的训练 ══════════════════════════════════════════════════
function renderLearn(){
  el('deptPills').innerHTML=deptPillsHtml();
  const code=S.ui.viewCode||S.me.code;
  let h=cloudGuard();
  const st=statusOf(code);
  h+=`<div class="ptitle"><h2>${esc(teacherName(code))} 的训练地图</h2>
     <span class="chip ${ST_CLS[st.status]}">${st.status}</span>
     ${(S.me.isAdmin||S.cohorts.some(c=>c.mentor_code===S.me.code))
       ?'<div style="flex:1"></div><button class="btn btn-sm" onclick="pickWho()">换人看</button>':''}</div>`;
  const q=S.ui.q,dp=S.ui.dept;
  const mods=st.mods.filter(m=>(dp==='ALL'||m.dept===dp)&&(!q||(m.nameZh+m.name+m.id).toLowerCase().includes(q)));
  ['C','S','J','K'].forEach(ty=>{
    const g=mods.filter(m=>m.type===ty); if(!g.length)return;
    const done=g.filter(m=>rungOf(code,m.id)>=goalOf(m)&&!isExpired(code,m)).length;
    h+=`<div class="card"><div class="card-title">${typeBadge({type:ty})} ${TYPES[ty].t} · ${TYPES[ty].z}
      <span class="muted" style="margin-left:auto">${done}/${g.length}</span></div>`;
    g.forEach(m=>{
      const r=rungOf(code,m.id),gl=goalOf(m),ok=r>=gl&&!isExpired(code,m);
      h+=`<div style="padding:10px 0;border-bottom:.5px solid var(--bdr)">
        <div style="display:flex;gap:9px;align-items:center">${rungChip(code,m)}
        <div style="flex:1;min-width:0"><div style="font-weight:500">${hi(m.nameZh)} ${m.pending?'<span class="chip c-warn">待提供</span>':''}</div>
        <div class="muted">${hi(m.name)} · ${RUNGS[r].t} / 目标 ${RUNGS[gl].t}${isExpired(code,m)?' · <span style="color:var(--danger)">已过期</span>':''}</div></div>
        ${ok?'<span class="chip c-ok">达标</span>':''}
        <button class="btn btn-sm" onclick="openModule('${m.id}','${code}')">打开</button></div>
        ${ladderBar(code,m)}</div>`;
    });
    h+='</div>';
  });
  if(!mods.length) h+=`<div class="empty"><div class="big">🔍</div>No matching results
    <div style="margin-top:10px"><button class="btn btn-sm" onclick="clearSearch()">Clear search</button></div></div>`;
  el('p-learn').innerHTML=h;
}
function pickWho(){
  const list=S.me.isAdmin?S.teachers:S.teachers.filter(t=>iAmMentorOf(t.id)||t.id===S.me.code);
  let b=list.map(t=>`<button class="opt" onclick="S.ui.viewCode='${esc(t.id)}';closeModal();renderLearn()">
    ${esc(t.name)} <span class="muted">${esc(t.id)}</span></button>`).join('');
  if(!b) b='<div class="empty">没有可看的对象。</div>';
  openModal('看谁的训练地图',b,'<div class="sp"></div><button class="btn" onclick="closeModal()">关闭</button>');
}

// ══ 模块详情（七块）══════════════════════════════════════════
function openModule(mid,code){
  const m=moduleById(mid); if(!m)return; code=code||S.me.code;
  const r=rungOf(code,mid), gl=goalOf(m);
  let b='';
  if(m.pending) b+=`<div class="alert a-warn">⛔ 这个模块的内容还没有提供。${m.note?esc(m.note):''}</div>`;
  else if(m.note) b+=`<div class="muted" style="margin-bottom:10px">${esc(m.note)}</div>`;
  b+=`<div style="display:flex;gap:7px;align-items:center;margin-bottom:14px;flex-wrap:wrap">
    ${typeBadge(m)}${deptBadge(m)}<span class="chip c-mut">${esc(m.when)}</span>
    <span class="muted">目标：${RUNGS[gl].t}</span></div>`;
  b+=`<div class="card" style="background:var(--sur2);margin-bottom:16px">
    <div style="display:flex;align-items:center;gap:9px">${rungChip(code,m)}<b>${RUNGS[r].t}</b>
    <span class="muted">${RUNGS[r].d}</span></div>${ladderBar(code,m)}
    ${advanceBtns(m,code,r,gl)}</div>`;
  const blk=(cls,h2,body)=>body?`<div class="blk ${cls}"><div class="blk-h">${h2}</div>${body}</div>`:'';
  b+=blk('blk-why','A · 为什么',esc(m.why));
  b+=blk('blk-std','B · 正确长什么样',esc(m.standard));
  if(m.steps&&m.steps.length){ let s='';
    m.steps.forEach(x=>{s+=`<div class="stp"><div class="stp-n">${x.n}</div><div class="stp-b">
      <div class="stp-t">${esc(x.t)}</div><div class="stp-d">${esc(x.d)}</div>
      ${x.w?`<div class="stp-w">${esc(x.w)}</div>`:''}</div></div>`;});
    b+=blk('blk-step','C · 步骤',s); }
  b+=blk('blk-see','D · 看真实示范',esc(m.seeIt)||'<span class="hintx">（素材待补）</span>');
  b+=blk('blk-do','E · 自己做一次',esc(m.doIt)||'<span class="hintx">（待补）</span>');
  if(m.whatIf&&m.whatIf.length)
    b+=blk('blk-if','F · 异常与常见错',m.whatIf.map(w=>`<div style="margin-bottom:5px">• ${esc(w)}</div>`).join(''));
  if(m.pass&&m.pass.length)
    b+=blk('blk-pass','G · 通过标准',m.pass.map(p=>`<div class="pc">${esc(p)}</div>`).join(''));
  if(m.age) b+=`<div class="blk"><div class="blk-h">年龄差异</div><table><tbody>
    <tr><td><b>🟠 JR</b></td><td>${esc(m.age.jr)}</td></tr>
    <tr><td><b>🔵 IN</b></td><td>${esc(m.age.in_)}</td></tr>
    <tr><td><b>🟢 SR</b></td><td>${esc(m.age.sr)}</td></tr></tbody></table></div>`;
  b+='<div class="muted" style="margin-top:14px">English version pending · 中文为准</div>';
  openModal(`${m.icon} ${m.nameZh}`,b,'<div class="sp"></div><button class="btn" onclick="closeModal()">关闭</button>');
}
function advanceBtns(m,code,r,gl){
  if(m.pending) return '<div class="muted">内容还没进来，这个模块暂时不能推进。</div>';
  if(isExpired(code,m)) return `<div class="alert a-dgr" style="margin:9px 0 0">已过期，需要重新验证。</div>
    ${canIAdvance(m,code,5)?`<button class="btn btn-pri btn-sm" style="margin-top:8px" onclick="openVerify('${m.id}','${code}',5)">重新验证</button>`:''}`;
  if(r>=gl) return '<div class="chip c-ok">已达标</div>';
  const nxt=Math.min(r+1,6), need=verifierNeededFor(m,nxt);
  const lbl={self:'自己确认',mentor:'Mentor 确认',verifier:'Verifier 验证',dual:'双人验证'}[need];
  if(!canIAdvance(m,code,nxt)){
    const why=(code===S.me.code&&nxt>=3)?'不能自己签自己':'需要 '+lbl;
    return `<div class="muted" style="margin-top:8px">下一级「${RUNGS[nxt].t}」${why}。</div>`;
  }
  return `<button class="btn btn-pri btn-sm" style="margin-top:8px"
    onclick="openVerify('${m.id}','${code}',${nxt})">推进到「${RUNGS[nxt].t}」· ${lbl}</button>`;
}

// ══ 验证（3 步）══════════════════════════════════════════════
let VF={mid:null,code:null,rung:null,result:null};
function openVerify(mid,code,rung){
  const m=moduleById(mid); VF={mid:mid,code:code,rung:rung,result:null};
  let b=`<div class="muted" style="margin-bottom:12px">${esc(teacherName(code))} · ${esc(m.nameZh)} → <b>${RUNGS[rung].t}</b></div>`;
  if(m.pass&&m.pass.length) b+=`<div class="blk blk-pass"><div class="blk-h">照这个看，不准自己加码或放水</div>
    ${m.pass.map(p=>`<div class="pc">${esc(p)}</div>`).join('')}</div>`;
  b+=`<div class="fld"><label>1 · 结果 <span class="req">*</span></label>
    <button class="opt o-ok" id="vf-pass" onclick="vfPick('pass')">✅ 达标</button>
    <button class="opt o-warn" id="vf-again" onclick="vfPick('again')">🔁 再练一次</button>
    <button class="opt o-dgr" id="vf-reteach" onclick="vfPick('reteach')">↩️ 需要重教</button></div>
    <div class="fld"><label>2 · 看到什么 <span class="req">*</span>（至少 10 字）</label>
    <textarea id="vfNote" oninput="S.dirty=true" placeholder="写你实际看到的，不是写评价。"></textarea></div>`;
  if(verifierNeededFor(m,rung)==='dual')
    b+=`<div class="alert a-warn">Critical 模块需要 <b>两个人</b>分别验证。</div>
        <div class="fld"><label>第二位验证人 <span class="req">*</span></label>
        <select id="vfCo"><option value="">— 选一位 —</option>
        ${S.teachers.filter(t=>t.id!==S.me.code&&t.id!==code)
          .map(t=>`<option value="${esc(t.id)}">${esc(t.name)} (${esc(t.id)})</option>`).join('')}</select></div>`;
  openModal('验证',b,`<div class="sp"></div><button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn btn-pri" onclick="submitVerify()">3 · 送出</button>`);
}
function vfPick(v){ VF.result=v; S.dirty=true;
  ['pass','again','reteach'].forEach(k=>el('vf-'+k).classList.toggle('on',k===v)); }
async function submitVerify(){
  const m=moduleById(VF.mid), note=(el('vfNote').value||'').trim();
  if(!VF.result){toast('请先选结果');return;}
  if(note.length<10){toast('「看到什么」至少 10 个字');return;}
  if(!S.ready||S.err){toast('读不到云端，没有任何资料被改动');return;}
  const dual=verifierNeededFor(m,VF.rung)==='dual';
  const co=el('vfCo'), coVal=co?co.value:'';
  if(dual&&!coVal){toast('Critical 模块需要第二位验证人');return;}
  const dept=(m.dept==='CORE')?deptOf(VF.code):m.dept;
  try{
    const {error}=await sb.rpc('traingo_submit_verification',{
      p_client_uid:genId('v'), p_dept:dept, p_teacher_code:VF.code,
      p_module_id:VF.mid, p_module_ver:m.ver, p_rung:VF.rung,
      p_result:VF.result, p_observed:note, p_dual:dual, p_co_verifier:coVal||null});
    if(error) throw error;
    S.dirty=false; closeModal();
    toast(VF.result==='pass'?('✓ Saved · 已推进到「'+RUNGS[VF.rung].t+'」'):'已记录 · 安排再练一次');
    await reloadAll();
  }catch(e){
    const msg=String(e.message||e);
    if(msg.indexOf('TRAINGO_SELF_VERIFY')>=0) toast('第 3 级以上不能自己签自己');
    else if(msg.indexOf('TRAINGO_NO_PERMISSION')>=0) toast('你没有这个部门的编辑权限');
    else if(msg.indexOf('TRAINGO_DUAL')>=0) toast('Critical 模块的第二位验证人不正确');
    else toast('写入失败，没有任何资料被改动');
  }
}

// ══ 验证待办 ══════════════════════════════════════════════════
function renderVerify(){
  let h=cloudGuard();
  h+='<div class="ptitle"><h2>验证</h2><span class="sub">选结果 → 写一句看到什么 → 送出</span></div>';
  const rows=[];
  S.teachers.forEach(t=>{
    if(!cohortOf(t.id))return;
    const st=statusOf(t.id);
    st.mods.forEach(m=>{
      if(m.pending)return;
      const r=rungOf(t.id,m.id), gl=goalOf(m);
      if(isExpired(t.id,m)){ if(canIAdvance(m,t.id,5))rows.push({t:t,m:m,r:5,tag:'复检'}); return; }
      if(r>=gl)return;
      const nxt=r+1;
      if(verifierNeededFor(m,nxt)==='self')return;
      if(!canIAdvance(m,t.id,nxt))return;
      rows.push({t:t,m:m,r:nxt,tag:isOverdue(t.id,m)?'逾期':''});
    });
  });
  rows.sort((a,b)=>(a.m.type==='C'?0:1)-(b.m.type==='C'?0:1));
  if(!rows.length){ h+='<div class="empty"><div class="big">✅</div>目前没有等你验证的项目。</div>';
    el('p-verify').innerHTML=h; return; }
  h+='<div class="card"><table><thead><tr><th>老师</th><th>模块</th><th>要签到</th><th></th><th></th></tr></thead><tbody>';
  rows.slice(0,60).forEach(x=>{
    h+=`<tr><td>${esc(teacherName(x.t.id))}</td><td>${typeBadge(x.m)} ${esc(x.m.nameZh)}</td>
      <td class="muted">${RUNGS[x.r].t}</td>
      <td>${x.tag?`<span class="chip ${x.tag==='逾期'?'c-dgr':'c-warn'}">${x.tag}</span>`:''}</td>
      <td><button class="btn btn-sm btn-pri" onclick="openVerify('${x.m.id}','${x.t.id}',${x.r})">验证</button></td></tr>`;
  });
  h+='</tbody></table></div>';
  el('p-verify').innerHTML=h;
}

function renderMatrix(){

  const risk=mods.filter(m=>m.type==='C')
    .map(m=>({m:m,n:S.teachers.filter(t=>rungOf(t.id,m.id)>=goalOf(m)&&!isExpired(t.id,m)).length}))

    risk.forEach(x=>{h+=`<div style="padding:6px 0">${esc(x.m.nameZh)} — 目前只有 <b>${x.n}</b> 人</div>`;});

async function saveCohort(id){
  if(!S.ready||S.err){toast('读不到云端，没有任何资料被改动');return;}
  const mentee=el('cMentee').value, mentor=el('cMentor').value, dept=el('cDept').value;

  const row={dept:dept,mentee_code:mentee,mentor_code:mentor,
    start_date:el('cStart').value,cohort_type:el('cType').value};
  if(id&&el('cStatus')) row.status=el('cStatus').value;
  try{
    let error;
    if(id){ ({error}=await sb.from('traingo_cohort').update(row).eq('id',id)); }
    else  { row.client_uid=genId('c'); ({error}=await sb.from('traingo_cohort').insert(row)); }
    if(error) throw error;
    S.dirty=false; closeModal(); toast('✓ Saved'); await reloadAll();
  }catch(e){ toast('写入失败，没有任何资料被改动'); }
}
async function archiveCohort(id){
  const c=S.cohorts.find(x=>x.id===id); if(!c)return;
  if(!confirm('把这条梯队 Archive？训练纪录会留着。'))return;
  const prev=c.status;
  try{
    const {error}=await sb.from('traingo_cohort').update({status:'archived'}).eq('id',id);
    if(error)throw error;
    S.dirty=false; closeModal(); await reloadAll();
    toast('已 Archive','Undo',async()=>{
      await sb.from('traingo_cohort').update({status:prev}).eq('id',id);
      await reloadAll(); toast('已还原');
    });
  }catch(e){ toast('操作失败，没有任何资料被改动'); }
}

// ══ Export / Import ═══════════════════════════════════════════
function stamp(){const d=new Date();
  return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}_${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}`;}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=name;a.click();URL.revokeObjectURL(a.href);}
function doExport(){
  const d={meta:{system:'TrainGo',version:APP_VERSION,arch:ARCH_VERSION,standard:STD_VERSION,
    exportTime:new Date().toISOString(),
    itemCount:S.cohorts.length+Object.keys(S.progress).length+S.verifs.length},
    cohorts:S.cohorts,progress:S.progress,verifications:S.verifs};
  dl(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),'TrainGo_'+stamp()+'.json');
  toast('✓ 已汇出');
}
function doExportCsv(){
  const rows=[['老师代号','老师','部门','模块','类型','梯级','结果','验证人','第二验证人','看到什么','时间']];
  S.verifs.forEach(v=>{
    const m=moduleById(v.module_id)||{nameZh:v.module_id,type:''};
    rows.push([v.teacher_code,teacherName(v.teacher_code),v.dept,m.nameZh,m.type,
      RUNGS[v.rung]?RUNGS[v.rung].t:v.rung,v.result,v.verifier_code,v.co_verifier_code||'',
      v.observed,v.verified_at]);
  });
  dl(new Blob(['﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\n')],
    {type:'text/csv;charset=utf-8'}),'TrainGo_验证纪录_'+stamp()+'.csv');
  toast('✓ 已汇出 CSV');
}
function doImport(ev){
  const f=ev.target.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=e=>{
    let d; try{ d=JSON.parse(e.target.result); }
    catch(err){ toast('档案格式错误，资料没有改动'); ev.target.value=''; return; }
    const inc=d.cohorts||[]; let nw=0,up=0,un=0;
    inc.forEach(c=>{ const ex=S.cohorts.find(x=>x.client_uid===c.client_uid);
      if(!ex)nw++;
      else if(ex.dept!==c.dept||ex.mentee_code!==c.mentee_code||ex.status!==c.status)up++;
      else un++; });
    window._impData=inc;
    openModal('汇入预览（永远 Merge，不覆盖）',
      `<div class="mg-l">档案：<span class="mg-v">${esc(f.name)}</span><br>
       梯队：<b>${nw}</b> new · <b>${up}</b> update · <b>${un}</b> unchanged<br>
       进度与验证：<span class="mg-v">不汇入</span>（只能由验证流程产生，保证证据链）</div>
       <div class="alert a-info" style="margin-top:10px">执行前会先自动汇出一份现况备份。</div>`,
      `<div class="sp"></div><button class="btn" onclick="cancelImport()">Cancel</button>
       <button class="btn btn-pri" onclick="runImport()">确认汇入</button>`);
  };
  rd.readAsText(f);
}
function cancelImport(){ S.dirty=false; closeModal(); el('impFile').value=''; }
async function runImport(){
  if(!S.ready||S.err){toast('读不到云端，没有任何资料被改动');return;}
  doExport();
  const inc=window._impData||[]; let n=0;
  try{
    for(const c of inc){
      if(!c.client_uid||!canEditDept(c.dept))continue;
      const ex=S.cohorts.find(x=>x.client_uid===c.client_uid);
      const row={dept:c.dept,mentee_code:c.mentee_code,mentor_code:c.mentor_code,
        start_date:String(c.start_date).slice(0,10),cohort_type:c.cohort_type||'new',
        status:c.status||'active',client_uid:c.client_uid};
      let error;
      if(ex){ ({error}=await sb.from('traingo_cohort').update(row).eq('id',ex.id)); }
      else  { ({error}=await sb.from('traingo_cohort').insert(row)); }
      if(error) throw error;
      n++;
    }
    S.dirty=false; closeModal(); el('impFile').value='';
    toast('✓ 已汇入 '+n+' 笔（Merge）'); await reloadAll();
  }catch(e){
    S.dirty=false; closeModal(); el('impFile').value='';
    toast('汇入中断，已写入的保留，请用刚才的备份比对'); await reloadAll();
  }
}

// ══ Modal · 键盘 ══════════════════════════════════════════════
function openModal(title,body,foot){
  el('mTitle').textContent=title; el('mBody').innerHTML=body;
  el('mFoot').innerHTML=foot||''; el('mFoot').style.display=foot?'flex':'none';
  el('ov').classList.add('on'); el('modal').classList.add('on');
}
function closeModal(){
  if(S.dirty&&!confirm('Unsaved changes. Discard?'))return;
  S.dirty=false;
  el('ov').classList.remove('on'); el('modal').classList.remove('on');
}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape') closeModal();
  if((e.ctrlKey||e.metaKey)&&String(e.key).toLowerCase()==='s'){ e.preventDefault();
    const b=document.querySelector('#mFoot .btn-pri');
    if(b)b.click(); else toast('本系统即时储存，不需手动存档'); }
  if(e.key==='Enter'&&el('modal').classList.contains('on')&&e.target.tagName!=='TEXTAREA'){
    const b=document.querySelector('#mFoot .btn-pri'); if(b){e.preventDefault();b.click();} }
});
window.addEventListener('beforeunload',function(e){ if(S.dirty){e.preventDefault();e.returnValue='';} });

boot();
</script>
</body>
</html>
