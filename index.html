<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<title>Academee — Management Platform</title>
<style>
  :root{
    --bg:#FAF7F2;--sur:#FFFFFF;--bdr:rgba(0,0,0,.08);
    --txt:#2A1F1A;--mut:#7A6A5E;--hint:#A89889;
    --acc:#5C1010;--warn:#BA7517;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
    background:var(--bg);color:var(--txt);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}

  header{padding:24px 36px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(0,0,0,.1)}
  .brand{display:flex;align-items:baseline;gap:14px}
  .brand-name{font-size:22px;font-weight:600;letter-spacing:.5px}
  .brand-tag{font-size:11px;font-weight:400;opacity:.7;text-transform:uppercase;letter-spacing:1.2px}
  .header-meta{font-size:11px;opacity:.65;font-variant-numeric:tabular-nums}

  main{flex:1;max-width:1200px;margin:0 auto;padding:28px 36px;width:100%}

  .section{margin-bottom:24px}
  .section-hdr{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .section-dot{width:8px;height:8px;border-radius:50%}
  .section-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--mut)}
  .section-count{font-size:10px;color:var(--hint)}

  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .app-card{background:var(--sur);border:1px solid var(--bdr);border-radius:10px;padding:14px 16px;text-decoration:none;color:inherit;display:flex;align-items:center;justify-content:space-between;transition:transform .12s,box-shadow .12s;position:relative;overflow:hidden;cursor:pointer}
  .app-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.06);border-color:rgba(0,0,0,.14)}
  .app-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--card-color,var(--acc))}
  .app-name{font-size:15px;font-weight:600;letter-spacing:-.1px}
  .app-ver{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;background:rgba(249,203,66,.15);color:var(--warn);white-space:nowrap}

  footer{padding:18px 36px;border-top:1px solid var(--bdr);font-size:10px;color:var(--hint);display:flex;justify-content:space-between;align-items:center;background:var(--sur)}
  footer a{color:var(--mut);text-decoration:none}
  footer a:hover{color:var(--acc)}

  .empty-msg{text-align:center;padding:40px;color:var(--hint);font-size:12px}

  /* ── 版本核对（管理层专用） ─────────────────────────────── */
  .header-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:flex-end}
  .btn-vercheck{min-height:44px;padding:0 16px;border:1px solid rgba(255,255,255,.38);
    background:transparent;color:#fff;border-radius:8px;font-family:inherit;font-size:12px;
    font-weight:600;letter-spacing:.3px;cursor:pointer;white-space:nowrap}
  .btn-vercheck:hover{background:rgba(255,255,255,.14)}
  .btn-vercheck:disabled{opacity:.45;cursor:default}

  /* ── 平台层登出（2026-09-13）──────────────────────────────
     Owner 裁定：各系统一律不得有登出，整个平台只留这一颗。
     在这之前平台首页根本没有出口 —— 共用电脑上，上一个人的 session 会一直留著。
     这颗一定要在各系统拿掉登出之前先上线，否则会有一段谁也登不出去的空窗期。 */
  .btn-logout{min-height:44px;padding:0 16px;border:1px solid rgba(255,255,255,.38);
    background:transparent;color:#fff;border-radius:8px;font-family:inherit;font-size:12px;
    font-weight:600;letter-spacing:.3px;cursor:pointer;white-space:nowrap}
  .btn-logout:hover{background:rgba(255,255,255,.14)}
  .btn-logout:disabled{opacity:.45;cursor:default}

  .ver-report{max-width:1200px;margin:18px auto -8px;padding:0 36px;width:100%}
  .ver-box{background:var(--sur);border:1px solid var(--bdr);border-radius:10px;padding:14px 16px;font-size:12px;line-height:1.7}
  .ver-box b{font-size:13px}
  .ver-sum{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px;font-variant-numeric:tabular-nums}
  .ver-sum span{white-space:nowrap}
  .ver-list{margin-top:10px;padding-top:10px;border-top:1px solid var(--bdr);color:var(--mut)}
  .ver-list div{margin-top:3px}
  .vc-ok{color:#0F6E56}.vc-bad{color:#A32D2D;font-weight:600}.vc-warn{color:var(--warn)}

  /* 卡片上的版本徽章三态 */
  .app-ver.v-ok{background:rgba(15,110,86,.12);color:#0F6E56}
  .app-ver.v-bad{background:rgba(163,45,45,.12);color:#A32D2D}
  .app-ver.v-warn{background:rgba(186,117,23,.15);color:var(--warn)}
  .app-ver.v-run{background:rgba(0,0,0,.06);color:var(--hint)}

  @media(max-width:600px){
    header{padding:18px 20px}
    main{padding:24px 20px}
    .brand-name{font-size:18px}
    .grid{grid-template-columns:1fr 1fr;gap:10px}
  }

  #auth-screen{display:flex;justify-content:center;align-items:center;min-height:100vh;background:var(--bg)}
  #auth-box{background:var(--sur);border:1px solid var(--bdr);border-radius:12px;padding:32px 28px;width:340px;max-width:90vw;text-align:center}
  #auth-box h2{font-size:18px;font-weight:600;margin-bottom:4px;color:var(--acc)}
  #auth-box p{font-size:12px;color:var(--mut);margin-bottom:20px}
  #auth-box input{width:100%;padding:10px 12px;border:1px solid var(--bdr);border-radius:8px;font-size:13px;margin-bottom:10px;font-family:inherit}
  #auth-box button{width:100%;padding:10px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;margin-bottom:6px}
  .btn-login{background:var(--acc);color:#fff}
  .btn-magic{background:var(--bg);color:var(--mut);border:1px solid var(--bdr)!important}
  #auth-err{color:#A32D2D;font-size:11px;min-height:16px;margin-bottom:8px}
  #app-wrap{display:none;flex-direction:column;min-height:100vh}
</style>
</head>
<body>

<div id="auth-screen">
  <div id="auth-box">
    <h2>Academee</h2>
    <p>Management Platform · Login</p>
    <div id="auth-err"></div>
    <input type="email" id="auth-email" placeholder="Email">
    <input type="password" id="auth-pass" placeholder="Password">
    <button class="btn-login" onclick="doLogin()">Sign In</button>
    <div style="display:flex;align-items:center;gap:12px;margin:4px 0"><div style="flex:1;height:1px;background:var(--bdr)"></div><span style="font-size:12px;color:var(--mut)">or</span><div style="flex:1;height:1px;background:var(--bdr)"></div></div>
    <button class="btn-magic" onclick="doMagicLink()">Send Magic Link</button>
  </div>
</div>

<div id="app-wrap">
<header>
  <div class="brand">
    <span class="brand-name">Academee</span>
    <span class="brand-tag">Management Platform</span>
  </div>
  <div class="header-right">
    <button class="btn-vercheck" id="btn-vercheck" onclick="runVerCheck()" hidden>版本核对</button>
    <div class="header-meta" id="header-meta"></div>
    <button class="btn-logout" id="btn-logout" onclick="doLogout()">登出</button>
  </div>
</header>
<div class="ver-report" id="ver-report" hidden></div>
<main id="main-content"></main>
<footer>
  <div>Academee Education Centre · Muar, Johor</div>
  <div>Platform Architecture · <a href="https://github.com/" target="_blank">GitHub</a></div>
</footer>
</div>

async function doLogin(){
  const email=document.getElementById('auth-email').value.trim();
  const pass=document.getElementById('auth-pass').value;
  document.getElementById('auth-err').textContent='';
  if(!email||!pass){document.getElementById('auth-err').textContent='Enter email and password';return;}
  const{error}=await _sb.auth.signInWithPassword({email,password:pass});
  if(error){document.getElementById('auth-err').textContent=error.message;return;}
  showApp();
}
async function doMagicLink(){

/* 平台层登出 —— 全 Academee 唯一的出口（2026-09-13 Owner 裁定）。

async function doLogout(){

  const b=document.getElementById('btn-logout');
  b.disabled=true; b.textContent='登出中…';

  catch(e){ console.warn('signOut failed:',e); }

}

// 登入者显示名 —— 共用电脑上要一眼看得出「现在是谁」，不然登出按钮没有意义。
let WHO='';

async function showApp(){
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('app-wrap').style.display='flex';
  updateClock();

  await loadVersionManifests();

  // Fetch user's visible systems via my_systems()
  const{data:systems,error}=await _sb.rpc('my_systems');
  if(error){console.error('my_systems error:',error);return;}

  // Filter to only LIVE systems the user can see
  const visible=(systems||[]).filter(s=>LIVE[s.code]);

  // ── 诊断 (2026-07-13) ──────────────────────────────────────────────
  // 卡片只在 my_systems() 返回的 code 命中 LIVE 的 key 时才渲染。
  // code 对不上 = 卡片静默消失, 零报错。以下两条把静默变成可见。
  const granted = new Set((systems||[]).map(s=>s.code));
  const unknown = (systems||[]).filter(s=>!LIVE[s.code]).map(s=>s.code);
  const missing = Object.keys(LIVE).filter(c=>!granted.has(c));
  if(unknown.length) console.warn('[index] my_systems() 返回了 LIVE 里没有的 code (未建卡片):', unknown);
  // 多部门系统(如 MiscGo 的 3 个部门码)本来就不会每个人都齐全,
  // 只报「整个系统都拿不到」的,避免假警报。
  const missingNames=[...new Set(missing.map(c=>LIVE[c].name))]
    .filter(n=>!Object.keys(LIVE).some(c=>LIVE[c].name===n&&granted.has(c)));
  if(missingNames.length) console.warn('[index] LIVE 里有卡片但你完全没有权限 (卡片不会显示):', missingNames);
  // LIVE 的 group 若不在 GROUP_ORDER 里,卡片会静默消失 —— 这是设定错误,不是权限问题。
  const orphanGroups=[...new Set(Object.values(LIVE).map(x=>x.group))].filter(g=>GROUP_ORDER.indexOf(g)<0);
  if(orphanGroups.length) console.error('[index] 这些 group 不在 GROUP_ORDER 里,卡片不会显示:', orphanGroups);
  // ──────────────────────────────────────────────────────────────────

  // Group by section
  const groups={};
  const seen=new Set();   // 同一个系统若有多个部门码,只渲染一张卡片
  visible.forEach(s=>{
    const info=LIVE[s.code];
    if(seen.has(info.name)) return;
    seen.add(info.name);
    const g=info.group;
    if(!groups[g]) groups[g]=[];
    groups[g].push({...info,code:s.code,can_edit:s.can_edit});
  });

  // Render
  const main=document.getElementById('main-content');
  if(!visible.length){
    main.innerHTML='<div class="empty-msg">No systems available for your role.</div>';
    return;
  }

  let html='';
  GROUP_ORDER.forEach(g=>{
    const items=groups[g];
    if(!items||!items.length) return;
    items.sort((a,b)=>a.order-b.order);
    const layerCode=g.split('—')[0].trim().split(' ')[0];
    const dotColor=LAYER_COLORS[layerCode]||'#5C1010';
    html+=`<div class="section">
      <div class="section-hdr">
        <div class="section-dot" style="background:${dotColor}"></div>
        <span class="section-title">${g}</span>
        <span class="section-count">${items.length} system${items.length>1?'s':''}</span>
      </div>
      <div class="grid">`;
    items.forEach(s=>{
      // data-* 是给「版本核对」用的：核对时要知道这张卡对应哪个档、卡片宣称第几版。
      const v=cardVersion(s);
      html+=`<a class="app-card" style="--card-color:${s.color}" href="${cardHref(s.href,v)}"
         data-name="${s.name}" data-href="${s.href}" data-ver="${v.label}" data-fallback="${s.ver||''}">
        <span class="app-name">${s.name}</span>${v.label?`<span class="app-ver${v.verified?'':' v-warn'}">${v.label}${v.verified?'':' · 未核实'}</span>`:''}
      </a>`;
    });
    html+=`</div></div>`;
  });
  main.innerHTML=html;

  // 版本核对按钮：只给管理层
  try{
    const{data:{user}}=await _sb.auth.getUser();
    if(user){
      const{data:um}=await _sb.from('users_meta').select('role,display_name').eq('user_id',user.id).maybeSingle();
      if(um && VERCHECK_ROLES.indexOf(um.role)>=0) document.getElementById('btn-vercheck').hidden=false;
      if(um && um.display_name){ WHO=um.display_name; updateClock(); }
    }
  }catch(e){ console.warn('[index] 读不到角色，版本核对按钮不显示:',e); }
}

/* B2 版本核对：只有管理员主动点选时才下载系统 HTML；比较清单的版本、来源、SHA、位元组大小。 */

const VERCHECK_ROLES=['OWNER','TOP_MGMT','ADMIN'];
let VERSION_MANIFESTS={};
async function loadVersionManifests(){
  const sources=[['main','/versions.json'],['tools','/academee-tools/versions.json']];
  const result=await Promise.all(sources.map(async ([key,url])=>{
    try{
      const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);
      const j=await r.json();
      if(j.schema!==1||!j.files||typeof j.files!=='object'||typeof j.commit!=='string')throw Error('Invalid manifest');
      return [key,j];
    }catch(e){console.warn('[versions] '+key+' unavailable',e);return [key,null];}
  }));
  VERSION_MANIFESTS=Object.fromEntries(result);
}
function manifestEntry(href){
  const u=new URL(href,location.href);
  if(u.origin!==location.origin)return null;
  const tools=u.pathname.startsWith('/academee-tools/');
  const key=decodeURIComponent(u.pathname.slice(tools?'/academee-tools/'.length:1));
  const manifest=VERSION_MANIFESTS[tools?'tools':'main'];
  return manifest?.files?.[key]||null;
}
function cardVersion(s){
  const e=manifestEntry(s.href);
  const valid=e&&['app_version','title'].includes(e.source)&&Number.isInteger(e.version);
  return {label:valid?'v'+e.version:(s.ver||''),verified:!!valid&&e.source==='app_version',
    sha:valid&&/^[a-f0-9]{64}$/.test(e.sha256)?e.sha256.slice(0,12):null};
}
function cardHref(href,v){
  const u=new URL(href,location.href);
  u.searchParams.set('v',v.sha||v.label||'fallback');
  return u.pathname+u.search+u.hash;
}
function liveVersion(bytes){
  let txt=new TextDecoder().decode(bytes);
  txt=txt.replace(/<!--[\s\S]*?-->|\/\*[\s\S]*?\*\//g,'');
  txt=txt.split('\n').filter(line=>!line.trimStart().startsWith('//')).join('\n');
  const nums=[...txt.matchAll(/^\s*(?:const|let|var)\s+APP_VERSION\s*=\s*['"]?v?(\d+)['"]?(?=[\s;,)]|$)/gm)].map(m=>+m[1]);
  const unique=[...new Set(nums)];
  if(unique.length>1)return {source:'conflict',version:null};
  if(unique.length===1)return {source:'app_version',version:unique[0]};
  const t=txt.match(/<title\b[^>]*>([\s\S]*?)<\/title>/i);
  const v=t?.[1]?.match(/\bv(\d{1,4})\b/i);
  return v?{source:'title',version:+v[1]}:{source:'none',version:null};
}


function vcBadge(card){
  let b=card.querySelector('.app-ver');
  if(!b){b=document.createElement('span');b.className='app-ver';card.appendChild(b);}
  return b;
}
async function runVerCheck(){
  const btn=document.getElementById('btn-vercheck'),box=document.getElementById('ver-report');
  const cards=[...document.querySelectorAll('.app-card[data-href]')];
  btn.disabled=true;box.hidden=false;
  let ok=0,bad=0,unknown=0;const notes=[];
  try{
    await loadVersionManifests();
    for(const c of cards){
      const e=manifestEntry(c.dataset.href),b=vcBadge(c),name=c.dataset.name||'?';
      if(!e||e.source!=='app_version'){
        unknown++;b.className='app-ver v-warn';b.textContent=(c.dataset.ver||'?')+' · 未核实';
        notes.push(name+': '+(e?.source||'清单缺失'));continue;
      }
      try{
        const u=new URL(c.dataset.href,location.href);
        u.searchParams.set('vc',Date.now().toString());
        const r=await fetch(u.href,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);
        const buf=await r.arrayBuffer(),bytes=new Uint8Array(buf),actual=liveVersion(bytes);
        const sha=[...new Uint8Array(await crypto.subtle.digest('SHA-256',buf))].map(b=>b.toString(16).padStart(2,'0')).join('');
        if(actual.version===e.version&&actual.source===e.source&&sha===e.sha256&&bytes.length===e.bytes){
          ok++;b.className='app-ver v-ok';b.textContent='v'+e.version;
        }else{
          bad++;b.className='app-ver v-bad';b.textContent='v'+e.version+' · 不一致';
          notes.push(name+': 清单 v'+e.version+'，线上 v'+(actual.version??'?')+'，'+(sha===e.sha256?'版本或来源不同':'内容 SHA 不同'));
        }
      }catch(err){unknown++;b.className='app-ver v-warn';b.textContent='未核实';notes.push(name+': '+err.message);}
    }
    const refs=['main','tools'].map(k=>{const m=VERSION_MANIFESTS[k];return k+': '+(m?m.commit.slice(0,7)+' '+m.generated_at:'unavailable')}).join(' | ');
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    box.innerHTML='<div class="ver-box"><b>版本核对</b> · 一致 '+ok+' · 不一致 '+bad+' · 未核实 '+unknown+'<div>'+esc(refs)+'</div>'+
      notes.map(n=>'<div>'+esc(n)+'</div>').join('')+'</div>';
  }finally{btn.disabled=false;}
}
function updateClock(){
  const d=new Date();
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const h=d.getHours(),m=d.getMinutes();
  const ampm=h>=12?'PM':'AM';
  const h12=h%12||12;
  const mm=(m<10?'0':'')+m;
  document.getElementById('header-meta').textContent=
    (WHO?WHO+' · ':'')+days[d.getDay()]+' · '+d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear()+' · '+h12+':'+mm+' '+ampm;
}
setInterval(updateClock,30000);
(async()=>{
  const{data:{session}}=await _sb.auth.getSession();
  if(session) showApp();
