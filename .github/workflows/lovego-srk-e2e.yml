name: LoveGo SRK E2E
on:
  workflow_dispatch:
  push:
    paths:
      - 'OPR/LoveGo_v5*_srk_*.js'
      - 'OPR/LoveGo_v6*_srk_*.js'
      - 'OPR/LoveGo_v61_e2e_uat*'
      - '.github/workflows/lovego-srk-e2e.yml'
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Start local static server
        run: |
          python3 -m http.server 8000 >/tmp/lovego-http.log 2>&1 &
          sleep 2
      - name: Run browser UAT
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=10000 --dump-dom http://127.0.0.1:8000/OPR/LoveGo_v61_e2e_uat.html > /tmp/lovego-dom.html
          sed -n '/<pre id="out"/,/<\/pre>/p' /tmp/lovego-dom.html
          grep -q '<pre id="out" class="ok">PASS' /tmp/lovego-dom.html
