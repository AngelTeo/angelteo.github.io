name: LoveGo Canonicalize
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Canonicalize LoveGo filenames
        run: |
          git mv OPR/LoveGo_v39_part1.js OPR/lovego-cloud.js
          git mv OPR/LoveGo_v39_part2.js OPR/lovego-model.js
          git mv OPR/LoveGo_v39_part3.js OPR/lovego-review.js
          git mv OPR/LoveGo_v39_part4.js OPR/lovego-assignments.js
          git mv OPR/LoveGo_v39_part5.js OPR/lovego-management.js
          if [ -f OPR/LoveGo_v61_srk_evidence_plug_adapter.js ]; then git mv OPR/LoveGo_v61_srk_evidence_plug_adapter.js OPR/lovego-ptm-evidence.js; fi
          rm -f OPR/LoveGo_v39_part6.js OPR/LoveGo_v61_e2e_uat_bootstrap.js OPR/LoveGo_v61_e2e_uat_runner.js OPR/LoveGo_v43_report_authority_ui.js OPR/LoveGo_v55_srk_registry_cloud_guard.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('OPR/LoveGo.html')
          s=p.read_text()
          repl={
            'LoveGo v39':'LoveGo',
            '<span class="ver">v39</span>':'<span class="ver">LIVE</span>',
            '版本：v39':'版本：LIVE',
            'lovego_v39':'lovego',
            'LoveGo_v39_part1.js':'lovego-cloud.js',
            'LoveGo_v39_part2.js':'lovego-model.js',
            'LoveGo_v39_part3.js':'lovego-review.js',
            'LoveGo_v39_part4.js':'lovego-assignments.js',
            'LoveGo_v39_part5.js':'lovego-management.js'
          }
          for a,b in repl.items(): s=s.replace(a,b)
          p.write_text(s)
          p=Path('OPR/_legacy/lovego/LoveGo_v60_srk_end_to_end_guard.js')
          if p.exists():
            s=p.read_text().replace("LoveGo_v61_srk_evidence_plug_adapter.js","lovego-ptm-evidence.js")
            p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "LoveGo: canonical production filenames"
          git push
